            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --accent-color: #059669;
            --accent-hover: #047857;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {

            margin: 0;
            padding: 0;
        }

        body {

            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;

        header {

            -webkit-text-fill-color: transparent;

        }

        .header-title p {

            color: var(--text-secondary);
        }

        .btn-theme {

            border: 1px solid var(--border-color);

            color: var(--text-secondary);
            font-weight: 600;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .stat-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .controls-card {

            border: 1px solid var(--border-color);
            border-radius: 14px;

            align-items: center;
            box-shadow: var(--card-shadow);

            flex: 1;
            min-width: 260px;
        }

            width: 100%;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.6rem 1rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;

        }

        .select-control {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.6rem 1rem;
            color: var(--text-primary);
            font-size: 0.88rem;
            outline: none;
            cursor: pointer;
        }

        .table-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            text-align: left;
        }

        thead {
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);

        th {

            border-bottom: 1px solid var(--border-color);

        }

            color: var(--text-primary);

            align-items: center;
            gap: 0.35rem;

        .cat-tag strong {
            color: var(--accent-color);
            font-weight: 700;
        }

        .pagination-bar {

            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            font-size: 0.85rem;
            color: var(--text-secondary);

            gap: 0.5rem;
            align-items: center;

        }

        function toggleTheme() {
            if (document.body.hasAttribute('data-theme')) {
                document.body.removeAttribute('data-theme');
                localStorage.setItem('theme', 'dark');
                document.getElementById('theme-icon').innerText = '☀️';
                document.getElementById('theme-text').innerText = '明亮模式';
            } else {
                document.body.setAttribute('data-theme', 'light');

                document.getElementById('theme-icon').innerText = '🌙';
                document.getElementById('theme-text').innerText = '深色模式';
            }
        }

        function onSearchChange() {
            currentSearch = document.getElementById('search-input').value.trim().toLowerCase();
            applyFilters();
        }

        function onFilterChange() {
            currentCatFilter = document.getElementById('category-filter').value;
            applyFilters();
        }

        function onSortChange() {
            currentSort = document.getElementById('sort-select').value;
            applyFilters();
        }

        function applyFilters() {
            filteredData = rawKeywordsData.filter(item => {
                const matchesKw = item.keyword.toLowerCase().includes(currentSearch);
                const matchesCats = Object.keys(item.categories).some(c => c.toLowerCase().includes(currentSearch));
                const matchesSearch = matchesKw || matchesCats;

                let matchesCatFilter = true;
                if (currentCatFilter) {
                    matchesCatFilter = item.categories.hasOwnProperty(currentCatFilter);
                }

                return matchesSearch && matchesCatFilter;
            });

            filteredData.sort((a, b) => {
                if (currentSort === 'freq-desc') return b.count - a.count;
                if (currentSort === 'freq-asc') return a.count - b.count;
                if (currentSort === 'name-asc') return a.keyword.localeCompare(b.keyword);
                return 0;
            });

            currentPage = 1;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('keywords-tbody');
            tbody.innerHTML = '';

            const total = filteredData.length;
            const totalPages = Math.ceil(total / pageSize) || 1;

            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const startIdx = (currentPage - 1) * pageSize;
            const endIdx = Math.min(startIdx + pageSize, total);

            document.getElementById('total-filtered').innerText = total;
            document.getElementById('page-start').innerText = total > 0 ? startIdx + 1 : 0;
            document.getElementById('page-end').innerText = endIdx;
            document.getElementById('page-current-info').innerText = `頁數 ${currentPage} / ${totalPages}`;

            document.getElementById('btn-prev').disabled = (currentPage <= 1);
            document.getElementById('btn-next').disabled = (currentPage >= totalPages);

            if (total === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 2.5rem; color: var(--text-muted);">無符合條件的標準關鍵字</td></tr>';
                return;
            }

            const pageData = filteredData.slice(startIdx, endIdx);
            pageData.forEach((item, idx) => {
                const row = document.createElement('tr');

                let catTagsHtml = '';
                for (const [catName, catCount] of Object.entries(item.categories)) {
                    catTagsHtml += `
                        <span class="cat-tag">
                            ${catName} <strong>(${catCount})</strong>
                        </span>
                    `;
                }

                row.innerHTML = `
                    <td style="color: var(--text-muted); font-weight: 600;">${startIdx + idx + 1}</td>
                    <td><span class="kw-name">${item.keyword}</span></td>
                    <td><span class="kw-count-badge">${item.count} 次</span></td>
                    <td><div class="cat-tag-list">${catTagsHtml}</div></td>
                `;
                tbody.appendChild(row);
            });
        }

        function changePage(delta) {
            currentPage += delta;
            renderTable();
        }

        applyFilters();
    </script>
