09年8月17日</p>\n<p>現勘人員：楊俊朗，傅志男</p>\n<p>現勘地點：甲仙鄉小林村</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 聽到消息說小林村搶通，就和俊朗碰碰運氣看是否能進到裡面做紀錄，於是十點半從高雄左右出發。</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 路線經過美濃月光山隧道往杉林、甲仙。首先經過0813公路被土石流淹沒數百公尺的份尾路段，該路段已經搶通，只是最好還是高底盤的車，不然就會和我的愛車一樣～石頭一直摩擦車的底盤，對於愛車十分抱歉！</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 過了甲仙市區，往小林村路途約13公里，但一出甲仙市區沒多久就碰上小客車無法通過的路段，只好步行前進看能走多遠就走多遠！還好，山上的人們相當友善，潘大哥是維修往小林村的橋樑工人，好心的在我們一程。到離小林村約3、4公里處，又有一台車讓我們接駁，真幸運，一路直達小林村！</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 下了車，眼前一片平坦的土石，只剩二棟房子在樹林的山腳下，當然就是小林村滅村的地勢最南、最高的了。進村的路已經已經被淹沒，居民就在可以看著沒有房舍的故鄉的公路上燒金紙，希望親友們一路好走。</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 我們開始走進村莊，除了搖頭、只能拍照！俊朗說這次水災讓他晚上會做惡夢！而我，還是搖頭和沈默，加上心都涼了！這個村莊已經沒有路基、也沒有房舍，我們只是隨意亂走，路上遇到一位當地村民，他態度很平靜的回答我們的問題、指著他還能告訴我們村莊範圍，沒有悲傷的面容，也許是悲傷到了極點，覺得人生最壞也不過如此吧！</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 我們再試著走往村莊的對面方向，想要看看村莊後面的山容如何，果然，除了村莊後面的山丘以外，更後面的高山光禿一片。那位村民說：有目擊者看到當天是後面高山突然崩落，然後衝擊村落後面的山丘，接著土石就撲天蓋地而來，村莊就滅頂了！</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 烈日下，我們走到村莊北段時，本打算往回走，但俊朗說：要不要上到崩塌的山丘背脊上？所以兩人就開始找沒路的合適地點開始爬上去。看起來不高的崩塌背脊，因為沒路又大石頭、倒樹散佈，加上炙熱的陽光，實在也夠累人的。俊朗體能好先上到頂，我上到背脊時，眼前出現的是更後面的高山崩壁壯闊、形勢攝人，令人不寒而慄！時間不早了，我們開始下村莊，這時開始下起了毛毛雨，心理也毛毛的，深怕大雨一來後果不堪設想，但俊朗仍氣定神閒。</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 小林村最後的巡禮時，老天開始磅礡大雨，我們趕緊回到公路，剛才都忘了我們還要解決交通問題呢！還好，最後一輛小發財車剛好要走，我們猛搖手趕上了！雖然一路淋雨，但起碼不必步行。到了自己的車，開始擔心大雨會不會讓回家的路中斷？果不其然，份尾路段我的車已經無法通行，只好再找甲仙～南化～玉井上高速公路，運氣好、路可行。但一路上的雨，讓人擔心，山裡面的災民可能又要面臨斷路的危機！</p>\n<p>&nbsp;</p>\n<p>的確，這幾年來，就算是賀柏、納莉颱風來也不能和這次的災害比。納莉2001年9月來時，大家就說是有史以來，現在呢？人禍造成的山崩土解、全球暖化，未來必定會有更大的災禍！</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 記得莫拉克颱風來之前，我們的官員說再不下雨就要缺水了，希望天降甘霖，現在呢？台灣已經成為「旱澇交煎」的國度了！</p>\n<p>&nbsp;</p>\n<p>志男2009/8/18&nbsp; 01：01</p>\n<p>&nbsp;</p>\n<p><img alt height=\"227\" src=\"/sites/cet-taiwan.org/files/813-23.jpg\" width=\"341\" loading=\"lazy\"></p>\n<p>21號省道份尾路段已經搶通。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"224\" src=\"/sites/cet-taiwan.org/files/813-24.jpg\" width=\"339\" loading=\"lazy\"></p>\n<p>潘大哥熱心載我們一程，窗外盡是被土石流沖毀的路。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"228\" src=\"/sites/cet-taiwan.org/files/813-25.jpg\" width=\"346\" loading=\"lazy\"></p>\n<p>小林部落全貌，只遺留一片土石，前方為楠梓仙溪，右方則為土石崩落的光禿景象。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"244\" src=\"/sites/cet-taiwan.org/files/813-26.jpg\" width=\"362\" loading=\"lazy\"></p>\n<p>從小林部落臨溪處往村落看，可以看見除了村落後方的大坍方以外，後面的高山崩落得更嚴重。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"231\" src=\"/sites/cet-taiwan.org/files/813.-27.jpg\" width=\"339\" loading=\"lazy\"></p>\n<p>俊朗提議攀上崩山的脊背，仰望浩大的崩壁。（黃圈中是俊朗）</p>\n<p>&nbsp;</p>\n<p><img alt height=\"234\" src=\"/sites/cet-taiwan.org/files/813-28.jpg\" width=\"335\" loading=\"lazy\"></p>\n<p>開始往上爬。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"222\" src=\"/sites/cet-taiwan.org/files/813-29.jpg\" width=\"333\" loading=\"lazy\"><br>\n<p>離村落最近的所以後方山丘幾乎全崩，造成全部落被淹沒，僅剩圖右方還有植被下的二間房舍。</p></p>\n<p>&nbsp;</p>\n<p><img alt height=\"500\" src=\"/sites/cet-taiwan.org/files/813-30.jpg\" width=\"333\" loading=\"lazy\"><br>\n<p>吁，亂石、倒樹散佈整座山丘。</p></p>\n<p>&nbsp;</p>\n<p><img alt height=\"229\" src=\"/sites/cet-taiwan.org/files/813-31.jpg\" width=\"341\" loading=\"lazy\"><br>\n<p>爬到三分之二高了。</p></p>\n<p>&nbsp;</p>\n<p><img alt height=\"233\" src=\"/sites/cet-taiwan.org/files/813-32.jpg\" width=\"351\" loading=\"lazy\"></p>\n<p>上到山脊前往村落望去的景象。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"239\" src=\"/sites/cet-taiwan.org/files/813-33.jpg\" width=\"357\" loading=\"lazy\"><br>\n<p>上到山脊上，眼前盡是亂石崩雲、壯闊的崩壁，顯見山崩下的剎那聲勢浩大。</p></p>\n<p>&nbsp;</p>\n<p><img alt height=\"236\" src=\"/sites/cet-taiwan.org/files/813-34.jpg\" width=\"353\" loading=\"lazy\"><br>\n<p>山脊上看村落，高高低低的房舍、樹木、電線桿等，全部沒頂。</p></p>\n<p>&nbsp;</p>\n<p>&nbsp; &nbsp;&nbsp;<img alt height=\"223\" src=\"/sites/cet-taiwan.org/files/813-35.jpg\" width=\"339\" loading=\"lazy\"> <img alt height=\"222\" src=\"/sites/cet-taiwan.org/files/813-36.jpg\" width=\"335\" loading=\"lazy\"></p>\n<p>大雨中，我們正準備離開時，仍有村民在雨中祭拜。</p>"}, {"nid": 587, "title": "2009年8月21日，台東現勘之2", "original_topic": "山林水土", "adopted_cats": ["森林守護與林業改革"], "content": "<p><img alt height=\"339\" src=\"/sites/cet-taiwan.org/files/090902-1.jpg\" width=\"660\" loading=\"lazy\"></p>\n<p>時間：2009年8月21日</p>\n<p>現勘人員：楊俊朗、傅志男</p>\n<p>交通路線：國道3號＞南州交流道＞新埤＞水底寮＞楓港＞南田＞大鳥＞太麻里＞知本</p>\n<p>&nbsp;</p>\n<p><img alt height=\"268\" src=\"/sites/cet-taiwan.org/files/821-7.jpg\" width=\"358\" loading=\"lazy\"></p>\n<p>南迴公路已經打通，從高雄至台東只要駕駛小客車即可一路通暢，比起高雄縣山區，這裡的路況可說是非常良好，出乎我們的意料之外，圖為太麻里溪的路段，清除完土石和漂流木後，路基仍完整。（圖為南太麻里溪橋）</p>\n<p>&nbsp;</p>\n<p><img alt height=\"500\" src=\"/sites/cet-taiwan.org/files/821-8.jpg\" width=\"333\" loading=\"lazy\"></p>\n<p><img alt height=\"224\" src=\"/sites/cet-taiwan.org/files/821-9.jpg\" width=\"256\" loading=\"lazy\"></p>\n<p><img alt height=\"203\" src=\"/sites/cet-taiwan.org/files/821_1.jpg\" width=\"500\" loading=\"lazy\"></p>\n<p>上圖可接在下圖最左方。藍色橢圓是太麻里市區，紅色橢圓是正興，黃色橢圓是台灣牛。不規則區是大約的範圍（都有田、道路或房舍），黑色區地名為「溪底田」、綠色區地名為「溪底」，而二條黃色直線(第2條線有明顯的堤防和綠帶)是人類認為太麻里溪「應該」走的寬度範圍，平時溪流都是如此走，但這次水災（河水氾濫寬度是堤防內幾倍？）可以讓人類知道一件事，原住民有一句話：水最後總會把他的路要回來。（圖為太麻里溪出海口段）</p>\n<p>&nbsp;</p>\n<p><img alt height=\"271\" src=\"/sites/cet-taiwan.org/files/821-12.jpg\" width=\"407\" loading=\"lazy\"></p>\n<p>嘉蘭村去年海棠颱風時被沖走30多戶，這次再度沖走50多戶。這是被沖倒落入河水中所剩看得見的二間房舍，其餘50多戶遍尋不著，可能破碎、被土石掩蓋、或落入海中。（圖為位於太麻里溪上游的金峰鄉嘉蘭村）</p>\n<p>&nbsp;</p>\n<p><img alt height=\"272\" src=\"/sites/cet-taiwan.org/files/821-13.jpg\" width=\"408\" loading=\"lazy\"></p>\n<p>這條路原本是市區最熱鬧的中心，如今圖右的房舍已經是綁著「危險勿進」的水岸第一排危樓了。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"251\" src=\"/sites/cet-taiwan.org/files/821-14.jpg\" width=\"379\" loading=\"lazy\"></p>\n<p>這條斷掉的路是要通往前方，以前的房舍大約被沖毀八十幾戶，溪水也只從對岸到黃線處。村民孟先生說：從沒碰過這麼大的水災，還好事情發生時是白天，大家都逃了出來。政府說要遷村的事，部落的長輩認為要往山上去可以，但對於山下就不喜歡了。現在最要緊的是上游還有掩塞湖，每每下大雨時，溪水伴隨著石頭滾動的聲音，大家都很害怕，希望政府可以先炸開掩塞湖，讓水土能順利慢慢下來，不要讓人一直提心吊膽。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"251\" src=\"/sites/cet-taiwan.org/files/821-15.jpg\" width=\"378\" loading=\"lazy\"></p>\n<p>嘉蘭村民孟先生說：現在的蔬菜很貴，大家都買不起，生活過得很苦。</p>\n<p>（圖中是嘉蘭村民開始在被河流土石掩蓋區整地種上蔬菜）</p>\n<p>&nbsp;</p>"}, {"nid": 590, "title": "八八水災．地球公民協會勘查紀錄", "original_topic": "無", "adopted_cats": ["森林守護與林業改革", "國土計畫"], "content": "<p>\n<p>&nbsp;</p>\n<p></p></p>\n<p><div></p>\n<p></div></p>\n<p>\n<p><a href=\"http://maps.google.com.tw/maps/ms?ie=UTF8&amp;hl=zh-TW&amp;t=h&amp;brcurrent=3,0x346e7ccc957533fb:0x6a101a0b874036a4,0&amp;source=embed&amp;msa=0&amp;msid=104530850450508193767.0004729289a5177d7d03e&amp;ll=23.616212,121.01508&amp;spn=1.761557,2.334595\">點更大的地圖觀看</a></p>\n<p></p></p>\n<p>\n<p>&nbsp;</p>\n<p></p></p>\n<p>\n<p>文☉地球公民協會</p>\n<p></p></p>\n<p>\n<p>莫拉克風災後，地球公民協會以棉薄人力，從8月10日陸續開始進行災區的勘查，從中學習與省思如何在國土重建中找到著力點，以下是我們在各地的勘查紀錄。</p>\n<p></p></p>\n<p>\n<p>8月10日，屏東縣<a href=\"http://met.ngo.org.tw/node/592\">林邊溪潰堤處及永樂村、茄苳鄉塭豐村。</a></p>\n<p></p></p>\n<p>\n<p>8月12日，台南縣<a href=\"http://met.ngo.org.tw/node/593\">羌黃坑。</a></p>\n<p></p></p>\n<p>\n<p>8月13日，台南縣<a href=\"http://met.ngo.org.tw/node/583\">南化水庫</a>、高雄縣<a href=\"http://met.ngo.org.tw/node/584\">旗山</a>、<a href=\"http://met.ngo.org.tw/node/581\">杉林鄉</a>、高雄縣<a href=\"http://met.ngo.org.tw/node/578\">甲仙</a>及<a href=\"http://met.ngo.org.tw/node/577\">滴水村</a>。</p>\n<p></p></p>\n<p>\n<p>8月14日，嘉義縣<a href=\"http://met.ngo.org.tw/node/575\">梅山鄉</a>。 8月17日，高雄縣<a href=\"http://met.ngo.org.tw/node/582\">小林村</a>。</p>\n<p></p></p>\n<p>\n<p>8月19日，高雄縣<a href=\"http://met.ngo.org.tw/node/585\">六龜鄉。</a></p>\n<p></p></p>\n<p>\n<p>8月21日，台東縣<a href=\"http://met.ngo.org.tw/node/586\">大鳥部落</a>、<a href=\"http://met.ngo.org.tw/node/587\">知本溪金帥飯店及太麻里溪嘉蘭部落</a>。</p>\n<p></p></p>\n<p>\n<p>從台南、高屏到台東，我們看到八八水災對土地、人民財產與性命的蹂躪與摧殘，更突顯山林保育的重要性。 地球公民協會成立二年來，持續關注國土保育課題，從揭露伐木養菇的真相，批判國民黨反對國土復育，監督國家公園法、宗教團體法，反對鬆綁山林開發等。八八水災及每一次的災變，都讓我們再次確認這些課題的重要性。 協會正和參與八八災後重建的民間團體共同商議對策，並將持續關注與國土保育相關之政策。重建、國土規畫等實質公共事務，有賴專業穩定的公益組織持續關注，地球公民協會及許多長期關注山林水土保育課題的公益組織，此刻更需要您的支持。<br></p>\n<p>在較大的地圖上查看<a href=\"http://maps.google.com/maps/ms?ie=UTF8&amp;hl=zh-TW&amp;msa=0&amp;msid=104530850450508193767.0004729289a5177d7d03e&amp;ll=23.616212,121.01508&amp;spn=2.355578,1.089508&amp;t=h&amp;source=embed\">88水災</a> 八八水災相關文章</p>\n<p></p></p>\n<p>\n<p>◆真正的人道是斧底抽薪解決問題─ ─<a href=\"http://met.ngo.org.tw/node/594\">八八水災後復建及國土規畫建言</a></p>\n<p></p></p>\n<p>\n<p><span><span>◆ </span><span> <span><span>延伸閱讀</span> ---</span></span><span>【</span><span>新新聞報導</span><span>】</span><a href=\"http://met.ngo.org.tw/node/596\"><strong>越域引水，破壞生態的錯誤</strong></a></span></p>\n<p></p></p>\n<p>\n<p>◆<a href=\"http://met.ngo.org.tw/node/615\">論災後原住民之遷村與山林保育 </a></p>\n<p></p></p>\n<p>\n<p>◆天災還是人禍？---<a href=\"http://met.ngo.org.tw/node/616\">記莫拉克災後茂林觀察紀錄</a></p>\n<p></p></p>\n<p>\n<p>◆<a href=\"http://met.ngo.org.tw/node/621\">八八災後，失根漂流</a></p>\n<p></p></p>\n<p>\n<p>◆<a href=\"http://met.ngo.org.tw/node/624\">8/13，我在林邊永樂村</a></p>\n<p></p></p>\n<p>\n<p>◆ <a href=\"http://met.ngo.org.tw/node/625\">家－紀念8 8 水災</a></p>\n<p></p></p>\n<p>\n<p>◆ <a href=\"http://met.ngo.org.tw/node/644\">88水災後—高雄市觀察筆記（一）</a></p>\n<p></p></p>\n<p>\n<p>◆ <a href=\"http://met.ngo.org.tw/node/653\">88水災後—高雄市觀察筆記（二)</a></p>\n<p></p></p>"}, {"nid": 593, "title": "2009年8月12日，台南縣羌黃坑現勘", "original_topic": "山林水土", "adopted_cats": ["森林守護與林業改革"], "content": "<p>時間：2009年8月12日</p>\n<p>現勘人員：楊俊朗</p>\n<p>交通路線：旗山＞玉井＞羌黃坑</p>\n<p>&nbsp;</p>\n<p><img alt height=\"315\" src=\"/sites/cet-taiwan.org/files/812-1.jpg\" width=\"420\" loading=\"lazy\"></p>\n<p>水災第四天，羌黃坑大水不止。</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><img alt height=\"318\" src=\"/sites/cet-taiwan.org/files/812-2.jpg\" width=\"424\" loading=\"lazy\"></p>\n<p>國軍幫忙整理被土石流侵蝕的家園。</p>"}, {"nid": 615, "title": "論災後原住民之遷村與山林保育", "original_topic": "森林與林業政策", "adopted_cats": ["森林守護與林業改革"], "content": "<p>文☉李根政(地球公民協會執行長)</p>\n<p>&nbsp;</p>\n<p><img alt height=\"229\" src=\"/sites/cet-taiwan.org/files/DSCN3725s.jpg\" width=\"311\" loading=\"lazy\"></p>\n<p><img alt height=\"231\" src=\"/sites/cet-taiwan.org/files/DSCN0097s.jpg\" width=\"314\" loading=\"lazy\"></p>\n<p>△是誰在縱容伐木？誰在主導錯誤的山林政策？</p>\n<p>&nbsp;</p>\n<p>在一個討論小林村遷村的場合中，一位長期關切平埔族文化工作的村民--潘先生，在回應小林為何滅村問題時，開場便直指民國62年至72年獻肚山原始森林被全面砍代，更惡質的是連樹頭都挖起來，才造成今日的水土不保；無獨有偶，筆者在一場原住民部落組織對災後重建的記者會中，屏東達瓦達部落、霧台佳暮村的朋友，同樣痛陳民國5、60年及持續不斷的森林砍伐是重創部落的元凶。</p>\n<p>這些指控正呼應著我們長期關注的山林政策。</p>\n<p>文☉李根政(地球公民協會執行長)</p>\n<p>&nbsp;</p>\n<p><img alt height=\"229\" src=\"/sites/cet-taiwan.org/files/DSCN3725s.jpg\" width=\"311\" loading=\"lazy\"></p>\n<p><img alt height=\"231\" src=\"/sites/cet-taiwan.org/files/DSCN0097s.jpg\" width=\"314\" loading=\"lazy\"></p>\n<p>&nbsp;&nbsp; △是誰在縱容伐木？誰在主導錯誤的山林政策？</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 在一個討論小林村遷村的場合中，一位長期關切平埔族文化工作的村民--潘先生，在回應小林為何滅村問題時，開場便直指民國62年至72年獻肚山原始森林被全面砍代，更惡質的是連樹頭都挖起來，才造成今日的水土不保；無獨有偶，筆者在一場原住民部落組織對災後重建的記者會中，屏東達瓦達部落、霧台佳暮村的朋友，同樣痛陳民國5、60年及持續不斷的森林砍伐是重創部落的元凶。</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 這些指控正呼應著我們長期關注的山林政策。</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 在災後的近一個月間，原住民部落遷村，讓山林休養生息，似乎形成了社會主流的輿論，慈善組織也在安置區要受災的原住民簽下意願書，承諾在取得永久屋的同時，不得再回原居地，爾後修正為「不得從事破壞水土之行為」等。但是，舉國上下似乎忽略了，破壞山林最大的元凶是政府，而且許多錯誤仍在持續之中，筆者試舉近年三例說明。</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 其一、1996年，賀伯災後，政府推出全民造林，以每公頃20年53萬獎勵金鼓勵人民種樹，結果演變成砍大樹種小樹，經筆者等揭發後，才在2004年由游錫堃前院長下令停止，估計這段期間已毀林超過三萬公頃。然而，馬總統上台之後，今年起，此一獎勵造林之政策又持續推動，而且加碼至每公頃60萬元。</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 其二、經地球公民協會之調查，台灣每年因應養菇業所需之木屑，每年伐木面積約在2,300公頃，而農委會之統計則在3,000公頃左右，然而至今中央政府不理不睬，僅屏東縣政府自覓財源，推出限制伐木補償之政策，試圖減少森林破壞，然而，此一伐木行為正移轉至台東縣，而苗栗縣是最大伐木區。</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 其三、高雄縣楊秋興縣長加速推動寶來溫泉合法化，卻叫原住民要遷村，何來公平正義？</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 誠然，今日原住民保留地之利用方式，產業道路之開闢，超限利用、破壞水土者所在多有。然而，在把所有山區災難指向原住民土地利用不當時，政府更應清查公布：今日高山蔬果有多少比例是原住民栽種？多少比例是尾隨著伐木、公路開闢而上山之漢人墾戶？歷來超限利用取締成果？國有林地被佔用收回情形等…？尤其，更該檢討徹查的是，政府主導的山林政策、道路工程、水庫、攔河堰、攔砂壩、水力電廠、越域引水等工程，造成了多少山林水土的破壞？</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 「原住民遷村，讓山林休養生息」，猶如鋸箭療傷法，一則簡化了山林保育的問題，讓我們失去關照整體山林問題的視野；二則容易讓政府推卸山林政策改革責任。</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 再者，原住民部落遷村不只是換個地方蓋房子。以九二一經驗，重建之路漫長，五年十年都未必能夠竟全功。不論是家屋、社會、文化等重建工程或者生態復育，都需要細膩處理人與事。在安全層面，在面對原住民遷村的問題時，必須考慮台灣山山互異、變化多端之地理特徵，加上過去全面砍伐原始森林，破壞至少七成防護罩，921地震後、極端氣候等新情境下，以個別部落進行評估，絕非單純的是非題；在產業與保育的衝突面向，更該審慎評估原住民在山區的農耕產業是否可持續？建立生態緩衝區之有限度的農耕是否可行？觀光產業之模式？其他生態經濟之可能性等課題。</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 建議慈善組識，大可不必急於爭取興建永久屋，或可考慮，建立嚴謹和不失效率的審核制度，以部落為主體提出各種重建的需求，將社會善款撥付部落的自治組織或協助重建的協力組織。讓族人在擁有充分主體的情況下，從事自力造屋、教育（含課後輔導等）、老弱照護、生態經濟的實踐、文化傳承與發揚等工作。</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 同時，建請國人及慈善團體，除了在災難後捐款、救急救難之外，也能在平時關切政府的山林政策、國土計畫等課題，與長期致力於山林保育的團體，共同監督、參與國土復育的百年大計。</p>\n<p>&nbsp;</p>\n<p>․․<strong>延伸閱讀 </strong>․․</p>\n<p>◆ 有關原住民部落安置重建，許多受災部落組織於2009.9.9在屏東原住民文化園區提出了「正視災後重建過程中的原住民主體，原住民部落組織對於莫拉克災後安置重建的十點訴求」請大家上<a href=\"http://southtribe.pixnet.net/blog/post/545956\">南方部落重建聯盟的網站</a>參閱。</p>\n<p>◆台灣一年吃掉多少森林?--<a href=\"../../../../../../../../node/477\">台灣伐木養菇調查報告</a>。</p>\n<p>◆<a href=\"../../../../../../../../node/466\">台灣伐木養菇調查議題之調查研究影片紀錄。</a></p>\n<p>&nbsp;</p>"}, {"nid": 616, "title": "天災還是人禍？記莫拉克災後茂林觀察紀錄", "original_topic": "山林水土", "adopted_cats": ["森林守護與林業改革", "國土計畫"], "content": "<p>文⊙薛淑文 (地球公民協會執行祕書)</p>\n<p>&nbsp;</p>\n<p><img alt height=\"244\" src=\"/sites/cet-taiwan.org/files/85.jpg\" width=\"327\" loading=\"lazy\"><br>\n<p>甫新通車的新威大橋，橋下土石、漂流木佈滿河床，危及橋墩的安全結構。(廖金山攝)</p></p>\n<p><img alt height=\"226\" src=\"/sites/cet-taiwan.org/files/met54.JPG\" width=\"339\" loading=\"lazy\"><br>\n<p>荖濃溪溪床上限縮河道，種植果樹、檳榔等作物。(黃裕文攝)</p></p>\n<p>&nbsp;</p>\n<p>8月19日上午，我與協會的義工裕文、秀珊參與由中華蝶會廖金山先生(亦是紫斑蝶生態保育協會南部總召集人)將物資背運到高雄縣茂林鄉的行動，金山與部落的魯凱族朋友烏巴克是舊識，烏巴克因為知道救援的物資無法一一送到獨居或是行動不便的災民手上，所以他克服路斷的危險以徒步的方式，不辭辛勞的彌補民間與政府救災未逮之處。</p>\n<p>我們開車走10號國道，從旗山下交流道，經美濃往茂林方向，一路上交通都還算順暢。接近目的地前的新威大橋，距荖濃溪與濁口溪交會處不到500公尺，兩條溪水交會之後水量更加洶湧湍急，橋墩旁的土石量明顯高出其他河道，令人不禁擔憂這座幾個月前剛通車，仿紫斑蝶造型造價近9億的新威大橋，會不會下次洪水一來，即壽終正寢？原是荖濃溪的行水區，卻有工寮、電線桿、溝渠、果樹、檳榔樹，著實讓人見識到台灣人民極盡壓榨、極致利用每一寸土地。</p>\n<p>車子通過軍方臨時設置的檢查哨，停妥於台27線25k處，接下來我們就要靠著人類最原始的交通工具----雙腳，來移動。</p>\n<p>&nbsp; &nbsp; &nbsp; <img alt height=\"199\" src=\"/sites/cet-taiwan.org/files/IMG_8107.JPG\" width=\"300\" loading=\"lazy\"> <img alt height=\"196\" src=\"/sites/cet-taiwan.org/files/IMG_8483.JPG\" width=\"295\" loading=\"lazy\"></p>\n<p>豎立於大津便橋下的鋼樑支架，宛如梳子般，不止阻擋了漂流木的流向，更造成巨量的洪水及泥砂無法渲洩而下，回淹至上&nbsp; 游的聚落。(黃裕文攝)</p>\n<p>&nbsp; &nbsp;&nbsp; <img alt height=\"202\" src=\"/sites/cet-taiwan.org/files/IMG_7375.jpg\" width=\"309\" loading=\"lazy\"> <img alt height=\"203\" src=\"/sites/cet-taiwan.org/files/IMG_7284.JPG\" width=\"286\" loading=\"lazy\">&nbsp;<br>\n<p>&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;國軍弟兄們連日來賣力的不停清運著大量的汙泥以及漂流木。(黃裕文攝)</p></p>\n<p>茂林鄉有三個原住民部落，分別是最外側的茂林、萬山和多納，流經茂林鄉的濁口溪，發源於卑南主山西側，是荖濃溪的支流之一，主流先向西北再往西南流經萬山、茂林後於大津注入荖濃溪。莫拉克颱風夾帶著旺盛的西南氣流，連日的超大豪雨，導致暴漲的濁口溪水沖垮了橫跨茂林鄉與大津村之間的大津舊橋，連搭建的大津便橋，黃色的鋼樑硬是不敵洪水猛烈的衝擊力道，呈變形扭曲斷裂，橋面上更是堆積大大小小橫陳的林木，可見當時溪水暴漲的景況。</p>\n<p>再往前走，只見阿兵哥、村民們來回不停的將屋內的汙泥清運到馬路上，按理說，聚落距離河道約100公尺，高度落差約近30公尺，且位於斜坡的兩側，依水往低處流的原理，雨水和泥沙應該會往下方的濁口溪流去，怎麼會受到池魚之殃呢？據金山轉述當地居民的說法：暴雨來臨時，滾滾洪水夾雜著巨量的土石、泥砂、漂流木沖洩而下，便橋下豎立的鋼樑支架，宛如梳子般，阻擋了漂流木的流向，無法渲洩的洪水、泥沙形成漩渦導致水位愈來愈高，沖毀了堤防，又回溢到較上游的濁口溪，烏濁的溪水、泥沙，就這樣從屋後的門窗縫隙滲漏進民宅，又往前推至到馬路另一側的住家，導致住家堆積了近一層樓高的汙泥。</p>\n<p>大自然強大的力量仍不斷的示現，茂林國家風景區管理處位於濁口溪的行水區，8日上午約9點多，濁口溪水暴漲，水位距堤頂不到1.5公尺，短短的幾個小時，溪水已經掏空辦公室後方的堤防，大量的溪水灌進管理處地下室，建物結構不斷遭受洪水、漂流木的沖擊，最後，三層樓的建築就這樣應聲隱沒於滾滾洪水中。</p>\n<p>相較於高雄縣的其他原住民部落，茂林鄉只有聯外道路高132縣道因土石崩落、路基流失導致交通中斷，已算是不幸中的大幸，挖土機連日來搶通便道，而我們則必須在豔陽下耐心的等候，趁著工程暫停的空檔，儘速地通過，同時，又要留意上頭隨時會傾倒的砂石，部落裡的住民為了護送家人就醫及運輸油料，也必須冒著危險往來於工事之間。</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp; <img alt height=\"200\" src=\"/sites/cet-taiwan.org/files/clip_image002_0.jpg\" width=\"268\" loading=\"lazy\"> <img alt height=\"201\" src=\"/sites/cet-taiwan.org/files/IMG_6891.jpg\" width=\"302\" loading=\"lazy\"></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ▲茂管處的檔案照片，出自網路。&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ▲黃裕文攝</p>\n<p>&nbsp; 白色水泥物為沖垮的茂管處，對照左右兩圖，可清楚的看出茂管處興建地點的違失。</p>\n<p>這些年來，茂林和聞名遐爾的紫斑蝶劃上等號，茂林是紫斑蝶渡冬的重要繁殖地，更因此帶動了當地生態觀光的商機，但保存部落文化、生態保育與觀光發展孰重孰輕，相信這次的莫拉克颱風已有答案。有鑑於高雄縣災後重創的程度，令我回想起數月前看到的一篇新聞報導，內容是高雄縣楊秋興縣長為了六龜、寶來的溫泉飯店業者申請土地變更及核發建照的問題，砲火隆隆的抨擊縣內的地政處，甚至語出重話的表示，承辦官員若不能配合就換掉。</p>\n<p>這和政府長期以來積極的發展山地觀光，如出一轍的思惟模式，就是不斷的新闢、拓寬山路，蓋遊樂區、風景區、觀光飯店、觀光茶園或果園，有崩塌的地方就靠工程技術來解決，永遠不去面對、取締森林持續的砍伐、山坡地超限利用、違法開墾的陳年老問題。如此荒謬的山林保育政策，無疑是加速台灣島維生體系的潰爛崩解，而政府每年擲在復修重建的經費，卻還能開創永續的利益產業集團。</p>\n<p>歐亞板塊與菲律賓海板塊經數千萬年來不斷持續的擠壓----台灣島形成；颱風帶來豐沛的雨量，讓我們免於像同緯度國家植被沙漠化的厄運。颱風和地震既是台灣島的宿命，哪我們如何與自然平和共存呢？</p>\n<p>泰國佛教學者----佛使尊者，曾發表過「佛教與自然保育」的文章，提到「自然」這個名詞的意義，尊者認為「自然」有內、外兩個層面的涵意，內在的自然，也就是心；外在的自然指的是由現象產生的自然，他進一步解釋內在自然如何影響外在的自然，他說，若一個人能夠保存內在的自然，外在的自然就會自己照顧得很好，但當我們的心已經淪為經濟和物質的奴隸時，就很難保有外在的自然了。</p>\n<p>大自然無常的變化實為恒常，如今，卻因為人類過度的活動行為而產生激烈的驟變，如果這次莫拉克颱風在失去數百條人命和損失後，卻還無法喚起世人的覺悟，醒思到人類與地球上所有的生命是相互依存、共存共生，無法獨立存在的亙古真理，那莫拉克只是開始而非結束！</p>\n<p>&nbsp;</p>\n<p><img alt height=\"289\" src=\"/sites/cet-taiwan.org/files/P1000868.jpg\" width=\"386\" loading=\"lazy\"></p>\n<p>森林豐美的自然生態，是人類的賴以維生的命脈，亦是刻不容緩的保護課題。(薛淑文攝)</p>"}, {"nid": 621, "title": "八八災後，失根漂流", "original_topic": "山林水土", "adopted_cats": ["森林守護與林業改革", "國土計畫"], "content": "<p><span>曾文水庫上游暨越域引水草蘭洞口勘查記錄</span></p>\n<p><span></span></p>\n<p>文☉王敏玲（地球公民協會副執行長）</p>\n<p>&nbsp;</p>\n<p><img alt height=\"264\" src=\"/sites/cet-taiwan.org/files/met33.jpg\" width=\"397\" loading=\"lazy\"><span><span><br>\n<p>協會執行長根政站在被土石、漂流木佔據、堆高的曾文溪河床上，一旁是只剩一截的電線桿（王敏玲攝）</span></span></p></p>\n<p>&nbsp;</p>\n<p>九月二日清早，與協會執行長根政搭火車到台南，和台南社大煥彰老師、Amy姐一同在瑞光及他的四輪傳動車引領下，朝此次莫拉克災變後引起極大爭議的越域引水工程現場前進。此行主要為勘查八八水災後的國土現狀，留下觀察紀錄，同時，一行五人也渴盼在媒體提供的畫面之外，親臨現場，領略大自然的力量，從山河水土的樣貌中找尋啟示。</p>\n<p>沿著鹽水溪畔經過市區，四個輪子迅捷地駛進北一高，行經3號省道、8號快速道路後，我們進入20號縣道。『倒松』、『劉陳』這些地名一一出現，濃濃的地方味開始渲染，瑞光的方向盤一轉，四輪再回到3號省道，行駛在玉井與楠西之間，座車陸續帶我們經過玉井橋、竹圍橋等，路面與橋面都還完好，只見夾帶著灰色泥砂的曾文溪水靜靜地在橋下流淌，河岸偶見施有水泥階梯的生態工法與一旁大片的芒果樹。</p>\n<p>進入楠西鄉371路段後，我正要陶醉在那映入眼前的『鹿陶洋』地名之美，隨即一陣顛簸，四輪轉進狹窄的『水庫路』，也把我的思緒拉回現實。瑞光熟練地操控著手排車，時而爬坡、時而下坡，接著是一大段連續彎路，車窗外，時而見到一片河床緩衝地，上頭有還未完工的河岸工程。</p>\n<p>約莫在362路段前後，壯觀的惡地形泥岩山赫然聳立在右側，那沒有植被的冷峻山貌教人倒抽一口氣，此刻車內響起剛下片不久的《搶救地球》電影配樂，這一段盧貝松訴說著對大地面貌的驚與顫，氣氛詭譎懸疑，與窗外景象加乘，心跳加速。又是顛簸，我抓緊把手，撐過一段連續彎路，此時，瑞光要大伙兒往左方看，曾文大壩已進入眼簾。</p>\n<p>此去，不斷可見到大小落石在路旁「歇息」，瑞光的車速稍緩，山坡上的次生林有不少蔴竹、山黃蔴，我們下車拍照，根政說放眼所見沒有一棵樹超過30歲。四輪再來到民族橋，熄火停車，這橋下完全不見水的芳蹤，河床上滿滿地堆疊著一顆顆硬沈沈的大石頭，石塊堆高處離橋面已不遠，再多，這橋身定是受不住的──我心想，<strong>是多少失根漂流的土壤、多少流離失所的土石和多大的力量，構築出這番驚人的景象！</strong></p>\n<p>座車繼續往前行駛，已經開了一個半小時的瑞光沒有絲毫疲累，他小心地穿過一座小橋（已略見毀損），再越過一座民生橋，接著，在前方寬闊處停車。此地擺設了幾張有靠背的木質座椅、一處簡陋的瞭望台和一大片水泥空地，不難想像假日時一連停上好幾台觀光遊覽車的熱鬧景象，但今天，空盪如也。根政、煥彰老師對著環抱水庫山頭的幾處崩塌猛按快門，Amy姐也繞到另一邊拍照，瑞光拿起望遠鏡找尋水庫的水位數字，我則憶起兒時曾隨著姑丈到此一遊的往事。</p>\n<p>上車時，根政看到一旁路標寫著「嘉義農場」，質疑怎會核准在此地開發農場，瑞光表示這農場平常多是觀光性質，假日遊客不少。我們接著往和平村行駛，先過大同一號橋，橋下多土石，大同二號橋，一旁土石崩塌情形嚴重，過了大同三號橋後，看見諾大的「白馬亭」三個字，但眼前既無白馬亦無亭，只有一處有高低水位落差且有水不停流過的工地和幾位正在休息的工人，一旁則有檳榔樹。馬路對面是自來水公司竹崎營運所的大埔淨水廠，我們推測是淨水場的引水口受到災損，正在施工修復中。</p>\n<p>大伙兒上車，四輪再啟動，從這裡往上游行駛後，兩旁的檳榔樹、漂流木和堆積在小路兩旁的土石則愈來愈頻繁出現，有一處更可見到面積驚人的漂流木無言地躺在山谷裡。拍完照，我們靜靜地上車，再行經和平二號橋、和平三號橋後，四輪來到造型優美的「大埔拱橋」，瑞光熄了火讓大家歇息片刻。我下了車，站在橋上望去，曾文水庫上游幽靜的溪水與細細的泥沙在層巒疊嶂的山色和河岸兩側翠綠的山壁相映下，美不勝收，連四處找角度拍照的煥彰老師都停下腳步，忍不住撇開觀景窗，發出由衷讚嘆！</p>\n<p>這大概是此行造訪的最華麗的一座橋了，橋頭橋尾貼有磁磚，中間有「大埔橋」幾個大字，橋面約有六米寬，此時此刻，拱橋景致真是風光明媚。然而，儘管眼前平靜無波，但橋面上殘留的泥沙水痕、小卡車經過時囂張到不行的揚塵，還是為莫拉克侵襲時的景象留下了註解。</p>\n<p>已是近午時分，日頭赤炎炎，大夥躲到拱橋旁的五角涼亭讓自己降溫一下，抬起頭，我們注意到涼亭上方有一片「澐密戰道工程紀念碑」，紀錄著民國58年至62年間，因修築連接澐水到密枝的戰道造成30多人傷亡的歷史，根政感慨前人的犧牲奉獻，卻只留下一個這麼一片不起眼的碑文。</p>\n<p>告別拱橋與涼亭，再往上游去，路更不好走了。有些路段的路基已被局部淘空，我們小心翼翼地選了一處下車察看，河床有明顯的淤積和抬升，眼前可見一處小瀑布及看來剛修築好的便道。沿途，有不少直徑約10公分上下的蔴竹叢，這是當地主要的經濟作物之一。這一路上，滿載著筍乾或剛採收的蔴竹筍小貨車斷續地往我們的反方向行駛而過。再往上走，路邊有人生著火，一旁四、五位鄒族原住民剛整理好一車蔴竹筍，準備開往鎮上販賣。我們上前與他們聊起此次風災的損壞，一位女性原住民朋友說，本來大概可以採收80萬元的竹筍，颱風這麼一掃，現在大概只剩下15到20萬了。忙完農事的原住民拿起餐盒吃飯，其中一位拿起一大塊肉，準備烤肉加菜。揮別這幾位朋友，我們也要為自己的五臟廟張羅了。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"286\" src=\"/sites/cet-taiwan.org/files/met33-1.jpg\" width=\"384\" loading=\"lazy\"><span><span><br>\n<p>風姿綽約的大埔拱橋和一旁的涼亭（王敏玲攝）</span></span></p></p>\n<p>&nbsp;</p>\n<p><img alt height=\"354\" src=\"/sites/cet-taiwan.org/files/met33-2.jpg\" width=\"236\" loading=\"lazy\"><span><span><br>\n<p>曾文水庫上游幽靜的景色，令人駐足（李根政攝）</span></span></p></p>\n<p>&nbsp;</p>\n<p><img alt height=\"350\" src=\"/sites/cet-taiwan.org/files/met33-3.jpg\" width=\"233\" loading=\"lazy\"><br>\n<p><span><span>原住民朋友準備將剛採收的蔴竹筍以小貨車載到鎮上賣（李根政攝）</span></span></p></p>\n<p>午後，天色漸沈，瑞光往坪林的小路駛去，一路經過的小橋兩邊護欄上滿是泥渣、泥痕，還有許多枯枝枯葉卡在其中。行經茄冬二號橋後，有一處未完工的攔砂壩，整個被大石沖毀，那厚實的水泥塊，在此情此景中，顯得如此脆弱可笑。此刻，忘了是誰先驚呼：「有老鷹！」，大夥往空中探去，陰陰的天色中，一隻老鷹就在我們的上方不遠處盤旋。</p>\n<p>上車行駛不久，前方又是一處坍塌，小路上低窪處有積水約10 公分深，10 幾米長，我們沿著一旁較高的泥地慢慢走，就在山壁下，一片崩塌下來的巨石倚在小路旁，駐足目測，其中兩塊巨石赫然有2.5至3公尺立方那麼大。Amy姐爬上邊坡到巨石邊去探查究竟，順便讓大夥當比例尺，「難怪土石流時會有很大的聲音！」煥彰老師驚嘆。</p>\n<p>過了坪林隧道後，路況更糟了，一旁不是被風災狂掃過的凌亂蔴竹，就是大大小小的擋住去路的巨石，瑞光查了一下，這兒的海拔大約580。過了燕子崕，路基掏空更加嚴重，路面時寬時窄，時彎時陡，考驗著駕駛的應變。多處河床上大石密佈，以約莫1公尺立方上下的最多。又來到一處災後現場，停車一看，對面山上的小溪溝由上而下沖刷為漏斗型的河床，最寬處約達50公尺，河床上遍佈石塊與零散的漂流木，景象可謂殘破荒涼！眼尖的根政發現其中有一根長長的藤本植物，大約有成年男子的手臂那麼粗，而溪溝的左右兩側則是一片農墾地與竹林──唉！是怎樣的土地開發與利用，得致如此山河破碎。</p>\n<p>往大埔鄉茄冬村7鄰前進，路邊倒著一棵巨大的枯木，根都還在上面，根政上前伏抱著她的身軀留下合影，之後，往一旁的奉龍宮走去，停在宮廟前，閉眼合十。是在為這些枯木生靈祝禱嗎？我沒問。</p>\n<p>再往前，有檳榔園及一小片鳳梨田（上頭還卡著許多被泥水枯枝淹過的殘渣），以及寬闊驚人的樹木墳場──漂流木遍地橫躺，最粗的樹幹直徑約有70至80公分，此景當前，殊為震撼，每個人身上的相機都卡擦、卡擦響個不停，仿若刻劃著大夥內心的悸動。</p>\n<p>我往另一邊較高處望去，看到一、兩戶平房住家，水泥庭院前方有三個孩子坐著閒聊、看著陌生的我們。我問：「小朋友，你們是兄弟嗎？」最大的點頭說是，Amy姐接著問：「你們的爸爸、媽媽呢？」五年級的哥哥說在工地。水災那天你們在哪裡？也在那裡。水淹來的時候你們怕不怕？三年級的老二笑笑沒說話，還在念幼稚園的小弟搖搖頭，停了幾秒鐘，大哥哥才看著小弟說：「他都碼說不會！」。我再問，那你呢？你會不會怕？「我會啊。」大哥哥輕輕說。這三個孩子的父母親，平時就在曾文越域引水的工地工作，孩子們說，爸爸負責清運開挖工程的炸藥炸過之後的廢土，媽媽煮飯給工人吃，他們三個常常兩地跑。</p>\n<p>也就是說，我們所在的位置離越域引水的工地不遠了，但往前一看，路況不太妙。有些地方泥濘相當深，前方通不通？不知道。瑞光要大家坐穩了，加足馬力往前挺進。再停車，下來察看，阿里山山脈像一幅山水畫般佇立在前，可惜的是，山坡上有兩大片崩塌，像兩塊缺了皮膚的傷口，越域引水工程西引水口在眼前畫面的右下方，山下大面積土石夾雜、堆積成厚厚的河床，光禿禿一片，只有一小叢倖存的檳榔園在其中，非常突兀。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"248\" src=\"/sites/cet-taiwan.org/files/met33-4.jpg\" width=\"371\" loading=\"lazy\"><span><span><br>\n<p>曾文越域引水草蘭隧道洞口附近倖存的檳榔園（李根政攝）</span></span></p></p>\n<p>&nbsp;</p>\n<p><img alt height=\"185\" src=\"/sites/cet-taiwan.org/files/met33-5.jpg\" width=\"275\" loading=\"lazy\"><br>\n<p><span><span>跟隨著工地的父母親，在莫拉克手中逃過一劫的三個孩子（李根政攝）</span></span></p></p>\n<p>&nbsp;</p>\n<p><img alt height=\"192\" src=\"/sites/cet-taiwan.org/files/met33-6.jpg\" width=\"286\" loading=\"lazy\"><br>\n<p><span><span>通往茶山的河床便道（李根政攝）</span></span></p></p>\n<p>&nbsp;</p>\n<p>四輪走到施工的工地現場前，路已斷，兩架大怪手正在搶修，瑞光下車與司機們溝通，疲累的我們閉目片刻。過了一會兒，煥彰老師不等了，索性下車捲起褲管、越過淺淺的水流，攀上這片傷痕累累的河灘地。</p>\n<p>這時，天空飄起毛毛雨。怪手終於鋪上鋼板搶通了便道，四輪發揮用武之地，繼續帶我們向前來到工務所。下車時，雨更大了些，我們走在被大小土石和無數漂流木堆積、佔領的河灘地上面，眼前畫面張力十足，彷彿災難電影的場景般。電線桿都變矮了，有一根只突出「路面」約一公尺，另一旁還有一棵只剩下頭的椰子樹──<strong>從四面八方漂流至此的大小土石、樹木，壯觀驚人，舉目所見，遍地都是樹的屍首。</strong>根政低頭嘆息說，除了該為人寫悼文，也該有人為這樹木和山裡的各種亡靈寫祭文吧<a href=\"#_ftn1\">[1]</a>！</p>\n<p>&nbsp;</p>\n<p><img alt height=\"244\" src=\"/sites/cet-taiwan.org/files/met33-7.jpg\" width=\"368\" loading=\"lazy\"><span><span><br>\n<p>箭頭處為曾文越域引水西隧道草蘭洞口週邊及上方的阿里山山脈崩坍嚴重。圓圈處為工務所（李根政攝）</span></span></p></p>\n<p>&nbsp;</p>\n<p><img alt height=\"258\" src=\"/sites/cet-taiwan.org/files/met33-8.jpg\" width=\"386\" loading=\"lazy\"><span><span><br>\n<p>曾文越域引水西隧道草蘭洞口（李根政攝）</span></span></p></p>\n<p>&nbsp;</p>\n<p>我們往工務所走過去，那三個孩子竟然也徒步走到這裡了，原來是他們久候爸媽不耐，乾脆自己找了過來。根政、煥彰、瑞光與工人訪談起來，工人說，八八那天雨就下很大了，當天還有通訊，但是四周的路都斷了。在越域引水西隧道民族洞口的工務所共有30幾輛施工機具、車輛被大水沖走，當時有10個工人從隧道逃到草蘭洞口，加上原本在草蘭洞口施工所的16人（包括那三個孩子）共26個人，設法找到安全的地點躲避風雨，很幸運的逃過一劫。語畢，孩子的媽低頭責問三個小朋友，怎麼不在家裡等，接著又抬頭看著我們說：「唉！人平安，就好了」。</p>\n<p>雨漸漸歇了，放下褲管，踩著這片失根漂流的土地，我們結束今天的勘查行程，盧貝松的搶救地球電影配樂再度響起，瑞光說，那……，那是我們的「家」<a href=\"#_ftn1\">[2]</a>啊！</p>\n<p><img alt height=\"250\" src=\"/sites/cet-taiwan.org/files/met33-9.jpg\" width=\"374\" loading=\"lazy\"><span><span><br>\n<p>這是莫拉克離開後台灣土地的真實畫面，是我們的家（李根政攝）</span></span></p></p>\n<p>註：</p>\n<p><a href=\"#_ftnref1\">[1]</a> 祭文「<a href=\"http://leekc-95kh.blogspot.com/\">悼八八風災樹木亡靈</a>」連結。</p>\n<p><a href=\"#_ftnref1\">[2]</a>電影《搶救地球》片名原文為Home。</p>\n<p>&nbsp;</p>"}, {"nid": 642, "title": "陳玉峰、陳月霞港都開講    震撼人心", "original_topic": "山林水土;水資源與環境治理", "adopted_cats": ["氣候變遷與調適", "森林守護與林業改革"], "content": "<p>&nbsp;</p>\n<p><span><span><strong>陳玉峰、陳月霞港都開講&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 震撼人心</strong></span></span></p>\n<p><strong>&nbsp;&nbsp; <img alt height=\"174\" src=\"/sites/cet-taiwan.org/files/980919%20075.jpg\" width=\"251\" loading=\"lazy\"></strong><span><span><br>\n<p>&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;</span></span><span>陳玉峯教授演講實景 &nbsp; &nbsp;</span><span> &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; </span><span>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;&nbsp;&nbsp;<span> </span></span></p></p>\n<p><img alt height=\"173\" src=\"/sites/cet-taiwan.org/files/980919%20149.jpg\" width=\"260\" loading=\"lazy\"><span><br>\n<p>&nbsp;<span>陳月霞老師</span></span><span><span>演講實景</span></span></p></p>\n<p>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;&nbsp; <img alt height=\"163\" src=\"/sites/cet-taiwan.org/files/980919%20067.jpg\" width=\"247\" loading=\"lazy\"><img alt height=\"162\" src=\"/sites/cet-taiwan.org/files/980919%20227.jpg\" width=\"246\" loading=\"lazy\"></p>\n<p>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<span>演講會場座無虛席&nbsp;</span>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <span>陳玉峯教授走下台前與民眾互動&nbsp;</span><span><br>\n<p>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<span>(何俊彥攝)</span>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;(何俊彥攝)</span></p></p>\n<p>&nbsp;</p>\n<p>文⊙朱淑娟（地球公民協會會員、獨立記者）高雄報導2009.9.19</p>\n<p>周末午後，氣溫33度，港都的九月下旬，依然揮汗如雨。八八水災過後，南台灣又恢復往日的活力與生機。今天，陳玉峰老師、陳月霞老師，應地球公民協會邀請，在災後首度到高雄明華國中演講。夫妻同台，各有力道與巧思，全場座無虛席。全程三個小時沒有人離席，連預定的中場休息都取消了。</p>\n<p>台北大學副教授廖本全、中華醫事科技大學副教授黃煥彰、環球技術學院助理教授張子見等昔日戰友，從台灣各地趕來，現場不斷聽到：「好久不見」。因為陳玉峰，老友得以相聚。一如八八水災，讓台灣人心心相連，關心國土的未來。</p>\n<p>陳玉峰說，「我來做個非演講，講而不演、如實報告。」陳月霞講的，則是「霸權、共業與災難」。陳玉峰開玩笑說自己的演講是，「外科醫師動刀動槍」；陳月霞則是，「靈魂的問題，真正深層內在的結構。」</p>\n<p>（以下內容為記者在現場紀錄陳玉峰、陳月霞演講內容，順序或有更動、文詞或有重組，但以不改變兩位的原意原句為原則。）</p>\n<p><span><strong>陳玉峯:</strong></span></p>\n<p><span><strong>台灣的未來，美好文化的救贖與開創</strong></span></p>\n<p>今天陳玉峰演講內容主要圍繞四個主題，包括：一、氣候變遷的成因，以及引發的災難。二、土石橫流的根本原理，台灣天然防護罩的破壞。三、台灣造災史演變，以及山林保育運動。四、台灣的未來人民能夠做什麼。</p>\n<p><strong>誠摯希望災難不再發生</strong><br>\n<p>與其說南部人熱情，不如說南部人真情。森林保育、環境運動、本土文化，幾乎都在港都誓師北伐，南方革命一向是台灣希望之所在。與其說南部人草莽，不如說南部人貼近土地，南部人最了解我常講的「土地與人的關係」。</p></p>\n<p>南台灣的鄉親、災民們早就在莫拉克災難中起來了。站起來幹什麼？打算下一次災難去救中部、北部、總統府。這不是在開玩笑，我很誠摯希望這些災難不再發生，但註定的，台灣一定會再發生。</p>\n<p><strong>氣候進入極端化變遷時期</strong><br>\n<p>過去地球8000年的氣候，是例外的穩定時期，也是地球46億年歷史的不正常特殊階段，人類脫穎而出，締造文明。但最近兩三百年工業文明總體變遷，終結這段超穩定的大氣候，進入地球史的正常、也不正常的極端化變遷時期。</p></p>\n<p>所謂正常，是回到原來的穩定；不正常，則是人類過去兩三百年改變歷史的結局。原始森林大部份消失，海洋魚類所有生態幾乎全面失序，從地球46億年歷史看人類文明，遠遠超過地球史上所有的大滅絕時代。對抗這些不穩定的極端化，相對能力最強的，只有原始天然林。</p>\n<p><strong>氣候因子跟齒牙災變</strong><br>\n<p>21世紀氣候極端值的變化，是20世紀前的10到66倍。例如極端強風、高溫、低溫等等。我們已進入古代時期所謂的「天地不仁，以萬物為芻狗，天有不測風雲。」台灣氣溫、雨量年平均值沒有顯著變化，卻可能在某幾月的某幾天有極端值變化，瞬間的極端值現象完全不在20世紀前的預測模式裏。</p></p>\n<p>極端值現象所畫出來的圖像鯊魚的牙齒，極端高溫、低溫，像鯊魚牙齒一樣，被這種牙齒咬到叫做「齒牙災變」。就像八八水災、賀伯災變，一時環境因子的重大變化，特別容易引發微生物、病毒、細菌等等。不是水災後還有流感？最恐佈的還沒來，更恐佈的還會發生。</p>\n<p>台灣生態帶在往上遷、往北移，1990年代極端化作用開始，台灣中高低海拔，森林不正常死亡，像鐵杉、檜木等，2000年後特別顯著。到了2006年我發現台灣海岸植物在最近30年來向北推進50到70公里。今後在這種極端化下，大死亡的現象會不斷爆發。</p>\n<p><strong>氣象預報的迷思</strong><br>\n<p>全球暖化、海平面上升最主要因素是溫度上升、海水膨脹。極地高山冰雪溶化，可生產地、可居住地受鹽化作用，山地隨時會局部大潰絕，河川地也不能使用，未來台灣可生產地、可居住地、安全的地區全面縮減。</p></p>\n<p>每次災難發生大家就罵氣象局，台灣氣象報告做的不錯了，請你弄清楚，預報的本質是什麼？就是做了預報讓你有足夠時間做好準備，而不是保證災難不發生。聖嬰、南方震盪、全球暖化現在全部相當激烈，災難約每2到8年發生一次。</p>\n<p><strong>山不需要治、水不需要理</strong><span><br>\n<p>過去所謂水土保持、治山防洪工程都會全面失效，山不需要治，水不需要理，經營管理山林真正的意義，是管理人在山林的行為，是要強調我們什麼可以做，什麼不能做，而不是一味誇張我要做什麼、我能做什麼。是土地倫理的展現。</span></p></p>\n<p>21到23世紀我們的主流都是土石橫流，不只台灣，世界皆然。土石橫流最根本的原理，台灣天然防護罩，也就是演化250萬年的造山運動。台灣如果沒有植物，斷層逆衝崩塌下來，會形成大大小小的金字塔，所謂的「無機安息角」，這個角度大約在20到40度之間，這種物理安息角，是看顆粒大小，含有的水分等。</p>\n<p>台灣有四次冰河時期，生命與之交融，產生由植物固定水土保持。台灣的山因為這些森林愈來愈穩定，坡度愈來愈陡，穩定了卻隱藏更大的不安定。我們把森林幹掉了，從有機安息角回到無機安息角，所以這樣子的崩塌，有機會復原的話也是300年。</p>\n<p><strong>堅決反對越域引水</strong><br>\n<p>小林滅村與曾文越域引水的羅生門無關係？我的答案是，「非有關、非無關」，因為科學完全無能證明它有關，也無能證明它無關。一如地震無法預測，你無法證明這10公里外的炸山，是不是引起這次山崩的原因。</p></p>\n<p>但我堅決反對越域引水。為什麼？這跟小林村這個案例無關。越域引水根本的問題是，台灣降雨線往北遷移，換句話說，高屏愈來愈沒水，你又把高屏溪上游的水攔給曾文水庫，高屏中下流的生態全面崩盤，導致高屏平原整個經濟崩盤。</p>\n<p>我反對越域引水另外一項重要理由是「世代不公不義」，那些水源並不是按照自然，也不是依農林系統，而是工業發展造成更大的汙染。無論如何越域引水不一定要坳成跟什麼有關係，但我認為更重大、我們該管的是生態體系全面潰絕的內涵，這才是真正的原因。否則大家說炸山跟小林滅村沒有相關，所以我可以去搞越域引水，「那完蛋了，重點都沒有抓到。」</p>\n<p>台灣人的邪惡佔盡了善良人的便宜，因為科學上無法證明它，就像我們在搶救森林也是這樣，你無法證明開挖對山林有影響。「可是，我要怎麼去證明？」一個開發者不負責證明，卻要環境保護者去證明？</p>\n<p><strong>七種方法預警災難</strong><br>\n<p>一、由地面森林的結構，解讀特定地區的大變周期。例如我調查中橫後，斷定中橫每50年會有一次重大地變，因為那裏的原始森林沒有超過50年的。</p></p>\n<p>神木村有一棵樟樹神木，過去說1500年，現在說800年，那棵樹存在那裏的意義是什麼？至少800年來在那個地方以及周圍環境都安然無恙。阿里山神木號稱3000年，他存在的意義是代表從小苗開始，3000年長到這麼大，3000年來至少發生了50次九二一規模的地震，以及3000到1萬多個大小颱風衝擊。原始森林真的是我們的土地公、我們的守護神。</p>\n<p>二、從歷史災難來看。二萬坪平均一年崩33公分，這樣算下來，我預估70年內二萬坪會消失。</p>\n<p>三、由現地證據來看。例如中寮大地震掉下來一顆巨石，921時掉下來另一顆幾乎一模一樣的，恰好兩顆並排。那個地方就不能住人，因為它經常都在掉。</p>\n<p>四、礦石長期調查比對。我預測阿里山神木會倒，林務局派人跟我辯論，還好沒有幾年就倒了。南橫，1988年調查，2005再調查一次，相隔18年，已察覺到南部生態系統產生大退化。</p>\n<p>五、由學理推算跟推論。低海拔10年不去管它即恢復成森林，1991到1993年我推估阿里山茶農每賺一元，社會要付出7到44元成本。</p>\n<p>六、口述歷史。訪問耆老在地經驗。九二一地震後，阿里山林業鐵路垮了，花了1億2千萬，從阿里山舊火車站蓋一條路，10年完全沒用過，這次又垮了。蓋蚊子館至少還有蚊子館可以罵，現在連蚊子館都不見了，你要罵什麼？</p>\n<p>七、直覺跟全面邏輯思考。</p>\n<p><strong>政策殺神，工程殺人</strong><br>\n<p>台灣的造災歷史跟森林保育運動，這是政策殺神，工程殺人，台灣人自掘墳墓。我親眼目睹30年變遷，1980年代農業上山，觀光遊憩，土石橫流，現在進入最後一個階段，日本時代是農業台灣，工業日本，以台灣為前進基地。</p></p>\n<p>後面五、六十年，以農民培養工商，把台灣當反攻復國的平台。這代表的意義就是犧牲這裡所有的資源。除了伐木、採礦，過去主要是上山下海、河川截彎取直。上山就是開發山坡地，下海就是海埔新生地，原來河流寬度200公尺，又截流100公尺做河川新生地。</p>\n<p>你現在看什麼溫泉、房子倒下來，那個本來就會倒下來。台灣人向這塊土地超級高利貸，天公伯跟土地公請暴力討債集團來討債。農業上山已宣布無可藥救，只要有路到達的地方，台灣人拼經濟的精神，會拼死台灣。</p>\n<p>我好恨沒早生20年，如果台灣山林運動早20年，可能還有救，每一個都是血淚史。台灣如果沒有統獨之爭，不出二三十年絕對有實力走向世界先端，但我們政治再這樣搞下去，永遠沒有希望。</p>\n<p><strong>台灣的未來，美好文化的救贖與開創</strong><br>\n<p>大家來促成，做一套「國土永世計畫」。我們應該創造一套不管那個黨派當總統，都共同奉行的政策，全民的最大公約數。至少要做百年台灣才會有改變，你們現在聽到的花多少億做什麼的，很可能創造更大的災難。</p></p>\n<p>包括台灣土地第三次全面大改革，要擬定21世紀前瞻性的各種產業的應變計畫。山地土地全面回收改革。</p>\n<p>台灣本來就是災難專家，台灣要恢復清朝時期的在地鄉團，國家秘密研發的東西要漸漸轉移到民間，我們希望成立在地民團。</p>\n<p><strong>發起「地球自然公民黨」</strong><br>\n<p>這會是一個全球最軟性政黨，需要自然新宗教，所有宗教大融合，創設自然宗教大學。我只是不甘心，為什麼10個好的台灣人加起來會變成20件壞事，不能理解為什麼善良的民眾，為一些人世間的偏執所困擾。</p></p>\n<p>台灣至少有三到四成對政治無力感的人，他們不投票，可是他們對生活最講究，他們最在乎任何人對歷史的責任。</p>\n<p>我們比神還幸福，因為我們終將必死，因此我們的生命才有意義，也會讓我們活著的每一分每一秒，充滿爆炸式的生機，跟燃燒的快感。你們去拜祖宗為什麼要獻花，他的意義本質是什麼，代表一種凡來自土地，該虔誠地回報土地。</p>\n<p>大家千萬不要再捐錢了，九二一大地震還剩下45億，經過電視包裝後的捐錢好恐佈喔。我不是說你沒有慈善心，恰好相反，看到真正該捐的當然捐，可是千萬不要讓那些奴役善良的邪惡繼續得懲，該誰捐？大企業去捐。如果各位要捐錢，要捐給地球公民協會，要捐給自己，捐給知識、智慧、慈悲。</p>\n<p>&nbsp;</p>\n<p><span><strong>霸權、共業與災難</strong>（陳月霞）</span></p>\n<p>聽了陳玉峰老師的話，我想大家都已經血脈噴張，但我要說，路還很長，很多事等著我們去做，我要行雲流水地來跟大家分享。</p>\n<p>我念書時跟姐姐的孩子在阿里山走路，她才五歲，走到一半她跟我說，「阿姨，我腳好酸。」如果你聽到這種話，你會做什麼？</p>\n<p><strong>看不見的霸權</strong><br>\n<p>我看了她一眼，繼續走，說，「喔腳很酸是什麼形狀？」她一直想，三角形？四方形？她想半天不知道是什麼形狀。我又問，「那是什麼顏色？」正當他在想腳很酸是什麼形狀、顏色時，我們已走到上頭。</p></p>\n<p>當我們看見顏色、形狀，我們看到存在。但腳很酸沒有顏色、形狀，這就是我要談的共業與災難。只有災難有顏色有形狀，因為我們看到那個慘狀。如果水災是台灣共業，但我們看不到霸權。</p>\n<p>我女兒兩三歲時我跟她玩時，她說，「好渴喔」，我說，「喔真的喔，這杯白開水你拿去喝」，她喝了就去睡。光是想像就可以治癒很多事情。</p>\n<p>1987年我們住在水里，在濁水溪旁邊，上面有一個大觀發電廠，有陰陽河。我這一生最幸福的是，成年後還可以跟小孩繼續學習自然。下雨了，我們開始對話，雨把河流淋濕了，為什麼下雨呢？太陽奶奶在尿尿…。</p>\n<p>「媽媽那水為什麼白白的，我說，因為水在打架，水在跑時前面有一顆石頭，水給石頭擋住才打起來，白白水花就出來了，這是水的力量。我說，「你也是力量，你的力量讓我變得很勇敢」。她說，「你的力量讓我覺得很安全」。</p>\n<p><strong>與濁水溪的生死交關</strong><br>\n<p>高中時，我帶著妹妹、一個同學下到河中，第一腳踩下去，她說，「沒關係，水頂多到你膝蓋。」但往前走就愈來愈深，大晴天，水看起來沒在動，因為那是濁水，很多泥沙，好像很多針在刺你的腳，像螞蟻在咬。</p></p>\n<p>腳踩下去那水順便把你腳下的泥沙掏空，一直陷下去，已經到了腰部，進退不得。三個人緊緊相握不敢動，但不動還是繼續一直下去，你要喊救命已經沒有用，因為你只聽到溪谷的聲音，「你知道那多可怕嗎？」</p>\n<p>或許命不該絕，岸上有男生在烤肉，突然有一個人看到三個女生的頭，展開英雄救美。我們看到平靜的水是很可怕的，土石流是很可怕的。</p>\n<p><strong>霸權與共業</strong><br>\n<p>霸權是最無法感受到的，只有當你遭受到霸權的欺凌時你才會感受到霸權的存在。可是當你個人在行始霸權就不知道他存在，因為沒有形狀、顏色。性別、權貴、官僚的霸權。我要強調性別的霸權。</p></p>\n<p>今年1月29日我們去印尼遇到一位師父，他19歲出家，26歲建一個學校，因為他在路上看到一些女生沒上學，女孩說，因為家裡很窮，只有男生可以念書。他覺得這樣不對，於是他募款建學校，讓女生可以念書。</p>\n<p>有一次我跟他說，宗教都歧視女性。他看看我，「我們很尊敬女性啊。」我說，因為你是既得利益者，你當然會這樣說。如果你念過女人史，就知道古代女生如果很聰明，就說你是巫婆把你殺掉。你要活下去就要假裝自己很笨。</p>\n<p><strong>性別霸權</strong><br>\n<p>後來跟師父去看「公主與狗」，他解說給我聽，那裏有一個懸崖，公主本來已有心儀的愛人，但國王要把她嫁給別國的王子，公主牽著狗去跳海殉情，跳到半空中浮在那裏變成「公主與狗」。我問：「那她愛人死了嗎？」師父說，「沒有」。我說，「男人不如一條狗。」師父摸摸頭，不知道為什麼會變這樣。</p></p>\n<p>在那船上他頭撞到屋頂，我笑他，長這麼高做什麼，你看我這麼矮都不怕撞到。他想這女生為何一直在笑我。後來到一個村莊，他又撞到一個房子的屋頂，我說，因為你不夠謙虛，你到人家這，還把頭抬這麼高。很多佈道的人都高高在上，說給別人做，立了法官員都不必行使，只有百姓要行使。</p>\n<p>我去台大演講，他們說，「我們今天請到陳玉峰的太太來演講。」第二次去台南文化中心，主持人也叫我陳太太，我說我不是，因為是我要演講，你應該介紹，現在要演講的是陳月霞老師，剛剛演講的陳玉峰老師是他的先生。</p>\n<p><strong>你在行使霸權時有反省嗎？</strong><br>\n<p>霸權、災難、共業，通通都是我們造成的。在水里時一個朋友幫我出了一本書。是個好人，但桃芝颱風時，只有他沒跑，他說，我住在這裏20年了，不會有事的。因為這個男人的霸權，結果害了七口人全都死光了。</p></p>\n<p>有了台灣九一九活動？這樣台灣就沒事了嗎？如果可怕的霸權繼續存在，我們就會有災難。那是看不見的、沒顏色、沒形狀。今天全台灣人都在祈福，過了今天，是否我們繼續在蹂躝土地？我們要反省自己是否有什麼沒做到的。</p>\n<p><strong>人與土地的自然情操 </strong><br>\n<p>要有自然情操。自然與環保不一樣，自然是心靈的、對自然的體驗，發覺自然的奧妙之處。我們要謙虛、但不要謙卑，因為給父性霸權欺負很久了。我們在演講前去看了烏山頭水庫，看了八田與一的故事，最感動的是人與土地的情操。</p></p>\n<p>&nbsp;</p>\n<p><img alt height=\"206\" src=\"/sites/cet-taiwan.org/files/980919%20275.jpg\" width=\"310\" loading=\"lazy\"></p>\n<p><span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span><span>演講會後簽名活動</span></span></span><span><span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; (何俊彥攝)</span></span></p>"}, {"nid": 652, "title": "新聞：假造林、真砍樹？林務局否認", "original_topic": "假造林真伐木", "adopted_cats": ["森林守護與林業改革"], "content": "<p>&nbsp;</p>\n<p><span><strong>假造林、真砍樹？ 林務局否認</strong></span></p>\n<p>【聯合報╱記者曾懿晴／台北報導】2009.10.02 02:54 am</p>\n<p>&nbsp;</p>\n<p><span><strong><img alt height=\"220\" src=\"/sites/cet-taiwan.org/files/1002.jpg\" width=\"329\" loading=\"lazy\"></strong></span></p>\n<p><span>環保團體今年七月到花蓮瑞穗林道，勘查政府造林現況，發現林務局作法是「假造林、真砍樹」。<br>\n<p>圖╱地球公民協會提供</span></p></p>\n<p>&nbsp;</p>\n<p>地球公民協會日前到花蓮瑞穗林道實地勘查發現，林務局的造林計畫是將原有樹林砍伐後再種植小苗，以衝高植林績效。環保團體直斥「荒謬」，估計一年來林地受害面積已達兩百公頃。</p>\n<p>&nbsp;</p>\n<p>林務局則表示，造林地後期撫育疏伐，為必要的造林作業。為厚植森林資源及復育國土，獎勵輔導造林辦法採申請許可制，經審查若有造林必要才准造林，並無「砍大樹、種小樹」的情形。</p>\n<p>&nbsp;</p>\n<p>地球公民協會執行長李根政表示，政府從一九九七年推行全民造林運動，至二○○四年止，全台造林面積超過四萬五千公頃，相當於一二七一○個澄清湖棒球場。當時的造林方式就是先砍大樹，再栽種小樹苗，導致治山防洪大有問題。</p>\n<p>&nbsp;</p>\n<p>馬英九上任後在愛台十二項建設中，將造林計畫成效加碼到八年內在平地造林六萬公頃，每公頃每年補助十二萬元。農委會今年九月推出的獎勵輔導造林辦法，則規定每公頃二十年補助六十萬元。</p>\n<p>&nbsp;</p>\n<p>地球公民協會研究員楊俊朗指出，地球公民協會今年七月勘查花蓮瑞穗林道，卻發現林務局「假造林、真砍樹」；原本是森林的山區只剩下小苗、雜草，「造林區像極山頭上的癩痢頭。」</p>\n<p>&nbsp;</p>\n<p>楊俊朗指出，京都議定書中規範造林的土地不能為森林，且造林區前五十年應屬無林狀態，台彎現行狀況卻背道而馳。且新植小苗不僅無法「適地適種」，也違京都議定書規範的造林條件。</p>\n<p>&nbsp;</p>\n<p>環團呼籲監察院介入調查，林務局立即停止獎勵輔導造林辦法，避免台灣山林再遭破壞。</p>\n<p>&nbsp;</p>\n<p><a href=\"http://udn.com/NEWS/NATIONAL/NAT5/5171205.shtml\">http://udn.com/NEWS/NATIONAL/NAT5/5171205.shtml</a></p>\n<p>&nbsp;</p>\n<p>-------------------------------------------------------------------------------------------------------------------------------------------------------------</p>\n<p>&nbsp;</p>\n<p><strong>砸錢號召種小樹 獎勵造林幫倒忙</strong></p>\n<p>\n<p>【立報　記者胡慕情台北報導】</p></p>\n<p><img alt height=\"250\" src=\"/sites/cet-taiwan.org/files/1002-1.jpg\" width=\"360\" loading=\"lazy\"></p>\n<p><span>地球公民協會昨天發布在花蓮瑞穗林道拍攝的照片，指出林務局的造林政策根本是「砍森林、種小苗、兼灑除草劑」，只會危害生態、無助保育山林，將使國土萬劫不復。圖為地球公民協會執行長李根政。（圖文／郭晉瑋）</span></p>\n<p>&nbsp;</p>\n<p>88風災過後、國土保育成為重點，造林政策加速推行。地球公民協會昨天發布調查指出，林務局的造林政策是「砍森林、種小樹、兼灑除草劑」，危害生態更無法保育山林。</p>\n<p>\t地球公民協會執行長李根政沉痛表示，造林運動自賀伯颱風後啟動，為號召全民造林，訂定「獎勵造林實施要點」、一公頃20年發給53萬的獎勵制度，至2001年為止，已造林超過2萬7千公頃。</p>\n<p>\t李根政發現，林務局造林是先砍掉原始森林再種小苗，他不斷陳情，要求將補償金做為限制伐木補償，但歷經國、民兩黨執政時期，政策都未改變。直到李根政與現任林務局長顏仁德雙雙在前行政院長游錫面前辯論，游錫驚覺造林政策錯誤才下令廢止。</p>\n<p>\t馬政府上任後，「獎勵造林實施要點」又復活。地球公民協會研究員楊俊朗今年7月實地前往林務局造林最大範圍的花蓮瑞穗林道現勘，發現未造林處鬱鬱蔥蔥，但林務局造林處卻寸草不生。</p>\n<p>\t楊俊朗深入調查後發現，林務局造林必須先開路、將原始森林砍掉，或是放火燒山，山林遭到開腸破肚。林務局種下的小苗也非原生樹種，如砍掉原始殼斗科森林，卻種下楓香、無患子等林木，甚至還有外來種，這種造林方式每公頃還得花60萬。</p>\n<p>&nbsp;</p>\n<p>\t林務局為了讓後植樹長得比原始樹種好，不惜花6年時間定時除草、噴除草劑。立委田秋堇痛批，噴除草劑將造成原始樹種在地下的種子死亡、生物滅絕，「更可怕的是，除草劑含會造成性別錯亂的環境荷爾蒙，這些藥劑若進入地下水怎麼辦？」</p>\n<p>\t地球公民協會在風災後走訪災區，訪談時發現，居民都指向林務局過往不當移植林木是造成山林崩塌的原因。小林村潘姓倖存居民直指：「以前是闊葉林，林務局把它砍掉種竹子！」</p>\n<p>\t據地球公民協會統計，87至93年以來，林務局以砍大樹種小苗的方式，每年造林6千5百公頃。楊俊朗指出，國際對造林有嚴格規範，如依《京都議定書規定》，造林地必須在50年內都不是森林，欲造林者必須提出衛星照片和土地地籍資料進行比對，但台灣完全沒有管理機制。</p>\n<p>\t台灣蠻野心足生態協會秘書長林子凌以「山林中的病毒」形容林務局。林子凌指出，林務局光在花蓮瑞穗林道就掌管533個林班地，達31萬多公頃，全民不該放任林務局砍樹造林。要求林務局造林前應提出造林前共砍多少樹、檢視過去造林地有多少順利長成次生林等資料供大眾檢視。</p>\n<p>\t荒野保護協會秘書長林金保說「其實山比人會造林。」只要放任土地不作人為干擾，自會長出森林。但林務局造林政策並未區分經濟地或保育地，使得國土保安的地也被拿來造林，造成砍樹後果，是政策的大錯誤。</p>\n<p>\t李根政感嘆，每造林1百公頃就要砍掉10萬棵樹，政府花錢造林卻造成山林國土破碎，林務局應負起全責。地球公民協會強調，全民造林運動應立刻停止、將造林補償費用移轉做為山林所有人限制砍伐的補償，也要求監察委員介入調查，不該放任林務局做為釀災原凶。</p>\n<p>&nbsp;</p>\n<p><a href=\"http://www.lihpao.com/news/in_p1.php?art_id=34323\">http://www.lihpao.com/news/in_p1.php?art_id=34323</a></p>\n<p>&nbsp;</p>\n<p>-------------------------------------------------------------------------------------------------------------------------------------------------------------------</p>\n<p><strong>瑞穗林道假造林？</strong><strong> </strong><strong>花蓮林管處：派員調查</strong></p>\n<p>（中央社記者林思宇、劉嘉泰1日綜合報導）</p>\n<p>&nbsp;</p>\n<p>地球公民協會今天質疑，農委會林務局推動的獎勵造林政策，造成花蓮瑞穗林道假造林、真伐木現象。花蓮林區管理處表示，已派員調查，如涉違法將移送法辦。</p>\n<p>\t地球公民協會今天在立法院召開記者會，公布在今年7月勘查花蓮縣瑞穗林道的調查結果。</p>\n<p>\t地球公民協會發現，在林道7公里至8公里處林木經伐除後，新植楓香樹、陰香樹約4公頃。其中陰香為外來種，是林務局在921大地震後從中國引入苗木，混充台灣土肉桂樹在全台造林，極可能嚴重危害本地生態。</p>\n<p>\t地球公民協會表示，瑞穗林道所發生的「砍大樹、噴除草劑、種小苗」現象，是林務局所推動的獎勵造林政策的後果，預計要執行100公頃。</p>\n<p>\t花蓮林管處副處長陳天寶表示，瑞穗林道現有1家業者申請租地造林，目前進行整地工程，依規定申請造林不得砍掉大樹，林管處已派員前往調查是否有砍大樹的情形，如果有違規狀況將依規定處罰，如果涉及違法，將依法移送法辦。</p>\n<p>\t針對引入外來樹種的問題，陳天寶強調，林管處絕對不可能引入外來苗木做為造林樹種，現有租地造林的樹種都是使用花蓮苗圃所提供的本地苗木，並沒有任何外來樹種苗木。</p>\n<p>\t陳天寶強調，林管處人員現仍在調查中，預計在中秋節後可彙整相關資料，釐清造林業者是否違規或違法。981001</p>\n<p>&nbsp;</p>\n<p><a href=\"http://www.cna.com.tw/SearchNews/doDetail.aspx?id=200910010165\">http://www.cna.com.tw/SearchNews/doDetail.aspx?id=200910010165</a></p>\n<p>&nbsp;</p>\n<p>-----------------------------------------------------------------------------------------------------------------------------------------------------------------</p>\n<p><strong>搶救山林</strong><strong> </strong><strong>綠委籲停止獎勵輔導造林辦法</strong><strong>&nbsp;</strong></p>\n<p><strong>&nbsp;</strong>（中央社記者黃名璽台北1日電）</p>\n<p>&nbsp;</p>\n<p>地球公民協會與民進黨籍立委田秋堇今天表示，希望行政院長吳敦義停止「獎勵輔導造林辦法」，避免因錯誤政策而「假造林、真砍樹」，破壞山林環境。</p>\n<p>\t田秋堇與地球公民協會上午在立法院召開記者會指出，獎勵輔導造林辦法造成為求造林業績、先砍大樹現象，又噴灑大量除草劑，造成環境荷爾蒙過量；田秋堇認為「這不是造林，是造孽」。</p>\n<p>\t田秋堇指出，獎勵輔導造林辦法在前行政院長游錫堃任內被停止，但總統馬英九上台後，又繼續這項錯誤政策；呼籲吳敦義儘速停止這項政策。</p>\n<p>\t地球公民協會執行長李根政表示，獎勵輔導造林辦法是在國民黨過去執政時實施，2004年民進黨執政時停止，沒想到國民黨重新執政後，竟然又再實施這項危害山林政策，恐造成山林萬劫不復。</p>\n<p>\t地球公民協會研究員楊俊朗說，日前赴花蓮瑞穗山區實勘，發現這個山區根本就是森林，何需造林？為了造林獎勵輔導，山區大樹被砍掉，改成種植多種類小苗，甚至還有外來種，且造林區只見草、沒有樹，這項政策根本是「假造林、真砍樹」。</p>\n<p>\t與會者呼籲立即停止獎勵輔導造林辦法，避免台灣山林遭受無辜破壞；將相關經費移轉至「限制伐木補償」，保護既有森林；並希望監察委員積極介入調查本案。981001</p>\n<p>&nbsp;</p>\n<p><a href=\"http://www.cna.com.tw/SearchNews/doDetail.aspx?id=200910010073\">http://www.cna.com.tw/SearchNews/doDetail.aspx?id=200910010073</a></p>\n<p>&nbsp;</p>"}, {"nid": 654, "title": "【公民行動影音紀錄】假造林 真造業 林務局是這樣造林的", "original_topic": "假造林真伐木", "adopted_cats": ["森林守護與林業改革"], "content": "<p></p>\n<p>地球公民協會<span class=\"new_mid_word_large\">在立法院召開記者會，公布勘查瑞穗林道的調查結果</span>，發現林務局「砍大樹、噴除草劑、種小苗」。</p>\n<p>地球公民協會於<span class=\"new_mid_word_large\">十月一日在立法院召開記者會，公布在今年7月勘查花蓮縣瑞穗林道的調查結果</span>， 發現「砍大樹、噴除草劑、種小苗」是農委會林務局所推動的獎勵造林政策，在本區預計要執 行100公頃。政府花大錢，鼓勵砍伐原有森林，再種小樹苗，不僅破壞生態又與「京都議定書」的造林規範嚴重背離，可以說是全盤皆輸。在台灣山林遭受莫拉克 颱風侵襲後的今天，林務局如果執迷不悟，讓一錯再錯的造林政策繼續蹂躪已經面目全非的台灣山林，將使我們的國土萬劫不復！</p>\n<p>並提出三訴求:</p>\n<p>1.立即停止「獎勵輔導造林辦法」</p>\n<p>2.將經費移轉「限制伐木補償」</p>\n<p>3.監察委員介入調查本案</p>\n<p>&nbsp;</p>\n<p>資料來源：<a href=\"http://www.mediawatch.org.tw/civicmedia/?p=3176\">公民行動影音紀錄資料庫</a></p>"}, {"nid": 665, "title": "刪除造林預算 永保國土安康〈聲明〉", "original_topic": "假造林真伐木", "adopted_cats": ["森林守護與林業改革"], "content": "<p><img alt height=\"339\" src=\"/sites/cet-taiwan.org/files/091029_0.jpg\" width=\"660\" loading=\"lazy\"></p>\n<p></p>\n<p>種樹在台灣是一種被普世認同與稱讚的美德，近十年來，種樹造林更被林業專家賦予「治山防洪」的重責大任，同時「聯合國氣候變化框架公約」也規範造林為有效 的減碳方式之一。但是台灣1997~2004年推行的「全民造林」運動以及2008年推出的「獎勵輔導造林辦法」，實際執行方法不當，例如；砍大樹，改種 小樹苗；未考慮適地適種；引進外來種；人工栽植的成效比不上自然演替等，不僅無法治山防洪，也無減碳效果。</p>\n<p>根據「聯合國氣候變化框架公約」制定的<strong>「造林與再造林方法學」</strong>的第二項條件，<strong>「造林的土地，在造林活動前至少</strong><strong>50</strong><strong>年處於無林狀態」</strong>，但是，台灣的山林顯少有空白地可以符合這項條件；同時「獎勵輔導造林辦法」僅考慮造林成活率做為獎勵金給付的判斷標準，缺乏類似「造林與再造林方法學」的嚴謹計算與執行機制，例如，以航照圖或衛星照片證明，造林前該土地處於無林狀態。</p>\n<p><img alt height=\"281\" src=\"/sites/cet-taiwan.org/files/met36-1.jpg\" width=\"374\" loading=\"lazy\"></p>\n<p>如此<strong>鬆散的「獎勵輔導造林辦法」，導致政府花大錢，鼓勵林農砍伐原有林木改種小樹苗，不僅破壞生態又與「聯合國氣候變化框架公約」的造林規範嚴重背離，可以說是全盤皆輸的國際大笑話。</strong></p>\n<p>（確實案例：<a href=\"http://met.ngo.org.tw/node/650\">花蓮瑞穗林道 假造林真伐木 </a>）</p>\n<p>時值中央政府新年度預算審核之際，地球公民協會懇求立法院基於愛鄉、愛土與國際潮流接軌的前提下，籲請立法院刪除林務局99年度工作計畫「林業發展」，分 支計畫「補助林務發展及造林基金」之新植造林700公頃獎補助費117,000千元。將其經費移轉至限制伐木，保護既有森林。</p>\n<p><strong><span>我們的證據與主張： </span></strong></p>\n<p></p>"}, {"nid": 666, "title": "十七年的自然公園之夢", "original_topic": "國土治理", "adopted_cats": ["森林守護與林業改革", "國土計畫"], "content": "<p>文/圖☉李根政（地球公民協會執行長）</p>\n<p><img alt height=\"284\" src=\"/sites/cet-taiwan.org/files/met36.JPG\" width=\"387\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>柴山保護政策有了重大轉向。由於陳菊市長希望將柴山（壽山）劃為國家級自然公園，以防止土地標售及礦業開採，吳敦義院長已指示將柴山劃為國家自然公園。目前，營建署正著手進行國家公園修法，賦予「國家自然公園」法律位階，同時評估其範圍。</p>\n<p>&nbsp;</p>\n<p>對於歷任市長來說，柴山是無法迴避的問題，除了民間團體鍥而不捨的監督，更因為柴山是高雄人維繫身心靈健康的聖地，從清晨到晚上，無分平日、假日，登山人口 每天數以萬計。以全台格局來看，柴山只是座小山，但面積約1,200多公頃已然超過全高雄市公園綠地的總和，其豐富的自然、人文生態價值更是無可取代。</p>\n<p>&nbsp;</p>\n<p>1992 年，一群熱愛柴山的市民開始推動柴山自然公園，17年來，從吳敦義市長乃至謝長廷（代理市長陳其邁、葉菊蘭）、陳菊等歷任市長，對於柴山的法令建置及保護 工作雖略有作為，但自然公園之範圍、管理機制始終仍處於規劃階段。17年來，除了濫墾違建、桃源里土地爭議、寺廟擴建、中山大學、台泥開發案等陳年舊帳， 更衍生遊憩壓力日增、外來種入侵、人猴大戰、野狗等課題。「民間抨擊政府，政府發動淨山」已成固定反應的模式，市府始終喊著缺人、錢與權，相隔十幾年的前 後任市長，想必都體會到了這種困境，以致對於納入國家公園體系立即有共鳴。</p>\n<p>&nbsp;</p>\n<p>的確，納入國家公園體系後，由內政部來協調國有財產局、國防部、林務局等中央機關，可終結多頭馬車的現象；引入中央之資源、權力（警察權），可迅速建立實質管理的專責機構。因此，就民間立場，當然給與支持。</p>\n<p>&nbsp;</p>\n<p>然而，從1989年軍方開放部分區域供民眾登山遊憩後，20年來的柴山亦累積可觀的市民文化，諸如自動自發的保護獼猴、撿垃圾、背水奉茶；監督政府、自辦教育、解說、清除外來種等，此一原汁原味的市民自治文化，實應納入自然公園的規劃。</p>\n<p>&nbsp;</p>\n<p>同時，考量2010縣市合併後大高雄的永續發展，建議可考慮擴大自然公園之範圍，納入旗后山、永安、茄萣溼地，以及同屬高位珊瑚礁之大、小岡山等，名稱則可 由大高雄人民票選產生，「大高雄國家自然公園」可以是選項。另外，由於自然公園範圍已採取「跳島」式之規劃，建請中央政府支持地方進行綠廊之建設，將每個 生態孤島串接為大高雄綠色網絡。</p>\n<p>&nbsp;</p>\n<p>前後任高雄市長，不分藍綠、超越黨派的關注一座山的保護工作，是台灣難得的社會共 識，期望這十七年的自然公園之夢，真的可以實現。更期望在國家資源、權力全面介入經營管理時，能夠考量到落實在地化、民眾參與，才是真正永續的保育方案。 十七年了，或許我們已錯失了由地方政府和民間創建保育新典範之機會，但仍高度期待此一國家自然公園能夠維持、發揚柴山市民自治之精神，創建台灣保育新文 化。</p>\n<p>&nbsp;</p>\n<p>1907年，柴山是日治時期全台灣第一個成立的保安林，如果2010年，柴山能夠成為全台第一個國家自然公園，並做為縣市合併之歷史紀念，將成環保政治里程碑。</p>\n<p>&nbsp;</p>"}, {"nid": 672, "title": "新聞：苗栗造橋、通霄 假造林真伐木", "original_topic": "山林水土;假造林真伐木", "adopted_cats": ["森林守護與林業改革"], "content": "<p><strong>地球公民協會 疾呼停止政策</strong></p>\n<p>【2009.11.26自由時報報導】</p>\n<p><span><strong>砍大樹種小樹 獎勵造林變調 </strong></span></p>\n<p><span></span></p>\n<p>〔記者劉力仁、鍾麗華／綜合報導〕</p>\n<p>地球公民協會昨天批評林務局獎勵造林政策不當，林地地主為獲得「獎勵造林」補助費用，竟砍掉原有林地，改種小樹苗，演變成「砍大樹種小樹」悲劇，要求林務局更改荒謬政策。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"203\" src=\"/sites/cet-taiwan.org/files/met1126_0.jpg\" width=\"309\" loading=\"lazy\"></p>\n<p><span>地球公民協會勘查苗栗通霄鎮福龍里發現左邊造林地區，因砍大樹一片枯寂，景象慘不忍睹。</span></p>\n<p><span><span>（地球公民協會提供</span>）</span></p>\n<p>&nbsp;</p>\n<p><strong>苗縣造橋通霄 林木一片死寂</strong></p>\n<p>地球公民協會執行長李根政表示，上月初與立委及環保團體揭露花蓮瑞穗林道假造林真伐木事件後，十一月十九日勘查苗栗縣造橋、通霄等地，發現苗栗縣造橋鄉豐湖村、通霄鎮福龍里、通霄鎮圳頭等地區，跟花蓮情況如出一轍，現場慘不忍睹、草木一片死寂。</p>\n<p>&nbsp;</p>\n<p><strong>地球公民協會 疾呼停止政策</strong></p>\n<p>地球公民協會研究員楊俊朗表示，林務局去年推出的「獎勵輔導造林辦法」，地主若配合造林，每公頃每年補助三萬，二十年可獲六十萬補助，因此許多地主乾脆把原本林地砍伐掉，配合林務局辦法重新種樹，原要造林的美意，變成砍樹活動，在苗栗已執行了二十五公頃。去年編列五百公頃預算，明年編了七百公頃預算，如不停止這項政策，遭濫砍的林木會更多。</p>\n<p>&nbsp;</p>\n<p>綠黨發言人潘翰聲建議，仿照屏東縣政府鼓勵林地地主十年內不砍樹，縣政府補助地主費用方式，將獎勵造林之經費移轉「限制伐木補償」，保護既有森林。</p>\n<p>&nbsp;</p>\n<p>林務局則表示，獎勵輔導造林辦法採申請許可制，經主管機關審查有造林必要者，才會許可造林，不會有「砍大樹、種小樹」的情形。</p>\n<p>&nbsp;</p>\n<p>林務局指出，苗栗縣造橋鄉及通霄鎮等三處造林地，經查皆為私有山坡地農牧用地，原可為農作使用，農民為國土保安配合獎勵輔導造林政策參與造林，其在土地使用上係屬降限使用。民眾原本土地栽種果樹或檳榔，與其任其荒廢，鼓勵山坡地造林，反而更可厚植森林資源。</p>\n<p><a href=\"http://www.libertytimes.com.tw/2009/new/nov/26/today-life7.htm\">http://www.libertytimes.com.tw/2009/new/nov/26/today-life7.htm</a></p>\n<p>-------------------------------------------------------------------------------------------------------------------------------</p>\n<p>【2009.11.25中央通訊社報導】</p>\n<p>（中央社記者楊淑閔台北25日電）</p>\n<p><span>地球公民協會今天質疑林務局獎勵造林出現「假造林，真伐木」領取補助。林務局解釋，那片土地是私有地，原栽</span>種果樹及檳榔樹，改植原生種樹木造林，較有利山坡地保育。</p>\n<p>&nbsp;</p>\n<p>地球公民協會執行長李根政今天表示，日前他們到苗栗縣造橋鄉、通霄鎮等多處，發現行政院農委會林務局獎勵造林地上，都先將大樹砍掉後再造林領取補助，是「假造林真伐木」，應立即停止。</p>\n<p>&nbsp;</p>\n<p>&nbsp;林務局指出，地球公民協會質疑的假造林地點苗栗縣造橋鄉及通霄鎮等 3處造林地，經查皆為私有山坡地農牧用地，原可為農作使用，農民為國土保安配合獎勵輔導造林政策而參與造林。</p>\n<p>&nbsp;</p>\n<p>林務局並說，這些土地原本栽種果樹或檳榔，因缺乏照顧，與其任其荒廢，不如鼓勵山坡地造林，可厚植森林資源，發揮公益效能；而且改植復育樹種為台灣原生樹種，例如烏心石、樟樹、台灣櫸及台灣肖楠等，也較深耕土壤，有利山坡地復育。981125</p>\n<p><a href=\"http://www.cna.com.tw/SearchNews/doDetail.aspx?id=200911250325\"><span>http://www.cna.com.tw/SearchNews/doDetail.aspx?id=200911250325</span></a></p>\n<p>&nbsp;</p>\n<p>----------------------------------------------------------------------------------------------------------------------------------</p>\n<p>【2009.11.26<strong>大紀元</strong> 】</p>\n<p><strong>造林政策不當 民間籲修獎勵辦法</strong></p>\n<p>&nbsp;</p>\n<p>【記者林秀麗╱台北報導】環保公益團體發現苗栗縣3個山區去年砍大樹，今年種小苗，申請造林獎勵金的情形。立委與民間團體提醒林務局不當的造林政策濫砍林木、破壞生態，與國際規範背離且助長溫室效應，並呼籲政府相關單位正視並積極調查，只有維護山林，才能保護國土，也可促進就業機會。</p>\n<p>&nbsp;</p>\n<p>1997年起的「全民造林運動」在環保團體揭發其不當性，2004年即暫停實施，去年林務局再度提出獎勵輔導造林。而地球公民協會於11月19日勘查苗栗縣造林情形，結果發現造橋鄉、通宵鎮共3處「開路、砍大樹、噴殺草劑、種小苗」，大規模破壞原本濃密的樹林，被砍伐後又噴2個月殺草劑，現場一片枯寂，這是繼今年7月1日勘查花蓮瑞穗林道沿線造林工作，嚴重伐木的情形又一樁。背離了國際規範造林「聯合國氣候變化框架公約」。</p>\n<p>&nbsp;</p>\n<p>地球公民協會表示，農委會林務局所推動的獎勵造林政策，在苗栗縣已經執行25公頃。政府花大錢，鼓勵砍伐原有森林，再種小樹苗，不僅破壞生態，又與「聯合國氣候變化綱要公約」的造林規範嚴重背離，可以說是全盤皆輸。</p>\n<p>&nbsp;</p>\n<p>綠黨發言人潘翰聲表示，土地公比人更照顧土地，林務局以「人定勝天」這樣不當的造林政策，只有造成破壞土地、大自然的反撲。</p>\n<p>&nbsp;</p>\n<p>立法委員田秋堇指出，台灣林務局要有新思維，國家關心土地是基本面，不應用造林做業績，又使用國際已禁用的殺草劑，也造成人、動物受「環境荷爾蒙」危害，林務局加碼預算只會破壞台灣森林。</p>\n<p>&nbsp;</p>\n<p>與會團體，包括荒野保護協會，一致希望政府研議修改「獎勵輔導造林辦法」，並將經費移轉「限制伐木補償」，保護既有的森林，更籲請監察委員著手調查此案。</p>\n<p>&nbsp;</p>\n<p>農委會主委陳武雄於表揚97年度「十大農產品外銷績優廠商」時表示，「不清楚苗栗造林事件，但絕不能有砍大樹、種小苗的情形，將查明詳細情形。」</p>\n<p><a href=\"http://news.epochtimes.com.tw/9/11/26/127013.htm\">http://news.epochtimes.com.tw/9/11/26/127013.htm</a></p>\n<p>&nbsp;</p>\n<p>-----------------------------------------------------------------------------------------------------------------------------------</p>\n<p>【2009.11.25 <strong>公視晚間新聞</strong><span>】&nbsp;</span></p>\n<p><strong>火燒兼下藥 破壞林地竟稱是造林</strong>(影音)</p>\n<p>一眼望去，森林被燒得面目全非，還連續噴了兩個月的除草劑，原本茂密的相思林已經寸草不生，苗栗縣通霄鎮福龍里地主，破壞這片山坡地的目的，竟然是為了造林。參加林務局的獎勵造林，每公頃20年可以領60萬，砍大樹、種小樹，同樣也發生在圳頭及造橋鄉豐湖村，整片山坡地已經光禿禿。環保團體質疑，造林政策成了破壞水土的元凶，林務局則說，他們負責的是種樹之後的獎勵，至於地主要砍樹、無從管起。環保團體表示，根據聯合國規範，造林土地至少要有五十年處於無林狀態，相較之下台灣的造林卻毫無標準，去年的獎勵面積全台就有500公頃，今年還要追加，這片土地要因此付出多少代價?難以估計。記者林珍汝莊志成台北報導。</p>\n<p><a href=\"http://www.pts.org.tw/php/news/pts_news/detail.php?NEENO=133671\">http://www.pts.org.tw/php/news/pts_news/detail.php?NEENO=133671</a></p>\n<p>&nbsp;</p>\n<p>---------------------------------------------------------------------------------------------------------------------------------------</p>\n<p>【2009.11.25<strong>民視新聞</strong>】</p>\n<p><strong>造林?苗縣爆砍大樹、種小苗 </strong></p>\n<p>&nbsp;</p>\n<p>馬政府上任，在愛台12建設中積極推動造林計畫，不過卻被環保團體踢爆，林務局在苗栗大肆砍伐樹林、噴除草劑，再來改種小樹苗，造林口號根本是喊假的，立委田秋菫更痛批，馬政府是造成山坡地土石流的元兇。</p>\n<p>&nbsp;</p>\n<p>一整片光禿禿的坡地原本是位在苗栗通宵鎮，面積達2公頃的茂密樹林，今年11月，環保團體卻發現，林務局說要推動的造林計畫，卻讓美麗森林變了樣，痛批馬政府上任後說要節能減碳、造林口號，卻是喊假的，立委田秋菫要馬總統別再裝聾作啞。</p>\n<p>&nbsp;</p>\n<p>造林計畫成了四處濫墾濫伐，媒體追問，連林務局長自己也狀況外，推動環保綠化，民眾還能期待誰來替國土把關?</p>\n<p>&nbsp;</p>\n<p><a href=\"http://news.ftv.com.tw/?sno=2009B25L12M1&amp;type=Class\">http://news.ftv.com.tw/?sno=2009B25L12M1&amp;type=Class</a></p>"}, {"nid": 693, "title": "苗栗山林的呼喚", "original_topic": "無", "adopted_cats": ["森林守護與林業改革"], "content": "<p>文☉李根政(地球公民協會執行長)</p>\n<p><img src=\"/sites/cet-taiwan.org/files/IMG_3223.JPG\" alt width=\"379\" height=\"254\" loading=\"lazy\"></p>\n<p>（2009.5.18攝）</p>\n<p><strong>無用之用--山黃麻林：</strong></p>\n<p>多山的苗栗，因為頻繁的伐木、造林，很少可以看到美麗的天然林，130號線道大湖、三義鄉鎮界限往西約1公里處，線道兩側次生林（估計自然復育15年）林相完整優美。楊國禎副教授說明，由於瓦斯取代薪柴，讓這裡得以自然演替為次生林，這片森林裡主要的植物是山黃麻、白袍子、江某、香楠、台灣山桂花、九節木、月桃、金狗毛蕨等，還可以聽到竹雞、小彎嘴畫眉、五色鳥、樹鵲的叫聲。這片次生林維持了生物多樣性，多層次的植被也保護了水土。但是，許多林業人員從木材利用的角度來看，聲稱：這樣的森林一點價值也沒有。</p>\n<p>---------------------------------------------------------------------------</p>\n<p>&nbsp;</p>\n<p>因為調查伐木養菇和造林的議題，我們把目光投向了苗栗這個多山的地區。</p>\n<p>&nbsp;</p>\n<p>苗栗有全台灣數量最多的碎木工廠，伐木商皆伐山坡地上的森林，再由碎木工廠將木頭粉碎為木屑，源源不絕的送到製包廠做成太空包，供應養菇業者，我們估計苗栗每年的伐木面積可能高達數百公頃；同時，這裡是2008～2009年全台灣申請造林面積第二名的縣市（45公頃），絕大多是地主先將森林賣給伐木商，全面皆伐後再向政府申請獎勵造林。</p>\n<p>&nbsp;</p>\n<p>2009年，我們前後跑了四趟苗栗，看了許多伐木造林地，即便行車過程也隨處可見新鮮的伐木區和伐木後形成的草生地。2009年5月，邀請植物生態學者楊國禎副教授前往苗栗通宵、苑裡、銅鑼、泰安一帶勘查，車行約200公里，勘查了數個伐木造林跡地。楊教授有一個概要的觀察：<strong>「沿途沒有一片超過</strong><strong>30</strong><strong>年的森林。」</strong>除了農耕地外，絕大部分地區的植被是相思林、造林地、桂竹林與伐木後形成的芒草地，還有極少數的其他雜生次生林等，這是個頻繁翻土、擾動的不安土地。</p>\n<p>&nbsp;</p>\n<p>以下分享通霄鎮二個造林案例，從中探討現今山林問題。</p>\n<p>福龍里北勢窩段。該地主為「ＯＯ祭祀公業」，面積約7.5公頃的土地，屬山坡地保育區中的農牧用地，山體呈現一個ㄇ字形，坡度約在20-40度不等，原本是一片相思樹林，2008年伐木後形成草生地，部分為小花蔓澤蘭覆蓋。伐木後地主向縣府林務科申請獎勵造林，林務科現勘後認定此造林前地況為「草生地，部分桂竹及小花蔓澤蘭」，於是核淮其造林，提供的苗木是茄冬及櫸木，業主為了怕雜草叢生影響苗木生長，把殘存樹頭弄死（現場有些焚燒樹頭痕跡），甚至雇工噴灑殺草劑「巴拉刈」。此舉其實非常費工、花錢，顯見業者非常努力的想要照顧好苗木（照片一、二）。</p>\n<p>&nbsp;</p>\n<p>經過這一番努力，廣大的林地上絕大部分是裸露地、焦黑的枯草，還有局部的崩塌，現場可說是慘不忍睹。</p>\n<p>相較之下，陵線西側未實施伐木、造林的地區，相思樹高約10公尺密佈成林，對比非常強烈。</p>\n<p>&nbsp;</p>\n<p><img src=\"/sites/cet-taiwan.org/files/981119%20311.jpg\" alt width=\"289\" height=\"192\" loading=\"lazy\">&nbsp; <img src=\"/sites/cet-taiwan.org/files/981119%20356.jpg\" alt width=\"289\" height=\"191\" loading=\"lazy\"></p>\n<p>照片一、二、通宵鎮北勢窩段某祭祠公業造林地，2009.11.19。</p>\n<p>&nbsp;</p>\n<p>去年冬至（12月22日）那天，偕同田秋堇立委和林務局人員等到苗栗通宵勘查林地，一下車映入眼簾的是另外三片造林地（照片三、四），照片中的左側那片裸露地是櫸木造林地，遠處的那片是苦楝造林地，前方及右側的也是苦楝造林地，原是相思樹林。根據現場遺留的樹頭及新竹縣林務人員的解說，這些原來都是相思林，經全面皆伐後進行整地，屬2009年核准的造林案，獎勵造林政策更已形成農牧用大規模伐木的誘因。（如表1）。</p>\n<p>從照片中可以看得出來，坡度很陡，現場量測右邊的林地，坡度約在35度左右，這樣大規模的伐木、整地，竟然都不需要任何申請，實在令人匪夷所思，也難怪要土石橫流了。</p>\n<p>&nbsp;</p>\n<p><table></p>\n<p><tbody></p>\n<p><tr></p>\n<p><td></p>\n<p>地段</p>\n<p></td></p>\n<p><td></p>\n<p>地號</p>\n<p></td></p>\n<p><td></p>\n<p>造林面積(公頃)</p>\n<p></td></p>\n<p><td></p>\n<p>樹種</p>\n<p></td></p>\n<p><td></p>\n<p>備註</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>通霄鎮北勢窩</p>\n<p></td></p>\n<p><td></p>\n<p>797</p>\n<p></td></p>\n<p><td></p>\n<p>1.35</p>\n<p></td></p>\n<p><td></p>\n<p><strong>烏心石、榉木、無患子</strong></p>\n<p></td></p>\n<p><td></p>\n<p>農牧用地</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>通霄鎮北勢窩</p>\n<p></td></p>\n<p><td></p>\n<p>801-1、776</p>\n<p></td></p>\n<p><td></p>\n<p>0.9</p>\n<p></td></p>\n<p><td></p>\n<p><strong>苦楝、榉木、無患子</strong></p>\n<p></td></p>\n<p><td></p>\n<p>農牧用地</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>通霄鎮北勢窩</p>\n<p></td></p>\n<p><td></p>\n<p>777</p>\n<p></td></p>\n<p><td></p>\n<p>0.4</p>\n<p></td></p>\n<p><td></p>\n<p><strong>苦楝</strong></p>\n<p></td></p>\n<p><td></p>\n<p>農牧用地</p>\n<p></td></p>\n<p></tr></p>\n<p></tbody></p>\n<p></table></p>\n<p><strong>表</strong><strong>1.</strong> 通霄鎮北勢窩段2009年核准造林地，苗栗縣政府提供。</p>\n<p>&nbsp;</p>\n<p><img src=\"/sites/cet-taiwan.org/files/met04-2_0.jpg\" alt width=\"471\" height=\"172\" loading=\"lazy\"></p>\n<p>照片三、通宵鎮北勢窩段三個造林地，2009.12.22。</p>\n<p>&nbsp;</p>\n<p><strong>山坡地保育三不管</strong><strong>&nbsp;</strong></p>\n<p>上述的土地都屬山坡地保育區農牧用地，為什麼山坡地保育區可以允許全面皆伐森林、整地、開路、造林？</p>\n<p>&nbsp;</p>\n<p>以10至20年為週期，頻繁的伐木、整地、造林，珍貴的表土流失非常驚人，長期下來必然導致土壤益加貧瘠，有些地方則避免不了較大的崩塌，如果加上極端氣候、暴雨等因素，將來難免會產生大災難。</p>\n<p>&nbsp;</p>\n<p>當我們揭露了苗栗地區的伐木造林案，林務局聲稱，農牧用地的伐木行為，他們管不著。然而，林務局該管的是「森林」本身，而不在使用地別，該局顯然是刻意的限縮解釋了森林法。</p>\n<p>&nbsp;</p>\n<p>再者，依水土保持法第9條、第12條之規定，農牧用地之經營或使用應實施水土保持之處理與維護:水土保持義務人應先擬具水土保持計畫送請主管機關審核後實施。</p>\n<p>&nbsp;</p>\n<p>在農牧用地上的伐木造林活動必然涉及「修築農路」或「整坡作業」，農委會水土保持局和地方政府實屬責無旁貸。然而，長期以來，水土保持局忙著自己做工程，根本不管制山坡地的伐木造林活動，許多地方政府也長期怠忽職守，或迫於民眾、民代壓力，執法寬鬆。</p>\n<p>&nbsp;</p>\n<p>據了解，在苗栗地區一公頃的森林賣給伐木業者，價值只有3萬元左右，相當於上班族一個月的薪水，而這一公頃的森林，大約有數百至上千棵的樹木，需十至數十年方能長成。農林產品與工商所得的巨大落差，益加凸顯了農林從事者的經濟弱勢，如果國家真的重視山林保育，不可能拿不出錢來保護森林，給與農民限制伐木的合理補償。</p>\n<p>&nbsp;</p>\n<p>台灣對工業部門的補貼、道路等公共工程出手闊綽，例如，政府為開發科學園區至少已貸款1500億以上，蘇花改預估要花400億，國道七號要花660億……，但是，保護森林免於被砍伐就拿不出錢來？</p>\n<p>&nbsp;</p>\n<p>屏東縣政府有鑑於縣境內伐木情況嚴重，從2007年開始為了保護既有的森林，制定了十年限制伐木的補償辦法，鼓勵申請伐木的地主接受3～6萬的補償費，因而保護了近300公頃的森林，實在值得中央政府及各縣市政府參考。</p>\n<p>&nbsp;</p>\n<p><strong>守護森林，需要您的行動！</strong><strong>&nbsp;</strong></p>\n<p>本會在揭露伐木造林的荒謬政策後，展開國會遊說。經田秋堇委員等人極力推動，促成二項主決議。一為『99年度新植造林700公頃獎補助費117,000千元凍結四分之一，並請林務局邀集民間環保團體共商修改、增訂「許可獎勵造林審查要點」後，再於解凍。』二為：『水土保持局應於100年度之治山防災工程預算中，應有百分之二十用做「保護現有森林不被砍伐」，詳細施行辦法建請水土保持局與林務局共同擬定，並送本院經濟委員會審查。』</p>\n<p>&nbsp;</p>\n<p>本會將結合友團持續監督行政部門落實立法院的決議，致力於減少森林砍伐，保護天然林，亟需台灣社會共同關注。</p>\n<p>&nbsp;</p>\n<p><strong>附錄：伐木跡地勘查紀錄</strong><strong></strong></p>\n<p>1.通宵鎮與銅鑼鄉交界地區，海拔約400公丘陵地，在苗37縣道距130號線道1公里兩側伐木跡地，面積約2公頃，伐木跡地樟樹被刻意留下，旁邊有一相思造林地（照片前景）。2009.5.18</p>\n<p><img src=\"/sites/cet-taiwan.org/files/IMG_3307.JPG\" alt width=\"341\" height=\"227\" loading=\"lazy\"> <img src=\"/sites/cet-taiwan.org/files/IMG_3311.JPG\" alt width=\"195\" height=\"290\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>2.寮仔湖山東麓伐木跡地約2公頃。2009.5.18</p>\n<p><img src=\"/sites/cet-taiwan.org/files/IMG_3318.JPG\" alt width=\"387\" height=\"258\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>3.130縣道11.5K伐木跡地約1.5公頃。在現場有聽到電鋸聲音，但是沒有找到伐木現場，該區域交通發達，距離碎木工廠大本營～銅鑼只需30分鐘車程。2009.5.18</p>\n<p>&nbsp;</p>\n<p><img src=\"/sites/cet-taiwan.org/files/met04-1.jpg\" alt width=\"484\" height=\"152\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>4. 造橋鄉豐湖村，該(TWD67 234798.2722558)伐木後，新植柏、茄苳等小苗面積約2公頃。2009.11.19</p>\n<p><img src=\"/sites/cet-taiwan.org/files/981119%20118.jpg\" alt width=\"319\" height=\"212\" loading=\"lazy\"> <img src=\"/sites/cet-taiwan.org/files/981119%20126.jpg\" alt width=\"320\" height=\"213\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>5.通霄鎮圳頭(TWD67 221831.2707642)，去年伐木今年申請造林，主要植栽為茄苳、相思樹，但是伐木現場一眼望去盡是自然下種的相思樹苗，根本無需人工植林，就已經是成片的天然相思樹苗圃。站在這片造林地遠眺對面山頭，可以看到最近才剛砍伐，好像被剃光頭髮的山坡地。2009.11.19</p>\n<p>&nbsp;</p>\n<p><img src=\"/sites/cet-taiwan.org/files/met0304_0.jpg\" alt width=\"221\" height=\"155\" loading=\"lazy\"> <img src=\"/sites/cet-taiwan.org/files/981119%20519.jpg\" alt width=\"321\" height=\"213\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>6.苗62-1鄉道從泰安鄉公所往東南方爬升，除了苗62-1鄉道在往洗水山叉路口已經斷裂不通，連接的產業道路以水泥鋪設，僅容一輛車子通行。往洗水山叉路口往下（產業道路）約2公里，桂竹林砍伐後以挖土機整地，面積約1公頃。旁邊為伐木後新植的桃子園（可能是水密桃）。2009.5.18</p>\n<p><img src=\"/sites/cet-taiwan.org/files/IMG_3476.JPG\" alt width=\"356\" height=\"237\" loading=\"lazy\"></p>"}, {"nid": 695, "title": "生態學家和獵人的森林", "original_topic": "自然復育", "adopted_cats": ["森林守護與林業改革"], "content": "<p><span>文☉李根政地球公民協會執行長</span></p>\n<p><strong>天乙山的山林大夢</strong><br>\n<p>2009年12月8日從那瑪夏下山，回程中順道前往甲仙的天乙山，探訪10年前的山林復育大夢的實踐基地。</p></p>\n<p>天乙山是高雄左營興隆淨寺從1984年3月迄1996年8月所購約20公頃的山坡地，其地於甲仙東南，甲仙埔山（407.8公尺）之北，為平緩淺山坡地，「天乙山」為該寺紀念其前任住持而命名。</p>\n<p>1981年，心淳師父繼任興隆淨寺住持，因思「國土淨則眾生淨，國土淨則心淨」，更思有一崇尚自然的天然道場（心淳法師，1998），萌生山林復育之夢。1997年，心淳師父碰上了陳玉峰教授，陳教授長期投入森林保護運動，向宗教界闡述「<strong>保育天然林才是宗教界的積極護生</strong>」，同時正鼓吹由民間發起「購地補天、生態綠化」。在此因緣際會之下，心淳師父乃委託陳教授進行規劃，期將這20公頃土地復育為天然林，作為淨土宗自然道場。</p>\n<p>陳玉峰教授乃經耆老之口訪，鄰近區域植被調查、考據研究等方法，了解該區未破壞前的原始植被，由其組成與環境，推估演替及相對穩定社會的大致情況，從而設計植栽，據以執行。在尊重自然本身復育能力之前提下，促進演替發生（例如種源），縮短演替時間。此即陳教授所說之「生態綠化──即人工復育天然林之方法。</p>\n<p>經調查後，了解天乙山全部土地皆屬人工植被，主要荔枝、龍眼、檳榔等果樹，還有柚木、麻竹等，由於土地經多次農林使用，且四周完全由人工植被所環繞，原始植被之種源欠缺的情形下，即令任其次生演替，雖百年亦不能達成成熟之低海拔闊葉林。</p>\n<p>因此，陳教授在前述研究基礎下，依不同坡段設計植栽物種，進行人工復育。</p>\n<p>例如上坡為台灣櫸木、楓香、無患子、黃連木、台灣石楠、烏皮九芎等；中坡為台灣栲、香楠等；下坡為大葉楠、樹杞、軟毛柿等；溪谷則設計茄冬、幹花榕、山菜豆等，有些植栽則從山頂迄溪谷皆適合，例如黃連木。</p>\n<p>而現存之植被則依以下原則處理：原生植物全數保留不予修剪；果樹、外來種剪除部分枝幹，增加透光度；除造林植栽之挖穴、施肥等，地表及地中根系不予處理；多次伐除竹叢，根系令其自然分解；禁用殺草、殺蟲劑、化肥等；清除蔓澤蘭等外來殺手物種。</p>\n<p>1999年4月，以及5月母親節，陳教授開辦之環境佈道師南台學員，開始在天乙山陸續種上生態綠化之種苗。</p>\n<p>本區雖說平緩，但在崎嶇的坡地上植樹仍十分費力，植樹之後的除草工作更是繁重，經幾次動員義工上山工作之後，之後長達數年的除蔓工作皆由興隆寺委專工處理。</p>\n<p>10年過去了，天乙山上的生態綠化成果尚未進行全面的覆查，但是，多樣的原生植栽在果樹間交錯著成長，一座豐富多樣的森林指日可待。（註1）</p>\n<p>天乙山的生態綠化和林務局推動造林，思維和作法完全不同。前者是以復育天然林為目標，尊重自然演替機制，加上符合該地演替趨勢之輔助性造林；後者則是營造單一樹種的人工林，以經濟林為導向，在不理會自然演替以及漠視該地原生植被的情況下，強以人力植樹。</p>\n<p><strong>天乙山復育低海拔闊葉林的作法，可提供破壞嚴重、天然種源欠缺的地區，從事山林復育的參考，陳教授之「購地補天」、「生態復育」之構想，更可做為有心從事山林復育的慈善機構、企業、私人一條正確的道路。</strong></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20170307-051.JPG\"><br>\n<p>△這一區是在果樹間進行生態復育的造林，初期需人工介入除草撫育。</p></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20170307-057_0.JPG\"><br>\n<p>△<span>這裡是任其自然演替的檳榔園，長出來大都為血桐等次生植物。</span></p></p>\n<p><strong>魯凱族：達巴里蘭的保育區&nbsp;</strong></p>\n<p>八八災後，筆者展開了新的學習行旅。2009年12月28至29日，地球公民協會、公視紀錄觀點團隊以及黃淑梅導演等人，在宋文丞先生的帶領下，前往屏東霧台的達巴里蘭。</p>\n<p>達巴里蘭位於霧台鄉新佳暮村東北方約1公里左右（直線距離），地處在大母母山系之戶亞羅山腰，海拔約800公尺，該區內北隘寮溪支流上之雙層大瀑布，魯凱族人稱之達巴里蘭，是瀑布，也是彩虹之意，如今亦泛指該區域為達巴里蘭。</p>\n<p>達巴里蘭原為霧台魯凱族人的傳統獵區，後因人口擴張而逐漸成為耕地，為好茶系的霧台、神山、佳暮等部落的生產基地，同時亦為荷蘭時期躲避天花，日據抗日的根據地。在此，神山部落的宋文丞、宋文生父子及家人成立了「保育區」，試圖用家族的力量，營造一個族群文化與生態智慧傳承的基地。</p>\n<p>宋家在達巴里蘭的保育區約50公頃，有一部分原是家族的耕作區，部分是還我土地運動後增編的保留地，原就是森林區；部分則是向族人所購土地。從1997年開始，宋先生開始有意識的將耕作區恢復為森林，一方面保留了自然生長的樹木，例如山黃麻、相思樹、楓香、無患子、青剛櫟、台灣欒樹、山菜豆等；二方面在林間空隙補植原生樹種，這些樹種都是自行培育的苗木，如樟樹、櫸木等，今年則已完成黃連木的採種，準備育苗。植樹之後，必須花幾年的時間除去蔓澤蘭、香澤蘭等強勢外來植物，確保苗木存活成長。</p>\n<p>宋先生的造林工作在鄉公所的「特別通融」下，得以向政府申請全民造林獎勵金。因為林務局規定一公頃需種植2,000棵的指定樹種，且存活率需達70％以上，否則無法領取獎勵金，導致非得先把原有樹木植被全面砍除才行。但宋先生的育林觀念是：每種樹木、植物的開花結果期都不同，如果只有單一物種，也只在特定的季節開花結果，那麼動物在這裡找不到食物，就會挨餓離開；反之，如果<strong>森林中有多樣的物種，動物們在每個季節、每個月份都可以享用各種果實，這才是好的森林</strong>。簡而言之，宋先生心中理想的森林，就是保有多樣生物的天然林。</p>\n<p>八八災後，達巴里蘭幾乎是絲毫未損，還是生機盎然。冬日裡，濃綠的闊葉樹與落得剩枯枝的櫸木，還有無患子的金黃葉，鑲嵌成一幅色彩紋理繽紛的圖畫，這才是真正的台灣森林！</p>\n<p><strong>獵人．生態學家．農人的森林</strong></p>\n<p>天乙山和達巴里蘭是企圖把耕地、果園復育為天然林，一個從生態學研究及實證經驗出發，一個則從原住民的生活經驗出發，但相同的是：<strong>獵人的山林和生態學家的山林，都具有生物多樣性，多層次的植被，真正能保護水土的森林。獵人是生態系中的一環，如果獵人照顧好自己的獵場，確保獵物的多樣性且能夠生生不息，森林自然也得到保護。</strong></p>\n<p>反之，林業單位心中的森林，是農人的森林，是把樹木當成定期收穫的作物，因此「砍樹是為了種樹、種樹是為了要砍樹」是再正當不過的作法。</p>\n<p>百年來，台灣山林的浩劫正是把漢人的農耕經驗用來經營山林，把樹木視為有價的木材，無止境的掠奪，而忽視其生態、文化以及永續的經濟價值。如今，山林的復育，不能再走錯誤的道路，誤以為營造人工林就是復育山林，而應該向原住民獵人、生態學家學習。</p>\n<p>八八災後，朝野皆倡議國土復育，但對於「如何復育」這個議題不該只停留在空洞的原住民遷村、讓山林休養生息，或造林等，天乙山和達巴里蘭之例或可提供政策省思。</p>\n<p><img alt src=\"/sites/cet-taiwan.org/files/met813-3.jpg\">△虛線下方是達巴里蘭復育區的範圍，標示A以上者可見伐木遺跡。<br>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20170307-058.JPG\"><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20170307-052.JPG\"><span>△A區原為面積約7、8分的森林，2009年以3,000元賣給伐木商，宋文丞擔心將產生新的崩塌</span>。</p></p>\n<p><img alt=\"20170307-053.JPG\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20170307-053.JPG\"><span>​</span><span><span>△</span>保育區內的九芎</span><br>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20170307-054.JPG\"><span><span>△</span></span><span>保育區內的台灣欒樹</span></p></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20170307-056.JPG\"><span>山麻黃</span></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20170307-055.JPG\"><span><span><span>楓香</span></span></span></p>\n<p><table></p>\n<p><tbody></p>\n<p><tr></p>\n<p><td><img alt height=\"238\" src=\"/sites/cet-taiwan.org/files/IMG_3213.JPG\" width=\"357\" loading=\"lazy\"></td></p>\n<p><td><img alt height=\"169\" src=\"/sites/cet-taiwan.org/files/IMG_3089.JPG\" width=\"254\" loading=\"lazy\"></td></p>\n<p></tr></p>\n<p></tbody></p>\n<p></table></p>\n<p><span>冬天保育區內的森林樣貌<span>（左）</span>；這一盤是從達巴里蘭所採取的黃連木種子<span>（左）</span></span></p>\n<p>&nbsp;</p>\n<p>註1：有關天乙山生態綠化的文獻，係參考《嚴土熟生》，興隆精舍淨土宗專修道場、台灣生態研究中心印行，1998。以及《台灣植被誌第六卷．闊葉林（一）南橫專冊》，陳玉峰著，前衛出版，2006。</p>"}, {"nid": 696, "title": "誰是山林破壞者？", "original_topic": "森林與林業政策", "adopted_cats": ["森林守護與林業改革"], "content": "<p><strong>&nbsp;</strong><strong>論國土復育政策</strong></p>\n<p>文⊙李根政(地球公民協會執行長)</p>\n<p>2010.1.15</p>\n<p>&nbsp;</p>\n<p>八八災後，政府、輿論和重量級慈善團體似乎把「原住民遷村，讓山林休養生息」做為解藥。然而「原住民是山林破壞者？」的指涉，不僅是以偏概全，更忽視了山林破壞的根本問題。</p>\n<p>&nbsp;</p>\n<p>若問：現今原住民在山地的農業活動，會不會造成山林水土的破壞，答案是肯定的。但是，山地開墾都是原住民所為嗎？政府主導的山林開拓政策可以不必負責？歷來政府和學界檢討土地利用與土石流等課題，只聚焦在「超限利用」與「濫墾」，從未檢討百年伐木和政府鼓勵山地開墾的政策，彷彿只有人民犯錯，而且和政府無關。</p>\n<p>&nbsp;</p>\n<p>如果因為原住民在山上的農業活動會破壞山林，所以叫他們離開，那麼漢人來台400年間全面摧毀原始森林，從事精密農耕，把平地所有野生動植物趕盡殺絕，發展工業污染河川、土地，是否也該全面退出？</p>\n<p>&nbsp;</p>\n<p>若依此簡化邏輯來推動政策太天真也太恐怖！以下筆者試簡要分析台灣山林政策之關鍵課題，同時提出國土復育的幾項思考供參。</p>\n<p><strong>&nbsp;</strong></p>\n<p><strong>一、山林政策</strong></p>\n<p>全台山坡地大都被劃分為「林業用地」、「農牧用地」。依據所進行的第二次之森林資源航測調查（1972-1977年）。在全島林地面積186萬4,700公頃中，國有林地占155萬308公頃，其中經濟林地占59%，施業限制地（水土保持關係）占14%，保安林地占19%，施業除地占8%。</p>\n<p>&nbsp;</p>\n<p><strong>「經濟林地」</strong>，在海拔2,500公尺以下的原始森林，大都在過去百年來被全面伐除，根據官方統計共砍伐34萬4千多公頃的林地（實際面積應遠遠超過），爾後又以林相變更、林相改良的名義，全面破壞原始闊葉林，因伐木而開闢的林道，根據1981年統計，全島長達3,682公里，這些林道加上後來的橫貫公路，正是山區開墾之濫觴。</p>\n<p>&nbsp;</p>\n<p>時至今日，這些伐木跡地，有些重新演替為天然林，有些則繼續人工營林，執行所謂的「撫育」，如除草、削枝，維持單一樹種的人工植被。<strong>人工營林</strong>，基本上是視「樹」為作物，造林的過程中砍伐森林，開闢道路，對水土保持破壞極大，重新種植的小苗，至少要經5-10年以上才能成林，其作業模式，<strong>對水土保持的損害僅次於果樹、蔬菜等短期作物。</strong>原住民保留地中，有許多被劃入「林地」，政府以「獎勵造林」鼓勵人民執行著「砍樹、種樹…」的循環利用方式（例如1996年的賀伯災後，政府推出全民造林運動，總計造林3萬8,000多公頃，其中收回農墾地再造林者僅214公頃，意味著可能毀林3萬多公頃。）</p>\n<p>&nbsp;</p>\n<p>即使是<strong>「保安林」</strong><a href=\"#_ftn1\">[1]</a>，依照保安林經營準則還是可以進行更新、撫育的作業（即伐木再造林），經主管機關農委會林務局許可，還是可以把森林砍除推動公用事業、公共設施、公共建設、探礦或土石採取。也就是說，依現行保安林的經營方式，並不能避免水土破壞。</p>\n<p>&nbsp;</p>\n<p>另外，山坡地上所編訂的<strong>「農牧用地」，</strong>在編定的過程中，並未真正調查是否適合農牧使用，許多農牧用地的地形陡峭脆弱，一旦把森林伐除或從事農耕活動，極易造成水土流失，這是土地利用管制中失落的一角。</p>\n<p>&nbsp;</p>\n<p>簡而言之，檢討山坡地不當利用，必需先檢討林業政策。可惜的是，從2005年開始所推動國土復育條例或行動策略，都未碰觸這些課題，甚至還是允許在所有區域進行「林業保育必要之復育及疏伐作業」，而對於收回出租林地再造林，也還是停留在經濟林的思維。</p>\n<p><table></p>\n<p><tbody></p>\n<p><tr></p>\n<p><td><img alt height=\"256\" src=\"/sites/cet-taiwan.org/files/IMG_5904-1.JPG\" width=\"384\" loading=\"lazy\"></td></p>\n<p><td><img alt height=\"189\" src=\"/sites/cet-taiwan.org/files/IMG_5901-1.JPG\" width=\"283\" loading=\"lazy\"></td></p>\n<p></tr></p>\n<p></tbody></p>\n<p></table></p>\n<p>△高海拔山區還是允許這樣的疏伐作業，維持運材道路，如何叫國土復育？</p>\n<p>&nbsp;</p>\n<p><strong>二、農墾與超限利用</strong></p>\n<p>根據農委會1999年清查全台山坡地屬宜林地及加強保育地總面積36萬5,907公頃中，超限利用面積達3萬2,000餘公頃，其中以南投縣1萬1,120公頃為最多，次為嘉義縣及台中縣<a href=\"#_ftn1\">[2]</a>；而有關原住民保留地超限利用的統計，根據行政院原民會的資料，總面積為15,122公頃，其中又以南投縣比例最高。</p>\n<p>&nbsp;</p>\n<p>山地農墾伴隨著是產業道路的開闢，根據經建會（2004年）的資料，全台山區4公尺以上產業道路、農路總長度達8,550公里，相當於22條中山高，道路、農墾不僅會造成崩塌，也會加重下游的涇流量，縮短雨水從山區流出的時間。</p>\n<p>&nbsp;</p>\n<p><strong>然而，山地農墾的擴張是政府引導和放任下的產業。</strong></p>\n<p>由於伐木後遺留大面積荒山，政府乃鼓勵人民租地造林，一開始，木材價格尚有利基，但隨著國產材不敵價廉之進口材，許多林農便轉種植茶、果樹等經濟作物。同時，隨著山區道路的開通，吸引了更多漢人上山開墾，有些甚至是侵占國有地從事農作。經濟的誘因，導致了原住民保留地的林地也開始超限利用，原住民自營或出租給漢人者兼有之。</p>\n<p><img alt height=\"254\" src=\"/sites/cet-taiwan.org/files/DSCN0007-1.JPG\" width=\"381\" loading=\"lazy\"></p>\n<p>△阿里山區的山林茶園拓墾，2003.11.17。</p>\n<p>&nbsp;</p>\n<p>同時，<strong>政府政策也鼓勵農業上山。</strong>例如福壽山、武陵、清境、花蓮等四大農場，就是政府主導的高山蔬果政策；再如<strong>李登輝總統</strong>在面對阿里山國有林下種植山葵的問題，竟向身旁的官員做了一項指示：<strong>「去研究研究，看看是不是可以共存，上下都利用！」</strong>，高層無知加放任，民眾利之所趨、民代關說、地方政府不執法，致使濫墾、超限利用成為尾大不掉的問題。</p>\n<p>&nbsp;</p>\n<p>另外<strong>交通部觀光局</strong>「國家風景區」全然以增加觀光人口為前提，無視國土危脆，建設各種如空中樓閣一般的景觀建設，如本次風災過程中，整個茂林國家風景區管理所全數為土石流所沖毀；阿里山觀光設施、BOT案同樣難敵土石之災；九二一地震後在草嶺推出的「災難觀光」週期又是何其短暫？再如盧山、六龜、寶來的<strong>溫泉</strong>有多少是合法經營？<strong>宗教寺廟</strong>占用國有地，違規超限利用者更是不計其數，但是，又有那個政治人物敢下達拆遷指令？</p>\n<p>&nbsp;</p>\n<p><img alt height=\"256\" src=\"/sites/cet-taiwan.org/files/IMG_3511.JPG\" width=\"384\" loading=\"lazy\"></p>\n<p>△寶來溫泉區受創後，政府應業者之請，積極疏濬並協尋溫泉露頭，要重振觀光。災後復建的資源分配與國土復育的標準，似乎仍是在比誰比較有權有勢？</p>\n<p>&nbsp;</p>\n<p><strong>三、公共工程：</strong>政府主導的公共工程本身就是最大破壞者。例如：今日有許多的山區漢人聚落，就是伴隨著中橫、北橫、南橫、阿里山公路等公路而建立或者擴張；水壩、發電廠，越域引水等隧道工程，破壞河川、山林生態至鉅；因應觀光而擴張的公私建物，往往處於敏感區位；農委會水保局之任務即在維持山地開發，進行各種水土保持工程，<strong>數十年來，上游搞開發，下游收拾殘局，已投入數百、上千億「永續工程」，然而，土石流為何越加嚴重？為何無人檢討？</strong><strong> </strong></p>\n<p>綜上，可以發現政府是最大的山林破壞者，而且是透過制度、公權力進行有系統的破壞。然而，這些導致今日國土破碎、崩山與土石流災難的因素，必須在時間（土地開拓史）；空間（各種開發之規模及區位）下檢視，因時因地有輕重之分，無法一概而論。</p>\n<p><table></p>\n<p><tbody></p>\n<p><tr></p>\n<p><td><img alt height=\"252\" src=\"/sites/cet-taiwan.org/files/DSCN0031-1.jpg\" width=\"338\" loading=\"lazy\"></td></p>\n<p><td><img alt height=\"247\" src=\"/sites/cet-taiwan.org/files/IMG_3576-1.jpg\" width=\"369\" loading=\"lazy\"></td></p>\n<p></tr></p>\n<p></tbody></p>\n<p></table></p>\n<p>△左圖為曾文越域引水的勤和洞口，2005.12.17攝；八八災後荖濃溪河床墊高，洞口已深埋於土石下20幾公尺，如何復工？</p>\n<p><strong>&nbsp;</strong></p>\n<p><strong>國土復育的幾項思考</strong></p>\n<p>八八災後，由經建會、內政部營建署主導的國土計畫法，在第23、24條中制定了國土保育地區之國土功能分區及管制原則，因而宣稱納入國土復育的內涵；立法院中則有委員提出了國土復育條例（皆以民進黨2005年版本略作修改）；經建會也提出了國土保安及復育計畫（草案），送到行政院永續會中討論。</p>\n<p>&nbsp;</p>\n<p>綜上回顧，筆者看法如下：</p>\n<p>一、山林復育首重檢討山林政策，以細膩的土地調查為基礎，徹底進行山區土地分類，重新劃分保育地、經濟地。保育地限制不得從事造林、撫育、林木收穫、農業等活動；經濟地則允許從事人工林的經營、農業活動、聚落。（經過重新劃分，也許現今原住民保留地中的部分林地，反而適宜農耕；農牧用地反而應劃為保育地。）</p>\n<p>&nbsp;</p>\n<p>二、山林復育依現行法令即可操作，關鍵在於政策與政治決心，不一定要立新法。</p>\n<p>&nbsp;</p>\n<p>三、山林復育所需經費，應將造林、水土保持、道路等工程費用，轉移至限制伐木補償、復育天然林，收回承租林地等，不應再擴大舉債；另，加徵水源保護費用應直接回饋保護區上游人民。</p>\n<p>&nbsp;</p>\n<p>四、山林復育需要社會和政治共識。山林復育至少需要數十年、百年才能見其成果，欠缺共識的方案，必然敵不過人民的抵制、民代的關說，演變成朝令夕改。例如民進黨時代依據「國土復育策略方案暨行動計畫」試圖處理超限利用、收回出租林地。然而來自墾民、民代形成重重阻力，依據其執行效率，要處理國土保育區的超限利用、濫墾濫建要花上30年；國有林出租造林地的收回要花上131年，凡此都說明「徒法不足以自行」。</p>\n<p>&nbsp;</p>\n<p>五、山地農墾也許並非八八災變的主因，但不當的山地農墾活動的確威脅自身及下游居民。從事山地農墾者，有些僅是糊口的工作，有些誠屬不公不義之暴利，要處理這項課題時，必先判別真正的弱勢者與不法的既有利益者。處理這項歷史沈疴，最好的作法是：資訊公開，釐清爭議課題，不斷舉辦公聽會、聽證會凝聚社會共識，讓政治角力全面透明化；同時積極研擬策略方案，協助山區住民轉型為與山林共存的生活型態，原住民傳統的輪耕、休耕，農林並存的生產型態，或許值得重新借鏡。因為，無法處理山區住民生計問題的方案，必然導致利害相關者之消極、積極抵抗。</p>\n<p>&nbsp;</p>\n<p>六、搭構原住民傳統生態智慧與西方生態學的橋樑，建立山林經營管理的實務共識。以原住民部落為主體，逐步賦予經營管理山林的權力，彌補林務人員快速白領化，山林管理的嚴重缺口。</p>\n<p>&nbsp;</p>\n<p>在地震、降雨極端化、欠缺原始植被的保護等因素下，台灣山區的土石流災變勢必加劇。目前最迫切的問題在於：<strong>如何幫助</strong><strong>岌岌可危的原住民族，延續族群的生命和文化？百年來陸續移墾山區的漢人聚落何去何從？</strong>至於山林復育請政府先躬身自省，先檢討既有法令和政策，同時請社會在見樹又見林的前提下，協助山林復育。</p>\n<p>註：</p>\n<p>[1] 現有之保安林面積已達461,183.6公頃，佔森林面積的21%，其中96%屬國有，公、私有佔4%。</p>\n<p>[2] 監察院，2000，國土保全總體檢報告：崩塌及土石流區。</p>"}, {"nid": 738, "title": "山林有難！", "original_topic": "無", "adopted_cats": ["森林守護與林業改革"], "content": "<p>〈民間團體共同聲明暨連署書〉</p>\n<p>&nbsp;</p>\n<p><span><span>反對「森林法」讓寺廟侵占就地合法！</span></span></p>\n<p>&nbsp;</p>\n<p>立法院經濟委員會將於5/27審查蔡錦隆等24位委員所提<strong>森林法第八條</strong>修正案，此法一通過，全台宗教寺廟占用國、公有林地者即全數取得出租、讓與、讓售或撥用國、公有林地之合法資格。我們反對此修正案理由如下：</p>\n<p>&nbsp;</p>\n<p><strong>一、百年來由於山林破壞，已造成嚴重的土石流、水患大災難。山林政策應以國土復育為上位原則，而非持續鬆綁山林開發。</strong></p>\n<p><strong><br></strong></p>\n<p>二、<strong>此法嚴重破壞國家體制，包括國土規劃、國土復育、區域計畫、都市計畫法等。</strong>另外，位於山坡地之宗教寺廟更可能違反森林、建築、山坡地保育相關法規，造成水土流失等環境破壞，面對寺廟長期違法的行為，政府主管民政、森林、水保、區域計畫之官員竟視若無睹，已是嚴重失職，如今卻主動修法讓其全部合法，政府威信蕩然無存。</p>\n<p>&nbsp;</p>\n<p><strong>三、讓違法占用者合法化，不符社會公平正義，</strong>變相鼓勵人民違法占用、濫墾國公有森林，再想辦法尋求合法化，反正有前例可循。</p>\n<p>&nbsp;</p>\n<p><strong><span>請立法院諸公，為土地、為人民及後代子孫把關，負起立法委員之職責，嚴謹把關，萬不可讓此森林法修正案草率送入院會通過！</span></strong></p>\n<p>&nbsp;</p>\n<p><a href=\"http://campaign.tw-npo.org/sign.php?id=2010052402281800\"><strong><span>連署反對森林法讓寺廟侵占&nbsp; 就地合法!</span></strong></a></p>\n<p><a href=\"http://met.ngo.org.tw/node/737\"><span><strong>歡迎參與</strong>「<strong>森林希望</strong>」</span></a><strong><span><a href=\"http://met.ngo.org.tw/node/737\"><span>2010地球公民暑期營隊</span></a><br></span></strong></p>"}, {"nid": 1447, "title": "獎勵的漏洞、大樹的危機", "original_topic": "假造林真伐木", "adopted_cats": ["森林守護與林業改革"], "content": "<p><img alt height=\"385\" src=\"/sites/cet-taiwan.org/files/1230-0.jpg\" width=\"660\" loading=\"lazy\"></p>\n<p><span>文 ‧ 袁庭堯（地球公民基金會文宣專員）</span></p>\n<p><span>&nbsp;&nbsp; 增加天然林地面積，不但可預防土石流，對於廣義的減碳抗暖化也有實質上的幫助。不過這一切，在缺乏整體政策的規劃與管理之下，似乎不全然是想像般美好。</span></p>\n<p>\t&nbsp;&nbsp; 過去，政府致力推動「全民造林」運動，結果導致「砍大樹、種小樹」的森林浩劫，估計造成三萬多公頃森林遭受砍伐後再造林。經由地球公民基金會多年的努力，<span><span>2010年增訂「獎勵造林審查要點」，明訂「實施造林土地有天然次生林應于保留」、「造林前必需檢附衛星影像或航空照片證明造林前的土地處於無林狀態」</span>，希望擁有森林地的地主們，盡可能地保留地上原始植被，既可領獎金，又能達到水土保持的終極目的。</span></p>\n<p>\t&nbsp;&nbsp; 今年八月，南臺灣第一起申請案例出爐，地球公民立刻前往現場，做第一手的考察，看看山林水土的保育是否有正向的進步。 <span></span></p>\n<p>\t&nbsp;&nbsp; 這次的案例，地點位在屏東縣獅子鄉內獅段，占地7公頃，海拔約400公尺，土地性質為山坡地、原住民保留地及農牧用地。現場目視可及部分為30%山坡地、30%平地、及40%緩坡，原住民地主將土地租予一位商人，預計申請造林獎勵後全面種植無患子（註）。 <span></span></p>\n<p>\t&nbsp;&nbsp; 不過，本會研究員楊俊朗現場細看，裸露的坡地留有大小不一的樹頭，最大棵的直徑將近一公尺，明顯屬於次生林樹種。進一步詢問屏東縣政府農業處人員，了解該地主領有「整地障礙木採運許可證」，且文件上頭標示「皆伐」。 <span></span></p>\n<p>\t&nbsp;&nbsp; 皆伐，意指不論任何樹種，申請範圍內，一律砍伐殆盡。砍下來的木頭多數經濟價值不高，對地主來說只是圖個方便、降低整地的複雜度而已。但對許多生根數十年的高大樹種來說，無疑是場浩劫；對水土保持，更是嚴重傷害。 <span></span></p>\n<p>\t&nbsp;&nbsp; 楊研究員認為，「皆伐」的動作明顯違背造林獎勵中「 <span><strong>天然次生林應于保留</strong>」的精神，在稍後的審查會議上提出強烈質疑。經過一番來回討論，屏東縣政府農業處、屏東科技大學森林系教授葉慶龍、鍾玉龍雙方均認為，「整地全伐」對自然環境確實傷害不小，但是終究屬政策面的爭議，以避免颱風季節可能造成的土石流為前題，他們認為讓地主過關並無不當。</span></p>\n<p><img alt height=\"384\" src=\"/sites/cet-taiwan.org/files/1230-1_0.jpg\" width=\"660\" loading=\"lazy\"><span></span><span>&nbsp;&nbsp; 獎勵造林計畫的核心精神就是為了避免「砍大樹種小樹」的歪風再發生，實際案例證明，地主仍可規避法律，不，應該說是「合法砍樹」領獎金，過程明顯有漏洞。為此，我們進一步前往屏東縣政府了解癥結點。</span> <span></span></p>\n<p>\t&nbsp;&nbsp; 屏東縣政府原住民處副處長蔡文進解釋，問題出在土地的屬性。該地屬「農牧用地」，伐木依法不須經過申請。一般的情況，地主為求省事，多半「先斬後奏」：先全面整地賣木材，再申請造林獎勵金、並改種經濟作物，三頭賺，怎樣都划算。 <span></span></p>\n<p>\t&nbsp;&nbsp; 楊研究員進一步詢問，是否能夠要求地主保留土地上的次生林，亦不影響土地再利用。原住民處則表示遺憾，礙於民情，不方便過問私人土地上的活動，目前也僅能用「水保法」警告性地要求地主自律。 <span></span></p>\n<p>\t&nbsp;&nbsp; 不過，原民處表示，不是沒有努力的空間，為了盡可能落實獎勵造林的精神，未來將強化把關，除了詳實審查地主的伐地內容和實際面積，會和農業處保持雙向聯繫，落實政策完整性，防堵類似的漏洞再發生。 <span></span></p>\n<p>\t&nbsp;&nbsp; 台灣經歷一次又一次付出慘痛代價的風災、水災，告訴我們水土保持的急迫及重要性。這一次會勘讓我們看到「徒法不足以自行」的一面，儘管有了較嚴謹的法規， 落到執行層面還是重蹈「砍大樹、種小樹」的覆轍，顯見獎勵造林的施行還需要更全面的把關和監督，地球公民將會持續追蹤這項課題。 <span></span></p>\n<p>\t<strong>註：</strong><strong> <span><br>\n<p>無患子是台灣原生樹種，被林務局列為「許可造林樹種」，加上近年吹起環保風，無患子的種皮具有天然去汙的特性，成為研發清潔產品的新寵兒，根據了解，台灣已有生技公司每年定量收購，因而，有部分林農開始大量種植。</span></strong></p></p>"}, {"nid": 1499, "title": "吳揆向墾農低頭，山林即將失守？", "original_topic": "森林與林業政策;山坡地不當開發", "adopted_cats": ["森林守護與林業改革"], "content": "<p><span> 據自由時報1月1日的報導，國民黨副總統候選人兼現任行政院長吳敦義，12月31日參加完台灣農努聯盟全國代表大會後，指示農委會檢討三件事︰一是林地與 耕地是否並存的「混農林業政策」，限期兩年進行研究，必要時派人前往先進國家考察，這段期間只要維持現狀、不明顯違規，林務局不要再提告或砍除作物。二是 希望林務局過去打官司勝訴討回的林地，與其沒人耕種任由荒廢，如果原承租戶沒有其他祖產或謀生方式，不要排除與原承租戶重新訂定租約。第三則要求林務單位 研究，種植哪些果樹會破壞水土或有利於水土保持，並依不同區域提供 適合種類的建議，希望農民有好生計、國土能保安、公務員也不違法，共創三贏。</span><br>\n<p><span>&nbsp;<br></p>\n<p>地球公民基金會的回應如下︰<br></p>\n<p>&nbsp;<br></p>\n<p>一、收回濫墾國有林是對全民有利的正確政策，政府施政不應該因為少數既得利益者施壓而停擺。</span></p></p>\n<p><span>二、已收回之國有林應依地況，進行生態復育或造林，加強管理，避免二度出租、重蹈濫墾覆轍。</span></p>\n<p><span>三、台灣位處地震帶，又是太平洋颱風必經之處，加上極端氣候的衝擊，林地濫墾肯定會破壞水土、污染水源，還有增加道路維修、水庫淤積、社會救助等龐大社會成本，所以台灣沒有條件提倡混農林業。</span></p>\n<p><span>四、呼籲檢調單位介入調查，吳敦義院長三番兩次對林務局放話、施壓，是否涉及與特定人士利益輸送。</span></p>\n<p><span>五、呼籲選民睜大眼睛，選出真正關心全民福祉的總統候選人，唾棄沒有原則與理念的候選人。</span></p>"}, {"nid": 1551, "title": "給自己一張根植土地的身份證", "original_topic": "生活與環境", "adopted_cats": ["森林守護與林業改革"], "content": "<p><img src=\"/sites/cet-taiwan.org/files/DSC09495.JPG\" alt height=\"375\" width=\"651\" loading=\"lazy\"></p>\n<p><span>在蘇拉颱風接近台灣東海岸前，山林書院第一梯次營隊順利在阿里山結業，234位學員在五天或八天課程中，經過一場紮實的生命洗禮。有一位學員分享：經過這次營隊，就像是柺杖樹定了根，開啟了對土地及台灣人的情感認同，以及對於生態環境、宗教人文等更多的思辨。這可能是多數學員的心得，就如同14年前我在參與環境佈道師營隊之後的親身驗證。</span></p>\n<p><span>1994年我從老家金門移居到高雄後，受到了黃文龍醫師、吳錦發、洪田浚等前輩的啟蒙，開始學習柴山的自然生態、人文，並參與了保護柴山運動。1998年6月，在高雄市教師會張輝山理事長的鼓舞下，和一群教育界的伙伴成立了「生態教育中心」。為此我放棄了從少年時代開始的藝術家之夢，當時，只是有感於在這波生態運動中，老師不應該缺席，而且認為「只有深植人心的生態教育，形成具有普遍性、草根性的生態運動，才能挽救我們的環境。」但是，到底要做什麼，其實不太清楚。</span></p>\n<p><span>同年8月，正好碰上陳玉峯教授辦理第二梯次「環境佈道師」營隊，提供了我和伙伴們認知「台灣自然史、山林開拓史、土地倫理」等課題的啟蒙教育；同一時間，也參與了陳教授及保育團體如火如荼推動的「搶救檜木林運動」，從而開啟了十數年間我和伙伴們關懷山林的行動。</span></p>\n<p><span>從1998至2003年間，我先後以「高雄市教師會生態教育中心主任」、「全國教師會生態教育委員會召集人」、「台灣生態學會祕書長」的名義，聚集眾人願力搶救檜木林，並推動「馬告檜木國家公園」。期間並進行了「反全民造林」、「一人一信保護森林」等運動。2007年，地球公民協會成立後，開始和同事調查、揭露「伐木養菇」、「假造林真伐木」等真相，並積極促成山林政策的改變，這些行動的背後，正是奠基於陳玉峯教授、楊國禎教授的研究基礎。 <br></span></p>\n<p><span>運動界常有人稱我是陳教授的大弟子，我覺得過當了。相較於陳教授在植物生態等學術領域，以及對台灣文化、宗教的研究與理解，政治、社會運動的深度涉入，一生當中陸續建立的台灣龐大智識，我只是一個初階的學習者，有幸在這十幾年來耳濡目染陳教授無私的社會人格，藉此提醒自己莫忘初衷罷了。</span></p>\n<p><span>對於一個從金門定居台灣的「移民」來說，陳教授以250萬年台灣自然史的格局，跳脫人種狹隘視野的史觀，恰好成為我融入台灣社會的基礎。而筆者透過十數年環境運動的實踐，則彷彿頒給自己一張無形但根植於土地的台灣身份證。我所理解的是：只要是認同這塊土地，在起心動念、行事上，非以一己之私，而願意考量公共利益、世代公義、生界倫理的人，就是個夠格的台灣人。</span></p>\n<p><span>陳教授提攜後輩著重於視野、格局之開闊，其無私的格局感動了許許多多有同樣心靈底蘊的台灣人。這場營隊，我特別商請地球公民基金會所有同事，放下手邊的工作，參與籌辦並全程參與，希望一同感染陳教授自然流露對生命的熱忱、力量，以及善與美，讓我們一起擁有共同的生命經驗，做為一個組織思想、文化的底蘊。</span></p>\n<p><span>在阿里山的結業式上，陳玉峯教授一一親手遞交結業證書，他說：這不是由他授證，而是他要好好表達對學員的感恩，希望每位學員都能發願，未來繼續替台灣盡一份力。</span></p>\n<p><span>山林書院──台灣自然暨宗教情操教育的民間永久基地，是陳教授百年樹人的宏觀遠見，是建立台灣主體文化、集體認同、政治實踐的根基。在此營隊中，我感受到來自各地學員聚合的願力，或許這便是突破台灣各種逆境最重要的資產。</span></p>\n<p><span>感謝有此機會，讓地球公民基金會與大家共結善緣。<br></span><span>感謝這片天和地，讓我們幸運地在蘇拉颱風襲台之前，順利完成營隊！</span><span>感謝陳玉峯教授傾其生命能量授課；陳月霞老師、蘇振輝董事長、楊博名總經理、初雅士副會長等講師，開拓了所有學員的人生視野。<br>感謝台灣生態研究中心、山林書院籌備處、高雄市龍華國小、高雄市教師會、台灣生態學會等單位的協辦。感謝十方善緣護持此營隊，以及地球公民基金會所有專職、義工的努力付出。</span></p>\n<p><a href=\"https://www.facebook.com/CitizenoftheEarth\"><span>→ 更多山林書院照片，請上地球公民Facebook！</span></a></p>\n<p><span>&nbsp;</span></p>"}, {"nid": 1844, "title": "地球公民 看見台灣", "original_topic": "國土治理", "adopted_cats": ["森林守護與林業改革", "國土計畫"], "content": "<p><span></span><img alt height=\"242\" src=\"/sites/cet-taiwan.org/files/001.jpg\" width=\"659\" loading=\"lazy\"></p>\n<p><span><span>文/ 蔡中岳（地球公民基金會台北辦公室主任）</span></span></p>\n<p><span> </span></p>\n<p><span><em>註：全文照片皆取自</em><em><a href=\"https://www.facebook.com/taiwan.aerial.imaging\">齊柏林的飛閱台灣</a>&nbsp;</em><em>粉絲專頁</em></span></p>\n<p><span> </span></p>\n<p><span>喜歡看電影的人都不喜歡被雷到，不過接下來就是要放大雷，但我相信《看見台灣》是一部縱使被雷到，都值得去看的好片。畢竟我們非常難從直升機的高度，去認識我們的家─台灣。</span></p>\n<p><span> </span></p>\n<p><span>當然，如果你堅持不想被雷，也希望看完電影後再來看這篇文章啦！尤其裡面的連結都可以點唷！</span></p>\n<p><span> </span></p>\n<p><span>首先要感謝<span>齊柏林</span>先生，用不同的視野讓我們看見台灣，更感謝他對台灣土地、環境的關心與擔憂，所以身為環保團體的我們，得以在九月底就先看了一回。再來要感謝緯創人文基金會，讓地球公民北辦的同仁在十月時，還有機會再看一場試映會；也感謝今周刊提供五十本當期雜誌，讓我們可以宣傳更多看見台灣的資訊！但不瞞大家，今天正式上映後，我還會帶更多朋友，再進戲院支持。</span></p>\n<p><span> </span></p>\n<p><span>廢話這麼多，那《看見台灣》這電影到底在說些甚麼？阿不就是空拍的攝影加上音樂&amp;吳念真的台灣味口白！如果只是這樣想，那就真的太辜負齊導演的心意了，我們以為會看到九十分鐘，美美的台灣，但其實美麗背後的哀愁，才是值得我們去認真思考的。</span></p>\n<p><span> </span></p>\n<p><span><strong>山林水土，超限利用的台灣</strong></span></p>\n<p><span><strong><img alt height=\"488\" src=\"/sites/cet-taiwan.org/files/002.jpg\" width=\"658\" loading=\"lazy\"></strong></span></p>\n<p><span> </span></p>\n<p><span>美麗的部分就讓大家去感受，快轉過去XD但音樂一轉，搭配動物們奔馳的劇碼，破碎的山河、奔馳而下的土石，開始占滿螢幕，除了那些慘狀外，更多的是山上到底發生什麼事情？滿載的高冷蔬菜、茶樹、房子、民宿，一般我們統稱這樣在山上種菜、種房子叫做「超限利用」，也就是說，超過這片土地本來可以負荷、承載的利用方式，當然這是有法令依據的，但現況卻是這些法令存在，但超限利用的狀況也存在，而且顯無改善。而我們國家的林務局，在去年甚至想要讓這些濫墾、違規、侵佔者就地合法，可以看看這篇「國恥 ! 台灣保育浩劫！」<a href=\"http://www.cet-taiwan.org/node/1487\">http://www.cet-taiwan.org/node/1487</a> 地球公民都有詳細的解說。</span></p>\n<p><span> </span></p>\n<p><span>而另一幕令人印象深刻的，就是從一顆檳榔樹，到一群檳榔樹，到一座山的檳榔樹，口白提到檳榔拼經濟，但卻遺漏了國土保安，至於檳榔到底如何侵入我們的山林，可以看看這篇「毒殺珍貴原始林！台東40公頃國有地變檳榔園」<a href=\"http://www.cet-taiwan.org/node/1497\">http://www.cet-taiwan.org/node/1497</a>，還有影片可以看唷！(我就是影片，請點我)<a href=\"https://www.youtube.com/watch?v=MC9SZI1U_tw\">https://www.youtube.com/watch?v=MC9SZI1U_tw</a> 當然山上森林的亂象就如同《看見台灣》中所揭露，根本毫無秩序可言，如果想要了解台灣的山林怎麼會這樣，建議可以在看看根政老師2010年寫的這篇「誰是山林破壞者？」<a href=\"http://www.cet-taiwan.org/node/696\">http://www.cet-taiwan.org/node/696</a></span></p>\n<p><span><img alt height=\"438\" src=\"/sites/cet-taiwan.org/files/003.jpg\" width=\"659\" loading=\"lazy\"></span></p>\n<p><span> </span></p>\n<p><span>寫到這裡不禁要提，要讓《看見台灣》中那些破碎的畫面變回美麗的台灣山林，該怎麼做？林務局不斷提出要種樹，但獎勵造林政策<a href=\"http://www.cet-taiwan.org/node/672\">http://www.cet-taiwan.org/node/672</a>卻百出漏洞，越造林山越崩，只有推動「禁伐補償」，就是只要你不砍樹就可以給你經費，而不是叫你把原來的樹砍掉，種新的才有經費，相信「土地公比人會種樹」<a href=\"http://www.cet-taiwan.org/node/1700\">http://www.cet-taiwan.org/node/1700</a>，《看見台灣》一開始的美景才會一直存在。</span></p>\n<p><span> </span></p>\n<p><span>此時要推薦延伸閱讀，就是地球公民山林水土的專頁啦！<a href=\"http://www.cet-taiwan.org/mountain\">http://www.cet-taiwan.org/mountain</a></span></p>\n<p><span> </span></p>\n<p><span><strong>海岸浩劫，失去擁抱海洋的權力</strong></span></p>\n<p><span><strong><img alt height=\"682\" src=\"/sites/cet-taiwan.org/files/004.jpg\" width=\"486\" loading=\"lazy\"></strong></span></p>\n<p><span> </span></p>\n<p><span>在山林的空拍後面，接上的是海岸浩劫，消波塊與人工設施占據了所有的海岸線，而工業就在海邊，尤其台灣的西海岸，連六輕都在台灣沿海保護計畫的一般保護區內，你就知道西海岸說有多慘就有多慘，幾年前熱燒的國光石化，就是一個最顯著的例子。而東海岸，導演則利用空拍，讓我們看見位在七星潭旁的花蓮垃圾掩埋場，不斷掉落太平洋的垃圾，我們過去總是習慣將討人厭的、髒的臭的東西都往沒有人的地方送，而這就是海岸悲歌的開始。另外雖然沒有提，海岸的觀光設施也一直是地球公民關注的議題，就看看花東海岸開發的訊息吧！<a href=\"http://www.cet-taiwan.org/taxonomy/term/122\">http://www.cet-taiwan.org/taxonomy/term/122</a>，而對於海岸的狀況想多些了解，建議可以搜尋黑潮海洋文教基金會、媽祖魚保育聯盟、西海岸保育聯盟等等唷</span></p>\n<p><span> </span></p>\n<p><span><strong>挖山採礦，掏空的是我們的根</strong></span></p>\n<p><span><strong><img alt height=\"436\" src=\"/sites/cet-taiwan.org/files/005.jpg\" width=\"656\" loading=\"lazy\"></strong></span></p>\n<p><span> </span></p>\n<p><span>然後太魯閣峽谷就開始配上原始的聲音進入大螢幕，這邊一看到都會有一種超過癮又感動的滋味，空中拍的太魯閣耶！但轉折有點大的反差不到三分鐘後就出現，礦場。亞泥的礦區率先登場，再來是各式各樣不同、漩渦式的礦區不斷以各式姿態出現。尤其，很多都是保安林內的採礦，或許大家不知道保安林是什麼？所以可看看「水源保安林，水泥業者挖光光」<a href=\"http://www.cet-taiwan.org/node/1835\">http://www.cet-taiwan.org/node/1835</a>，就知道採礦是如何掏空我們的國土。而就在2013.11.01的今天，我們跟友團合作，讓在環保署專案審查的「芎林土石採取專區」在小組內被認定不予開發。要請大家持續關注採礦，十一月我們還會有一波行動唷！</span></p>\n<p><span><img alt height=\"371\" src=\"/sites/cet-taiwan.org/files/006.jpg\" width=\"660\" loading=\"lazy\"></span></p>\n<p><span> </span></p>\n<p><span><strong>工業汙染，空水廢毒汙染無處不在</strong></span></p>\n<p><span> </span></p>\n<p><span>到這時候有沒有覺得《看見台灣》其實應該歸類為悲劇片XD好啦！沒這麼慘，但看到桃園觀音海岸跟那些五顏六色的河川，什麼叫做化學濃湯我想影片中有很清楚的影像。工業、科技曾經帶動台灣的經濟起飛，但也讓我們失去了許多生存的可能，工業汙染<a href=\"http://www.cet-taiwan.org/industry\">http://www.cet-taiwan.org/industry</a>這個名詞開始在腦海中浮現，就像電影中火力電廠排放的二氧化碳、幾根煙囪讓南台灣變成看不見的城市，地球公民曾經在2009年擋下「台電大林燃煤電廠」<a href=\"http://www.cet-taiwan.org/node/537\">http://www.cet-taiwan.org/node/537</a>，但本來既有的空汙仍然存在，因此不斷推動「空氣汙染總量管制」<a href=\"http://www.cet-taiwan.org/node/1829\">http://www.cet-taiwan.org/node/1829</a>的概念，但至今還需要立法院內加把勁，希望讓我們可以有口好空氣可以聞。</span></p>\n<p><span> </span></p>\n<p><span>而關於水，則更貼近每個人。電影裡說，我們好像都漠視這些濃湯河水，認為是經濟發展必須要付出的代價，卻不知道這些水可能就是我們食用稻米的灌溉水，事實也接近如此，看看這篇「用了兩百年的霄裡溪水，十多年就被友達、華映壞光光」<a href=\"http://www.cet-taiwan.org/node/1707\">http://www.cet-taiwan.org/node/1707</a>，你就知道發生什麼事了。而南台灣的新園農場案，更是如出一轍，看看「高污染工業進駐台糖新園農場，北高雄農業斷脈危機」<a href=\"http://www.cet-taiwan.org/node/1574\">http://www.cet-taiwan.org/node/1574</a>，似乎汙染都沒有南北差距。我們曾經推動過「石化業放流水管制標準」<a href=\"http://www.cet-taiwan.org/node/1385\">http://www.cet-taiwan.org/node/1385</a>的更新，就是說石化業排出來的水至少應該符合基本的標準，然而還有許多產業排放出來的水遲遲未有最基本的管制，《看見台灣》後，我們應該一起努力更新法令，檢舉不良業者，不要再看到《濃湯台灣》了。</span></p>\n<p><span> </span></p>\n<p><span><strong>守護我們的家，產生行動吧！</strong></span></p>\n<p><span> </span></p>\n<p><span>《看見台灣》的最後一段，其實有用空拍告訴我們，可以選擇什麼樣的方式生活，讓台灣更好，無論是洪箱阿姨的選擇、賴青松的選擇，都是使用對土地更友善的模式，過生活。當然除了友善土地的必要，我私心的期待更多人可以從電影背後，了解現況與結構性的問題，希望大家可以瞭解地球公民所關心的每件事情，因為這些才是我們要永續在這個寶島上生活，最真實要面對跟改變的。&nbsp; </span></p>\n<p><span>電影最後綻放了許多笑容，給人無限希望。是呀！我們要抱持充滿希望的夢想去善待這片土地，更希望大家可以在《看見台灣》之後，去《瞭解台灣》進而《改變台灣》。也偷偷的希望，大家可以在感動或者是想要產生些行動力之餘，多做些甚麼，支持你所喜愛、認同的環保團體，支持一個讓台灣土地可以永續發展的非營利組織，無論是捐款、做志工，都會是很好的方式唷！</span></p>\n<p><span> </span></p>\n<p><span>最後，給我自己的朋友，希望大家在進電影院《看見台灣》之後，更可以瞭解我的工作到底是要做甚麼？在面對哪些問題？我上班的單位叫做地球公民基金會，一個僅靠大眾募款支持的環保團體，很希望大家來多多認識與了解嚕！</span></p>\n<p><span> </span></p>\n<p><span>看見台灣粉絲專頁：<a href=\"https://www.facebook.com/Abovetai\">https://www.facebook.com/Abovetai</a></span></p>\n<p><span> </span></p>"}, {"nid": 1860, "title": "蘋果投書：清境別再複製盧山經驗", "original_topic": "山坡地不當開發", "adopted_cats": ["森林守護與林業改革", "國土計畫"], "content": "<p><img alt height=\"371\" src=\"/sites/cet-taiwan.org/files/1-L9999535-%E6%96%B0%E5%BC%8F%E6%97%85%E7%A4%BE.jpg\" width=\"660\" loading=\"lazy\"></p>\n<p><span>文/ 蔡中岳（地球公民基金會台北辦公室主任）<br>\n<p>呂翊齊（地球公民基金會研究員） </span></p></p>\n<p>看見台灣後，內政部長李鴻源將清境農場中一百多家民宿從僅四家合法變成只剩七家違法需停業，魔術師的就地合法，確實又讓人「看見台灣」一次；而這精湛的戲法，巧門就在可以放寬容積率、讓違法農舍就地合法的「清境風景特定區都市計畫」中；此舉也再次凸顯南投縣府縱容非法、李部長受地方政治壓力虎頭蛇尾的軟弱。</p>\n<p>在南投縣政府的推動下，清境風景特定區早已如火如荼地展開，在環保署環評會及營建署區域計畫委員會進行審查。而在今年十月的政策環評會議中，南投縣府就坦承清境有水資源不夠、無汙水處理設備讓廢水直接排、交通擁塞等問題，但卻想要以此計畫將現存違建問題解決。然而都市計畫可以真正解決清境的問題嗎？讓我們來看看廬山。</p>\n<p>1986年因廬山非法違建浮濫，南投縣府就利用風景特定區就地合法，結果違建仍到處蔓延，因此1993年又進行通盤檢討擴增旅館用地，但此後廬山山河就不曾止息的崩裂，2008年九月辛樂克沖毀三棟飯店，而今整區因為深層地滑必須全區遷移。而現在南投縣府又想一模一樣的方式處理清境問題，很明顯，從清境的開發量和地質條件來看，這只可能再現廬山的歷史。</p>\n<p>解決開發違法超量的問題是要政府展現執法的魄力和遠見，南投縣府連頭痛醫頭都懶得想，回顧歷史也不會，竟然要複製一個完全失敗的案例。廬山經驗早已告訴我們：都市計畫只要透過通盤檢討便可不斷就地合法，這種爛戲碼還要在台灣的土地上演多久？</p>\n<p>除此之外，李鴻源還提到經濟部沒公告地質敏感區，缺乏相關法源，有關國土保育、都市計畫等工作，都會受連帶影響。然而，地質法過去在立法院躺了十一年，歷經八八風災、北二高走山等巨大地質災變後，於2010年底終於通過三讀，但法條通過後，主管機關經濟部至今仍不願意真切面對，始終未公告地質敏感區，這三年間不斷有消息傳出即將公告，研究調查案不斷發包，但至今仍沒一個影，內政部這麼說只是卸責的藉口罷了。我們強烈要求經濟部出來面對，三個月內公告地質敏感區，將山林還給我們共同的母親─台灣。</p>\n<p><span><span><strong>延伸閱讀：</strong></span></span></p>\n<p><ul></p>\n<p><li><a href=\"http://www.appledaily.com.tw/appledaily/article/headline/20131221/35523786/焦點評論：清境正步向廬山後塵（蔡中岳、呂翊齊）\">蘋果日報刊載版：清境正步向廬山後塵 2013.12.23</a></li></p>\n<p></ul></p>"}, {"nid": 1861, "title": "蘋果投書：清境早已不再清靜", "original_topic": "山坡地不當開發", "adopted_cats": ["森林守護與林業改革"], "content": "<p><span><span>文/傅志男 （地球公民基金會董事、國小教師）</span></span></p>\n<p><span>最近，「看見台灣」了嗎？清境地區違規民宿被起訴、南投縣府卻以「風景特定區都市計畫」為違法業者解套，又是一樁想「就地合法」的爛戲碼，但這也是台灣土地會潰爛的嚴重問題之一。</span></p>\n<p><span>筆者多次前往合歡山區旅遊、觀察，做了些記錄和心得。<br>\n<p>車行至霧社前，路過峽谷地形陡峭的人止關，昔日漢人為免侵犯到泰雅爾族人的傳統領地而遭遇橫禍，大多不敢越過此峽谷，此名便不脛而走；時至今日，還能觀賞到人止關的植被因陡峭而保有自然演替的闊葉樹和五葉松，算是意外收穫。 </span></p></p>\n<p><span><strong>剩下高聳瘌痢山頭</strong></span></p>\n<p><span>不久，紀念「霧社事件」莫那魯道等原住民抗日英雄的紀念公園和霧社商店街也一一路過，正當心中開始緬懷與想像起霧社事件的壯烈之時，不經意地往右方一看，猛然瞧見幾乎沒有水的「萬大水庫」，與昔日美名「碧湖」成了強烈對比，也落得諷刺之感。過往，和友人同遊碧潭邊時，幸運地與「朝思暮想」的藍腹鷳巧遇，那悠遊於潭邊森林的模樣，至今仍難以忘懷，可惜，今非昔比！望著枯竭的水庫，心想：那藍腹鷳安居何處？是否依舊保有自若的神情？</span></p>\n<p><span>2月時節，沿路，那或桃花、或李花、或梅花的行道樹，正以滿樹的白花、紅花夾道歡迎，驚豔之景映入眼簾，滿足之情盈滿心頭，但是，搭配的背景，卻是十分不搭嘎的高聳瘌痢山頭，沒錯！清境農場到了！</span></p>\n<p>\t<span><strong>原始森林開發殆盡</strong></span></p>\n<p><span>清境農場海拔約1700∼2100公尺，氣候涼爽，相較於平地的高溫，此區環境與氣候皆與溫帶地區相似，也因有許多民宿走歐式風格，且隨觀光業的愈加發達，旅館也愈加雄偉與高檔。但美麗建築的背後，所換來的代價卻是開發殆盡的山林，原始森林絲毫沒有立足之地！整個清境地區與往廬山方向的數座山嶺，其天然植被早已被高價產業道路、高山農業與高級房舍這「三高」給蠶食鯨吞了。</span></p>\n<p><span>很多人「看見台灣」了，但看見台灣結構性、關鍵性的問題嗎？還是覺得「你我都是幫兇、只要一般人民守法國家就能變好？」我們看得見政府和財團的關係和責任嗎？</span></p>\n<p><span>山林破壞的情況日益嚴重，廬山的土石流災情接二連三，萬大水庫也因水土不保而奄奄一息；而房舍林立的清境地區，在毫無一絲原始森林保護的情況下，人們的歐洲風情夢還能繼續多久？是否能永遠「清靜」呢？</span></p>\n<p><span><span><strong>延伸閱讀：</strong></span></span></p>\n<p><ul></p>\n<p><li><span><a href=\"http://www.appledaily.com.tw/appledaily/article/forum/20131206/35488645/焦點評論：清境早已不再清靜（傅志男）\">蘋果日報刊載版：清境早已不再清靜 2013.12.6</a></span></li></p>\n<p></ul></p>"}, {"nid": 1868, "title": "蘋果投書：錯誤組改危害國土", "original_topic": "國會/政策", "adopted_cats": ["森林守護與林業改革"], "content": "<p><span><span>文/ 楊國禎（靜宜大學生態學系副教授）；李根政（地球公民基金會執行長）</span></span></p>\n<p><span>最近，環境保育的課題因《看見台灣》而獲得很大的關注，而攸關環境保育最重要的環境資源部與農業部組織改造工程，正在立法院進行審議，卻鮮少獲得媒體及國人關注。</span></p>\n<p><strong
