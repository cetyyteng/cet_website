    <script>
        const forestArticles = [{"nid": 232, "title": "獅子鄉草埔伐木案", "original_topic": "假造林真伐木", "adopted_cats": ["森林守護與林業改革"], "content": "<p><strong>上游規劃伐木地，下游花錢整河川，<br>\n<p>台灣是如此「處置」我們的山林水土......</strong><br></p>\n<p>文/李根政(地球公民協會執行長)</p></p>\n<p>\t2007年11 月8日，偕同公視記者燕如及攝影，一同勘查獅子鄉的伐木林地，其中一片林地，是已復育26 年的天然林（據地主表示約在民國70年左右砍伐過一次，爾後任其演替，讓土地公來種樹，本區常態約 10年伐木一次），僅賣給木材商 1公頃2萬元，木材商將整片山頭的森林全面皆伐，僅留下樹頭，光禿的山野，與 3年前我們所阻止的全民造林如出一轍。</p>\n<p>\t這是屬於原住民保留地的「林地」，依照林業相關法規，就是做為「造林」、「伐木」的經濟林地。然而，放眼週邊未砍伐前山林是如此美好，我認得出的九芎、大葉楠、山枇杷......已成蓊鬱森林，怎麼只值2萬元？崎嶇的山地，坡地從30度到 6、70度不等，在此開腸破肚的開闢伐木道路，全面皆伐森林，難道不會衝擊水土？</p>\n<p>\t上山的途中，位於這片坡地下游──草埔的達仁溪河段正在進行河川整治工程，凸顯我們國家面對山林水土課題的重大矛盾，上游規劃伐木地，下游再花錢整河川，形成了惡整土地的永續工程。</p>\n<p>\t原住民的經濟與國土保育之間，必須建立配套，以現今台灣的經濟力，用2萬元買1公頃化育26年的天然林，不可能付不起；為了治山防洪，朝野政黨聯手提出的治水特別預算就高達 1,410億，其中原住民族地區治山防洪工程160 億、石門水庫集水區保育治理工程 65.76億 ；97年度水保局的預算 12.54億，林務局6億元，全都是用來蓋攔砂壩，進行坡地整治，這些大都是丟到水裡的無用工程，特別預算和常年預算加起來，每年就有近 47億。如以一公頃2萬元來保護林地10 年不砍伐，足以保護23.5 萬公頃的林地。對比之下，真是非常荒謬。</p>\n<p>\t台灣的山林政策該好好檢討。過去陳玉峰老師主張將台灣的林地分為經濟地和保育地，徹底擺脫唯用的林業政策，是正確的方向。如果把焦點放在原住民保留地，就要進一步檢討目前的林地、農牧用地編定是否合理？以過去在屏東地區勘查造林地的經驗，許多的林地、農牧用地根本不適合開發，但政府不檢討、不處理的結果，就只好讓這些傷口不時化癑、潰爛，然後付出更多的代價去收拾。</p>\n<p>\t這個伐木案讓我再度確信，救火式的環境運動也許能解決一時的問題，但根本之道還是需要募集資源，建立專業分工的體系，才能長期持續關注環境課題。</p>\n<p>&nbsp;</p>\n<p><div><img alt height=\"320\" src=\"/sites/cet-taiwan.org/files/u1/1_17.jpg\" width=\"214\" loading=\"lazy\"></div></p>\n<p>&nbsp;</p>"}, {"nid": 233, "title": "兩萬元的代價", "original_topic": "假造林真伐木", "adopted_cats": ["森林守護與林業改革"], "content": "<p>在禁伐令全面發布的政策下，屏東縣獅子鄉卻有大量砍伐樹木的事件發生。看著大量被砍光的山頭，雖然知道是合法申請，可是心中不免充滿疑惑，難道不能用其他方式，來對待這片山林嗎？ 2008年3月24日 星期一</p>\n<p>文/柯金源、林燕如（公共電視台）</p>\n<p>\t在禁伐令全面發布的政策下，屏東縣獅子鄉卻有大量砍伐樹木的事件發生。看著大量被砍光的山頭，雖然知道是合法申請，可是心中不免充滿疑惑，難道不能用其他方式，來對待這片山林嗎？</p>\n<p>\t順著台九線往屏東楓港方向南進，來到獅子鄉草埔村的山上，沿路上都可以感受到恆春半島的強勁風勢，隱約在搖動的樹叢間，看到幾座山頭，有被砍伐過的痕跡，少了樹木的屏障，山頭的風更大了。到了現場，只能用滿目瘡痍來形容。鄉公所人員表示這是合法申請的砍伐案件，因為是屬於原住民保留地的林業用地，本就可以造林、砍伐循環使用，民眾只要依法向縣政府取得採運許可證，就能夠賺取木材收入。而每年農委會也會提供給縣政府可伐木的面積額度，讓縣市政府有所依循，在額度進行管制。為了避免對地表造成更大的破壞，也對每個案件申請限制伐木面積，最多只能申請兩公頃的開採，不過即使程序合法，現場看到裸露樹頭跟鬆軟的土質，還是讓人擔心水土保持的問題。而這其中牽涉到的，是原住民的生計問題。</p>\n<p>\t在草埔造林30多年的李正忠，說出了自己的心情，即使知道賣木材的收入微薄，一公頃最差的時候甚至不到一萬元，但是為了下次收成，還是不得不賣。而部分林農為了有更好的收入，想盡辦法在土地上做最大的效益使用，我們在通往草埔的途中，就看到林下全都是一朵又一朵盛開的山蘇......，保育與生計之間，常常都只能用妥協的方式進行。</p>\n<p>\t96年屏東縣政府率先在常有洪災發生的瑪家鄉和三地門，以自行籌款的方式，推出限制伐材補償方案，鼓勵林農留下樹木，以十年為一個期間，按材積數給予補償，到96年10月底，已經補償了二百多萬元（大約28公頃）的林木。</p>\n<p>\t不過，長年關注台灣山林的李根政老師認為此問題的根本之道，是從中央的林業政策做通盤檢討，將防災防洪等工程費用，重新分配，土地地目也必須盡快清查重新劃分，讓國土復育條例正式立法通過，才是徹底解決山坡地的問題。</p>\n<p>\t按照印度農業大學的研究，一棵50年壽命以上的大樹在生態上所產生的週邊效益，包括製造氧氣、改善土壤等等，就超過四千萬元以上的價值。兩萬元的代價，就能換取一公頃的森林。這樣的帳本，似乎怎麼都不划算！</p>\n<p>&nbsp;</p>\n<p><div><img alt height=\"214\" src=\"/sites/cet-taiwan.org/files/u1/1_18.jpg\" width=\"320\" loading=\"lazy\"></div></p>\n<p>需二人合抱的大樹，就這樣被砍掉了。</p>\n<p><img alt height=\"214\" src=\"/sites/cet-taiwan.org/files/u1/2_17.jpg\" width=\"320\" loading=\"lazy\"></p>\n<p><div>未砍伐前的森林，是非常美的天然林。</div></p>\n<p><div><img alt height=\"214\" src=\"/sites/cet-taiwan.org/files/u1/3_7.jpg\" width=\"320\" loading=\"lazy\"></div></p>\n<p><div>伐木現場，光禿一片。唉！只為2萬元。</p>\n<p>\t（本文經作者同意，由本刊節錄、轉載自2007年11月14日公共電視台「 我們的島」第428集節目內容）&nbsp;</p></div>\n<p>&nbsp;</p>"}, {"nid": 235, "title": "「還我自然河川」公聽會報導", "original_topic": "水資源與環境治理", "adopted_cats": ["森林守護與林業改革", "國土計畫"], "content": "<p><img alt height=\"341\" src=\"/sites/cet-taiwan.org/files/080806-001.jpg\" width=\"660\" loading=\"lazy\"></p>\n<p><strong>全面檢視不當之野溪整治及坡地治理問題</strong></p>\n<p><h6>2008年3月25日 星期二</h6></p>\n<p><strong>全面檢視不當之野溪整治及坡地治理問題</strong><br>\n<p>文/曾瑾珮（水患治理監督聯盟執行秘書）</p></p>\n<p>\t不當的野溪整治及山坡地治理工程，不僅浪費民脂民膏，更毀壞了台灣美麗的山河大地，反而造成更多災害。在地球公民協會、水患治理監督聯盟及長期觀察河川生態的民間人士共同關注下，立法院經濟及能源委員會於2007年11月22日召開「還我自然河川---全面檢視不當之野溪整治及坡地治理問題」公聽會，就野溪整治及坡地治理之效益與生態破壞、農委會水土保持局及林務局預算的合理性進行討論，但官方並未就過去整治的效益提出完整分析，究竟過去五年或十年間政府花了多少錢做了多少工程，是否能發揮實質效益、為何沒有保全對象的國有林班地仍有整治工程、為何民間長期紀錄許多無用的整治工程還是繼續施作？這些問題仍得不到官方回應。</p>\n<p>\t地球公民協會執行長李根政以簡報闡述1960年代以後土石流已成為台灣的主流，過去開山挖路及大批的農業上山，原始森林被改造為人造林，更加惡化了每遇颱風就山崩路塌的現象，而大部份的治山防洪和水土保持工程只是在補破網。根本的解決之道應是「國土復育」----檢討高山農業政策、針對林道及農路做經濟效益分析，而非繼續做讓工程永續的生態「工法」。最好的「生態」工法應是先探討工程的必要性，避免對大自然做無謂的擾動。</p>\n<p>\t綠黨中執委溫炳原則表示1410億元的治水預算是朝野政治分贓的結果，大量的水泥工程重創了原鄉部落。易淹水地區水患治理推動小組只找「水利、土木工程、景觀、生態」這四類專家，卻忽略氣候變遷、地質以及人文方面的專家，選擇性地採用工程取經的研究報告，獨厚工程營造，這樣的對策不可能有效，反而是將錢丟到水裡。</p>\n<p>\t綠色陣線協會的顧問林長茂則表示山坡地崩塌的一大主因是濫墾濫伐，但是林務局和水保局一直不願面對真相。現在水保局變成了「水土保持工程局」，好像只有工程能解決一切。事實上石門水庫上游有很多林業政策是錯誤的，應該加以修訂。林種就是其中之一，例如許多學者專家所作的調查報告都指出日本柳杉、桂竹、綠竹這些林種容易造成崩塌，但是250億元的石門水庫整治計畫對這方面編列的預算非常少，若這個問題不解決，未來的崩塌會更大。而有些民代常對林務局取締濫伐施壓，要求其不能把濫伐者移送法辦，如果不從，即凍結預算，希望民意代表不要凌駕司法。</p>\n<p>\t廖本全副教授則指出保育團體及學界談的是政府在很多治理計畫中，偷偷放了「非必要」的治理進去，政府的規劃設計根本沒有考慮系統性分析，像是最重要的水系和流域分析。歷史告訴我們採用不當工程只會製造更多災難，但政府還是一意孤行，他要求政府回頭檢討評估8年1,410億的治水預算工程的必要性，沒有保全對象的工程應立即停工，否則投入更多的錢反而可能製造更大的災難！</p>\n<p>\t<strong>最後，主席立委賴幸媛做成以下十點結論：</strong><br>\n<p>1.林務局和水保局應在未來1年來內，對治山防洪(包括野溪整治及坡地治理)工程的經費及效益，做全面檢討，並提出檢討報告。</p></p>\n<p>\t2. 政府應對野溪整治及坡地治理之工程計畫先做系統性生態的效益評估，包括保全對象、生態效益、工程效益，與工程成本等。林務局和水保局於事後也應該追蹤維護管理，建立審議停損的機制，務必將生態的專家學者及環保團體納入此審議機制。再有，請水利署、水保局與林務局於一個月內建立此一監督審議機制，並交建立機制報告送經濟委員會，立法院永續會將推薦學者專家。</p>\n<p>\t3.水利署、水保局不得對沒有必要性的工程施工。</p>\n<p>\t4.應該回歸到經建會前幾年所提的「國土復育」計畫，整個野溪整治、坡地治理及集水區等，也應回到「國土復育」的觀念及計畫，從這裡再出發。</p>\n<p>\t5.有關坡地植生，應以天然復育為優先，工程計畫應納入植被生態演替的趨勢之評估，請水土局及林務局在做工程評估時一定要能這樣處理。</p>\n<p>\t6.對於目前正在進行的工程做全面的體檢，明確它的保全對象，對生態有巨大破壞的個案，要立即停工。<br>\n<p>7.請水保局和林務局研擬不適當的工程預算，挪移到非工程的對策及方案上面。</p></p>\n<p>\t8.相關工程計畫的資訊必須要公開，無論在事前或事後在進行執行工程前，應該建立施工前的生態環境資料，進行環境和工程效益之評估，請環保團體專家學者建立及確立此種審查和停損機制，所有的資訊皆應該上網公開，以達資訊真正公開化及透明化。</p>\n<p>\t9.民意代表和官員應該自我節制，不應該包工程或綁工程。</p>\n<p>\t10.對於公務員的考核，不應該以預算執行率做考核的項目，應以工程的效益為考核的基準。</p>\n<p>\t◎參與此次公聽會的民間學者專家有：地球公民協會執行長李根政、台灣蠻野心足生態協會理事張豐年、雲林縣野鳥學會理事長陳清圳、台灣綠黨中執委溫炳原、台北大學不動產與城鄉環境學系副教授廖本全、綠色陣線協會顧問林長茂、中興大學水土保持學系教授鄭皆達、中興大學森林系教授羅紹麟、立法委員吳明敏國會研究室顧問許銘義、中興大學水土保持學系教授陳鴻烈、台灣大學農業經濟學系教授林國慶。政府代表則有農委會副主委林宗男、農委會水土保持局局長吳輝龍、農委會林務局局長顏仁德以及經濟部水利署副署長楊偉甫。</p>"}, {"nid": 236, "title": "給自然一個喘息的機會", "original_topic": "水資源與環境治理", "adopted_cats": ["森林守護與林業改革"], "content": "<p>整整六年，筆者和一些夥伴長期在雲林山林進行一些調查，除了印證雲林淺山地區孕育豐富的自然資源，同時也發現境內存在許多的問題，這些問題包含棲地破壞（陸砂開採、水庫興建以及野溪整治）；野生動物獵捕；環境污染等。 2008年3月25日 星期二</p>\n<p><strong>雲林野溪整治實錄</strong><br>\n<p>文/陳清圳（雲林縣野鳥學會常務理事）</p></p>\n<p>\t整整六年，筆者和一些夥伴長期在雲林山林進行一些調查，除了印證雲林淺山地區孕育豐富的自然資源，同時也發現境內存在許多的問題，這些問題包含棲地破壞（陸砂開採、水庫興建以及野溪整治）；野生動物獵捕；環境污染等，使得幾年來雲林淺山地區地景地貌、生物相變化甚劇，除了我們認為造成棲地破壞無可彌補的水庫興建外，後來發現野溪整治就如同癌症一般，從初期零星幾個點，後來逐漸擴散到整個丘陵，其對環境的破壞，遠遠超出我們的想像。</p>\n<p>\t<strong>孕育生命的野溪</strong></p>\n<p><div><img alt height=\"213\" src=\"/sites/cet-taiwan.org/files/u1/1_20.jpg\" width=\"320\" loading=\"lazy\"></div></p>\n<p><div>斗六台地的野溪是野生動物重要棲息環境<br></p>\n<p>&nbsp;</p>\n<p><div>根據特有生物保育中心及中區水資源局的調查報告指出，雲林淺山地區至少包含318種植物、81種鳥類以及21種兩棲類。這些都只侷限在阿里山事業林區第61-73林班地，其中就包含了圓葉布勒德藤、台灣岩生秋海棠等珍稀植物、25種保育鳥類，但是很不幸的這些珍貴的動植物大多生長在溪谷兩側，尤其八色鳥的巢位，主要就構築在鬱閉植被的溪谷兩側，一但溪谷遭受破壞，當然就影響到八色鳥的繁殖；整個族群當然會受到影響，更遑論兩棲類和爬蟲類。在2003年以前，進行該地調查的研究員指出，溪谷兩側的食蛇龜到處都是，晚上只要放十個捕捉籠，隔天大致會有七、八個籠子會捕捉到食蛇龜，而目前放了一星期，能捕獲到一兩隻已經不錯了。</div></p>\n<p>&nbsp;</p>\n<p><div><strong>工程的進入</strong><br></p>\n<p>筆者從2000年開始在斗六台地進行生物的調查，基本上斗六丘陵大部分都屬於阿里山事業林區公有林班地。而這三年來野溪整治大部分集中在林內鄉、斗六市山區。屬於阿里山事業林區第61到73林班地，以林務局治理組的案件來說，在2004年、2005年以及2006年共有19處整治地點，如果包含水保局整治案大約有43個點。而整治的原因千奇百怪，經過筆者詢問以及調查員的調查，不外乎希望產業道路水泥化、部分竹林地有些坍塌、為了方便到林地去造林、進去果園可以縮短距離等；更誇張的是，在公有林班地中還有一段溪流被治理，上下游保持很自然的狀態，從航照圖來看，前一年都還保持很天然的植被，隔年就有一條路經過，再一年野溪就被整治了。這典型是先有路，再藉由路徑的開發，進而進行溪流「整治」。</p>\n<p>\t\t而在2002-2004年三年期間，林務局在林內鄉19個整治點就花費了6810萬元，其實花錢也就算了，一場山林蹂躪的戲碼，不斷的上演。舉一個案例來說，在66林班地我有一個長期監控的地方，原來的溪流林蔭非常茂密，自然狀況很好。它在2005年進行了一次工程，開挖後旁邊的邊坡被切除，之後發現基地有滑落的現象，2006年再整治一次，在年底又發現坍塌，於是2007又整治一次。我問當地居民，此地整治原因為何？居民說：「如果開一條路過去，以後到他的果園可以縮短200公尺的距離。」如此理由，是不是以後居民有需要，都可以比照辦理。&nbsp;</p></div>\n<p><div>&nbsp;</div></p>\n<p>&nbsp;</p>\n<p></div></p>\n<p><div>&nbsp;</div></p>\n<p><div></p>\n<p><div><img alt height=\"240\" src=\"/sites/cet-taiwan.org/files/u1/2_19.jpg\" width=\"320\" loading=\"lazy\"></div></p>\n<p><div>整治三部曲-挖路、築岸、護坡。</div></p>\n<p></div></p>\n<p><strong>生態工法？萬能的護身符？</strong><br>\n<p>再者，在2003年筆者與記者曾經揭發過，野溪整治工程造成八色鳥棲地的消失。事件披漏後，官員為此進行檢討，說未來工程期間，將避開八色鳥的繁殖季，工程採用生態工法。聽到這種說法，當然會感覺會無力感，因為大部分的野溪其實都不需整治，假如林班地內沒有任何保全對象，為什要需要整治？而我看到林班地的整治幾乎都沒有保全對象，這是令人無法理解的地方。如果在村莊或有住家的地方，我當然不反對。官員不去檢討需不需要，而是在預設必須整治的前提下，進行整治方式的討論，當然會倒果為因。不過我們也知道，官方的野溪整治案件，後面都有關說的壓力，這也是他們不得不買帳的地方。</p></p>\n<p>\t另外生態工法，聽起來非常華美的名詞？但是在林班地的整治工程，我們實在看不出有任何生態的意涵。在山林裡坍塌本來就是大自然運行的一部分，藉由坍塌讓生物可以持續生存，不會被演替掉。而過去三年，我們在一一檢視治理單位的整治方法，更會讓人無法相信政府的承諾與威信。在野溪整治工程中，我們可以看到的現象是，遠看溪流的堤岸是一顆顆石頭堆砌而成，但是近看卻是由水泥板模灌製而成像石頭狀的水泥牆，偉哉政府？看來我對於生態工法課程必須重修。</p>\n<p>\t<strong>零存整付？消失中的伊甸園</strong><br>\n<p>一個大型工程的開發，無可避免的造成環境的破壞與消失，當然容易引人關注，湖山水庫就是一個好例子。但是小型工程的野溪整治卻不容易引人注意。假如湖山水庫工程會直接造成40對八色鳥消失，一條野溪可能造成2-4對八色鳥棄巢無法繁殖，那43個點至少影響到近百對八色鳥的生存，以八色鳥做為當地環境的指標物種，那影響層面更為寬廣，根據當地的研究員林瑞興指出，以八色鳥的活動範圍作為緩衝區的話（右圖），包含朱鸝、藍腹鷴、鳳頭蒼鷹、松雀鷹、大冠鷲、赤腹鷹、灰面鵟鷹、領角鴞、黃嘴角鴞、翠翼鳩、深山竹雞、畫眉、台灣紫嘯鶇、白尾鴝、灰喉山椒鳥和紅尾伯勞等16種保育鳥類都會受到衝擊。而食蛇龜、食蟹貓等珍稀物種當然也無處容身。</p></p>\n<p>\t<strong>嚴格把關</strong><br>\n<p>針對不當的野溪整治，長久以來缺乏一個控管的機制，當然我們也知道林務局與水保局也有內部的審核流程，但是每當問題產生後，就代表機制出了問題，是不是只是紙上作業，還是根本沒有審核？而我們提出問題時，常常聽到官方說這些是必須進行的工程、他們做的多好，但是仔細一聽，主辦單位提到的是他們一些成功的案例，而環保團體關注的是，不需要開發的地方就不要開發，兩者之間似乎是平行線。</p></p>\n<p>\t不過，在這次野溪整治公聽會中，筆者也嗅出不同單位的反省能力，尤其林務局也坦承有做不好的地方，未來會多聽保育團體的聲音。但與其如此，倒不如主辦單位能夠建立比較好的審核機制，讓民間代表能夠參與審核，畢竟同樣要做的是替山林把關。</p>\n<p>\t<strong>給自然一個喘息的機會</strong><br>\n<p>近年來，不知道是人類跟自然犯了什麼仇，還是基因裡容不下鬱鬱山林的因子，只要人類到達之處，工程開發隨即而來；或是山林及野溪對人類潛藏威脅，不去除難以安眠？人類慢慢的封鎖自己，對來自自然的血脈一一斷絕。一位從事紀錄片拍攝者，有一次進入斗六丘陵，看到整片山頭、溪床變成漠漠黃土，可能體內大自然的基因被橫屍遍野的情景觸動到，就如同魔界二部曲的樹人看到森林被砍伐時，憤怒瞬間爆發，這位朋友痛哭失聲，久久不能自己。</p></p>\n<p>\t或許你會認為野溪整治和我何關？水庫興建距離我太遙遠？但是不要忘記，一但大自然反撲時，一切的苦難是大家共同承擔，至少你當時是冷漠以對。跨入2008年之際，不管是藍火或是綠火，筆者誠懇呼籲請饒了台灣這片山林，讓山林有一個喘息的機會。</p>"}, {"nid": 255, "title": "停止建台水泥繼續蹂躪半屏山，請市府接手開發案，改為「公辦開發」促使礦區再生【新聞報導】", "original_topic": "新聞報導", "adopted_cats": ["森林守護與林業改革"], "content": "<p>~相關新聞報導~</p>\n<p>半屏山舊礦區開發 環保團體喊卡</p>\n<p>〔記者曹明正／高雄報導〕 自由時報 2008.5.17<br>\n<p>建台水泥將投入六十億元，開發位於半屏山麓的舊礦區，做為商業區和住宅區，不過環保團體認為，當地水土保持復育區都還待商榷，提出要產業，不要更多空屋、確保半屏山生態等十大建言。<br></p>\n<p>包括高雄市綠色協會、地球公民協會、台灣濕地保護聯盟、左營舊城文化協會、高雄市柴山會、文化愛河協會等六個團體聯合發出聲明，要求「停止建台水泥繼續蹂躪半屏山，請市府接手開發案，改為『公辦開發』促使礦區再生。」</p></p>\n<p>聲明指出，建台水泥舊工業區不是非得變更為住宅及商業區，可更新為科技園區、軟體金融產業區或休閒度假村；一旦變更為住商區，對高雄產業空洞化及住宅過剩，將會雪上加霜。</p>\n<p>半屏山地質脆弱，一九六一、六六年曾兩度山崩，造成廿多人死亡、卅多人失蹤，允許興建高樓層的住宅區，誘發山崩的夢魘可能重演；環保團體也認為，當地至少要有二分之一的土地回饋做為保安林，才能復育生態、保護天際線。</p>\n<p>環保團體對於建台水泥的財務狀況也多所擔心，強調半屏山地景屬於高雄市民共有的公共財，應交由市府公辦開發才有保障；市府建設局回應，「半屏湖畔香榭綠都開發」簽的是意向書，未來有關環保等各項評估，都會依法予以審議。</p>\n<p><a href=\"http://www.libertytimes.com.tw/2008/new/may/17/today-south5.htm\">http://www.libertytimes.com.tw/2008/new/may/17/today-south5.htm</a></p>\n<p>半屏山開發案 環保界反對</p>\n<p>【聯合報╱記者凌珮君、徐如宜／高雄報導】 2008.05.17 04:14 am <br>\n<p>建台水泥公司計畫將半屏山麓舊礦區結合部分國有地，開發為商業區和住宅區。高雄市綠色協會等環保團體，昨天提出質疑並反對，建議應改為「公辦開發」。</p></p>\n<p>市府都發局長吳義隆表示，請環保團體將意見送都委會併入審議。</p>\n<p>綠色協會總幹事魯台營指出，建台水泥宣稱將投入60億元，開發此基地，並與市政府簽署開發意向書，希望加快通過變更地目的腳步。綠色協會、地球公民協會、台灣濕地保護聯盟、左營舊城文化協會、文化愛河協會、柴山會等環保團體，昨天都表示反對，並向都市發展局提出異議書，要求修正開發內容。</p>\n<p>魯台營指出，開發區地質並不穩定，應取消興建住宅區，保留至少超過二分之一土地，復育為森林，做為水土保持之用。而且開發案整體計畫基地將近10公頃，卻以半屏山後巷做為綠地，國有土地做為公共空間，實質綠地僅有0.6公頃，比一般工業區變更還低，讓環保團體無法接受。</p>\n<p>環保團體認為此開發案規劃有些不當之處，他們質疑建台水泥的財務狀況，並建議市府要求建台水泥完成半屏山水土保持復育區的驗收，才能夠送件，進行變更。</p>\n<p>對於綠色環保團體的建議，都發局長吳義隆表示，建台水泥開發案尚未召開都委會，環保團體有意見可將書面意見送都委會併入審議，都委會將會一併納入考量。</p>\n<p>吳義隆說，建台開發案是市府建設局的招商計畫之一，其中北邊靠半屏山二公頃多的國有土地，目前都市計畫分區使用是開發為「園道」和「綠地」，南邊屬商業區和住宅區部分是建台的私有地，該案環境影響評估尚未通過，各界都可向都市計畫委員會表達意見。 </p>\n<p>【2008/05/17 聯合報】@ <a href=\"http://udn.com/\">http://udn.com/</a> </p>\n<p>開發半屏山案 環團聯合反對</p>\n<p>【張舒婷／高雄報導】 中國時報 2008.5.17<br>\n<p>高市多個環保團體十六日共同反對建台水泥開發半屏山麓舊礦區，除質疑建台水泥財務能力外，也要求建台水泥先完成半屏山水土保持復育區的驗收後再送件。建台水泥回應，案子早就通過環評，並將與招商對象共同擔負經費，環團擔憂的部分不成問題。 </p></p>\n<p>位於半屏山麓舊礦區約7公頃餘的建台水泥，計畫結合2公頃多的國有土地，開發為商業區和住宅區。建台水泥宣稱將投入60億元開發此基地，並與市政府簽署開發意向書。環保團體認為是試圖藉由此意向書，讓都市計畫委員會加快通過變更地目。 </p>\n<p>質疑建台水泥財務 </p>\n<p>高市環保團體昨天包括高雄市綠色協會、地球公民協會、台灣濕地保護聯盟、高雄市左營舊城文化協會、文化愛河協會、柴山會，都行文都市發展局，齊聲反對建台水泥開發案。 </p>\n<p>環保團體表示，建台水泥形同破產、財物能力堪憂，實質投入的整地費用不到1億元，其餘都為轉賣土地給其他開發商的售地行為。相對於統一夢時代投入300億元，以購物、觀光及商務旅舍為開發主題，滿足高雄都會區及國際商務、觀光旅客的遊憩休閒需求為主軸，建台水泥的開發意圖明顯不同。 </p>\n<p>要求做好水保再送件 </p>\n<p>此外，環保團體質疑，半屏山採礦停止後曾發生土石流，市府於八十六年要求建台水泥進行水土保持計畫，至今10年仍未通過驗收，連 半屏山水土保持計畫都尚未做好，如何做好開發案？大家應記取九二一大地震的教訓，不應在未完成水土保持驗收工作前就進行開發。 </p>\n<p>環保團體也表示，高雄目前住宅數目遠超過現在及未來的人口需求，建台水泥開發案不一定要變更為住宅、商業區，可更新為科技園區、軟體金融產業區或休閒度假村，而且至少應有二分之一的土地做為保安林。對此，建台水泥強調尊重環保團體的看法，但全案依官方法定程序進行時，便已決定土地更新方向，所以很難隨意變更。 </p>\n<p><a href=\"http://www.tol.com.tw/CT_NS/CTContent.aspx?nsrc=B&amp;ndate=20080517&amp;nfno=N0551.001&amp;nsno=1&amp;nkeyword=%a5b%ab%cc%a4s&amp;SearchArgs=Keyword%3d%a5b%ab%cc%a4s%26Attr%3d%26Src%3d7%26DateFrom%3d20080423%26DateTo%3d20080522%26ShowStyle%3d2%26PageNo%3d1%26ItemsPerPage%3d10&amp;App=NS\">http://www.tol.com.tw/CT_NS/CTContent.aspx?nsrc=B&amp;ndate=20080517&amp;nfno=N0...</a></p>"}, {"nid": 257, "title": "一條牛要剝幾次皮？！高雄市環保團體質疑--「建台水泥半屏湖開發計畫」", "original_topic": "礦石採取", "adopted_cats": ["森林守護與林業改革"], "content": "<p><strong>相關新聞報導</strong></p>\n<p><strong>半屏湖開發計畫 環團質疑違反綠化承諾</strong></p>\n<p>（中央社記者程啟峰高雄六日電）</p>\n<p>\n<p>計畫開闢為商業區和住宅區的建台水泥礦廠，昨天一場豪雨後，今天仍是一片水鄉澤國，環保團體今天下午前往會勘發現，十公頃基地中約有八成積水，儼然是一處大滯洪池，環保團體認為，這顯示礦廠有相當水土保持的需求，一旦開發成為建地，將造成下方三鐵共站相當的排洪壓力。</p></p>\n<p>\t地球公民協會等環保團體今天在高雄市舉行記者會，質疑「建台水泥半屏湖開發計畫」違反綠化承諾，執意興建住宅區，糟蹋半屏山美景，呼籲業者三思，隨後並上山會勘。</p>\n<p>\t地球公民協會說，建台水泥開發案環境影響評估，要求該開發案需考量逕流水量，但是該公司僅規劃「地下」三個滯洪池，顯然不符合需求，應朝向「露天」滯洪池的作法。</p>\n<p>\t協會指出，1997年市府要求建台水泥在半屏山進行水土保持計畫，至今十年尚未通過驗收，其中還涉及高達新台幣三億元的土石利益，令環保團體質疑，一個連水土保持計畫都做不好的公司，又如何能夠執行聲稱將投入六十億元的開發案。</p>\n<p>\t協會呼籲，市府將建台水泥的開發案歸零，讓十公頃的基地回復為保安林、復育森林，以加強半屏山的水土保持，保證三鐵共站的安全。</p>\n<p>\t協會又說，若以建台水泥自身所估計十公頃基地價格為二十億元，其中二成五為公有土地，環保團體呼籲市府徵收私有土地，復育森林，以森林和湖泊作為高雄市的入口意向，讓來自高鐵、台鐵的遊客，一進入高雄市就看到滿目綠意，體驗一個充滿自然生機的城市。970606</p>\n<p>\t<a href=\"http://www.cna.com.tw/localnews/pageview.php?id=200806060089&amp;area=e&amp;page=06&amp;code=2930de211cb1bf9275e2437e43443579\">http://www.cna.com.tw/localnews/pageview.php?id=200806060089&amp;area=e&amp;page...</a></p>"}, {"nid": 269, "title": "緊急通知：7月14日（週一）內政部營建署即將召開「國家公園全面修法」公聽會", "original_topic": "國土治理", "adopted_cats": ["森林守護與林業改革"], "content": "<p>請踴躍參與7月14日（一）「國家公園法全面修法」（草案）公聽會，一起守護國家公園！</p>\n<h3><strong>緊急通知：</strong></h3>\n<p>請踴躍參與7月14日（一）「國家公園法全面修法」（草案）公聽會，一起守護國家公園！<br>\n<p>開會事由：召開「國家公園法全面修法」（草案）公聽會<br></p>\n<p>開會時間：97年7月14日（星期一）上午9時30分<br></p>\n<p>開會地點：內政部營建署5樓大禮堂（台北市八德路2段342號）<br></p>\n<p>附件為營建署發給蠻野心足生態協會的開會通知書及修法版本，請參閱。<br></p>\n<p>----------------------------------------------------------------------------------</p></p>\n<p>各位朋友：</p>\n<p>\t7月14日（週一）內政部營建署即將召開「國家公園全面修法」公聽會。<br>\n<p>原本以為6月20日立法院擱置修法後，營建署應彙集各領域專家學者、相關機關充分討論，形成草案後再進行社會公聽等程序。不料，在短短20幾天內，連國家公園計畫委員都未曾參與的情況下，營建署即推出一個荒腔走板的全面修法條文。</p></p>\n<p>\t這個全面修法的版本，總條文從原來的30條，增加為43條，除了顯得疊床架屋外、繁瑣混雜外，在內容上更存有重大爭議，除了納入部分立委所主張的原、住居民參與國家公園計劃審議，開放狩獵、捕魚外，更大開保育後門，包括史蹟保存區、特別景觀區、生態保護區等，竟然有條件允許興建纜車、溫泉利用、自來水設施、佈設海底電纜等...；一般管制區仍允許採礦，簡直是為大魯閣國家公園內的水泥業者持續解套，比部分立委所提版本更為糟糕，完全喪失國家公園保育的核心價值。</p>\n<p>\t民間團體支持國家公園的經營管理，應秉持資訊充分、即時、完整公開之原則，納入原住民、在地居民、保育團體的參與機制，但前提是應確保國家公園保育宗旨不致扭曲。</p>\n<p>\t再者，修法之前應進行國家公園設立以來之總體檢，釐清現行母法是否有不足之處，亦或執行面之缺失，如確為法令缺陷則應對症下藥，延請各界專家學者，相關利害團體、人士，妥為釐訂條文，進行充分對話，而非草率為之。</p>\n<p>\t請關心國家公園的各界朋友，踴躍參與公聽會，讓內政部聽到我們的聲音！</p>\n<p>\t地球公民協會執行長．李根政2008/7/11</p>"}, {"nid": 280, "title": "中國國民黨反對台灣國土復育？支持山區濫墾？   馬準總統，您的意見是什麼？", "original_topic": "國土復育條例", "adopted_cats": ["森林守護與林業改革", "國土計畫"], "content": "<p>&nbsp;</p>\n<p>中國國民黨籍立委孔文吉、林滄敏、邱鏡淳等人，於立法院經濟委員會提案要求：在「國土復育條例」尚未完成立法前，所執行之「國土復育策略方案暨行動計畫」並無針對<span>環境保護</span>及<span>人民權益</span>二者取得平衡的詳細專業評估與<span>減碳規劃</span>，嚴重影響國家未來發展，且意圖規避民意機關之監督，應立即停止執行。對此決議，民間團體呼籲國民黨勿讓馬總統的政見立即跳票，於大會時否決此提案，重新再議。</p>\n<p>馬英九準總統的環境政見，第一項就提出要「進行台灣國土復育總體檢，落實中長程的國土規劃」，包括了檢討復育國內沿海及高山地區的國土破壞；推動國土(國土計畫、國土復育、海岸保護、地質保育)立法及環境信託法規與配套措施；<strong>千米以上山區不闢建歩道以外的新道路，落實國土保安管理，重視森林保護與水土保持，勤查重罰國土違法使用情況，有效防治天然災變；推動兼顧國土復育與社區轉型的工作，以</strong><strong>4</strong><strong>年</strong><strong>500</strong><strong>億協助原住民重建家園，推廣原住民傳統上與生態共榮的倫理，進行國土復育。</strong><strong>&nbsp;</strong></p>\n<p>「國土復育條例」代表的是台灣的政府在長時期、一連串的大地災變後的新思惟，反省到過往人定勝天、工程至上、無限開發的發展模式是災變的主因，希望透過國土的復育、管制敏感地區的開發，促進環境的永續發展。然而，「國土復育條例」草案從94年5月行政院核定後，在立法院受到極大的阻力，在程序委員會遭擱置43次以上（2006年12月為止），原住民立委聲稱此為「滅族條例」，以致於連討論的機會都沒有。</p>\n<p>同一時間，行政院提出了「國土復育策略方案暨行動計畫」，在現有部會職權內推動復育計畫。較有指標價值的是：中橫復建緩議，高海拔山區及中海拔山區道路禁止新闢或拓寬，以及收回濫墾地、出租造林地等。</p>\n<p>然而，歷經立委和總統大選，來自墾民、民代的壓力上達天聽，加上預算編列有限、人力不足等因素，致使復育計畫在民進黨內部阻力重重、執行緩慢。</p>\n<p>根據林務局的統計顯示，國土保育範圍內現有的超限利用、濫墾、濫建面積達10,096公頃，從95年執行限期拆除、廢耕、自願返還計畫至97年3月為止，共執行了756.1408公頃，如果按照這樣的進度，<strong>預計要花</strong><strong>30</strong><strong>年才能執行完畢</strong>；另外，國有林事業區出租造林地，面積達81,727.9239公頃，目前只收回了1,400公頃，準此速度要花上131年才能完成回收，遠超一個世紀之久。</p>\n<p>如此小規模、低效率的國土復育計畫，連止血都有困難，遑論彌補大地的傷痕，減緩災變？為什麼中國國民黨的立委們認為這樣的計畫要「馬上」停止？理由何在？</p>\n<p>此一決議，是否代表中國國民黨認為台灣的國土無需復育，應放任山地農業、山林濫墾持續擴張？還是，國民黨有更好的復育策略？</p>\n<p>民間團體認為國土復育條例的確有許多尚待討論或釐清的空間，包括國土保育的範圍、復育策略、是不是如原住民立委聲稱的「滅族條例」等，都屬可公開討論的範疇，但我們只看到立法委員以聳動的政治語言，不分青紅皂白的封殺到底。國民黨執政期間，繼續擴張日治時代的伐木事業，所砍伐原始森林高達34萬公頃以上，為日治時代之數十倍；接著又貫穿中橫、北橫、南橫等山區道路，鼓勵榮民上山種植果樹，放任人民濫墾山林，發展高山蔬果等山地農業，實為台灣山林殘破之罪魁禍首。水患治理特別條例、石門水庫及其集水區整治特別條例，就是在國、親加碼下，在山區持續建設各種破壞山林的攔砂壩、水土保持工程，已嚴重破壞國土。難道，國民黨認為這些都沒有錯？要持續發展？</p>\n<p>推動國土復育本應是失而復得的國民黨政權對遍地瘡痍的台灣山林土地所能聊表心意的贖罪政策，為什麼「馬總統」還沒上台，國民黨立委諸公就等不及要求行政院停止所有的復育計畫？請問馬總統，您的意見是什麼？</p>\n<p>&nbsp;</p>\n<p><div><img src=\"/sites/cet-taiwan.org/files/u1/1_38.jpg\" alt height=\"295\" width=\"394\" loading=\"lazy\"></div></p>\n<p><div>守護台灣山林&nbsp; • 圖為鎮西堡的檜木林&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 李根政攝</div></p>\n<p><div>&nbsp;</div></p>\n<p><div><img src=\"/sites/cet-taiwan.org/files/u1/1__3_.jpg\" alt height=\"279\" width=\"396\" loading=\"lazy\"></div></p>\n<p><div>石門水庫上游的攔砂壩&nbsp;• 蘇樂橋 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 李根政攝</div></p>\n<p><div>&nbsp;</div></p>\n<p><div><img src=\"/sites/cet-taiwan.org/files/u1/1__2__1.jpg\" alt height=\"294\" width=\"385\" loading=\"lazy\"></div></p>\n<p><div><img src=\"/sites/cet-taiwan.org/files/u1/1__1__1.jpg\" alt height=\"289\" width=\"388\" loading=\"lazy\"></div></p>\n<p><div>台八線永遠修不好的公路。 &nbsp; &nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 林岱瑾攝</div></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>聲明團體：</strong>地球公民協會、台灣蠻野心足生態協會、台灣生態學會</p>\n<p>（本文為地球公民協會與友會於2008年4月29日立法院召開記者會所發之新聞稿）</p>\n<p>&nbsp;</p>"}, {"nid": 281, "title": "國家公園大崩解？", "original_topic": "國土治理", "adopted_cats": ["森林守護與林業改革"], "content": "<p>5、6月間，內政部依據「中央行政機關組織基準法」之規定，委員會為二級機關或獨立機構用之，乃提案刪除國家公園法第四條中的國家公園計畫委員會。結果，包括墾丁、陽明山國家公園在地立委，以及原住民立委們乃趁機提出對案，變成不可收拾的大修法，而且部分條文迅速在內政委員會通過。</p>\n<p>文/李根政（地球公民協會執行長）</p>\n<p><strong>民間發起搶救國家公園記實</strong><strong>&nbsp;</strong></p>\n<p>5、6月間，內政部依據「中央行政機關組織基準法」之規定，委員會為二級機關或獨立機構用之，乃提案刪除國家公園法第四條中的國家公園計畫委員會。結果，包括墾丁、陽明山國家公園在地立委，以及原住民立委們乃趁機提出對案，變成不可收拾的大修法，而且部分條文迅速在內政委員會通過。</p>\n<p>立委們提出的修法內容包括：第4條增列鄉（鎮、市）長及原住居民代表，將可以參與國家公園設立、廢止或變更的審議，而且比例不得少於三分之ㄧ；第13條中的原住民狩獵動物或捕捉魚類解禁；第16條國家公園設置前已居住於當地之居民，其土地開墾或變更使用，經主管機關許可後，不受其限制等；另外，在朝野協商前一天，一位原住民立委又提出15個條文的大修法，主張大幅增加原住民主導決策的權利，賦予原住民狩獵、開發管制的例外許可等。</p>\n<p>總之，這是一連串放寬保育作為的修法，在台灣惡質的地方政治，充斥利益掛帥、開發建設優先的大旗下，如果這三個條文都修正通過，國家公園制度無異於大崩解，保護區之設置意義蕩然無存。</p>\n<p>經本會與蠻野心足協會等環保團體共同發起搶救國家公園運動，已獲得至少109個跨界團體、工商業界，以及766位專家學者、個人的連署，配合這股社會壓力，我們分別拜會遊說民進黨和國民黨，要求撤案，獲致善意回應。6月20日朝野協商時，民進黨提案委員從善如流，同意撤案；內政部廖了以部長則親自向立委遊說，表明先行撤案再向行政院補辦程序，至此，本會期國家公園修法的危機才告解除。但將於9月開議的新會期，立委們勢必再提案，屆時又是一場硬仗！</p>\n<p><strong>國家公園要改革，但不是倉促修法</strong><strong>&nbsp;</strong></p>\n<p>國家公園堪稱國民黨執政期間，絕少數具有遠見的「德政」。至今仍是台灣最為嚴謹的自然保護制度，在伐木、採礦、建壩、狩獵、農墾的各種經濟發展的壓力下，國家公園從1980年代設立以來，儼然是自然野地、動植物、自然景觀的避難所，然而，過去國家公園的設立過程，確實是由上而下的精英決策，其保育觀念與作為至今仍未獲大多數在地居民之認同，在台灣一片經濟掛帥的社會氛圍中，保育似乎是「與民為敵」。因此，不管是已存在的或是籌設中的國家公園，多年來都面臨在地居民的反對，以及民代要求鬆綁各種保育法規的修法壓力。</p>\n<p>另一方面，制度性的缺陷亦讓國家公園的保育功能備受質疑，隸屬於內政部營建署的國家公園體系，歷任署長皆屬工程專業背景，部分處長亦流於政治酬庸，或欠缺堅定保育理念，加以預算法規所設下資本門（建設經費）過多，至今每個國家公園仍處在敲敲打打的硬體建設階段，而最重要的自然保育的規劃執行、研究、教育推廣則日益萎縮、流於形式。</p>\n<p>國家公園為全民乃至後代子孫共同的資產，其設立、廢止、變更，要透過什麼機制決定，才符合公共利益？原住民傳統領域該如何劃設？傳統活動之定義為何？共管權力如何分配？在一片「開放狩獵、開放農墾、鬆綁開發」聲中，可有防杜國家公園保育精神扭曲之機制？面對上述挑戰，國家公園確已到達不得不進行內、外部改造的階段。然而，所有的改造必需有審慎的規劃，更多的社會對話與討論，而非倉促的修法。</p>\n<p><div><img alt height=\"268\" src=\"/sites/cet-taiwan.org/files/u1/1_39.jpg\" width=\"399\" loading=\"lazy\"></div></p>\n<p><div>美好的陽光灑在樹林間&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 柯耀源攝</div></p>\n<p><div><img alt height=\"424\" src=\"/sites/cet-taiwan.org/files/u1/1__1__2.jpg\" width=\"285\" loading=\"lazy\"></div></p>\n<p><div>走在國家公園中&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 柯耀源攝</div></p>\n<p><div>----------------------------------------------------------------------------------------</div></p>\n<p><strong><span>保育才是維護原住民山林智慧的途徑 </span></strong></p>\n<p>☉立法委員田秋堇國會辦公室、台灣動物社會研究會</p>\n<p>原住民一方面要求特殊化，例如要求「自治」、堅持傳統的狩獵；另一方面又要求普遍化，例如就業機會、經濟建設與商業發展。多數原住民早已脫離過去漁獵、採集生活，大多數部落都是現代生活方式；雖是如此，但現行野生動物保育法仍尊重原住民狩獵文化，並未完全抹滅其精神及重要。過往原住民的狩獵傳統，對生態維護的考量確有其規範與智慧，許多禁忌約束也的確具備剎車作用，不致於大規模或毀滅性的破壞大自然綿延永續的機制。但整體環境的變遷，隨著原住民人口的增加、原漢的交流互動、部落開發與開放帶來的商業化等等，都讓原有的狩獵傳統變質。</p>\n<p>許多獵人結合漢人，使用現代化獵槍、獸夾等器具，林道、產業道路越修越寬，車輛進入更便利，加上商業販賣的市場機制，早已造成大自然難以回復的殺傷力。現行野保法開放原住民以「文化、祭儀」為由，得以「獵捕、宰殺、利用」野生動物。但實際上這些所謂文化或祭儀活動，到底有何根據？如何定義？<strong>事實上，無論是將野生動物視為伙伴也好，資源也好，基本上都屬於台灣這塊土地上的所有住民。</strong><strong>&nbsp;</strong></p>\n<p>原住民族基本法的精神在於「保障原住民族基本權利，促進原住民族生存發展，建立共存共榮之族群關係」。基本權利是生命、身體、財產、榮譽，狩獵過去是原住民生存所必需，現在已經不是。如果要談原住民的生存發展，原住民菁英或知識份子，要為祖先的山林智慧盡一份心力，最好的途徑，應該不是「狩獵」，而是自發性的「封溪護漁、休養生息」，或非傷害性的利用，例如<strong>鼓勵原住民發展非傷害性、非侵入性的保育比狩獵（甚至只是『自用』？）來得更有價值。</strong></p>\n<p>（本文節錄自2008年6月12日立法委員田秋堇國會辦公室、台灣動物社會研究會共同發佈之新聞稿〈維護原住民山林智慧的途徑是保育，不是狩獵！〉，全文詳見台灣動物社會研究會網站<a href=\"http://www.east.org.tw/\">http://www.east.org.tw/</a>）</p>"}, {"nid": 288, "title": "重返上帝的殿堂", "original_topic": "協會訊息", "adopted_cats": ["森林守護與林業改革"], "content": "<p>\n<p>&nbsp;</p>\n<p></p></p>\n<p>\n<p>美國詩人布賴恩特（William Cullen Bryant）曾說：「樹林是上帝的第一座殿堂。」2000年，跟隨高雄市教師會生態教育中心的腳步，我首度踏入台灣僅存最完整的檜木林，見證上帝的殿堂。</p>\n<p></p></p>\n<p>\n<p>走過濕滑逼仄的林徑，走過陡峭的懸崖，走過雲繚霧繞的荒山鼻息，走過光裸巨岩的狹斜腰帶，更走過心頭的驚悸與躑躅，終於來到蒼老巨碩的生命跟前，仰望歲月，仰望滄桑，仰望蓊鬱的意志，仰望天地的浩瀚無盡。</p>\n<p></p></p>\n<p>\n<p>2008年，因緣巧合，我又藉由地球公民協會籌辦的鎮西堡檜木林巡禮，再度探訪聳峙於霧林帶的「老」朋友。因我的鄭重邀約，同仁向我要一個參加的理由，思索片刻，我答道：「去親近台灣最古老的靈魂。」其實，它們也是本島最巨大的生命體，一如莽原上的巨象，汪洋中的藍鯨。</p>\n<p></p></p>\n<p>\n<p>走在中海拔闊針葉混合林的林緣底層，像走在流動的曲譜上，充滿細節與要領。昆欄樹、鐵杉、紅檜、扁柏等喬木構成華麗宏偉的主調，蕨、蕈、地衣、松蘿是小巧玲瓏，俯拾皆是的裝飾音，灌木叢與藤本則是隨興寫意的變奏。繁複多變的森林樂章無聲延展，引領登山客以雙腳踏出旋律，以虔敬的目光與心思奏出讚歌。</p>\n<p></p></p>\n<p>\n<p>路上，我瞥見一枚安詳的眼目，在一棵兩人合抱的大樹樹頭，靠近步道的一側，孤獨地凝視。許是前人砍去攔路的側枝，因而形成近似眼眶的刀痕。大自然總會自行療傷，只是過程極其漫長，長於多數物種的一生。正如眼前，樹身傷痕正緩慢癒合，癒合成樹靈之眼，獨照風起雲落人來人往，靜觀山林的變動與恆常。</p>\n<p></p></p>\n<p>\n<p>終於我再度來到紅檜巨木底下。紅檜依舊是印象中的樣子，在我目睹北美紅杉的聳直挺拔與嚴正矜持後，紅檜還是一派灑脫不羈，從主幹低處恣肆地分枝，板根大剌剌，身型諧謔，開闊，張揚，在在流露任真曠達的生命態度。</p>\n<p></p></p>\n<p>\n<p>藏身於霧林帶的紅檜巨靈，從一枚不及花生大的毬果開始它的參天傳奇。歷盡數千年的雲霧灌沃與陽光滋養，數千年的風雨摧殘與雷電侵凌，終於在山林間拔高為一座塔城，蓄涵霜雪雨露，屏障地表脆弱的肌膚，庇護倚之賴之的生靈萬物。</p>\n<p></p></p>\n<p>\n<p>引頸仰望巨木的人，很難不接著低頭沉思。眼前，我們讚嘆的壯麗，歌詠的偉大，其實只是地表可見的風景。如果還能透視土壤中層層疊疊包覆糾纏的根系，我們將目睹另一種比夢深邃，比想像遼闊的盛大與紛繁，存在於超乎筆墨形容的維度。如果地表以上的枝幹花葉是汪洋閎肆的鉅著，地表以下的根節瘤鬚便是博大精深的思想體系，悠遠綿長的情意，充沛的靈感，豐富的歷練與深妙的體悟。</p>\n<p></p></p>\n<p>\n<p>時隔八年，舊地重遊，山徑業已拓寬，鋪築更多木棧，更謹慎避過曾經的峭壁與險坡，探訪檜木林的匍匐路程如今輕易無阻，像一首可以琅琅上口的民歌。所幸雲霧深處，上帝遭世人遺忘的殿堂，巨木仍在，古老的靈魂長青，山林間孳息演替的芸芸生命依舊靜美，茁長，比記憶還堅韌。</p>\n<p></p></p>\n<p>\n<p>&nbsp;</p>\n<p></p></p>\n<p><div></p>\n<p><img src=\"/sites/cet-taiwan.org/files/u1/1_46.jpg\" height=\"306\" width=\"203\" loading=\"lazy\"></p>\n<p></div></p>\n<p><div></p>\n<p>中海拔闊針葉混合林像流動的曲譜，充滿細節與要領。</p>\n<p></div></p>\n<p><div></p>\n<p>&nbsp;</p>\n<p></div></p>\n<p><div></p>\n<p><img src=\"/sites/cet-taiwan.org/files/u1/1__1__3.jpg\" height=\"264\" width=\"396\" loading=\"lazy\"></p>\n<p></div></p>\n<p><div></p>\n<p>樹身傷痕緩慢癒合，彷彿樹靈之眼，靜觀山林的變動與恆常。</p>\n<p></div></p>\n<p>\n<p>&nbsp;</p>\n<p></p></p>"}, {"nid": 290, "title": "我的檜木林之旅", "original_topic": "協會訊息", "adopted_cats": ["森林守護與林業改革"], "content": "<p><div></p>\n<p><img src=\"/sites/cet-taiwan.org/files/u1/1_48.jpg\" width=\"388\" height=\"257\" loading=\"lazy\"></p>\n<p></div></p>\n<p>&nbsp;&nbsp; 蘇振輝攝</p>\n<p>\n<p>文/王敏玲（地球公民協會副執行長）</p>\n<p></p></p>\n<p>\n<p>受限於經驗與體力，這一趟旅程，我內心原本是有一絲排斥的。「事到臨頭」那一天，硬著頭皮去了。出發前，看著此行的許多旅伴流露出歡欣與期待之情，我彷彿感受到自己的不搭嘎，想要消失在人群中的老毛病又犯了。</p>\n<p></p></p>\n<p>\n<p>從遊覽車的玻璃窗看出去，一連數小時盡是紛亂焦躁的車流，與台灣西部徹底水泥化的街景錯落交織著。雙眼一閉，愛智楊總播放的盲人歌手波切利清揚高貴又飄然悠遠的歌聲充盈耳際。那一刻，我突然想起自己曾經照料過的幾個精神分裂症病人--看看現代人的生活，視覺與聽覺、心念與舉措間，日復一日面對著高度的崩離與乖張的衝突，我始終相信，沒走到那一步的人，不過是在心房多披了一層戒備的盔甲。</p>\n<p></p></p>\n<p>\n<p>啟程</p>\n<p></p></p>\n<p>\n<p>出發了！「專注，記得要專注每一個腳步，不要大意就可以平安走完」。好一個平安走完，這是我這種「趴」數的人清早踏出家門時唯一的期待。我謹記協會大家長蘇董的叮嚀，一步一步殷實地踏出去，心緒有點緊繃，話不敢多說，一心一意只留意自己跨出去的每一個步伐，儘管到了人人讚嘆的神木區，還是不敢鬆懈。</p>\n<p></p></p>\n<p>\n<p>裕文看出我肉腳般的實力，從山路旁撿來一根可倚為木杖的粗樹枝，果然惠我良多。在長遠又濕滑的山路上走了兩天，曾有一度體力不支、雙腳痠軟而行如龜速，但在好心的益村與裕峰適時伸出援手協助背負行囊，體貼的淑文與馥慈等旅伴不時鼓勵下，總算咬著牙走完全程，只留下小滑一跤的紀錄。</p>\n<p></p></p>\n<p>\n<p>歸途</p>\n<p></p></p>\n<p>\n<p>從司馬庫斯回高鐵新竹站的路途，蘇董分享了心得：看到這些千年檜木，對照一個人數十年的生命，實在相當渺小，再度造訪鎮西堡和司馬庫斯的檜木群，好像是去看老朋友一般，看到他們安然健在，心就安了；此行中屬武功高強之列的秋娥姐接著說多年前造訪後就一直心心念念地希望有機會再來，這次來到林區還是很感動，許下承諾說只要腳還走得動，一定要再來；益村則提到聽阿道牧師分享時的感動，在鄉下長大的他，瞭解在強勢的外來文化下要抵擋、維護自己原有的文化相當困難，這裡的原住民如此努力令他佩服；裕峰表示這些檜木確實相當雄偉壯觀，但沿路的小花小草也各有千秋，請大家莫忘了在明星物種之外其它生命的重要與美麗；裕文強調在欣賞檜木巍巍樣貌時，別忽略那些在泥土底下伸展、牢牢地抓住土壤的樹根；銘彬老師、雪綿、怡賢、姵晴、淑文、馥慈也都拿著麥克風感性地抒發了心得。</p>\n<p></p></p>\n<p>\n<p>輪到我了，該說什麼呢？拋夫棄女三天兩夜的行程，內心感受何其多，但我最訝異的是，自己近距離看到數十人手牽手才得以環抱的參天巨木，竟完全沒有年少旅遊見到高聳樹林時那份想哭的感動，反而有一種深深然的崇敬與畏懼。旅伴們分享心得時，我忽地想起十四歲離家求學以來起起伏伏的人生際遇，悲傷歡喜、群聚孤寂，居處與工作的屢次遷移、挫折，內心衝突與飄離，加以對污濁世間與美好境地的無奈與失落......，常令我萌生退卻心念。此行見到屹立千年的生靈，彷如親睹老祖宗歷經風吹雨打、艱險困阨，仍舊勇敢堅強、莊嚴挺立、威武嚇人；驀然間，我看見自己的懦弱與不足，竟潸然淚下，於是我......，推開了麥克風。</p>\n<p></p></p>"}, {"nid": 376, "title": "國民黨的國土政策在那裡？", "original_topic": "無", "adopted_cats": ["森林守護與林業改革", "國土計畫"], "content": "<p><span><span><span><strong>國民黨的國土政策在那裡？</strong> </span></span></span></p>\n<p><span><span> </span></span></p>\n<p><span>文☉李根政/地球公民協會執行長 </span></p>\n<p><span>&nbsp;&nbsp;&nbsp; 2008年的颱風來得又多又密集，幾乎是「每週一颱」。7月16日卡玫基、26日鳳凰颱風陸續來襲，造成嚴重水患；9月11日辛樂克颱風重創中部地區，后豐橋斷、蘆山溫泉全數「泡湯」、豐丘明隧道遭土石掩埋，災民面臨天人永隔，這樣的畫面從1990年以後幾乎每年重演。 </span></p>\n<p><span>&nbsp;&nbsp;&nbsp; 過去百年之間，全面皆伐原始森林，開闢中橫、北橫等山區公路，鼓勵農業上山，放任山地濫墾；將農地、低窪地、河川行水區、洪氾區轉為住宅商業區、工業區、道路；沿海則不斷超抽地下水發展養殖業，這種無政府、無規劃的發展模式，是造成今水患、土石流的主因，在九二一地震後，當今全球氣候變遷的情況下，可預見災難不可能減緩。 </span></p>\n<p> <span><span>&nbsp;</span></span>\n<p></p></p>\n<p><span><span>&nbsp;<strong>國民黨的國土政策在那裡？</strong><strong></strong></span></span></p>\n<p>文☉李根政/地球公民協會執行長</p>\n<p>&nbsp;&nbsp;&nbsp; 2008年的颱風來得又多又密集，幾乎是「每週一颱」。7月16日卡玫基、26日鳳凰颱風陸續來襲，造成嚴重水患；9月11日辛樂克颱風重創中部地區，后豐橋斷、蘆山溫泉全數「泡湯」、豐丘明隧道遭土石掩埋，災民面臨天人永隔，這樣的畫面從1990年以後幾乎每年重演。</p>\n<p>&nbsp;&nbsp;&nbsp; 過去百年之間，全面皆伐原始森林，開闢中橫、北橫等山區公路，鼓勵農業上山，放任山地濫墾；將農地、低窪地、河川行水區、洪氾區轉為住宅商業區、工業區、道路；沿海則不斷超抽地下水發展養殖業，這種無政府、無規劃的發展模式，是造成今水患、土石流的主因，在九二一地震後，當今全球氣候變遷的情況下，可預見災難不可能減緩。</p>\n<p>&nbsp;&nbsp;&nbsp; 然而，幾十年來政府不去檢討這種發展模式，只是不斷花大錢在河川上游蓋攔砂壩，在中下游加高堤防、抽水站，或者推出各種專案政策，結果不僅沒有解決問題，反而成為造災運動的一環，例如，1996年賀伯風災後，政府推出全民造林運動，鼓勵人民種樹，結果演變成砍大樹種小樹，耗費上百億去重創山林；2000年，號稱本土政權的民進黨上台了，但該黨完全延續著國民黨的施政，2001年桃芝颱風過後，推出一人一樹，呼籲人民捐100元種一棵樹，結果超過八成的樹種在沒有土石流的大肚山區，簡直是欺騙人民；2005年海棠與馬莎接踵而來，國、民兩黨加碼推出了8年1,410億的水患治理特別預算，但颱風一來，連水利署都承認，就算都完工了，也不能保證沒有水患。較有遠見的國土復育特別條例，則被原住民立委抺黑為「滅族條例」，在朝小野大的情況下，根本排不上議程，民進黨主政8年期間，除了少數個案外（2004年游錫堃院長停止了全民造林運動），整體山林國土政策的興革等於交了白卷。</p>\n<p>&nbsp;&nbsp;&nbsp; 更令人憂心的是，2008年3月馬英九總統勝選之後，原本在民進黨時代暫緩復建的中橫公路，馬英九總統宣示一定要通車；4月時國民黨立委決議要求立即停止執行「國土復育策略暨行動計畫」，等於宣示不反對山區濫墾？9月林務局又重新啟動獎勵造林辦法，極有可能重蹈「砍大樹、種小樹」之覆轍；而草率推出的擴大內需計畫，則勢必將台灣進一步水泥化...。台灣似乎要進入一個全面破壞、全面淘空國土資源的時期。我們不禁要問，國民黨──你的國土政策是什麼？</p>\n<p><strong>&nbsp;&nbsp;&nbsp; 全球氣候變遷已經發生了，如果不以國土復育、減量開發的原則，加速在國土規劃、都市、產業發展上研擬氣候變遷的調適策略，勢必得承受一次比一次更加嚴重的災難損失。</strong>真正的愛台灣，終極的人道，是斧底抽薪的解決問題，這是國民黨彌補五十年來對台灣土地傷害的良機，籲請馬政府圖謀百年國土大計。</p>\n<p><div><img src=\"/sites/cet-taiwan.org/files/u1/1_74.jpg\" alt width=\"500\" height=\"333\" loading=\"lazy\"></div></p>\n<p><div></div></p>\n<p><div>一定要看到橋斷了，才願意面對問題嗎？　　（于立平攝）</div></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>"}, {"nid": 464, "title": "台灣伐木養菇議題之調查研究", "original_topic": "伐木養菇", "adopted_cats": ["森林守護與林業改革"], "content": "<p><a href=\"http://www.scribd.com/doc/13157431/\">台灣伐木養菇議題之調查研究</a></p>\n<p><span> <span>台灣伐木養菇議題之調查研究</span><span>met2008</span> <span> </span></span></p>\n<p>&nbsp;</p>\n<p><div><a href=\"http://www.scribd.com/upload\">Publish at Scribd</a> or <a href=\"http://www.scribd.com/browse\">explore</a> others: <a href=\"http://www.scribd.com/browse/eBooks/Fiction-Literature\">Fiction &amp; Literature</a> <a href=\"http://www.scribd.com/browse/eBooks/\">eBooks</a> <a href=\"http://www.scribd.com/tag/sport\">sport</a> <a href=\"http://www.scribd.com/tag/common\">common</a></div></p>\n<p>&nbsp;</p>"}, {"nid": 465, "title": "揭開台灣伐木養菇的真相-媒體報導", "original_topic": "伐木養菇", "adopted_cats": ["森林守護與林業改革", "國土計畫"], "content": "<p><strong><span><span>&nbsp;</span></span></strong><strong><span><span><strong>養菇</strong><strong>1</strong><strong>年伐木</strong><strong>2300</strong><strong>公頃</strong></span></span><strong>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </strong></strong></p>\n<p>【聯合晚報╱記者劉開元/台北報導】2009.03.11 03:02 pm</p>\n<p><div><img alt height=\"234\" src=\"/sites/cet-taiwan.org/files/u1/1_84.jpg\" width=\"330\" loading=\"lazy\"></div></p>\n<p><div><span><span><span>立委田秋堇（左二）上午與地球公民協會、主婦聯盟共同舉行「揭開台灣伐木養菇的真相」，對養菇大量砍伐樹木造成環境生態衝擊要求改善。記者邱勝旺／攝影</span> </span></span></div></p>\n<p>&nbsp;&nbsp;&nbsp; 菇蕈類農產品儼然成了健康食物。不過地球公民協會發表一項半年調查發現，台灣每年為供應養菇業所需的木屑量超過35萬公噸；為了養菇，一年伐木面積約高達2300公頃，相當於兩座的高雄柴山或88個台北市大安森林公園。</p>\n<p>&nbsp;&nbsp;&nbsp; 地球公民協會執行長李根政呼籲中央政府應儘速推動「限制伐木補償」; 加強「原住民保留地的農牧用地」管理; 儘速推動認證合法伐木、杜絕盜伐; 研發木屑替代品、減少砍樹。也呼籲民眾應適量食用菇蕈類食品。李根政強調，環保團體無意打擊養菇產業，而是為了提醒各界重視此嚴重問題。</p>\n<p>&nbsp;&nbsp;&nbsp; 蠻野心足協會秘書長林子凌、主婦聯盟陳曼麗、荒野保護協會書長施純榮及立委田秋堇，都呼應地球公民協會訴求。李根政說，從去年8年到今年2月，共訪查台灣主要伐木、碎木和養菇的主要區域。發現台灣一年有約2367公頃的森林地因養菇需要而被砍伐，其中只有不到300公頃面積是政府核准的，九成以上都是未經申請評估就進行伐木，幾乎處於無政府狀態。而伐木量最多的是苗栗、台東、新竹等地。</p>\n<p>&nbsp;&nbsp;&nbsp; 由於伐木商的遊說鼓吹，許多地主以平均每公頃2至4萬元的低廉價格，將林木賣給伐木商，以此金額推估，不用花100 萬元，就可以砍掉一座面積27公頃的大安森林公園。砍伐的林地大多是復育數十年的次生林，其中也有部分是原始林，伐木過程開路整地、清除地表植被，導致地表嚴重裸露、土石鬆動，嚴重影響國土安全。</p>\n<p><div>&nbsp;&nbsp;&nbsp; 李根政表示，把養菇一年砍伐2367公頃林地換算，將導致每年減少吸8.8公噸的二氧化碳、減少釋出6.6萬公噸的氧氣、減少涵養473萬立方公尺的水資源，換算為經濟損失至少8.8億元。</div></p>\n<p><a href=\"http://www.udn.com/2009/3/11/NEWS/NATIONAL/NAT5/4782759.shtml\">http://www.udn.com/2009/3/11/NEWS/NATIONAL/NAT5/4782759.shtml</a></p>\n<p><strong>‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧</strong></p>\n<p><strong><span>伐木養菇</span></strong><br>\n<p>【台北捷運報記者朱淑娟／台北報導】</p></p>\n<p>&nbsp;台灣人年吃88座大安森林公園</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;台灣人愛吃菇，卻不知道每年吃掉兩千三百公頃的森林，相當於八十八個大安森林公園。其中九成養菇的樹木未經政府許可，伐木養菇處於無政府狀態。地球公民協會昨天呼籲政府，與其花錢植樹，不如好好保護山林。</p>\n<p>&nbsp; &nbsp;紀錄片導演柯金源舉發，屏東獅子山有一片已復育廿六年的次生林，地主以一公頃兩萬元的賤價賣給伐木商，整座森林的樹被砍走後，留下光禿的山野。地球公民協會於是展開調查，並在植樹節前公布。</p>\n<p>&nbsp;&nbsp;&nbsp;地球公民協會執行長李根政表示，走一趟傳統市場，香菇、金針菇、杏鮑菇、秀珍菇，各種不同菇類各有風味。台灣目前養菇所用的太空包，多半以木屑做主材料，因此必須大量砍伐木材，主要的樹種包括相思樹，以及油桐、山麻黃等原生闊葉樹。</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;調查指出，伐木養菇主要地區是苗栗縣、新竹縣、台東縣。只有一成經過政府許可，其他九成多數是原住民所有的林牧用地，不受森林法規範，另外也有部分來自配合開發案砍下的樹木、或是盜伐。</p>\n<p>&nbsp;&nbsp;&nbsp;為養菇所砍的森林，多半是新復育的次生林，有些甚至是原生林，為了運送木材，開路造成地表裸露，土石鬆動，影響國土安全。每年因土石流造成的人命與經濟損失非常驚人，生物多樣性也遭受衝擊。</p>\n<p>&nbsp;&nbsp;&nbsp;多數地主用極低價出賣珍貴的林地，每公頃只賣二到四萬元，不要一百萬就可以砍光大安森林公園所有的樹木。立委田秋堇反問，如果原住民都這麼輕忽自己的土地，要如何說服各界推動原住民保留區？</p>\n<p>&nbsp;&nbsp;&nbsp;包括主婦聯盟、荒野保護協會、蠻野心足生態協會也呼籲政府正視伐木養菇問題。林務局以每公頃六十萬元獎勵造林，卻忽視砍樹的危害，伐木養菇的外部成本每年高達八億八千萬元。</p>\n<p>&nbsp;&nbsp;&nbsp;李根政呼籲，政府應比照屏東縣推動「限制伐木補償辦法」，同時修改法令加強管理原住民保留地的農牧用地。推動合法伐木，研發木屑替代品。如果政府無動於衷，民間不排除發起森林認養運動。</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;農委會農業試驗所副研究員吳寬澤表示，農委會很重視養菇伐木的問題，目前國內已有業者從大陸進口棉子殼，多數菇類都有用到。或是用玉米心取代太空包部分的木屑添加物，用於金針菇養殖。</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;吳寬澤表示，農試所則從兩年多前試用蔗渣取代二分之一或三分之一木屑，裁培秀珍菇、杏鮑菇、木耳、珊瑚菇，產量甚至比都用木屑還高。等到技術再成熟一點，將推廣到全國，就能逐漸減少伐木。</p>\n<p><strong>‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧</strong></p>\n<p><strong><span><span>養菇伐木 年砍88個大安森林公園</span></span></strong>&nbsp;</p>\n<p><div>&nbsp; 自由時報〔記者劉力仁、鍾麗華、張軒哲／綜合報導〕</div></p>\n<p>&nbsp;&nbsp;&nbsp; 植樹節前夕，地球公民協會呼籲農委會要加強農牧用地的伐木管制，以免造成森林浩劫及國土保安漏洞。&nbsp;</p>\n<p><strong>環團呼籲加強伐木管制</strong></p>\n<p>&nbsp;&nbsp;&nbsp; 地球公民協會昨天公布國內伐木養菇調查結果，指出養菇業每年需要木屑量高達三十五萬五千公噸，導致二千三百公頃面積樹林遭砍伐，相當於八十八座大安森林公園或兩座柴山，其中九成以上面積未經申請及評估，即大肆砍伐。</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;養菇業目前採取「太空包」栽培法，地球公民協會研究員楊俊朗解釋流程說，相思林或雜木切成碎木屑，混合米糠及碳酸鈣，再植入菇蕈類菌種的塑膠袋中養菌。一段時間後，香菇便從太空包生長出來。</p>\n<p><div><img alt height=\"333\" src=\"/sites/cet-taiwan.org/files/u1/a_9.jpg\" width=\"500\" loading=\"lazy\"></div></p>\n<p>&nbsp;&nbsp;&nbsp;<span><span>香菇業者以太空包木屑養菌，栽植香菇。（記者張軒哲攝）</span></span></p>\n<p><div><img alt height=\"333\" src=\"/sites/cet-taiwan.org/files/u1/b_7.jpg\" width=\"500\" loading=\"lazy\"></div></p>\n<p><span><span>台中縣新社鄉有多家製作太空包的農園，以木屑作為太空包主要材料。（記者張軒哲攝）</span></span></p>\n<p><img alt height=\"500\" src=\"/sites/cet-taiwan.org/files/u1/c_6.jpg\" width=\"334\" loading=\"lazy\"></p>\n<p><span><span>伐木工人砍林木，代價每公頃二至四萬元。（地球公民協會提供）</span></span></p>\n<p><span><img alt height=\"500\" src=\"/sites/cet-taiwan.org/files/u1/d_1.jpg\" width=\"334\" loading=\"lazy\">&nbsp;</span></p>\n<p><span>&nbsp; <span>香菇從太空包中生長出來，廢棄的太空包拿來堆肥。（地球公民協會提供）</span> </span></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 地球公民協會執行長李根政表示，國人喜歡吃香菇，養菇業需求大，每年使用太空包達四億七千三百萬包，一年砍伐量估計減少吸收八點八萬公噸二氧化碳，減少釋出六點六萬公噸氧氣，減少水資源涵養四百七十三點四萬立方公尺，經濟損失約八點八億元，再加上水土流失，生物多樣性也受到衝擊。</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 李根政表示，未經申請伐木主要來自於原住民保留地的「農牧用地」。由於農委會只管制林地，不管制農牧用地，造成國土保安漏洞。楊俊朗表示，伐木商以每公頃花費二至四萬元，慫恿原住民提供農牧用地砍伐樹木，一棵樹約十年樹齡，被砍伐的農牧用地則要十年之後，才有可能恢復原貌。</p>\n<p><strong>業者要求政府積極造林</strong></p>\n<p>&nbsp;&nbsp;&nbsp; 環保團體強調，無意打擊養菇產業，但建議政府比照屏東縣實施「限制伐木補償辦法」，以十年每公頃三至六萬元補償費，要求地主十年內不砍樹，另修法加強農牧用地管理、研發木屑替代品。</p>\n<p>&nbsp;&nbsp;&nbsp; 國內香菇大宗產地的台中新社鄉太空包業者廖宗明說，太空包業者只管進木屑，沒聽說木材來源有問題。但他也呼應環團說法，認為應加強管理農牧用地，更要求政府積極造林，讓香菇產業永續經營。</p>\n<p>&nbsp;&nbsp;&nbsp; 農委會林務局副局長李桃生表示，私有林採伐須向地方林業主管機關申請許可，已請地方政府彙整資料。農牧用地如果種樹，本來就可以利用，不受森林法管制，林地開發超過四公頃以上則要經過環評。</p>\n<p>&nbsp;&nbsp;&nbsp; 至於木屑替代品，農委會說已委託研發。菇農研究發展協會理事長陳宗明說，少數菇農使用玉米桿、玉米芯、青割玉米等取代部分的木屑，但只有雜菇類長得比較好。</p>\n<p><a href=\"http://www.libertytimes.com.tw/2009/new/mar/12/today-life8.htm\">http://www.libertytimes.com.tw/2009/new/mar/12/today-life8.htm</a></p>\n<p><strong>‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧</strong></p>\n<p><strong>&nbsp;</strong></p>\n<p><span><strong>&nbsp;</strong></span></p>\n<p><span><strong>&nbsp;</strong></span></p>\n<p><span><span><span><strong>環團：每年為養菇</strong><strong> </strong><strong>砍伐</strong><strong>88</strong><strong>座大安森林公園</strong></span></span></span></p>\n<p>中央通訊社（中央社記者林思宇台北11日電）</p>\n<p>&nbsp;&nbsp;&nbsp; 地球公民協會調查指出，台灣每年供應養菇業所需木屑量35萬4740公噸，1 年伐木面積達2300公頃，相當於88座台北大安森林公園，或兩座高雄柴山的面積。</p>\n<p>\t&nbsp;&nbsp;&nbsp; 地球公民協會從2008年8月起，在全台主要伐木、養菇區調查，今天公布調查結果指出，養菇業每年所需木屑量高達35萬4740公噸，估計1年伐木面積達2300公頃，相當於2座高雄的柴山或88座台北市大安森林公園，伐木量最多的地區是苗栗、台東、新竹等。</p>\n<p>\t&nbsp;&nbsp;&nbsp; 地球公民協會指出，令人憂心的是在，在2300公頃面積中，有9成以上是未經申請評估就進行伐木行動，只有不到300公頃的面積是經過政府許可，這意味著全台灣為了養菇而進行的大規模伐木行為，幾乎處於無政府狀態。</p>\n<p>\t&nbsp;&nbsp;&nbsp; 地球公民協會進一步表示，這些未經申請的伐木，大多發生在山坡地原住民保留地「農牧用地」，這些山地坡度陡峭，大部分土地廢耕，原應發展成良好的森林作為生物棲息地，卻被地主卻以低價出售。平均每公頃新台幣2至4萬元；不用花100萬，就可以砍掉一座27公頃大安森林公園的樹木。</p>\n<p>\t&nbsp;&nbsp;&nbsp; 地球公民協會主張，中央政府應儘速、全面推動限制伐木補償政策，並修改法令，加強原住民保留地的農牧用地管理；儘速推動合法伐木認證、杜絕盜伐；研發木屑替代品；同時提醒民眾，食用菇蕈類應適量。 980311</p>\n<p><a href=\"http://www.cna.com.tw/SearchNews/KWSearch.aspx\">http://www.cna.com.tw/SearchNews/KWSearch.aspx</a></p>\n<p><strong>‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧</strong></p>\n<p><span><strong><span><span>養菇一年伐木２３００公頃　相當２座柴山</span></span></strong><strong>&nbsp;</strong></span></p>\n<p>2009.3.12台灣時報〔台北訊〕</p>\n<p>&nbsp;&nbsp;&nbsp; 地球公民協會調查指出，台灣每年供應養菇業所需木屑量三十五萬四七四○公噸，一年伐木面積達二三○○公頃，相當於八十八座台北大安森林公園，或兩座高雄柴山的面積。</p>\n<p>\t地球公民協會從二○○八年八月起，在全台主要伐木、養菇區調查，昨天公布調查結果指出，養菇業每年所需木屑量高達三十五萬四七四○公噸，估計一年伐木面積達二三○○公頃，相當於二座高雄的柴山或八十八座台北市大安森林公園，伐木量最多的地區是苗栗、台東、新竹等。</p>\n<p>\t地球公民協會指出，令人憂心的是在，在二三○○公頃面積中，有九成以上是未經申請評估就進行伐木行動，只有不到三百公頃的面積是經過政府許可，這意味著全台灣為了養菇而進行的大規模伐木行為，幾乎處於無政府狀態。</p>\n<p>\t地球公民協會進一步表示，這些未經申請的伐木，大多發生在山坡地原住民保留地「農牧用地」，這些山地坡度陡峭，大部分土地廢耕，原應發展成良好的森林作為生物棲息地，卻被地主卻以低價出售。平均每公頃新台幣二至四萬元；不用花一百萬，就可以砍掉一座廿七公頃大安森林公園的樹木。</p>\n<p>\t地球公民協會主張，中央政府應儘速、全面推動限制伐木補償政策，並修改法令，加強原住民保留地的農牧用地管理；儘速推動合法伐木認證、杜絕盜伐；研發木屑替代品；同時提醒民眾，食用菇蕈類應適量。</p>\n<p><strong><a href=\"http://www.twtimes.com.tw/html/modules/news/article.php?storyid=32595\">http://www.twtimes.com.tw/html/modules/news/article.php?storyid=32595</a></strong></p>\n<p><strong>‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧‧</strong></p>\n<p><strong>揭開台灣伐木養菇的真相&nbsp;</strong></p>\n<p><strong>&nbsp;</strong>中興日報全球新聞網&nbsp; 資料來源：地球公民協會提供</p>\n<p><strong>每年為養菇砍伐88座大安森林公園</strong></p>\n<p><strong>&nbsp;&nbsp; </strong>您知道我們吃的各種菇類從那裡來？答案是森林。因為養菇前必須先伐木！地球公民協會從2008年8月起，在全台灣主要伐木、養菇區半年多來的調查結果顯示，台灣每年為供應養菇業所需的木屑量高達35萬4,740公噸，估計台灣為了養菇，一年伐木面積約高達2,300公頃，相當於兩座高雄的柴山，或88個台北市的大安森林公園，而伐木量最多的是苗栗、台東、新竹等地區。令人憂心的是，2,300公頃當中，有九成以上是未經申請評估就進行的伐木（只有不到300公頃的面積是經過政府許可的），這意味著全台灣為了養菇而進行的大規模伐木行為，幾乎處於無政府狀態！</p>\n<p>\n<p>&nbsp;&nbsp;&nbsp; 這些未經申請的伐木主要來自山坡地原住民保留地的「農牧用地」，由於主管機關農委會認定「農牧用地」不受「林地」相關法規管制，所以未要求各縣市政府進行伐木管制與統計，如此一來，形成極大的國土保安漏洞。這些在山坡地上的農牧用地坡度陡峭，大部分土地因而廢耕，發展成覆被良好的森林，是很重要的維生系統與生物棲息地，對於水土保持、水源涵養，更是效益卓著，然而，在伐木商的遊說鼓吹下，許多地主以非常低廉的價格（平均每公頃2～4萬元）將林木賣給伐木商。以此金額推估，不用花100萬，就可以砍掉一座大安森林公園（面積27公頃）的樹木！</p></p>\n<p>\n<strong>伐木養菇的代價全民買單</strong><br>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;台灣栽培的食用菇蕈類，主要為香菇、金針菇、杏鮑菇、秀珍菇、木耳、蠔菇、洋菇、草菇等，其中洋菇與草菇是以稻草為栽培基質，其他菇類則需以木屑當做主要營養來源。木屑需經過伐木、粉碎再製成太空包，在3個月的栽培管理後，長成各種菇類，送到市場販售。</p></p>\n<p>\n<p>&nbsp;&nbsp;&nbsp; 這些為了養菇而砍伐的森林，大多是重新復育數十年的次生林，伐木商甚至表示其中有少部分是原始林。伐木過程中，開路整地、清除地表植被，導致地表嚴重裸露、土石鬆動，嚴重影響國土安全。若根據林務局的資料來換算，養菇一年砍伐2,367公頃林木，將導致每年減少吸收8.8萬公噸的二氧化碳，減少釋出6.6萬公噸的氧氣，減少涵養473.4萬立方公尺的水資源，換算為經濟損失至少8.8億元。然而，台灣每年因為土石流失所造成的人命和經濟損失非常驚人，加上低海拔次生林生物多樣性受衝擊，每片砍伐林地至少需花費十年以上才能恢復部分生態，這些未計算進來的環境成本遠遠超過8.8億元，且全部由台灣人民共同買單。</p></p>\n<p>\n<strong>與其「造林」不如「限制伐木」</strong><br>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;中央政府為兌現馬英九總統競選政見「愛台12建設」的第八項建設，2009年先投注28億元實施造林補貼，其中規畫山坡地造林500公頃，預計以每公頃60萬元獎勵林農造林，然而，在山坡地造林過去曾衍生「砍大樹、種小樹」之弊端，目前林務單位尚未制定相關辦法防範。反觀屏東縣政府為了保護山坡地、兼顧地主的權益，實施「限制伐木補償辦法」，以十年每公頃3~6萬元之補償，形成有效誘因，總共只花費396萬，就保護了73公頃已存在數十年的森林。這項政策所需經費僅造林獎勵金的1/5至1/10，而且效益更高，也更能照顧到原住民或林農的經濟。</p></p>\n<p>\n<p>&nbsp;&nbsp;&nbsp; 然而，單一縣市的管理將導致伐商轉移陣地，到其他縣市尋找林地繼續伐木，對台灣整體山林的衝擊並沒有降低，如果由中央政府全面推動，將可避免這種挖東牆補西牆的現象。地球公民協會估計，以2,300公頃、每公頃每十年3~6萬元計，一年只要7,000萬至1億4千萬台幣就可以保護88個大安森林公園，相信這是中央政府能夠負擔的。如果政府反應仍如牛步，民間不排除發起森林認養運動，每年只要花3,000~6,000元，即可保護一公頃的森林。綜上所述，地球公民協會主張如下：</p></p>\n<p>\n<p>1. 中央政府應儘速、全面推動「限制伐木補償」政策。<br></p>\n<p>2. 應修改法令，加強「原住民保留地的農牧用地」之管理<br></p>\n<p>3. 儘速推動認證合法伐木、杜絕盜伐。<br></p>\n<p>4. 研發木屑替代品，減少砍樹。<br></p>\n<p>5. 民眾食用菇蕈類應適量。</p></p>\n<p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;地球公民協會強調，民間團體無意於打擊台灣養菇產業，此一報告的揭露，是為了呼籲政府和社會共同面對此一問題的嚴重性，從政策面、生產面、消費面的改變，創造出台灣山林水土、養菇業者與消費者三贏的可能！</p></p>\n<p><strong><a href=\"http://www.s7825730.url.tw/new_page_1.htm\">http://www.s7825730.url.tw/new_page_1.htm</a></strong></p>\n<p><strong>&nbsp;</strong></p>\n<p><strong>&nbsp;</strong></p>\n<p><strong>&nbsp;</strong></p>\n<p>&nbsp;</p>"}, {"nid": 468, "title": "【行動】《減少伐木養菇》一人一信，保護森林！", "original_topic": "無", "adopted_cats": ["森林守護與林業改革"], "content": "<p>&nbsp;</p>\n<p>《減少伐木養菇》</p>\n<p><strong>一人一信，保護森林！&nbsp;</strong></p>\n<p>2009.3.20</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;你知道餐桌上各式各樣的菇類是從哪裡來的嗎？</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;台灣早期養菇以段木法來栽培，但近二十年來已改為太空包或瓶裝栽培，因此在菇類到達我們的餐桌前，必須先經過伐木、絞成木屑、製作成太空包、再用太空包來養菇等過程。我們吃的菇類雖不再是長在樹上，但卻必須砍伐大片森林來支應菇類生長所需的營養。（『<a href=\"/node/466\">台灣伐木養菇議題之調查研究』影片</a>）</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 那麼台灣每年為了養菇必須砍掉多少森林呢？</p>\n<p>&nbsp;&nbsp;&nbsp; 根據地球公民協會的調查，至少要砍掉2300公頃的森林才夠，這相當於88座大安森林公園！然而其中經合法申請的竟不到300公頃，其餘最大來源極可能是砍伐山區農牧用地上的森林（目前中央政府只管制林地上的伐木行為，但在山區農牧用地上的森林卻沒有任何管制），以及盜伐。伐木商只需以每公頃不到2～4萬元的賤價，就可以收購大片森林，換句話說，你只要有100萬，就可以把一整座台北大安森林公園或高雄美術館公園的樹木都砍光！取得木材是這麼的方便又便宜，難怪每年台灣山林裡依然上演著無政府狀態的大規模砍樹戲碼。</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 砍掉的只是一時一地的樹木嗎？看看隱藏在台灣山林裡的伐木現場吧！</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; <img height=\"212\" src=\"/sites/cet-taiwan.org/files/u1/a_10.jpg\" width=\"317\" loading=\"lazy\">&nbsp;&nbsp;&nbsp; &nbsp;<img height=\"211\" src=\"/sites/cet-taiwan.org/files/u1/b_8.jpg\" width=\"314\" loading=\"lazy\">&nbsp;</p>\n<p>&nbsp;<span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span><span>砍樹前要先開路，「之」字形林道上的原有森林首當其衝！</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span>翠綠的山被挖了一個洞，有如鬼剃頭。</span></span></span></p>\n<p><span>&nbsp;&nbsp;&nbsp; &nbsp;<img height=\"209\" src=\"/sites/cet-taiwan.org/files/u1/c_7.jpg\" width=\"314\" loading=\"lazy\">&nbsp;&nbsp; &nbsp; <img height=\"210\" src=\"/sites/cet-taiwan.org/files/u1/d_2.jpg\" width=\"314\" loading=\"lazy\"></span></p>\n<p><span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span>&nbsp;</span><span><span><span><span><span>沒了森林，地表嚴重裸露鬆動，誰還敢住在這裡？</span></span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; </span></span></span></span><span><span>百年斧鋸向山林，已讓我們付出慘痛代價!何時可讓山林休養生息?</span></span></p>\n<p><span></span></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;根據林務局的資料來換算，養菇一年砍伐2,367公頃林木，將導致每年減少吸收8.8萬公噸的二氧化碳，減少釋出6.6萬公噸的氧氣，減少涵養473.4萬立方公尺的水資源，換算為經濟損失至少8.8億元。若再加上山水流失、生物多樣性受衝擊...等附加成本，伐木養菇的代價豈止8.8億！請注意，這些全都得由台灣人民買單！</p>\n<p>&nbsp;</p>\n<p><span><span><strong>因此，我們主張：</strong></span></span><span> </span></p>\n<p>1.&nbsp;中央政府應儘速、全面推動「限制伐木補償」政策。</p>\n<p><span><span>「限制伐木補償辦法」是屏東縣政府在2007年時推行的政策，以每公頃3~6萬元之補償，和地主約定十年內不砍樹。結果總共只花費396萬，就保護了73公頃已存在數十年之久的森林，所需經費僅造林獎勵金的1/5至1/10，不僅替納稅人節省荷包、保護既有的生態環境，也更能照顧到地主的經濟。如果能由中央政府全面推動此一政策，相信更能保護全台灣的森林！</span> </span></p>\n<p>2.&nbsp;修改法令，加強「農牧用地」的管理</p>\n<p>3.儘速推動認證合法伐木、杜絕盜伐。</p>\n<p>4.研發木屑替代品，提升菇蕈類生物效率。</p>\n<p><span>農委會農業試驗所研究發現，確實可以用蔗渣等其他原料來取代養菇木屑，且產量更高！如果政府能投入更多的經費與人力來研發，不僅可有效減少木屑需求量，同時或可降低養菇產業的成本。 </span></p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 地球公民協會於3月11日舉辦「揭開台灣伐木養菇的真相」記者會，迄今未獲政府相關單位的回應，遂發起一人一信給行政院長的活動。我們希望，同樣關心台灣山林水土安全的你，用實際的行動來保護這塊我們賴以維生的土地！你可以：</p>\n<p><ul></p>\n<p><li><a href=\"http://www.ey.gov.tw/sp.asp?xdURL=mail/mail.asp&amp;ctNode=1171&amp;mp=1\">寫信給行政院長</a>，表達你對台灣低海拔森林的關切！我們提供了關於此議題的<a href=\"/node/469\">陳情信範本</a>給您參考或複製。</li></p>\n<p><li>到我們的<a href=\"http://campaign.tw-npo.org/sign.php?id=2009031902222700\">連署平台</a>參與連署，讓政府感受到來自民間的壓力。</li></p>\n<p><li><a href=\"/node/36\">捐款</a>支持地球公民協會，我們將持續追蹤此議題、保護台灣的山林水土。</li></p>\n<p><li>不過量食用菇蕈類。</li></p>\n<p></ul></p>\n<p>延伸閱讀：</p>\n<p><ul></p>\n<p><li>完整的調查研究報告：<a href=\"/node/464\">『我們吃掉多少森林？台灣伐木養菇議題之調查研究』</a></li></p>\n<p><li><a href=\"/node/463\">「揭開台灣伐木養菇的真相」新聞稿</a></li></p>\n<p><li><a href=\"/node/465\">伐木養菇相關新聞報導</a></li></p>\n<p></ul></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>"}, {"nid": 469, "title": "減少伐木養菇，一人一信，保護森林 !", "original_topic": "伐木養菇", "adopted_cats": ["森林守護與林業改革"], "content": "<p><a href=\"http://www.ey.gov.tw/sp.asp?xdURL=mail/mail.asp&amp;ctNode=1171&amp;mp=1\"><strong>寫信給行政院長</strong></a><strong>，表達你對台灣低海拔森林的關切！</strong></p>\n<p><strong>我們提供了關於此議題的</strong><a href=\"/node/469\"><strong>陳情信範本</strong></a><strong>給您參考或複製。</strong></p>\n<p>&nbsp;</p>\n<p>親愛的劉院長：</p>\n<p>&nbsp;&nbsp;&nbsp; 香菇、金針菇...這些菇蕈類是我家餐桌上經常出現的食材，因為菇蕈類有很好的營養也能養生保健。但是沒想到為了養菇，<strong>台灣每年必須砍掉</strong><strong>2,300公頃</strong><strong>的森林，相當於88</strong><strong>座大安森林公園！</strong>況且，其中<strong>九成以上的森林，政府都未加以管制，在在暴露出伐木養菇的無政府狀態！</strong></p>\n<p>&nbsp;&nbsp;&nbsp; 根據林務局的資料來換算，台灣為了養菇伐木，將導致每年減少吸收8.8萬公噸的二氧化碳、減少釋出6.6萬公噸的氧氣、減少涵養473.4萬立方公尺的水資源，換算為經濟損失至少8.8億元！更讓我擔心的是，部分位於陡峭山坡上「農牧用地」裡的森林若在商業利益下被犧牲了，將會帶來台灣環境生態的浩劫，也會釀成山區土石流橫行的災難，若將這些外部成本加進來，養菇伐木的代價絕對不只8.8億元！這一切都讓我在食用菇蕈類時深感不安。</p>\n<p>&nbsp;&nbsp;&nbsp; 農委會雖推出「獎勵造林」政策，以每公頃60萬元、總共28億元，預計造林4,750公頃，但依舊難以防範「砍大樹、種小樹」的弊端，令人懷疑灑大錢獎勵造林的成效。反之，如果像屏東縣政府一樣推動「限制伐木補償」政策，每公頃只需3～6萬元，一年總共7,000萬至1億4,000萬元，就可以保護2,300公頃已存在數十年的既有森林，不僅成效更高，也更能看緊我們納稅人的荷包！</p>\n<p><a href=\"http://www.ey.gov.tw/sp.asp?xdURL=mail/mail.asp&amp;ctNode=1171&amp;mp=1\"><strong>寫信給行政院長</strong></a><strong>，表達你對台灣低海拔森林的關切！</strong></p>\n<p><strong>我們提供了關於此議題的</strong><a href=\"/node/469\"><strong>陳情信範本</strong></a><strong>給您參考或複製。</strong></p>\n<p>&nbsp;</p>\n<p>親愛的劉院長：</p>\n<p>&nbsp;&nbsp;&nbsp; 香菇、金針菇...這些菇蕈類是我家餐桌上經常出現的食材，因為菇蕈類有很好的營養也能養生保健。但是沒想到為了養菇，<strong>台灣每年必須砍掉</strong><strong>2,300公頃</strong><strong>的森林，相當於88</strong><strong>座大安森林公園！</strong>況且，其中<strong>九成以上的森林，政府都未加以管制，在在暴露出伐木養菇的無政府狀態！</strong></p>\n<p>&nbsp;&nbsp;&nbsp; 根據林務局的資料來換算，台灣為了養菇伐木，將導致每年減少吸收8.8萬公噸的二氧化碳、減少釋出6.6萬公噸的氧氣、減少涵養473.4萬立方公尺的水資源，換算為經濟損失至少8.8億元！更讓我擔心的是，部分位於陡峭山坡上「農牧用地」裡的森林若在商業利益下被犧牲了，將會帶來台灣環境生態的浩劫，也會釀成山區土石流橫行的災難，若將這些外部成本加進來，養菇伐木的代價絕對不只8.8億元！這一切都讓我在食用菇蕈類時深感不安。</p>\n<p>&nbsp;&nbsp;&nbsp; 農委會雖推出「獎勵造林」政策，以每公頃60萬元、總共28億元，預計造林4,750公頃，但依舊難以防範「砍大樹、種小樹」的弊端，令人懷疑灑大錢獎勵造林的成效。反之，如果像屏東縣政府一樣推動「限制伐木補償」政策，每公頃只需3～6萬元，一年總共7,000萬至1億4,000萬元，就可以保護2,300公頃已存在數十年的既有森林，不僅成效更高，也更能看緊我們納稅人的荷包！</p>\n<p><span>因此，我希望&nbsp; 劉院長正視伐木養菇問題的嚴重性，慎重考慮以下請求：</span></p>\n<p>1. <strong>由中央政府編列預算，全面推動「限制伐木補償」政策</strong>。</p>\n<p>2. <strong>檢討山坡地農牧用地的管理</strong>。</p>\n<p>3. <strong>儘速推動認證合法伐木，杜絕盜伐</strong>。</p>\n<p>4. 鼓勵研究單位<strong>研發木屑替代品</strong>，減少為養菇而砍樹。</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 這是一個創造台灣山林水土、養菇產業與消費者三贏的機會，希望&nbsp; 劉院長率領執政團隊拿出魄力，從政策面整合相關部會共同來面對這個問題，以切實的作為讓民眾感受到政府的遠見與決心。</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; O O O 敬上</p>"}, {"nid": 470, "title": "伐木養菇議題讀者留言回應", "original_topic": "伐木養菇", "adopted_cats": ["森林守護與林業改革", "國土計畫"], "content": "<p>環境資訊中心讀者留言：「這裡明指原住民保留地農牧用地，據我的經驗反駁，農牧用地不受森林法限制，地上物一般為果樹或桂竹林，用來種養香菇的段木，如楓香、相思及杜英，一般原住民不會將其種在農牧用地上，因為十年多才能伐採一次，根本沒辦法等這麼久，農牧用地作為經濟作物較多，以桂竹來說，約三～四年可伐採乙次，過程又可摘取桂竹筍，才符合農民的現實所需，我在五峰、尖石及關西的原住民保留地工作多時，僅見一～兩次固定老闆種楓香砍為自己經營香菇園，其餘農牧用地均為竹林或果樹少為杉木，這一份報告指出原住民保留地農牧用地就是段木香菇的主要來源，實在太沈重！！籲請立委諸公別用政策來殺人，應正視造林的績效及獎勵辦法，而非抹殺原住民族的經濟來源！這是漢人的觀點看天下！話說～可以請愛食用菇類的漢人採買大陸貨，或許可以減少上游的伐木。」</p>\n<p>&nbsp;</p>\n<p><span><strong>地球公民協會的回應</strong></span></p>\n<p>&nbsp;&nbsp;&nbsp; 協會調查伐木養菇的尺度是全台灣，每年因為養菇而伐木面積約2,300公頃，但是2007年林務局公佈實際砍伐的「林地」面積只有325.57公頃。2007年屏東縣實際伐木面積55.27公頃，其中「林地」17.62公頃，「農牧用地」37.65公頃。以屏東縣為例，「農牧用地」伐木面積高出「林地」甚多，而且根據經驗開發案和盜伐的面積也有限，因此推估「農牧用地」，成為養菇業木屑之最大來源。</p>\n<p>&nbsp;&nbsp;&nbsp; 屏東縣政府對原住民保留地之「農牧用地」進行嚴格的管理，伐木必須事先申請與審核，所以屏東縣原住民保留地之「農牧用地」，伐木地號、伐木期間、伐木面積等資料，完備清楚。台灣全島實際的伐木地點與面積，需要中央和地方政府重視，修改相關法律並加以管理，唯有如此國土保安才能更上一層樓。</p>\n<p>&nbsp;&nbsp;&nbsp; 在政府對「農牧用地」的土地利用情形大部分都未掌握、管理的情形下，協會當然無法取得完整的資訊，我們已盡了揭露的責任，至於完整調查的責任在於農業委員會和原住民民族委員會。</p>\n<p>&nbsp;環境資訊中心讀者留言：「這裡明指原住民保留地農牧用地，據我的經驗反駁，農牧用地不受森林法限制，地上物一般為果樹或桂竹林，用來種養香菇的段木，如楓香、相思及杜英，一般原住民不會將其種在農牧用地上，因為十年多才能伐採一次，根本沒辦法等這麼久，農牧用地作為經濟作物較多，以桂竹來說，約三～四年可伐採乙次，過程又可摘取桂竹筍，才符合農民的現實所需，我在五峰、尖石及關西的原住民保留地工作多時，僅見一～兩次固定老闆種楓香砍為自己經營香菇園，其餘農牧用地均為竹林或果樹少為杉木，這一份報告指出原住民保留地農牧用地就是段木香菇的主要來源，實在太沈重！！籲請立委諸公別用政策來殺人，應正視造林的績效及獎勵辦法，而非抹殺原住民族的經濟來源！這是漢人的觀點看天下！話說～可以請愛食用菇類的漢人採買大陸貨，或許可以減少上游的伐木。」</p>\n<p>&nbsp;</p>\n<p><span><strong>地球公民協會的回應</strong></span></p>\n<p><strong>1.</strong><strong>留言者描述五峰、尖石及關西地區的原住民保留地使用情形，澄清原住民保留地之農牧用地不是伐木的主要來源。</strong></p>\n<p>&nbsp;&nbsp;&nbsp; 協會調查伐木養菇的尺度是全台灣，每年因為養菇而伐木面積約2,300公頃，但是2007年林務局公佈實際砍伐的「林地」面積只有325.57公頃。2007年屏東縣實際伐木面積55.27公頃，其中「林地」17.62公頃，「農牧用地」37.65公頃。以屏東縣為例，「農牧用地」伐木面積高出「林地」甚多，而且根據經驗開發案和盜伐的面積也有限，因此推估「農牧用地」，成為養菇業木屑之最大來源。</p>\n<p>&nbsp;&nbsp;&nbsp; 屏東縣政府對原住民保留地之「農牧用地」進行嚴格的管理，伐木必須事先申請與審核，所以屏東縣原住民保留地之「農牧用地」，伐木地號、伐木期間、伐木面積等資料，完備清楚。台灣全島實際的伐木地點與面積，需要中央和地方政府重視，修改相關法律並加以管理，唯有如此國土保安才能更上一層樓。</p>\n<p>&nbsp;&nbsp;&nbsp; 在政府對「農牧用地」的土地利用情形大部分都未掌握、管理的情形下，協會當然無法取得完整的資訊，我們已盡了揭露的責任，至於完整調查的責任在於農業委員會和原住民民族委員會。</p>\n<p><strong>2.</strong><strong>留言者認為「獎勵造林」是原住民族的經濟來源之ㄧ。</strong></p>\n<p>&nbsp;&nbsp;&nbsp; 在國際潮流裡，造林的最主要目的是環境保護，例如「<strong>京都議定書</strong>」制定的「<strong>清潔發展機制</strong>」規範的<strong>「造林與再造林方法學」</strong>規定造林的第二項條件，「造林的土地，在造林活動前至少50年處於無林狀態」。換言之，藉由造林活動可以增加地球的綠地。</p>\n<p>&nbsp;&nbsp;&nbsp; 但是台灣在1996年推動的全民造林，很大部分卻是在山坡地砍伐既存數十年的樹木，再種植林務局發放的小苗。如此荒唐的作為，造林者可以先砍大樹賣錢，再向林務局領取每公頃20年53萬的獎勵金。如此「砍大樹、種小樹」的行徑造成環境傷害，違反世界潮流，而且代價是由全民買單。</p>\n<p>&nbsp;&nbsp;&nbsp; 令人訝異的是，農業委員會與原住民民族委員會於2008年9月，再次頒定「獎勵輔導造林辦法」，重新啟動獎勵山坡地造林。協會從2008年10月起與主管機關林務局多次溝通，要求在相關辦法中增訂規範，防止重導「砍大樹、種小樹」覆轍。但是，到目前為止林務局尚未有正面回應。但是，媒體已經揭露2009年3月車城鄉溫泉村，某林地承租人違法開山砍樹，疑似準備參與「獎勵輔導造林辦法」，領取每公頃20年60萬的獎勵金。</p>\n<p>&nbsp;&nbsp;&nbsp; 協會無意打壓原住民族的經濟，所以強力鼓催屏東縣政府推行的「限制伐木補償辦法」。屏東縣政府為了保護山坡地、兼顧地主的權益，實施「限制伐木補償辦法」，以十年每公頃3~6萬元之補償，形成有效誘因，總共只花費396萬，就保護了73公頃已存在數十年的森林長達十年。</p>\n<p>&nbsp;&nbsp;&nbsp; 藉由政府出錢，以高於伐木商的收購價，補償原住民族，保護現存的森林不被砍伐，此辦法可以同時兼顧原住民族的經濟與環境保護，又不會有「砍大樹、種小樹」的弊端，是一個多贏的政策，有必要由中央政府制訂相關法律，並編列預算在全台展開實施。</p>\n<p><strong>3.</strong><strong>留言者認為只要消費者購買大陸貨，就可以減少台灣的伐木。</strong></p>\n<p>&nbsp;&nbsp;&nbsp; 不論是台灣或中國的樹，多是地球的重要資源。購買大陸貨，雖然可以減緩台灣伐木嚴重度，但是，卻將傷害移轉到中國土地。如此挖東牆、補西牆的建議，對於全球環境沒有助益，所以協會主張加強木屑替代品的研發。</p>\n<p>&nbsp;&nbsp;&nbsp; 根據農試所的研究，栽培秀珍菇、珊瑚菇使用蔗渣取代三分之二的木屑，產量可以提高百分之三十。如果政府能投入更多經費、人力研發木屑替代品，例如禾本科、稻草、蔗渣、青割玉米桿等，或者木屑重複使用，除了可以有效減少木屑需求以及伐木量，同時或可降低養菇業者之成本。</p>\n<p>&nbsp;&nbsp;&nbsp; 一棵樹的成長最少需要10年，但砍樹只要5分鐘，吃一口菇，更只要短短的幾秒鐘，我們吃菇的背後，似乎未考量到背後森林砍伐所付出的生態損失、水土流失等代價。現階段，消費者可考慮適量食用菇蕈類，或者食用洋菇、草菇等使用發酵稻草當資材，不需要伐木養菇之菇類。而根本的解決辦法是，支持環保團體，給與政府足夠的壓力，加強森林管理、讓「限制伐木」之預算優先於造林、同時支持木屑替代品的研究，讓養菇產業減少對森林的依賴，甚至無需為了養菇而伐木。減少砍樹，人類社會才能永續發展。</p>"}, {"nid": 472, "title": "請救救森林！正視伐木養菇的代價", "original_topic": "伐木養菇", "adopted_cats": ["森林守護與林業改革"], "content": "<p><strong>請救救森林！正視伐木養菇的代價</strong><strong>&nbsp;</strong></p>\n<p>2009.4.2&nbsp; 文☉李根政</p>\n<p><strong>&nbsp;&nbsp;&nbsp; 因為養菇，台灣每年砍伐的森林面積約為</strong><strong>2,300</strong><strong>公頃</strong><strong>。</strong></p>\n<p><strong>&nbsp;&nbsp;&nbsp; 然而，森林被砍伐後，至少要花上</strong><strong>10</strong><strong>～</strong><strong>30</strong><strong>年才能長成可再砍伐的次生林。此意味著，台灣要有</strong><strong>2</strong><strong>萬～</strong><strong>7</strong><strong>萬公頃</strong><strong>以上的森林，才能維繫這樣的產業...。</strong></p>\n<p><strong>&nbsp;&nbsp;&nbsp; 百年來，我們斧鋸向山林，已讓我們付出慘痛的代價，何時才能讓山林休養生息、停止一個又一個的錯誤政策？</strong></p>\n<p><div><img alt height=\"272\" src=\"/sites/cet-taiwan.org/files/u1/clip_image002_18.jpg\" width=\"408\" loading=\"lazy\"></div></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 台灣的森林在漢人來台這四百年之間，從平地到海拔2,500公尺之間的原始森林所剩無幾，尤其是近百年來大規模的伐木最為恐怖。1912年，阿里山鐵路完工後，一棵棵巨大的檜木被載運下山，之後太平山、八仙山的伐木事業也陸續開張；1916年至1924年間，日本人在台灣進行樟樹的每木調查，調查出全島樟樹有180萬棵，歷經2、30年的伐樟取腦，雖造就台灣成為樟腦王國，但實際上是「樟樹亡國」！日治時期的林業經營，從中國來的前林業試驗所所長林渭訪先生的評語是「伐木不濫、墾而有度」，算是給與正面評價，然而，在太平洋戰爭末期乃至「光復」前，日本政府放任軍部濫砍，政權交接前後，台民濫墾甚為嚴重。</p>\n<p><strong>請救救森林！正視伐木養菇的代價</strong></p>\n<p>2009.4.2&nbsp;&nbsp; 文☉李根政</p>\n<p><strong>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </strong><strong><strong>因為養菇，台灣每年砍伐的森林面積約為</strong><strong>2,300</strong><strong>公頃</strong><strong>。</strong> </strong></p>\n<p><strong><strong>&nbsp;&nbsp;&nbsp;&nbsp; 然而，森林被砍伐後，至少要花上</strong><strong>10</strong><strong>～</strong><strong>30</strong><strong>年才能長成可再砍伐的次生林。此意味著，台灣要有</strong><strong>2</strong><strong>萬～</strong><strong>7</strong><strong>萬公頃</strong><strong>以上的森林，才能維繫這樣的產業...。</strong></strong></p>\n<p>&nbsp;</p>\n<p><strong><strong>&nbsp;&nbsp;&nbsp; 百年來，我們斧鋸向山林，已讓我們付出慘痛的代價，何時才能讓山林休養生息、停止一個又一個的錯誤政策？</strong></strong></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; <img alt height=\"272\" src=\"/sites/cet-taiwan.org/files/u1/clip_image002_18.jpg\" width=\"408\" loading=\"lazy\">&nbsp;&nbsp;&nbsp; <img alt height=\"266\" src=\"/sites/cet-taiwan.org/files/u1/clip_image003.jpg\" width=\"177\" loading=\"lazy\"></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 台灣的森林在漢人來台這四百年之間，從平地到海拔2,500公尺之間的原始森林所剩無幾，尤其是近百年來大規模的伐木最為恐怖。1912年，阿里山鐵路完工後，一棵棵巨大的檜木被載運下山，之後太平山、八仙山的伐木事業也陸續開張；1916年至1924年間，日本人在台灣進行樟樹的每木調查，調查出全島樟樹有180萬棵，歷經2、30年的伐樟取腦，雖造就台灣成為樟腦王國，但實際上是「樟樹亡國」！日治時期的林業經營，從中國來的前林業試驗所所長林渭訪先生的評語是「伐木不濫、墾而有度」，算是給與正面評價，然而，在太平洋戰爭末期乃至「光復」前，日本政府放任軍部濫砍，政權交接前後，台民濫墾甚為嚴重。</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 因而1945年國府來台，蔣夢麟等有識之士乃向政府建言五年禁伐，謂之「唯有保森林、保水土，方能保本島、保子孫」，然少數有識之士的遠見不敵以伐木爭取外匯之國策，仍延續日治時期之伐木且擴大之；1956年，國府在十三個林區厲行「多造林、多伐木、多繳庫。」之三多林政，多造林是幌子，伐木才是目標；1959年公布了台灣林業經營方針：下令「全省之天然林，除留供研究、觀察或風景之用者，檜木以80年為清理期限，其餘以40年為清理期限，分期改造為優良之森林」，目標是要把全島的原始森林伐盡，改造人工林；1965年到1975年，年平均伐木面積超過1萬公頃，其中以1971年的1萬6千多公頃為最高峰，一年的伐木面積幾乎等於整個日治時期的官營林場的伐木面積。至1989年政府宣布檜木禁伐令、林務局改為公務預算期間，台灣幾乎伐盡了檜木林；1991年在民間的森林運動壓力下，政府終宣布禁伐天然林，至此，大規模的伐木事業終告停止。</p>\n<p>&nbsp;&nbsp;&nbsp; 然而，在伐木之後，由於山區道路的開闢，國有森林竟遭濫墾、超限利用，茶、蔬菜、溫帶水果開始在高山種植，伴隨開山挖路造成更徹底的山林破壞。此時，台灣山林的破壞似乎從政府有計畫的伐木轉移至人民違法的濫墾，然而，政府錯誤的森林政策，始終未曾停歇。</p>\n<p>&nbsp;&nbsp;&nbsp; 1965-1976年推動林相變更，擇伐天然林，要將其改造為有價值的人工林；1983-1987年，政府推動林相改良，皆伐數千公頃天然林，改造為人工林；整個林業經營的思維就是把天然林視為「無用的雜木林」。</p>\n<p>&nbsp;&nbsp;&nbsp; 1959年八七水災後，政府於1961年在農林廳成立了山地農牧局，即水土保持局之前身，主管山坡地的開發利用與水土保持，開農路、產業道路，做野溪整治、攔砂壩等工程，雖名為「水土保持」，實則為確保山坡地農牧使用而不斷浪費金錢進行一點也不永續的「永續工程」，不僅無法解決水土流失的問題，反而使得台灣的山坡地災難加劇。</p>\n<p>&nbsp;&nbsp;&nbsp; 1989年銅門與1990年紅葉事件揭開了台灣土石流災難的序曲，從1996年賀伯颱風至今，土石流已成台灣最頭痛的環境課題。該怎麼辦？政府想到的是造林，1996年政府推出全民造林運動，用20年發給53萬的獎勵金來鼓勵人民在山區造林。然而，台灣山區鮮少「空白的土地」，要種樹前必得先清除原有的森林，只有極少數的林農願意把原本在種蔬菜、水果的林地拿來種樹，於是全台山區如火如荼上演「砍大樹，種小樹」，直到筆者擔任高雄市教師會生態教育中心主任時，透過林地調查揭露弊端，才促使前行政院游錫堃院長在2004年宣布喊停，期間已花費上百億，造林三萬多公頃（意味著毀林三萬多公頃）。在停辦全民造林運動之後，政府的造林工作開始轉移至平地。</p>\n<p>&nbsp;&nbsp;&nbsp; 2004年以後的台灣，還存不存在大規模的伐木？2007年底，公視柯金源導演提供了一個線索：位於屏東獅子鄉有一片已復育26 年左右的次生林，地主以1公頃 2萬元之代價賣給伐木商，伐商將整片山頭的森林全面皆伐，僅留下樹頭與光禿的山野。據了解，砍伐下來的木材用途，主要是為培育我們所食用的許多種菇類。當時地球公民協會剛成立，處理台電大林廠、三輕擴建、五輕遷廠等課題已無暇他顧。2008年8月，地球公民協會成立一年後，才開始有人力可以進行調查。我們從2008年8月至2009年2月共六個月的時間，訪查了台灣主要的伐木、碎木和養菇的主要區域，雖然受限於政府資訊不充分、協會有限之人力資源，關於伐木的情形未能進行全面調查，部分細節也未能作詳盡追蹤分析，然而，已大致掌握台灣伐林養菇之產業鏈。</p>\n<p>&nbsp;&nbsp;&nbsp; 根據台灣每年的木屑使用量和每公頃平均可得木屑量，我們推估每年養菇所需砍伐的森林面積約為2,300公頃，相當於兩座高雄的柴山，或88個台北市的大安森林公園。這樣的伐木面積到底有多嚴重呢？</p>\n<p>&nbsp;&nbsp;&nbsp; 森林被砍伐後，至少要花上10年，或者2、30年左右才能長成次生林。此意味著，如果要維持現有菇蕈產業的規模，要有10倍至30倍的森林提供輪伐。估計起來，台灣要有2萬～7萬公頃以上森林，才能維繫這樣的產業。</p>\n<p>&nbsp;&nbsp;&nbsp; 我們要問：值得嗎？</p>\n<p>&nbsp;&nbsp;&nbsp; 台灣的山地陡峭，開路、伐木所導致水土流失，要花上幾年才能恢復穩定？待穩定後可能又得再被砍一次，如此豈不是永無止境的惡性循環？歷來的土石流已造成人民生命財重大損失，後續投入的救災修復費用更已達天文數字；再者，所伐除之森林大都為低海拔次生林，其生物多樣性極為豐富，我們用2萬～7萬公頃的森林來種菇，值得嗎？</p>\n<p>&nbsp;&nbsp;&nbsp; 這幾天有一則新聞報導，屏東的農業生物科技園區，有日商看好台灣的菇蕈市場，已引進投資金額達4億3,000萬元的全自動生產設備開始生產。我們不禁擔心，台灣又有多少森林要消失？這樣的產業對山林的破壞，很明顯與高山蔬果極為類似，如果不能使用對環境友善的材料來養菇，農政單位要持續鼓勵這樣的產業嗎？</p>\n<p>&nbsp;&nbsp;&nbsp; 百年來，我們斧鋸向山林，已讓我們付出慘痛的代價，何時才能讓山林休養生息、停止一個又一個的錯誤政策？</p>\n<p>&nbsp;&nbsp;&nbsp; 民進黨主政時期，林盛豐政務委員主動積極處理山林問題，雖未竟其功，但其正面回應民間訴求，促成全民造林政策之停止，實為難得之政績；然而，自植樹節前我們揭露伐木養菇驚人事實後，迄今政府不聞不問，若無其事，連繫主管山林課題之政務委員，竟回覆：「未有院長指示，不主動處理民間陳情。」馬政府如此麻木不仁，豈不要逼使民間走上街頭？</p>\n<p>&nbsp;&nbsp; 再次呼籲，行政院出面處理此一跨部會之山林課題。</p>\n<p>作者／地球公民協會執行長</p>"}, {"nid": 477, "title": "台灣一年吃掉多少森林？台灣伐木養菇調查報告", "original_topic": "伐木養菇", "adopted_cats": ["森林守護與林業改革"], "content": "<p><strong><span>台灣一年吃掉多少森林？</span></strong></p>\n<p><strong>--台灣<span>伐木養菇</span>調查報告</strong></p>\n<p>文☉地球公民協會</p>\n<p>&nbsp;&nbsp;&nbsp; 台灣人愛吃菇，舉凡香菇、金針菇到時下最夯的杏鮑菇、美白菇，無不一一成為講求養生健康者的桌上佳餚。然而，您知道我們吃的各種菇類從那裡來嗎？答案是森林！因為養菇前必須先伐木！</p>\n<p><strong><span>年砍88座大安森林公園來養菇</span></strong></p>\n<p>&nbsp;&nbsp;&nbsp; 台灣栽培的食用菇蕈類中，除了洋菇與草菇是以稻草為栽培基質之外，其餘菇類都需要以木屑當做主要營養來源。養菇業者將菇類種植在混有木屑(75%)及輔料(25%)的太空包中栽培管理。根據農委會農業試驗所菇類研究室的估計，全台太空包使用量約47,300萬包，其中木屑所佔比例極高，因此必須大量砍伐木材，才能獲取足夠的木屑。</p>\n<p>&nbsp;&nbsp;&nbsp; 地球公民協會從2008年8月起，在全台灣主要伐木、碎木工廠、養菇區歷經半年多來的調查發現，台灣每年養菇業所需的木屑量高達35萬4,740公噸，依業界的經驗，砍伐1公頃平均可得150公噸木材，我們推估為了供應養菇業所需的木屑，一年伐木面積約達2,300公頃，相當於2座高雄的柴山，或88個台北市的大安森林公園，而伐木量最多的是苗栗、台東、新竹等地區。木材之取得包含四種途徑：第一種是經合法申請的「林地」採伐，面積約有500-700公頃，其中約200-300公頃係供應養菇業；第二種來自不需經過伐木申請評估的原住民保留地農牧用地；第三種取自工業園區、科學園區、高速鐵路、高爾夫球場等開發案整地過程中所提供的樹木；最後一種則是「盜伐」。這2,300公頃中，經合法申請在案者不超過300公頃，換句話說，每年約2,000公頃的森林砍伐未經任何申請和評估，這表示，台灣為了養菇而進行的大規模伐木行為，幾乎處於無政府狀態！</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt height=\"298\" src=\"/sites/cet-taiwan.org/files/u1/1_85.jpg\" width=\"199\" loading=\"lazy\">&nbsp; &nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;<img alt height=\"328\" src=\"/sites/cet-taiwan.org/files/u1/2_56.jpg\" width=\"219\" loading=\"lazy\"></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span>一棵樹的成長最少需要10年，但砍掉它只要5分鐘!&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;怪手過後寸草不留。&nbsp;&nbsp;&nbsp; (何俊彥攝)</span></p>\n<p><strong><span>伐木養菇的代價全民買單</span></strong></p>\n<p>&nbsp;&nbsp;&nbsp; 這些為了養菇而砍伐的森林，大多是重新復育數十年的次生林，伐木商甚至表示其中有少部分是原始林。不管是林地或農牧用地的森林，大多是地處偏遠、沒有既成道路的山區，因此，伐木之前必須先開路整地、清除地表植被，以供怪手、搬運車等載具進出。倘若伐木位置陡峭且距離既有林道遙遠，新闢林道將會在山坡上呈「之」字型蔓延達數百公尺，形同對山坡地的凌遲。伐木商通常會將整片山頭的森林全面皆伐，僅留下樹頭與光禿的山野，對比伐木前蔥蔥鬱鬱的多層次次生林，令人不勝唏噓。無論開路或伐木過程，都會導致地表嚴重裸露、土石乾燥鬆動、破壞水土保持，埋下各地山區土石流災難的根源。</p>\n<p>&nbsp;&nbsp;&nbsp; 再者，許多研究顯示次生林可以保有較佳的鳥類多樣性。美國康乃迪克大學生態學與演化學教授Robin Chazdon呼籲大家，重視次生林是僅次於原始林與河岸的保育重點；國內亦有研究指出次生林不論在繁殖季或非繁殖季，其所蘊藏鳥類的歧異度、豐富度、總密度都比柳杉林高。不幸的是，養菇伐木使次生林面積減少、次生林無法自然演替為原始林，危及生物多樣性。</p>\n<p>&nbsp;&nbsp;&nbsp; 若根據林務局的資料來換算，養菇一年砍伐2,367公頃林木，將導致每年減少吸收8.8萬公噸的二氧化碳，減少釋出6.6萬公噸的氧氣，減少涵養473.4萬立方公尺的水資源，換算為經濟損失至少達8.8億元。不過，台灣每年因為土石流失所造成的人命和經濟損失非常驚人，加上低海拔次生林生物多樣性受衝擊，每片砍伐跡地至少需花費十年以上才能恢復部分生態，倘若將這些外部環境成本全部加總起來，粗估伐木養菇真正的代價將遠遠超過8.8億元，且全部由台灣人民共同買單。</p>\n<p>&nbsp;&nbsp;&nbsp; 由於主管機關農委會認定「農牧用地」不受「林地」相關法規管制，所以未要求各縣市政府進行伐木管制與統計，如此一來，形成極大的國土保安漏洞。這些在山坡地上的農牧用地通常因坡度陡峭而廢耕，逐漸發展成覆被良好的森林，形成很重要的維生系統與生物棲息地，對於水土保持、水源涵養，更是效益卓著。然而，在伐木商的遊說鼓吹下，許多地主以非常低廉的價格（平均每公頃2～4萬元）將樹木賣給伐木商。<strong>以此金額推估，不用花100萬，就可以砍光一整座台北大安森林公園（面積27公頃）或高雄美術館公園的樹木！</strong></p>\n<p>&nbsp;&nbsp;&nbsp; 此外，1997年至2004年間政府推出『全民造林運動』，以及2008年公告『獎勵輔導造林辦法』，都將原住民保留地的「農牧用地」納入獎勵造林的範圍。對地主來說，變賣或砍伐原有樹木後再重新造林，不僅可獲取商業利益，也可獲得政府獎勵金，何樂而不為呢？但<strong>如此一來，犧牲掉的便是我們國家國土的保全！</strong>山區農牧用地依森林法之子法造林獲得獎勵，卻不受『森林法』管制，「國土不安」之亂象叢生，政府還能繼續放任、坐視不理嗎？</p>\n<p><div><img alt height=\"334\" src=\"/sites/cet-taiwan.org/files/u1/a_12.jpg\" width=\"500\" loading=\"lazy\"></div></p>\n<p><div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span>李根政執行長在記者會上說明伐木養菇的問題&nbsp;&nbsp; (王敏玲攝)&nbsp; </span></div></p>\n<p><div><span>&nbsp;</span></div></p>\n<p>&nbsp;&nbsp;&nbsp; <img alt height=\"334\" src=\"/sites/cet-taiwan.org/files/u1/b_10.jpg\" width=\"500\" loading=\"lazy\">&nbsp;&nbsp; <img alt height=\"334\" src=\"/sites/cet-taiwan.org/files/u1/c_8.jpg\" width=\"500\" loading=\"lazy\"></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span>綿延數百公尺的「之」字形林道將森林帶走了&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;從太空包剛冒出來的小香菇&nbsp;&nbsp;&nbsp;&nbsp; (李根政攝)</span></p>\n<p><strong><span>與其「造林」不如「限制伐木」</span></strong></p>\n<p>&nbsp;&nbsp;&nbsp; 過去，山坡地造林曾衍生「砍大樹、種小樹」之弊端，如今，中央政府為兌現馬總統競選政見「愛台12建設」的第八項建設，推動全台灣的平地造林（農委會決定8年內平地造林6萬公頃，2009年先投注28億元實施造林補貼，以每公頃60萬元獎勵林農造林，預計執行平地造林4,250公頃及山坡地造林500公頃，合計全台將造林4,750公頃），卻無視於2005年草率的全民造林政策被環保團體攔阻後，迄今林務單位尚未制定相關防範、管理辦法，不禁令人高度懷疑此番擴大造林政策的成效，也為過去的山林浩劫是否將重演，捏一把冷汗！</p>\n<p>&nbsp;&nbsp;&nbsp; 反觀屏東縣政府為了保護山坡地、且兼顧地主的權益，實施「限制伐木補償辦法」。參加的地主與縣政府約定好十年內不砍樹，然後依材積而異，可以領取每公頃3~6萬元不等的補償金，這比起將樹木賣給伐木商的價錢更好！而且縣政府發放補償的面積是指同一地號的所有面積，必然會大於縣政府核准同一地號砍伐的最大面積。另一個經濟誘因是，十年限制期滿後，土地上的樹木所有權還是歸地主所有。因此，以一個地方政府有限的經費，居然總共只花費396萬，就保護了73公頃已存在數十年之久的森林。這項政策所需經費僅造林獎勵金的1/5至1/10，不僅效益更高，也更能照顧到原住民或林農的經濟。</p>\n<p>&nbsp;&nbsp;&nbsp; 然而，自屏東縣政府實施此辦法後，屏東地區碎木商抱怨當地樹木取得困難，乃轉向台東地區下手，如此對台灣整體山林的衝擊並沒有降低，只是原本被砍伐的山林從屏東轉移到台東。為了解決挖東牆補西牆的問題，有必要由中央政府制定「限制伐木」政策，並在全台推動。無獨有偶，國際上也已經有類似「限制伐木」的機制在形成中，例如：「避免開發中國家毀林」(REDD. Reduce Emissions from Deforestation in Developing Countries)便是「氣候變遷綱要公約」第13次締約國大會達成的「峇里行動計畫」中一項重要決議，顯見森林的保護與砍伐行為的規範是世界各國共同的目標，台灣政府又如何能自外於此呢？</p>\n<p><strong><span>我們的主張</span></strong></p>\n<p><span><strong>1. </strong><strong>中央政府應儘速、全面推動「限制伐木補償」政策</strong></span></p>\n<p>&nbsp;&nbsp;&nbsp; 地球公民協會估計，以2,300公頃、每公頃每十年3~6萬元計，只要7,000萬至1億4千萬台幣就可以保護88個大安森林公園十年，相信這是中央政府能夠負擔、也值得投資的。如果政府反應仍如牛步，民間不排除發起森林認養運動，每年只要花3,000~6,000元，即可保護一公頃的森林。</p>\n<p><span><strong>2. </strong><strong>加強農牧用地之管理</strong></span></p>\n<p>(1) 檢討農牧用地之編定：將許多位於陡峭山地、不適於現代農業和林業經營的農牧用地重新檢討為保安林地，但需建立配套的地主補償機制。</p>\n<p>(2) 修改「森林法」第3條：將有接受「全民造林」或「獎勵輔導造林辦法」補助事實之土地納入「森林法」管理範疇。</p>\n<p><span><strong>3. </strong><strong>儘速推動認證合法伐木、杜絕盜伐</strong></span></p>\n<p>&nbsp;&nbsp;&nbsp; 政府應確認與稽核，要求碎木工廠只可收受經核准採運的伐木；再者，說服太空包製造業者只向通過認證的碎木工廠購買木屑；最後，說服或教育消費者辨識及購買符合認證的菇類產品，向盜伐說NO。</p>\n<p><span><strong>4. </strong><strong>研發木屑替代品，提升菇蕈類生物效率</strong></span></p>\n<p>&nbsp;&nbsp;&nbsp; 根據農試所的研究，如使用蔗渣取代三分之二的木屑來栽培秀珍菇或珊瑚菇，產量將提高百分之三十。如果政府能投入經費人力研發木屑替代品、提升菇蕈類生物效率，不僅可以有效減少木屑需求以及伐木量，同時或可降低養菇產業之成本。再者，若能重複使用太空包舊基質，則僅需添加部份新木屑，亦可降低木屑需求。</p>\n<p><span><strong>5. </strong><strong>民眾食用菇蕈類應適量</strong></span></p>\n<p>&nbsp;&nbsp;&nbsp; 消費者適量食用菇蕈類，或者食用洋菇、草菇等使用發酵稻草當資材，不需要伐木養菇之菇類。另外，也可以支持環保團體，給與政府壓力，改變森林政策，讓保護現有森林之預算優先於造林，同時支持木屑替代品的研究，讓養菇產業減少對森林的依賴，甚至無需伐木也能養菇。</p>\n<p><strong><span>結語</span></strong></p>\n<p>&nbsp;&nbsp; 揭露伐木養菇問題絕非意圖打擊台灣養菇產業，是為呼籲政府和社會共同面對此問題，並從政策面、生產面、消費面改變。或許食菇無罪、養菇無罪，但是當生產和消費過程已明顯付出嚴重的環境代價時，是否應修正產業和消費的型態，盡可能減少對地球的破壞？此外，本報告也揭露政府在山林治理上的重大漏洞，極需相關部會的積極回應，期望創造出台灣山林水土、養菇產業與消費者三贏的可能！本會將持續追蹤本案之後續發展。</p>\n<p><div><img alt height=\"240\" src=\"/sites/cet-taiwan.org/files/u1/d_3.jpg\" width=\"360\" loading=\"lazy\"></div></p>\n<p><div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span>百年斧鋸向山林，已讓我們付出慘痛代價!何時可讓山林休養生息? (何俊彥攝)</span></div></p>\n<p><div><span><strong><span>說明與致謝</span></strong></span></p>\n<p><span>&nbsp;&nbsp;&nbsp; <span><span>從2008年8月至2009年2月共六個月的時間，本會實地訪查了養菇產業從上游到下游之生產過程，與中央及地方主管林地伐採之政府官員電話訪問，或行文取得政府資訊，並蒐集與整理相關文獻。雖然受限於政府資訊不充分，協會有限之人力資源，關於伐木的情形未能全面調查，部分細節也未能詳盡追蹤分析，然而，基於倡議本議題之急迫性，乃於2009年3月11日將調查結果公諸社會。</span> 感謝屏東縣政府協助協會了解伐木流程；農委會農業試驗研究所菇類研究室、台灣菇類發展協會、農糧署企劃組、環保署綜合計畫處、林務局造林生產組、森林警察戴志強先生、產業鏈相關業者接受訪談；各縣市政府林務課人員、原住民民族委員會等提供書面資料。更感謝詹順貴律師、楊國禎副教授幫忙審閱，讓本報告更趨嚴謹。 </span></span></p>\n<p> <span> </span></p>\n<p><div><span><span>&nbsp;&nbsp;&nbsp; </span><span>本調查工作之進行，主要由本會執行長李根政策劃，楊俊朗研究員執行，袁庭堯、何俊彥等義工協助拍照、錄影；文稿撰寫、影片後製、公諸社會等工作及則是在李根政、楊俊朗、王敏玲、蔡卉荀、薛淑文、楊馥慈等人之協力下完成。這是地球公民協會首度在處理即時議題的同時，進行較長期的調查工作，報告雖未臻完美，但我們會繼續努力！（完整報告請參閱協會網站<a href=\"/node/464\">http://met.ngo.org.tw/node/464</a>。）</span><span> </span></span></div></p>\n<p> <span> </span></p>\n<p>&nbsp;</p>\n<p></div></p>\n<p><div><span>&nbsp;</span></div></p>"}, {"nid": 499, "title": "山林有難！反對宗教團體法讓違法寺廟就地合法！", "original_topic": "無", "adopted_cats": ["森林守護與林業改革", "國土計畫"], "content": "<p><strong>〈民間團體共同聲明暨連署書〉</strong></p>\n<p><strong>山林有難！反對宗教團體法讓違法寺廟就地合法！</strong><strong>&nbsp;</strong></p>\n<p>&nbsp;</p>\n<p><span>誰能告訴我們：這是合法還是非法？ </span></p>\n<p><span>違法占用公有土地的寺廟合法化？符合全民利益？</span></p>\n<p><div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p>\n<p><div><img src=\"/sites/cet-taiwan.org/files/u1/clip_image002_20.jpg\" alt width=\"294\" height=\"440\" loading=\"lazy\"></div></p>\n<p> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<strong>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</strong><span>(地球公民協會提供) </span></p>\n<p></div></p>\n<p><span>&nbsp;</span></p>\n<p><strong>&nbsp;&nbsp;&nbsp; </strong>從2005年開始，內政部就打算主導要讓全台約400多座違法佔用林班地、重測農地的宗教寺廟建築，就地合法化。近日，立法院內政委員會以罕見的高效率，在一日之內有如神助的通過「宗教團體法」，其中第21條、28條、34條赤裸裸的為這些違法宗教寺廟解套，第21條明訂<span>「宗教法人在本法施行前已繼續使用公有非公用土地從事宗教活動滿五年者，得依公產法規辦理讓售。</span>」所謂「繼續使用公有非公用土地」就是長期違法佔用的意思。此法一通過，全台違法宗教寺廟即全數可合法化。</p>\n<p>&nbsp;&nbsp;&nbsp; 目前該法案已經在內政委員會審查通過，由於沒有委員提出異議，即將排入院會，極有可能在最近通過，極需立委或黨團在大會中出異議，要求重新討論。我們反對違法占用國公有地宗教寺廟合法化的理由如下：</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 一、百年來由於山林破壞，已造成嚴重的土石流、水患大災難。山林政策應以國土復育為上位原則，而非持續鬆綁山林開發。</p>\n<p>&nbsp;&nbsp;&nbsp; 二、此法嚴重破壞國家體制，包括國土規劃、國土復育、區域計畫、都市計畫法等。另外，位於山坡地之宗教寺廟更可能違反森林、建築、山坡地保育相關法規，造成水土流失等環境破壞，面對寺廟長期違法的行為，政府主管民政、森林、水保、區域計畫之官員竟視若無睹，已是嚴重失職，如今卻主動立法讓其全部合法，政府威信蕩然無存。</p>\n<p>&nbsp;&nbsp;&nbsp; 三、讓違法占用者合法化，不符社會公平正義，變相鼓勵人民違法占用、濫墾國公有土地，再想辦法尋求合法化，反正有前例可循。</p>\n<p>&nbsp;&nbsp;&nbsp; 四、政府多年來為非法寺廟就地合法，已在2001年頒布「未辦理登記寺廟補辦登記作業要點」，針對已存在但「未能」辦理登記的寺廟，可於該年四月一日起至隔年三月以前「補辦登記」。台灣許多寺廟與政商關係密切，如此一再為違法寺廟解套，實有不當利益輸送之嫌。</p>\n<p>&nbsp; <strong>〈民間團體共同聲明暨連署書〉</strong><strong></strong></p>\n<p><strong>山林有難！反對宗教團體法讓違法寺廟就地合法！</strong><strong></strong></p>\n<p>&nbsp;</p>\n<p><span>誰能告訴我們：這是合法還是非法？ </span></p>\n<p><span>違法占用公有土地的寺廟合法化？符合全民利益？</span></p>\n<p><div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p>\n<p><div><img src=\"/sites/cet-taiwan.org/files/u1/clip_image002_20.jpg\" alt width=\"294\" height=\"440\" loading=\"lazy\"></div></p>\n<p> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<strong>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</strong><span>(地球公民協會提供) </span></p>\n<p></div></p>\n<p><span></span></p>\n<p><strong>&nbsp;&nbsp;&nbsp; </strong>從2005年開始，內政部就打算主導要讓全台約400多座違法佔用林班地、重測農地的宗教寺廟建築，就地合法化。近日，立法院內政委員會以罕見的高效率，在一日之內有如神助的通過「宗教團體法」，其中第21條、28條、34條赤裸裸的為這些違法宗教寺廟解套，第21條明訂<span>「宗教法人在本法施行前已繼續使用公有非公用土地從事宗教活動滿五年者，得依公產法規辦理讓售。</span>」所謂「繼續使用公有非公用土地」就是長期違法佔用的意思。此法一通過，全台違法宗教寺廟即全數可合法化。</p>\n<p>&nbsp;&nbsp;&nbsp; 目前該法案已經在內政委員會審查通過，由於沒有委員提出異議，即將排入院會，極有可能在最近通過，極需立委或黨團在大會中出異議，要求重新討論。我們反對違法占用國公有地宗教寺廟合法化的理由如下：</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 一、百年來由於山林破壞，已造成嚴重的土石流、水患大災難。山林政策應以國土復育為上位原則，而非持續鬆綁山林開發。</p>\n<p>&nbsp;&nbsp;&nbsp; 二、此法嚴重破壞國家體制，包括國土規劃、國土復育、區域計畫、都市計畫法等。另外，位於山坡地之宗教寺廟更可能違反森林、建築、山坡地保育相關法規，造成水土流失等環境破壞，面對寺廟長期違法的行為，政府主管民政、森林、水保、區域計畫之官員竟視若無睹，已是嚴重失職，如今卻主動立法讓其全部合法，政府威信蕩然無存。</p>\n<p>&nbsp;&nbsp;&nbsp; 三、讓違法占用者合法化，不符社會公平正義，變相鼓勵人民違法占用、濫墾國公有土地，再想辦法尋求合法化，反正有前例可循。</p>\n<p>&nbsp;&nbsp;&nbsp; 四、政府多年來為非法寺廟就地合法，已在2001年頒布「未辦理登記寺廟補辦登記作業要點」，針對已存在但「未能」辦理登記的寺廟，可於該年四月一日起至隔年三月以前「補辦登記」。台灣許多寺廟與政商關係密切，如此一再為違法寺廟解套，實有不當利益輸送之嫌。</p>\n<p>&nbsp;&nbsp;&nbsp; 請內政部公布符合宗教團體法第21條之要件，取得合法化資格之宗教寺廟有多少？所在縣市、建物所有人、教派，土地使用分區或用地編定，面積、土地所有權人等相關資訊，同時請經建會、內政部、農委會說明這些建物合法化可能的衝擊，並且召開公聽會釐清相關爭議後，再進入院會討論。<span>請立法院國民黨、民進黨團，為土地、為人民及後代子孫把關，負起立法委員之職責，嚴謹把關，萬不可讓此宗教團體法草率送入院會通過！</span></p>\n<p>聲明團體：</p>\n<p>地球公民協會、台灣蠻野心足生態協會、台灣生態學會、高雄市野鳥學會、人本教育基金會、荒野保護協會、台灣動物社會研究會、高雄市柴山會、高雄市綠色協會、台南市社區大學、主婦聯盟環境保護基金會、高雄市教師會、高雄醫學院阿米巴詩社、台灣濕地保護聯盟、草山生態文史聯盟、看守台灣協會、中華民國野鳥學會、八頭里仁協會（依確認順序排列，社團連署中）</p>\n<p>新聞連絡人：台灣蠻野心足生態協會祕書長‧林子凌&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 地球公民協會研究員‧楊俊朗&nbsp;&nbsp;</p>\n<p><div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</div></p>\n<p><strong>&lt;宗教團體法爭議法條&gt;</strong></p>\n<p>第二十一條</p>\n<p>宗教法人於本法施行前已繼續使用公有非公用土地從事宗教活動滿五年者，得檢具相關證明文件，報經主管機關核轉土地管理機關，依公產管理法規辦理讓售。</p>\n<p>前項供宗教目的使用之土地，得優先辦理都市計畫或使用地變更編定。</p>\n<p>各級政府擬定或變更都市計畫時，應以維護既有合法宗教用地及建築之完整為原則。</p>\n<p>&nbsp;</p>\n<p>第二十八條</p>\n<p>宗教建築物指宗教團體為從事宗教活動，依建築法令領得使用執照之建築物。</p>\n<p>宗教建築物為社會發展之需要，經宗教建築物所在地之主管機關許可，並符合土地使用分區管制者，得為其他使用。</p>\n<p>宗教法人所有之宗教建築物供其作為宗教活動使用者，得依房屋稅條例免徵房屋稅，其基地得依土地稅減免規則免徵地價稅。供出租使用，且其收入全部作為宗教目的使用者，亦同。</p>\n<p>&nbsp;</p>\n<p>第三十四條</p>\n<p>本法施行前，寺院、宮廟、教會附設之納骨、火化設施已滿十年者，視為宗教建築物之一部分。但以區分所有建築物為宗教建築物者，不適用之。</p>\n<p>前項視為宗教建築物一部分之納骨、火化設施，其有損壞者，得於原地原規模修建。</p>\n<p>&nbsp;</p>"}, {"nid": 554, "title": "98年度大事記", "original_topic": "無", "adopted_cats": ["森林守護與林業改革", "監督高雄重大污染"], "content": "<p>&nbsp;</p>\n<p>地球公民協會大事記</p>\n<p>&nbsp;</p>\n<p>1月</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;6日李根政執行長、王敏玲副執行長、薛淑文執祕及義工袁庭堯、何俊彥等人，前往潮寮村拜會潮寮、會結、過溪三村村長，提供反公害運動經驗與建議，並進行訪調、影像紀錄。 7日，李根政執行長、楊俊朗研究員赴田秋堇立委辦公室與林務局局長顏仁德會談，並建議修改「獎勵輔導造林辦法」，防範砍大樹種小樹的不當行為。 8日，王敏玲副執行長、薛淑文執祕、楊俊朗研究員及義工何俊彥、袁庭堯等人前往潮寮村參與毒氣事件之協調會，並進行影像紀錄。 9-10日，冬令營活動梅山路線第二次現勘，本會同仁及義工柯耀源、傅志男、黃裕峰、何俊彥一同參加。 12日，李根政執行長、薛淑文執行祕書及義工何俊彥、黃裕峰等人參加由高雄縣楊秋興縣長主持之茄萣溼地1-1、1-6道路現勘會議。 15日，上午10：30本會舉行「愛牠，就不要害牠」記者會，由本會執行長李根政、副執行長王敏玲、柴山會藍培榮理事、人本教育基金會謝禎芳主任、高雄市教師會于居正理事長出席，齊聲反對壽山動物園引進白老虎；楊俊朗研究員、義工袁庭堯赴台東縣香蘭部落，訪問森林警察戴志強先生；晚間，本會於神采飛揚KTV舉行年終聚會，本會同仁及十多位義工參加，由本會周益村理事及義工魏秀姍擔任主持人，協會蘇振輝理事長、楊博名副理事長均到場致辭。 16日，美國自由之家研究部主任克里斯多福‧沃克(Christopher Walker)及亞洲事務研究員(Sarah Cook)暨台灣民主基金會、高雄市立空中大學友人來訪。 18日，綠色和平組織中國分部總幹事Mario Damato（戴慕韜）及香港綠色和平行政總監馮家強先生來訪，由李根政執行長、王敏玲副執行長、薛淑文執行秘書接待，經驗交流。 19日，薛淑文執行祕書參加環保署舉辦之台電大林廠「粒狀污染物及二氧化碳排放」專家延續會議。</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>2月</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>5日-7日，本會舉辦「尋訪水之源----環境關懷與生態體驗之旅」冬令營隊。 9日，李根政執行長、王敏玲副執行長會同台灣動物社會研究會朱增宏執行長共同拜會高雄市議長莊啟旺及高雄市議員陳麗娜，就引進白老虎至壽山動物園一案溝通意見。 11日，李根政執行長接受高雄教育廣播電台專訪。 12日，本會舉行冬令營活動檢討會，本營隊之會內講師、解說員、工作人員全數出席。 18日，楊俊朗研究員、義工袁庭堯、何俊彥赴屏東縣春日鄉、牡丹鄉伐木現場現勘。 19日，李根政執行長參加「高屏溪流域管理委員會」第26次委員會議。 20日，本會舉辦COP14之行分享會，由李根政執行長、王敏玲副執行長分享COP14之行心得，高雄市環保局劉俊一副局長、林燦銘科長等人到場致辭。 21日，李根政執行長應主婦聯盟之邀，赴後勁社會福利基金會演講，並至污染場址解說。 23日，李根政執行長參加高屏溪流域管理委員會研商「高屏溪流域整治計畫(98-93年)」說明會事宜。 24日，楊俊朗研究員赴高雄市政府，就守護柴山論壇後續行動，與柴山會及市府觀光局、經發局、都發局代表交換意見。王敏玲副執行長至中廣，錄製節目宣傳地球公民講座。 25日，本會邀請綠色公民行動聯盟康世昊理事長、彰化縣環保聯盟施月英總幹事至協會就燃煤電廠興建對二氧化碳增量及未來電力需求預測等問題討論。 26日，楊俊朗研究員、義工袁庭堯赴南北貨市場與武廟市場，調查菇類市場現況。 26-27日，李根政執行長、王敏玲副執行長、薛淑文執行祕書參加由能源局舉辦之2009全國能源會議。</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;3月</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>5日，李根政執行長受邀至屏東縣政府演講，講題：「與社會對話」。 6日，晚間，本會舉辦地球公民講座，由粘錫麟老師主講：「環境運動與台灣」。 7日，晚間，王敏玲副執行長至台北參加青年環境智庫COP14分享會。 10日，薛淑文執祕接受高雄教育廣播電台訪問，談「從能源會議談台電大林擴建問題」。 11日，本會於台北舉辦「揭開台灣伐木養菇的真相」記者會。 12日，李根政執行長參加2009年全國能源會議—全體大會暨分組預備會議。 13日，本會專職李根政、薛淑文、蔡卉荀至後勁溪流域現勘，並拜訪海科大林啟燦老師了解後勁溪水質監測情形。 16日，李根政執行長參與能源會議—「能源管理與效率提升」組會議。 18日，李根政執行長受邀至瑞豐國小演講，講題：「台灣環境議題」。 20日上午，李根政執行長受邀至正興國中演講；薛淑文執行祕書參加「抗議國科會成為白海豚（媽祖魚）殺手﹗」記者會；下午，參加台電公司電廠整體溫室氣體排放減量計畫專家會議。 23日，李根政執行長參加能源會議「能源管理與效率提升」組第2次分組會議。 25日，李根政執行長受邀至成大中文系演講，講題：「環評的真相」；晚上，到第一社區大學上課，談「交通與都市發展」。 26日，本會專職薛淑文、蔡卉荀到嘉義參加水圳會議第1次籌備會議；本會發行之《地球公民通訊》第五期出版。 27日，李根政執行長參加能源會議—「能源管理與效率提升」組第3次分組會議；王敏玲副執行長至高雄市議會參加陳麗娜市議員主持的「碳稅徵收自治條例公聽會」。 28日，李根政執行長至茄定鄉演講談：「台灣山林水土百年紀」。</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>4月</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>1日，本會專職李根政、王敏玲會同旗美社大張正揚主任等人就農村再生條例等問題拜會李復興立委。 2日，李根政執行長到高雄醫學院演講，講題：「工業文明的代價與出路」 3日，本會專職李根政、蔡卉荀會同環保署稽查大隊、高雄縣環保局，前往大寮鄉紅蝦山瞭解廢棄物悶燒情形；晚間，本會舉辦地球公民推廣講座，由鐘怡婷主講：「農再條例爭議分析」。 6日，本會專職楊俊朗與楊馥慈參加「非營利組織資訊科技運用座談會」。 7日，李根政執行長參加能源會議NGO討論會；本會專職王敏玲、薛淑文和蔡卉荀到嘉義參加「農田水污染」工作小組第一次會議；楊馥慈行政助理、本會理事柯耀源、義工何俊彥參加高都二期園區開放活動籌備會；楊俊朗研究員接受教育廣播電台高雄分台訪問，談伐木養菇的代價。 8日，王敏玲副執行長至高雄第一社大自然生態社上課，主題：「飲食、農地與環境價值」 10日，聯合民間社團發宗教團體法聲明，反對第21條讓非法佔有國家土地之宗教團體，就地取得合法讓售土地之特權。 11日，本會與公民行動影音紀錄資料庫、公視peopo公民新聞平台、社會民主工作室合辦影音工作坊。 13日，楊俊朗研究員至台北參加由綠色採購聯盟主辦之「紙製品綠色採購研討會」。 14日，李根政執行長拜會民進黨黨團召集人柯建銘立委，談宗教團體法。 15日，李根政執行長受邀到嘉義古民國小演講，講題「台灣不願面對的真相--發展的代價與出路」；王敏玲副執行長受邀至至前鎮國小演講：「暖化，燒到了誰？從全球氣候變遷談倫理消費」。 15-16日，薛淑文執行祕書至台北旁聽全國能源會議，並參加民間社團會後場外抗議活動。 16日，李根政執行長參加全國能源會議，王敏玲副執行長旁聽此會議，並參加民間社團會後場外抗議活動。 17日，上午，王敏玲副執行長參加台南陳椒華、台東徐蘭香於警政署前之抗議行動；下午，李根政執行長、王敏玲副執行長參加台達電子文教基金會及卓越新聞獎基金會舉辦的邁向哥本哈根氣候變遷媒體沙龍活動；薛淑文執祕到彰化大城參加國光石化說明會。 19日，本會專職李根政、王敏玲、蔡卉荀、楊馥慈參與高雄都會公園二期園區啟用典禮，設攤宣傳協會，同時宣導民眾正視伐木養菇的代價；協會義工演出「愛地球行動劇」。 21日，本會專職李根政、薛淑文、蔡卉荀與台塑重工及台塑工會進行後勁溪沿岸農田取水口現勘。 21日，楊俊朗研究員至屏東縣參加「屏東縣總合治水論壇」。 22日，本會專職李根政、王敏玲應高雄市環保局之邀，參加抗暖化環保影展引言及與談。 25-26日，本會義工策劃舉辦屏東滿州之旅，共有義工、專職、本會友人30多人參加。 25日，王敏玲副執行長應高雄縣婦幼館之邀至大樹鄉九曲堂社區演講，講題：「飲食與環保的美味關係。」 27日，李根政執行長至清華大學演講，講題：「工業文明的代價與出路」。 29日，王敏玲副執行長受邀至至瑞豐國小演講，講題：「從全球氣候變遷談倫理消費」 29日，楊俊朗研究員參加柴山舊部落地區現有建物修繕暨相關都市計畫分區問題討論會。 5月 5月3日，本會專職薛淑文、楊俊朗參與茄萣溼地生態季活動設攤宣傳。</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>5月</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>5日，台塑仁武廠黃建元等人來訪；下午蔡卉荀研究員赴環保署參加「研商降低灌溉水質及農地受重金屬污染」會議；楊俊朗研究員接受教育廣播電台台北總台電話錄音，主題：「伐木養菇的代價」。 6日，李根政執行長到正修技術學院演講，講題：「工業文明的代價與出路」。 7日，本會專職李根政、楊俊朗至立法院參加田秋堇立委辦公室主辦之宗教團體法說明會，與內政部民政司黃麗馨司長、國有財產局張璠副局長釐清宗教團體法相關疑義。 8日，本會專職薛淑文、蔡卉荀赴台灣生態學會參加「98年度水圳論壇大會中區會前會」；晚間，本會舉辦地球公民講座，由楊俊朗研究員主講：「伐木養菇的代價」。 9日，本會應河堤社區發展協會邀請，由專職王敏玲、薛淑文、義工李怡賢、何俊彥至高雄市河堤公園跳蚤市場設攤宣傳義賣；李根政執行長於台南「在地政治工作坊」報告高雄反公害運動並參與座談。 10日，李根政執行長參與簽署「守護柴山宣言暨行動方案」活動，共同參與簽署者還有高雄市長陳菊、李永得副市長等人。 11日，李根政執行長參加高雄市永續發展委員工作小組會議。 12日，王敏玲副執行長應邀至高雄師範大學環境教育研究所演講，講題：「理念與行動」。李根政執行長至教育廣播電台高雄分台錄音，主題「為我們孩子而寫的求生手冊」。 13日，李根政執行長參加「高屏溪流域管理委員會」第27次委員會議。 15日，李根政執行長到台北大學資源所演講，講題：「發展的的代價與出路」 18日，楊國楨老師、李根政執行長、楊俊朗研究員至苗栗縣銅鑼鄉、泰安鄉勘查伐木情形與訪問碎木工廠。 19日，舉辦「2009年後勁溪污染後續追蹤會議」，出席者有：環保署水保處、空保處、高雄縣環保局、高雄農田水利會、台塑仁武廠代表、柴山會。 20日，本會專職李根政、王敏玲、薛淑文拜訪高雄市陳麗娜議員，討論台電大林廠擴建案。 21日，本會專職李根政、王敏玲應心路基金會鄭慧曼小姐之邀參觀榮科公司，瞭解碳粉匣回收再利用的製程。 22日，李根政執行長至快樂聯播網談環境問題；楊俊朗研究員至屏東縣野鳥學會演講，主題：「伐木養菇的代價」。 25日，李根政執行長、李怡賢義工、薛淑文執祕參加於小港鳳林宮，由大林蒲反中油自救會所舉辦的中油大林環保說明會。 26日，本會專職李根政、王敏玲、蔡卉荀會同高雄農田水利會岡山工作站人員現勘岡山灣裡圳、五甲尾溝及允成工業區。</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>6月</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;6月1日，李根政執行長到高雄應用科技大學演講談工業文明的代價。 2日，本會專職李根政、蔡卉荀拜訪后里鄉農業與環境保護協會，瞭解后里鄉農業用水與中科園區開發的關係。 3日，環球技術學院5位印尼籍畢業生來訪，談熱帶雨林砍伐問題嚴重性；本會專職薛淑文、楊俊朗至高雄第一社區大學演講，講題分別是：「從能源問題談台電大林廠擴建」、「失控的進步-大規模伐木養菇」。 4日，協會舉辦「再生衛生紙」記者會，公開再生衛生紙的調查結果；晚間，楊俊朗研究員受邀至高雄市野鳥學會演講，主題：「失控的進步-大規模伐木養菇」。 5日，本會專職李根政、薛淑文拜會黃昭順立委，談宗教團體法中國有土地讓售之問題；會後，參加環保署舉辦的大林電廠擴建案第5次初審會。 6-7日，本會專職王敏玲、楊俊朗至成大參加「重新連結生態與經濟的另類發展工作坊研討會」。 8日，王敏玲副執行長應社大長青學苑之邀至德生教會演講，講題：「飲食與環保的美味關係」；晚間，本會舉辦地球公民講座，由吳明益演講，講題：「書寫‧解放自然」。 9日，楊俊朗研究員至教育廣播電台高雄分台接受訪問，談珍愛環境，改用再生衛生紙。 10日，本會專職李根政、薛淑文、蔡卉荀會同環保署水保處、空保處、高雄縣環保局、海科大林啟燦教授，現勘後勁溪、仁武工業區排水道、及台塑仁武廠廠區。晚上，李根政執行長至社大談「看小蝦米如何對付大鯨魚」。 12日，上午，薛淑文執祕參加環保局舉辦中元普渡紙錢集中焚燒，減少空氣污染及「以功代金」活動宣傳說明會。下午，本會專職王敏玲、薛淑文參加由黃柏霖市議員主持之「中油後勁五輕遷廠後談高雄市生態復育」公聽會。 15日，本會專職李根政、王敏玲、薛淑文參加由鄭光峰議員聯合醫界人士，於台電大林廠門口舉辦「反對台電大林廠擴建」記者會。</p>\n<p>&nbsp;</p>"}, {"nid": 567, "title": "請政府停止出賣柴山！", "original_topic": "無", "adopted_cats": ["森林守護與林業改革", "國土計畫"], "content": "<p><span> </span></p>\n<p><span>&nbsp;</span></p>\n<p><span><span><br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;  莫拉克襲台，山崩土石流、滅村災情不斷，而就在台灣要談國土保安重新檢討山林利用政策的時刻，高雄市的柴山卻面臨一個未知潛藏的大災難，因為國有財產局就在此時大賣地質敏感、且脆弱的山坡地！地點就在柴山西側，公開標售面積廣達  四十一萬平方公尺  ，此地為地質脆弱的崩積地，屬於保護區，而且大部分還是<strong>根本不能賣的國有保安林</strong>！吊詭的是在去年民間與高市府連袂召開柴山論壇，宣示將積極展開保護行動的時刻，中央竟急急出手大賣山林！</span><span>&nbsp;&nbsp;</span></span></p>\n<p><span><span><br></span></span></p>\n<p><span><span>請讓我們來好好面對一些數字與現況吧！這個區域每年平均滑動</span><span>8</span><span>-10</span><span>公分</span><span>，屬於珊瑚礁石灰易崩塌滑動的地質。標售地區大部分即屬於易崩塌、滑動地區，而且大部分竟然還是</span><strong><span>國有保安林！那根本就不能賣！</span></strong><span>但是，何以中央竟然膽大到連國有保安林都能出售？還在此山崩水解的時刻，我們實在無法理解！</span><span>&nbsp;&nbsp;</span></span></p>\n<p><span><span><br></span></span></p>\n<p><span><span>像莫拉克這樣的強力暴雨，未來只會愈來愈嚴重，三天</span><span>2500mm</span><span>的降雨量，不會只發生在高屏溪山區，未來全台將無一倖免！你或許會說，這些地方現在也沒崩啊！是的，因為還沒有超限利用。然而，只消政府一賣地，人進來！不管是不是保護區、或者保安林，以現在山林管理的無政府狀態，出售形同棄守！高屏溪沿岸的山林就是在超限利用的情況下，山崩水解！而當中誰是第一名禍首呢？</span><span>&nbsp;&nbsp;</span></span></p>\n<p><span><span><br></span></span></p>\n<p><span><span>在</span><span>2008</span><span>年底高雄市民間團體與市府連袂召開「柴山論壇」，決定將無爭議的地段劃入自然公園用地，積極保護遏止開發；此地區有部份土地亦在其中，這個決策中央也列席參與，知道此事；未料在此時，中央竟然急急出手，要賣出大片山坡地！這到底是何居心？無法理解在這個時局，政府竟還大開濫墾濫伐的大門！</span><span>&nbsp;&nbsp;</span></span></p>\n<p><span><span><br></span></span></p>\n<p><span><span>在此敏感時刻，這樣的離譜山林販售決定，一旦惹來眾怒，都可能成為政府壓倒駱駝的最後一根稻草！我們懇切呼籲，</span><span>1.</span><span>請政府懸崖勒馬停止出賣柴山，也請高市府拿出氣魄，向中央喊話，要求中央收回賣地成命，放過柴山！</span><span>2.</span><span>同時也請中央正視山林超限利用問題所在，柴山屬生態地質敏感區，中央政府須通盤考量，決策不應草率。將台灣無論大山、小山，基於國體保安考量列出脆弱、危險、敏感地帶，禁止出售，並提出積極保護的行動，遏止類似悲劇再度發生！</span></span></p>\n<p>&nbsp;</p>\n<p><span><span>誠邀請您(個人或團體)加入<a href=\"http://campaign.tw-npo.org/campaign///sign.php?id=2009082123130900%20\">聲援的行列！</a><br></span><span><span>&nbsp;</span><span>&nbsp;</span></span></span></p>\n<p><span><span>共同發起單位：高雄市柴山會、高雄市綠色協會、地球公民協會…</span><span>(</span><span>邀集中</span><span>)</span></span></p>\n<p><span><span><br></span></span></p>\n<p><span><span>個人聲援<span>：</span><span> </span></span></span></p>\n<p><span><span>聯絡電話：</span><span>07-2815348 ；07-2815348</span><span>楊娉育</span></span></p>\n<p><span><span><br></span></span></p>\n<p><span><span>e-mail<span>：<a href=\"mailto:takao.hill@msa.hinet.net\">takao.hill@msa.hinet.net</a></span></span></span></p>\n<p>&nbsp;</p>\n<p><span><span><span><br></span></span></span></p>\n<p><span><span>附註：原公告標售的三筆柴山土地</span><span> 及面積</span></span></p>\n<p><span></span></p>\n<p>1.<span>高雄市鼓山區壽山段69地號&nbsp;&nbsp;&nbsp;  <span>309210.00</span><span>平方公尺&nbsp;&nbsp;&nbsp;&nbsp;保護區全部&nbsp;&nbsp;</span> <br></span></p>\n<p><span></span></p>\n<p><span><span>2.高雄市鼓山區壽山段74地號</span><span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span>34960.00</span><span>平方公尺&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 保護區全部</span></span> </span></p>\n<p>&nbsp;<span>3.</span><span><span>高雄市鼓山區壽山段74-2地號&nbsp;&nbsp; </span><span>67910.00</span></span><span><span>平方公尺&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><span>&nbsp;保護區全部</span>&nbsp;</span></p>\n<p>&nbsp;</p>\n<p><span><span><strong>消息見報後,國有財產局公告數字馬上變了:<br></strong><br></span><span>1.<span>高雄市鼓山區壽山段69地號&nbsp;&nbsp;&nbsp; 2754.71&nbsp;<span>平方公尺&nbsp;&nbsp;&nbsp;&nbsp;保護區全部&nbsp;&nbsp;</span></span></span></span><span> <br></span></p>\n<p><span><span></span></span></p>\n<p><span><span><span>2.高雄市鼓山區壽山段74地號&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;  <span>322 </span><span>平方公尺&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 保護區全部</span> </span></span></span></p>\n<p><span><span>&nbsp;3.<span>高雄市鼓山區壽山段74-2地號&nbsp;&nbsp; 3600</span><span>.00</span><span>平方公尺&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;保護區全部 </span></span></span></p>\n<p><span><span><span><br></span></span></span></p>\n<p><span><span><span><span>此文來源出處於：</span><a href=\"http://www.wretch.cc/blog/takaohill%20%20\">高雄市柴山會</a><br></span></span></span></p>\n<p></p>\n<p></p>"}, {"nid": 575, "title": "2009年8月18日，梅山鄉只見檳榔與茶樹", "original_topic": "山坡地不當開發", "adopted_cats": ["森林守護與林業改革"], "content": "<p><img alt height=\"339\" src=\"/sites/cet-taiwan.org/files/090901-003.jpg\" width=\"660\" loading=\"lazy\"></p>\n<p>文/圖☉楊俊朗 2009.8.18</p>\n<p>時間：2009年8月18日</p>\n<p>現勘人員：楊俊朗，何俊彥</p>\n<p>現勘地點：梅山鄉</p>\n<p>1. 嘉義縣梅山鄉瑞峰、瑞里等風景區，一直是嚮往的景點，想不到第一次成行卻是勘災。8月14日和俊彥同行前往梅山鄉，國道3號下梅山交流道，進入梅山市區轉162甲縣道，經過36彎的檳榔林抵達太平，農作物轉變成茶樹，納悶如此單調的植被景觀，怎麼吸引遊客？或者大部分遊客只要見綠就okay？</p>\n<p>&nbsp;</p>\n<p><img alt height=\"291\" src=\"/sites/cet-taiwan.org/files/814-1.jpg\" width=\"388\" loading=\"lazy\"></p>\n<p>太平不是災區，但是土地開發十分徹底。</p>\n<p>&nbsp;</p>\n<p>2. 162甲縣道過太平約1.5公里右轉嘉154縣道，嘉154縣道6公里處走山嚴重，三棟民房損毀，所幸沒有人員傷亡。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"293\" src=\"/sites/cet-taiwan.org/files/814-2.jpg\" width=\"390\" loading=\"lazy\"></p>\n<p><img alt height=\"291\" src=\"/sites/cet-taiwan.org/files/814-3.jpg\" width=\"390\" loading=\"lazy\"></p>\n<p><img alt height=\"292\" src=\"/sites/cet-taiwan.org/files/814-4.jpg\" width=\"390\" loading=\"lazy\"></p>\n<p>&nbsp;</p>\n<p>3. 162甲縣道的瑞峰橋護欄部分被沖毀，未被沖毀也卡住漂流木，顯示當時河水高度一定超過橋面。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"302\" src=\"/sites/cet-taiwan.org/files/814-5.jpg\" width=\"387\" loading=\"lazy\"></p>"}, {"nid": 582, "title": "2009年8月17日，甲仙鄉小林村的狀況", "original_topic": "山林水土", "adopted_cats": ["氣候變遷與調適", "森林守護與林業改革"], "content": "<p>時間：20
