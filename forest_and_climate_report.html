「氣候變遷」，但是近幾年普遍認為氣候變遷用詞過於中性，無法真實呈現氣候的狀況，所以改用「氣候緊急」或是「氣候緊急狀態」提醒世人這個問題的嚴重性。&nbsp;</p>\n<p>2023年1月10日三讀通過《溫室氣體減量與管理法》修正草案，正式更名為《氣候變遷因應法》，最重要的是明定溫室氣體長期減量目標，2050年必須達成淨零排放。入法意味著擁有法律的拘束力，明定的政策目標，同時也將過去台灣社會爭論已久的淨零目標與時程議題畫上句號，接下來，全台灣的任務，就是共同達成2050淨零碳排目標。&nbsp;</p>\n<p>針對氣候緊急的新聞，像是地球變遷升溫導致的狀態，冰河的退縮、氣溫的上升、海平面的上升、冰層的縮小、海洋升溫、海洋酸化等，從全球到在地的整體氣候，生態環境的變動事件對於各位而言早已不陌生，花蓮在地農民已深刻感受到氣候緊急對於農業的影響。&nbsp;</p>\n<p>&nbsp;<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u399/20230202%20%281%29.JPG\"></p>\n<p>地球升溫1.5℃&nbsp;</p>\n<p>接下來分享氣候緊急下的重要數字，在2020年時全球增溫達1.2±0.1℃，增溫是進行式並非未來式。假訂我們希望能將全球升溫控制不得超過1.5℃，估計全球僅剩的碳預算不到8年，這也代表這時間緊急與任務的艱鉅。2018年全球氣候科學家呈現在相關論文中的數據，工業革命開始人類大規模的排放溫室氣體，未來地球極有可能會往溫度更高的模式移動，超越預設的界線之後，將使地球到達高溫狀態，但是溫度會有多高，目前仍是未知數。所以，我們要盡力的不讓地球升溫幅度超過某個臨界點，在科學界目前有共識的界線值為1.5℃。&nbsp;</p>\n<p>地球溫度超過1.5℃時會造成許多連鎖效應，例如像是北極冰層的永凍層，因為增溫開始融解，釋放出大量甲烷，甲烷是極強度的溫室氣體，導致地球進一步的增溫，導致冰層融化情況更嚴重，另外極端熱浪、極端降雨、農業跟生態系統的乾旱等現象的出現頻率將會大幅度增加。我們稱此現象為正回饋，口語的形容詞是指惡性循環、壞上加壞。&nbsp;</p>\n<p>總之，全球訂定2050淨零排放的目標是希望可以控制地球升溫，維持在1.5℃以內。1.5℃的目標是科學家利用許多模型去推估出來的共識，這個數值在未來也許會被推翻，但是不變的是我們必須盡力去控制升溫幅度。&nbsp;</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u399/20230202%20%282%29.JPG\"></p>\n<p>再生能源是轉型關鍵&nbsp;</p>\n<p>政府間氣候變遷專門委員會（簡稱IPCC）第六次評估報告（簡稱AR6）所描繪出的幾種可能預測，在不同情境時全球的排碳路徑，像是在現行政策下，我們沒有做出其他應對措施，因此在2100年的時候，化石燃料的使用量增高，碳排放量也會越來越高。逐步減量等方案像是以再生能源為主，或是抑制整體經濟的需求，或是讓經濟有典範轉移，改變整個社會的經濟模式的話，或許我們能加快速度將溫室氣體的排放數值壓到合理的範圍之內。&nbsp;</p>\n<p>全球因空污致死人數相當高，假設將化石燃料能源系統替換成再生能源系統，全球空汙問題將能有效改善。在台灣空汙議題也相當嚴重，因此達成淨零的同時，也能解決空汙的問題。另外，能源支出佔據所得的比例，也將因為再生能源持續下降，近年來再生能源的成本逐年降低，而化石燃料因為戰爭等因素成本節節升高，可預期化石燃料的成本在未來將越來越昂貴。&nbsp;</p>\n<p>其中有個關鍵就是，任何方案都是需要仰賴「再生能源」，足夠多的再生能源才能將碳排數值壓制到合理範圍內。因此任何淨零轉型的方案裡面，能源轉型必定是最軸心的工作，如果能源未轉型是無法達成2050所訂定的目標的，但許多台灣人還沒意識到能源轉型所扮演的核心角色。&nbsp;</p>\n<p>2050年之前各階段要達成的短期目標，像是2040採行淨零翻修的舊建築物達到一半、全球電力系統達到淨零等，看路徑關鍵里程碑中可以發現各項措施，背後還是涉及到能源轉型，也就是說無碳的能源必須取代既有的能源，否則多數設立的目標將無法達成。電力系統的去碳化策略中，電力系統與能源系統為高度相關，兩者可視為一體，以全球能源來源來看，截止2020年所主要使用化石燃料，到2050年時要轉為以再生能源為主，中間有段過渡期是需要天然氣的輔助，在台灣也歷經相同的過程。&nbsp;</p>\n<p>前十大的產煤大國都紛紛宣布要達成淨零碳排的目標，儼然成為國際間主流的共識，國際壓力回過頭來影響台灣。淨零是無悔的選擇，我們努力去減碳，目標對於大家而言的是好的，然而過程的確需要付出許多代價。&nbsp;</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u399/20230202%20%283%29.JPG\">&nbsp;</p>\n<p>臺灣的氣候風險與碳排放量&nbsp;</p>\n<p>台灣面臨的氣候風險相比其他國家來的高，不管是從增溫的角度，或是因為增溫造成的在環境或經濟層面的損失。試想台北盆地或是西南沿海地區，因海平面上升所造成的損失將會多嚴重，且根據穆迪分析(Moody's Analytics)評估台灣為高氣候風險國，颱風與海平面上升風險名列全球前五名。在暖化趨勢中，台灣在2020年時已增溫2℃，是超越全球平均值的，如果台灣不積極處理，在這個世紀末，年輕人將面對更高幅度增溫的台灣，未來如何將是難以想像，這不應該是我們要面對的台灣。&nbsp;</p>\n<p>台灣溫室氣體排放從1990年到2006的時候是持續快速增加的，接下來幾年相對平穩，目前處在溫室氣體排放的巔峰期，必須盡快減少排放量。&nbsp;</p>\n<p>臺灣排放的溫室氣體最大宗是工業系統49.5%，而住僅佔了11%，所以並不是只要在自家屋頂裝光電板達到碳中和問題就解決了，即使每戶都達到碳中和的目標，也只解決了11%的問題。另外運輸、商業部門和占比最多的工業部門，都是今天我們所有生活方式的背後基礎，就像我們不能說醫院的碳排不能算在我身上，台灣的基礎設施皆是公民要共同承擔的，我們無法切割這些溫室氣體排放。&nbsp;</p>\n<p>接著我們更加細部去區分各產業會發現，煉油業與石化業佔據最高19％、鋼鐵13％、農業與住商23％。在學術上我們稱石化、鋼鐵、水泥、貨運、航空與海運為全球六大難減部門，這六大部門在台灣占比39%，排放量很大但是要減也很難，因為目前尚未找尋到適合的取代能源。&nbsp;</p>\n<p>從個別公司的角度來看，2019的資料顯示，台朔石化10.6％、中國鋼鐵8.3％等，從數據來看，將外部成本與各公司每年的淨利做比較，幾乎是持平甚至是超過的，也就是說我們考慮外部成本的話，這些公司基本上是不賺錢的。然而，產業轉型可能會需要縮減規模，會涉及到許多就業與產業的脈動，石化鋼鐵業將是台灣淨零碳排時的重大挑戰。&nbsp;</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u399/20230202%20%284%29.JPG\">&nbsp;</p>\n<p>淨零轉型之路&nbsp;</p>\n<p>這幾年淨零轉型開始進入台灣視野，國發會在去年公布2050淨零排放路徑，以及氣候變遷因應法的修法。台灣社會對淨零原本很陌生，在這一兩年之間大家突然知道這件事情，並讓它進入主流社會議程，有很多原因，其中台灣發生的極端氣候事件，2020年的歷史高溫、2020年與2021年的缺水危機，另外國際公約低碳要求，歐盟徵收碳關稅，蘋果、聯合利華、沃旭等企業追求碳中和供應鏈，因此企業界在淨零領域相當活躍。以及來自國內的青年世代的高度關注、空汙議題都是源自國內的社會壓力。在外交部分，台灣特殊的國際處境，我們也需要考量國際外交的壓力。在各式各樣的因素下，台灣正式開始面對淨零碳排。&nbsp;</p>\n<p>根據學界所發表評估台灣2050達成淨零排放的路徑，從2020年到2050年間將各部門的溫室氣體排放逐步的壓到趨近於零，這中間有四大關鍵。第一、能源效率提升，能源密集度(每生產一塊錢的國民所得所耗用的能源)要往下降低54%，這意味著整體能源效率要加速提升。第二、電氣化，運輸系統要高度電動化，從現在的2.6%要提升到81.9%，意味著未來我們所使用的摩托車、汽車與大眾運輸系統都會越來越電動化，並改變電動車與油電車的占比。第三、電力系統的零碳化，改變電力系統中的再生能源佔比，從5.4％到90％。第四、碳捕集與負排碳技術，利用碳匯與負排碳技術移除碳，增加自然碳匯，目前森林碳匯仍是學術上的討論熱門議題，地球公民也曾辦理過<a href=\"https://www.cet-taiwan.org/info/story/4187\">種樹造林，可以為台灣增加多少森林碳匯？</a>的森林碳匯講座，但這部分在學術上還有很多討論空間。在未來，光電跟風電要佔整個系統的絕大部分才有辦法讓整個系統接近零碳化，且還沒有百分之百的低碳化，都彰顯再生能源在這中間扮演的重要性。&nbsp;</p>\n<p>除了解決氣候問題，淨零碳排對於台灣跟全球都有共同效益，包括能源安全、綠色投資與就業、產業轉型與公共健康。台灣能源自給率由現在的2％提升到53％，無須過度依賴進口能源，維持能源安全，淨零碳排帶動許多綠色投資與就業的機會，風力與光電可創造約6兆的投資，並增加就業機會。產業轉型的好處是讓台灣從高污染轉為相對低污染的產業型態，傳統的煉油業與石化業規模須縮減，如何達成公正轉型的產業轉型，這將是另外龐大的議題，國科會正在動員學術界共同探討。公共衛生學界多年累積的數據顯示，台灣每年因石化燃料衍生的健康成本相當於GDP的2.6％，這也代表我們如果成功達成淨零轉型，將有利於台灣的公共環境與健康。&nbsp;</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u399/20230202%20%285%29.JPG\">&nbsp;</p>\n<p>台灣面臨的巨大挑戰&nbsp;</p>\n<p>戴興盛教授多年與民眾討論的經驗中發現，多數民眾對於台灣的能源供需狀況是不理解的。以經濟部能源統計年報(2021)數據呈現，煤30.78％、天然氣43.39％，可見化石燃料是台灣能源占比最高，直至今日仍是如此。整體再生能源只佔能源總供給的2.13％。也就是說台灣要將再生能源取代化石燃料，距離仍是相當遙遠與艱鉅的，然而這件知識的不普及，導致民眾對於再生能源的土地利用議題提出質疑，並輕忽達成能源轉型的困難度，不是隨手關燈或自宅裝設光電板就可以解決的，所以大家需要明白能源轉型路上仍有很大的挑戰。&nbsp;</p>\n<p>為了彰顯這些事實，戴教授做了簡單的評估。情境設定在2050年能源總供給降為2021年的80％，為了滿足到時候的能源需求，我們需要建置的再生能源樣態分成三個情境：&nbsp;</p>\n<p>相對積極發展國內再生能源 情境一：&nbsp;</p>\n<p>10%光電+20%風電+10%其他再生能源+60%進口無碳能源或50%進口無碳能源+10%化石能源。目前97%的進口煤跟石油日後要變成60%無碳能源從國外進口，但無碳能源綠氫在技術上雖然有，商業上尚未成熟，若國際市場競爭綠氫不一定搶的到，台灣當然可以指望進口綠氫，但要注意市場與政治風險，若再生能源占比越高就可以降低購買不到綠氫的風險，因為綠氫目前還是未知數。其他重要再生能源可能是地熱，而最後剩餘需使用的化石能源再透過森林等各類碳匯抵減碳排。&nbsp;</p>\n<p>相對積極發展國內再生能源 情境二：&nbsp;</p>\n<p>15%光電+15%風電+10%其他再生能源+60%進口無碳能源或50%進口無碳能源+10%化石能源。差別僅在光電多一些、風電少一些，但光電多，陸地的土地耗用就會增加，台灣海峽風電就有機會可以少一些。&nbsp;</p>\n<p>非常積極發展國內再生能源 情境三：&nbsp;</p>\n<p>20%光電+20%風電+10%其他再生能源+50%進口無碳能源或40%進口無碳能源+10%化石能源，進口能源就可以從60%降到50%，但107GW的光電意味著10萬700公頃的土地，光電目前是9.25GW是11倍，46GW的風電意味著台灣海峽設置離岸風機的地方會比現在多很多，2022年11月最新裝置容量目前是1.5GW大部分是陸地，但也可以發現離岸風電陸續加入，這樣大規模的再生能源台灣社會可能無法接受。&nbsp;</p>\n<p>政府去年內部評估的其中一種情境為：光電會到70.9GW，離岸風電加陸域風電40.2GW，其他類型再生能源佔日後的百分比還是不高，唯一可能衝較高的是地熱，可以看見這個數字意味著2050年的時候台灣的再生能源佔發電電力結構78.3%，佔整體能源是34.8%。再生能源在這個情境下面可以提供35%，其他就必須透過進口無碳或是化石燃料，政府評估日後可以透過進口無碳燃料(綠氫)和碳中和天然氣加上一些傳統的能源。&nbsp;</p>\n<p>整體而言跟我的簡略評估非常接近，所需要的風電跟光電差不多就是這個數字，需要依照到時候台灣的實際狀況尤其是台灣的社會接受度來調整。35％自產能源搭配65％的進口能源，大概是台灣目前較為合理的情境，其他任何調整所面臨的挑戰度都很艱鉅。&nbsp;</p>\n<p>其中一個很重要概念是身處環境界要考量的，綠氫在生產過程中所產生的環境成本，綠氫是在其他國家生產，我們台灣若不願意生產，等於是我們將能源生產所產出環境成本轉移給其他國家，雖然是低碳能源，但在當地依然用有環境跟社會成本。在台灣淨零路徑下的燃煤、天然氣、再生能源供給量變化趨勢，目前已煤跟天然氣為主，天然氣在過渡期占比高，然後等到再生能源佔比上升，直到2050年時，煤與天然氣佔比會下降。&nbsp;</p>\n<p>對花東，這代表甚麼？&nbsp;</p>\n<p>戴興盛教授認為，若未來政策共識再生能源期待達到35%，進口65%，在全臺灣綜合評估公平分攤的前提下，戴老師估計花蓮需要建置2.415GW的光電，或是等量的其他形式低、零碳能源，2.415GW也就是相對2415公頃，相較於一個花蓮市的面積（2945公頃），這不是一個小數字。而平分在花蓮13個鄉鎮市的話，每個鄉鎮市則需要分擔186公頃的面積去做光電(或等量的其他形式再生能源)，但像是秀林、卓溪大部分都是山區，縱谷平原地區大多也都有各類限制，根本不太可能有這樣的土地去進行建置。根據2021年經濟部能源統計年報，再生能源只佔總百分比的2.13，距離2050年淨零的35%除了還有很大一段差距外，也代表花蓮未來更重要的是如何在有限的土地以及資源下做出更好的土地使用配置，以兼顧農業、保育、及再生能源目標。&nbsp;</p>\n<p>以長時間尺度看花蓮的不同社會經濟階段，可以分為低化石燃料社會（1960年代之前）、高化石燃料社會（1970年代至今）和未來零碳社會。過去低化石燃料社會以排碳角度去看確實不錯，但這期間花東地區森林大量被砍伐。而臺灣隨著經濟發展，生活型態的改變，漸漸以化石燃料去取代林業的資源，再加上糧食生產率下降和國際環保意識崛起，花蓮原本的農田變成次生林和平地造林，樹變得更多了，花蓮變得更美了，但同時等於把糧食和能源生產的工作轉移到國外。&nbsp;</p>\n<p>在這歷史脈絡下，花蓮從1980年代起的環境運動都是圍繞在高化石燃料社會底下，反TDI，反牛山的燃煤電廠、反蘇花高、反美麗灣、花東發展條例、193縣道等，當時產業東移，也落腳到花蓮。當時也有「寧願高爾夫場，不要重污染工廠」的聲音。這些運動的前提就是捍衛我們熟悉的花蓮，抵制高汙染的開發行為。&nbsp;</p>\n<p>這也意謂花蓮日後要面對永續、能源轉型、淨零必須要有全新看事情的角度，無法再用高化石燃料社會中單純抵制開發的價值去邁向零碳社會。未來公民要具備整體思考能力，去了解現況，在淨零轉型的目標下，想辦法符合環境正義、社會友善、經濟等考量，共同找到臺灣建置再生能源的模式。&nbsp;</p>\n<p>轉型的必要&nbsp;</p>\n<p>我們可能多多少少有疑惑，也不能避免在轉型過程中衍伸出更多的問題，但淨零是必走的路，不可能一直停留在現今高化石燃料社會當中。維持現狀並非環境友善，能源轉型並非一路順遂。淨零是複雜的，需要通盤的合作。&nbsp;</p>\n<p>我們需要的公民是環境與社會友善的、具整體思考、了解現實狀況、且積極投入淨零轉型的問題解決者，能把淨零轉型的成本公正承擔、並把益處轉化為全體社會共享者。這些困難與挑戰，需要更多人攜手去合作，不論是政府、公民社會、民間團體和產業界，要在有限的資源內投入不同的觀點，在這之中找出比較合理的發展。在未來的三十年當中，花蓮將會有極大的變化，對問題的討論不能只停留在理念和想像，而是應該動手去理解現狀與推動改變。&nbsp;</p>\n<p>我們的確有解方，但須積極去面對問題，一步步動手解決問題，僅是抗拒轉型與抱怨不會解決問題。&nbsp;</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u399/20220202-2.JPG\"></p>\n<p>&nbsp;</p>\n<p>Q&amp;A提問與回應&nbsp;</p>\n<p><strong>Q1：是否可以簡述目前負排碳技術的發展呢？以及台灣目前應用現況。負排碳技術是否來的及參與到目前淨零的時間進程中？&nbsp;</strong><br>\n<p>A1：負排碳技術工程技術有進展但尚未成熟，大規模商業化十分昂貴，國際跟台灣狀況一樣，但台灣最大挑戰在於固定下來的碳的去處，固碳儲存場的場址位置。&nbsp;</p></p>\n<p><strong>Q2：全球淨零碳排路徑所提出的負碳排，是什麼意思？</strong>&nbsp;<br>\n<p>A2：負碳排的這張圖表中縱軸是能源消耗，指的是依舊使用化石燃料，但是利用技術移除排出的碳&nbsp;</p></p>\n<p><strong>Q3：談到風險，風電插在台海，是否也會有較高的地緣政治風險？風電未來是否有其他風險相對較低的場址？</strong><br>\n<p>A3：從絕對值來講未來再生能源有風電跟光電，且風電佔比較高，背後的風險是離岸風電是大型集中發電設施，光電相較下是分散的發電設施，個人希望未來台灣是較分散、去中心化的能源系統，若我們社會共同決定再生能源集中在台灣海峽的風力發電，就要承擔被攻擊的風險。&nbsp;</p></p>\n<p><strong>Q4：在缺乏儲能技術的目前局面台灣是否必須要與中國串接電網調度，以防時常缺電的問題？</strong><br>\n<p>A4：跨國之間可以電力傳輸，例如新加坡規劃建海底電纜從西澳洲通到新加坡，進口低碳電力，但在台灣海峽間因為政治考慮不太可能發生。&nbsp;</p></p>\n<p><strong>Q5：花東土地利用綠電的方式，光電跟地熱與土地面積的關係？如何進行才能將綠電和減碳進最到大化？&nbsp;</strong><br>\n<p>A5：農業用地、保育用地、再生能源用地，這三種用地是國家以及社會各界需要去重視的。現今相較過去，多出一個再生能源的用地需求，同時也意味著臺灣既有的土地利用必須做出權衡，這是一個很大的挑戰。在這之前也提到，我們可以把這些生產（能源/糧食等）的工作都交給國外，但這對於國家安全、環境、社會正義都不是一個好的作法，總之我認為我們台灣應該想辦法產出至少百分之三十五的再生能源，再加上百分之三十到四十的糧食自給率和合理的生態保育用地。這有可能嗎？有些人抱持著零和競賽的觀念，認為這邊多一些，另一邊就會少一些，而我認為若有足夠嚴謹的學術研究、公共政策討論以及社會對話，這三項目標是有機會同時達成的。&nbsp;</p></p>\n<p>以平地造林為例，多數民眾不知道平地造林並不是一個那麼有系統的政策，它其實是因應臺灣加入WTO後，有大量農業廢耕土地，所以在很快速的時間提出的策略，並開始在臺灣農業用地造林。而現今價值判斷下多數認為不該對森林去做更動，但重點不僅在於森林數量，更在於在森林的配置(它們坐落在哪裡)。我們可以去思考，花蓮很多平地造林因生長在河床地，造成生長不良的現象，哪裡造林可以產生更大效益，比如說同樣面積的平地造林，是該放在本來就很多森林的花蓮，還是其他缺乏森林的西部地區？配置在不同地區，它對於臺灣社會和環境生態的意義是不一樣的，所以我們應該更細緻的去判斷土地的配置以及利用，才能同時達成上述的三個目標。依我之前在大農大富平地森林的研究經驗當中，大家要的都是一個全有全無的答案，要不全部都是森林，要不全部多是農地，而我發現比較理想的做法是，大農大富有1250公頃，我們大可以保有部分平地造林，其餘的部分規劃林下經濟、育樂、農業等用途，也就是我們其實可以兼顧多種目標，滿足不同權益關係人對環境、經濟、社會面向的不同需求。我以這個例子說明，在沒有經過足夠研究與社會討論之前，其實沒辦法給社會大眾一個有證據基礎的數字和答案，這議題需要在未來三十年花蓮和整個臺灣共同去面對、討論和協調。&nbsp;</p>\n<p><h2>&nbsp;</h2></p>\n<p><h2>蔡中岳顧問補充回應</h2></p>\n<p><strong>Q1：是否可以簡述目前負排碳技術的發展呢？以及台灣目前應用現況。負排碳技術是否來的及參與到目前淨零的時間進程中？&nbsp;</strong><br>\n<p>A：目前我國有自然碳匯(森林、土壤)等發展，同時也在海洋裡有相關研究，科技上則是以碳捕捉、封存與碳再利用為主。目前台灣現有的技術與未來發展趨勢，可以國發會一月公布的<a href=\"https://www.ndc.gov.tw/Content_List.aspx?n=6BA5CC3D71A1BF6F\">淨零十二項關鍵戰略</a>中，第六項跟第九項來理解。台灣跟世界主流國家類似，都期待透過科技在2040年後有大幅進展，達成淨零的目標。但在這之前，除了研發外，仍需要把現況技術能做的努力率先進行。</p></p>\n<p><strong>Q3：</strong></p>\n<p>\t<strong> 談到風險，風電插在台海，是否也會有較高的地緣政治風險？風電未來是否有其他風險相對較低的場址？</strong><br>\n<p>A：依現代戰爭觀點，精準打擊到西海岸的任何電廠的困難度相近，且還有電網議題。若是戰時的非常狀態，則更依賴分散式的小區域電網跟自主發電系統。</p></p>\n<p><strong>Q4：在缺乏儲能技術的目前局面台灣是否必須要與中國串接電網調度 來以防時常缺電的問題？</strong><br>\n<p>A：</p></p>\n<p>\t我國在過去儲能的發展並非主流，主要是因為傳統電廠的使用，不太需要儲能技術來搭配使用，但在未來再生能源優先入網的電力規劃中，將白天多餘的太陽光電、有風時的多餘風電儲存下來，加上精準的氣象預報，都是再生能源利用的關鍵。<br>\n<p>跟中國借電撇除政治問題，首先要處理跨國電纜的問題，台灣屬孤島型電網，除了地理上鄰近中國的金門、馬祖外，海底電纜要拉過來都成本不少，且就能源自主的觀點，仍需要有自有電力來支應需求，目前不支持與中國借電的任何計畫。</p></p>\n<p><strong>Q：請問核能在這波淨零的國際趨勢風潮中扮演的角色？是否有可能會因為淨零的目的而再度成為能源主流考量</strong>&nbsp;&nbsp;<br>\n<p>A：核能擁有發電過程中，若無意外不會產生碳排的特性；但在其原料鈾礦的開採上，仍會有不少碳排發生，且在使用後的核廢料處理，目前在全球除了長期存放外也無較好的方式，所以仍是相當爭議的能源。在歐盟的長期爭辯中，反核/擁核的國家始終不同調，去年將天然氣與核電同列為可投資的減碳能源，也是多年角力的結果。但沒有人會認為化石燃料的天然氣叫綠能，核電與其同列就清楚知道，這都是過渡時期的選項而非最終解方。目前在研發中的新式SNR機組或核融合的技術，都是少數投資者正在努力的方向，但約二十年前就不斷有消息傳出這類核電即將可使用，但至今仍在研發中，就知道研發的艱困。 且核電仍有區域間不同的議題，以台灣為例，地狹人稠的小島不易找到核電廠設廠、核廢料存放的地方，再加上位於環太平洋地震帶，無論發生意外的機率及發生造成的影響都遠大於其他國家，現有核電機組在2025年都到了40年使用期限到期，如期將既有核電除役，但同時關注新核電的發展，但不躁進應是台灣現有的方向。</p></p>\n<p><strong>Q：</strong></p>\n<p>\t<strong> 想請教戴老師一個很不專業的問題，前幾天有個關於核融合突破瓶頸的新聞，我們是有可能指望核融合當作無碳/低碳能源的嗎?</strong><br>\n<p>A：</p></p>\n<p>\t核融合確實是目前少數國家在研發的發電方式，事實上這類的研究已經超過20年，時不時會有技術突破的新聞，但距離核融合能夠看見商轉，也就是符合成本的發電，目前看不到跡象，縱使是對核融合發電較樂觀的專家，也表示十年內是不可能的。照目前核融合的發展，確實是有機會用小機組維持一定的發電量，同時核廢料的問題也較小，但因為時程遙遠，台灣研發技術不足，或許等其他國家成熟後再來討論台灣是否適用，會更加有意義。我們要達到2050年淨零，一定會需要有更多的科技研發來搭配，但也不可能是到了2050年突然技術都到位，所以此刻的能源轉行得持續進行，關注技術發展，妥善評估，將會是教好的策略。</p>\n<p><strong>Q：謝謝老師的介紹，原來台灣能源轉型的路徑可謝謝老師的介紹，原來台灣能源轉型的路徑可以有很多種，而且主力應是增加再生能源的比例，為何過去我們談減碳的方案總是圍繞在重啟核電一個選項?以有很多種，而且主力應是增加再生能源的比例，為何過去我們談減碳的方案總是圍繞在重啟核電一個選項?</strong><br>\n<p>A：</p></p>\n<p>\t僅提供個人觀點。台灣民主發展的進程中，反核運動與民主運動鑲嵌甚深，在民主化的過程中，核能啟用與否在台灣擁有強烈的政治色彩。所以在核電的討論中，不容易單純就其特質討論，或多或少參雜著意識形態來認同。另一方面，核能確實也是全世界爭論的能源，過往核能與核武的發展鑲嵌，也成為冷戰過程中不同勢力競逐的焦點，所以在全球也有較大的爭論。在台灣核電爭論的過程中，占整體發電比例從20%一路下降到現在約8%左右，但仍然有不成比例的討論聲量，是歷史因素也是國際趨勢。已經發生的爭論不可逆，只能期待未來能夠有更多理性討論能源特性的機會。</p>\n<p><strong>Q：對於目前火力發電過半的局面要怎麼發展才能淨零碳排呢</strong><br>\n<p>A：台灣過去確實高度依賴火力發電，但同樣是火力發電，燃煤與燃氣對於碳排放仍有兩倍差距，而全球為了加速減碳的效果，大抵上也是以天然氣發電做為過渡能源，甚至預估在2030年前天然氣發電量都會成長。但若能抑制用電量，同時加速再生能源的發展，肯定在減碳上會有具體成效。不過值得注意的是，目前我國2050淨零碳排的戰略中，在2050年預估再生能源比例約85%左右，另外是要以天然氣+負碳技術來達到淨零，所以未來的關鍵還是在能源比例的搭配。</p></p>\n<p><strong>Q：</strong></p>\n<p>\t<strong> 綠氫是氫氣 那用氫氣會不會爆炸</strong><br>\n<p>A：</p></p>\n<p>\t氫氣確實有爆炸的風險，但任何能源設施都有其風險，同樣的，做好安全規劃、定期檢查，都會是降低風險的要件。合理的使用都不應該發生這些風險，但風險也是要納入評估的重要因子，同時也可思考不同能源發生意外後的影響，太陽能板會被吹飛、天然氣管線會洩漏、氫氣會爆炸、輻射會外洩，每種風險發生時要恢復的成本也不同，也會是我們在決定能源配比與選擇的關鍵。</p>\n<p><strong>Q：如何在2050年再生能源從現在2.13%增至70%以上?石化業縮減30%，排碳前10名大戶一定跳腳，政府擋得住嗎?除了國際壓力外，政府有何政策法規壓力或誘因可達成目標?政府會真的拿排碳大戶開刀嗎?</strong><br>\n<p>A：再生能源發電在2022年占整體發電的8.3%，當然距離未來的70%以上還有遙遠的距離，但無論是技術端讓發電效率提升，空間規劃端找出更多可行的機會，都得持續進行。在轉型過程中，碳排大戶肯定是要優先處理的，這些大戶的減碳要求，不見得是政府政策，更多是來自於供應鏈上遊的政策，所以簽署RE100，大量使用再生能源目前是商業上整體趨勢，過往減碳用綠能是愛地球，但此時更是拼經濟的象徵。在政府政策跟商業競爭下，是近年來減碳的契機。政府對於碳排大戶的諸多政策仍趨保守，不敢有太多積極的政策，所以督促政府政策也會是公民、環保團體的責任，當全民都意識到減碳的重要時，或許就更有機會來要求與達成。</p></p>\n<p><strong>Q：</strong></p>\n<p>\t<strong> 為了綠能 東部要砍多少森林才能達成遠大的綠能目標呢</strong><br>\n<p>A：這樣的問題較難直接回應，演講中有提到各種不同的情境，加上森林也有分不同區位與林相，所以如何達成減碳與生態系統的維持，會需要各種評估與計算，也要有土地空間的規劃，這是需要一起監督與想像的。</p></p>\n<p><strong>Q：近年在花蓮的觀察，花蓮的光電廠設置區域是相對零散的，是否會加劇棲地破碎化的問題呢，現行是否相關的研究去得知，光電板的集中設置或零散對於1.電力供給或設備管理方便度的好壞以及2.是否對整體生態系的影響，哪一個作法影響對於整體是較好的?3.是否有國家級的規劃在背後做整體規劃呢?</strong><br>\n<p>A：</p></p>\n<p>\t其實不僅花蓮，因為台灣土地政策在私有地取得的零碎，除了國家及少數國營企業(如台糖)，能夠擁有大面積土地的機會不多。就光電廠商而言，能夠在同一區域做大面積施作，無論就建設期程、饋線布建都較為節省成本，但受限於現有土地持有的狀態，要整合所有權人不易，所以產生了零散光電的狀態。但無論是零散或集中，都會造成現有生態系不同程度、類型的影響，基於這樣的現像，目前學界(如花蓮的東華大學)已經有各類型監測與研究，而國家也清楚意識到問題，目前由經濟部、農委會都有能源用地整體規劃的研究案與政策規劃在進行；而這也有賴公民團體的監督並給予第一線觀察的經驗，讓整體的空間規劃、生態系統與再生能源建置能夠有平衡的發展。</p>\n<p><strong>Q：</strong></p>\n<p>\t<strong> 這期商周報導比爾‧蓋茲的團隊正在打造花東地熱縱谷，地熱有可能超越光電和風電嗎？</strong><br>\n<p>A：花東縱谷確實是富含地熱潛力的地方，這些潛力區幾乎全部都在原住民族的傳統領域上。在淺層地熱的發展上，除了在技術端可以精進鑽鑿的技術外，更重要的是需要做社區溝通，如何與社區、部落發展共享利益，並且做有效的溝通，將會是能否順利發展的關鍵。另外深層地熱尚在研發階段，但也同樣需要完整及有效的社區溝通。以東部的特性而言，陸域風機並不合適，光電雖有潛力但也需要社區溝通，所以無論再生能源的選項，在花東縱谷的重點都是前期溝通必須馬上進行，才有辦法有效率的執行各種再生能源發展。</p></p>\n<p><strong>Q：</strong></p>\n<p>\t<strong> 想再請老師說明在花蓮發展地熱發電的可能與問題 謝謝</strong><br>\n<p>A：</p></p>\n<p>\t花東縱谷確實是富含地熱潛力的地方，這些潛力區幾乎全部都在原住民族的傳統領域上，在淺層地熱的發展上，除了在技術端可以精進鑽鑿的技術外，更重要的是需要做社區溝通，如何與社區、部落發展共享利益，並且做有效的溝通，將會是能否順利發展的關鍵。現有已在發電的地熱電廠中，台東金崙有一座，另外台東紅葉也正在搭配溫泉發展進行開發，花蓮紅葉雖然鑽探已完成，但因為沒有先期做部落溝通，地方政府不支持，所以發電廠陷入瓶頸，另外地熱尚無專法，也有法規需要調整的空間。但單就這項能源來說，確實是有基載且對環境影響較少的再生能源，值得更多投入與溝通。</p>\n<p>\n<p></p><p>\t<strong>Q：哪一種再生能源適用於台灣當中，或是透過技術上的精進，讓此再生能源能夠成為主流呢？</strong><br></p>\n<p>A：目前台灣的再生能源與世界主流接近，以太陽能與風力發電為主。太陽光電台灣擁有製造的技術，也有不錯的日照時數，是目前台灣再生能源最主要的發電來源，但受限於台灣空間有限，地面型光電需要找到更好的區位做發展。風力發電則以離岸風電為主，我們擁有全世界頂尖的風場，是適合台灣的再生能源，只是台灣西岸鄰近中國，未來在領海開發完後，是否有經濟海域可做風機，將會是能否擴大發電的關鍵。放眼未來，位處環太平洋地震帶上的台灣，擁有不少地熱潛能，目前全世界技術也逐漸成熟，在現有的溫泉區都有潛力。另外海島國家的海洋能也值得發展，尤其台灣東邊有黑潮，只是技術上尚未到達可商轉的程度，但是值得研發與投入的。</p></p>"}, {"nid": 4273, "title": "【講座側記】歐洲與台灣對話：氣候危機與淨零轉型〈論壇〉", "original_topic": "抗暖減碳", "adopted_cats": ["氣候變遷與調適", "完善能源政策"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20230105-20.jpg\"></p>\n<p>講者 |&nbsp;</p>\n<p><ul></p>\n<p><li>Martin Charter／英國創意藝術大學教授暨永續設計中心創辦人兼執行長</li></p>\n<p><li>鄭一青／英國永續創新實驗室共同創辦人兼總監</li></p>\n<p></ul></p>\n<p>與談 |&nbsp;</p>\n<p><ul></p>\n<p><li>邱花妹／國立中山大學社會學系副教授</li></p>\n<p><li>李根政／地球公民基金會執行長</li></p>\n<p></ul></p>\n<p>時間：2023/1/5(四) 19:00-21:30</p>\n<p>-------------------------------------------------------------------------<br>\n<p>面對氣候變遷的威脅，淨零轉型成為台灣近幾年的熱門議題，各種法案及政策改革也逐漸進入人們的視野、影響人們的生活。本次地球公民基金會與國立中山大學USR計畫「城市是一座共事館」，共同舉辦「歐洲與台灣對話：氣候危機與淨零轉型」論壇，邀請英國創意藝術大學永續設計中心的創辦人兼執行長Martin Chater，以及英國永續創新實驗室共同創辦人兼總監鄭一青，分享他們在歐洲的經驗。</p></p>\n<p>\t「這一個戰爭（烏俄戰爭）其實是一個石化能源的戰爭。」鄭一青開頭便以烏俄戰爭對歐洲能源政策的影響為例，說明淨零轉型牽涉眾多議題，而不只侷限在氣候變遷，其中一項便是提升能源供給的穩定。歐洲長期仰賴俄國石化資源，除了造成溫室氣體排放，也讓俄國把持自家能源供給。鄭一青便表示，戰爭使歐洲能源價格大漲，使各國加速淨零轉型及綠能發展，並設定近年內達到能源自主的目標，其中太陽能及風能具關鍵角色，因成本低廉，且能分散安裝於家戶、社區等人口密集區，若結合足夠的儲能及配電技術，便能成為可自給自足的穩定能源，並降低對石化能源的依賴。除此之外，歐洲也鼓勵企業全面使用自身所產的綠能，減少商品的碳排放與廢棄問題，以從源頭降低碳排放，其中包括從廢棄太陽能板回收原料並進行再製。</p>\n<p>\t但歐洲的能源淨零轉型也面臨許多問題，鄭一青指出，地區內部缺少太陽能板供應鏈，以及政府力道不足，是目前歐洲需面對的議題。前者為歐洲高度仰賴中國的太陽能板，而近幾年中國與歐洲的關係越來越不穩定；後者為歐洲各國，尤其是英國，對於各種建設皆具嚴格規範，使許多未具生態及景觀價值的廢棄土地，也不得設置大型太陽能及風力發電廠，另外儘管高昂電價已使民眾積極裝設太陽能板等發電設備，但政府並未對家戶使用綠電採取相關鼓勵措施。</p>\n<p>Charter也強調，各種各樣的危機、事件，都有可能促進對環境議題的討論，而改變需要社會所有部門的參與，其中社會大眾也扮演重要角色。Charter以循環經濟為例，說明產品的設計、製造、販售、使用、維修、廢棄處理，皆能為淨零轉型做出貢獻，其中，民眾作為消費者及公民能帶來許多改變，包括監督政府、企業以及轉變生活型態，例如Charter在英國參與的Farnham維修咖啡館，藉著民眾的維修技術與自願投入，成功修好將近1800件的物品，並減少5噸廢棄物及47.4噸的二氧化碳排放。</p>\n<p>\t最後的問答時間中，討論了歐洲社會對淨零轉型的態度，以及對台灣的啟示。鄭一青及Charter表示，當然仍有反對及倡議的聲音，但在歐洲社會淨零轉型已是主流共識，迫使政治人物不得不面對，不過歐洲的起步比台灣早，也是花了好幾年的時間才建立這樣的社會環境。與談人，地球公民基金會執行長李根政也表示，讓所有人都願意為環境努力，正是環境組織的目標。</p>\n<p>\t&nbsp;</p>\n<p><strong>【活動詳情】</strong></p>\n<p><ul></p>\n<p><li><a href=\"https://www.cet-taiwan.org/events/4229\">1/5 歐洲與台灣對話：氣候危機與淨零轉型〈論壇〉</a></li></p>\n<p></ul></p>"}, {"nid": 4274, "title": "面對氣候變遷，我能做些什麼？", "original_topic": "無", "adopted_cats": ["氣候變遷與調適"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20230328-003.JPG\"></p>\n<p>2023年1月，氣候變遷因應法修法三讀通過，2050淨零排放入法，宣告台灣加入全球氣候行動的行列。</p>\n<p>氣候變遷的確是小島台灣目前最迫切的挑戰。面對如此龐大的全球議題，您是否也想追問，<strong>「在地」該怎麼做？「我」該怎麼做？</strong></p>\n<p>歡迎訂閱地球公民「減碳與淨零轉型」電子報，我們將會不定期提供氣候議題的最新資訊以及在地環境組織的見解，一起成為願意為自己在乎的價值所行動的「地球公民」！</p>\n<p><hr></p>\n<p>setTimeout(iFrameResize, 300);</p>\n<p><hr></p>\n<h3>我們需要什麼樣的氣候行動呢？</h3>\n<p>節約用電、省水、多搭乘大眾運輸及使用環保餐具，當然都是我們能夠且應該採取的個人行動。</p>\n<p>但是，我們同時也需要有國家層級的氣候政策，引導大多數人們改變生活和生產模式。而地球公民的目標，就是要提出政策方向及具體建議，爭取社會的支持，讓政府、企業與更多人願意採取行動，不讓愛地球只成為口號！</p>\n<h3>什麼是公正轉型？</h3>\n<p>在追求更環保及永續的過程中，可能會因為環保法規加嚴而受影響的勞工、農民及其他相對弱勢的族群等，能夠在轉型過程中不被遺落。</p>\n<p>我們將不僅監督政府及企業落實他們的減碳責任，更要確保轉型符合在地的公平正義、完善社會溝通、保障弱勢族群降低與環境的衝突，也就是所謂的公正轉型。</p>\n<h3>透明、溝通、公民參與，是淨零轉型的基石</h3>\n<p><strong>我們也致力於降低轉型的環境與社會衝突</strong>。台灣地狹人稠、資源有限，在擺脫對化石燃料依賴，邁向永續轉型的過程中，如何明智利用有限的環境資源，減低對既有社會經濟的衝擊，必須有制度配套，更需要做好社會溝通與前期規劃，以避免轉型工程無法爭取社會支持，造成<a href=\"https://www.cet-taiwan.org/node/4224\">知本溼地光電案這類的社會衝突</a>再次發生。</p>\n<p><strong>我們更要求在地淨零政策需要公開透明、打開公民參與的空間</strong>。譬如，到2030年間，政府將挹注約9000億的預算在淨零的十二項關鍵戰略上。如此全面的淨零政策及龐大的預算規模，<a href=\"https://www.cet-taiwan.org/node/4222\">讓公民社會有效的參與溝通對話</a>，不僅是確保公正轉型能實踐的要件，更能夠把充沛的社會動能導引進政策的規劃之中。</p>\n<p><img alt=\"20220622-002.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u400/20220622-002.jpg\"><span>地球公民在著名的地標—中鋼集團總部大樓前，透過以黑色顏料留下「碳足跡」的方式，象徵中鋼在高雄製造的大量碳排及空污，要求中鋼改善。</span></p>"}, {"nid": 4341, "title": "【講座側記】7/15擺脫行人地獄，打造永續健康的交通環境", "original_topic": "抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230727-8.JPG\"></p>\n<p><h2>前言</h2></p>\n<p>2050淨零轉型已是全球共識，國際上人行道與腳踏車專用道做為交通排碳轉型核心策略；台灣陷入甚麼困境?</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230727-1_0.png\"><span>2050淨零路淨規劃 階段里程碑。（圖/地球公民基金會）</span></p>\n<p>不論是美國運輸與發展政策研究所(ITDP)多個報告，例如：自行車專用道保護氣候、緊湊型城市場景-電氣化；還是OECD -「以設計打造零碳系統的交通策略」等。 多個國際研究都指出，人行道、自行車專用道建置，除了讓城市更友善、使用者更健康，跟車道相比還能有效削減排碳量，良好的步行環境是交通減碳的基礎更是核心策略。 但台灣的淨零轉型路徑規劃裡，只關注運具電動化比例，而且運具電動化的基礎設施；充電樁也無與人行道、腳踏車道建置一起被統籌。 在臺灣2050淨零排碳路徑及策略規劃十二項關鍵戰略計畫之(七) 運具電動化及無碳化、(十)淨零綠生活；其中，短期階段（2023 年~2030 年）中長期階段（2031 年~2050 年）都看不到任何對於人行道、腳踏車專用道的推動方針。</p>\n<p><h2>對比國際，台灣的交通環境很糟嗎?</h2></p>\n<p>回顧近年報導，已經有五國官方、媒體提醒至台灣旅遊有的交通問題；美國國務院：「在穿越馬路的時候要謹慎，因為許多駕駛不尊重行人路權」、「許多駕駛會闖紅燈，尤其是在剛變換燈號時」、「計程車和公車可能會無視其他車輛，就急切到路邊」。</p>\n<p>英國和澳洲分別提到：「即使走在斑馬線上仍要小心穿越，因為一堆車都不會停下來」、「千萬別指望駕駛會因為行人停下，在過馬路前應先觀察一下周遭車輛」；加拿大政府則稱「機車騎士常常不遵守交通法規，他們相當危險」。</p>\n<p>2022/12 國際媒體CNN報導台灣是行人地獄。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230727-2_0.png\"><span>台北的步行+自行車比例僅佔20%。（圖/地球公民基金會）</span></p>\n<p><h2>道路幾何設計人車兼顧；高雄十全路為例</h2></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230727-6.JPG\"></p>\n<p>高雄市政府交通工程科技士莊哲維認為，要改善台灣的行人道路環境，應重新調整車道配置；道路瘦身，車道3公尺就足夠了，小客車頂多2 公尺、公車2.5公尺，再維持基本轉向設計，多餘的空間可以做成停車帶可以用路邊停車保護外側路人，其他就可以拿來做人行設施。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20270727-4_0.png\"><span>道路幾何設計──人車兼顧。（圖/莊哲維 簡報）</span></p>\n<p>莊哲維表示：大家都希望有人行道，現實面是很困難。在台灣要解決交通問題要先解決停車，再來工程經費很龐大、工程上很難執行；例如多年的地下管線配置混亂，會很容易挖到管線且不知主管單位、就算順利開工也有人行道排水問題要克服、商家陳情抗議、交通管制縮減道路遭抗議等等。但還是有方法可以做，就是標線行人行道，這是一個好的過渡方法，當務之急是用標線把合理的空間配置設計出來。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230727-5_0.png\"><span>實體人行道工程推動緩不濟急，標線行人行道是解方。（圖/地球公民基金會）</span></p>\n<p><h2>步行，行不行?</h2></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230727-9.JPG\"></p>\n<p>貳本規劃設計顧問公司主持人徐佳鴻在開場時詢問大家：你步行的街道有空間嗎？安全嗎？舒服嗎？能遮陽避雨嗎？迷人嗎？能交流互動嗎？</p>\n<p>往人本交通方向發展，現今都市規劃設計要改善的問題，分成下列幾個方向：</p>\n<p><ul></p>\n<p><li>行人可用空間少：缺乏人行空間、車道過寬</li></p>\n<p><li>道路空間界定不清楚：巷弄內人雜、壅擠、疏離的街道空間</li></p>\n<p><li>人行空間不連貫：人行系統與都市流通斷裂、不易連續</li></p>\n<p><li>交流停等空間不足：車輛占據巷弄空間，破壞逛街零售環境</li></p>\n<p></ul></p>\n<p><span><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230727-6_0.png\"><span>台灣的人行空間不連貫：人行系統與都市流通斷裂、不易連續。（圖/徐佳鴻 簡報）</span></span></p>\n<p>要改善空間的問題，有六大規劃操作策略：</p>\n<p><ul></p>\n<p><li>&lt;縮減低效率停車/車道空間，擴大人本空間</li></p>\n<p><li>建構流動機能，消彌流斷點</li></p>\n<p><li>城市空間營造, 增加體驗環境</li></p>\n<p><li>夜間照明設計, 滿足使用需求</li></p>\n<p><li>運用降溫手法，提升選逛、活動舒適度</li></p>\n<p><li>都市設計與停車管理配套</li></p>\n<p></ul></p>\n<p><span><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230727-7_0.png\"><span>綠廊與地下街運用不同高程的互動創造有趣的遊逛迴圈。（圖/徐佳鴻 簡報）</span></span></p>\n<p><h2>QA 時間</h2></p>\n<p><strong>1.為什麼標線行人行道要用綠色的?<br>\n<p>莊技士</strong>：法規沒有明確規範，也不知道為什麼。</p></p>\n<p>\t<strong>2.</strong><strong>我國交通工程技師為我國明定32科專科技師之一，長期以來法規未明確或規定相關法規要求交通技師參與簽署，相關圖說大部分由土木技師簽屬，導致交通安全與配置不合理問題。</strong><br>\n<strong>莊技士：</strong>交通技師應該要有道路幾何設計觀念…很多道路設計都是沿用再沿用，並沒有更新，這也是台灣道路狀況會顛成現在這個樣子的一大問題。</p>\n<p><strong>徐主持人</strong>：有一個案子在嘉義市裡面，設計圖從1943年就畫出來的圖….更神奇的是這個計劃被沿用了80年，我們的很多的法令都沒有改變…</p>\n<p><span>&nbsp;</span></p>\n<p><span><span><strong>該如何想像永續健康的交通環境</strong><strong>?</strong></span><span><strong>以人本的角度出發，從不健康到健康的交通系統</strong></span></span></p>\n<p><span></span><span>OECD在2021</span><a href=\"https://www.un.org/en/climatechange/paris-agreement\"><span>《</span></a><span> Transport Strategies for Net-Zero Systems by Design</span><a href=\"https://www.un.org/en/climatechange/paris-agreement\"><span>》</span></a><span>報告中指出，不健康的運輸系統關注高交通量（流動性）；能運輸多少人、車，而且會帶來一些負面影響，例如高碳排、空氣污染、道路安全和疾病（例如由空氣污染和缺乏活動所引起的疾病）。長距離和有限的出行選擇也會導致交通不便和不平等(例如輪椅族群、學生)。</span></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230726-3.png\"><span>Transport Strategies for Net-Zero Systems by Design&nbsp; 圖/OECD</span></p>\n<p>健康或可持續性的交通和城市系統關注所有族群的可達性，讓道路使用者在大部分出行中選擇步行、騎自行車或使用“微型”交通工具，公車、自有車的選擇為輔（右圖金字塔底部）。在道路設計上，讓短距離移動大量使用步行、腳踏車(主動運輸)，遠距離移動選擇空間密集的運輸，例如公車、MRT、飛機。這樣的設計將會降低流動性和碳排放量、空汙，同時帶來更健康、安全的生活方式、更高的生活質量和更公平的環境。</p>\n<p><span><span>以道路空間配置的歷史發展來反思現今的道路設計</span><span></span></span></p>\n<p>“一百年前，如果你是一個行人，過馬路很簡單：你步行穿過它。今天，如果該地區有交通設置且您想遵守法律，則需要找到人行道。如果有交通燈號，你需要等待它變成綠色……對於現在大多數人來說，這似乎是道路基本性質的一部分。但實際上這是 20 年代由汽車集團和汽車製造商領導的一場激進的、被遺忘的運動結果，該運動重新定義了誰擁有城市街道。” (Stromberg, 2015)</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230726-4.png\"><span>Transport Strategies for Net-Zero Systems by Design&nbsp; Author&nbsp; 圖/&nbsp;OECD<br><br>\n<p>Source: Adapted by Daniel Ernesto Moser based on Colville-Andersen&nbsp;(2018)</span></p></p>"}, {"nid": 4356, "title": "【講座側記】8/11 永續時尚中的我們", "original_topic": "抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230711-2_0.jpg\"></p>\n<p>【講座側記】永續時尚中的我們</p>\n<p><div>講者：</div></p>\n<p><ul></p>\n<p><li>張倞菱／picupi 挑品創辦人</li></p>\n<p><li>田欣怡／循環台灣基金會網絡總監</li></p>\n<p></ul></p>\n<p>主持：</p>\n<p><ul></p>\n<p><li>吳沅諭／地球公民基金會台北辦公室主任</li></p>\n<p></ul></p>\n<p><h2>循環紡織之路（講者：田欣怡/循環台灣基金會網絡總監）</h2></p>\n<h3><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/365517290_1523870951753741_4082097520566965586_n.jpg\">紡織資源循環現況</h3>\n<p>講者以「我們的衣櫥收納著什麼？」這個提問引導大家思考紡織業在生活中的情境，並進一步提點我們回想有多少衣物不常使用，接著揭露紡織業製造鏈中，只有1% 的紡織資源會再回到業內循環，成為下一個成品的原料，講者形容這就像破裂的水缸，留不住水，而這不只是資源的大量消耗，對紡織業者來說也是原料的損失。且全球紡織業的溫室氣體排放量占2%-10%、有將近五十萬噸的微纖維會造成水汙染，產業鏈中存在許多環境危機。</p>\n<p>面對這樣的現況，講者說明，循環經濟能夠打造全新的商業模式：循環經濟的精神即是初期設計時，周全地考慮每項原料的流向，從源頭安排每項原料在各階段被使用的方式，因此對於紡織業目前「多數資源將成為廢棄物」的現況，循環經濟將成為新的解決之道，講者以下列例子展示新可能。</p>\n<h3>循環經濟創造衣物的新可能</h3>\n<p>講者介紹了許多類型的循環經濟模式，帶大家一覽循環經濟的妙想，包含原料的「封閉循環」，透過使用單一材質，方便回收再製，解決複合性材質難拆解回收的窘況；也包含「維修」使用過的產品，例如阿姆斯特丹維修衣物中心、patagonia皆提供衣物維修的服務；而創新科技也可以將鳳梨葉、甘蔗變成纖維，為紡織原料提供新選項！</p>\n<p>服裝業也有實際案例，例如UNIQLO、ZARA、H&amp;M 三間快時尚的商店也發展出二手衣物交易平台、個人可以參與的維修行動，宣導如何保養、清洗衣物以延長衣物壽命等觀念。而台灣也有投入相關設計的品牌：新光紡織推出永續循環制服，如校園制服、國軍制服，使用者在階段結束後，可將衣物交給下一屆的人使用或重新再製，避免不必要的衣物存放；歐都納也推出回收循環衣；Amazing Cloudset 則是打造租借衣服的平台。透過這些例子，可以看見循環經濟的花，漸漸在名為商業的土壤上綻放，衣物使用的新可能越來越多，提供了新的思考和可能。<br>\n<p>&nbsp;</p></p>\n<p><h2>明日的衣櫃（講者：張倞菱/picupi挑品創辦人）</h2></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/365561163_910105507227527_8791226657791106961_n.jpg\"><br>\n<p>&nbsp;</p></p>\n<h3>時尚的代價</h3>\n<p>曾任多年時尚雜誌總編輯的講者張倞菱在演講最開頭，先為大家回溯快時尚的初衷，是希望「時尚在人人面前平等，製造出人人消費得起的產品」，為了達成平價，業者使用品質欠佳的原物料，並大量製造，以壓低成本，後續造成許多消費者頻繁更換衣物、許多服飾使用次數低的資源浪費。講者說對她而言，時尚產業鏈應是製造美麗事物的夢工廠，卻因為消費市場的競爭，導致時尚的代價不斷升高，包含對勞工的負擔、環境的汙染，以及資源的浪費，因此講者希望能從根本解決這件事情，從而踏入了永續時尚的領域。</p>\n<h3>永續時尚</h3>\n<p>所謂的永續時尚，是指找出解決環境問題和可持續生產的方法。這樣的願景看似美好又理想，不過有設計背景的講者也指出，設計師多數以創意為導向，但永續時尚的產品也要滿足消費者需求，不能將「永續時尚」直接視為保證售出的品牌、要求消費者買單，時尚還是需要回應消費者的需求，只是在生產方面以更多面向來達成永續。</p>\n<p>於永續時尚、永續設計中有哪些項目，講者也列舉一些，從這些介紹中可以發現設計產業導入永續的思維時，考慮的面向很廣，其中也包含文化的保存。時尚是展現品味、留存當代文化的方式，若能以更體貼環境的方式達成，將能為這時代的美事，真正製造出美麗的夢。</p>\n<p>講者也提出循環時尚產業邁向封閉式循環的藍圖，從設計端思考衣物回收後拆解的可能，讓布料再次回到原料的身分，供應鏈資源再使用的概念，除了工業製程上能應用，時尚服飾也同樣適用，若能掌握循環經濟的精神，不同產業間也能互相學習。</p>\n<h3>明日的衣櫃應回應個人需求</h3>\n<p>演講當中，講者除了勾勒永續時尚的美好畫面，也不斷提醒我們要回到消費者在意的價格、自己個人的需求，明日的衣櫃中將存放什麼服飾，最重要的是回歸自己的需求，根據自己生活情境挑選服飾的款式，在自己的習慣和喜好之上，更長期地支持永續時尚。</p>\n<p><h2>Q&amp;A 時間</h2></p>\n<p><strong>Q1：設計師在衣產業的循環時尚非常重要，有80%取決於設計研發階段，張講者在實務上是否有遇到和設計師合作時的產品開發困境呢？</strong><br>\n<p>&nbsp;</p></p>\n<p>A1張倞菱：設計師沒有辦法快速投入循環時尚的設計，因為時尚是流行產業，求新求變和創意對設計師來說是十分重要的元素，但永續時尚在設計上有些準則，零廢棄版型、減少下腳料都是限制，非常挑戰創意。講者自己也做過設計師，所以理解設計師的心情，這幾年投入發現困難重重原因主要有兩個，第一是設計師會害怕做了永續時尚後，消費者不一定買單；第二是害怕自己標榜是永續品牌，卻做得不夠好、無法符合消費者的期待和需求，所以不敢投入。張講者認為這個考量非常實際，永續要考慮環境、社會及經濟，最終如果無法讓品牌有盈餘，即使有理想也無法存活，因此也需要更多人支持這樣的品牌。</p>\n<p><strong>Q2</strong><strong>：從價格來談循環衣物難有競爭力，該如何走出這個困境呢？如何創造消費者對於永續產品的需求呢？</strong></p>\n<p>A2田欣怡：過去大家看重的是價格還是價值呢？企業追求價格容易形成削價競爭，那如果追求價值，最後如何平衡價值和價格？田講師說明，設計師可以準確評估產品何時會壞掉，因此能設定產品的生命週期有多久，當企業有操作的能力，要兼顧價格和價值，才能讓永續存活下來。身為地球上的共同體，我們可以試想一下，在2050我們要生活在什麼樣的世界。</p>\n<p><strong>Q3</strong><strong>：循環經濟中，因為會有很多的逆物流，還有清洗及重製的工作，要怎麼計算整體的碳排放是否划算、符合其中的效益呢？</strong></p>\n<p>A3張倞菱：根據Picupi的計算是完全不划算的。原本 Pipupi也想做 rebottle，但是運輸會產生碳足跡，也可能碰撞而毀損瓶罐，還沒有具體解決的方法，先從其它層面下手。</p>\n<p>A3田欣怡：所有的評估都有意義，製造階段、使用階段的影響，產品整個生命週期的價值成本都應該被考量，另外，不只有碳排放量，環境足跡、社會影響都是需要考量到的，應該更多思考什麼是真正的成本、真正的價值。</p>"}, {"nid": 4376, "title": "【講座側記】10/14 南橫公路與氣候的拔河", "original_topic": "自然復育;土地與生物保育", "adopted_cats": ["氣候變遷與調適"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20231024-01.jpg\"><span>(圖片：傅志男提供)</span></p>\n<p>南橫公路修了又斷、斷了又修。「面對環境的變動，我們要以什麼樣的姿態生活？要怎麼調適？」傅志男老師嚴肅地問。</p>\n<p>他是地球公民基金會董事、是生態解說員，更是環境忠實的記錄員。面對兩者無止盡的拔河，傅老師提供了不同的觀點。</p>\n<h3>南橫公路的緣起與面貌</h3>\n<p>他從23年前開始記錄南橫公路，與夥伴進行長期、定期的生態調查，為的是更了解這片土地。</p>\n<p>南橫公路前身為日治時期關山越嶺道，後來國民政府擇其適合路段串聯而成。公路始於臺南市區的湯德章紀念公園，穿過阿里山山脈及玉山山脈，在跨越中央山脈後抵達臺東縣關山鎮德高里。</p>\n<p>公路沿途經過寶來、勤和、復興等布農族部落。除了原民文化、抗日歷史外，沿線的生態資源也相當豐富，像是臺灣欒樹、尖葉楓和山桐子為山谷帶來一抹黃與紅；臺灣藍鵲與藍腹鷴為森林妝點了大海的顏色；或是突然迸出的黃喉貂或青條花蜂吸引了人們的目光。</p>\n<p>當公路經過天池來到埡口，分布在中高海拔的臺灣鐵杉以挺拔的姿態，屹立於夕陽與雲海之中。</p>\n<p>公路接著向下，經過向陽大崩壁，接著是摩天的美麗梯田與驚人的崩壁，再次提醒我們地質多麼脆弱。而此區的抗日行動亦沒有停歇，後人甚至在霧鹿砲台保留了日人轟山的大炮供人憑弔。</p>\n<h3>極端氣候重創南橫</h3>\n<p>傅老師展示2009年八八風災前後拍到的畫面，除了驚嘆溪流帶來的豐沛泥沙量，更多是對自然的崇敬。例如風災後溪床墊高40公尺，相當於10幾層樓的高度。土石淹沒勤和明隧道，多座橋樑橋面與溪床幾乎沒有空隙，甚至小林村被整個掩埋。</p>\n<p>由莫拉克颱風帶來驚人雨勢，小林村被掩埋時，該區已累積高達1,856毫米的雨量(將近甲仙鄉平均年雨量的五成)。即使已知水會致災，卻因通訊中斷而無法示警。</p>\n<p>依據行政院公共工程委員會新聞稿，超大雨量造成獻肚山順向坡大規模崩塌，也阻塞河道形成堰塞湖。在壩體潰決後，洪水夾帶大量土石再次覆蓋小林村，造成悲劇。</p>\n<p>另外2021年盧碧颱風及西南氣流帶來的豪雨也重創南橫公路。當時桃源區玉穗溪爆發土石流，導致明霸克露橋橋梁遭沖毀及引道被掩埋，復興部落以上三里對外交通中斷。</p>\n<p>這段原本是削山道路，後續又有崩塌，才決定在溪床上建一座長跨橋。橋最終不敵大自然的破壞，但也促使政府思考如何採用「最順天，又能應人」的方案，試圖打造永續安全的道路。</p>\n<h3>從人定勝天到順應自然</h3>\n<p>綜觀南橫公路13年修復史，終於在2022年全線有條件通車。傅老師特別感謝這一群無名的修路英雄，他們面對隨時可能落下的岩石、自身墜落的風險，以及居民的期盼，為的就是通車的瞬間。然而通車也帶給他不安。</p>\n<p>「沒有大量遊客的山林反而欣欣向榮。」傅老師感嘆地說。小林村也在十年間長成一片森林。面對南橫大小災難，他說：「沒有自然反撲這件事，只是我們的開發承受不住自然營力而已。」</p>\n<p>當極端氣候到來，大自然就會收回人類爭走的地。順應自然、與之共存似乎成了未來唯一的方向。</p>\n<p>近年公路的修繕方式漸漸納入生態考量，例如橋梁復原工程為一棵百年檜木改道。另外公路採部分時段開放，以等待全線完工。傅老師此時拋出疑問：未來若是全線完工後，是否也能維持有條件通車的模式？讓山林有喘息的機會。</p>\n<p>如果我們反過來想，災難其實也是一種契機。像是溪流夾帶大量土砂，是土石流、是災難，卻是平原的基石。儘管極端氣候向我們展示自然的宏偉，將人們拉向痛苦深淵，但當人們抱持謙卑的態度，自然會開啟嶄新的道路。</p>\n<p>而環境教育是傳遞信念的媒介，有時只需要一句話、一首詩、一部電影，引領孩子將對土地的認同與感動，化為關心土地的實體行動，我們就能與大地一同成長。</p>\n<p>「當我們更了解土地，或許就能有更美好的未來。」傅老師如此期待著。</p>\n<p>\n<strong>【活動詳情】</strong>​</p>\n<p><ul></p>\n<p><li>2023/10/14 (六)14:00-16:00</li></p>\n<p><li>講者：傅志男／生態解說員、地球公民基金會董事</li></p>\n<p><li>主持：李根政／地球公民基金會董事長</li></p>\n<p><li>了解更多請上：<a href=\"https://www.cet-taiwan.org/events/4367\">10/14 【南橫公路與氣候的拔河】講座</a></li></p>\n<p></ul></p>"}, {"nid": 4397, "title": "8/11【講座側記】永續時尚中的我們", "original_topic": "抗暖減碳;生活消費", "adopted_cats": ["氣候變遷與調適"], "content": "<p><h2><span><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/365500804_3568154690174675_787291352680728880_n.jpg\"><br></p>\n<p>解放時尚產業的循環經濟</span></h2></p>\n<p>快時尚生產平價潮流服飾，同時製造大量的碳排放、加速全球暖化。<br>\n<p>過去傳統時尚產業每年只有產出2個新品：春夏，秋冬，而現在快時尚為了滿足消費者衣櫃「衣服永遠少一件」的慾望，每年至少50個週期產生新品。現行紡織業從生產、使用到結束生命，只有1%回到業內循環，過程中溫室氣體排放量12億噸佔全球溫室氣體2%，水污染每年向海洋釋放50萬噸微纖維。</p></p>\n<p>循環經濟為什麼是必經的路程？「沒有從源頭開始設計的系統，最後還是有廢棄物的產生」田欣怡這麼說。從頭思考可循環利用、再生的方法，打造全新的商業運行模式，從價值損失到掌握循環新契機，啟動循環經濟。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20231121-1_0.png\"><span>循環經濟：從源頭減少廢棄物，降低資源浪費。（圖/循環台灣網絡總監 田欣怡 簡報）</span></p>\n<p><h2><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/365517290_1523870951753741_4082097520566965586_n%20%281%29.jpg\"><br></p>\n<p><span><br></p>\n<p>紡織業循環經濟成功案例</span></h2></p>\n<p>紡織業循環經濟案例有以下重點：</p>\n<p><ul></p>\n<p><li>材質面：單一材質/可再生纖維/纖維改善</li></p>\n<p><li>製成面：低衝擊製成/減少製成損失</li></p>\n<p><li>設計面：產品延壽設計</li></p>\n<p><li>售後端：維修/租借式服務</li></p>\n<p></ul></p>\n<p>下述案例分別分享在材質、製成、設計、售後如何達成循環經濟。</p>\n<p>\n<p>【材質面】單一材質</p></p>\n<p>台灣，歐都納：全循環衣，整件衣服皆可回收循環再製。<br>\n<p>大部分衣物屬於複合材質導致不便回收，歐都納推出全循環衣，布料、鈕扣、布標、拉鍊、縫線皆是可回收單一材質，整件衣服可直接回收並循環再製，讓下位消費者可以使用。<br></p>\n<p>&nbsp;</p></p>\n<p>【製成面】減少製成損失</p>\n<p>台灣紡織業龍頭，台南企業：布料銀行，讓庫存布重獲新生。<br>\n<p>在成衣製程中有許多剩餘的布料，台南企業將布料號碼公開登錄於布料銀行，提供庫存布給設計師、學生、策展單位使用，讓原本在倉庫的庫存布可以物盡其用。<br></p>\n<p>&nbsp;</p></p>\n<p>【設計面】延長衣物壽命</p>\n<p>英國服飾品牌Petit Pli ：伸縮童裝，一件抵七件。<br>\n<p>Petit Pli為解決嬰幼兒衣物汰換問題，推出可伸縮的童裝。田欣怡分享，一個小朋友從出生到三四歲需要七個尺寸衣服，將一件衣服設計成跨 7 個尺寸的伸縮衣物可以取代七件衣服購買，同時Petit pli加強孩童衣物的耐磨設計，增加衣物的耐用度。當衣服損壞時，可送回門市免費維修，讓衣服可以繼續使用。<br></p>\n<p>&nbsp;</p></p>\n<p>【售後端】延長衣物壽命</p>\n<p>阿姆斯特丹，「聯合維修中心」（United Repair Centre）：修復衣物實現零廢棄物目標。<br>\n<p>目前20位員工、一年修復25,000件修復衣物，負責為客戶修補撕裂、破損衣物，避免這些衣物被直接扔棄。未來歐盟將維修權擴大到紡織品。<br></p>\n<p>&nbsp;</p></p>\n<p>【售後端】租借式服務</p>\n<p>台灣服飾品牌，Amazing Cloudset：共享衣櫃，租來的時尚。<br>\n<p>屬於服務型商業模式，讓閒置的衣物被需要的人使用，「以租代買」更能彈性符合消費者的當下需求，衣物歸還後由專業洗衣店清洗，消費者不必擔心衛生問題。</p></p>\n<p><h2><span>永續紡織：能源、資源雙管齊下減碳50%</span></h2></p>\n<p>英國WRAP《Textile 2030》數據顯示，紡織業使用低碳能源能減少18%碳排；資源面策略下能減少32%碳排，於2030年能減碳50%。<br>\n<p>在資源面可以分成以下策略：原料使用纖維改質如天然纖維可以減少4%碳排；選擇低衝擊製成，如不銷毀庫存布能減少2%碳排；產品延壽設計如伸縮童裝及維修服務可以減少7%碳排；再生纖維使用如把所有舊衣服變成下一件衣服的材料，降低7%碳排；服務型商業模式流通可以降低12%碳排。</p></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20231121-2_0.png\"><span>英國WRAP《Textile 2030》報告：能源資源雙管齊下，紡織達成2030年減碳50%。（圖/循環台灣 網絡總監 田欣怡 簡報）</span></p>\n<p>英國數據啟示台灣紡織的永續轉型，「不可能有完美的系統，但相信我們是一步一步前進中，未來選擇是一種光譜，我們不用做到完美，但可以朝向好的方向前進。」田欣怡將目光放得很遠，唯有取得需求的平衡，永續循環產品才能進入到大眾的生活圈。</p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/365515108_826808072102336_3942930829500171717_n.jpg\"></p>"}, {"nid": 4477, "title": "森林碳匯能減多少碳？如何讓環境和社會都受益？", "original_topic": "森林與林業政策", "adopted_cats": ["氣候變遷與調適", "森林守護與林業改革"], "content": "<p>\n<p><img alt=\"一個人環抱著高聳的大樹\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20240417-003.JPG\"><span></span></p></p>\n<p>近年因為全球政府陸續宣示要面對氣候變遷、在2050年達成淨零排放，企業、人民都在「瘋減碳」。減少大氣中溫室氣體二氧化碳的方式百百種，其中最為人矚目的一塊便是「種樹」。</p>\n<p>透過種植樹木、保留樹木來固碳，形成「森林碳匯」，似乎是一種非常符合直覺且擁抱大自然的減碳策略。<strong>但透過森林碳匯，到底能夠達成多少減碳效益？政府、企業只要透過多種樹，就可以解決氣候危機嗎？</strong></p>\n<p><h2>什麼是台灣2050淨零排放？</h2></p>\n<p>2050年，台灣整體的溫室氣體排放量要等於台灣的森林、溼地、土壤等自然環境的二氧化碳吸收量（自然碳匯）。<br>\n<p>最簡單的說法就是：2050年，台灣的碳排放量和是1：1，這樣就是達成淨零排放。也就是說，到2050年，<strong>台灣的自然環境有能力吸收多少碳，我們才能排放多少碳。</strong></p></p>\n<p>台灣排碳多嗎？台灣是一個工業大國，總排放量佔全球0.7%，排名第22名。根據2021年環保署的統計，當年度台灣二氧化碳排放量約為2億8311萬公噸，<strong>將近當年度自然碳匯二氧化碳吸存量2,185萬公噸的13倍。</strong>註一</p>\n<p>\n<p><img alt=\"森林\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20240417-001.jpg\"><span></span></p></p>\n<p><h2><strong>台灣有可能透過森林碳匯來達成淨零排放嗎？</strong></h2></p>\n<p>台灣土地面積狹小，人口密度高，森林覆蓋約達六成，就算積極增加森林的面積，再加上目前尚在研究減碳方法的土壤、溼地和海洋等，能夠吸存的碳也是十分有限。而目前國發會規劃到2050年，森林碳匯每年只能增加吸存110萬噸的二氧化碳，約為目前的5%。</p>\n<p>政府規劃我們花25年種樹、保育，每年增加110萬噸的森林碳匯，大概是什麼樣的概念呢？如果換算成能夠折抵的工業排放量，<strong>110萬噸二氧化碳，大概是中鋼營運18天的排放量，更只有台塑集團營運約8天的排放量。</strong>註二</p>\n<p>也就是說，如果台灣要達成淨零排放，努力保有和增加自然碳匯固然重要，但是絕對不可能只靠種樹就達成淨零，而是<strong>一定要積極減少其餘超過九成且森林無法吸存的二氧化碳排放</strong>，而這些排放源主要來自於工業、住商、交通等耗能及活動。</p>\n<p>\n<p><img alt=\"一個人在霧中仰望參天大樹\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20240417-002.jpg\"><span></span></p></p>\n<p><h2><strong>那為何企業這麼愛種樹？</strong></h2></p>\n<p>人都有愛好自然、親近自然的本能，而因為台灣人喜愛種樹，企業種樹對於提昇形象有幫助，可以說是達成ESG價廉物美的好項目。</p>\n<p>譬如，台積電在2021年的植樹節發起「台積電植樹薪傳計畫」，由桃園、新竹、台中、台南市政府盤點規劃適宜土地給台積電栽種，截至2021年底，累積約種植了 1 萬 7,044 棵喬木與 27 萬 7,898 棵灌木，總綠化面積約 16.3 公頃，相當於0.6座大安森林公園的面積。</p>\n<p>在植樹薪傳計畫中，台積電委託了專業的景觀顧問公司和樹藝協會來協助，各縣市長都親自出席了種樹的儀式，媒體宣傳的效果很大，對於台積電原本就不錯的形象再加分。註三</p>\n<p><h2><strong>但是，種下的樹能達到多少減碳效果？</strong></h2></p>\n<p>根據環境部的資料，一公頃的林地每年可以吸收約10公噸的二氧化碳，假設台積電總綠化面積16.3公頃來換算，在種植約20年後，每年預估能夠創造約163公噸的碳匯，至於這項計畫能否取得碳權認證尚待了解。</p>\n<p>但很明確的訊息是，台積電在2021年的年排放量為1030萬公噸，相較之下，<strong>這163公噸大概只夠抵銷台積電營運8分鐘的碳排放量</strong>。而這或許就是台積電新聞稿中，並沒有具體去提種樹可以減多少碳的原因。</p>\n<p>所以，未來如果看到企業拿「我種了很多樹」來當作努力減碳的證明，應該要小心不要被誤導、模糊焦點。企業真正該做的，仍然是<strong>聚焦於努力減少他們生產製造的排放</strong>才對。</p>\n<p>\n<p><img alt=\"一群人手牽手環抱參天大樹\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20240417-005.JPG\"><span></span></p></p>\n<p><h2><strong>所以我們就不種樹了嗎？</strong></h2></p>\n<p>儘管種樹對於碳匯貢獻有限，也不一定能拿來抵減多少碳排放，但企業如果可以好好的運用企業豐厚資金，引進專業團隊，「在對的地方，在對的目標下種對的樹」，仍然可以對環境和社會產生正面貢獻。</p>\n<p>以前面台積電的例子來說，台積電當時的新聞稿提到：「台積公司選擇的樹苗皆為台灣原生種，以適地適種為原則，同時考量最佳適應性、高生態效益，並且維持本土物種。」其實就是一個值得鼓勵的作法，可惜的是仍缺少明確的生物多樣性策略和目標。2023年，台積電發布了「生物多樣性宣言」，開始提出相關計畫。這是一個值得肯定的轉變，也期待台積電可以成為領頭羊，帶領更多台灣企業走向生物多樣性的系統化保育工作。</p>\n<p>自然碳匯可以增加的幅度雖然有限，但還是要努力。不過，碳匯只是其中的一個目標，政府跟企業應該以提昇生物多樣性、人民生活品質和健康等多元目標，來擬定計畫，避免把碳匯做為唯一的目標，加上碳匯方法學之不足而產生其他副作用，例如砍伐次生林改造為人工林等，這些作為對於碳匯的貢獻都尚待研究跟政策釐清。</p>\n<p>\n<p><img alt=\"在森林中仰望的視角\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20240417-004.JPG\"><span></span></p></p>\n<p><h2>森林碳匯如何讓台灣環境和人民真正受益？</h2></p>\n<p>基於許多自然碳匯的研究都還在進行中，透過種樹、保育能夠增加多少自然碳匯，仍然有不確定性。但是，我們認為政府、企業透過增加碳匯的動力，挹注資金和資源，啟動社會討論凝聚共識，整合出從現在起到2050年，增加台灣自然碳匯、生物多樣性、提昇綠生活環境品質的政策與項目計畫，從做了不會後悔的事情開始。</p>\n<p>這將有助於引導企業和社會有心人士，共同致力於保有和增加自然碳匯，在對的地方，在對的目標下種對的樹，豐厚和促進台灣森林有形和無形的多元功能和資產。</p>\n<p>以這個作為出發點，我們列出了六項可以優先執行的項目，更可以成為你未來檢視政府及企業的種樹、護樹政策的重要指標。</p>\n<h3>優先保護森林，維護生物多樣性</h3>\n<p><ul></p>\n<p><li>保育既有天然森林。</li></p>\n<p><li>辨別農牧用地上具高保育價值的森林，保育其不被砍伐，減少森林損失。</li></p>\n<p><li>既有平地造林，透過資源調查和土地規劃，依據地力、功能、地方需求規劃為生態林、景觀林或經濟林。</li></p>\n<p></ul></p>\n<h3>在對的地方，在對的目標下種對的樹</h3>\n<p><ul></p>\n<p><li>選擇合適的地方，進行生態造林—例如移除銀合歡等外來種再造林。</li></p>\n<p><li>選擇合適的地方新植人工林加上人工林的永續經營，增加國產材。</li></p>\n<p><li>山坡地混林農業，改善山坡地農業破壞水土的耕種方式。</li></p>\n<p></ul></p>\n<p>全台灣愛樹、愛種樹的人真的很多，我們誠心期待在這波森林碳匯的政策擬定過程，有更多的社會討論、公眾參與，並廣納各有不同領域的專業參與。</p>\n<p><hr></p>\n<h3>地球公民基金會長期關注台灣的山林保育，近年更舉辦多場「森之旅」系列講座，希望讓更多人認識森林、了解森林，進而一起保護森林。如果你願意支持像地球公民這樣實事求是，有幾分證據說幾分話的環保團體，歡迎小額捐款支持我們。</h3>\n<p><div><a href=\"https://www.cet-taiwan.org/donate\"><span><span dir=\"ltr\">成為地球公民</span></span></a></div></p>\n<p>如果你想持續了解更多關於森林、減碳的知識，歡迎<a href=\"https://www.cet-taiwan.org/civicrm/profile/create?gid=10&amp;reset=1\">訂閱地球公民電子報</a>。</p>\n<p>註一：台灣每年二氧化碳的移除量2185萬公噸乃是採用2021年溫室氣體排放清冊報告的數據，森林碳匯的計算方法仍有許多修正空間與缺口，並不能完全代表台灣自然碳匯移除二氧化碳之量體。但無論如何，台灣目前人為溫室氣體排放量，遠遠大於自然可以吸收的量，是無庸置疑的事實。</p>\n<p>註二：根據環境部氣候變遷署事業溫室氣體排放平台2021年碳盤查登錄資料，台灣積體電路公司年碳排放(範疇一及範疇二合計)約為10.12MtCO2e(占全台3.4%)，台塑集團旗下台塑石化、台塑工業、台化及南亞公司共計約50.07MtCO2e(占全台16.9%)，中國鋼鐵公司則約為22.33 MtCO2e(占全台7.5%)，共計貢獻全台27.8%的碳排放。</p>\n<p>註三：台積公司啟動植樹薪傳計畫 攜手桃園、新竹、台中、台南四地市政府共同推動都市與社區綠化。台灣積體電路製造股份有限公司，2021/03/12。<a href=\"https://pr.tsmc.com/chinese/news/2801\">https://pr.tsmc.com/chinese/news/2801</a></p>"}, {"nid": 4489, "title": "淨零趨勢下的產業轉型 談石化高雄未來", "original_topic": "工業污染;產業轉型;抗暖減碳", "adopted_cats": ["氣候變遷與調適", "完善能源政策"], "content": "<p><span>（台灣教會公報林婉婷專題報導、攝影）</span></p>\n<p>\t當「2050年淨零排放」作為國際趨勢與台灣國家政策，石化業密集的高雄市該如何因應、產業該如何轉型？5月3日晚間，地球公民基金會攜手台灣氣侯行動網絡、國科會整合型研究計畫「探尋石化高雄的永續與公正轉型路徑——從知識到行動的整合研究」，於地公高雄總部舉行高雄淨零城市治理論壇，邀請高雄市政府經濟發展局副局長王宏榮、環境保護局副局長黃世宏、經濟部產業發展署永續發展組節能減碳科科長賴俊甫、中山大學社會學系副教授邱花妹、台灣氣候行動網絡研究員林怡均、地公執行長王敏玲分享。</p>\n<p><img alt=\"20240516_03.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u422/20240516_03.jpg\"></p>\n<p><h2><strong>石化業轉型 往高科技產業發展</strong></h2></p>\n<p><img alt=\"20240517_02.png\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u422/20240517_02.png\">王宏榮指出，現今石化業所面臨的挑戰包含環保法規、淨零趨勢、企業競爭等，而高雄市還特別有地下管線與公安、大社石化工業區降編的議題。關於高雄市石化業的「智慧轉型」與「低碳轉型」，第一個方向是「半導體產業鍊」，從台南、路竹、橋頭、楠梓到大社、林園、大林蒲等產業園區串連，其中石化工業區也會轉型、參與半導體的製造、材料、封裝等。第二個方向是「亞洲新灣區2.0」，包含引進5G Alot（智慧聯網）等技術，推動科技、創新的產業與城市治理。</p>\n<p>關於石化業的淨零，他點出主要為三個方向：第一是「製程改善」，包含導入人工智慧的監控與管理、汰換老舊設備、預防性維護取代反應性維護等，提升工業的永續與安全。第二是「循環經濟」，包含副產物和廢棄物的再利用研發與實踐，其中大林蒲遷村計畫包含石化業原址轉型為「新材料循環產業園區」；王宏榮認為這一方面是實踐居住正義，另一方面也是石化業空間重構。第三是「綠色工廠標章制度」，目前有16間大廠取得標章、其中六間為石化業。</p>\n<p><h2><strong>石化業轉型 業者結盟互享資源</strong></h2></p>\n<p><img alt=\"20240517_03.png\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u422/20240517_03.png\">黃世宏則說明，高雄市的淨零規劃是以2005年基準年，2030年減量30%、2050年淨零。目前的溫室氣體排放現況，以2022年為例，排放總量為5235萬公噸、較基準年減量20.9%、約1379萬噸。深入分析2022年的溫室氣體排放結構裡，工業佔比82%、住商10%、運輸7.1%；間接能源排放三成、直接排放七成。黃世宏補充，排放狀態與經濟狀況有關，產能減少確實可能使得排放量減少，例如中油2022年產能減少13%、排放也減少267萬噸，但這不代表排放問題本身得到改善。</p>\n<p>高雄市政府根據國家制定的「12項關鍵戰略」、結合在地發展和需要，規劃出九大面向、五大基礎的治理架構。九大面向為能源、工業、住商、運輸、環境、農業、淨零綠生活、碳匯、公正轉型，五大基礎為治理、法治、技術、人才、經濟。其中針對「技術」，2022年6月成立「產業淨零大聯盟」，公布企業的碳足跡數據，利用企業性質與產業鏈的相互影響力，發揮以大帶小的效益，尤其要求國營企業以身作則，分享減碳技術、資源整合。另市政府也定期透過碳盤查輔導、節能減碳輔導，讓業者知道自己的排放情況與改善方式；並規範石化業者配合「2025年汽電共生脫煤」目標。</p>\n<p>黃世宏也介紹兩個目前推出草案的治理方案：《減量指定目標與自主減量計畫》和《碳預算》。《減量指定目標與自主減量計畫》是要求企業依照產業類別、對照科學基礎減量目標（SBT）數據指定削減率目標，提出自主減量計畫，依照達成情形，在2030年（目標年）提供兩種優惠費率讓企業選擇；現階段有56家企業已制定2030年目標、46家已制定2050年目標。而《<em><strong>碳預算</strong></em>》則需要精算排放增量與減量、兩年一期規劃，是為「碳媒合」機制做預備。</p>\n<p><strong>註｜碳預算｜</strong>高雄市為全國首個制定並通過地方淨零自治條例的城市，在《高雄市淨零城市發展自治條例》中定義「碳預算」為每一期溫室氣體排放量之上限、以兩年為一期，也在該條例中指出碳預算制定應邀集有關機關、學者、專家、民間團體座談，落實公民參與。</p>\n<p><h2><strong>石化業轉型 業者結盟互享資源</strong></h2></p>\n<p><img alt=\"20240517_04.png\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u422/20240517_04.png\">賴俊甫在分享時強調，淨零是國際趨勢，例如目前有RE100、科學基礎減碳目標倡議、氣候相關財務揭露、《氣候變遷因應法》與碳費等倡議與法規，再加上國際供應鏈要求、歐盟「碳邊際調整機制」等，基於產業鏈互相影響，因此台灣企業實在無法置身事外。</p>\n<p>關於碳排，他從數據指出2005年起台灣人均國內生產毛額（GDP）與碳排脫鉤，碳密集度自此穩定下降；另產發署過去也推出自願減碳計畫，業者參與、政府檢核。針對淨零趨勢，產發署提出三大策略：製程改善、能源轉換、循環經濟，並有11項措施，包含導入既有技術、發展前瞻技術；其中，近年熱議的「氫能」和「碳捕捉再利用」等技術持續開發。他強調，長期而言還是需要有新技術才能有效減排。</p>\n<p>賴俊甫也在分享時列舉企業轉型的實例，包含長春石化苗栗廠、樹脂大發廠投入煤電共生設備；台塑透過人工智慧來精準計算與調節，以智慧管理來節電、減碳。他認為石化業必須走向「高值化」，例如研發以減少原料使用量、發展容易回收的綠色產品等。</p>\n<p>他也介紹，產發署有出版《<em><strong>石化業低碳生產技術彙編</strong></em>》，幫助業者解決難題，並有相關培訓、輔導和補助機制。另結合產業公會成立「產業碳中和聯盟」，一樣是以大帶小的影響力。</p>\n<p><strong>註｜石化業低碳生產技術彙編｜</strong>產發署委託財團法人台灣綠色生產力基金會執行「製造部門低碳生產推廣計畫」，並搜集、彙整國際與台灣石化業商業化應用的低碳技術而編製而成的參考讀物，可於產業節能減碳資訊網免費下載。</p>\n<p><h2><strong>石化業轉型 更多正視公正轉型</strong></h2></p>\n<p><img alt=\"20240517_05.png\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u422/20240517_05.png\">邱花妹在分享時指出，氣候變遷帶來全面影響，因此調適也涉及方方面面，包含城市規劃、建築設計等；不只是企業，政府部門、金融、醫療與教育機構等，也必須思考與落實淨零。當中除了政府政策與法令、企業技術等改革，「公民社會」所受到的衝擊亦需要被正視，尤其是基層勞動者、年輕世代、女性、原住民族等脆弱群體的聲音。</p>\n<p>邱花妹直言，政府與企業積極發展技術、辦理輔導、培訓人才和建立市場機制，但整體而言還是缺乏公民社會對「石化業」的看法，以及對「生態天花板」的理解與想像。例如「大社工業區降乙編」所拉鋸的地方居民與從業人員權益是否被看見？以及年滿40年、有安全疑慮的中油林園石化廠「四輕」在「2050年淨零排放」的前提下是否需要更新？更新是延續舊有模式還是全新模式？邱花妹認為，高雄市的淨零治理架構納入「公正轉型」，但還是缺乏社會討論，「淨零不只是經濟與技術的轉型，也包含政治與社會的轉型。」</p>\n<p><strong>註｜大社工業區降乙編｜</strong>因1993年發生毒氣外洩事故，1998年高雄縣都市計畫通盤檢討明定大社工業區在2018年遷廠與降編為乙種工業區；2019年3月22日高雄市政府已作成大社工業區降編決議並在5月報內政部核定，然中央遲遲未完成審議。2022年環保團體針對內政部拖延提出訴願。近期消息方面，據媒體報導園區管理單位經濟部已向廠商提出空汙總量不增加、產能不增加、製程效能提升等三方向轉型。</p>\n<p><strong>註｜四輕更新｜</strong>中油林園石化廠的第四套輕油裂解廠（四輕）於1983年啟用、至今已運作滿40年。新三輕廠於2024年3月中旬發生洩漏與火災事故，引起政治人物和地方居民抗議、呼籲更新。據媒體報導中油表示相關計畫已送至行政院審查。</p>\n<p><h2><strong>石化業轉型 需要完整全面配套</strong></h2></p>\n<p><img alt=\"20240517_06.png\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u422/20240517_06.png\">林怡均開宗明義表示，由於產業鏈複雜、產品多元與國際競爭，石化業是難減排產業，需要推動「整體價值鏈」轉型。接著她以塑膠產業為例，進一步解釋為何減碳是環環相扣、無法僅靠某部分轉型就可以達到目標；台灣在2021年因塑膠需求衍生出的碳足跡是2440萬噸，佔總量9%。</p>\n<p>塑膠產業的上游原料包含乙烯、丙烯等，生產過程高汙染，哪怕有脫碳技術，還要考量中游的聚乙烯、聚丙烯等原料需求量大，以及終端產品後續的流向和回收，尤其復合性塑膠產品因為回收困難、常常淪為一般垃圾以焚燒處理。她補充原料高值化技術發展不顯著，是因為在經濟效益為優先考量的情況下，研發與採購成本導致難以大量生產、應用。</p>\n<p>她也列舉並比較相關治理政策，例如「碳定價」的設計與執行國際間的案例差異較大，而「經濟誘因」包含課稅、補貼，和「抑制需求」則包含減量、禁用政策等，但這部分台灣落實較少。最後她呼籲產業轉型在上游、中游、下游都要有相應政策，例如潔淨能源和基礎建設、友善氣候的製程和終端產品等，還有生產市場與需求市場平衡、如何符合國際規範等，都要有配套。</p>\n<p><h2><strong>石化業轉型 直面環境安全困境</strong></h2></p>\n<p><img alt=\"20240517_07.png\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u422/20240517_07.png\">王敏玲首先以歷史角度談高雄市如何逐步「被計畫」成為工業都市。早在1937年，日本殖民政府就在楠梓興建燃料廠；終戰後，國民政府接收煉油廠並持續運作。高雄市的臨海工業區、林園工業區、大發工業區、仁大工業區都有石化廠，汙染和工安的威脅如影隨形，影響居民健康與人身安全；除了空氣汙染，行駛在路上的槽車也造成日常交通的壓力。</p>\n<p>她也肯定2005年起GDP與碳排脫鉤、碳密集度穩定下降的現象，但也直言參與產發署自願減碳計畫的眾企業，前後花費16年才減排1052萬噸碳，而高雄市2022年因產能減少、碳排減量500萬噸，包含中鋼的267萬噸。這個落差顯示對於有效且具體減排、直至淨零，還需要更多努力與落實。最後她以「後勁反五輕」的案例，提醒政府與社會審慎面對四輕轉型議題。</p>\n<p><h2><strong>面對未來 需要更多公眾討論</strong></h2></p>\n<p><img alt=\"20240517_08.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u422/20240517_08.jpg\">問答時間，有三位與會者分別提出以下問題：「計算下來，高雄市需要每年減排200萬噸以符合淨零目標，具體該如何做到？」「透過石化業從業人員的餐食改善等來實行碳中和是否可行？」「目前產業轉型似乎缺少足夠減排至淨零的誘因？」主講人們也分別回應與補充說明。</p>\n<p>王宏榮坦言，由於缺乏大型企業的技術與人才優勢，「中小企業」是減碳弱勢，確實部分業者表現出「碳焦慮」。他強調政府是否有因應政策與工具，不過起步較慢，加上多元面向、分散在不同部門中規範與執行。他舉例，「氫能」在英國、日本的發展與應用較快，但台灣推動綠電受限於地狹人稠的環境，去年訂定《加氫站銷售氫燃料經營許可管理辦法》、將首先應用在公共運輸，但這項政策落在交通運輸範疇而非產業轉型領域；又例如「儲能廠」是鄰避設施，但發展綠能需要有儲能設施。王宏榮認同邱花妹所言，在轉型路上確實需要有更充分的社會溝通。</p>\n<p>黃世宏則提到，減排受到技術研發與燃料轉換的影響，因此減量程度是每年浮動、不是固定幾噸來計算。他認為推動淨零很重要是人類行為改變，包含飲食、交通等方式都會影響碳排，甚至未來投融資時，金融機構也會審查其排放情形。</p>\n<p>而賴俊甫則再次強調現有技術做不到淨零、要靠新技術；由於各廠製程不同、難一體適用，因此產業轉型關鍵包含業者本身意識到淨零的重要與必要性，產發署鼓勵「內部倡議文化」，也就是從內部產生轉型動力。</p>\n<p>邱花妹則提醒，「碳捕捉和封存」和「自然碳匯」在技術上和社會接受度上仍有變數，相關討論在轉型過程不能偏廢。她也提到石化業製程減排難度高，才會高度寄望新技術，但這些技術引入或自然碳匯購買都會提高生產成本，在減塑公約等環保觀念強化的趨勢下，需求市場波動，生產市場難不受影響，連帶使得業者考慮是否要繼續投資、發展。</p>\n<p>她坦言，或許人們要思考「棄成長」，接受在現今的環境狀態中無法繼續「無限增長」；她也強調轉型是讓城市走向永續，是所有人的功課，確實無法一時間找到所有問題的解答，需要持續溝通、資訊透明、提升公眾參與。</p>\n<p>而林怡均則點出，台灣需要屬於工業部門、上位的產業轉型政策，並且有專門資金投入技術研發，就像美國、歐盟；而配合新技術的成本，「碳定價」要也有足夠動力，否則停留在「漸進式減碳」很難達到淨零目標。</p>\n<p><span>原載於《台灣教會公報》<a href=\"https://tcnn.org.tw/archives/204733\">第 3769 期</a>，已獲《台灣教會公報》授權轉載。</span></p>\n<p><img alt=\"20240517_01.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u422/20240517_01.jpg\"></p>"}, {"nid": 4527, "title": "創造森林與碳匯的多重紅利", "original_topic": "森林與林業政策;抗暖減碳", "adopted_cats": ["氣候變遷與調適", "森林守護與林業改革"], "content": "<p><img alt=\"20240717_001.jpeg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20240717_001.jpeg\"><br>\n<p><span>根據國發會公布的 2050淨零路徑圖，台灣全國約 219萬公頃的森林，約有 2,140萬噸的碳匯。（李根政攝）</span></p></p>\n<p>近日，環境部公告<a href=\"https://www.cna.com.tw/news/ahel/202406270329.aspx\">避免種植</a>十五種產生空污（臭氧前趨物<a href=\"https://zh.wikipedia.org/zh-tw/%E7%95%B0%E6%88%8A%E4%BA%8C%E7%83%AF\">異戊二烯</a>）的樹種，引起社會軒然大波，幾天之後，彭啟明部長邀請相關邀請專家和機關重新會商，從善如流決議<a href=\"https://www.cna.com.tw/news/ahel/202407030150.aspx\">廢止該項公告</a>，並稱「種樹是無悔的政策」，鼓勵各界持續種樹。</p>\n<p>這個事件除了突顯環境部決策過程，缺少了自然資源治理所需要的專業之外，也看到「如何種樹」是值得社會一起思考討論的課題。</p>\n<p>透過種植樹木、保留樹木來固碳，形成「森林碳匯」，一直都是非常符合直覺且擁抱大自然的減碳策略。但透過森林碳匯，到底能夠達成多少減碳效益？政府、企業只要透過多種樹，就可以解決氣候危機嗎？</p>\n<p>依照台灣的環境條件，社會需求，有哪些是能夠見樹又見林，做了一定利大於弊、不會後悔的「無悔的政策」？</p>\n<h3>什麼是台灣2050淨零排放？&nbsp;</h3>\n<p>最簡單的說法就是：2050年，台灣的碳排放量和台灣的森林、溼地、土壤等自然環境的二氧化碳吸收量（自然碳匯）是1：1，這樣就是達成淨零排放。也就是說，到2050年，台灣的自然環境有能力吸收多少碳，我們才能排放多少碳。</p>\n<p>台灣排碳多嗎？台灣是一個工業大國，2021年二氧化碳總排放量佔<a href=\"https://www.iea.org/countries/chinese-taipei/emissions\">全球0.83%，排名第22名</a>。根據環保署的統計，2021年台灣二氧化碳排放量約為2億8311萬公噸，將近當年度台灣自然碳匯二氧化碳吸存量2,185萬公噸的13倍。（註一）</p>\n<h3>台灣有可能透過森林碳匯來達成淨零排放嗎？先講結論：不可能&nbsp;</h3>\n<p>台灣土地面積狹小，人口密度高，森林覆蓋超過六成，就算積極增加森林的面積，再加上尚在研究減碳方法的土壤、溼地和海洋等，能夠吸存的碳，相較於排放量也是十分有限。國發會「<a href=\"https://ws.ndc.gov.tw/Download.ashx?u=LzAwMS9hZG1pbmlzdHJhdG9yLzEwL3JlbGZpbGUvMC8xNTA0MC8yZTZhZTA0Mi0wYjUyLTQ4OTAtOGY5NC1hYjk5MzgzNWZlZTIucGRm&amp;n=6Ie654GjMjA1MOa3qOmbtuaOkuaUvui3r%2bW%2bkeWPiuetlueVpee4veiqquaYji5wZGY%3d&amp;icon=.pdf\">2050淨零排放路徑</a>」根據2019年全國森林碳匯總量約2,140萬噸，規劃至2050年，森林碳匯每年增加110萬噸，增量約為5%。</p>\n<p>政府規劃我們花25年種樹、保育之後，在2050年時每年可以增加110萬噸的森林碳匯，大概是什麼樣的概念呢？如果換算成能夠折抵的工業排放量，110萬噸二氧化碳，大概是中鋼營運18天的排放量，更只有台塑集團營運約8天的排放量。（註二）</p>\n<p>也就是說，如果台灣要達成淨零排放，努力保有和增加自然碳匯固然重要，但是絕對不可能只靠種樹就達成淨零，而是一定要積極減少其餘超過九成且森林無法吸存的二氧化碳排放，而這些排放源主要來自於工業、住商、交通等耗能及活動。&nbsp;</p>\n<h3>企業愛種樹，減碳效果知多少？</h3>\n<p>人都有愛好自然、親近自然的本能，而因為台灣人喜愛種樹，企業種樹對於提昇形象有幫助，可以說是達成ESG價廉物美的好項目。</p>\n<p>譬如，台積電在2021年的植樹節發起「台積電植樹薪傳計畫」，由桃園、新竹、台中、台南市政府盤點規劃適宜土地給台積電栽種，截至2021年底，累積約種植了 1 萬 7,044 棵喬木與 27 萬 7,898 棵灌木，總綠化面積約 16.3 公頃，相當於0.6座大安森林公園的面積。</p>\n<p>在植樹薪傳計畫中，台積電委託了專業的景觀顧問公司和樹藝協會來協助，各縣市長都親自出席了種樹的儀式，媒體宣傳的效果很大，對於台積電原本就不錯的形象再加分。（註三）</p>\n<p>根據環境部的資料，一公頃的林地每年約可以吸收約10公噸的二氧化碳，假設台積電總綠化面積16.3公頃來換算，在種植約20年後，每年預估能夠創造約163公噸的碳匯，至於這項計畫能否取得碳權認證尚待了解。</p>\n<p>但很明確的訊息是，台積電在2021年的年排放量為1,012萬公噸，相較之下，這163公噸大概只夠抵銷台積電營運8分鐘的碳排放量。而這或許就是台積電新聞稿中，並沒有具體去提種樹可以減多少碳的原因。</p>\n<p>所以，未來如果看到企業拿「我種了很多樹」來當作努力減碳的證明，應該要小心不要被誤導、模糊焦點。企業最主要該做的，仍然是聚焦於努力減少他們生產製造的排放才對。&nbsp;</p>\n<h3>森林多元功能為主，碳匯為輔</h3>\n<p>由前述可知，碳匯不可能是台灣達成淨零的主要方法。事實上，有關種樹減碳，國際間仍然存在林業學者和生態學者的重大岐見。最典型的例子就是林業界常常主張，老齡林吸收碳匯能力，不如種植年輕小樹，但生態學界未必認同。2021年，台北市立美術館就曾發生碳中和爭議事件，由於政府林業機構的建議，台北市砍伐大崙尾山公有的天然次生林，將其改造為單一樹種的林相，目標是要折抵展覽期間390噸的碳排，此舉引起廣大爭議（註四）。</p>\n<p>事實上，國際間為了避免造假漂綠，對於種樹減碳的規範相當嚴謹，台灣目前環境部完成審查的自然碳匯方法學僅有「造林與植林碳匯專案活動」，企業要取得專案的減碳認證並不容易。對於外界的一頭熱，農業部日前還公開呼籲農民和外界不要對農業碳權有過高的期待，認為透過種樹取得碳權，投入成本不成比例。（註五）</p>\n<p>依據東華大學張世杰教授在花蓮大農大富平地森林的碳通量研究顯示，每年每公頃的碳吸存量為10.9公噸，且從空地開始造林，需要經過7~-8年的時間，森林才會從碳排放轉為碳吸存。如果是以同地區的土地，架設太陽光電單位的減碳效率，比平地造林高了53倍（註六）。</p>\n<p>從以上的討論我們可以看到，森林不應只考慮減碳的單一目標，當把森林具有的多元功能納入考量，其實是更全面的去檢視森林與土地利用的環境與社會價值，而非扁平的追求減碳效益的最大化。否則有可能就輕率導出，與其種樹不如種電的結論。</p>\n<p>考量台灣土地面積小，排碳量大的特性，增加森林碳匯空間有限的情形下，有關種樹減碳台灣策略，我認為就是「森林多元功能為主，碳匯為輔」。把提昇生物多樣性、修復生態系、林業經濟、人民生活品質和健康等多元功能為主要目標，把碳匯做為次要目標，也許可以增匯的量很少，但對環境與社會有大效益。以下筆者嘗試提出五項屬於台灣的無悔政策倡議，從企業種樹、國有林及不同區位的森林管理下手，期待與社會共同商討：</p>\n<p><strong><span>一、從愛種樹走向生物多樣性</span></strong></p>\n<p>從企業的角度，種樹對於碳匯貢獻有限，也不一定能拿來抵減多少碳排放。但如果企業可以好好的運用企業資金，引進專業團隊，多多投入森林保育和種樹，仍然可以對環境和社會產生正面貢獻。</p>\n<p>目前全球逾半GDP依賴於自然及生態系服務，生物多樣性喪失將對相關產業造成巨大衝擊。<a href=\"https://e-info.org.tw/taxonomy/term/50885\">2022年第15屆聯合國生物多樣性大會（COP15）</a>的共識，即2030年以前保護全球30%的陸域、水域物種多樣性。很需要政府與企業各界擴大在生物多樣性的投資。</p>\n<p>再以2021年台積電植樹薪傳計畫為例，其新聞稿表示：「台積公司選擇的樹苗皆為台灣原生種，以適地適種為原則，同時考量最佳適應性、高生態效益，並且維持本土物種。」就是一個值得鼓勵的作法，但仍然缺少了明確的生物多樣性策略和目標。不過，2023年，台積電發布了該公司的「生物多樣性宣言」，開始提出相關計畫，這是一個值得肯定的轉變。</p>\n<p>目前，由農業部林保署建立的「公司團體參與自然碳匯與生物多樣性保育專案媒合平臺」，由各分署提出的專案，除了新植造林之外，也納入了森林復育、森林經營，生物多樣性維護等多元的專案，是值得肯定的方向。但企業團體很可能還停留在出錢種樹、拍照、媒體報導、寫報告的模式，對於這些新類型的專案似乎還在觀望。&nbsp;</p>\n<p>如果，台灣的企業從單純的愛種樹，開始走向生物多樣性的系統化保育工作，且做出長期投入的承諾，不論是加入林保署的專案，或者自提專案，將對台灣產生更大的貢獻。</p>\n<p><img alt=\"20240717_002.jpeg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20240717_002.jpeg\"><br>\n<p><span>在台灣植樹造林減碳效果有限，但企業形象宣傳效果十足。期待企業加入生物多樣性的目標和作法，長期經營，紮實的對生態保育作出貢獻。（圖為相思樹造林，李根政攝）</span></p></p>\n<p><strong><span>二、國有林增加人力，強化社區參與</span></strong></p>\n<p>台灣的森林面積約220萬公頃，覆蓋率超過國土六成，全都納入的森林碳匯的計算。大部分是位於受到《森林法》管轄的林地，其中最為珍貴的是約163萬餘公頃的國有林，目前由林保署1,078名巡山員守護，平均每人巡守1,512公頃（2024年），照護森林的人力和投資明顯不足。除了應持續增加體制內的人員之外，更需要促進原住民部落，鄰近森林社區的參與，建立共管或伙伴關係。近年來，農業部林保署已經努力推動相關政策，但需要更有力的資金挹注。</p>\n<p><strong><span>三、18萬公頃農牧用地上的森林，提出保育對策</span></strong></p>\n<p>然而，也有不受目前《森林法》管轄的森林。位於山坡地農牧用地上約有18萬公頃的森林，依法地主或承租人可以砍伐，恢復農用。例如，位於台東達仁鄉安朔地區的珍貴櫟林，生長著瀕臨滅絕等級（EN）的稀有植物─浸水營石櫟與大武石櫟，因位在國有出租的農牧用地上，就受到砍伐的威脅（註七）。從減少碳匯損失，以及生物多樣性保育的角度，這正是保護區外的有效保育地(OECM, other effective area based conservation measures ）最為關鍵的森林課題。極待政府跨部會提出整合性的保育對策，運用政策工具與資金介入轉導，引導地主或承租人共同協力保留。</p>\n<p><strong><span>四、山坡地混林農業</span></strong></p>\n<p>台灣山坡地農業活動，存在違法超限利用，或者合法但破壞水土的慣型農法，極需推動「混林農業」及友善土地的耕種方式，同時增加森林面積、修復生態系、生物多樣性和保護水土的策略，以及促進農業與山村的永續。筆者認為新竹尖石鄉新光--鎮西堡部落，保留邊坡林帶，高達90%以上有機農業的經營模式很值得各界參考。（註八）</p>\n<p><strong><span>五、台糖部分造林地，變更為公園綠地，打造森林公園。</span></strong></p>\n<p>台糖公司配合政策的獎助造林約1萬公頃，這些土地正被一塊塊的轉為工業區，一部分土地為了轉為光電使用，引起社會極大爭議，「砍樹種電」成了太陽光電污名的指標。即便台糖公司種的是單一樹種人工林，並且設定了二十年後得以砍伐，但成林之後，已成為人們期待保留的目標。這反應了台灣城鄉地區平地森林，公園綠地的稀缺，以及人們的渴望。</p>\n<p>期待政府能夠對台糖的土地進行整體規劃，將一部分台糖鄰近社區的造林區域，變更為森林公園，朝向自然公園--生物多樣性的營造。</p>\n<h3>小結：</h3>\n<p>上述五大政策，如要能夠務實推動，仍需更細緻和完整的政策框架，政府跨部會以及公私協力，筆者建議從以下兩點著手。</p>\n<p>第一，目前台灣2050淨零排放路徑中，「自然碳匯」已納入十二項關鍵戰略，而森林碳匯仍是主要的項目。基於筆者所倡議「森林多元功能為主，碳匯為輔」的無悔政策，同時呼應《聯合國生物多樣性公約》COP15「30×30」目標，建議行政院應將「生物多樣性保育與推展」納入必須同時達成的目標，或可修改該項戰略的名稱為「自然碳匯與生物多樣性」，讓農業部林保署與跨機關、跨部會可以共同協力推動相關政策，特別是農業部農村發展及水土保持署、財政部國產署、內政部、經濟部等。</p>\n<p>其次，今年（2024）五一勞動節，台灣跨生態保育、環境、勞動、地方創生、原住民、生態專業領域的組織，共同呼籲政府和企業應即時投資「照護自然的生態綠領就業」，讓照顧地球成為新世代的理想工作（註九）。筆者所倡議的五大政策，需要增加組織串連與行政管理、森林巡守、動植物生態、園藝、樹木照顧等專業人員，增加社區與第一線農業、林業工作者的投入，在在都需要政策和企業的資源投入。</p>\n<p>這不僅攸關2050淨零排放，更是提昇台灣生物多樣性，強化因應氣候危機的調適能力，修復生態系，優化2,300萬人民的綠生活環境品質，增加有尊嚴綠領工作的百年大計。期待卓榮泰院長的新內閣，啟動相關的規劃與社會討論，引導政府和企業投資的方向，創造邁向淨零的多重紅利。</p>\n<p><img alt=\"20240717_003.jpeg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20240717_003.jpeg\"><br>\n<p><span>「照護自然的生態綠領就業」不僅限於農業部林保署的柑關業務，更需要跨部會的盤點，整合性的對策。（李根政攝）</span></p></p>\n<p><hr></p>\n<p><table></p>\n<p><tbody></p>\n<p><tr></p>\n<p><th>註一｜</th></p>\n<p><td>台灣每年二氧化碳的移除量2,185萬公噸乃是採用<a href=\"https://www.cca.gov.tw/information-service/publications/national-ghg-inventory-report/1851.html\">《2023年國家溫室氣體排放清冊報告》</a>中2021年的數據，森林碳匯的計算方法仍有許多修正空間與缺口，並不能完全代表台灣自然碳匯移除二氧化碳之量體。但無論如何，台灣目前人為溫室氣體排放量，遠遠大於自然可以吸收的量，是無庸置疑的事實。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><th>註二｜</th></p>\n<p><td>根據環境部氣候變遷署事業溫室氣體排放平台2021年碳盤查登錄資料，台灣積體電路公司年碳排放(範疇一及範疇二合計)約為10.12MtCO2e(占全台3.4%)，台塑集團旗下台塑石化、台塑工業、台化及南亞公司共計約50.07MtCO2e(占全台16.9%)，中國鋼鐵公司則約為22.33 MtCO2e(占全台7.5%)，共計貢獻全台27.8%的碳排放。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><th>註三｜</th></p>\n<p><td><a href=\"https://pr.tsmc.com/chinese/news/2801\">台積公司啟動植樹薪傳計畫 攜手桃園、新竹、台中、台南四地市政府共同推動都市與社區綠化。</a>台灣積體電路製造股份有限公司，2021/03/12。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><th>註四｜</th></p>\n<p><td>李根政，2021。<a href=\"https://www.twreporter.org/a/opinion-taipei-biennial-afforestation-dispute\">〈北美館碳中和展覽走味的美意：大崙尾山伐木造林，為何爭議？〉</a></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><th>註五｜</th></p>\n<p><td><a href=\"https://www.agriharvest.tw/archives/114554\">〈農業碳匯優質在多重效益　碳權只是功能之一〉</a>，豐年雜誌 ，2024.4.15。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><th>註六｜</th></p>\n<p><td>戴興盛，2021。<a href=\"https://www.cet-taiwan.org/node/3985&nbsp;\">〈造林是達成臺灣碳中和的有效方法嗎〉</a>。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><th>註七｜</th></p>\n<p><td>李根政、梁聖岳、黃靖庭<a href=\"https://www.newsmarket.com.tw/blog/204574/&nbsp;\">〈從台灣的龍貓森林─安朔櫟林，看保育與農業共存，國土計畫如何發揮功效？ 〉</a>，上下游新聞市集。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><th>註八｜</th></p>\n<p><td>李根政，2023。<a href=\"https://www.twreporter.org/a/opinion-cinsbu-a-tribe-coexists-with-forest&nbsp;\">〈友善農業如何守護山林？鎮西堡部落與森林共存的學習之路〉</a>，報導者。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><th>註九｜</th></p>\n<p><td><a href=\"https://drive.google.com/file/d/1rCrewvCUo0_ooF9Q6ThXy02jdms3Hpib/view&nbsp;\">推動「修護自然的生態綠領就業」！讓照顧地球成為新世代的理想工作！</a></td></p>\n<p></tr></p>\n<p></tbody></p>\n<p></table></p>\n<p><hr></p>\n<p>本文為2024年7月17日報導者投書：<a href=\"https://www.twreporter.org/a/opinion-forest-management-and-carbon-sink\">李根政/森林碳匯非台灣減碳靈藥，我國森林管理不能只考慮碳排</a></p>"}, {"nid": 4554, "title": "0元碳費踐踏青年，經濟部、財團聯手弱國殃民", "original_topic": "抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p><img alt=\"20241011-001.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u400/20241011-001.jpg\"><br>\n<p><span>碳費給優惠 殃民弱台恐賤賣未來（圖/台灣氣候行動網絡）</span></p></p>\n<p>9月9日環境部召開第五次碳費費率審議，經濟部產業發展署竟於會中提案「優惠費率A、B」方案，最低可分別設定為0元、50元，形同大放送給予財團企業「免費碳費」，令人難以想像預計於10月7日召開的第六次碳費審議委員會，將如何踐踏台灣經濟和青年世代的未來！</p>\n<p>2050淨零碳排，早已成為全球趨勢。碳費的基本精神「污染者付費」，目的便在於將企業生產的碳排放，透過收費、課稅等經濟手段，內部化給經營者自行吸收，而不是持續外部化，讓全民買單，用納稅人的錢補貼汙染者，並讓人民與未來世代承擔極端高溫、豪雨必淹、生命財產無端遭受剝奪的氣候變遷威脅。</p>\n<h3><strong>全國人民幫繳碳費：經濟部任由財團予取予求</strong></h3>\n<p>然而，部分大財團仍停留在20世紀落伍發展思維，不只要全國人民承擔空汙、水汙、廢棄物、低廉水電的環境、社會成本，更屢屢遊說政府，乞索碳費優惠，甚至放話「綠色通膨」恐嚇民眾；經濟部理應是讓台灣產業轉型升級，攜手企業阻止氣候危機，捍衛未來世代生存發展的政府單位，竟與污染者裡應外合，提出「0元碳費」，淪為替財團營利的工具。</p>\n<p>依環境部現行規定，高碳洩漏風險產業，如台塑、中鋼、台泥等提出寬鬆的自主減量計畫，便能同時享有碳費優惠費率和「2折」的甜甜價，導致「汙染者付費」成為「污染者優惠」的怪現象，企業壓力根本不如其宣稱巨大，也無以促使產業轉型升級，善盡企業ESG責任；另一方面，全球最大的工商組織，<a href=\"https://www.cieca.org.tw/zh-tw/a2-7953/%E9%97%9C%E6%96%BC-ICC.html\">國際商會</a>（International Chamber of Commerce，ICC）的研究更已指出，<a href=\"https://iccwbo.org/news-publications/policies-reports/principles-and-proposals-for-effective-carbon-pricing/\">碳定價的實施並不會導致通膨危機</a>，試問最講究科學研調的經濟部，通膨的科學數據在哪裡？</p>\n<p>因此，產業之所以叫苦連天、遊說政府、製造通膨輿論，和經濟部攜手演出話劇，目的只有一個：「將碳費轉嫁給民眾，要全國人民幫財團繳碳費」。</p>\n<p>尤其近幾年台灣GDP大開紅盤，本土財團持續擴張，「受僱人員報酬占GDP 比重」，過去十年間從2012年的45.77%降至2022年的43.87%，「營業盈餘占GDP 比重」則由31.82%成長到34.37%，吸吮燒酒螺般吸吮海內外勞工、自然環境的巨型產業，竟然做不到「自己的汙染自己擔」，卻如巨嬰哭哭啼啼，不免讓人笑掉大牙。</p>\n<h3><strong>經濟部、財團缺乏國際觀，聯手出賣台灣競爭力</strong></h3>\n<p>根據美國環保署研究，每一噸碳排放，造成環境社會的損害，將近5,700元台幣（190元美金），相對於台灣目前規劃一般費率300~500元，至2030年逐步調升至1200~1800元的區間，不過是亡羊補牢之舉，若以此聲稱碳費扼殺經濟成長、壓得企業喘不過氣，恐只是嚴重缺乏國際觀的最佳證明。</p>\n<p>合理徵收碳費、取消不合理的優惠，不僅只是台灣躋身已開發國家，緩解氣候危機的義務，也是為了銜接<a href=\"https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism_en\">歐盟碳邊境調整機制</a>（Carbon Border Adjustment Mechanism,CBAM），避免被收取更高碳排規費，更是讓台灣長期仰賴石化產業，轉型為綠色經濟，走入國際市場，培養台灣綠色競爭力的契機。</p>\n<p>經濟部和財團的短視近利、拖延杯葛，恐怕成為「弱國」之舉，犧牲了我國國力和經濟實力。</p>\n<h3><strong>廉價碳費比氣候變遷還極端：踐踏「未來發展權」</strong></h3>\n<p>2024年是氣象記錄以來最熱的一年，每個月都在刷新過去的紀錄，8月總統府召開國家氣候變遷對策委員會，總統賴清德致詞時，引用學者表示：「人類現在所經歷的每一年夏天，都會是『餘生最涼的夏天』。」</p>\n<p>今年凱米颱風殷鑑不遠，極端氣候的威脅，早已冤魂般壟罩在台灣的上空。然而，台灣廉價優惠的碳費現況，竟比氣候變遷還極端！產業遊說銅板價，把碳費當成廟宇裡的「功德金」，當成「添油香」的慈善積德行為，視政府為無物，也視人民為玩物。</p>\n<p>碳費制度，目的不僅僅是為了保護大自然，也是為了降低產業碳排放，讓自己和未來的身家財產、人生追求、食衣住行，免於氣候變遷的威脅，能夠「永遠持續」、保留多元發展的餘地，朝向合理分配環境成本的公平社會邁進。如今，賤踏出賣「未來」的，正是「當下」目空一切、遙控政治，攫取環境社會能量，從中變現套利的吃人財團。</p>\n<p>\n<p>本文為2024年10月1日聯合新聞網投書：鄭泰鈞/<a href=\"https://udn.com/news/story/7339/8269096?fbclid=IwZXh0bgNhZW0CMTEAAR0rTUUs8uNgprU_4PO8Pb6VdjOXiT0RG0azD7LZGP-YiHzFmfUdqDmol6c_aem_LiOQDhybQ-9b8O6W3rbtWg\">碳費給優惠 殃民弱台恐賤賣未來</a></p></p>"}, {"nid": 4591, "title": "在工業起家的高雄，倡議淨零排放是一種什麼樣的感覺？──地球公民基金會第一線觀察", "original_topic": "產業轉型;抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p><img alt=\"20250109-004.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u400/20250109-004.jpg\"><br>\n<p><span>(圖/地球公民基金會）</span></p></p>\n<p>在工業起家的高雄，倡議淨零排放，是一種默默含著苦甜巧克力的感覺：是重工業使打狗走向高雄，卻也是重工業讓高雄承受著密集、龐大的汙染。工業發展的偉大，與環境汙染的煎熬，就像勞動者心中無法傾訴的苦衷，常綠植物從不喊痛。我們是時候拋下故作堅強的面具，看看一座城市壓抑的那一面。</p>\n<p>2023年6月，高雄市政府正式向自身的工業宿命，邁出了勇敢的一步。《高雄市淨零城市發展自治條例》（以下稱自治條例）終於在市議會三讀通過，讓佔全國碳排20%的高雄市，成為台北市後，第二個將地方淨零法規送出議會的城市。</p>\n<p>訂定2030年減碳30%、2050年淨零的目標，就像為自己打造健身計畫，真誠面對過去不見得健康的生活習慣──我們該給努力改變自己的人事物喝采。</p>\n<p>然而，華麗歡慶的重大政策背後，過程總是步履蹣跚。筆者作為地球公民基金會專員，曾參與自治條例的審議過程，讓我們回顧修法前到修法後的市府政策轉變，一睹高雄如何面對自身的陰霾吧！</p>\n<h3>推動淨零法案，議會不買單：空白授權、欠缺溝通，地方缺乏淨零課題盤點</h3>\n<p>2022年10月，市政府提送自治條例草案一讀通過，期間經過幾次專家學者會議、委員會討論，卻於二讀會審查時，被部分議員質疑法案明確性、社會溝通不足，一名在野黨議員質詢時指出：「應透過座談會等，邀請業者參與，才能知道自己排了多少、減了多少」，最終遭到議長擱置，遲遲等到隔年3月才又展開討論。</p>\n<p>當時的草案內容，頗為前瞻，例如明訂「新設產業園區達一定規模，需使用一定比例再生能源，2030年達2成5、2050年達8成」等。隨後我們細究停擺的緣由，除了部分議員並未詳讀條文，亦發現草案中多數條文有「空白授權」的課題：即「一定比例」、「一定額度」等均留待主責機關定之，導致法案模稜兩可，隔年重啟討論時，相關空白條文幾乎皆遭刪除，從而彰顯了2個地方淨零的課題：</p>\n<p>(1)地方欠缺淨零政策的研究：市政府因應淨零排放研擬法案，卻幾乎沒有針對「高雄」的產業特徵，做減碳策略的盤點。例如：高雄僅僅12家工業大戶，排碳即佔全市8成（如圖1），此等碳排放顯著課題，鮮少被對症下藥。若能建立地方淨零研究團隊，便能明確分析，高雄需要減多少碳；誰需要負責任、如何負責任等，法規撰擬之時，就有可循的政策資訊與路徑。</p>\n<p><img alt=\"20250109-001.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u400/20250109-001.jpg\"><br>\n<p><span>圖一:高雄市碳排大戶盤點 (地球公民基金會製圖)</span></p></p>\n<p>(2)修法過程，缺乏社會溝通的「技術」：儘管立法過程已召開數場溝通會議，然而，如何設計公聽會的「議程」、邀請「哪些對象」、「事前知情」的工作、「議題討論的方法」以及「決策機制」等等，卻幾乎沒有被審慎規劃。</p>\n<p>過去2012年首爾市推動「省下一座核電廠」第一期計畫時，便率先召集公民團體和市民一同組成市民委員會，並非只讓民眾配合活動，或是讓民眾在網路上留言申訴，而是讓公民實質參與能源計畫的擬定與執行，如此不僅能給予地方代議士、公務員更充分的資訊和信任感，更能靈活調整政策的推動方向，降低失敗風險。這在規劃公民社會與政策的互動機制，可說是成敗的關鍵。</p>\n<h3>淨零轉型，需要公民社會的民主轉型：政府主動開啟對話，方能深化政策路徑</h3>\n<p>訂定政策所<a href=\"#_msocom_1\">[1]</a>&nbsp;涉及的概念、經驗，往往相當多元、複雜，只靠政府幾個局處的公務員、滿滿選舉行程的議員，恐怕難以掌握不同利害關係人的觀點。</p>\n<p>&nbsp;2023年，地球公民基金會及主婦聯盟基金會南部辦公室，多次主動參與自治條例的公聽會，並不分黨籍拜會多位市議員，提出民間版本的修正意見書，經過數個月的公民團體倡議，讓關心淨零議題的議員獲得助力，在議會中成功說服反對意見，最終草案三讀通過。</p>\n<p>我們成功落實四項訴求，如：「確立地方淨零條例目標」，堅持2030年減碳30%、2050年淨零排放，讓地方扣合中央政府淨零目標；「修正錯誤的名詞定義」，使用明確定義的「再生能源」而非「潔淨能源」；「避免中央地方法規不相容」及「明確納入公正轉型概念」等建議，讓原先定位不明的草案更符合高雄市眾多高碳排產業的現況，並在轉型之際，事先邀請地方民眾、勞工、產業鏈下游中小企業等利害關係人溝通、盤點可能受到衝擊的熱區。</p>\n<p>然而，上述的成功關鍵，來自於積極的公民參與，換言之，搭建溝通橋樑的主角，仍不是掌握資源的市府。為了深化淨零轉型，政府有義務營造好的政策形成機制，讓民眾產生參與的「效能感」，讓「個人」的生活環保，轉向「公共」的制度討論。</p>\n<h3>化解「知行不合一」的難題，亟須事前知情、民眾培力、避免不對等的溝通</h3>\n<p>「碳排放」是一種看不見的汙染，其負面影響以全國、全球為尺度，造成氣候變遷和淨零排放，成為「高度民意共識」<a href=\"#_ftn1\">[1]</a>，卻「缺乏落實途徑」的抽象議題，即筆者標題所謂的「知行不合一」的難題。</p>\n<p>自治條例中，最重要的政策工具，莫過於碳預算（carbon budget），即高雄市目前每2年一期的「溫室氣體排放量上限」。入法後隔年，我們極力要求環保局應在氣候變遷因應推動會召開前，先開啟社會對話，並應依照自治條例中2030年減碳30%、2050年淨零的目標，規劃碳預算合理路徑（如圖2）。</p>\n<p>基於公民團體的訴求，市政府才召開<a href=\"blank\">「2025-2026碳預算草案規劃說明會」</a>，邀集地方各大企業、公民團體等，共同討論未來的減碳目標。為了避免資訊落差，我們亦建議會前、會後，均應公告相關資訊上網，未來更應擴大民眾參與，提前培力民眾閱讀資訊、參與討論。</p>\n<p><img alt=\"20250109-002.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u400/20250109-002.jpg\"><br>\n<p><span>圖二:高雄碳預算合理路徑(地球公民基金會繪製)</span></p></p>\n<h3>借鑒南韓省下一座核電廠經驗：市府應邀集NGO和企業協力，展開高雄淨零的「社會」工程</h3>\n<p>高雄市區以工業建城，根據主計處110年工業及服務業普查，高雄市工業部門從業人員高達近41萬人，佔全市近39%，生產總額3兆3,290億元，佔全市71%，說是被工業「養活」的也不為過。進一步言，正是由於工業打下的城市基礎，高雄早已具備因應氣候變遷的工程技術和資本。</p>\n<p>因此，結合自治條例中「淨零示範社區」、將調適概念納入「都市計畫」的「社會工程」，引導高雄產業鏈，建立民眾、企業、政府三方溝通協調的公共參與平台，讓「技術」、「資本與公共空間」、「公民活力」共生，將是邁向未來僅剩25年淨零時程的重中之重。</p>\n<p>地球公民基金會曾在2016年參訪南韓首爾市「省下一座核電廠」的成功政策後，參考其2012年啟動第一期計畫的公民參與機制：邀請具有社會聲望的各界人士組成「市民委員會」；以及邀請環保、教育、文化、宗教等民間團體、學界、媒體與產業代表組成「執行委員會」，以此作為範本，向市府倡議一系列結合NGO、企業與政府的行動架構（如圖3），期待透過政策討論的「民眾參與管道」，由下而上發展具體的行動策略，達到能源轉型、深化民主社會的目標。</p>\n<p>我們需要的不只是硬體設備、產業發展的科技知識，更需要發展出一套深化民主，凝聚公共意識的社會機制。淨零轉型並不是環保和產業之間的衝突課題，更是「公共利益」匯聚的過程，仰賴的是「民主治理」一詞從學理走向社會的開放實踐。</p>\n<p>當未來每一年的夏天都成為餘生最涼的夏天、每一年的颱風都是破紀錄的颱風時，高雄市除了可以透過「省下一座電廠」（不限於核能）的能源轉型為做為話題，亦能透過打造「不怕水淹」的韌性都市，運用民眾「有感」的話題，邀集利害關係人共同研擬政策，著手打開具體的政策對話，化解「知行不合一」的難題。</p>\n<p>筆者期待市政府體察民間的建議，積極援用自治條例，面對過去的產業史，在全球的共識下提前轉型，成為臺灣的淨零示範城市！</p>\n<p><img alt=\"20250109-003.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u400/20250109-003.jpg\"><br>\n<p><span>圖三:2016年地球公民倡議高雄市能源民主架構圖(地球公民基金會繪製)</span></p></p>\n<p>本文刊登於:<a href=\"https://rsprc.ntu.edu.tw/web/research/research_in.jsp?lang=tw&amp;rp_id=RP1736315802423\">臺灣大學風險社會與政策研究中心</a>, NTU及台大風險中心第52期鉅變新視界電子報</p>\n<p><hr></p>\n<p><div></p>\n<p><div></p>\n<p><a href=\"#_ftnref1\">[1]</a> <a href=\"https://rsprc.ntu.edu.tw/web/news/news_in.jsp?lang=tw&amp;np_id=NP1728290335876\">2023年台大風險民調中心</a>，指出9成以上的民意同意氣候變遷相當嚴重。</p>\n<p></div></p>\n<p></div></p>\n<p><div></p>\n<p><div></p>\n<p><div>&nbsp;</div></p>\n<p></div></p>\n<p></div></p>"}];
        
        let currentCategory = 'forest'; // 'forest' | 'climate'
        let currentSearch = '';
        let selectedNid = null;

        if (localStorage.getItem('theme') === 'light') {
            document.body.setAttribute('data-theme', 'light');
            document.getElementById('theme-icon').innerText = '🌙';
            document.getElementById('theme-text').innerText = '深色模式';
        }

        function toggleTheme() {
            if (document.body.hasAttribute('data-theme')) {
                document.body.removeAttribute('data-theme');
                localStorage.setItem('theme', 'dark');
                document.getElementById('theme-icon').innerText = '☀️';
                document.getElementById('theme-text').innerText = '明亮模式';
            } else {
                document.body.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                document.getElementById('theme-icon').innerText = '🌙';
                document.getElementById('theme-text').innerText = '深色模式';
            }
        }

        function switchCategory(cat) {
            currentCategory = cat;
            document.getElementById('tab-forest').classList.remove('active');
            document.getElementById('tab-climate').classList.remove('active');

            if (cat === 'forest') {
                document.getElementById('tab-forest').classList.add('active');
            } else {
                document.getElementById('tab-climate').classList.add('active');
            }

            selectedNid = null;
            document.getElementById('empty-state').style.display = 'flex';
            document.getElementById('detail-content').style.display = 'none';

            renderArticleList();
        }

        function onSearchInput() {
            currentSearch = document.getElementById('search-input').value.trim();
            renderArticleList();
        }

        function renderArticleList() {
            const listEl = document.getElementById('article-list');
            listEl.innerHTML = '';

            const sourceList = (currentCategory === 'forest') ? forestArticles : climateArticles;

            const filtered = sourceList.filter(art => {
                const matchesTitle = art.title.toLowerCase().includes(currentSearch.toLowerCase());
                const matchesNid = art.nid.toString().includes(currentSearch);
                return matchesTitle || matchesNid;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = '<div style="padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.88rem;">無符合搜尋條件的文章</div>';
                return;
            }

            filtered.forEach(art => {
                const item = document.createElement('div');
                item.className = `article-item ${selectedNid === art.nid ? 'active' : ''}`;
                item.onclick = () => selectArticle(art.nid);

                item.innerHTML = `
                    <div class="article-item-title">${art.title}</div>
                    <div class="article-item-meta">
                        <span>NID: ${art.nid}</span>
                        <span style="color: var(--text-muted); font-size:0.7rem;">點擊閱讀</span>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function selectArticle(nid) {
            selectedNid = nid;

            document.querySelectorAll('.article-item').forEach(item => {
                if (item.innerHTML.includes(`NID: ${nid}`)) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            const sourceList = (currentCategory === 'forest') ? forestArticles : climateArticles;
            const art = sourceList.find(a => a.nid === nid);
            if (!art) return;

            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('detail-content').style.display = 'flex';

            document.getElementById('detail-title').innerText = art.title;
            document.getElementById('detail-nid').innerText = art.nid;
            document.getElementById('detail-original-topic').innerText = art.original_topic || '無';

            const catsHtml = art.adopted_cats.map(c => `<span class="tag-badge">${c}</span>`).join(' ');
            document.getElementById('detail-adopted-cats').innerHTML = catsHtml;

            document.getElementById('detail-body').innerHTML = art.content;
        }

        renderArticleList();
    </script>
