/p></p>\n<p>然而，當地土地權屬也十分複雜，除了林保署管轄的「國有林地」、原民會管轄的「原住民保留地」、鐵路局管轄的「交通用地」……等之外，當地也有國產署管轄的「農牧用地」與「林業用地」，許多土地是20多年前或更早就出租予農民進行造林或耕作，其中大公農牧有限公司是最大的承租者，承租近140公頃，當然這片森林也是安朔與鄰近部落的傳統領域與獵場。(請參閱表一、安朔森林土地主管機關與法規)</p>\n<p><img alt=\"20240527_011.png\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20240527_011.png\"><br>\n<p>表一、安朔森林土地當前之主管機關與法規（地球公民基金會製表）</p></p>\n<p><img alt=\"20240527_003.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20240527_003.jpg\"><br>\n<p><span>圖三、當地林農伐採森林，培育椴木香菇。（傅志男攝/地球公民基金會提供）</span></p></p>\n<h3>當森林經營與植物保育發生衝突</h3>\n<p>2017年起大公農牧公司陸續向主管機關申請伐採森林，準備作為培育椴木香菇之木材，至2021年，累積砍伐約37.1公頃(將近1.5個大安森林公園面積)位於農牧用地的森林，伐採作業引起了長期於此地觀察殼斗科植物的社群關注，在「台灣橡實家族圖鑑」作者林奐慶現場勘查之後，發現砍伐樹木包含了被列為瀕臨滅絕等級（EN）的稀有植物浸水營石櫟與大武石櫟（加拉段柯）。</p>\n<p>地球公民基金會在林奐慶及董藹光、潘富哲等殼斗科生態愛好者的邀請下，深入了解案情並現地勘查，爾後透過拜會林保署本部及台東分署，促成停止核准伐採的新申請案件，林保署從善如流，啟動委託生態顧問團隊進行安朔地區的植物資源調查(請參閱表二)，邀請多位植物生態學者與公民團體進行調查報告審查，提供修正意見。</p>\n<p><img alt=\"20240527_012.png\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20240527_012.png\"><br>\n<p><span>表二、不同調查團隊調查範圍與關注項目（地球公民基金會製表）</span></p></p>\n<p><img alt=\"20240527_010.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20240527_010.jpg\"><br>\n<p><span>圖四、安朔櫟林周邊許多的保護區是生物多樣性熱點，引發爭議的南迴鐵路安朔隧道沿線區域(地球公民基金會製圖)。</span></p></p>\n<p>2020年起林保署台東分署分別委託不同的顧問與研究團隊，在安朔森林進行植物資源調查，聚焦在引發爭議的南迴鐵路安朔隧道沿線區域。根據調查結果，珍稀殼斗科樹木分布熱區主要位於鐵路西側，林保署台東分署和民間保育人士和團體、學者專家，透過協商討論，總共約150公頃的林業用地，劃為限制經營（伐採）的區域，並將撰寫經營管理計畫書，朝向由台東分署與承租人合作進行保育工作。&nbsp;</p>\n<p>此外，鑑於臺灣東南區域植群及生態研究，基礎資料之缺乏，台東分署和民間也建立共識，建議由林保署籌措經費，整合臺東、屏東兩分署，進行大尺度的植群基礎調查，做為後續保育策略擬定的參考。&nbsp;</p>\n<p><img alt=\"20240527_005.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20240527_005.jpg\"><br>\n<p><span>圖五、安朔地區於農牧用地的森林開墾情形，（傅志男攝/地球公民基金會提供）</span></p></p>\n<h3>當珍稀殼物種生長在「農牧用地」，該怎麼辦？&nbsp;</h3>\n<p>同樣具有保育價值的森林，如果長在「林業用地」、「農牧用地」的命運大不同。&nbsp;<br>\n<p>&nbsp;<br></p>\n<p>台灣的非都市土地，依《區域計畫法》劃分為共計有11種使用分區、19種用地。如果土地被編定為「林業用地」，依法要從事植林、伐林等林業活動，並維持森林狀態，不得轉為農業等利用；如果土地被劃分為「農牧用地」，依法可從事農業活動，如果在農牧用地上營造人工林或自然長出森林，地主想要砍伐，並不會受到《森林法》的限制。&nbsp;<br></p>\n<p>&nbsp;<br></p>\n<p>林保署依《森林法》管轄僅能管轄「林業用地」。如果珍稀物種出現在「林業用地」，林保署可以依據現行的《林產物伐採查驗規則》把關伐採的申請。如果進一步要求林業用地上的承租人或地主無限期停止伐木，形同放棄其經營之造林，必需要有補償標準及協商機制，否則將損害其財產權。因此，林保署可以依《具生產性私有林限制採伐補償要點》給與承租人補償來限制其伐木。&nbsp;<br></p>\n<p>&nbsp;<br></p>\n<p>但殼斗森林位於「農牧用地」上，即使發現瀕危物種或保育類昆蟲，只要符合相關水保規定就可以伐採，難以透過《森林法》規範，要求承租人保全這些森林。&nbsp;</p></p>\n<p>另一方面，安朔當地的公有出租農牧用地主要由國產署管轄，但國產署缺乏生態保育專業，除非產生重大爭議，否則其上的生態議題往往無法被識別並採取保育行動。</p>\n<p><img alt=\"20240527_013.png\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20240527_013.png\"><br>\n<p><span>圖六、被列為瀕臨滅絕等級（EN）的大武石櫟及浸水營石櫟。（傅志男攝/地球公民基金會提供）</span></p></p>\n<h3>為世界級殼斗科森林請命</h3>\n<p>2022年林保署委託台灣生態學會進行「臺灣東南區植群生態調查」，透過50多趟次的野外調查與設置上百個樣區的調查後，報告指出：安朔地區擁有26種殼斗科植物，佔全台45種殼斗科物種中的57 %，在僅佔占台灣本島約0.42 %的面積（150公頃）中被發現，而在26種殼斗科物種當中，有高達11種是特有種、近危有3種、易危有3種、瀕危有2種。</p>\n<p>調查結果認為安朔櫟林是台灣櫟林保育熱區，更是全球殼斗科植群的保育熱點。因此提出保護區劃設的倡議，期待透過大範圍的劃設，能夠將台灣殼斗科植群多樣性最高的區域與其他生物多樣性熱點串連。</p>\n<p>然而就在調查期間（2023年），大公農牧公司仍然逕行將承租地上的浸水營石礫與、加拉段柯等珍稀物種砍除，種植生薑。台灣生態學會眼見農牧用地上的殼斗森林被持續砍伐，在2023年3月發起「為世界級殼斗科森林請命」的連署行動，更也提出了劃設保護區的構想和藍圖。</p>\n<p>在連署行動之後，立法委員洪申翰在2023年6月安排民間團體和林保署及國產署進行溝通和協商，達成以下共識：&nbsp;</p>\n<p><ol></p>\n<p><li>國產署清查具保育價值森林上的租約和用地編定，並依照不同的土地樣態，採取三階段措施：&nbsp;</p>\n<p><ul></p>\n<p><li>第一階段：將無租約或為造林地租約且用地編定為林業用地的土地，從國產署移交給林保署管理。&nbsp;</li></p>\n<p><li>第二階段：將編定為農牧用地的土地，由國產署向地政機關申請辦理土地變更為林業用地後，再移交給林保署管理。&nbsp;</li></p>\n<p><li>第三階段：若土地完成變更後仍有租約，國產署將持續與承租人溝通，妥適處理租約後再移交林保署管理。另針對違約狀況亦會要求承租人改善。&nbsp;</li></p>\n<p></ul></p>\n<p></li></p>\n<p><li>國產署、林保署、承租人共商並形成保育共識：&nbsp;</p>\n<p><ul></p>\n<p><li>與承租人討論保育措施，搭配生態補償、林業多元輔導方案等政策，協助承租人進行轉型經營。&nbsp;</li></p>\n<p><li>共商台東縣國土計畫功能分區的劃分，透過土地使用管制達到櫟林保育目的。&nbsp;</li></p>\n<p><li>委託顧問公司規劃更為細緻的森林經營計畫，並且結合土地使用管制，落實保育規劃。&nbsp;</li></p>\n<p></ul></p>\n<p></li></p>\n<p></ol></p>\n<p>在許多關注安朔櫟林的環境團體倡議與參與之後，國產署意識到安朔櫟林的重要性，除了會同水土保持技師處理整地行為是否違反《水土保持法》外，也與台東縣政府協作加速用地變更程序。2023年8月初，當地60餘筆，擁有珍稀物種的土地，已從「農牧用地」轉為「林業用地」，未來將由熟悉林政業務的林保署以《森林法》進行管理。國產署也將逐步會勘、與承租人協調未來該如何在維護當地生態保育的前提下延續租約或是將租地收回，這些不同的因應措施能否將租約處理完成，是接下來要關注的重點。</p>\n<p><img alt=\"20240527_002.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20240527_002.jpg\"><br>\n<p>圖七、各個不同的公民團體透過現勘、長期調查、遊說倡議…...等方法，促成政府機關對於安朔櫟林的保育作為。（傅志男攝/地球公民基金會提供）</p></p>\n<h3>國土計畫與長期保育對策</h3>\n<p>台灣的農業、林業、保育的相關法規多是綁定「用地編定」或是「保護區劃設」，現行的法規彷彿分區劃定之後，就假定不存在其他課題，難以讓土地的功能兼容並蓄。</p>\n<p>因此，當關鍵的保育物種出現在「非保護區」，甚至與地主或承租人的土地利用發生衝突時，我們就必須思考新的保育模式，如何才能同時兼顧地主、承租人、植物保育與在地居民生計發展，期待在法規與政策之外，民間的倡議也能為台灣土地利用、森林保育注入不同的可能。</p>\n<p>2025年《國土計畫法》上路在即，不過台東縣國土計畫目前將此片土地（安朔櫟林）劃為國土功能分區中的「農業發展區」，亦即土地上的珍稀植物，將再度面臨被伐除的風險。</p>\n<p>為了保育世界級殼斗科森林，除了促請台東縣政府依該區域生態價值調整國土功能分區為「國土保育地區」之外，也可依《國土計畫法》第23條規定「國土保育地區以外之其他國土功能分區，如有符合國土保育地區之劃設原則者，除應依據各該國土功能分區之使用原則進行管制外，並應按其資源、生態、景觀或災害特性及程度，予以禁止或限制使用」，以擬定因地制宜之土地使用管制規則，並兼顧林農權益，發展森林資源多元治理方案，讓此珍貴的森林得到妥適管理。</p>\n<p>而目前全台位於農牧用地上的森林，仍缺乏合理且可行的保育機制，類似安朔櫟林的土地利用衝突仍有可能在其他地區發生，未來《國土計畫法》上路後，約有6.5萬公頃的「林業用地」將被編入農業發展區第三類（山坡地農地），在使用限制上形同降編（降低管理強度）。</p>\n<p>這些土地除了農業使用之外，如果面臨珍稀物種等重要保育課題時，就需要識別哪些是可以利用的土地，哪些是無法犧牲的棲地，從生態資源調查判斷棲地的重要性，在確認保育標的後，提出保育對策與協調土地利用，這是國土計畫上路後要面對的重要課題。</p>\n<p>2023年組改之後，農業部已是台灣最高的農業、農地以及生態保育的主管機關，需要在部內建立協助機制。同時，農牧用地上的森林也涉及了國產署及地方政府的權責，需要跨部會的溝通協助和承擔，讓國土保育與農業經營得以找出解決衝突的途徑。</p>\n<p>就安朔殼斗森林而言，經過植物的生態調查證實本區具有保育價值，在各方努力下，目前正朝向將所有土地變更為林業用地，移轉到林保署管轄，並逐步依保育價值與承租人意願回收土地。不過當代的保育行動已然無法全數賦予單一單位承擔，不同土地的權屬機關、使用土地的利害關係人、環保團體等，都可以是保育的行動者，對於自然資源的經營管理，不能如同過往期待強硬的擴編法令與權責解決一切。</p>\n<p>自2021年起，林保署逐年委託顧問團隊進行擬定安朔地區經營管理與保育計畫，了解當地森林經營的現況，並搜集承租人的想法，提出經營管理的建議。未來林保署或許可以透過國土綠網等政策工具，串連不同的土地管理機關與利害關係人，開啟政府、民間及利害關係人的對話與協力，創造具體可行、且兼顧各方權益的保育對策，讓不同角色在保育的行動上發揮不同的功能，期待透過「台灣龍貓森林--安朔櫟林」的跨部會治理、利害關係人協作，建立起台灣新的保育典範。</p>\n<p>本文感謝楊國禎副教授協助多項提供修正意見。</p>\n<p><hr></p>\n<p>本文為2024年05月24日上下游投書：<a href=\"https://www.newsmarket.com.tw/blog/204574/\">李根政、梁聖岳、黃靖庭／從台灣的龍貓森林─安朔櫟林，看保育與農業共存，國土計畫如何發揮功效？&nbsp;</a></p>"}, {"nid": 4527, "title": "創造森林與碳匯的多重紅利", "original_topic": "森林與林業政策;抗暖減碳", "adopted_cats": ["氣候變遷與調適", "森林守護與林業改革"], "content": "<p><img alt=\"20240717_001.jpeg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20240717_001.jpeg\"><br>\n<p><span>根據國發會公布的 2050淨零路徑圖，台灣全國約 219萬公頃的森林，約有 2,140萬噸的碳匯。（李根政攝）</span></p></p>\n<p>近日，環境部公告<a href=\"https://www.cna.com.tw/news/ahel/202406270329.aspx\">避免種植</a>十五種產生空污（臭氧前趨物<a href=\"https://zh.wikipedia.org/zh-tw/%E7%95%B0%E6%88%8A%E4%BA%8C%E7%83%AF\">異戊二烯</a>）的樹種，引起社會軒然大波，幾天之後，彭啟明部長邀請相關邀請專家和機關重新會商，從善如流決議<a href=\"https://www.cna.com.tw/news/ahel/202407030150.aspx\">廢止該項公告</a>，並稱「種樹是無悔的政策」，鼓勵各界持續種樹。</p>\n<p>這個事件除了突顯環境部決策過程，缺少了自然資源治理所需要的專業之外，也看到「如何種樹」是值得社會一起思考討論的課題。</p>\n<p>透過種植樹木、保留樹木來固碳，形成「森林碳匯」，一直都是非常符合直覺且擁抱大自然的減碳策略。但透過森林碳匯，到底能夠達成多少減碳效益？政府、企業只要透過多種樹，就可以解決氣候危機嗎？</p>\n<p>依照台灣的環境條件，社會需求，有哪些是能夠見樹又見林，做了一定利大於弊、不會後悔的「無悔的政策」？</p>\n<h3>什麼是台灣2050淨零排放？&nbsp;</h3>\n<p>最簡單的說法就是：2050年，台灣的碳排放量和台灣的森林、溼地、土壤等自然環境的二氧化碳吸收量（自然碳匯）是1：1，這樣就是達成淨零排放。也就是說，到2050年，台灣的自然環境有能力吸收多少碳，我們才能排放多少碳。</p>\n<p>台灣排碳多嗎？台灣是一個工業大國，2021年二氧化碳總排放量佔<a href=\"https://www.iea.org/countries/chinese-taipei/emissions\">全球0.83%，排名第22名</a>。根據環保署的統計，2021年台灣二氧化碳排放量約為2億8311萬公噸，將近當年度台灣自然碳匯二氧化碳吸存量2,185萬公噸的13倍。（註一）</p>\n<h3>台灣有可能透過森林碳匯來達成淨零排放嗎？先講結論：不可能&nbsp;</h3>\n<p>台灣土地面積狹小，人口密度高，森林覆蓋超過六成，就算積極增加森林的面積，再加上尚在研究減碳方法的土壤、溼地和海洋等，能夠吸存的碳，相較於排放量也是十分有限。國發會「<a href=\"https://ws.ndc.gov.tw/Download.ashx?u=LzAwMS9hZG1pbmlzdHJhdG9yLzEwL3JlbGZpbGUvMC8xNTA0MC8yZTZhZTA0Mi0wYjUyLTQ4OTAtOGY5NC1hYjk5MzgzNWZlZTIucGRm&amp;n=6Ie654GjMjA1MOa3qOmbtuaOkuaUvui3r%2bW%2bkeWPiuetlueVpee4veiqquaYji5wZGY%3d&amp;icon=.pdf\">2050淨零排放路徑</a>」根據2019年全國森林碳匯總量約2,140萬噸，規劃至2050年，森林碳匯每年增加110萬噸，增量約為5%。</p>\n<p>政府規劃我們花25年種樹、保育之後，在2050年時每年可以增加110萬噸的森林碳匯，大概是什麼樣的概念呢？如果換算成能夠折抵的工業排放量，110萬噸二氧化碳，大概是中鋼營運18天的排放量，更只有台塑集團營運約8天的排放量。（註二）</p>\n<p>也就是說，如果台灣要達成淨零排放，努力保有和增加自然碳匯固然重要，但是絕對不可能只靠種樹就達成淨零，而是一定要積極減少其餘超過九成且森林無法吸存的二氧化碳排放，而這些排放源主要來自於工業、住商、交通等耗能及活動。&nbsp;</p>\n<h3>企業愛種樹，減碳效果知多少？</h3>\n<p>人都有愛好自然、親近自然的本能，而因為台灣人喜愛種樹，企業種樹對於提昇形象有幫助，可以說是達成ESG價廉物美的好項目。</p>\n<p>譬如，台積電在2021年的植樹節發起「台積電植樹薪傳計畫」，由桃園、新竹、台中、台南市政府盤點規劃適宜土地給台積電栽種，截至2021年底，累積約種植了 1 萬 7,044 棵喬木與 27 萬 7,898 棵灌木，總綠化面積約 16.3 公頃，相當於0.6座大安森林公園的面積。</p>\n<p>在植樹薪傳計畫中，台積電委託了專業的景觀顧問公司和樹藝協會來協助，各縣市長都親自出席了種樹的儀式，媒體宣傳的效果很大，對於台積電原本就不錯的形象再加分。（註三）</p>\n<p>根據環境部的資料，一公頃的林地每年約可以吸收約10公噸的二氧化碳，假設台積電總綠化面積16.3公頃來換算，在種植約20年後，每年預估能夠創造約163公噸的碳匯，至於這項計畫能否取得碳權認證尚待了解。</p>\n<p>但很明確的訊息是，台積電在2021年的年排放量為1,012萬公噸，相較之下，這163公噸大概只夠抵銷台積電營運8分鐘的碳排放量。而這或許就是台積電新聞稿中，並沒有具體去提種樹可以減多少碳的原因。</p>\n<p>所以，未來如果看到企業拿「我種了很多樹」來當作努力減碳的證明，應該要小心不要被誤導、模糊焦點。企業最主要該做的，仍然是聚焦於努力減少他們生產製造的排放才對。&nbsp;</p>\n<h3>森林多元功能為主，碳匯為輔</h3>\n<p>由前述可知，碳匯不可能是台灣達成淨零的主要方法。事實上，有關種樹減碳，國際間仍然存在林業學者和生態學者的重大岐見。最典型的例子就是林業界常常主張，老齡林吸收碳匯能力，不如種植年輕小樹，但生態學界未必認同。2021年，台北市立美術館就曾發生碳中和爭議事件，由於政府林業機構的建議，台北市砍伐大崙尾山公有的天然次生林，將其改造為單一樹種的林相，目標是要折抵展覽期間390噸的碳排，此舉引起廣大爭議（註四）。</p>\n<p>事實上，國際間為了避免造假漂綠，對於種樹減碳的規範相當嚴謹，台灣目前環境部完成審查的自然碳匯方法學僅有「造林與植林碳匯專案活動」，企業要取得專案的減碳認證並不容易。對於外界的一頭熱，農業部日前還公開呼籲農民和外界不要對農業碳權有過高的期待，認為透過種樹取得碳權，投入成本不成比例。（註五）</p>\n<p>依據東華大學張世杰教授在花蓮大農大富平地森林的碳通量研究顯示，每年每公頃的碳吸存量為10.9公噸，且從空地開始造林，需要經過7~-8年的時間，森林才會從碳排放轉為碳吸存。如果是以同地區的土地，架設太陽光電單位的減碳效率，比平地造林高了53倍（註六）。</p>\n<p>從以上的討論我們可以看到，森林不應只考慮減碳的單一目標，當把森林具有的多元功能納入考量，其實是更全面的去檢視森林與土地利用的環境與社會價值，而非扁平的追求減碳效益的最大化。否則有可能就輕率導出，與其種樹不如種電的結論。</p>\n<p>考量台灣土地面積小，排碳量大的特性，增加森林碳匯空間有限的情形下，有關種樹減碳台灣策略，我認為就是「森林多元功能為主，碳匯為輔」。把提昇生物多樣性、修復生態系、林業經濟、人民生活品質和健康等多元功能為主要目標，把碳匯做為次要目標，也許可以增匯的量很少，但對環境與社會有大效益。以下筆者嘗試提出五項屬於台灣的無悔政策倡議，從企業種樹、國有林及不同區位的森林管理下手，期待與社會共同商討：</p>\n<p><strong><span>一、從愛種樹走向生物多樣性</span></strong></p>\n<p>從企業的角度，種樹對於碳匯貢獻有限，也不一定能拿來抵減多少碳排放。但如果企業可以好好的運用企業資金，引進專業團隊，多多投入森林保育和種樹，仍然可以對環境和社會產生正面貢獻。</p>\n<p>目前全球逾半GDP依賴於自然及生態系服務，生物多樣性喪失將對相關產業造成巨大衝擊。<a href=\"https://e-info.org.tw/taxonomy/term/50885\">2022年第15屆聯合國生物多樣性大會（COP15）</a>的共識，即2030年以前保護全球30%的陸域、水域物種多樣性。很需要政府與企業各界擴大在生物多樣性的投資。</p>\n<p>再以2021年台積電植樹薪傳計畫為例，其新聞稿表示：「台積公司選擇的樹苗皆為台灣原生種，以適地適種為原則，同時考量最佳適應性、高生態效益，並且維持本土物種。」就是一個值得鼓勵的作法，但仍然缺少了明確的生物多樣性策略和目標。不過，2023年，台積電發布了該公司的「生物多樣性宣言」，開始提出相關計畫，這是一個值得肯定的轉變。</p>\n<p>目前，由農業部林保署建立的「公司團體參與自然碳匯與生物多樣性保育專案媒合平臺」，由各分署提出的專案，除了新植造林之外，也納入了森林復育、森林經營，生物多樣性維護等多元的專案，是值得肯定的方向。但企業團體很可能還停留在出錢種樹、拍照、媒體報導、寫報告的模式，對於這些新類型的專案似乎還在觀望。&nbsp;</p>\n<p>如果，台灣的企業從單純的愛種樹，開始走向生物多樣性的系統化保育工作，且做出長期投入的承諾，不論是加入林保署的專案，或者自提專案，將對台灣產生更大的貢獻。</p>\n<p><img alt=\"20240717_002.jpeg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20240717_002.jpeg\"><br>\n<p><span>在台灣植樹造林減碳效果有限，但企業形象宣傳效果十足。期待企業加入生物多樣性的目標和作法，長期經營，紮實的對生態保育作出貢獻。（圖為相思樹造林，李根政攝）</span></p></p>\n<p><strong><span>二、國有林增加人力，強化社區參與</span></strong></p>\n<p>台灣的森林面積約220萬公頃，覆蓋率超過國土六成，全都納入的森林碳匯的計算。大部分是位於受到《森林法》管轄的林地，其中最為珍貴的是約163萬餘公頃的國有林，目前由林保署1,078名巡山員守護，平均每人巡守1,512公頃（2024年），照護森林的人力和投資明顯不足。除了應持續增加體制內的人員之外，更需要促進原住民部落，鄰近森林社區的參與，建立共管或伙伴關係。近年來，農業部林保署已經努力推動相關政策，但需要更有力的資金挹注。</p>\n<p><strong><span>三、18萬公頃農牧用地上的森林，提出保育對策</span></strong></p>\n<p>然而，也有不受目前《森林法》管轄的森林。位於山坡地農牧用地上約有18萬公頃的森林，依法地主或承租人可以砍伐，恢復農用。例如，位於台東達仁鄉安朔地區的珍貴櫟林，生長著瀕臨滅絕等級（EN）的稀有植物─浸水營石櫟與大武石櫟，因位在國有出租的農牧用地上，就受到砍伐的威脅（註七）。從減少碳匯損失，以及生物多樣性保育的角度，這正是保護區外的有效保育地(OECM, other effective area based conservation measures ）最為關鍵的森林課題。極待政府跨部會提出整合性的保育對策，運用政策工具與資金介入轉導，引導地主或承租人共同協力保留。</p>\n<p><strong><span>四、山坡地混林農業</span></strong></p>\n<p>台灣山坡地農業活動，存在違法超限利用，或者合法但破壞水土的慣型農法，極需推動「混林農業」及友善土地的耕種方式，同時增加森林面積、修復生態系、生物多樣性和保護水土的策略，以及促進農業與山村的永續。筆者認為新竹尖石鄉新光--鎮西堡部落，保留邊坡林帶，高達90%以上有機農業的經營模式很值得各界參考。（註八）</p>\n<p><strong><span>五、台糖部分造林地，變更為公園綠地，打造森林公園。</span></strong></p>\n<p>台糖公司配合政策的獎助造林約1萬公頃，這些土地正被一塊塊的轉為工業區，一部分土地為了轉為光電使用，引起社會極大爭議，「砍樹種電」成了太陽光電污名的指標。即便台糖公司種的是單一樹種人工林，並且設定了二十年後得以砍伐，但成林之後，已成為人們期待保留的目標。這反應了台灣城鄉地區平地森林，公園綠地的稀缺，以及人們的渴望。</p>\n<p>期待政府能夠對台糖的土地進行整體規劃，將一部分台糖鄰近社區的造林區域，變更為森林公園，朝向自然公園--生物多樣性的營造。</p>\n<h3>小結：</h3>\n<p>上述五大政策，如要能夠務實推動，仍需更細緻和完整的政策框架，政府跨部會以及公私協力，筆者建議從以下兩點著手。</p>\n<p>第一，目前台灣2050淨零排放路徑中，「自然碳匯」已納入十二項關鍵戰略，而森林碳匯仍是主要的項目。基於筆者所倡議「森林多元功能為主，碳匯為輔」的無悔政策，同時呼應《聯合國生物多樣性公約》COP15「30×30」目標，建議行政院應將「生物多樣性保育與推展」納入必須同時達成的目標，或可修改該項戰略的名稱為「自然碳匯與生物多樣性」，讓農業部林保署與跨機關、跨部會可以共同協力推動相關政策，特別是農業部農村發展及水土保持署、財政部國產署、內政部、經濟部等。</p>\n<p>其次，今年（2024）五一勞動節，台灣跨生態保育、環境、勞動、地方創生、原住民、生態專業領域的組織，共同呼籲政府和企業應即時投資「照護自然的生態綠領就業」，讓照顧地球成為新世代的理想工作（註九）。筆者所倡議的五大政策，需要增加組織串連與行政管理、森林巡守、動植物生態、園藝、樹木照顧等專業人員，增加社區與第一線農業、林業工作者的投入，在在都需要政策和企業的資源投入。</p>\n<p>這不僅攸關2050淨零排放，更是提昇台灣生物多樣性，強化因應氣候危機的調適能力，修復生態系，優化2,300萬人民的綠生活環境品質，增加有尊嚴綠領工作的百年大計。期待卓榮泰院長的新內閣，啟動相關的規劃與社會討論，引導政府和企業投資的方向，創造邁向淨零的多重紅利。</p>\n<p><img alt=\"20240717_003.jpeg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20240717_003.jpeg\"><br>\n<p><span>「照護自然的生態綠領就業」不僅限於農業部林保署的柑關業務，更需要跨部會的盤點，整合性的對策。（李根政攝）</span></p></p>\n<p><hr></p>\n<p><table></p>\n<p><tbody></p>\n<p><tr></p>\n<p><th>註一｜</th></p>\n<p><td>台灣每年二氧化碳的移除量2,185萬公噸乃是採用<a href=\"https://www.cca.gov.tw/information-service/publications/national-ghg-inventory-report/1851.html\">《2023年國家溫室氣體排放清冊報告》</a>中2021年的數據，森林碳匯的計算方法仍有許多修正空間與缺口，並不能完全代表台灣自然碳匯移除二氧化碳之量體。但無論如何，台灣目前人為溫室氣體排放量，遠遠大於自然可以吸收的量，是無庸置疑的事實。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><th>註二｜</th></p>\n<p><td>根據環境部氣候變遷署事業溫室氣體排放平台2021年碳盤查登錄資料，台灣積體電路公司年碳排放(範疇一及範疇二合計)約為10.12MtCO2e(占全台3.4%)，台塑集團旗下台塑石化、台塑工業、台化及南亞公司共計約50.07MtCO2e(占全台16.9%)，中國鋼鐵公司則約為22.33 MtCO2e(占全台7.5%)，共計貢獻全台27.8%的碳排放。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><th>註三｜</th></p>\n<p><td><a href=\"https://pr.tsmc.com/chinese/news/2801\">台積公司啟動植樹薪傳計畫 攜手桃園、新竹、台中、台南四地市政府共同推動都市與社區綠化。</a>台灣積體電路製造股份有限公司，2021/03/12。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><th>註四｜</th></p>\n<p><td>李根政，2021。<a href=\"https://www.twreporter.org/a/opinion-taipei-biennial-afforestation-dispute\">〈北美館碳中和展覽走味的美意：大崙尾山伐木造林，為何爭議？〉</a></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><th>註五｜</th></p>\n<p><td><a href=\"https://www.agriharvest.tw/archives/114554\">〈農業碳匯優質在多重效益　碳權只是功能之一〉</a>，豐年雜誌 ，2024.4.15。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><th>註六｜</th></p>\n<p><td>戴興盛，2021。<a href=\"https://www.cet-taiwan.org/node/3985&nbsp;\">〈造林是達成臺灣碳中和的有效方法嗎〉</a>。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><th>註七｜</th></p>\n<p><td>李根政、梁聖岳、黃靖庭<a href=\"https://www.newsmarket.com.tw/blog/204574/&nbsp;\">〈從台灣的龍貓森林─安朔櫟林，看保育與農業共存，國土計畫如何發揮功效？ 〉</a>，上下游新聞市集。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><th>註八｜</th></p>\n<p><td>李根政，2023。<a href=\"https://www.twreporter.org/a/opinion-cinsbu-a-tribe-coexists-with-forest&nbsp;\">〈友善農業如何守護山林？鎮西堡部落與森林共存的學習之路〉</a>，報導者。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><th>註九｜</th></p>\n<p><td><a href=\"https://drive.google.com/file/d/1rCrewvCUo0_ooF9Q6ThXy02jdms3Hpib/view&nbsp;\">推動「修護自然的生態綠領就業」！讓照顧地球成為新世代的理想工作！</a></td></p>\n<p></tr></p>\n<p></tbody></p>\n<p></table></p>\n<p><hr></p>\n<p>本文為2024年7月17日報導者投書：<a href=\"https://www.twreporter.org/a/opinion-forest-management-and-carbon-sink\">李根政/森林碳匯非台灣減碳靈藥，我國森林管理不能只考慮碳排</a></p>"}];
        const climateArticles = [{"nid": 52, "title": "台塑要脅當權，已成習慣？", "original_topic": "環境正義", "adopted_cats": ["氣候變遷與調適", "監督高雄重大污染"], "content": "<p>環保署於七月三日決定將二氧化碳排放量納入重大投資環評項目，台塑便向政府要脅：「除非政府能保證台鋼通過環評，否則不會購買新興工業區土地，台鋼也會被 迫喊停。」</p>\n<h3></h3>\n<p>李根政（2005.7.14）&nbsp;</p>\n<p>環保署於七月三日決定將二氧化碳排放量納入重大投資環評項目，台塑便向政府要脅：「除非政府能保證台鋼通過環評，否則不會購買新興工業區土地，台鋼也會被迫喊停。」接著，當謝長廷院長表示台鋼和國光石化兩大開發案，環評審查將納入二氧化碳和水資源時，近日台塑副董事長王永在便面見陳水扁總統，要求大煉鋼廠不納入二氧化碳排放新標準、縮短環評時間、適用「006688」方案等七大訴求。</p>\n<p> 政府提出的是合理的環保規範，資本家則視為障礙。觀察台塑上述要脅政府排除「障礙」的作為，完全是六輕建廠的翻版。</p>\n<p> 1986年六月，台塑集團預計於宜蘭縣利澤興建六輕廠，然而遭遇宜蘭縣民及陳定南縣長的強烈反對，迫使台塑於二年後宣佈放棄。接下來台塑便不斷以產業外移、投資中國，搭配拖延開工時程，要求政府在土地、融資、賦稅、勞工、環保、上讓步。最後，當權者完全配合，給予了六輕龐大的特權利益，例如：一、台塑不接受國有土地審定價格，要求另審地價，經濟部乃將857公頃國有地從原市價每平方公尺200元降為60元超低價賣給台塑；二、台塑要求延長適用獎勵投資條例，讓六輕及六輕擴大案均得享五年免稅優惠，政府一再破例配合；三、台塑認為水源不穩，水價太高，經濟部便興建集集堰加上專用管線及從鯉魚潭引水，並以每度3.26元超低水價補貼供應；四、台塑要求建專用港，並協助資金及免徵港工捐，政府特許全盤接受，突破海岸不得為私有的法規限制；五、台塑仍不滿足，繼續要求政府「全面開發引進外勞」，否則六輕及擴大案恐怕雇不到人，根本沒法做，於是行政院馬上核定六輕比照國建計畫享有融資與優先引進外勞的優惠；六、接著，台塑進一步要求隔離水道從500公尺縮減為100公尺，否則原先答應的長庚醫院、護專等地方建設將因沒有地方蓋而取消，面對台塑一步步威脅，政府幾乎全盤接受。所謂環評更是在當時的環保署署長指示環評制度不要成為開發障礙後，完全不顧海岸流失、漁業損失、國土破壞等影響，讓粗糙的六輕環評輕騎過關，於是八十二年七月六輕正式動工。</p>\n<p> 如今，六輕建廠已十三年，所謂創造雲林大量就業機會，演變成引進大量外籍勞工；隔離水道如其要求縮減為100公尺，但長庚醫院、醫謢社區、安養社區、購物中心、護專、客運中心、海濱休閒遊憩中心仍如空中樓閣。另一方面，當六輕建廠完成開始運轉，原本颷漲的土地價格立即暴跌，污染如影隨行，漁民叫苦連天，地方稅收少得可憐，雲林人想藉六輕脫離窮困，拉拔為繁榮工業重鎮的夢想，只剩一場空。更可議的是嘉義外傘頂洲每年消退40-70公尺，與六輕填海造脫不了關係，為供應台塑用水，使得整個區域的水資源情勢變得更加緊繃，因而當局力推重大爭議的湖山水庫案，種種後遺症簡直罄竹難書。</p>\n<p> 台塑欠雲林人的繁榮夢，欠雲林土地的環境債，已如上述。但前債未了，面對台鋼與溫室氣體效應和水資源永續利用的衝突，台塑又以面見總統，提出產業外移、投資中國等要脅當權，手法如出一轍。台灣解嚴已18年，政黨也已輪替，當初不顧社會正義，容許資本家強取豪奪的政策是否該重新反省？如果資本家富可敵國的財富，是建立在不公不義的特權和補貼之上，政府有什麼義務替其排除投資「障礙」？如果資本家的投資是以欺騙、要脅、迫害底層農、漁民，傷害環境為基礎，我們何必擔心其出走？</p>\n<p> 政府在思考台塑大煉鋼廠政策時，別忘了先算算六輕這筆帳，不要任其需索無度；國民更該睜大眼睛看看當今執政者手上的天平到底向那一端傾斜？</p>\n<p><div></p>\n<p><div></div></p>\n<p><img src=\"http://www.google.com/uds/css/small-logo.png\" alt></p>\n<p></div></p>"}, {"nid": 68, "title": "響應全球抗暖化行動----1208高雄大遊行", "original_topic": "工業污染;產業轉型;抗暖減碳", "adopted_cats": ["氣候變遷與調適", "監督高雄重大污染"], "content": "<p><img height=\"300\" src=\"/sites/cet-taiwan.org/files/u1/2070209449_6aa85c65bd_1_.jpg\" width=\"400\" loading=\"lazy\"></p>\n<p>全球75個國家；全台7個縣市共同行動；向在巴峇島開會的各國領袖，向台灣的政治人物要求對抗暖化採取行動！ 高雄需要您的加入！</p>\n<p><span><span><span><strong>〈響應全球抗暖化行動----1208高雄大遊行&gt;</strong></span></span></span></p>\n<p>\t<strong>出車騎機車，入門咳嗽聲；工業沒轉型，市民賭性命！<br>\n<p>這是高雄生活的最佳寫照，愛河燈影、城市光廊遮掩不了重工業的污染，<br></p>\n<p>我們擁有許多不願面對的第一， </strong></p></p>\n<p><ul></p>\n<p><li></p>\n<p><div>高雄市民的人均CO2排放量34.74公噸，全球第一。</div></p>\n<p></li></p>\n<p><li></p>\n<p><div>高高屏空品區的空氣品質不良比例，從有監測記錄以來，全台第一。</div></p>\n<p></li></p>\n<p><li></p>\n<p><div>高雄市各污染物單位面積排放量，全台第一。</div></p>\n<p></li></p>\n<p><li></p>\n<p><div>高雄市機車密度，每平方公里9998輛，全台第一。</div></p>\n<p></li></p>\n<p><li></p>\n<p><div>高雄市人口密度，每平方公里9862人，全台第一。</div></p>\n<p></li></p>\n<p></ul></p>\n<p><strong>但是，高污染的「超級大鄰居」，還要準備更新擴建。 </strong></p>\n<p><ul></p>\n<p><li></p>\n<p><div>中油大林廠．約增160萬噸，已通過環評。</div></p>\n<p></li></p>\n<p><li></p>\n<p><div>台電大林廠．約增480萬噸，環評近期審議中。</div></p>\n<p></li></p>\n<p><li></p>\n<p><div>中油林園廠（三輕）．約增96萬噸，環評近期審議中</div></p>\n<p></li></p>\n<p></ul></p>\n<p><strong>高雄已忍受污染數十年，此刻老舊的工廠正面臨更新、擴建，到底是要繼續發展高污染的重工業？<br>\n<p>或者積極進行產業轉型，朝向低碳新經濟發展？</strong></p></p>\n<p>在這個重要的轉捩點，需要您用行動表達我們對下一代的許諾！</p>\n<p>污染減半，綠地加倍達到法定標準，發展低碳產業，創造就業機會，這是高雄人最卑微的要求。</p>\n<p>誠摯邀請您參與1208抗暖化─高雄大遊行。</p>\n<p>\t【集合時間】2007年12月8日（星期六）14：30</p>\n<p>【集合地點】高雄市文化中心正門口外面的廣場（高雄市五福一路「五福國中」正對面）</p>\n<p>【活動時間】15：00出發 17：30解散</p>\n<p>【遊行路線】文化中心正門口廣場（五福國中正對面）→五福一路、二路、三路→城市光廊（折返集合點）<br>\n<p>→中山二路→新田路→林森二路→五福二路、一路→文化中心正門口廣場。</p></p>\n<p><strong>2007年12月8日下午2點半，文化中心正門口廣場見！</strong></p>\n<p>\t--------------------------------------------------</p>\n<p><span>污染減半、</span><span>綠地加倍！低碳新產業</span></p>\n<p>\t「出門騎機車 入門咳嗽聲 工業沒轉型 市民賭性命」──這是許許多多高雄人的日常生活寫照。長期以來，大高雄地區為了背負全台經濟發展的重擔，必須忍受北五輕（高雄煉油廠）、南三輕（林園工業區）和臨海工業區、仁大工業區、大發工業區等高污染的「超級大鄰居」經年累月地盤據在身邊，高雄市的二氧化碳總排放量佔全台的五分之一， 高雄人的人均二氧化碳排放量為34.74公噸，為台北人的5.8倍、紐約人的3.9倍，榮登全球二氧化碳人均排放量最惡名昭彰的城市，而高雄地區的人們數十年來也呼吸著全台最糟的空氣。</p>\n<p>然而，我們的政府仍然以「拼經濟」之名，持續推動高污染、高耗能的開發案，林園三輕還要增產，台電大林也即將擴建，就連白紙黑字寫下承諾要遷廠的後勁五輕也打算賴著不走。政府施政不僅完全背離全球各地為了氣候變遷而採取的抗暖化行動，對於高高屏地區數百萬人民的身家性命、健康安全，也視若無睹。高高屏承受的污染還不夠嗎？</p>\n<p>另一方面，由於政府長期漠視大眾運輸的建設，放任汽、機車等私人載具及各種公路之發展，導致空氣品質更加惡化；加上都市規劃欠缺遠見、遭利益團體左右等因素，致使都市綠地之闢建嚴重不足，截至目前為止，高雄市民所擁有的綠地面積仍遠低於法定標準（都市計畫法規定為10％，高雄市僅約5％），都會區惡劣的生活品質，實在令人難以忍受。</p>\n<p>\n<p>政府積極地打造水岸愛河、推銷港都觀光，但試問，在這番重工業包圍、大煙囪林立、空氣品質惡劣、交通擁擠混亂的城市中，有多少人真的可以悠閒地觀光？</p></p>\n<p><span><strong>我們不願再沈默，我們要求政府聽見以下的主張：</strong></span></p>\n<p><strong>1.污染減半：</strong><br>\n<p>停止任何增加二氧化碳及各種空氣污染物排放的新開發案，同時，改善現有空氣污染問題，健全大眾運輸系統，務必以污染總量減半為目標，逐年達成。</p></p>\n<p><strong>2.綠地加倍：</strong><br>\n<p>寬列經費，優先徵收、開闢已劃為公園綠地之都市計畫用地；在2010年前，將都會區公園綠地提昇至法定標準：10％。</p></p>\n<p><strong>3.低碳新經濟：</strong><br>\n<p>高雄地區應藉由中油五輕關遷之契機，積極進行產業轉型，擺脫對重化工業的依賴，發展低耗能、低污染的低碳新經濟，讓城市全面改觀。<br></p>\n<p>如果你不願坐視全球暖化的問題，也不願再忍受環境日益惡化，12月8日，請加入我們，一起大聲說出：「污染減半、綠地加倍」的主張，為自己也為下一代討回最起碼的生活品質與健康！</p></p>\n<p>【行動團體】地球公民協會、反五輕自救會、中華電信工會、中華電信職工福利委員會高雄分會、長鬃山羊單車俱樂部、高雄市野鳥學會、高雄市柴山會、高雄市綠色協會、高雄市新興社大、中華民國荒野保護協會、高雄市舊城文史協會、高雄市文化愛河協會、高雄自然讀書會、屏東縣教師會生態教育中心、高雄縣教師會、高雄市教師會、美濃愛鄉協進會、高雄縣旗美社大、環保聯盟屏東分會、台灣生態學會屏東工作站、林園反公害護家園協會、大崗山人文協會、人本教育基金會高雄分會。</p>\n<p>【行動辦公室】地球公民協會 聯絡電話：07-556-1585&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 電子信箱：<a href=\"mailto:met1208@gmail.com\">met1208@gmail.com</a></p>\n<p>【抗暖化高雄遊行 Blog】<a href=\"http://met2007.blogspot.com/\"> http://met2007.blogspot.com/</a></p>\n<p>【1208大遊行網站】<a href=\"http://blog.yam.com/climatechange/\"> http://blog.yam.com/climatechange/</a></p>\n<p>【抗暖化國際串連】 <a href=\"http://www.globalclimatecampaign.org/\">http://www.globalclimatecampaign.org/</a> <a href=\"http://www.campaigncc.org/\">http://www.campaigncc.org/</a><br>\n<p>【劃撥帳號】42237379 戶名：高雄市地球公民協會（請註明：1208高雄大遊行募款專戶）</p></p>\n<p>特別聲明：</p>\n<p><ul></p>\n<p><li></p>\n<p><div>只要符合本活動訴求，歡迎各社團、企業、學校、個人之加入，用自己的方式表達抗暖化的行動訴求。</div></p>\n<p></li></p>\n<p><li></p>\n<p><div>本遊行歡迎各政黨之總統、立委候選人參與，但不得穿著有候選人姓名或號碼之服裝，或攜帶任何競選文宣、旗幟及相關標語，選舉宣傳車亦在禁止之列。</div></p>\n<p></li></p>\n<p><li></p>\n<p><div>為響應環保，主辦單位不提供茶水，請參加者自備。 </div></p>\n<p></li></p>\n<p></ul></p>\n<p><div><img height=\"286\" src=\"/sites/cet-taiwan.org/files/u1/2048855913_38bbdd253d_o.jpg\" width=\"389\" loading=\"lazy\"></div></p>\n<p><div><img height=\"300\" src=\"/sites/cet-taiwan.org/files/u1/2.jpg\" width=\"400\" loading=\"lazy\"></div></p>"}, {"nid": 70, "title": "新娘子的遊行（涂妙沂）", "original_topic": "空氣污染;抗暖減碳;廢核", "adopted_cats": ["氣候變遷與調適", "廢核"], "content": "<p>文／涂妙沂（作家）</p>\n<p>朋友傳來明天(12/8)週六在高雄有一場響應全球抗暖化的遊行消息 。</p>\n<p>我心裡又浮現出第一次參加遊行的情景，那是1991年，我的蜜月旅行，開著車環島旅行，行經貢寮遇見反核四的運動，那天的貢寮下著微雨，我站在雨中聆聽鄉親反核四的心聲，差點忘了自己新婚的蜜月，頭髮淋了一身溼。</p>\n<p>幾天後，在台北又遇見貢寮的朋友在街頭遊行，於是加入他們捍衛家園的行動。我的涼鞋走起遠路腳痛不已，在遊行隊伍中遇見環保界的悍將陳玉峰老師，他看著我一身嬌滴滴的模樣，穿著美麗的絲質紅裙子，腳上一雙新涼鞋，頭上卻綁著布條，笑著直搖頭。我尷尬的趕緊解釋我正在度蜜月，所以一身行頭很怪異，其實是新娘子的裝扮，他臉色一愣，連忙幫我和外子拍照留念，他還想發佈新聞稿，被我攔下來。但是那張照片還留下那時的狼狽模樣。</p>\n<p>十多年過去了，人事經歷許多變遷，當年的新娘子已經成為單身族，陳玉峰老師今年也因為過度勞累宣告閉關靜修。台灣的環保議題仍然要走上街頭，那意味著許多的環境問題沒有得到良好的政策，另一方面是想透過這樣的活動，讓更多人關心全球暖化的議題。</p>\n<p>我們每天都在增加地球的負擔，無論是開馳騁公路的汽車，或是騎代步工具的機車，都無意間都走入這個地球共有的話題。</p>\n<p>七十多歲的父親每天也是騎機車上班，我和他談這個環境問題，他沈思後說:「也不早點講，無意間現在已經放那麼多廢氣給台灣了，以後會節省點啦。」</p>\n<p>父親和我的有趣對話，讓我想到告知與教育的意義，對很多人來說，其實《明天過後》還只是電影中的情節還很遙遠，必須透過對話去溝通和了解。</p>\n<p>《明天過後》其實是無意間形成的。「出門騎機車，入門咳嗽聲，工業沒轉型 ，市民賭性命」，全球的廢氣一步步要淹沒自己了，那也是無意間形成的。無意間的造惡也許無罪，卻有自覺的義務。</p>"}, {"nid": 174, "title": "別讓地球提前打烊了", "original_topic": "無", "adopted_cats": ["氣候變遷與調適"], "content": "<p>\n<p>2008年3月24日 星期一</p>\n<p></p></p>\n<p>\n<p>文/王敏玲（地球公民協會研究員）</p></p>\n<p>不知道從什麼時候開始，「跨年」成了「狂歡」的代名詞。</p>\n<p>從十二月中下旬開始，一連好幾天，有關跨年的各種演唱晚會、煙火歡慶活動佔據了各大報紙版面，連電子媒體都像廣告機一般，不論任何時段都一再放送這類「新聞」，我彷彿看到各大商家、集團為了搶食這塊節慶利潤大餅，張牙舞爪地對壓抑了一整年的台灣人伸出魔掌，更扯的是，許多縣市主管機關也帶頭「體恤」民眾，競相舉辦類似的高耗能綜藝活動。</p>\n<p>知名的跨國連鎖店如麥當勞、星巴克等更祭出了不打烊的絕招，企圖用速食與咖啡因網羅不夜城中倒數計時的民眾。</p>\n<p>然而，真正在倒數計時的，是地球。根據聯合國跨政府氣候變遷小組（IPCC）所公佈的報告指出，二氧化碳、甲烷、氧化亞氮等大氣中主要的人為排放溫室氣體，自18世紀中葉工業革命以來即大幅成長，目前，CO2的濃度已經到了65萬年來最高點，而這些新增的CO2主要就是燃燒石油、煤、天然氣等所產生的。溫室效應加劇帶來的氣候變遷問題早已經不是新聞，能源危機的報導中也經常看得見石油只剩40年可用等「警語」，這些支撐人類文明的寶藏，竟然就要在這幾代人的手中用光了。</p>\n<p>然而，我們的政府及許許多多的民眾對這樣的警語似乎仍視而不見，算一算，一個跨年狂歡，地球又要燒掉多少「存糧」？</p>\n<p>就在去年6月，為了宣傳節能、對抗地球暖化，民間團體荒野保護協會發起了一場「夏至關燈」活動，呼籲大家拔掉插頭、走到戶外，響應此活動的數十萬民眾當天晚上都熄了一個小時的燈；今(2007)年12月8日，全台各縣市民眾再度為了抗暖化而同步開走，要求政府面對問題、積極行動，也提醒民眾落實生活環保；數十年來受工業污染之苦的高雄民眾，更是高聲要求「反污染、要活命！」等心聲......。這麼多人的努力，無非是希望我們的下一代還能擁有青山綠水、還有活下去的基本條件。</p>\n<p>一夜狂歡的朋友，請想想我們所賴以維生的環境，想想下一代，別讓地球在我們這一代就打烊了。 </p>\n<p>（原文寫於2007年12月30日，精簡版登載於中國時報2008年1月3日民意論壇）\n<p></p></p>"}, {"nid": 237, "title": "編輯室小語", "original_topic": "協會訊息", "adopted_cats": ["氣候變遷與調適"], "content": "<p>\n<p>2008年3月25日 星期二</p>\n<p></p></p>\n<p>\n<p>大自然的天啟<br></p>\n<p>文:李根政/地球公民協會執行長</p></p>\n<p>新春愉快！今年的冬天特別冷，看來與暖化造成的全球氣候極端化脫不了關係，封面照片是協會的柯耀源理事在南台首岳──關山上所拍攝的冷杉照片，美麗的背後仍讓人不禁對環境的變遷憂心。</p>\n<p>從去年9月成立至今年1月，三位工作人員（根政、敏玲、淑文）在4個月內一共處理了26場對外演講；23場會議；上電視台、廣播節目7次；辦理響應全球抗暖化的高雄大遊行；2場公聽會，一場是在立法院檢討上游河川整治的問題，另一場則在高雄市議會討論台電大林廠擴廠；2場座談會、一次記者會；辦理好書福講座、小影展活動共5場次；出版1期通訊，1期教育手冊；同時也建立了協會的部落格。對於一個初生的小社團來說，能達成這麼多的工作，敏玲和淑文的全心投入與專業、義工的協助等功不可沒，成長中的協會就像新春中不斷冒出的新芽，在冷颼颼的寒冬中注入一股暖流，令人振奮。</p>\n<p>2月初，到舊好茶探望協會的「鄉下親戚」官姊和小獵人。一早，兩位就在原住民文化園區門外引導我們進入部落，穿越園區到新好茶的路上，原有的道路幾乎全消失，只能沿著河床便道行走，山壁崩塌、土石累積，到處是赤裸大地。\n<p></p></p>\n<p>\n<p>&nbsp;</p>\n<p></p></p>\n<p><div></p>\n<p><img src=\"/sites/cet-taiwan.org/files/u1/1_21.jpg\" width=\"214\" height=\"320\" loading=\"lazy\"></p>\n<p></div></p>\n<p>\n<p>&nbsp;</p>\n<p></p></p>\n<p>\n<p>這是2007年8月梧提颱風夾帶暴雨的傑作。南隘寮溪的河床墊高到新好茶部落，部落上方的坡地爆發土石流，導致四分之一住家淹沒於土石之中，一樓沒頂，二樓變一樓，幸而居民已提早撤離，無人傷亡。</p></p>\n<p>從新好茶往舊好茶的步道崩塌更為嚴重，幾處的崩塌猶如進入台灣洪荒時代開天闢地時，劇烈切割的河川之源，很難想像水利單位竟然打算在此興建一個庫容3.86億噸的瑪家水庫（湖山水庫的5倍多），幸而1997年反瑪家水庫運動成功，否則後果不堪設想。</p>\n<p>魯凱老祖先追尋雲豹腳步定居舊好茶迄今安然無恙，當今台灣人似乎完全失去這樣的智慧。年輕脆弱的地質，頻繁的地震、颱風，這是台灣基本的命格，發展聚落、觀光、開闢道路、蓋水庫，任何人為的開發行為都無法閃躲，一次次的災難都是大自然的天啟。&nbsp;\n<p></p></p>"}, {"nid": 238, "title": "響應全球抗暖化行動", "original_topic": "活動紀錄", "adopted_cats": ["氣候變遷與調適"], "content": "<p><div></p>\n<p><span>1208高雄大遊行綜合報導</span></p>\n<p></div></p>\n<p><div></p>\n<p>&nbsp;</p>\n<p></div></p>\n<p>\n<p><img src=\"/sites/cet-taiwan.org/files/u1/961208_272.jpg\" width=\"226\" height=\"341\" loading=\"lazy\"> &nbsp; &nbsp; <img src=\"/sites/cet-taiwan.org/files/u1/961208_247.jpg\" width=\"375\" height=\"249\" loading=\"lazy\"></p>\n<p></p></p>\n<p></p>\n<p>\n<p>2007年12月8日下午，高雄市文化中心廣場前氣氛異常熱鬧，散步逛街的人口猶在，但更多人綁著綠底白字的頭巾陸續集結起來。</p>\n<p></p></p>\n<p>\n<p>由地球公民協會發起，24個高高屏社團共同參與行動的「1208響應全球抗暖化行動---高雄大遊行」在當天下午兩點半熱熱鬧鬧地在文化中心廣場展開，綠底白字的頭巾寫著大家的訴求：「污染減半、綠地加倍」。本次遊行活動是高雄十多年來第一次舉辦，由地球公民協會執行長李根政及協會成員邱毓斌擔任總指揮，有近千人熱情地參加。參加者在高雄市文化中心正門廣場先進行遊行活動歌曲教唱，行動團體喊口號等熱身活動後，下午三點多遊行隊伍從文化中心正門口廣場出發，沿途行經五福一路、二路、三路，除了地球公民協會沿途積極向群眾發送文宣並製作了「產業轉型，低碳有機，簡樸新社會」教育手冊，提醒民眾落實生活環保之外，各社團也組織文宣小蜜蜂穿梭在大街小巷中，向路人發送訊息。</p>\n<p></p></p>\n<p>\n<p>本次遊行可說是不分老少，許多人甚至全家出動共襄盛舉，一位九十高齡的後勁鄉民表示，清晨三、四點就起床準備，無論如何都要來參加這次遊行活動，也有幾位國小老師帶領有意願參與的學生來到現場，熱情地跟著呼口號，年僅5歲的小朋友也在隊伍間拿著大聲公穿插著帶領群眾呼喊：污染減半，綠地加倍的口號，令人非常感動。值得一提的是，高雄市議員黃石龍與吳益政亦全程參加本次遊行活動，且遵照主辦單位的規定，並未穿著任何競選服裝，或攜帶競選文宣，受到參加者的熱烈歡迎。</p>\n<p></p></p>\n<p>\n<p>遊行隊伍中有社團以樹人、鳥人等特色裝扮參與，還有自行車載著地球一步步往前行，加上一根根趣味十足的道具煙囪等，展現多元的遊行面貌，也吸引了不少路人的目光。隊伍到城市光廊後折返文化中心廣場，發起單位地球公民協會執行長李根政發表了遊行宣言，隨後由來自社會各階層、數十位不同年齡的志願者到台前，手按地球說出自己對地球的真心承諾。</p>\n<p></p></p>\n<p>\n<p>遊行活動約於五點半歡欣而平和地結束，志工們紛紛主動收拾現場旗幟標語及道具，廣場中沒有留下一片垃圾，給市民留下美好的示範。（文/王敏玲）</p>\n<p></p></p>\n<p>\n<p>覺醒的公眾上街了</p>\n<p></p></p>\n<p>\n<p>12月8日的遊行是從1994年我到高雄以來，高高屏第一次的環境遊行；也是第一次集結環保、生態、反公害團體、工會、人文、教育團體的遊行，參與者遍及各種年齡層。為了有別於過去傳統的政治動員形式，我們刻意淡化指揮、領隊這些中央化的形式，轉而聲明歡迎各參與的社團、個人彰顯特色；雖然指揮也領著大家呼口號，唱污染歌，玩污染和綠地的波浪舞，但為的是要讓群眾有參與感，而不是強化一個領導中心。</p>\n<p></p></p>\n<p>\n<p>經過多年的環保運動，我們慢慢知道大部分的環境議題不是一個抗爭就可以解決，那必然是一個漫長的角力，而且，遊行在台灣已經不是一帖特效藥，慢慢成為常態化的公民參與形式。台北的遊行司空見慣，但在高雄，公共議題的遊行可以為沈悶的都市注入活力，喚起公眾對公共議題的重視，讓覺醒的公眾有實踐表達意見的機會，但前提是群眾自發性的參與，而不是被動員，我非常期待參與者不只是來「相挺」，而是打從心裡認同。這是1208遊行活動，我最關心的事之一。</p>\n<p></p></p>\n<p>\n<p>這是個環保節能的遊行隊伍，前導車是一台不會耗油三輪腳踏車，接著是長鬃山羊的腳踏車隊載著地球及標語的拖車、後勁的開路鼓，接著是各社團的隊伍。最耗能的是用電池的擴音設備，由義工推著嬰兒車載著到處吶喊。</p>\n<p></p></p>\n<p>\n<p>回想當天遊行的隊伍，最令我感動的畫面有：遊行過程中，幾組「小蜜蜂」不停地發送文宣，由於遊行非常吸引人，路人接過文宣後都好奇的開始閱讀，根據統計，包括遊行前一日提前發送的文宣在內，本次活動大約發出3,000份文宣，是非常難得的直接宣傳；還有長長的遊行隊伍在美麗島大道與五福路口形成一個大圓弧的壯觀畫面；再來是隊伍回到文化中心門口時，敏玲在朗讀宣言時，大伙靜靜專心聆聽的氣氛；最後是大人、小孩手按著地球，向群眾發表對地球的許諾時。</p>\n<p></p></p>\n<p>\n<p>這次遊行主題「污染減半、綠地加倍、創造新經濟」是非常在地化的訴求，遊行前，陳菊市長簽署了污染減半、綠地加倍、創造新經濟的承諾，我們了解許多的重大污染問題涉及中央的決策，因此，我們需要更多的人民給政府持續的壓力。遊行是一個開始不是結束。（文/李根政）</p>\n<p></p></p>\n<p>\n<p><img src=\"/sites/cet-taiwan.org/files/u1/IMG_3367.jpg\" width=\"303\" height=\"200\" loading=\"lazy\"> &nbsp; &nbsp; <img src=\"/sites/cet-taiwan.org/files/u1/961208_138.jpg\" width=\"302\" height=\"201\" loading=\"lazy\">&nbsp;&nbsp;</p>\n<p></p></p>\n<p>\n<p><img src=\"/sites/cet-taiwan.org/files/u1/25.jpg\" width=\"309\" height=\"195\" loading=\"lazy\"> &nbsp;&nbsp; <img src=\"/sites/cet-taiwan.org/files/u1/961208_128.jpg\" width=\"297\" height=\"198\" loading=\"lazy\"></p>\n<p></p></p>\n<p>\n<p><img src=\"/sites/cet-taiwan.org/files/u1/2_20.jpg\" width=\"305\" height=\"262\" loading=\"lazy\">&nbsp; <img src=\"/sites/cet-taiwan.org/files/u1/961208_265.jpg\" width=\"309\" height=\"202\" loading=\"lazy\"></p>\n<p></p></p>\n<p>\n<p>新娘子的遊行</p>\n<p></p></p>\n<p>\n<p>朋友傳來明天(12/8)週六在高雄有一場響應全球抗暖化的遊行消息。</p>\n<p></p></p>\n<p>\n<p>我心裡又浮現出第一次參加遊行的情景，那是1991年，我的蜜月旅行，開著車環島旅行，行經貢寮遇見反核四的運動，那天的貢寮下著微雨，我站在雨中聆聽鄉親反核四的心聲，差點忘了自己新婚的蜜月，頭髮淋了一身溼。</p>\n<p></p></p>\n<p>\n<p>幾天後，在台北又遇見貢寮的朋友在街頭遊行，於是加入他們捍衛家園的行動。我的涼鞋走起遠路腳痛不已，在遊行隊伍中遇見環保界的悍將陳玉峰老師，他看著我一 身嬌滴滴的模樣，穿著美麗的絲質紅裙子，腳上一雙新涼鞋，頭上卻綁著布條，笑著直搖頭。我尷尬的趕緊解釋我正在度蜜月，所以一身行頭很怪異，其實是新娘子<br></p>\n<p>的裝扮，他臉色一愣，連忙幫我和外子拍照留念，他還想發佈新聞稿，被我攔下來。但是那張照片還留下那時的狼狽模樣。</p>\n<p></p></p>\n<p>\n<p>十多年過去了，人事經歷許多變遷，當年的新娘子已經成為單身族，陳玉峰老師今年也因為過度勞累宣告閉關靜修。台灣的環保議題仍然要走上街頭，那意味著許多的環境問題沒有得到良好的政策，另一方面是想透過這樣的活動，讓更多人關心全球暖化的議題。</p>\n<p></p></p>\n<p>\n<p>我們每天都在增加地球的負擔，無論是開馳騁公路的汽車，或是騎代步工具的機車，都無意間都走入這個地球共有的話題。</p>\n<p></p></p>\n<p>\n<p>七十多歲的父親每天也是騎機車上班，我和他談這個環境問題，他沈思後說:「也不早點講，無意間現在已經放那麼多廢氣給台灣了，以後會節省點啦。」</p>\n<p></p></p>\n<p>\n<p>父親和我的有趣對話，讓我想到告知與教育的意義，對很多人來說，其實《明天過後》還只是電影中的情節還很遙遠，必須透過對話去溝通和了解。</p>\n<p></p></p>\n<p>\n<p>《明天過後》其實是無意間形成的。「出門騎機車，入門咳嗽聲，工業沒轉型 ，市民賭性命」，全球的廢氣一步步要淹沒自己了，那也是無意間形成的。無意間的造惡也許無罪，卻有自覺的義務。（文/涂妙沂˙作家、地球公民協會會員）（轉載自中時電子報作家部落格 <a href=\"http://blog.chinatimes.com/hwchen/\">http://blog.chinatimes.com/hwchen/</a>）</p></p>\n<p>\n<p>為生存與尊嚴而走</p>\n<p></p></p>\n<p>\n<p>老實說，在高雄<a href=\"http://met2007.blogspot.com/2007/11/1208_372.html\">參加遊行</a>實在不是一個好主意，沒別的原因，就是因為空氣糟。一個下午走下來，回到家才發現，空氣糟到連鼻屎都變成黑色的了。可是，從抗暖化的角度來看，高雄卻又是最該有遊行的地方。從後勁楠梓一帶的<a href=\"http://tw.myblog.yahoo.com/panhan3/article?mid=2691&amp;prev=2693&amp;next=2689\">重工業污染</a>，到市中心的交通污染，高雄人為了快速工業化所付出的，不單單是空氣和清水，還包括自己的身體。<br></p>\n<p>在下午等著遊行隊伍出發的時候，聽到身旁兩個阿伯在對話，他們一個來自後勁、一個來自楠梓，交換的訊息是：「你們那裡也一整條街患癌嗎？我們也是。」我看著前頭後勁工作室的旗幟，還有阿伯的側臉，心想：在高雄，環保是重要且刻不容緩的，不是為了有機與樂活，而是為了生存與尊嚴。（文/豬小草） （節錄自<a href=\"http://swalk.blogspot.com/2007/12/blog-post_08.html\">http://swalk.blogspot.com/2007/12/blog-post_08.html</a>&nbsp; 人行道遊行雜記）</p>\n<p></p></p>\n<p>\n<p>&nbsp;</p>\n<p></p></p>\n<p><table></p>\n<p><tbody></p>\n<p><tr></p>\n<p><td></p>\n<p>\n<p>小編的話：2007年1208高雄抗暖化大遊行的活動在高高屏各友會的鼎力支持下順利舉行，活動過程有許多精彩的鏡頭，非常值得回味。</p>\n<p></p></p>\n<p></td></p>\n<p></tr></p>\n<p></tbody></p>\n<p></table></p>\n<p>\n<p>&nbsp;</p>\n<p></p></p>"}, {"nid": 274, "title": "新政府上台20天，CO2「馬上」增加7％", "original_topic": "環評", "adopted_cats": ["氣候變遷與調適", "反對大林電廠"], "content": "<p><div></p>\n<p>文地球公民協會</p>\n<p></div></p>\n<p><img src=\"/sites/cet-taiwan.org/files/u1/1_33.jpg\" width=\"500\" height=\"324\" loading=\"lazy\"> 薛淑文攝</p>\n<p>在馬英九總統倡議節能減碳，行政院也信誓旦旦推出「節能減碳行動方案」之際，環保署即將於今天召開「環境影響評估審查委員會第167次會議」，其審查的案件中，包括中龍鋼鐵第二期第二階段擴建計畫、台電大林廠更新擴建計畫，皆將增加大量之碳排放，形成總統帶頭減小碳，中鋼、台電大排放之荒謬對比。</p>\n<p>\n<p>根據開發單位所提送之環評說明書顯示。中龍鋼鐵二期二階計畫共將增加約1,172萬噸之二氧化碳排放量；台電大林廠更新擴建計畫每年將增加1,079萬噸之二氧化碳排放量，兩案加總將增排約2,251萬噸，為2006年全國總排放量的7％強。</p>\n<p></p></p>\n<p>\n<p>馬英九總統上台不到20天，台灣的碳排放就增加7％。請問馬總統所承諾的「2016年到2020年間，全國二氧化碳排放量要回歸到2008年之水準；2025年要回到2000年之排放量」要如何達成？</p>\n<p></p></p>\n<p>\n<p>有鑑於此，地球公民協會聯合環保團體於環評大會當天，於場外舉辦記者會籲請馬總統除了帶頭從生活減碳外，也管管台電、中鋼這些排放大戶，從國家制度、產業政策著手改造台灣為低碳國家，否則這些日子的帶頭減碳作為，只會讓國民認為馬總統是藉6月5日環境日大作節能秀，無意真正解決台灣高碳排放的問題。</p>\n<p></p></p>"}, {"nid": 286, "title": "種樹減碳．可行嗎？", "original_topic": "知情權／資訊公開", "adopted_cats": ["氣候變遷與調適"], "content": "<p>近期中鋼、中油等國營事業紛紛在全台覓地種樹，已當選的馬英九準總統也提出造林6萬公頃的計畫，都聲稱可以抵減二氧化碳的排放，然而實際上減碳效果如何呢？</p>\n<p>文/李根政（地球公民協會執行長）</p>\n<p>&nbsp;</p>\n<p><div><img src=\"/sites/cet-taiwan.org/files/u1/1_44.jpg\" alt width=\"339\" height=\"220\" loading=\"lazy\"></div></p>\n<p>近期中鋼、中油等國營事業紛紛在全台覓地種樹，已當選的馬英九準總統也提出造林6萬公頃的計畫，都聲稱可以抵減二氧化碳的排放，然而實際上減碳效果如何呢？</p>\n<p>種樹減碳的效果取決於氣候、土壤、樹種、樹齡等等條件，難以用一個標準去衡量，依據經濟部能源局之計算方式，台灣的林相每年1公頃約可吸收20.2噸二氧化碳。（註）</p>\n<p>若以此指標檢視國內大型工業所排放的二氧化碳，需要造多大面積的森林方能抵銷？台塑六輕排放的6,755萬噸二氧化碳，需要造林面積高達334萬公頃才能抵減，正在環評審議中的台塑煉鋼廠的二氧化碳排放量，則需要74萬公頃造林地才能抵減，兩者相加，已遠超出一個台灣島的面積（360萬公頃）；而位於高雄的中鋼公司，要抵減每年排放的2,037萬噸的二氧化碳則約需100萬公頃的土地，相當於高雄、屏東、台南、嘉義等四個縣面積的總合；環評審議中的國光石化約需35萬公頃，相當於廠址所在地的雲林縣3倍的面積；台電大林廠則需約88萬公頃，比高雄、屏東、台南縣的面積還要大。（請見下頁附表）</p>\n<p>至於馬英九準總統所提出的造林6萬公頃，能吸收的二氧化碳則每年僅為120萬噸，能抵減碳排放量不到台塑煉鋼廠的十分之一；而中鋼公司聲稱目前廠區已設置48公頃綠帶，預計認養大度山20公頃造林地；中油所完成的470公頃綠化，持續種植3萬棵樹，相較於本身的巨量排放更是杯水車薪，似乎有「漂綠」之嫌。</p>\n<p><strong>調整產業結構是根本之道</strong></p>\n<p>簡而言之，相對於這些重工業所產生巨量之二氧化碳，在台灣試圖透過種樹造林減碳，是不可能達成的任務，反而模糊了問題的根源，根本的解決之道還是要調整產業結構，抑制高耗能、高污染產業的發展，否則馬準總統所訂出的2025年的二氧化碳排放要回到2008年的水準，如何達成？</p>\n<p>企業如欲將森林保護與減碳議題真正扣合，不如協助政府盡速全面收回國有、私有山林濫墾地、超限利用地，自然復育為天然林；或者善盡國際責任，保護東南亞、亞馬遜的原始森林，全力防堵可怕的濫伐，在生產過程減少碳排放才是重點。</p>\n<p>另外，每個人也可著手改變生活方式，盡可能減少非必要的消費，多多步行、單車、搭乘大眾運輸系統；愛用國貨、支持本地農產品，避免長途運輸所造成的碳排放等，共同減少碳排放是項迫切且艱難的道路，政府和企業應避免流於形式的作秀，積極的面對根本性的問題，才可能實現減碳目標。（本文原載於4月7日自由時報自由廣場）</p>\n<p><strong>台灣五項重工業種樹減碳所需土地面積表</strong><strong></strong></p>\n<p><table></p>\n<p><tbody></p>\n<p><tr></p>\n<p><td></p>\n<p>&nbsp;</p>\n<p></td></p>\n<p><td></p>\n<p>二氧化碳排放量（噸/年）</p>\n<p></td></p>\n<p><td></p>\n<p>減碳造林所需面積（公頃）</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>（1）台塑六輕四期</p>\n<p></td></p>\n<p><td></p>\n<p>67,557,259</p>\n<p></td></p>\n<p><td></p>\n<p>3,344,419</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>（2）台塑煉鋼廠</p>\n<p></td></p>\n<p><td></p>\n<p>14,900,000</p>\n<p></td></p>\n<p><td></p>\n<p>737,624</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>（1）+（2）</p>\n<p></td></p>\n<p><td></p>\n<p>82,457,259</p>\n<p></td></p>\n<p><td></p>\n<p>4,082,043</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>（3）中鋼</p>\n<p></td></p>\n<p><td></p>\n<p>20,377,750</p>\n<p></td></p>\n<p><td></p>\n<p>1,008,800</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>（4）國光石化</p>\n<p></td></p>\n<p><td></p>\n<p>7,120,000</p>\n<p></td></p>\n<p><td></p>\n<p>352,475</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>（5）台電大林廠</p>\n<p></td></p>\n<p><td></p>\n<p>17,690,000</p>\n<p></td></p>\n<p><td></p>\n<p>875,743</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>總和</p>\n<p></td></p>\n<p><td></p>\n<p>127,645,009</p>\n<p></td></p>\n<p><td></p>\n<p>6,319,061</p>\n<p></td></p>\n<p></tr></p>\n<p></tbody></p>\n<p></table></p>\n<p>&nbsp;</p>\n<p>註：經濟部能源局依照IPCC標準換算的資料，熱帶林二氧化碳的吸收量每年約12-30公噸／公頃，以台灣林相變化為基準計算，約20.2噸／年。（台塑一貫化作業煉鋼廠環境影響說明書，頁8-9）；劉秀卿（2003）計算本土海岸樹種「水黃皮」每年可吸存17.96公斤的碳，如依林務局1公頃種植2000棵樹計算，每年1公頃水黃皮純林共可吸存35.9噸碳量；另依中油網站之資訊指出，每公頃森林可吸收37噸二氧化碳量。</p>"}, {"nid": 380, "title": "善用消費者的力量", "original_topic": "生活與環境", "adopted_cats": ["氣候變遷與調適"], "content": "<p><strong><span>善用消費者的力量</span></strong></p>\n<p>文⊙謝和霖/看守台灣協會秘書長</p>\n<p>&nbsp;&nbsp;&nbsp; 近來全球金融風暴所造成的股災，讓許多投資人荷包大減，加上新政府上台前後未認清國際情勢而輕率唱言的口號，在接二連三未能兌現下，讓國人信心頓失，國內股市跌幅更是冠於全球。在信用緊縮下，這波金融風暴，可能會波及其他產業的營運，影響既深且遠；其所帶來的骨牌效應，宛若真實風暴所帶來的土石流，令在產業鏈中下游的人們戰戰兢兢。</p>\n<p>&nbsp;&nbsp;&nbsp; 我們能否安然度過這波風暴，目前尚言之過早，然而其所帶來的消費力進一步降低，已令新政府兩位首長備感壓力，但在未能提出有效對策下，僅以宣導式的帶頭買衣裝、月餅等，試圖要人民在損失慘重之餘，還要多消費，成效如何可想而知，其同黨大老批評為如同小孩玩大車。不過，從這兩位「小孩」的反應，我們知道，帶動目前這經濟體的火車頭，其實是「消費」。在消費者不再熱情捧場下，任何金融鉅子、房市大亨、電子龍頭、石化大老，都只能像無助的幼子，瑟縮著、祈求著，甚至哭嚎著。這場景令人想起聖經的啟示錄，在世界末日來臨時，那些以往不可一世、胡作非為的政治人物與有錢有勢者，蜷縮在山洞和巖穴中；這末日其實不是末日，而是重生的前奏曲；在這場金融風暴的狂風暴雨下，我們宛若聽到地球長吁了一口氣，如同日本宮崎峻卡通「神隱少女」中的河伯，在經過一場洗禮後，吐出了長久以來累積在河體中的廢棄物。</p>\n<p>&nbsp; <span><strong>善用消費者的力量</strong><strong>&nbsp;</strong></span></p>\n<p>文⊙謝和霖/看守台灣協會秘書長</p>\n<p>&nbsp;&nbsp;&nbsp; 近來全球金融風暴所造成的股災，讓許多投資人荷包大減，加上新政府上台前後未認清國際情勢而輕率唱言的口號，在接二連三未能兌現下，讓國人信心頓失，國內股市跌幅更是冠於全球。在信用緊縮下，這波金融風暴，可能會波及其他產業的營運，影響既深且遠；其所帶來的骨牌效應，宛若真實風暴所帶來的土石流，令在產業鏈中下游的人們戰戰兢兢。</p>\n<p>&nbsp;&nbsp;&nbsp; 我們能否安然度過這波風暴，目前尚言之過早，然而其所帶來的消費力進一步降低，已令新政府兩位首長備感壓力，但在未能提出有效對策下，僅以宣導式的帶頭買衣裝、月餅等，試圖要人民在損失慘重之餘，還要多消費，成效如何可想而知，其同黨大老批評為如同小孩玩大車。不過，從這兩位「小孩」的反應，我們知道，帶動目前這經濟體的火車頭，其實是「消費」。在消費者不再熱情捧場下，任何金融鉅子、房市大亨、電子龍頭、石化大老，都只能像無助的幼子，瑟縮著、祈求著，甚至哭嚎著。這場景令人想起聖經的啟示錄，在世界末日來臨時，那些以往不可一世、胡作非為的政治人物與有錢有勢者，蜷縮在山洞和巖穴中；這末日其實不是末日，而是重生的前奏曲；在這場金融風暴的狂風暴雨下，我們宛若聽到地球長吁了一口氣，如同日本宮崎峻卡通「神隱少女」中的河伯，在經過一場洗禮後，吐出了長久以來累積在河體中的廢棄物。</p>\n<p>&nbsp;&nbsp;&nbsp; 而消費者，在這場風暴中，可以是魔鬼的大軍，也可以是上帝的天使，端看我們是否要繼續聽從兩位迷信擴大內需、十二大建設、甚至一中市場的小孩，讓經濟體毫不節制地消耗地球、糟蹋地球，還是要正確使用我們的消費力，去創造出一個永續的經濟，讓我們與後代的子孫，在尊重地球生態的限制下，與萬物共存共榮。</p>\n<p>&nbsp;&nbsp;&nbsp; 在目前經濟體下，許多人在廣告刺激下，為了時髦、方便，做了不必要的消費；但在永續的經濟體下，消費者應是明智而審慎的消費，必要的消費，比如不購買隨手即丟的產品，不購買有毒害的產品（如PVC產品），並儘量在地消費，鼓勵對環境友善的在地產品（如共同購買在地有機食物），並因而培育出負責任的在地企業或市場（如農民市集）。</p>\n<p>&nbsp;&nbsp;&nbsp; 永續經濟的消費，或許培養不出富可敵國的大企業，但可減少貧富差距，讓多數人可以滿足基本的需求，同時快樂的活著，因為永續經濟講求的不是你死我活的市場競爭，只追求少數人物質生活水準的經濟成長；而是互助合作，追求人類真正的進步與福祉，讓社會變得更美好的人類發展。而我們每個消費者，都握有這改變的力量。</p>\n<p>（本文原載於看守台灣電子報）</p>\n<p>&nbsp;</p>"}, {"nid": 447, "title": "【新聞報導】馬總統減碳？薦碳？", "original_topic": "新聞報導", "adopted_cats": ["氣候變遷與調適"], "content": "<p><strong>馬總統減碳？薦碳？</strong></p>\n<p>◎李根政</p>\n<p>&nbsp;&nbsp; 全國能源會議南區會議連續二天在高雄舉行，明顯規避了幾個關鍵的課題。</p>\n<p>&nbsp;&nbsp; 馬英九總統競選期間所提出的二氧化碳減排目標：「在二○一六年到二○二○年間，讓全國二氧化碳排放量降到二○○八年的排放量，並在二○二五年回到二○○○年的排放水準。」已放入去年行政院會六月五日通過<a href=\"http://www.libertytimes.com.tw/2008/new/jun/6/today-life3.htm\">《永續能源政策綱領》</a>中，然而這次會議的引言、報告人完全不提政府各部門的減排目標、策略、計畫與期程，與會者如何提供建言？</p>\n<p>&nbsp;&nbsp;&nbsp; 今年底即將於哥本哈根舉行的COP15會議，各締約國將簽訂新的議定書，屆時台灣在減排議題上將無法再逃避責任，那麼台灣的碳排放究竟要算在誰頭上？台灣究竟要不要爭取獨立國格，還是藉此議題併入中國，淪為中國的附庸？</p>\n<p>&nbsp;&nbsp;&nbsp; 而與減排最大矛盾的是，目前推動中的中龍鋼鐵、台塑大煉鋼廠、六輕五期、國光石化等開發案，以及台電大林廠、彰工火電、深澳等燃煤電廠，都極可能在二○一六年前運轉，屆時台灣的碳排放將再增八千多萬噸，比二○○八年增加了三十％，這種先吃撐再減肥的作法，根本不可能減排。國民黨是不是想好了-反正做不到，馬總統就算連任也早已下台。</p>\n<p>（作者為地球公民協會執行長，原文完整版請見<a href=\"/\">http://met.ngo.org.tw/</a>）</p>\n<p><a href=\"http://www.libertytimes.com.tw/2009/new/mar/2/today-o7.htm\">http://www.libertytimes.com.tw/2009/new/mar/2/today-o7.htm</a></p>"}, {"nid": 456, "title": "這樣的美好還有多久？COP14/ICLEI之觀察與記錄－開幕與反思", "original_topic": "環境污染;抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p> </p>\n<p>文/王敏玲（地球公民協會副執行長）</p>\n<p>12月9日當天早上，我們與高雄來的團員到旅館一樓集合，開了簡短的團務會議，之後團員們依照計畫打算用COP14休會的這一天參加當地辦的半日遊觀光活動，根政考量到這幾天的行程都很滿，晚間多半很晚才能回到飯店，可能無暇整理資料，因此打算利用這點空檔，約略記錄一下行程所見所想以及昨日參與的周邊會議重點。於是我們準備好電腦，拿出昨日的筆記及會議資料討論了起來。時間約莫是上午10點，陽光意外地在波茲南露了臉，在波蘭這樣的北國冬季，淡淡柔柔暖暖的陽光從窗外灑進來分外嬌豔動人，我們卻在冰冷的筆電前討論會議內容，哈，有一瞬間真的覺得，認真的主管有點顧人怨。</p>\n<p>下午，與團員會合後搭乘小巴往100多公里遠的康寧（Konin）出發，準備參加ICLEI開幕典禮。沿途視野遼闊、風光美好，即使是城市，人車也不太匆忙，放眼所見是新舊夾雜的屋舍與四、五層（或五、六層）高的樓房及辦公大樓，棟距相當大，前方大半有寬闊的走道或綠地。小巴往市郊的方向行駛，人行道上常可見到獨行的老人穿著整齊、緩步前進，有些老人則牽著一條狗，細心關照、依偎的模樣，令我也首度有年老後養狗為伴的念頭。路上的年輕人多半精神抖擻、步履迅速地行走，表情則略顯嚴肅、鮮少交談——在這個國度，好像每個人都生活得很嚴謹，很清楚自己的方向和目的，只有少數站在路邊叼煙的青少年會洩露一點徬徨的眼神。可惜的是，我們抵達飯店的時間比預定稍晚，處理完行李及房間住宿後趕往會場，只聽到一些發言片段，僅取部分記載分享如下：</p>\n<p><div><img height=\"303\" src=\"/sites/cet-taiwan.org/files/u1/a_6.jpg\" width=\"411\" loading=\"lazy\"></div></p>\n<p><div><span>ICLEI開幕會場，Tryjanowski教授正在簡報。（李根政攝） </span></div></p>\n<p><div>&nbsp;</div></p>\n<p><div>一位在波茲南當地的亞當米奇維茲大學行為生態學任教的波蘭教授Piotr Tryjanowski受邀致詞時說：「我不是搞政治的，我做的是生物學的研究」他指著簡報說，「這張圖的鳥在唱歌，而這樣的美好還有多久？（此處經筆者翻譯修辭）我們的環境真的很脆弱，地球上的資源非常有限，反觀我們的消費，真的太多了，因為我們這樣消耗資源，產生的問題非常多！」這位身形瘦削的教授所講演的簡報上沒有波蘭文，只有畫家Seppo的環境卡通漫畫，簡明易懂、淡雅有趣，他又提到：「我們有交通問題，但是該如何改變人的交通習慣（行為）呢？大家應該好好思考。還有，我們製造了太多廢棄物、太多污染的水，「這張圖片看似有趣，但其實一點都不好笑，因為它可是位在一個島嶼。」</div></p>\n<p>Tryjanowski教授提醒大家該想想為什麼棲地一直消失，他表示，未來，我們每個人都要付出氣候變遷的成本，當減緩及適應暖化問題的代價不斷攀高，大家都會受害。</p>\n<p>Tryjanowski教授最後說，12月是波蘭人思考未來的時候，白色聖誕節就快到了，大家也該好好想想未來了。</p>\n<p><img height=\"265\" src=\"/sites/cet-taiwan.org/files/u1/b_3.jpg\" width=\"343\" loading=\"lazy\"></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span>翻拍自Piotr Tryjanowski的簡報（出自畫家Seppo作品）。（李根政攝） </span></p>\n<p><img height=\"265\" src=\"/sites/cet-taiwan.org/files/u1/c_4.jpg\" width=\"397\" loading=\"lazy\">&nbsp;<span><br>\n<p>David Cadman在ICLEI開幕式發表演說。（李根政攝） </span></p></p>\n<p>來自加拿大的北美地區主席David Cadman發表演說時語氣相當激昂，他說：「我們每天都看到冰河在溶解、包括格陵蘭、南墨西哥、巴西等，氣候變遷的問題無一國家能倖免，它影響我們的日常生活，風險遍及全球，我們必須做出一些基本的改變，在巴里島，我們已經規劃一份藍圖，如果缺乏國家間的通力合作，我們無法解決氣候變遷的問題，」David Cadman 引用史登(Stern)博士曾說的話表示，用全球GDP的1％來救地球，可以避免未來要花20％的代價！他高聲呼籲地方政府的合作非常重要，我們要努力去喚醒我們的國家政府，別忘了有相當高比例的人住在城市，他激動地說：「面對全球危機，我們可以有的選擇已經不多，只有全力投入，沒有失敗這個選項，呼籲大家，明年一定要去哥本哈根，而且，沒有達成協議，我們就不離開！」</p>\n<p><div><img height=\"246\" src=\"/sites/cet-taiwan.org/files/u1/d.jpg\" width=\"327\" loading=\"lazy\"></div></p>\n<p><div>&nbsp; <span>晚宴席間，根政與我和台大林子倫教授及Nigel Jollands博士合影。（王敏玲提供）</span></div></p>\n<p><div>&nbsp;</div></p>\n<p>當天晚宴前茶敘中，我與國際能源總署（International Energy Agency）的Nigel Jollands博士簡短交流，他提到，在未來，城市的節能將日形重要，因為都市化的情形在全世界都將愈來愈明顯，根據國際能源總署在2008年的統計，2030年前，居住在城市的人口將佔全球總人口的百分之60，幾乎等同於1986年時地球上所有的人口，我提到我們來自重工業城市高雄，整個城市不僅被各大工業區包圍，高雄市民還有勇冠全球的人均碳排放量，而高雄市的人口有152萬人之多，Jollands博士曾經受邀訪台，不過聽到這番「盛況」仍頻頻乍舌，我們都同意，在此「條件」下，高雄市在節能、抗暖化及提昇效率上確實有很好的努力空間！</p>\n<p><div><img height=\"302\" src=\"/sites/cet-taiwan.org/files/u1/e_0.jpg\" width=\"226\" loading=\"lazy\"></div></p>\n<p><div><img height=\"265\" src=\"/sites/cet-taiwan.org/files/u1/f.jpg\" width=\"353\" loading=\"lazy\"></div></p>\n<p><div><span>ICLEI開幕式後，豐富的晚宴佳餚。（王敏玲攝） </span></div></p>\n<p><div>&nbsp;</div></p>\n<p>晚宴開始，桌上擺滿了豐盛誘人的高檔自助餐料理，令我與根政有些吃驚，可以理解主人宴請各國遠道而來的與會賓客的好意，但接著伺者又陸續送來的主菜佳餚，就叫人有些不敢領教，一個人一餐真的要吃這麼多嗎？這些菜、肉、沙拉、麵包、點心及美酒及各式飲品，要走多遠的食物里程才能到達這裡？耕種、生產過程要噴灑多少農藥、用掉多少地球上的耕地與各種資源？唉，真不知道 Tryjanowski教授此刻作何感想。</p>\n<p>餐後回旅館房間休息時，我腦海中仍不停想起：這樣的美好還有多久？</p>"}, {"nid": 457, "title": "公平發展的權利－COP14/ICLEI之觀察與記錄", "original_topic": "環境污染;抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p> </p>\n<p>是否該將發展的門檻明文列入氣候變遷綱要公約？</p>\n<p>文/王敏玲（地球公民協會副執行長）</p>\n<p><div><img height=\"378\" src=\"/sites/cet-taiwan.org/files/u1/a_7.jpg\" width=\"319\" loading=\"lazy\"></div></p>\n<p><div>&nbsp; <span>Sivan Kartha博士於COP14周邊會議發表簡報。（李根政攝）</span></div></p>\n<p><div>&nbsp;</div></p>\n<p><div>&nbsp;</div></p>\n<p>12月8日下午3:30有一場為弱勢國家發聲的週邊會議要舉行，主題談的是在這個氣候受限(climate constrained)的世界，人民的發展權(the right to development)應得到公平的對待。我們在出發前就注意到這一場會議主題相當獨特，於是當天提早來到會場。下午3：20陸續進場的人愈來愈多，一個約可容納百人的會場很快就客滿了，有許多不同膚色的人互相比鄰、甚至席地而坐，很明顯地，這個主題吸引了處在「不同世界」的與會者重視。</p>\n<p>會場提供的書面資料是一份由EcoEqity的Paul Baer與Tom Athanasiou以及SEI的Sivan Kartha與Eric Kemp-Benedict共同發表的報告，除了EcoEqity和SEI兩個組織之外，這場會議HBS及christian aid都是這份報告的贊助者。(1)</p>\n<p>主要的報告人Sivan Kartha博士首先要大家思考：「這個世界究竟需要什麼樣的氣候體制，才能夠帶領世人面對當今氣候變遷的問題？」他很快地挑出尖銳問題指出，地球上有高達20億的人，欠缺炊煮的基本燃料，有15億人根本沒有電可以用，有10億人就連要取得潔淨的飲水都還有困難，......在此條件下，已有相當的不公平，如今國際氣候變遷會議大談各國人民都要努力減排，呼籲各國政府應致力於減緩、調適。他要大家看看這些低收入國家的人，他們連吃飽都有困難，彷如天文數字的調適成本對他們來說根本是痴人說夢！</p>\n<p>Sivan Kartha以「南方國家的兩難」為這個困境下了註腳，他提到，為了要讓全球暖化的溫升問題控制在2℃以內，許多科學家已經研究、計算出這個世界還有多少碳排放的預算空間，雖然現在一些西方先進國家努力做出某些減排承諾，但放眼未來（為了維持既有文明）各國仍不免有相當高額的碳排放量，這麼一扣下來，所剩的碳排放空間已非常有限，Sivan Kartha認為，這些剩餘的碳排放空間，窄小到根本不足以讓這些極貧國家的人民脫離貧困，再者，這些貧窮國家不僅無法取得先進國家的技術移轉、資金的協助，這些極貧的人甚至一輩子無緣走進這樣的會場，參與國際性的氣候變遷協商會議，又遑論公平？</p>\n<p><div><img height=\"448\" src=\"/sites/cet-taiwan.org/files/u1/b_4.jpg\" width=\"234\" loading=\"lazy\"></div></p>\n<p><div>&nbsp; <span>2006年11月，在肯亞奈洛比的示威場合，一位馬賽族的婦女手持海報訴求：「停止氣候不正義」。</span></div></p>\n<p><div><span>（取自本場周邊會議資料檔案）</span></div></p>\n<p><div>&nbsp;</div></p>\n<p>說到公平，Sivan Kartha用圖表與數據凸顯出「碳排放」相對於「責任」之間的問題，例如，歐盟（EU27）的人口佔全球7.3％，美國的人口僅佔了4.5％，日本只有1.9％，但是從他們的收入、碳排放比例等情況看來，他們實應分別擔負起：25.7％、33.1％和7.8％的責任（RCI）(2.)；中國有地球上19.7％的人口，其RCI為5.5％，而印度也有地球上17.2％的人口，但印度可比中國貧窮多了，其RCI只有0.5％。總計全球高收入國的RCI為77％，低收入國則有只有0.2％，此數據足以說明，對於不同排放情形的國家要課與同樣的責任，是天大的不公平！</p>\n<p>這場周邊會議相當有企圖心地提出了「溫室發展權」（GDRs）(3.)綱要，主張我們應確保在生活條件還處於貧窮線之下的人民，可以在任何氣候體制的保護之下，透過基本的溫室氣體排放權，得到發展的機會，並不只是讓他們免於貧窮，而是真正改善生活，得到基本的福利。然而，這樣的主張若要落實，唯一的路就是在聯合國氣候變遷綱要公約中，明文列入發展的門檻(development threshold)，當然，這個門檻究竟該麼訂顯然是可以（也會引起）辯論的。</p>\n<p>Sivan Kartha在報告中強調，發展的門檻應該劃在全球貧窮線(Global poverty line)，即每人每天略高於16美元的收入之上，絕非每人每天只有1或2美元的極貧線(4.)(destitution line)那麼低。這個收入水平是經過實證研究，考量到如何才能擺脫：營養不良、嬰兒高致死率、低受教率等而計算得出。這門檻可以滿足一個人的基本需求，但若與當今世人富足消費的生活相比，則遠遠不及。</p>\n<p>與會的Fernando Tudela先生也在最後重申：「沒有人可以精確的說明我們面對氣候變遷的挑戰到底有多龐大，我們應該要採取正確的方法來因應，而此一方式應具有公平性。」</p>\n<p>印度裔的Sivan Kartha博士，以字正腔圓的英文簡報，他談話簡潔快速，語氣沈穩篤定，說服力十足。這場周邊會議到了尾聲，現場座位和兩邊的樓板已經擠滿了人，與會者使用各種精良的相機、錄影機、新穎的筆電、PDA......記錄著一切，操作這些電子配備的卡擦、點擊或機器回應的電子音此起彼落、不絕於耳，弄得我有點心煩。我低頭閉眼休息，心裡想著，不知道這些高檔的文明設備，可以將第三世界的聲音傳達出去嗎？有能力生產或購買、使用這些精良電子設備的國家與人民，可能為了減緩氣候變遷、平衡貧富差距，而放棄或大幅改變他們已習以為常的文明嗎？人類是否有足夠的智慧讓遙遠的貧富兩端在因應全球災變的衝擊中真正手牽手？</p>\n<p>1.SEI全文:Stockholm Environment Institute. HBS全文: Heinrich Boll Stiftung</p>\n<p><div>2.RCI全文:Responsibility Capacity Index，聯合國以各個國家的特定收入、收入分佈、碳排放數據為基礎所計算得出之指標。</div></p>\n<p>3.GDRs全文:The Greenhouse Development Rights.</p>\n<p>4.一般也譯為貧窮線，為免混淆，此處以極貧區分。</p>"}, {"nid": 458, "title": "民間監督，當日化石獎反諷演出－cop14/ICLEI之觀察與記錄", "original_topic": "環境污染;抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p> </p>\n<p>文/王敏玲（地球公民協會副執行長）</p>\n<p><div><img height=\"264\" src=\"/sites/cet-taiwan.org/files/u1/a_8.jpg\" width=\"396\" loading=\"lazy\"></div></p>\n<p><div><span>當日化石獎公布現場，主持人與代表國家的受獎人合影。（王敏玲攝）</span></div></p>\n<p><div>&nbsp;</div></p>\n<p><div>&nbsp;</div></p>\n<p>COP14全名是:聯合國氣候變遷綱要公約第十四次締約國大會，這樣的會議當然是國際環保組織一個重要的觀察及作戰時機，一個串連世界各國環境NGO的組織「氣候行動網」(Climate Action Network,簡稱CAN)就在每年COP召開時，根據他們的成員每天在不同會場中做的第一手觀察與討論，投票選出「當日化石獎」(Fossil of the day) ，頒發給阻撓當日會議協商最力的三個國家。事實上，這個獎項從1999年在Bonn舉行COP5時就由德國NGO論壇首創，目前的組織運作由CAN統籌，每年締約國大會召開時，究竟哪一個會員國會可「榮幸」地得到他們頒發的獎項，都吸引相當多媒體的目光，當然，也形成與會國家不小的壓力。</p>\n<p>當日化石獎的標章設計與史匹伯所拍的侏邏紀公園電影中的標記非常類似，只不過換了文字，加上中間的那隻恐龍噴火了--不知是隱喻暖化得太厲害，熱得受不了，還是連恐龍都看不下去了呢？令人莞爾。不過CAN的用心良苦倒是很確定的，誠如「當日化石獎」的簡介：「由於人類大量使用化石燃料，地球的氣候正在改變，為了一個較好的未來，有許多國家努力在協商，但是，有些國家並不怎麼在乎，既然如此，我們就把他指出來......」（譯自CAN網站），這個化石獎無疑是國際環保團體不容許少數國家居間阻撓、壞了地球大事，所想出來的反諷法寶，他們藉著活潑逗趣、星光燦爛的頒獎活動（同步舉行記者會），讓世人瞭解：誰是進步的絆腳石！不過細細數來，擋在談判成功或者全球認真攜手合作之路前，大大小小的石頭，還真不少。</p>\n<p>2009年1月19日，CAN公布了在COP14期間得到「當日化石獎」的國家總排名，依順序分別是：加拿大、日本、澳大利亞、俄羅斯、紐西蘭、義大利、歐盟、美國、法國、德國、波蘭、菲律賓、沙烏地阿拉伯、烏克蘭、科威特、冰島、挪威。</p>\n<p>在國人印象中風景絕佳的觀光勝地加拿大，竟已蟬聯兩屆化石獎的冠軍，「這顆石頭」究竟怎麼了？今年因為加拿大阻撓了美國青年代表團在其布置的展示中公布一張標有加拿大在於西部亞伯達省(Alberta)開採瀝青砂的計畫圖--據了解，這個計畫將從現在開始到2020年每年排放八千萬噸的二氧化碳（預計），使加拿大根本無法達成其所承諾的二氧化碳減量目標。而此舉被加拿大代表團認為遭到嚴重冒犯，要求大會執行秘書將此展示圖撕下，行徑之惡劣引發眾怒，加上該國至今未能達成比京都議定書1990年排放基準更減百分之五的減排目標等等罪狀罄竹難書，遂一舉奪魁。CAN對於上述事件的回應是：你加拿大若願意阿殺力一點，宣布停止這樣大規模的破壞環境，我也樂於把圖取下。好個犀利又明快的NGO啊！</p>\n<p><div><img height=\"378\" src=\"/sites/cet-taiwan.org/files/u1/b_5.jpg\" width=\"252\" loading=\"lazy\"></div></p>\n<p><div><span>當日化石獎的標章設計非常有趣。（王敏玲攝）</span></div></p>\n<p><div><span></span></div></p>\n<p><div>我和根政在與會的第五天（2008年12月10日）晚上六點鐘趕到展覽大廳，CAN設於展示廳右方的第一個攤位已經簡單布置完成，攤位周邊很快地聚集了等待活動上演及宣布名單的人群與鎂光燈。首先一位年輕的男士上場，他請在場的朋友一起高喊：Fossil of the day，第一次聲量不夠，他鼓勵大家再同聲呼喊一次，第二次的喊叫聲是連蹲在地上取景的攝影師都有貢獻的，數十人的聲量果然炒熱了活動氣氛，也吸引了更多人圍觀。簡短歡迎大家蒞臨記者會後，這位先生請男、女主持人陸續登場，兩位主持人穿著簡單隆重的晚禮服出現，輕鬆幽默地致辭時，彷彿真有「XX獎」頒獎典禮之姿，接著逐一請扮演當天的第三名得主（美國），及第二名得主（法國）上場，各自帶著自己的國旗詼諧、反諷地致辭領獎。最後公布第一名得主是向來被視為環保大國的德國時，現場觀眾發出驚呼之聲，據瞭解德國此日「榮獲」冠軍，與其總理梅克爾在談判中對歐盟的氣候與能源方案(EU climate and energy package)所採取的立場及德國新近倡議的高耗能工業排放交易方案有關。</div></p>\n<p>簡單來說，整場活動是民間環保團體為了確實瞭解這些「坐在會議室的大人」有沒有好好開會、認真談判而做的監督成果報告，活動進行得相當流暢有趣，宣傳效果絕佳，相信活動背後的企畫人力相當專業、用心，而兩位主持人與三位領獎者自在逗趣的反諷功力一流，營造出的氣氛與台灣較常見到的苦情訴求大異其趣，值得參考。</p>\n<p>&nbsp;</p>"}, {"nid": 459, "title": "國際參與有賴長期耕耘 --波茲南COP14之行心得分享", "original_topic": "環境污染;抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p>文/王敏玲（地球公民協會副執行長）</p>\n<p><div><img height=\"268\" src=\"/sites/cet-taiwan.org/files/u1/met13.jpg\" width=\"403\" loading=\"lazy\"></div></p>\n<p><div><span>&nbsp; 高雄團的成員在波蘭COP14會場外合影。（李根政攝）</span></div></p>\n<p><div>&nbsp;</div></p>\n<p><div><img height=\"269\" src=\"/sites/cet-taiwan.org/files/u1/b_6.jpg\" width=\"402\" loading=\"lazy\"></div></p>\n<p><div><span>COP14 在波茲南市的大型看板簡潔鮮明。（王敏玲攝）</span></div></p>\n<p><div>&nbsp;</div></p>\n<p><div>&nbsp;</div></p>\n<p>2008年10月初，高雄市環保局告知將徵選五位高雄市的大學生及兩位環境領域的NGO人士與高雄市府代表共同組成高雄市代表團，赴波蘭參加地方政府氣候會議(LGCS)及聯合國氣候變遷綱要公約(UNFCCC)之第14次締約國會議(COP14)。個人平日雖關心氣候變遷議題，也不時留意國際動向，但倒是不曾親身參與大型的國際環境會議，得到訊息後，曾一度遲疑，後來在本會執行長根政及地球公民協會同事們的幾番鼓勵下，遂報名參與環保局為此舉辦的徵選活動。感謝環保局及評審委員不棄，才疏學淺的本人僥倖入選，因而有幸與高雄市代表團--團長為高雄市環保局劉俊一副局長，副團長為屏科大林傑教授，以及包括隨團(1.)參加的本會李根政執行長等共13人同赴波蘭參與盛會。</p>\n<p>此行第一天(12/6)代表團成員們自高雄小港機場搭機至香港，經嚴格安檢後轉德航飛往德國慕尼黑；第二天(12/7)自慕尼黑再轉機到波蘭的第四大城波茲南市--踏進這個陌生的國度，屬於東歐國家的一種獨特的秩序感與靜謐，很快就能感受得到。在寒冷、陰鬱的3-4度C中，大夥兒搭乘計程車到當地一家高檔的旅館Notus飯店休息。在長途飛行後我已經感覺相當疲累，卻因時差之故，難以入眠。</p>\n<p>第三天(12/8)一早在寬宏、昱龍兩位環保局的先遣人員帶領下，大家步行到COP14會場接受嚴格的安檢，辦理註冊與報到手續，領取現場製作的有照片、有條碼的名牌，完成後才得以進入廣大的大會會場，開始穿梭在各廳室廊道認識不同的會議區塊，然後大致瀏覽周邊展覽攤位、收集那些豐富到眼花撩亂的文宣品，接著找到舉辦周邊會議的會議廳，開始旁聽、紀錄、學習；第四天(12/9)下午（當天上午大會沒有活動）與高雄團員共同搭乘小巴趕往郊區，到人口不多的大波蘭省康寧(Konin)鎮，參加由世界各國地方政府所舉辦的ICLEI-LGCS開幕活動；第五天及第六天(12/10、12/11)又驅車回到波茲南市繼續參加LGCS和COP14的各項活動。</p>\n<p>就在終於漸漸熟悉會場、進入狀況，時差也調整得差不多時，COP14就要閉幕了（第七天，12/12)。這一天我們旁聽閉幕會議的各國代表致詞，有些是客套話連篇、了無新意，也有人慷慨陳詞，呼籲各國政要面對問題，不要再打馬虎眼，不過，時至此刻，大家都已經知道COP14幾天下來談判進展不佳，國際間對氣候變遷問題的合作幾乎是乏善可陳、原地踏步。下午我們參加完一場NGO的記者會後，快步離開佈置得雅緻精巧的歐洲區會場，照例到寄物處（已經顯得空蕩蕩的）領取寄放的大衣，迅速戴好衣帽、手套後，推開厚重的側門，步出國際會議廳，在冷冽的濛濛細雨中與高雄團員會合，到預定的當地餐廳用晚餐，再搭車回到這幾天大夥兒下褟的康寧鎮Magda旅館，晚間打包沈重的文件資料、收拾行李，準備回家。</p>\n<p>第八天(12/13)一早，漫長的返國行程開始，大夥兒提著大大小小的行李，光是從大波蘭省到繁華熱鬧的波蘭首都華沙就輾轉經歷了計程車、火車及電車的洗禮，在冷冽的溫度中折騰了好幾個小時，好不容易在台灣駐波蘭代表的協助下從華沙機場通關、登機飛往德國法蘭克福，又遇到班機延遲、一片混亂，因此在法蘭克福機場轉機時非常匆忙緊繃，擠在人滿為患的候機室等待許久後總算登機啟程，穿越歐洲的天空回到亞洲世界，再從香港轉機返回高雄小港時早已精疲力盡，對一下時間，是第九天(12/14)的下午時分了。</p>\n<p><div><img height=\"246\" src=\"/sites/cet-taiwan.org/files/u1/c_5.jpg\" width=\"369\" loading=\"lazy\"></div></p>\n<p><div>&nbsp; <span>筆者在會場與綠色和平組織的義工交流。（李根政攝）</span></div></p>\n<p><div><img height=\"246\" src=\"/sites/cet-taiwan.org/files/u1/d_0.jpg\" width=\"370\" loading=\"lazy\"></div></p>\n<p><div><span>筆者與周邊會議的報告人Sivan Kartha博士合影。（李根政攝）</span></div></p>\n<p><div>&nbsp;</div></p>\n<p>這趟行程，我們抱著學習與觀摩的心，見識到一個國家為了順利舉辦大型國際會議，幾乎傾全國之力投入，無論是街頭鮮明的標示、細心周延的人力引導、免費的接駁火車、電車、完整的當地資訊等，付出極大心血；也瞭解到國際社會對氣候變遷環境議題的關注面向之廣度與深度，有許多場周邊會議的主持、報告、資料的提供......都相當專業、完備，不僅令人刮目相看，也讓人體會到要真正做好國際參與，或是有「專業性」、「有說服力」的呈現是有賴一整個團隊長期、有規劃地下苦功耕耘的。</p>\n<p>NGO監督角色</p>\n<p>此外，各國NGO在國際會議中扮演的監督角色也令人印象深刻，團體們有的租下辦公室聯繫、討論、報導，有的定期在會議廳一邊的走廊或休息區開會分享各自的觀察或對大會談判進度檢討，也有許多團體透過各種活潑生動的方式，以靜態的展示活動（如北極熊與簡短標語、各種海報、攝影作品或兒童繪圖）、動態的倡議活動（如帶隊在休息區邊跑邊晿宣傳女性議題、定時定點辦記者會點名當日最不上道的三大遜國......），創意十足。</p>\n<p>COP14舉行的時間為期兩週，但本次高雄團與會的時間為後半段，扣除長途飛行時間，實際在會場的天數並不多，加上台灣因為缺乏國際地位，在國際會議中欠缺舞台等因素，僅能利用周邊會議會後點心時間或其它交誼機會與各國與會人士互動，相當程度限縮了台灣發聲的空間，實屬可惜。</p>\n<p>無論如何，本次參訪之見聞、震撼及獲得之資訊，本會將盡可能多方運用在日後對外推廣氣候變遷議題的教育宣導機會上（如：2008年12月份公視有話好說南部開講節目、2009年3、4月間本會受邀至各校演講、地球公民協會第五期刊物之報導與宣導、6月環境日活動、7月地球公民辦理的暑期營隊等......）。</p>\n<p>心得建議</p>\n<p>另外，此行筆者整理了幾篇粗淺的觀察報導，也提供如附供參。最後條列出幾點綜合心得與建議，提供高雄市環保局及日後有意參加COP15或相關會議之朋友參考：</p>\n<p><div><img height=\"416\" src=\"/sites/cet-taiwan.org/files/u1/clip_image002_16.jpg\" width=\"277\" loading=\"lazy\"></div></p>\n<p><div><span>國際NGO在會場舉辦Fossil of the day記者會。（王敏玲攝）</span></div></p>\n<p><div><img height=\"268\" src=\"/sites/cet-taiwan.org/files/u1/f_0.jpg\" width=\"402\" loading=\"lazy\"></div></p>\n<p><div><span>會議室外，許多年輕人席地而坐專注閱讀或討論。（李根政攝）</span></div></p>\n<p>&nbsp;&nbsp; 一、 COP是一年一度的國際大型會議，對環境領域的NGO朋友來說，能親臨會場、收集資料、與各國代表交流，感受國際間的討論氣氛，實為一寶貴機會。高雄市執掌環保之主管機關環保局能在本次會議前主動提供免費名額，鼓勵國內NGO參加會議、擴大NGO的國際視野，實屬難得，建議繼續執行，落實長期參與的可能。</p>\n<p>&nbsp;&nbsp;&nbsp;二、 有意願參加COP的朋友，行前的準備功課相當重要且繁多，雖然相當耗時，但卻能幫助一個會議的觀察者以較快的速度進入狀況，收穫也會比較豐富、深入，例如：</p>\n<p>1. 有關上一次（屆）的會議中，各個參與國家對氣候談判的態度與立場。</p>\n<p>2. 本屆大會及各次級會議即將討論的重要主題以及可能的爭議焦點。</p>\n<p>3. 本屆周邊會議林林總總的各大主題。</p>\n<p>4. 大會重要人士及周邊會議報告者的姓名、背景。</p>\n<p>5. 周邊展覽攤位的背景及其關注主題的初步認識。</p>\n<p>6. 國際環境NGO在本屆會議前、會議中可能規劃的行動、出擊的策略。</p>\n<p>三、 盡可能不要只出席大會的後半段活動，如受限於時間及經費預算等考量無法全程參與，建議應在前半段大會活動未結束前即出席部分議程，以避免僅將注意力侷限在周邊會議的內容。</p>\n<p>四、 COP在同一時間有大會、數個周邊會議、平行會議、周邊展覽、記者會、NGO討論會、特別安排的演講或影片播映等活動進行，參加者人數若不多，最好每天提早到會場領取當日議程，先花點時間瞭解、選擇、安排當日行程，如果中場休息空檔不多，最好自備少許「行動糧」以免為了張羅一餐而花費太多時間成本（展場很大，穿梭其間就很費時，且展場餐點選擇少又貴）；如果參加人數多，可分頭到不同會場參加不同主題的活動，以期較完整地收集資料。</p>\n<p>五、 參加人的住宿地點選擇及到達會場的交通最好以愈省時、愈方便為第一考量，以便參與者每日提早到達會場，晚間若無重要活動，建議盡可能在晚餐後早些回到住處，可保留些許時間整理、瀏覽當日收集的資料，或與同行者討論或擇要報導，切記，為隔天保留充足的體力非常重要。另外，因會議活動多元、緊湊，因此，盡可能在參與會議期間避免太多台灣團隊間的聯誼或其它社交性質的餐敘活動，如要安排，建議把握時間，或改在大會閉幕之後交流。</p>\n<p>六、 國際NGO在COP舉行期間所召開的會議及行動參與，顯然是國內NGO尚需努力的一環，建議先對各大國際社團、環境聯盟組織多做瞭解，如果能擇期與台灣曾派員參加過COP的NGO討論，就相關經驗及策略意見交流後再進一步評估，將更為周延。</p>\n<p>(1.)李根政先生為地球公民協會負擔費用之參訪團員。</p>"}, {"nid": 460, "title": "COP14觀察雜記", "original_topic": "環境污染;抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p>文/李根政(地球公民協會執行長)</p>\n<p>2008年12月6日，從溫暖的南台灣，搭乘了高碳排放的三班航機，共飛行一萬多公里，耗費了近24個小時，我們飛到了舉辦<a href=\"http://unfccc.int/meetings/cop_14/items/4481.php\">COP14/CMP4</a>(1.)會議的波蘭波茲南市，原本這個時節的波茲南，應該是大雪紛飛，積雪盈尺，但我們抵達時只領受到攝氏約4℃左右的低溫，丁點雪都沒有。</p>\n<p>能夠報名參與這次大會，是跟著高雄市政府組成的考察團，安排交通、住宿，再透過徐光蓉教授的介紹，用了一個總部在法國巴黎的國際NGO──HELIO的名額才得成行。儘管敏玲已在出國前的一些空檔研究了這次會議的議程和附在網路上的資料，但在完全沒有參加COP會議的經驗下，到了波茲南，我們還是像逛大觀園似的，摸索這個國際大會的空間、議程、周邊活動。儘管受限個人語言的障礙，5天的走馬看花，還是受到很大的刺激，本文試著做一些分享。</p>\n<p>氣候政治</p>\n<p>1997年通過的京都議定書，真正完全履約的附件一國家數量很少，尤其這波全球性的金融危機，各國為了解決國內的經濟、就業問題，已忙得焦頭爛額，如果減排無法推升經濟成長、增加就業，誰有意願推動？有一個國家的代表就指出，金融危機已成為因應氣候變遷的一種障礙了。</p>\n<p>去年12月，在印尼通過的「峇里路線圖」（Bali Road Map），要求各國最晚要在2009年12月召開的《氣候變遷框架公約》第15次締約國大會以及《京都議定書》第5次締約國會議（COP15/CMP5）時做出結論，達成承接《京都議定書》2012年到期後的全球抗暖化新協議。因此這次的波茲南會議，相當於是為2009年哥本哈根會議的預擬減排共識，他們形容是「踏腳石」(2.)。</p>\n<p>氣候變遷對人類的威脅猶如一個有時間表的末日進程，全球絕大多數科學家、政府、民間企業、非營利組織都明白，如果不立即減少碳排放，積極推動調適策略，全球性的大災難即將臨頭。</p>\n<p>但是，全球富裕的工業化國家，仍然不願意實踐最根本的解決方案，所發展出的碳交易、CDM等機制，只是付出少許代價、迂迴的取得持續增加排放的「權利」，讓高排放國家、企業合法的繼續破壞地球，最大獲利者可能是全球少數碳交易公司，是否真的可以減少全球碳排總量令人質疑；另一方面，中國等開發中國家，則極力爭取碳排放發展權，不願加入減排行列，邏輯很簡單：你們已在享受高碳排放的果實，為什麼我們不可以？最可憐的是那些氣候變遷下的犧牲者──低地島國、窮國（人），這些低收入國連吃飽都有困難，根本無法付出高昂的調適成本，只能卑微的向加害者─有錢的工業化國家呼籲移轉清潔發展的技術，以及援助調適的資金，後二者特別強調要根據財富及可能性，承擔「共同但有區別的責任」。</p>\n<p>把全球溫升控制在2℃以內，以防止不可逆的氣候變化是目前很重要的共識，然而根據科學家計算出的碳預算的空間，即使先進國家確實屨行其減排承諾，但仍有高額的排放，所剩碳排放空間，不足以讓這些極貧國家的人民脫離貧困。印裔美國學者Sivan Kartha的報告指出，全世界有20億的人缺少乾淨的飲食，15億人沒有電力和化石能源可以使用，基本已不公平，所以應確保處在貧窮線之下的人民，可以透過基本的溫室氣體排放權，得到基本的生活福利──溫室發展權（GDR）。</p>\n<p>NGO組織─國際氣候行動網（CAN），在會場中展示了一張海報名為「氣候戰爭（Climate War）」，呈現了氣候變遷已成為當今赤裸裸的富國與窮國、工業化國家與發展中國家之間的戰爭。但事實上，這場戰爭中，除非富裕國家願意承擔大部分的責任，否則輸家一定是窮國。</p>\n<p>結果，大會的最後二天，富裕國家代表都講些冠冕堂皇的話，反覆針對減緩（mitigation）、調適（adaptation）、技術轉移、資金這四項議題，強調自己國家的立場和承擔責任的意願和策略，但由於該負責任的國家之間歧異甚大，導致這場在波蘭的波茲南召開的氣候會議，談了二個星期，只有決議將在明年啟動對抗暖化威脅的氣候調適基金(<a href=\"http://unfccc.int/cooperation_and_support/financial_mechanism/adaptation_fund/items/3659.php\">Adaptation Fund</a>)，而其規模目前僅有約6,000萬美元，但是對於2012的減排目標仍然沒有達成任何共識。有一位女性觀察員─NGO代表，忍不住質問了一個最簡單的問題「誰能告訴我，到底還能不能生小孩？」。在這樣的氣候政治結構下，窮國、女人、小孩似乎註定是輸家，如果深入了解氣候變化的嚴重性，有誰忍心讓註定要受苦的小生命從娘胎裡蹦出來呢？</p>\n<p>COP會議上，富國盤算的是如何付出最少責任，跨國企業等利益團體則是見縫插針的尋找商機，或減少衝擊；NGO則努力在周邊會議、展場、大會使盡各種方法，對富國施壓。在這樣的會議中，台灣有沒有角色呢？</p>\n<p>台灣的COP14團</p>\n<p>這次的台灣代表團成員，團長是曾任環保署署長，現任台灣永續能源研究基金會的簡又新董事長，成員包括了環保署溫減辦公室（呂鴻光執祕、簡慧貞技正）、外交部、經建會、經濟部能源局、工業局、衛生署駐歐盟辦事處、農委會林務局、交通運研所、工研院能源與環境研究所、台電、中油、中鋼、台灣半導體產業協會等公私部門的代表數人；學者部分是清大的范建得教授，台大的鄭福田、邱祈榮、林子倫教授，台科大的顧洋教授，台北大學的李堅明教授，還有承包安排這次行程的永智和環科顧問公司。由這份加總近40人的名單可以看出，台灣官方團的產業界和經濟部門色彩非常濃厚。地方政府方面，高雄市政府環保局劉俊一副局長領隊，含環保局、顧問公司、5位大學生、2位NGO共13人，台北縣政府也派出了2人與會。</p>\n<p>民間團體這邊，除了我們參與了高雄市政府團，清大的學生則由林子倫教授協助徵選，以Green Club名義參與；徐光蓉教授、佳芬以法國團體HELIO名義參與，另外還有台達電基金會的張揚乾先生也與會。李河清教授和張揚乾先生是有經驗的參與者，他們寫了幾篇COP14會議的報導和觀察，很值得一讀。</p>\n<p>我們在波茲南的第一夜，駐波蘭代表宴請了台灣去的團體；隔二天中午，環保署又請我們吃了中餐進行交流，在異鄉與同胞聚會固然有些許溫暖，但是卻少了實質的交流。環保署和工研院在IETA租的展場，文宣品擺得稀稀落落，充其量只能算個休息站，對於首度與會的我們來說，最想了解的是整個會議的狀況，因此，我們沒有花時間去了解環保署在這些周邊會議上的發言。這段期間，環保署發了4 份聲明稿，說明他們參與情形，從中可以看出環保署對外宣傳的重點在於：1.重大產業開發案於環境影響評估時的減量抵換制度，希望建構一個能與國際市場接軌的自願減量市場；2.推動溫室氣體減量法與再生能源發展條例；3.依據溫減法建立的自願減量市場交易機制。很可惜，台灣的NGO沒有人可以在會場表達NGO對這些議題的看法，藉機給政府壓力。</p>\n<p>精神分裂的台灣</p>\n<p>身為富裕國家之列的台灣，碳排放占了全球1％，意味著如果將來出現100萬的氣候難民，其中，有1萬人是台灣所加害的。然而，因為台灣不是聯合國會員，一直未被要求列入減量的國家，經濟官員可能暗自竊喜──因為台灣的排放量會被計算入中國而被國際忽略，我們可以靠10億中國人口分攤或稀釋責任，因此，台灣仍在肆無忌憚的擴張高污染的石化、鋼鐵業及燃煤電廠，讓碳排放倍數成長，簡單說：在減排這項國際責任，台灣根本不想承認自己是個國家；但另一方面，政府卻一直想要在聯合國、衛生、貿易等國際組織爭取空間，強調是自主的政治實體。</p>\n<p>我們像是個雙重人格、精神分裂，鬼鬼祟祟的生意人。</p>\n<p>在COP14的大會議上，一些國際NGO以觀察員的身分擁有發言權，但我們這個隱形國家的代表團，只能在IETA的周邊會議上與各國和跨國企業交流，在大會場則完全是是旁觀者。台灣的代表團，包括環保署以官方邀請的學者專家一直都是以工研院（ITRI）所加入的國際碳排放交易協會（IETA）名義參與，諷刺的是，IETA是由29個跨國企業所組成，成員包括BP，SHELL等石油公司，據了解，工研院能資所是在環保署協助下申請加入該協會會員。</p>\n<p>一個國家最高環保機關，竟加入由跨國石油公司所組成的國際組織去參加氣候變遷會議，其角色實在是非常的詭異與荒誕。也難怪，我們的環保署官員面對減碳問題，會與工業局沆瀣一氣，始終在清潔發展機制和碳交易等技術層次打轉，不面願對產業結構必需調整的根本課題。</p>\n<p>關於這兩項機制，我個人的觀察是，清潔發展機制或許可以提昇能源效率，改善污染，但很難減少資源耗用，就像油電混合車所省下的油，趕不上汽車數量成長的耗油；而碳交易只是讓工業化國家持續消耗地球資源的粉飾工具，在欠缺各國總量配額、人均配量的情況下，其成效和公平性令人質疑。</p>\n<p>COP14之後</p>\n<p>台灣雖然是氣候災難的加害者之一，但我們大部分人口都集中於西部沿海地區，所以也將是受害者。當全世界都在大談如何適應之際，我們在國土規劃、都市設計、糧食安全、能源安全上的法令和政策，連基本的生存問題幾乎都交了白卷。我們拼經濟拼到連命都不要，其短視的程度令人汗顏。我認為：國內除了討論溫室氣體減量外，應即刻籌劃適應的策略。</p>\n<p>另外，在國際責任的體現上，如果能改變現有對友邦的金援方向，導向減少毀林，協助當地發展再生能源，透過友邦在COP會議上發表成果，是展現台灣負責任態度的絕佳曝光場合，比起拿錢去收買友邦政要更有實質效益。</p>\n<p>這次會後，我有一個最直接的體會：面對氣候變遷這項可預見的全球大災難，環保運動其實是在為人類能否繼續生存而戰，我們應該以此層次設法喚起人民共鳴。</p>\n<p>在匆忙趕場中，COP14會議在12日劃下句點，眼看會場上人潮不再，我和敏玲竟有些感傷。什麼原因呢？是那些坐在走廊、會場地板上，拿著筆電專注於聽講、討論的那些年輕人；會場上各國政府官員、學者專家齊聚一堂嚴肅的討論；場內外NGO的倡議活動、記者會...，種種討論氣候議題的熱絡氣氛，或者，是一種全人類共同面對困難的歸屬感？</p>\n<p>國際NGO組織在COP14上展現了相當的實力，綠色和平在場內有發言空間，在波茲南、華沙的場也有行動，他們在會場內租下一個臨時辦公室，與各國官方辦公室同一棟，我們看到十幾位義工正在製作文宣；國際氣候行動網（CAN）每天都發佈新聞稿，並且召開有趣的記者會（Fossil of the day），每天公布表現最差的前三名國家，這些行動的背後，必有相當的事前準備與後勤系統支援。在這種近萬人參與的大型會議，以目前台灣NGO與會的人手，大概只能去學習觀摩。已經連續參加數屆COP的徐光蓉教授謙稱，連她都還沒完全搞清楚COP的議程，對於很專業的討論內容也未必都了解，遑論我們這些菜鳥？</p>\n<p>在返國的長程飛機上，腦中不斷翻騰一些基本命題和實踐想像：例如用什麼方法可以餵養60億以上的人口，而不損及生態系的存續？如何平等的提昇全體人類的福祉？目前低碳排放國家有沒有辦法跨過由石化經濟，直接過渡到低碳經濟？這次的旅程有沒有機會回饋到國內的工作？台灣的NGO在氣候變遷上可以做出的貢獻是什麼？</p>\n<p>(1.)聯合國氣候變化綱要公約第14次締約國大會暨京都議定書第4次締約國會議。</p>\n<p>(2.)本次會議主要討論議題，包括推動峇里島路線圖的行動規劃、已開發國家在2012年後之溫室氣體減量責任、氣候變遷衝擊調適、技術轉移與資金支持、降低毀林所造成之溫室氣體排放(REDD)、開發中國家能力建構與調適行動、彈性機制與全球碳市場發展等，希望2009年底在丹麥哥本哈根舉行之COP15/CMP5時，可以完成新的全球氣候協議。</p>"}, {"nid": 491, "title": "COP14雜記--觀察與反省", "original_topic": "能源轉型;抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p>文☉李根政(地球公民協會執行長)</p>\n<p>2008年12月6日，搭乘了高碳排放的三班航機，共飛行一萬多公里，耗費了近24個小時，我們飛到了舉辦<a href=\"http://unfccc.int/meetings/cop_14/items/4481.php\">COP14/CMP4</a>(註1)會議的波蘭波茲南市，原本這個時節的波茲南，應該是大雪紛飛，積雪盈尺，但我們抵達時只領受到攝氏約4℃左右的低溫，一丁點雪都沒有。</p>\n<p>能夠報名參與這次大會，是跟著高雄市政府組成的考察團，透過徐光蓉教授的介紹，用了一個國際NGO（HELIO）的名額才得成行。在沒有參加過COP的經驗下到了波茲南，我們像逛大觀園似的，摸索這個國際會議的空間、議程、周邊活動。</p>\n<p>1997年通過的京都議定書，真正完全履約的附件一國家數量很少，尤其這波全球性的金融危機，各國為了解決國內的經濟、就業問題，已忙得焦頭爛額，有一個國家的代表就指出，金融危機已成為因應氣候變遷的一種障礙了。</p>\n<p>2007年12月，在印尼通過的「峇里路線圖」（Bali Road Map），要求各國最晚要在2009年12月召開的氣候變遷綱要公約第15次締約國大會及京都議定書第5次締約國會議時做出結論，達成承接京都議定書2012年到期後的全球抗暖化新協議。因此這次的波茲南會議，相當於是為2009年哥本哈根會議的預擬減排共識，他們形容是「踏腳石」(註2)。</p>\n<p>氣候變遷對人類的威脅猶如一個有時間表的末日進程，但是，全球富裕的工業化國家，仍然不願意實踐最根本的解決方案，所發展出的碳交易、CDM等機制，只是付出少許代價、迂迴的取得持續增加排放的「權利」，讓高排放國家、企業合法的繼續破壞地球，最大獲利者可能是全球少數碳交易公司，是否真的可以減少全球碳排總量令人質疑；另一方面，中國等開發中國家，則極力爭取碳排放發展權，不願加入減排行列，邏輯很簡單：你們已在享受高碳排放的果實，為什麼我們不可以？最可憐的是那些氣候變遷下的犧牲者──低地島國、窮國（人），他們根本無法付出高昂的調適成本，只能卑微的向加害者──有錢的工業化國家呼籲移轉清潔發展的技術，以及援助調適的資金，後二者特別強調要根據財富及可能性，承擔「共同但有區別的責任」。</p>\n<p>把全球溫升控制在2℃以內，以防止不可逆的氣候變化是目前很重要的共識，然而根據科學家計算出的碳預算的空間，即使先進國家確實履行減排承諾，但仍有高額的排放，所剩碳排放空間，不足以讓這些極貧國家的人民脫離貧困。該如何確保處在貧窮線之下的人民，可以透過基本的溫室氣體排放權，得到基本的生活福利呢？NGO組織──國際氣候行動網（CAN），在會場中展示了一張海報名為「氣候戰爭（Climate War）」，呈現了氣候變遷已成為當今赤裸裸的富國與窮國、工業化國家與發展中國家之間的戰爭。</p>\n<p><div><img height=\"500\" src=\"/sites/cet-taiwan.org/files/u1/a_24.jpg\" width=\"334\" loading=\"lazy\"></div></p>\n<p><div>　　　　　　　　　<span>　綠色和平組織的義工正準備畫海報　　　（李根政攝）</span><br></p>\n<p>&nbsp;</div></p>\n<p><div><span></span></div></p>\n<p><div>大會的最後二天，富裕國家代表都講些冠冕堂皇的話，反覆針對減緩、調適、技術轉移、資金這四項議題，強調自己國家的立場和承擔責任的意願和策略，但由於該負責任的國家之間歧異甚大，導致這場在波蘭的波茲南召開的氣候會議，談了二個星期，只有決議將在明年啟動對抗暖化威脅的氣候調適基金，而其規模目前僅有約6,000萬美元，但是對於2012年的減排目標仍然沒有任何共識。有一位女性觀察員─NGO代表，忍不住質問了一個最簡單的問題「誰能告訴我，到底還能不能生小孩？」。<br></p>\n<p>&nbsp;</div></p>\n<p><div>COP上，富國盤算的是如何付出最少責任；跨國企業等利益團體則是見縫插針的尋找商機或減少衝擊；NGO則努力在周邊會議、展場、大會使盡各種方法施壓。在這樣的會議中，台灣有沒有角色呢？</div></p>\n<p><div>&nbsp;</div></p>\n<p><div>這次的台灣代表團，團長是現任台灣永續能源研究基金會的簡又新董事長，成員包括了環保署溫減辦公室、外交部、經建會、經濟部能源局、工業局、衛生署駐歐盟辦事處、農委會林務局、交通運研所、工研院能源與環境研究所、台電、中油、中鋼、台灣半導體產業協會等公私部門的代表數人；以及台大、清大、台科大、台北大學等校教授，還有承包行程的顧問公司。由這份加總近40人的名單可以看出，台灣官方團的產業界和經濟部門色彩非常濃厚。地方政府方面，高雄市政府環保局劉俊一副局長領隊，屏科大的林傑教授為副團長，含環保局、顧問公司、5位大學生、2位NGO代表及筆者共13人，台北縣政府也派出了2人與會。</div></p>\n<p><div>&nbsp;</div></p>\n<p><div>民間團體這邊，除了我們參與了高雄市政府團，清大的學生則由李河清教授領隊，以環品會名義參與；徐光蓉教授、佳芬以法國團體HELIO名義參與，另外還有台達電基金會的張揚乾先生也與會。</div></p>\n<p><div>&nbsp;</div></p>\n<p><div>我們在波茲南的第一夜，駐波蘭代表宴請了台灣去的團體；隔二天中午，環保署又請我們吃了中餐，固然有些許溫暖，但是卻少了實質的交流。環保署和工研院是在IETA租展場，這段期間，環保署發了4 份聲明稿，環保署對外宣傳的重點在於：1.重大產業開發案於環境影響評估時的減量抵換制度，希望建構一個能與國際市場接軌的自願減量市場；2.推動溫室氣體減量法與再生能源發展條例；3.依據溫減法建立的自願減量市場交易機制。</div></p>\n<p><div>&nbsp;</div></p>\n<p><div>台灣碳排放占了全球1％，意味著如果將來出現100萬的氣候難民，其中，有1萬人是台灣加害的。然而，台灣不是聯合國會員，一直未被要求列入減量的國家，經濟官員可能暗自竊喜──因為台灣的排放量會被計算入中國而被國際忽略，我們可以靠10億中國人口分攤或稀釋責任，因此，台灣仍在擴張高污染的石化、鋼鐵業及燃煤電廠，在減排這項國際責任，台灣根本不想承認自己是個國家；但另一方面，政府卻一直想要在聯合國、衛生、貿易等國際組織爭取空間，強調是自主的政治實體。真像是個精神分裂的生意人。</div></p>\n<p><div>&nbsp;</div></p>\n<p><div>在COP14的大會議上，一些國際NGO以觀察員的身分擁有發言權，但我們這個隱形國家的代表團，在大會場則完全是旁觀者。台灣的代表團，包括環保署以及官方邀請的學者專家一直都是以工研院（ITRI）所加入的國際碳排放交易協會（IETA）名義參與，諷刺的是，IETA是由29個跨國企業所組成，成員包括BP，SHELL等石油公司，據了解，工研院能資所是在環保署協助下申請加入該協會會員。</div></p>\n<p><div>&nbsp;</div></p>\n<p><div>一個國家最高環保機關，竟加入由跨國石油公司所組成的國際組織去參加氣候變遷會議，其角色實在是非常荒誕。也難怪，我們面對減碳問題，始終在清潔發展機制和碳交易等層次打轉，不願面對產業結構必須調整的課題。</div></p>\n<p><div>&nbsp;</div></p>\n<p><div>我個人的觀察是，清潔發展機制或許可以提昇能源效率，改善污染，但很難減少資源耗用，就像油電混合車所省下的油，趕不上汽車數量成長的耗油；而碳交易只是讓工業化國家持續消耗地球資源的粉飾工具，在欠缺各國總量配額、人均配量的情況下，其成效和公平性令人質疑。</div></p>\n<p><div>&nbsp;</div></p>\n<p><div>台灣是氣候災難的加害者之一，但我們的人口多半集中於西部沿海地區，所以也將是受害者。當全世界都在大談如何適應之際，我們在國土規劃、都市設計、糧食安全、能源安全上的法令和政策，連基本的生存問題幾乎都交了白卷。我認為：國內除了討論溫室氣體減量外，應即刻籌劃適應的策略。在國際責任上，如果能改變現有對友邦的金援方向，導向減少毀林，協助當地發展再生能源，透過友邦在COP會議上發表成果，比起拿錢去收買友邦政要更有實質效益。</div></p>\n<p><div>&nbsp;</div></p>\n<p><div>這次會後，我有個體會：面對氣候變遷這項可預見的全球大災難，環保運動其實是在為人類能否繼續生存而戰，我們應該以此層次設法喚起人民共鳴。</div></p>\n<p><div>&nbsp;</div></p>\n<p><div>國際NGO組織在COP14上展現了相當的實力，綠色和平在場內有發言空間，在波茲南、華沙的場也有行動；國際氣候行動網（CAN）每天召開記者會，這些行動的背後，必有相當的事前準備與後勤支援，台灣的NGO目前還望塵莫及。</div></p>\n<p><div>&nbsp;</div></p>\n<p><div>在返國的長程飛機上，腦中不斷翻騰一些基本命題和實踐想像：例如用什麼方法可以餵養60億以上的人口，而不損及生態系的存續？如何平等的提昇全體人類的福祉？台灣的NGO在氣候變遷上可以做出的貢獻是什麼？</div></p>\n<p><div><img height=\"500\" src=\"/sites/cet-taiwan.org/files/u1/b_15.jpg\" width=\"334\" loading=\"lazy\"></div></p>\n<p><div><span>ＮＧＯ人士在梅克爾海報旁發送傳單（李根政攝）</span><span></span></div></p>\n<p><div>&nbsp;</div></p>\n<p>註：&nbsp;<br>\n<p>1.聯合國氣候變化綱要公約第14次締約國大會暨京都議定書第4次締約國會議。<br></p>\n<p>2.本次會議主要討論議題，包括推動峇里島路線圖的行動規劃、已開發國家在2012年後之溫室氣體減量責任、氣候變遷衝擊調適、技術轉移與資金支持、降低毀林所造成之溫室氣體排放(REDD)、開發中國家能力建構與調適行動、彈性機制與全球碳市場發展等，希望2009年底在丹麥哥本哈根舉行之COP15/CMP5時，可以完成新的全球氣候協議。</p></p>\n<p>&nbsp;</p>\n<p><table></p>\n<p><tbody></p>\n<p><tr></p>\n<p><td></p>\n<p>〈說明〉</p>\n<p>本次COP14參訪，本會王敏玲小姐經高雄市環保局徵選而隨團參加，本文作者費用由本會負擔。篇幅所限，王敏玲小姐之與會觀察，僅擇部分刊登，其餘心得報告等，請見協會網站。</p>\n<p></td></p>\n<p></tr></p>\n<p></tbody></p>\n<p></table></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>"}, {"nid": 492, "title": "公平發展的權利", "original_topic": "環境污染;抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p><strong>是否該將發展的門檻列入氣候變遷綱要公約？</strong><br>\n<p>文/王敏玲（地球公民協會副執行長）</p></p>\n<p><div><img height=\"500\" src=\"/sites/cet-taiwan.org/files/u1/1_86.jpg\" width=\"334\" loading=\"lazy\"></div></p>\n<p><div>&nbsp;　　<span>Sivan Kartha博士於COP14周邊會議發表簡報（李根政攝）</span></div></p>\n<p><div><span></span></div></p>\n<p><div>&nbsp;</div></p>\n<p>12月8日下午3:30有一場為弱勢國家發聲的週邊會議要舉行，主題談的是在這個氣候受限(climate constrained)的世界，人民的發展權(the right to development)應得到公平的對待。我們在出發前就注意到這一場會議主題相當獨特，於是當天提早來到會場。下午3：20陸續進場的人愈來愈多，一個約可容納百人的會場很快就客滿了，有許多不同膚色的人互相比鄰、甚至席地而坐，很明顯地，這個主題吸引了處在「不同世界」的與會者重視。</p>\n<p>會場提供的書面資料是一份由EcoEqity的Paul Baer與Tom Athanasiou以及SEI的Sivan Kartha與Eric Kemp-Benedict共同發表的報告，除了EcoEqity和SEI兩個組織之外，這場會議HBS及christian aid都是這份報告的贊助者。(註1)</p>\n<p>主要的報告人Sivan Kartha博士首先要大家思考：「這個世界究竟需要什麼樣的氣候體制，才能夠帶領世人面對當今氣候變遷的問題？」他很快地挑出尖銳問題指出，地球上有高達20億的人，欠缺炊煮的基本燃料，有15億人根本沒有電可以用，有10億人就連要取得潔淨的飲水都還有困難，......在此條件下，已有相當的不公平，如今國際氣候變遷會議大談各國人民都要努力減排，呼籲各國政府應致力於減緩、調適。他要大家看看這些低收入國家的人，他們連吃飽都有困難，彷如天文數字的調適成本對他們來說根本是痴人說夢！</p>\n<p>Sivan Kartha以「南方國家的兩難」為這個困境下了註腳，他提到，為了要讓全球暖化的溫升問題控制在2℃以內，許多科學家已經研究、計算出這個世界還有多少碳排放的預算空間，雖然現在一些西方先進國家努力做出某些減排承諾，但放眼未來（為了維持既有文明）各國仍不免有相當高額的碳排放量，這麼一扣下來，所剩的碳排放空間已非常有限，Sivan Kartha認為，這些剩餘的碳排放空間，窄小到根本不足以讓這些極貧國家的人民脫離貧困，再者，這些貧窮國家不僅無法取得先進國家的技術移轉、資金的協助，這些極貧的人甚至一輩子無緣走進這樣的會場，參與國際性的氣候變遷協商會議，又遑論公平？</p>\n<p><div><img height=\"448\" src=\"/sites/cet-taiwan.org/files/u1/2.gif\" width=\"234\" loading=\"lazy\"></div></p>\n<p><div>&nbsp;<span> 2006年11月，在肯亞奈洛比的示威場合，一位馬賽族的婦女手持海報訴求：「停止氣候不正義」。<span>（取自本場周邊會議資料檔案）</span></span></div></p>\n<p>說到公平，Sivan Kartha用圖表與數據凸顯出「碳排放」相對於「責任」之間的問題，例如，歐盟（EU27）的人口佔全球7.3％，美國的人口僅佔了4.5％，日本只有1.9％，但是從他們的收入、碳排放比例等情況看來，他們實應分別擔負起：25.7％、33.1％和7.8％的責任（RCI）(註2)；中國有地球上19.7％的人口，其RCI為5.5％，而印度也有地球上17.2％的人口，但印度可比中國貧窮多了，其RCI只有0.5％。總計全球高收入國的RCI為77％，低收入國則有只有0.2％，此數據足以說明，對於不同排放情形的國家要課與同樣的責任，是天大的不公平！</p>\n<p>這場周邊會議相當有企圖心地提出了「溫室發展權」（GDRs）(註3)綱要，主張我們應確保在生活條件還處於貧窮線之下的人民，可以在任何氣候體制的保護之下，透過基本的溫室氣體排放權，得到發展的機會，並不只是讓他們免於貧窮，而是真正改善生活，得到基本的福利。然而，這樣的主張若要落實，唯一的路就是在聯合國氣候變遷綱要公約中，明文列入發展的門檻(development threshold)，當然，這個門檻究竟該怎麼訂？顯然是可以（也會引起）辯論的。</p>\n<p>Sivan Kartha在報告中強調，發展的門檻應該劃在全球貧窮線(Global poverty line)，即每人每天略高於16美元的收入之上，絕非每人每天只有1或2美元的極貧線(註4) (destitution line)那麼低。這個收入水平是經過實證研究，考量到如何才能擺脫：營養不良、嬰兒高致死率、低受教率等而計算得出。這門檻可以滿足一個人的基本需求，但若與當今世人富足消費的生活相比，則遠遠不及。</p>\n<p>與會的Fernando Tudela先生也在最後重申：「沒有人可以精確的說明我們面對氣候變遷的挑戰到底有多龐大，我們應該要採取正確的方法來因應，而此一方式應具有公平性。」</p>\n<p>印度裔的Sivan Kartha博士，以字正腔圓的英文簡報，他談話簡潔快速，語氣沈穩篤定，說服力十足。這場周邊會議到了尾聲，現場座位和兩邊的樓板已經擠滿了人，與會者使用各種精良的相機、錄影機、新穎的筆電、PDA......記錄著一切，操作這些電子配備的卡擦、點擊或機器回應的電子音此起彼落、不絕於耳，弄得我有點心煩。我低頭閉眼休息，心裡想著，不知道這些高檔的文明設備，可以將第三世界的聲音傳達出去嗎？有能力生產或購買、使用這些精良電子設備的國家與人民，可能為了減緩氣候變遷、平衡貧富差距，而放棄或大幅改變他們已習以為常的文明嗎？人類是否有足夠的智慧，讓遙遠的貧富兩端在因應全球災變的衝擊中真正手牽手？</p>\n<p>註：<br><br>\n<p>1.SEI全文:Stockholm Environment Institute. HBS全文: Heinrich Boll Stiftung<br></p>\n<p>2.RCI全文:Responsibility Capacity Index，聯合國以各個國家的特定收入、收入分佈、碳排放數據為基礎所計算得出之指標。<br></p>\n<p>3.GDRs全文:The Greenhouse Development Rights.<br></p>\n<p>4.一般也譯為貧窮線，為免混淆，此處以極貧區分。</p></p>"}, {"nid": 494, "title": "民間監督-- 當日化石獎反諷演出", "original_topic": "環境污染;抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p>文⊙王敏玲（地球公民協會副執行長）</p>\n<p>COP14全名是:聯合國氣候變遷綱要公約第十四次締約國大會，這樣的會議當然是國際環保組織一個重要的觀察及作戰時機，一個串連世界各國環境NGO的組織「氣候行動網」(Climate Action Network,簡稱CAN)就在每年COP召開時，根據他們的成員每天在不同會場中做第一手觀察與討論，投票選出「當日化石獎」(Fossil of the day) ，頒發給阻撓當日會議協商最力的三個國家。事實上，這個獎項從1999年在Bonn舉行COP5時就由德國NGO論壇首創，目前的組織運作由CAN統籌，每年締約國大會召開時，究竟哪一個會員國會可「榮幸」地得到他們頒發的獎項，都吸引相當多媒體的目光，當然，也形成與會國家不小的壓力。</p>\n<p>當日化石獎的標章設計與史匹伯所拍的侏邏紀公園電影中的標記非常類似，只不過換了文字，加上中間的那隻恐龍噴火了，不知是隱喻暖化得太厲害，熱得受不了，還是連恐龍都看不下去了呢？令人莞爾。不過CAN的用心良苦倒是很確定的，誠如「當日化石獎」的簡介：「由於人類大量使用化石燃料，地球的氣候正在改變，為了一個較好的未來，有許多國家努力在協商，但是，有些國家並不怎麼在乎，既然如此，我們就把他指出來......」（譯自CAN網站），這個化石獎無疑是國際環保團體不容許少數國家居間阻撓、壞了地球大事，所想出來的反諷法寶，他們藉著活潑逗趣、星光燦爛的頒獎活動（同步舉行記者會），讓世人瞭解：誰是進步的絆腳石！不過細細數來，擋在談判成功或者全球認真攜手合作之路前，大大小小的石頭，還真不少。</p>\n<p><div><img alt height=\"378\" src=\"/sites/cet-taiwan.org/files/u1/a_26.jpg\" width=\"252\" loading=\"lazy\"><span><br></p>\n<p>當日化石獎的標章設計非常耐人尋味&nbsp;&nbsp; (王敏玲攝)</span></div></p>\n<p>2009年1月19日，CAN公布了在COP14期間得到「當日化石獎」的國家總排名，依順序分別是：加拿大、日本、澳大利亞、俄羅斯、紐西蘭、義大利、歐盟、美國、法國、德國、波蘭、菲律賓、沙烏地阿拉伯、烏克蘭、科威特、冰島、挪威。</p>\n<p>在國人印象中風景絕佳的觀光勝地加拿大，竟已蟬聯兩屆化石獎的冠軍，「這顆石頭」究竟怎麼了？今年，加拿大阻撓了美國青年代表團在其布置的展示中公布一張標有加拿大位於西部亞伯達省(Alberta)開採瀝青砂的計畫圖。據了解，這個計畫將從現在開始到2020年每年排放八千萬噸的二氧化碳（預計），使加拿大根本無法達成其所承諾的二氧化碳減量目標。而此舉被加拿大代表團認為遭到嚴重冒犯，要求大會執行秘書將此展示圖撕下，行徑之惡劣引發眾怒，加上該國至今未能達成比京都議定書1990年排放基準再減百分之五的減排目標等等罪狀罄竹難書，遂一舉奪魁。CAN對於上述事件的回應是：你加拿大若願意阿殺力一點，宣布停止這樣大規模的環境破壞，我們也樂於把圖取下。好個犀利又明快的NGO啊！</p>\n<p>我和根政在與會的第五天（2008年12月10日）晚上六點鐘趕到展覽大廳，CAN設於展示廳右方的第一個攤位已經簡單布置完成，攤位周邊很快地聚集了等待活動上演及宣布名單的人群與鎂光燈。首先一位年輕的男士上場，他請在場的朋友一起高喊：Fossil of the day，第一次聲量不夠，他鼓勵大家再同聲呼喊一次，第二次的喊叫聲是連蹲在地上取景的攝影師都有貢獻的，數十人的聲量果然炒熱了活動氣氛，也吸引了更多人圍觀。簡短歡迎大家蒞臨記者會後，這位先生請男、女主持人陸續登場，兩位主持人穿著簡單隆重的晚禮服出現，輕鬆幽默地致辭時，彷彿真有「XX獎」頒獎典禮之姿，接著逐一請扮演當天的第三名得主（美國），及第二名得主（法國）上場，各自帶著自己的國旗詼諧、反諷地致辭領獎。最後公布第一名得主是向來被視為環保大國的德國時，現場觀眾發出驚呼之聲，據瞭解德國此日「榮獲」冠軍，與其總理梅克爾在談判中對歐盟的氣候與能源方案(EU climate and energy package)所採取的立場及德國新近倡議的高耗能工業排放交易方案有關。</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; <img alt height=\"334\" src=\"/sites/cet-taiwan.org/files/u1/b_17.jpg\" width=\"500\" loading=\"lazy\">&nbsp;&nbsp; <img alt height=\"264\" src=\"/sites/cet-taiwan.org/files/u1/c_14.jpg\" width=\"396\" loading=\"lazy\"><span><br>\n<p>CAN的記者會場，吸引數十名圍觀者與媒體採訪&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;當日化石獎公布後，主持人與代表各國的受獎人合影<span>(王敏玲攝)</span></span></p></p>\n<p>簡單來說，整場活動是民間環保團體為了確實瞭解這些「坐在會議室的大人」有沒有好好開會、認真談判而做的監督成果報告，活動進行得相當流暢有趣，宣傳效果絕佳，相信活動背後的企畫人力相當專業、用心，而兩位主持人與三位領獎者自在逗趣的反諷功力一流，營造出的氣氛與台灣較常見到的苦情訴求大異其趣，值得參考。</p>\n<p>&nbsp;</p>"}, {"nid": 515, "title": "珍愛環境，改用再生衛生紙【新聞報導】", "original_topic": "生活與環境", "adopted_cats": ["氣候變遷與調適"], "content": "<p>&nbsp;&nbsp; 【新聞報導&nbsp;】6月5日世界環境日「珍愛環境，改用再生衛生紙」</p>\n<p>&nbsp;</p>\n<p><strong>便宜5%再生衛生紙銷量加溫</strong></p>\n<p>2009年6月5日蘋果日報【涂建豐╱高雄報導】</p>\n<p><div><img src=\"/sites/cet-taiwan.org/files/u1/apple65.jpg\" alt height=\"134\" width=\"200\" loading=\"lazy\"></div></p>\n<p>&nbsp;</p>\n<p>再生衛生紙（左）外觀觸感與一般衛生紙（右）相似，環保團體籲多使用。楊適吾攝</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 今天是世界環境日，地球公民協會昨日公布再生衛生紙的消費現況調查，目前僅有市府、漢神百貨等單位使用再生衛生紙，大型賣場只有台糖量販店、吉安愛買、大潤發金銀島購物中心等，但其實再生衛生紙均有國家標準ＣＮＳ標章，品質與處女紙漿相同，價位更低一點，呼籲各界多使用。漢神百貨表示，再生衛生紙比一般衛生紙約便宜百分之五，去年七月使用至今，均未接到客訴事件。</p>\n<p><h2><span><span><span>品質相同少污染</span></span></span></h2></p>\n<p>&nbsp;&nbsp;&nbsp; 地球公民協會執行長李根正表示，根據台灣紙業工業統計，台灣去年家庭用紙的消費量就要用掉三十二萬五千公噸，這些絕大部分是百分之百原生紙漿的衛生用紙，每年相當於砍掉地球上大約八百六十萬至一千五百萬棵樹。</p>\n<p>&nbsp;&nbsp;&nbsp; 李根正指出，廢紙回收與再生紙製造，所耗用的能源是使用原木的一至四成，並可減少溫室氣體四成七、空氣污染二成八、水源污染三成三及固體廢棄物五成四，如果國人可以改用再生衛生紙，不但可以保護森林資源，同時也可減少環境污染。</p>\n<p>&nbsp;【&nbsp;新聞報導&nbsp;】6月5日世界環境日<span>「珍愛環境，改用再生衛生紙」</span></p>\n<p>&nbsp;</p>\n<p><strong>便宜5%再生衛生紙銷量加溫</strong></p>\n<p>2009年6月5日蘋果日報【涂建豐╱高雄報導】</p>\n<p><div><img src=\"/sites/cet-taiwan.org/files/u1/apple65.jpg\" alt height=\"134\" width=\"200\" loading=\"lazy\">&nbsp;</div></p>\n<p>再生衛生紙（左）外觀觸感與一般衛生紙（右）相似，環保團體籲多使用。楊適吾攝</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 今天是世界環境日，地球公民協會昨日公布再生衛生紙的消費現況調查，目前僅有市府、漢神百貨等單位使用再生衛生紙，大型賣場只有台糖量販店、吉安愛買、大潤發金銀島購物中心等，但其實再生衛生紙均有國家標準ＣＮＳ標章，品質與處女紙漿相同，價位更低一點，呼籲各界多使用。漢神百貨表示，再生衛生紙比一般衛生紙約便宜百分之五，去年七月使用至今，均未接到客訴事件。</p>\n<p><h2><span><span>品質相同少污染</span></span></h2></p>\n<p>&nbsp;&nbsp;&nbsp; 地球公民協會執行長李根正表示，根據台灣紙業工業統計，台灣去年家庭用紙的消費量就要用掉三十二萬五千公噸，這些絕大部分是百分之百原生紙漿的衛生用紙，每年相當於砍掉地球上大約八百六十萬至一千五百萬棵樹。</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;李根正指出，廢紙回收與再生紙製造，所耗用的能源是使用原木的一至四成，並可減少溫室氣體四成七、空氣污染二成八、水源污染三成三及固體廢棄物五成四，如果國人可以改用再生衛生紙，不但可以保護森林資源，同時也可減少環境污染。</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp; 漢神百貨副課長方炳森表示，去年七月漢神巨蛋開幕即採用再生衛生紙，可省成本約百分之五，且無客訴事件，漢神百貨也從去年九月跟進。</p>\n<p>&nbsp;&nbsp;&nbsp; 大潤發台南店客服部何欣蓓經理說，再生衛生紙價格合理，品質也一樣，公司推出相關產品後，銷售量確有加溫跡象。</p>\n<p><a href=\"http://tw.nextmedia.com/applenews/article/art_id/31683409/IssueID/20090605\">http://tw.nextmedia.com/applenews/article/art_id/31683409/IssueID/20090605</a></p>\n<p>&nbsp;----------------------------------------------------------------------------------------------------------------</p>\n<p><strong>世環日環團鼓吹使用再生衛生紙</strong></p>\n<p>2009年6月5日民眾日報【記者吳峙嵩高雄報導】</p>\n<p>今天為世界環境日，環保團體地球公民協會昨天特別針對衛生紙，強烈呼籲製造商及零售通路業者，為日益惡化的環境生態著想，應全面改採再生衛生紙，既環保、安全又省錢，一舉多得。</p>\n<p>&nbsp;</p>\n<p>地球公民協會表示，台灣目前已有17種品項的再生衛生紙，通過環保署環保標章認證。取得環保標章的再生衛生用紙，除了需使用再生紙友善環境之外，也需符合衛生紙國家標準CNS的規格，大眾可以安心使用，而且大部分再生衛生用紙都比原生衛生用紙便宜。</p>\n<p>&nbsp;</p>\n<p>但是，為什麼國人絕少使用再生衛生紙？根據地球公民協會4月份在高雄地區所進行的調查發現，再生衛生紙在台灣的販售、使用普及率不高。無論7-11、全家便利商店、家樂福、大樂購物中心、好市多、金銀島購物中心、屈臣氏、台糖量販店、康是美、全聯福利中心、頂好超市等賣場都找不到再生衛生紙。</p>\n<p>&nbsp;</p>\n<p>令環保團體質疑的是，已有國內衛生紙製造商，生產合格的再生衛生紙，全市卻找不到零售地點，換言之，市面上所出售的衛生紙，統統都是原生衛生紙。只有主婦聯盟生活消費合作社，才有販售再生衛生紙，不過，只限該合作社的社員，才有資格購買，一般民眾還是無法購得。</p>\n<p>&nbsp;</p>\n<p>諷刺的是，這些標榜生產100％原生紙漿的廠商，大部分也都有生產少數幾款再生衛生紙，但從未積極推廣，似乎只是把再生衛生紙當成企業「漂綠」的工具，讓環保團體相當失望及遺憾，根本感受不到業者的環保誠意。</p>\n<p>&nbsp;</p>\n<p>地球公民協會因此呼籲，公共場所、政府機構應率西全面改用再生衛生紙。生產者減少原生衛生紙廣告量，增加再生衛生紙廣告量，鼓勵通路商踴躍販賣再生衛生紙，帶動綠色消費風氣。民眾應養成隨身攜帶手帕的習慣，減少面紙的使用量。</p>\n<p><a href=\"http://www.thecommonsdaily.tw/\">http://www.thecommonsdaily.tw/</a></p>\n<p>&nbsp;</p>"}, {"nid": 552, "title": "96年度大事記", "original_topic": "無", "adopted_cats": ["氣候變遷與調適", "監督高雄重大污染"], "content": "<p></p><p>地球公民協會大事記</p>\n<p>\n<p></p><p>10月</p></p>\n<p>\n<p></p><p>&nbsp;10月2日，台灣動物社會研究會朱增宏理事長、RSPCA李博先生及David Coggan先生來訪；3日，李根政執行長至高雄市教育局擔任永續校園審查委員。晚上至新興社大授課，主題為台灣的環境課題─山林水土；5日，協會召開第二次理監事聯席會議；6日，李根政執行長參加公視公民眾議院節目於茄萣鄉的錄影；8日，李根政執行長及高雄環保團體代表與環保局局長蕭裕正會面，討論空氣污染防制暨環保政策諮商；9日，薛淑文執祕參加由高雄職業工會舉辦的NGO專業組織培訓班課程；11日，李根政執行長至台中主婦聯盟演講；12日，李根政執行長參加南水局舉辦的高屏大湖試挖計畫期中報告會議；14日，李根政執行長至雲林參加論壇，提論文「雲林需要高污染工業嗎？」。晚間參加旗山社大播映「滅頂家園」影片的映後座談；16日，與高雄市環保團體討論白皮書等事宜後續發展會議。晚上薛淑文執祕與王敏玲研究員參加NGO專業組織培訓班課程；19日，高雄市環保團體與環保局一科交流空污課題；20日，李根政執行長至台塑重工工會演講；21日，李根政執行長與王敏玲研究員參加氣候變遷國際NGO論壇；22日，李根政執行長赴立法院拜會賴幸媛，促成刪除水保局、林務局野溪整治預算，稍後與台北環保團體討論台鋼案，及參加水保局生態保育顧問會議；24日上午，李根政執行長參加高雄市永續會社會組、都市景觀組會議。當日下午至四維國小演講。晚上至新興社大授課工業污染與反公害歷史。下午王敏玲研究員至高雄縣觀音國小演講，講題 「消費倫理vs.倫理消費」；25日，台灣消費者保護協會來訪；26日，李根政執行長與新興社大開會討論左營社大開課事宜；27日，李根政執行長參加蘇門答臘雨林保育計畫工作坊；30日，南部地區環保團體與林向愷教授會面，交流環境政策議題；31日，本會與黃石龍副議長及後勁反五輕人士於高雄市議會舉辦反對中油就地更新記者會，多位義工參與協助。</p></p>\n<p>\n<p></p><p>&nbsp;</p></p>\n<p>\n<p></p><p>11月</p></p>\n<p>\n<p></p><p>11月2日，好書福講座第1場，吳音寧小姐主講「江湖在哪裡」一書；7日，協會工作人員至環保署場外抗議台塑怪獸禍延子孫，並參加台塑大煉鋼廠第五次初審會，力陳本會反對立場，本次會議決議將本案送交二階環評；8日，李根政執行長和公視記者勘查屏東草埔伐木區；10日，李根政執行長於新興社大播放「企業人格診斷書」影片並擔任映後座談。王敏玲研究員至屏東縣彭厝國小演講，講題「生命教育與動物關懷」；11日，李根政執行長與姚文智、鄭水萍、陳以亨等人討論南方學出版事宜；12日，與高高屏環保團體討論1208抗暖化遊行合作事宜；13日，李根政執行長至弘光科技大學參加通識課程評審會。王敏玲研究員至市府參加高雄市永續會都市規劃及交通組會議；19日，於本會舉行1208高雄抗暖化大遊行第1次籌備會議；21日，李根政執行長至獅甲國中演講；22日，李根政執行長參加中華電信工會高雄分會理監事會議，談抗暖化遊行配合事宜。下午至立法院與水患治理監督聯盟等友會共同舉行「還我自然河川─全面檢視不當之野溪整治及坡地治理問題」公聽會；23日，李根政執行長至後勁國中演講，談生涯規劃，24日，本會舉辦小影展第一場，播放「滅頂家園」影片，邀請張正揚先生及李根政執行長映後座談；25日，本會舉辦小影展第二場，播放「企業人格診斷書」，由張緒中先生及邱毓斌先生進行映後座談；26日，本會召開李根政執行長參加福特汽車環保初審會議；27日，李根政執行長參加環保局舉辦的二行程機車污染與健康風險評估說明會，及溫室氣體減量與區域能源整合座談會；28日，李根政執行長接受公視採訪石化業課題；30日，李根政執行長前往後勁社區談抗暖化遊行配合事宜。</p></p>\n<p>\n<p></p><p>12月</p></p>\n<p>\n<p></p><p>12月1日，李根政執行長至東海大學中文系演講；4日，抗暖化遊行活動於社大開第2次籌備會。王敏玲研究員接受高雄電台訪問，談抗暖化遊行活動；5日，上午召開「高雄不做伊電園--環保團體反對台電大林廠更新擴建」記者會，下午李根政執行長至中芸國小演講。地球公民教育手冊第1期「產業轉型 低碳有機 簡樸新社會」出版；7日，王敏玲研究員與義工柯耀源、李姵晴等人到高雄市各地發送1208反污染文宣；好書福講座第2場，李根政執行長主講「流浪者之歌」一書；8日，與高高屏環保、教育、文化等社團舉辦1208響應全球抗暖化行動—高雄大遊行；11日，李根政執行長返金門金寧國中小，獲頒傑出校友獎，晚上至新興社大參與文化夜市活動演講，講題「工業文明的反省─高雄市工業發展的代價」；16日，李根政執行長帶領新興社大生態社學員，參訪高雄煉油廠；17日，李根政執行長參加福特汽車環保獎決選會議，並前往立法院遊說田秋堇、賴幸媛委員，表達反對農發條例修正案；18日，李根政執行長應高雄市公共事務管理學會邀請，討論清溪川與愛河，晚上應李登輝前總統邀宴，台聯黨及社會進步力量的聯誼活動，與會者共16人；19日，李根政執行長與香港環境保護協會主席樊先生談抗暖化之NGO、學界、企業、政府之共識；20日，李根政執行長與黃文龍醫師、涂妙沂小姐等人討論守護柴山會議；21日，李根政執行長至中山大學公事所演講，講題「貧窮、開發與保育」，演講後並與碩博士生以環評為主題進行演講、座談；26日，本會與吳益政議員、林國正議員、鄭光峰議員於高雄市議會合辦台電大林廠擴建公聽會，會中多位立委、議員及市民皆表示反對因擴建而新增空氣污染之心聲。</p></p>\n<p>\n<p></p><p>&nbsp;1月</p></p>\n<p>\n<p></p><p>1月2日，李根政執行長參加環保署中油三輕更新改建計畫第2次環評會；4日，李根政執行長與詹順貴律師、朱增宏理事長及方慶榮先生討論守護台灣山林水土專案。下午接受中廣高雄台訪談，及至東吳大學應用倫理課堂演講。好書福講座第3場，由文化局王志誠局長主講「為歷史的蒼茫打光」一書；6日，李根政執行長參加由研考會舉辦的中油遷廠公民會議之執行委員會議；7日，協會工作人員至美濃，會勘義工聯誼活動之地點；8日，本會舉辦環保議題座談會，邀環保局林燦銘技正與二科股長與NGO交流高雄市河川及水污染、土壤及地下水問題；9日，李根政執行長至屏東市鶴聲國小演講，講題「台灣環境問題分析與出路（含國際責任）」。薛淑文執祕參加市議會保安科舉辦的高雄煉油廠第二真空工場爆炸後現勘；15日，協會工作人員與吳益政議員、柴山會楊娉育總幹事與會員董美里老師參加環保署「大林電廠更新改建計畫環境影響說明書」第3次初審會；16日，李根政執行長接受年代新聞採訪台電大林廠擴建案；17日，薛淑文執祕赴高雄市議會參加高雄輕軌聽證會；18日，李根政執行長接受港都電台專訪台電大林廠擴建案，晚上至旗山生活文化園區演講。薛淑文執祕參加後勁社區於保安宮召開之圍廠後續行動討論會；21日，王敏玲研究員赴中山大學參加全球氣候變遷與永續發展論壇高雄場活動。下午本會召開第3次理監事聯席會議；22日，李根政執行長榮獲中央社2008台灣十大潛力人物「社運環保類」獎項，並應邀領獎；23日，李根政執行長參加環保局舉辦之固定污染源委託計畫評選會議。23-25日，王敏玲研究員赴高雄市人發局參加國際發展與專案管理訓練課程；25日，李根政執行長應台權會營隊之邀赴南投發表演講；29日，李根政執行長至新竹湖口鄉高中生營隊演講。</p></p>"}, {"nid": 582, "title": "2009年8月17日，甲仙鄉小林村的狀況", "original_topic": "山林水土", "adopted_cats": ["氣候變遷與調適", "森林守護與林業改革"], "content": "<p>時間：2009年8月17日</p>\n<p>現勘人員：楊俊朗，傅志男</p>\n<p>現勘地點：甲仙鄉小林村</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 聽到消息說小林村搶通，就和俊朗碰碰運氣看是否能進到裡面做紀錄，於是十點半從高雄左右出發。</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 路線經過美濃月光山隧道往杉林、甲仙。首先經過0813公路被土石流淹沒數百公尺的份尾路段，該路段已經搶通，只是最好還是高底盤的車，不然就會和我的愛車一樣～石頭一直摩擦車的底盤，對於愛車十分抱歉！</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 過了甲仙市區，往小林村路途約13公里，但一出甲仙市區沒多久就碰上小客車無法通過的路段，只好步行前進看能走多遠就走多遠！還好，山上的人們相當友善，潘大哥是維修往小林村的橋樑工人，好心的在我們一程。到離小林村約3、4公里處，又有一台車讓我們接駁，真幸運，一路直達小林村！</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 下了車，眼前一片平坦的土石，只剩二棟房子在樹林的山腳下，當然就是小林村滅村的地勢最南、最高的了。進村的路已經已經被淹沒，居民就在可以看著沒有房舍的故鄉的公路上燒金紙，希望親友們一路好走。</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 我們開始走進村莊，除了搖頭、只能拍照！俊朗說這次水災讓他晚上會做惡夢！而我，還是搖頭和沈默，加上心都涼了！這個村莊已經沒有路基、也沒有房舍，我們只是隨意亂走，路上遇到一位當地村民，他態度很平靜的回答我們的問題、指著他還能告訴我們村莊範圍，沒有悲傷的面容，也許是悲傷到了極點，覺得人生最壞也不過如此吧！</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 我們再試著走往村莊的對面方向，想要看看村莊後面的山容如何，果然，除了村莊後面的山丘以外，更後面的高山光禿一片。那位村民說：有目擊者看到當天是後面高山突然崩落，然後衝擊村落後面的山丘，接著土石就撲天蓋地而來，村莊就滅頂了！</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 烈日下，我們走到村莊北段時，本打算往回走，但俊朗說：要不要上到崩塌的山丘背脊上？所以兩人就開始找沒路的合適地點開始爬上去。看起來不高的崩塌背脊，因為沒路又大石頭、倒樹散佈，加上炙熱的陽光，實在也夠累人的。俊朗體能好先上到頂，我上到背脊時，眼前出現的是更後面的高山崩壁壯闊、形勢攝人，令人不寒而慄！時間不早了，我們開始下村莊，這時開始下起了毛毛雨，心理也毛毛的，深怕大雨一來後果不堪設想，但俊朗仍氣定神閒。</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 小林村最後的巡禮時，老天開始磅礡大雨，我們趕緊回到公路，剛才都忘了我們還要解決交通問題呢！還好，最後一輛小發財車剛好要走，我們猛搖手趕上了！雖然一路淋雨，但起碼不必步行。到了自己的車，開始擔心大雨會不會讓回家的路中斷？果不其然，份尾路段我的車已經無法通行，只好再找甲仙～南化～玉井上高速公路，運氣好、路可行。但一路上的雨，讓人擔心，山裡面的災民可能又要面臨斷路的危機！</p>\n<p>&nbsp;</p>\n<p>的確，這幾年來，就算是賀柏、納莉颱風來也不能和這次的災害比。納莉2001年9月來時，大家就說是有史以來，現在呢？人禍造成的山崩土解、全球暖化，未來必定會有更大的災禍！</p>\n<p>&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp; 記得莫拉克颱風來之前，我們的官員說再不下雨就要缺水了，希望天降甘霖，現在呢？台灣已經成為「旱澇交煎」的國度了！</p>\n<p>&nbsp;</p>\n<p>志男2009/8/18&nbsp; 01：01</p>\n<p>&nbsp;</p>\n<p><img alt height=\"227\" src=\"/sites/cet-taiwan.org/files/813-23.jpg\" width=\"341\" loading=\"lazy\"></p>\n<p>21號省道份尾路段已經搶通。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"224\" src=\"/sites/cet-taiwan.org/files/813-24.jpg\" width=\"339\" loading=\"lazy\"></p>\n<p>潘大哥熱心載我們一程，窗外盡是被土石流沖毀的路。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"228\" src=\"/sites/cet-taiwan.org/files/813-25.jpg\" width=\"346\" loading=\"lazy\"></p>\n<p>小林部落全貌，只遺留一片土石，前方為楠梓仙溪，右方則為土石崩落的光禿景象。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"244\" src=\"/sites/cet-taiwan.org/files/813-26.jpg\" width=\"362\" loading=\"lazy\"></p>\n<p>從小林部落臨溪處往村落看，可以看見除了村落後方的大坍方以外，後面的高山崩落得更嚴重。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"231\" src=\"/sites/cet-taiwan.org/files/813.-27.jpg\" width=\"339\" loading=\"lazy\"></p>\n<p>俊朗提議攀上崩山的脊背，仰望浩大的崩壁。（黃圈中是俊朗）</p>\n<p>&nbsp;</p>\n<p><img alt height=\"234\" src=\"/sites/cet-taiwan.org/files/813-28.jpg\" width=\"335\" loading=\"lazy\"></p>\n<p>開始往上爬。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"222\" src=\"/sites/cet-taiwan.org/files/813-29.jpg\" width=\"333\" loading=\"lazy\"><br>\n<p>離村落最近的所以後方山丘幾乎全崩，造成全部落被淹沒，僅剩圖右方還有植被下的二間房舍。</p></p>\n<p>&nbsp;</p>\n<p><img alt height=\"500\" src=\"/sites/cet-taiwan.org/files/813-30.jpg\" width=\"333\" loading=\"lazy\"><br>\n<p>吁，亂石、倒樹散佈整座山丘。</p></p>\n<p>&nbsp;</p>\n<p><img alt height=\"229\" src=\"/sites/cet-taiwan.org/files/813-31.jpg\" width=\"341\" loading=\"lazy\"><br>\n<p>爬到三分之二高了。</p></p>\n<p>&nbsp;</p>\n<p><img alt height=\"233\" src=\"/sites/cet-taiwan.org/files/813-32.jpg\" width=\"351\" loading=\"lazy\"></p>\n<p>上到山脊前往村落望去的景象。</p>\n<p>&nbsp;</p>\n<p><img alt height=\"239\" src=\"/sites/cet-taiwan.org/files/813-33.jpg\" width=\"357\" loading=\"lazy\"><br>\n<p>上到山脊上，眼前盡是亂石崩雲、壯闊的崩壁，顯見山崩下的剎那聲勢浩大。</p></p>\n<p>&nbsp;</p>\n<p><img alt height=\"236\" src=\"/sites/cet-taiwan.org/files/813-34.jpg\" width=\"353\" loading=\"lazy\"><br>\n<p>山脊上看村落，高高低低的房舍、樹木、電線桿等，全部沒頂。</p></p>\n<p>&nbsp;</p>\n<p>&nbsp; &nbsp;&nbsp;<img alt height=\"223\" src=\"/sites/cet-taiwan.org/files/813-35.jpg\" width=\"339\" loading=\"lazy\"> <img alt height=\"222\" src=\"/sites/cet-taiwan.org/files/813-36.jpg\" width=\"335\" loading=\"lazy\"></p>\n<p>大雨中，我們正準備離開時，仍有村民在雨中祭拜。</p>"}, {"nid": 642, "title": "陳玉峰、陳月霞港都開講    震撼人心", "original_topic": "山林水土;水資源與環境治理", "adopted_cats": ["氣候變遷與調適", "森林守護與林業改革"], "content": "<p>&nbsp;</p>\n<p><span><span><strong>陳玉峰、陳月霞港都開講&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 震撼人心</strong></span></span></p>\n<p><strong>&nbsp;&nbsp; <img alt height=\"174\" src=\"/sites/cet-taiwan.org/files/980919%20075.jpg\" width=\"251\" loading=\"lazy\"></strong><span><span><br>\n<p>&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;</span></span><span>陳玉峯教授演講實景 &nbsp; &nbsp;</span><span> &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; </span><span>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;&nbsp;&nbsp;<span> </span></span></p></p>\n<p><img alt height=\"173\" src=\"/sites/cet-taiwan.org/files/980919%20149.jpg\" width=\"260\" loading=\"lazy\"><span><br>\n<p>&nbsp;<span>陳月霞老師</span></span><span><span>演講實景</span></span></p></p>\n<p>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;&nbsp; <img alt height=\"163\" src=\"/sites/cet-taiwan.org/files/980919%20067.jpg\" width=\"247\" loading=\"lazy\"><img alt height=\"162\" src=\"/sites/cet-taiwan.org/files/980919%20227.jpg\" width=\"246\" loading=\"lazy\"></p>\n<p>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<span>演講會場座無虛席&nbsp;</span>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <span>陳玉峯教授走下台前與民眾互動&nbsp;</span><span><br>\n<p>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<span>(何俊彥攝)</span>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;(何俊彥攝)</span></p></p>\n<p>&nbsp;</p>\n<p>文⊙朱淑娟（地球公民協會會員、獨立記者）高雄報導2009.9.19</p>\n<p>周末午後，氣溫33度，港都的九月下旬，依然揮汗如雨。八八水災過後，南台灣又恢復往日的活力與生機。今天，陳玉峰老師、陳月霞老師，應地球公民協會邀請，在災後首度到高雄明華國中演講。夫妻同台，各有力道與巧思，全場座無虛席。全程三個小時沒有人離席，連預定的中場休息都取消了。</p>\n<p>台北大學副教授廖本全、中華醫事科技大學副教授黃煥彰、環球技術學院助理教授張子見等昔日戰友，從台灣各地趕來，現場不斷聽到：「好久不見」。因為陳玉峰，老友得以相聚。一如八八水災，讓台灣人心心相連，關心國土的未來。</p>\n<p>陳玉峰說，「我來做個非演講，講而不演、如實報告。」陳月霞講的，則是「霸權、共業與災難」。陳玉峰開玩笑說自己的演講是，「外科醫師動刀動槍」；陳月霞則是，「靈魂的問題，真正深層內在的結構。」</p>\n<p>（以下內容為記者在現場紀錄陳玉峰、陳月霞演講內容，順序或有更動、文詞或有重組，但以不改變兩位的原意原句為原則。）</p>\n<p><span><strong>陳玉峯:</strong></span></p>\n<p><span><strong>台灣的未來，美好文化的救贖與開創</strong></span></p>\n<p>今天陳玉峰演講內容主要圍繞四個主題，包括：一、氣候變遷的成因，以及引發的災難。二、土石橫流的根本原理，台灣天然防護罩的破壞。三、台灣造災史演變，以及山林保育運動。四、台灣的未來人民能夠做什麼。</p>\n<p><strong>誠摯希望災難不再發生</strong><br>\n<p>與其說南部人熱情，不如說南部人真情。森林保育、環境運動、本土文化，幾乎都在港都誓師北伐，南方革命一向是台灣希望之所在。與其說南部人草莽，不如說
