c": "無", "adopted_cats": ["氣候變遷與調適"], "content": "<p><span><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u143/20161202-5.jpg\"></span></p>\n<p>2020年，疫情籠罩全球，對各國經濟活動產生沈重的打擊，卻也同時舒緩了不斷超載的環境負荷，減少全球的碳排放與污染。</p>\n<p>然而，隨著疫情舒緩，各國政府也將展開對產業的振興與援助，以讓經濟活動能夠復甦。此時，正是我們面對氣候危機、環境退化的風險時，最佳的改革時機！</p>\n<p>我們應該將此次的危機作為轉機，根本性改變我們的經濟模式，不再追求剝削式且高污染的經濟成長，而致力於打造高附加價值、零污染、循環永續的經濟模式，在復甦經濟的同時投資未來。</p>\n<p>邀請您，利用手中的三倍振興券，一同來投資我們的未來，守護台灣的環境，留給下一代更永續、有韌性的環境與社會。</p>\n<h3>&nbsp;</h3>\n<h3>可以怎麼用三倍券捐款給地球公民？</h3>\n<p>1.紙本券—郵寄或親送：請郵寄或親送至801高雄市前金區中華四路282號5樓地球公民辦公室收，若為郵寄，請您備註收據開立名稱及收件地址。</p>\n<p>2.數位券—填寫愛心碼：請您將振興券綁定信用卡、行動支付或電子票證時，勾選捐贈回饋的選項，並填寫地球公民的愛心碼8524（保護earth），並消費3000元以上後，政府便會將2000元的振興券回饋撥予本會。</p>\n<h3>&nbsp;</h3>\n<h3>捐贈的三倍券如何抵稅？</h3>\n<p>振興券抵稅額度同捐贈面額，將依照收入券上的金額開立捐款收據，因此如果您將紙本券全數捐贈給地球公民，即可以抵稅3000元。</p>\n<p>若為數位券，消費者綁定信用卡後消費3000元，將由政府幫消費者捐出2000元，因此捐款收據抵稅額為2000元。</p>\n<p><a href=\"https://www.mof.gov.tw/covid19/singlehtml/fa73d6c3f7154050a27f8a23b3d80568?cntId=ac9cf865fb324d8c8173b3cc139a945a\">更多振興券的稅務資訊（財政部）</a></p>\n<p><hr></p>\n<h3>誰是地球公民？</h3>\n<p></p>\n<p><span>地球公民基金會是推展環境保護的公益團體，透過調查研究、揭露環境問題，提出解決方案，並據以進行政策施壓、國會遊說、教育推廣等，期望能善盡地球公民之責任。</span></p>\n<p>\t<strong>地球公民深信：專業的環保團體＋公民行動，是改變世界的最大動力<br>\n<p>連結各種社會力，改變法令政策，以各種行動帶來正面的改變！</strong></p></p>\n<h3><a href=\"https://www.cet-taiwan.org/node/3698\">地球公民2019年年度報告</a></h3>\n<p>&nbsp;</p>\n<h3>我們的組織與願景</h3>\n<p>面對專業的環境破壞者，我們需要專業的環保團體！我們期待透過積極的行動，重建台灣人與土地的和諧關係，建立一個永續的社會，善盡台灣做為「地球公民」的責任。</p>\n<p>\t<strong>看守家園、拯救瀕危的地球，需要長久而持續的關注，<br>\n<p>我們深信：「唯有人民的支持，才有可能壯大改善環境的力量。」</strong></p></p>\n<p>\t地球公民基金會經費來自各界捐款，不接受政府補助，是一個獨立自主的公益團體。<br>\n<p>我們需要您的捐助。<br></p>\n<p>&nbsp;</p></p>"}, {"nid": 3788, "title": "新市長的挑戰：高雄怎麼轉？", "original_topic": "工業污染;產業轉型", "adopted_cats": ["氣候變遷與調適", "監督高雄重大污染"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20200807-001.png\"><br>\n<p><span>高雄市長補選即將到來，新高雄市長需面臨高雄市如何轉型的問題。（高雄市選委會提供）</span></p></p>\n<p>8月中即將上場的高雄市長補選，攸關工業大城如何轉型，掙脫環境生態污染之惡名，恐怕不是力推中央主導的橋頭科學園區，或者天外飛來一筆喊個蘭姆酒產業，就足以輕鬆面對。新市長應揚棄傳統的開發主義，以符合生態永續與社會正義轉型的新思維來樹立城市轉型的新典範。</p>\n<p>首先，別再逃避既有工業發展的轉型難題。半個世紀以來，高雄的石化、鋼鐵與金屬、電力等產業已演進至設備老舊、污染積累、風險增升的發展階段，市民面對的是：工安意外頻傳，中油後勁高廠與台塑仁武廠等重大土水污染確認，後勁溪等河川遭污染，廢棄物處理成虞，空污壟罩城市，工業區鄰近社區有害空氣污染物與健康風險超標。環境與風險堆疊，高雄不僅亟需完善環境治理以保障居民健康與安全，更要透過工業轉型、從源頭收束污染以改造城市體質。</p>\n<h3>防新投資加重環境負荷</h3>\n<p>2014年高雄氣爆後，民間最關心的無疑是石化產業能否瘦身、石化污染可否大幅削減、城市地底能不能不再是盤根錯節的石化管線。儘管2015年後勁迎來中油五輕關廠，但是大社工業區2018年降乙編的政治承諾至今仍未實現；而小港沿海六里大林蒲等傳統聚落，先有馬政府想發展為石化專區，後有蔡政府宣示發展為新材料循環產業園區，2萬環境難民面臨遷村，進退維谷。確保工業土地取得合於社會公義；控制削減石化污染與風險、返還居民環境正義；引導石化產業以循環取代傳統的線性生產模式；並且在縮編轉型過程，依國際間「公正轉型」原則，落實對勞工工作轉換或補償的保障，是高雄不能不面對的艱鉅挑戰。</p>\n<p>其次，避免新的投資讓高雄環境負荷重上加重。有候選人主打推動橋頭科學園區、打造南部科技走廊，吸引台商投資高雄、成為高階製造中心；也有候選人直言要為廠商解決「五缺」問題。若一昧配合資本開發，奉上土地、水資源、電力與便宜勞動力，恐怕重蹈既有產業發展對高雄帶來的各種副作用；以橋科為例，中央政府大筆一揮，耕耘10年的中崎有機農場恐怕又要為工業犧牲。新增投資人人愛，但代價不能再是健康與生態的受害。</p>\n<p>我們期待新市長能夠成功設下一個經濟與環境雙贏的典範：重新設計橋科與有機農業共存，並促使科學園區與廠商負起環境與社會責任，在土地取得、水資源循環使用、毒化物管理、自產與承諾使用再生能源、減碳承諾、勞動條件等都做到最高標準，而非只是讓高雄再增加一塊中央政府支配的工業租借地。</p>\n<p>再者，全球已進入氣候緊急狀態，每個國家、城市與社區，都應全力強化自身在面對極端氣候情境下的社會韌性。由於全球人口高度集中都市，且許多都市位於沿海地區，城市早已被視為採取氣候行動的關鍵場域。高雄市位於沿海地區，市區多處有淹水經驗、山區曾受莫拉克風災重創，絕不該無視氣候變遷加劇帶來的各種風險。</p>\n<p>打造「韌性城市」，需要從交通、建築、食物與農業、能源等方面做出更大幅度的變革。比如從前朝延宕迄今的輕軌建設，應立即追趕進度以完善城市公共運輸；積極鼓勵透天厝、住宅大樓到工業區，進行建築節能與設置綠屋頂等。唯有認知到人類社會已進入氣候緊急狀態，國際經濟趨勢已逐漸走上與化石燃料脫鉤的路上，高雄的工業、能源、城市轉型，才有機會為市民帶來乾淨安全的生活、為年輕世代創造出尊嚴的綠色工作。</p>\n<h3>轉型不再依附工業發展</h3>\n<p>高雄人期待好生活，前提是城市轉型不再依附於以生態環境與人民健康為代價的工業發展模式。高雄人想要好薪情，投資別再總部、研發、設計等高薪工作留台北，較低薪的加工製造擺高雄。高雄需要多樣的綠色工作，當全球投資轉向綠色經濟，歐美各國大力提倡「綠色新政」以創造綠色工作、氣候工作，各國的中小企業、社會企業與合作社等更具民主與創新性質的經濟組織型態，正回應著年輕世代對就業多樣性、工作自主與創新的需求。</p>\n<p>高雄的發展轉型是否能對接聯合國永續發展目標，能否納入更多公民社會聲音，走出合於環境永續與社會公平的產業發展，在在是新市長的新挑戰。</p>\n<p><hr></p>\n<p>本文為20200826蘋果日報論壇--<a href=\"https://tw.appledaily.com/forum/20200806/5SGUHHIXZB2IIHHHTFT3GWUAWI/\">新市長的挑戰：高雄怎麼轉？（邱花妹）</a></p>"}, {"nid": 3860, "title": "【前瞻系列評論1】前瞻不前瞻，該面對氣候變遷了", "original_topic": "能源轉型;綠色經濟", "adopted_cats": ["氣候變遷與調適", "完善能源政策"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u376/20201105-1.JPG\"><br>\n<p><span>環團與台灣青年氣候聯盟回應國際串連，0927模擬海平面上升，戴蛙鏡遊行，嚴正要求政府提出因應氣候變遷(台灣青年氣候聯盟TWYCC 提供)</span></p></p>\n<p>\t蔡英文政府上台後最重要的計畫─<a href=\"https://www.twreporter.org/topics/foresight-infrastructure-plan\">前瞻基礎建設</a>，於2017年推出後至今已逾3年，從開始的「軌道」、「水環境」、「綠能」、「數位」、「城鄉」等五大建設，陸續再擴充因應「少子化」建設、「食安」建設，以及「人才培育促進」建設，八項建設編列八年8824億的特別預算，是蔡政府任內最大筆的特別預算支出，上個月(10月)起，立法院開始審查第三期兩年編列的2300億預算。</p>\n<p>這筆來自廣大納稅人的錢能否被妥善的花用，關乎台灣未來30年國家發展需要的基礎建設，地球公民基金會與《報導者》合作，從台灣過去經濟發展的脈絡梳理，整理過去3年前瞻計畫的不足，檢視現有的二年2300億計畫中的疏漏，陸續推出因應氣候變遷、城鄉建設、綠能建設及綠色運輸的系列評論，提供真正具有前瞻思維並可具體落實的方向，做為監督政策與人民納稅錢的指標。<br>\n<p>&nbsp;</p></p>\n<p>這3年來，前瞻基礎建設不夠具有前瞻性，是許多公民團體諸多批判的核心，在特別預算下許多支出都是常態性、甚至有綁樁性質，更是令人遺憾。但也確實有少數好的案例，值得推動與堅持。</p>\n<p>時隔3年後，台灣與全球面臨的是更顯嚴峻的氣候變遷挑戰，更是國際年輕世代重要的價值守護。前瞻三期特別預算審查，除了經費審查外，更應要求行政部門提出過去3年相關建設的檢討，以檢視前瞻的方針和成效。</p>\n<h3>氣候變遷是青年世代最嚴峻的挑戰</h3>\n<p>　30年後的台灣，會有什麼樣的狀況需要因應？在<a href=\"https://www.ey.gov.tw/achievement/D2AF11AB5AC01C1F\">行政院前瞻基礎建設的網站</a>說明：「前瞻基礎建設計畫背後的願景就是永續發展的台灣，每一項價值都符合世界的潮流，合乎台灣的需要，都是要幫台灣往前跨步，具有十足的前瞻性。目標在：因應氣候變遷，促進台灣經濟、能源、交通轉型，並提升人民生活品質。」因此，面對氣候變遷架構下的轉型，是這項特別預算最重要的目標。</p>\n<p>　時隔3年，氣候變遷議題更顯嚴峻，國際間不僅持續年年召開聯合國氣候變遷大會，要求各國必須依巴黎協定訂出自訂減碳目標並逐年達成，更有年輕人跨國際的罷課串連，以「<a href=\"https://fridaysforfuture.org/\">#FridaysForFuture</a>」為號召，至今全世界每個國家，超過7500個城市，1300萬名學生響應星期五罷課行動，學生們不參加周五的課程而參加示威活動，奪回對未來的主導權，要求各地政治領導人採取面對氣候變遷的積極行動。縱使在面對疫情襲來的世界，這項社會運動號召的價值，仍是目前世界上最多青年響應的。<br>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u376/20201106-01.JPG\"><br></p>\n<p><span>環團與台灣青年氣候聯盟回應國際串連，0927模擬海平面上升，戴蛙鏡遊行，嚴正要求政府提出因應氣候變遷-1(台灣青年氣候聯盟TWYCC 提供)</span></p></p>\n<h3>減緩與調適在前瞻計畫應並行</h3>\n<p>　世界氣象組織(World Meteorological Organisation)的報告警告說，在2024年地球可能會暫時性超過1.5℃升溫極限，顯然過往世界面對氣候變遷的努力不夠。而在台灣，氣候變遷不是只有變熱、颱風變大、降雨變強，已有<a href=\"https://tccip.ncdr.nat.gov.tw/km_newsletter_one.aspx?nid=20200807141614\">研究指出</a>，因為暖化，所以在台灣的埃及斑蚊活動面積會愈來愈大，近年來極端氣候也已經大幅影響台灣水果的產量與價格，種種現象都是台灣已經發生的。</p>\n<p>　攤開台灣的碳排放，<a href=\"https://8158f5bd-8e25-4af2-b99c-9089e9c815e2.filesusr.com/ugd/81796e_97e3916cdbd44a4c9f33f4e8bb79e6eb.pdf\">過半來自工業端，剩下住商、運輸、能源各占19~12%</a>，小老百姓可以從生活習慣改變在運輸跟住商部門做減碳達人，但絕對需要政府的棍子與蘿蔔同時並進，從政策的獎勵與調整收費機制做誘導，而過半的工業端有賴政府的政策來抑制排放。減少碳排的原則，在前瞻基礎建設中的「軌道」、「綠能」、「城鄉」都有直接的關係。除此之外，因應氣候變遷下的調適生活，更應是前瞻的重要價值，在「水環境」、「城鄉」甚至「數位」計畫中，工業區升級、糧食安全、治山防洪甚至智慧城市，都應該以調適做為主軸來規劃。</p>\n<p>　未來的30年，身在海島國─台灣的人民，勢必是面對氣候變遷、暖化浪潮的第一線，地球公民基金會於2019年即提出「台灣面對氣候變遷的五大減碳方案」，要求：</p>\n<p>一、台灣必須訂出2025年到2050年間的能源轉型路徑及執行方案。<br>\n<p>二、各政黨應承諾儘速推動課徵「能源稅或碳稅」，秉持污染者付費精神，讓排碳者負擔代價，以加速減碳進程。全體國營事業都應將氣候變遷訂為績效目標，逐年檢討達成進度。<br></p>\n<p>三、強化中南部減煤、鍋爐更換、污染排放大戶減量。<br></p>\n<p>四、全國應制訂交通運具全面電動化期程，針對空污嚴重的中南部縣市，政府應加碼提高電動汽機車補助方案，加速電動化。<br></p>\n<p>五、將能源民主與公正轉型價值導入氣候政策，減少環境社會衝擊。</p></p>\n<p>　上述五項要求也與前瞻計畫中，因應氣候變遷，促進經濟、能源、交通轉型直接相關，然而從過去3年的執行到編列預算的未來，有太多計畫只是照本宣科，不僅未達減碳之效，更有助長排碳之實。除了現有的法令，<a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=O0020098\">如溫室氣體減量及管理法</a>需要提高權責、訂定更積極的目標外，在建設端更應該落實在真正具有前瞻性的計畫。</p>\n<h3>為未來做準備，從檢視現有前瞻計畫開始</h3>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u376/20201106-02.jpg\"><br>\n<p><span>地球公民與洪申翰、陳椒華立委召開記者會，要求政府前瞻別亂花錢-- 面對氣候變遷(地球公民基金會提供)</span><br></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br></p>\n<p>對應回現有的前瞻計畫，過去占大比例的「軌道」建設、「綠能」建設以及與一般常態建設最相關的「城鄉」項目，都是最該從氣候變遷角度下思考的。如何提升綠色運輸的品質，進而達到替代私有運具的功能，應該是軌道運輸的根本，但現有的計畫花了大筆資源做地下與高架化，不僅無法達成替代與減碳功能，更衍生其他爭議。<a href=\"https://www.twreporter.org/a/opinion-electro-optical-environmental-and-social-considerations\">「綠能」建設則在過去大量裝置綠電的過程中，有需多溝通與土地利用的爭議</a>，若缺乏系統性的盤點與區位選擇規範的建立，將會使得好東西放在不對的地方，失去能源轉型的精神，更浪費民間支持綠能的動能。而「城鄉」建設更是地方普遍爭取的資源，但若都用在道路舖設、停車場設置而忽略長遠減碳規劃，那將使得做錯第一步後，要花更多資源來彌補。</p></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;但前瞻也確實有好的個案，如在水環境建設中，拆除北海岸的老梅、永興漁港，大而不當的建設應該停止並且還地於海，恢復自然海岸，就是真正具有前瞻思維的做法。當年漁港也是政府經費編列下完成，如今又編列經費拆除，雖然是個亡羊補牢的方向，但若眼光拉得長遠，仍是正確的選擇。而這項具有前瞻的作為，更凸顯現有建設的積極審視，將可以避免錯誤一再發生。</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;政府的每一分錢都來於納稅人，前瞻計畫開宗明義是為了未來30年，在過去3年中做出有好有壞的成績，但目前缺乏檢討、只一昧地再編列經費，很可能因而錯失前瞻良機。<br>\n<p>&nbsp;</p></p>\n<p>（本文為2020/11/5&nbsp;報導者評論投書：<a href=\"https://www.twreporter.org/a/opinion-foresight-infrastructure-plan-climate-change\">蔡中岳／前瞻不前瞻，該面對氣候變遷了</a>）</p>"}, {"nid": 3868, "title": "【前瞻系列評論3】台灣56年來最大乾旱在眼前，前瞻計畫綠能建設如何建立碳中和家園？", "original_topic": "新能源與電業改革;國會/政策", "adopted_cats": ["氣候變遷與調適", "完善能源政策"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20201120-001.png\"><span>圖為高雄左營的建築屋頂設置的光電系統。（地球公民基金會提供）</span></p>\n<p>\t蔡英文政府上台後最重要的計畫─<a href=\"https://www.twreporter.org/topics/foresight-infrastructure-plan\">前瞻基礎建設</a>，於2017年推出後至今已逾3年，從開始的「軌道」、「水環境」、「綠能」、「數位」、「城鄉」等五大建設，陸續再擴充因應「少子化」建設、「食安」建設，以及「人才培育促進」建設，八項建設編列八年8824億的特別預算，是蔡政府任內最大筆的特別預算支出，上個月(10月)起，立法院開始審查第三期兩年編列的2300億預算。</p>\n<p>這筆來自廣大納稅人的錢能否被妥善的花用，關乎台灣未來30年國家發展需要的基礎建設，地球公民基金會與《報導者》合作，從台灣過去經濟發展的脈絡梳理，整理過去3年前瞻計畫的不足，檢視現有的二年2300億計畫中的疏漏，陸續推出因應<a href=\"https://www.twreporter.org/a/opinion-foresight-infrastructure-plan-climate-change\">氣候變遷</a>、城鄉建設、綠能建設及綠色運輸的系列評論，提供真正具有前瞻思維並可具體落實的方向，做為監督政策與人民納稅錢的指標。</p>\n<p>2020年，全球除了遭受COVID-19（又稱武漢肺炎、新冠肺炎）襲擊，各國也頻傳洪患、野火、乾旱等氣候災難事件，後者對經濟發展、環境永續的破壞，完全不亞於疫情。面對極端氣候，台灣也無法倖免，不僅7月台北首次測到攝氏39.7度高溫，更睽違半世紀創下豐水期無颱風的紀錄，現在台灣遭逢56年來最大乾旱，桃竹苗大面積農地停灌，各地啟動限水、搶水。但台灣依然欠缺更積極的減緩氣候異常作為，至今仍有高達92%能源使用石油、煤炭等化石燃料，除了會持續加劇氣候異常，同時也造成中南部空氣汙染嚴重，直接賠上人民健康與環境品質。 &nbsp;</p>\n<p>減煤、減汙、減碳是人民的渴望，也是所有人的責任，再加上台灣3座老舊核電廠陸續到期除役，因此，我們迫切需要能源轉型。透過發展再生能源，提高能源使用效率，淘汰化石燃料，改用潔淨的再生能源電力驅動，如此我們才能朝向碳中和的目標前進，與各國攜手減緩氣候變遷。 &nbsp;</p>\n<p>為了達到這個目標，我們需要將資源投注在能源轉型的工作上，除了持續開發風力與光電，也需要建置潔淨能源所需的儲能、氫能與智慧電網系統，而建築物的節能翻修、產業資源效率的提升、潔淨科技的研發與人才教育訓練等項目更是不可或缺。 &nbsp;</p>\n<p>「前瞻基礎建設計畫」第三期2,300億龐大的國家資源，是否正確地投注在讓台灣因應氣候變遷，促進經濟、能源、交通轉型，並提升人民生活品質的基礎建設上，需要大家一起來監督。 &nbsp;</p>\n<h3>78億預算一半用於沙崙科學城，欠缺節能投資的前瞻建設</h3>\n<p>8項建設前瞻基礎建設計畫中，以綠能建設與能源轉型及因應氣候變遷最直接相關，城鄉建設也攸關能否建立達到淨零碳排、能因應氣候變遷的韌性城鎮。 &nbsp;</p>\n<p>檢視過去綠能建設項目，預算多用於離岸風力施工所需的港口、以及沙崙智慧綠能科學城，缺乏節能投資與輔助綠能的相關設施，為人詬病。今年綠能建設僅編列78億元，只佔第三期總預算3%，金額太少，且仍以建設沙崙科學城為主（39億），對於台灣整體綠能發展助益有限。</p>\n<p>整體來說，這期預算依然缺乏節能項目的投資，在綠能技術上雖有綠能技術與建設（25億）、技術驗證應用及地熱探查（約14億），但內容著重於電動巴士生產服務、碳循環技術研發、電網管理技術提升，雖也是未來重要技術的研發，但無法解決目前再生能源發展瓶頸的問題，也未普及儲能系統的建置。 &nbsp;</p>\n<p>城鄉建設項目向來是整個前瞻計畫中預算最多的，這期共編列了740億，但內容與前期計畫幾乎雷同，預算多集中在道路品質與停車問題的改善、開發產業園區、以及各種營造工程。台灣傳統工程設計與施工做法，甚至城鄉發展規劃，幾乎不曾納入能源轉型與循環經濟的考量，也使得城鄉建設難以發揮促進區域能資源整合、建設淨零碳排社區的綜效。 &nbsp;</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20201120-002.jpeg\"><span>圖為高雄左營的建築屋頂設置的光電系統。（地球公民基金會提供）</span></p>\n<h3>4個建議、從社區思考綠能的多元可能</h3>\n<p>我們認為，以下訴求應予以納入，才能加速發展綠能，投資節能設施，捲入更多人民參與能源轉型工程。 &nbsp;</p>\n<p><h4>1.綠能建設應加入「地方節能治理」、「建築節能翻修改造」與「小屋頂光電融資規劃」項目 ，促進淨零碳排社區</h4></p>\n<p>過去3年由台電經費支應的「縣市共推住商節電行動」，地方能源治理已開始萌芽，卻面臨2020年經費結束，後續無以為繼的困境；而國內建築也因通風隔熱不良，成為高耗能建築，無法在氣候嚴峻的未來，提供節能舒適的住居空間。</p>\n<p>因此，應將節能推動經費納入前瞻基礎建設範疇，確立經費穩定性，並編列建築節能翻修獎勵費用，帶動節能產業經濟；同時規劃推動金融機構提出綠色融資方案，以無息或低利貸款來協助社區或民眾，進行節能改造和架設屋頂光電，提高民眾採取節能行動、加入自宅光電自發自用的誘因，一方面有助於提升台灣能源效率，建設淨零排碳社區，另一方面也可降低躉購成本與時間壓力。&nbsp;</p>\n<p><h4>2.綠能建設應加入「整合資源規劃（IRP）」項目，來協助光電潛力案場盤點 </h4></p>\n<p>地面型光電涉及生態保育、社會經濟等爭議而進度遲滯，不利於國家推動能源轉型。日前蘇揆責成沈副院長整合相關部會盤點土地，但若使用錯誤的方法，恐會重蹈過去農委會盤點不利耕地、或國產署盤點鹽業用地的覆轍，盤出的土地仍有生態爭議或饋線不足等問題，無法設置光電。 &nbsp;</p>\n<p>整合資源規劃（Integrated Resource Planning, IRP），是一套在世界各國廣泛採用的系統工具，像美國加州就已透過盤點能源供需所需的各種條件，如電力設施、生態土地與社會環境特性、市場條件等，在2年內就評估出現今到2045年可確保符合成本效益的能源投資路徑圖，其中也標定出適合設置再生能源的地點與總量，有效地先期解決再生能源與環境之間的衝突。&nbsp;</p>\n<p>經濟部目前正積極設立環境與社會檢核機制，該機制雖能處理當前光電選址問題，但仍有其侷限，如：有關國家總體能源需求量、環境承載力、再生能源可設置總量、各縣市區域可分配量、各區域生態補償、衝擊研究等，仍需要上位政策整體規劃評估與滾動檢討，IRP恰是提供處理上述問題的科學工具。 &nbsp;</p>\n<p>因此，前瞻計畫應該編列IRP的預算，藉由系統性工具來評估、擘劃國家長期能源轉型路徑，解決再生能源的發展爭議，不僅讓光電在對的地方、用對的方式加速發展，更讓各種再生能源相互調和，提供國家穩定的能源與電力。</p>\n<p><h4>3.綠能建設應加入「設置配電級饋線」項目，鋪建社區公民電廠的電網環境</h4></p>\n<p>不管屋頂光電或地面光電，都需要有饋線才能設置，其中配電級饋線因為容量有限，造成許多社區電廠、不利耕地、偏鄉社區無法設置光電。目前的綠能建設雖有「強化電網運轉彈性公共建設計畫」，但其實是在幾個偏遠地區設置儲能系統，沒有任何配電級饋線的布建，無法提升台灣整體再生能源設置量，對電網調度彈性能力的提升也有限。&nbsp;<br>\n<p>因此，為了提高社區參與意願，加速能源轉型，應該投注資源加速布設配電級饋線，搭配檢討目前饋線申請審核機制、清查饋線蟑螂，讓社區型再生能源取得饋線優先使用權，讓每個社區都能成為再生能源的生產者與使用者，朝建設100%再生能源社區目標前進。&nbsp;</p></p>\n<p><h4>4.城鄉建設應要求提高能源效率、結合綠能設置，整合能資源</h4></p>\n<p>城鄉建設中任何工程建設，都應納入節能設計，並結合綠能設置。例如公共運輸停車場改善、生態路網規畫、在地產業園區建設、地方館舍與運動場館升級、公有危險建物補強重建、原住民部落公共空間整建、公共服務據點整備等，都應要求提高建築能源效率與能源自給率。&nbsp;</p>\n<p>此外，也應要求各項工程發包計畫中，訂定循環物料使用比例、原物料碳足跡要求、施工卡車空汙排放規範等綠色條款，確保公共投資均可有助於循環經濟、能源轉型以及空汙改善，方可符合特別條例中所稱「推動促進轉型之國家前瞻基礎建設」之意旨。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20201120-003.jpeg\"><span>圖為高雄左營的建築屋頂設置的光電系統。（地球公民基金會提供）</span></p>\n<h3>公共投資，應用在帶動民間綠能往前走</h3>\n<p>為了因應氣候變遷，台灣需要以建立碳中和家園為目標，創建一個高效率使用能源，且使用對環境友善的潔淨能源的生活環境。因此。打造節能的住居空間，讓更多社區可以方便生產與使用再生能源，就是很具體的國家基礎建設投資標的。</p>\n<p>透過公共投資帶動民間節能與綠能服務產業的發展，鼓舞新能源服務擴大到社區與環境共享共好的加成價值，讓國家經濟將從過往高度仰賴化石燃料、犧牲環境換取發展的傳統型態，轉為低碳、低汙染、高度能資源效率的新經濟，這才是真正具有前瞻性的國家基礎建設。 &nbsp;</p>\n<p>\n<p>（本文為2020/11/17&nbsp;報導者評論投書：<a href=\"//www.twreporter.org/a/opinion-foresight-infrastructure-plan-green-energy\">蔡卉荀／台灣56年來最大乾旱在眼前，前瞻計畫綠能建設如何建立碳中和家園？</a>）</p></p>\n<p>&nbsp;</p>"}, {"nid": 3880, "title": "氣候改革 刻不容緩｜青年抗暖大遊行回顧", "original_topic": "抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u376/20201217-09.JPG\"><br>\n<p><span>民眾於立院前舉起訴求看板。(台灣青年氣候聯盟提供)</span></p></p>\n<p>\t響應今年全球「週五護未來」（Fridays for future）行動，台灣青年氣候聯盟於 9 月 27 日（日）下午 2 點到下午 5 點半舉辦青年抗暖大遊行，提出對於國內氣候治理改革的「六大訴求、15 項行動」。</p>\n<p>雖然早上就下起大雨，但民眾要求氣候改革的熱情並未被澆熄， 破千人參與這場氣候遊行。此次遊行囊括九大族群一起加入，包括青年、婦女及多元性別、勞工、研究機構、地方政府與城市、原住民、農民、工商團體及環境保育團體。大家在氣候變遷之下，各自面對著不同的挑戰與機會，在這場轉型的過程中，沒有一個人的權益應被忽視。</p>\n<p>台灣青年氣候聯盟與 10 多個團體共同發起927【氣候改革 刻不容緩】青年抗暖大遊行，呼籲政府提出積極的氣候改革政策，邀請民眾下午 2 點在立法院集合，一起為氣候變遷而走。</p>\n<h3>透過肥皂箱短講和願景牆 ，讓民眾了解氣候議題</h3>\n<p>遊行的開始為全民氣候集會，設有「氣候共學堂、氣候正義與平權與個人分享區」。此為參考聯合國氣候變遷綱要公約的九大利害關係人社群，邀請企業、環境團體、婦女、 原住民、 農民、貿易及工會、青年及未來世代、獨立研究機構、 地方政府及市政機構落實氣候正義。</p>\n<p>在氣候共學堂中，邀請到台灣青年氣候聯盟倡議部的林佳諺，分享此次遊行的六大訴求，讓大家了解台灣青年氣候聯盟對於氣候治理的政策建言；第二位講者是台灣大學氣候變遷與永續發展國際學位學程博士生林孟慧，分享氣候科學的知識，讓參與的民眾了解氣候變遷的成因及衝擊；第三位講者是台灣青年民主協會理事長張育萌，分享氣候變遷下的世代正義，了解為何青年們要為氣候站出來，以及為何要引發世代的對話。</p>\n<p>在氣候正義與氣候平權的部分，首先發言的是中部平埔族群青年聯盟的李筠慧，她提到氣候變遷帶來的影響，往往是特定的族群首當其衝，重新呼籲政府，做出真正有效的氣候變遷政策。再來是環境正義基金會的葉于瑄，她疾呼氣候變遷不僅是環境議題更是人權危機。她認為現在調適的內容尚未立法，無法成為有效機制，政府應該要更廣泛的思考氣候變遷的影響層面。350台灣的Ｍartin也提到了金融層面的影響，呼籲融資低碳排的產業，而且應該要制定投資綠色產業的運作機制。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u376/20201217-04.jpg\"><br>\n<p><span>氣候共學堂。(台灣青年氣候聯盟提供)</span></p></p>\n<p>在個人分享區，從下午 2 點至2 點30分，分別依序由立法委員蔡壁如、新竹市議員廖子齊和立法委員洪申翰向參與遊行的民眾分享，作為民意代表的他們，如何推動氣候改革。蔡壁如委員提到，未來將會在財政委員會推動能源稅，需要民意的支持和堅持環境永續的價值。廖子齊議員分享減碳和調適的概念，呼籲民眾與地方政府對極端氣候共處的能力建構。並強調，氣候緊急問題不只是個人問題，而是整個公民社會、國家和企業深入各層面去改變。洪申翰立委則提到在過去科學家預測2030年的氣候狀況，都已在今年發生。強調氣候危機的緊急性，也呼籲政府、企業和個人，莫存有對於氣候變遷僥倖的心態，必須正視氣候議題。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u376/20201217-05.JPG\"><span>立法委員蔡壁如。(台灣青年氣候聯盟提供)</span></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u376/20201217-06.JPG\"><br>\n<p><span>新竹市議員廖子齊。(台灣青年氣候聯盟提供)</span></p></p>\n<h3>帶著蛙鏡上街，體驗 2050 年海平面上升後的台北</h3>\n<p>行模擬2050年時台灣的海平面高度，根據研究指出，若未來30年台灣不積極減碳，2050年海平面將上升0.56公尺，表示總統府、立法院、司法院、北一女等地標都將位於在海平面之下，預估影響約120萬人民。台灣青年氣候聯盟邀請民眾一起帶著蛙鏡上街，體驗被海水淹沒的台北都市。</p>\n<p>在路途中，設立了五個潛水點，分別在立法院、凱達格蘭大道、西門捷運站、漢口街以及新光三越外的轉角，帶著民眾戴上蛙鏡，在這些地方一起走入2050年的大海，並向大眾表達青年對氣候變遷的擔憂。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u376/20201217-08.JPG\"><span>青年戴蛙鏡上街遊行。(台灣青年氣候聯盟提供)</span></p>\n<h3>口號融入「六大訴求」，高喊「缺一不可」</h3>\n<p>青年帶領民眾高喊「氣候告急，改革必行。六大訴求，守護地球」等口號，並於立法院和環保署停留，表達青年要求台灣政府做出氣候改革，提出台灣綠色政綱的決心。</p>\n<p>遊行六大訴求：<br>\n<p>一、宣示2050年以前達到淨零碳排<br></p>\n<p>二、將氣候變遷視為國安危機，並由總統府或行政院負責統籌<br></p>\n<p>三、提出台灣版綠色政綱，落實產業永續發展<br></p>\n<p>四、強化能力建構，提升全民對氣候變遷的認識與因應衝擊之能力<br></p>\n<p>五、納入多元族群共同商議國家氣候政策六、增加氣候科學研究資源，並以國內外具權威性機構之研究成果作為政策依據</p></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u376/20201217-03.JPG\"><br>\n<p><span>青年高喊六大訴求。(台灣青年氣候聯盟提供)</span></p></p>\n<h3>用波浪舞呼籲政府正視氣候變遷，採取積極作為</h3>\n<p>遊行隊伍在環保署及集會地點立法院停留，除了表達訴求，也與參與者共同以波浪舞模擬海浪即將襲來的意象。在環保署前的廣場，邀請同行的民眾舉起手上的訴求紙板，隨者旗手跑動，用雙手展現海浪的波濤，表達海平面上升已近在環保署門口的意象。</p>\n<h3>高中生於立院前舞出對未來世界的焦慮</h3>\n<p>遊行的尾聲由政大附中熱舞社帶來這波浪潮的最高點，他們代表青少年，藉由舞蹈來表達出對氣候變遷下未來世代的憂慮及憤怒，並在表演最後被熱浪與海浪淹沒，象徵政府對於氣候變遷不作為的結果，將會由年輕世代承擔。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u376/202012170-7.JPG\"><span>政大附中熱舞社。(台灣青年氣候聯盟提供)</span></p>\n<p>活動的最後，927青年抗暖大遊行總召，同時也是台灣青年氣候聯盟成員趙品諭趙品諭，再次在立法院前重申此次遊行的六大訴求，帶領民眾以呼口號的方式，向政府官員呼籲氣候改革的急迫與必要，並期盼政府正面回應青年提出的六大訴求。</p>\n<p>&nbsp;</p>\n<p>927【氣候改革 刻不容緩 | 青年抗暖大遊行】共同發起團體：<br>\n<p>台灣青年氣候聯盟 TWYCC、綠色公民行動聯盟、地球公民基金會、環境權保障基金會、環境法律人協會、中央大學綠聚人社、台灣健康空氣行動聯盟、台灣少年權益與福利促進聯盟、台灣蠻野心足生態協會、台灣環境資訊協會、綠主張綠電合作社。</p></p>\n<p>連署單位：<br>\n<p>台大學生會、台大生物資源暨農學院學生會、台大社會系學會、台北大學永續城邦社、台灣大學自然保育社、台灣大學杯特社、台灣大學根與芽社、台灣大學氣候行動社、台灣學生聯合會、TDSA 台灣牙醫學生聯合會、台灣醫學生聯合會、中興大學綠能環保築夢社、中原大學灼言社、世新大學學生代表大會、政治大學 Green24 永續社、師範大學根與芽社、高中生人社環權工作坊、高雄醫學大學透明革命-星火社、清華大學撤資小組、陽明大學綠色創客社、瀛海中學台江社…</p></p>\n<p>\t350 Taiwan、Fridays For Future PCT、人禾環境倫理發展基金會、中部平埔族群青年聯盟、台灣青年民主協會、台灣共生青年協會、台灣永社、台灣非營利組織產業工會、台灣基督長老教會總會青年事工委員會、台灣媽祖魚保育聯盟、台灣再生能源推動聯盟、台灣國際勞工協會TIWA、台灣千里步道協會、台灣護樹協會、台灣青年綠人（Taiwan Young Greens）、台灣性別平等教育協會、台灣多元教育家長協會、主婦聯盟環境保護基金會、看守台灣協會、新竹市野鳥學會、環境正義基金會、荒野保護協會氣候變遷教育委員會、寶島淨鄉團、搶救大潭藻礁行動聯盟、媽媽監督核電廠聯盟、彰化縣環境保護聯盟、婦女新知基金會…</p>\n<p>\t本文轉自<a href=\"http://twycc.org.tw/warming_parade_announcement-0927/\">台灣青年氣候聯盟</a></p>"}, {"nid": 3917, "title": "「藻礁公投」爭議釐清：三接已閃開藻礁？不蓋會導致缺電？", "original_topic": "土地與生物保育;抗暖減碳", "adopted_cats": ["氣候變遷與調適", "完善能源政策"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20210310-001.png\"><span>大潭藻礁。（圖片來源：Google earth）</span></p>\n<p>桃園大潭觀塘工業園區中油第三天然氣接收站（下稱「三接」）案，2018年環評通過後至今爭議未停。近日，因環保團體發起的「搶救藻礁」公投連署，陸續被政治人物與藝人明星廣為宣傳，使得相關議題在第二階段連署結束前，突然躍上主流媒體與社群平台，一時引起極大關注。</p>\n<p>昨（3月1日）藻礁公投宣布通過連署門檻，很有希望成為今年8月公投的題目之一。有著2018年公投缺乏社會討論的慘痛教訓，雖然此時藻礁的討論熱度增加，但許多議題仍有待釐清。筆者做為多年參與守護藻礁行動的運動者，試圖釐清以下幾項爭議，並提出一些觀點供大家參考。</p>\n<p><h2>爭議一：三接已經閃開藻礁，不會影響？</h2></p>\n<p>我們認為仍有影響，且影響範圍需要各方拿出科學證據檢視。</p>\n<p>在三接討論興建的過程中，2016年以前，馬政府規劃確實是232公頃，面積相當廣大。2016年民進黨上台後，藻礁議題在環評過程中，政府與民間團體曾有坐下來談的機會。當時，雙方核對出藻礁最核心的保育區（現在所說的G1、G2），並在重新規劃時將藻礁核心區避開，成為現在的23公頃方案。</p>\n<p>雖然對比於過去方案，現有的縮小版本影響看起來更小，但23公頃方案是經濟部提出的變更，民間團體並沒有接受。</p>\n<p>主要原因是，雖然縮小了蓋接收站的面積，但因為需興建工業港讓天然氣載運進來，所以需要有外海防波堤，對整體沿岸流會有影響，並可能造成凸堤效應，使泥沙淤積在藻礁區上，影響範圍甚至擴及周遭的觀新藻礁保育區。因此部分學者認為，此23公頃方案仍會對藻礁造成影響，且目前工業港下方的礁石，尚無法確認有無藻礁及柴山多杯孔珊瑚的存在。</p>\n<p>而事實上，三接工程因為2018年通過環評後，已經開始施工。那麼，施工是否有直接對藻礁造成影響？據了解，2020年農委會曾委託學者再次對水下情況做研究，該計畫報告尚未完整揭露，我們也將會持續追蹤。目前學者、政府、潛水教練紛紛在網路上貼出水下照片，但輔以的文字說明有巨大落差，這值得我們坐下來攤開資料好好討論。</p>\n<p><h2>爭議二：替代方案遷到台北港曠日廢時，且不可行？</h2></p>\n<p>我們認為政府應該公開資訊，評估各式替代可能，並開放公共討論的空間。</p>\n<p>2018年環評時，民間團體大抵認同三接需要興建，但希望政府提出其他替代選項做為評估的可能。當時開發單位中油提出若轉移到台北港需要18年的時程，而時任環評委員的中研院生物多樣性研究中心鄭明修研究員則提出僅需要4-5年。</p>\n<p>近日，經濟部則認為需要11-13年，姑且不論專家學者的意見，中油與經濟部的估算竟有超過五年的落差，這中間的原因何在？我們認為，各種評估都應該攤開資料供大家討論，而非只丟個時間但沒有提供估算的方法。此外，除了台北港之外是否還有其他替代方案的想像，而替代方案又會造成整體什麼影響，政府有責任做方案的選擇；倘若方案不盡如人意，提出替代方案跟風險說明也應該要是可以對話、可供檢視的。</p>\n<p>此次爭議也有人提到，台北港方案因當地居民反對，所以新北市議會提案拒絕興建，並認為不應該成為替代方案的選項。藻礁無法像人類一樣可以為自己發聲，而願意為藻礁發聲的人們及相關資訊，也都應該在討論中並列呈現，做為評估的重要依據。</p>\n<p>當年藻礁環評在極大的爭議中過關，是少數有環評委員退席甚至官員辭職明志的案件。而在2018年環評通過後，針對關鍵議題民間團體也多次行動，希望政府有類聽證會的形式，讓雙方可以就現有爭點做清楚且理性的討論，但政府始終未開啟溝通。因此，我們呼籲政府現在重啟溝通，至少把各種三接替代方案如實說明，讓全民共同思考能源轉型的路徑。</p>\n<p><h2>爭議三：不蓋三接會影響供電穩定？</h2></p>\n<p>我們認為會增加供電風險，但不致缺電。</p>\n<p>三接是天然氣接收站，預計供應給大潭的八號、九號燃氣機組足夠的天然氣發電。這兩個機組本來預計在2024年提供的電力，各占1.1GW的裝置容量，經濟部表示加起來應占2024年整體電力的5%-6%左右，但不管三接延遲與否，並不阻礙興建大潭的八號、九號燃氣機組。</p>\n<p>就算如經濟部所言這兩部機組都無氣可用，則依照2025年備用容量率約為17.2%，扣除這兩個機組發電，估計會回到11%左右的備用容量率。台灣在2016-2018年其實備用容量率都低於11%，但都沒有發生發電不夠導致缺電的狀況。</p>\n<p>行政院前院長林全甚至在2017年立院總質詢時表示，備用容量率7.2%就足夠，多了都是浪費。因此，保守評估縱使三接沒有在觀塘興建，仍可維持穩定供電。</p>\n<p>不可否認，調度的風險會比有三接時高。但我們也需重申，藻礁公投向來的主張是「需要三接」，只是「不要蓋在大潭藻礁豐沛的區域」，所以政府的替代方案格外重要。只可惜2018年藻礁環評爭議時，政府雖提出台北港的替代方案，但始終沒有執行，否則很可能上述的供電風險，只要撐個一兩年即可渡過。</p>\n<p>亡羊補牢之計，是政府不應再一直堅持觀塘方案，盡早展開替代方案的評估，才是解決爭議、讓未來電力需求穩定的最佳解。</p>\n<p><h2>爭議四：不蓋三接就要繼續燃煤、繼續空汙？</h2></p>\n<p>我們認為三接不蓋的具體影響確實是短期內減煤期程無法加快，天然氣無法更穩定。</p>\n<p>目前大潭一號到七號的燃氣機組，都是由台中接收站收了天然氣，以海管傳送到通霄、大潭使用。未來中火的燃煤機組為了減少排碳，會逐漸改變成燃氣機組，因此會減少大潭燃氣機組可取得的氣量。</p>\n<p>儘管台中天然氣接收站擴建計畫正在進行，第五接收站也規劃在台中港，但整體來說，因應未來減煤的需求，天然氣的需求仍會高於供應。若大潭三接無法如期加入供氣，雖不至於影響供電穩定，但確實會影響老舊燃煤機組——台中中火、雲林麥寮、高雄興達——加速淘汰的進度，並拖慢台灣減碳的腳步。</p>\n<p>不過要特別說明的是，發電業造成的PM2.5，在環保署的統計中占不到台灣整體境內汙染源的10%。雖然減煤期程會受影響，但空汙改善仰賴多管齊下的治理，絕對還有其他做法可行，例如產業與交通源的改善等。</p>\n<p>另外，在上述供氣架構下，現在法定的天然氣儲存量是七天，但因應未來天然氣發電可能占全台灣的一半電力，所以一直想要修改天然氣儲存量到十四天。若三接沒有如期建置，這個增加天然氣安全的方向也會受影響。但縱使蓋在觀塘，因為海象不佳，中油自己評估一年可能有53天不能營運，因此對供氣穩定來說，三接蓋在觀塘不一定是最佳解，中興大學環工系莊秉潔教授更直指，三接移到台北港才能真正穩定。</p>\n<p>上述兩個問題，都是因為「三接的必要性」，若三接不蓋在觀塘，而在其他地方加速進行，就可以讓上述問題更快解決。</p>\n<p><h2>爭議五：不蓋三接就要重啟核四？</h2></p>\n<p>我們認為所有問題，核四重啟都無法解決。</p>\n<p>核四蓋了20多年，興建過程中弊案重重、蓋到一半淹水、「拼裝車式」地還蓋在斷層旁的老舊核四廠，是這次討論中最不值得一提的。在供電穩定上，核四在2019年經濟部的評估中，最樂觀的估計是要等N+7年後，才可以蓋好發電。這個N的影響因素，除了地方居民的不同意，更多是因為機組太過老舊找不到零件。</p>\n<p>此外，這個時程因為今年核四建照過期，未來重啟核四光在建照重新取得合法申請的路徑上，就會拖更長的時間，且因為變成新核電廠建造，就需要符合福島核災後核電廠的規範，保守估計十年內絕不可能發電。就算不計核四廠的問題、無視核廢料處理困境、不管核災的高風險，核四廠真的要能商轉發電，樂觀評估也至少要等到2032年左右。</p>\n<p>也就是說，若現在開始興建新的接收站，跟繼續浪費錢把核四廠蓋下去，是差不多時間完成的，而且核四也只有一部機組可以使用，電力貢獻遠低於大潭電廠。這就清楚顯示，核四廠的電是無法讓2025年的備用容量率往上加。簡單來說，就是供電穩定的風險不會因為核四而有好轉。</p>\n<p>此外，最近因用過燃料棒的水池爆滿、被迫提前停機的核二廠一號機，更是沒有完成任務就先退場，造成其他發電機組負擔增加，是名符其實的豬隊友。可見在台灣未來電力發展脈絡的規劃中，依賴核電是不能解決任何問題的。</p>\n<p>更不用說，減煤期程也同樣因新三接蓋好的時間點與核四高度重疊，所以核四的發電無法解決現在看到的空汙問題，天然氣的供應穩定則與發電廠無關。在藻礁公投領銜人已再次公開聲明，守護藻礁的能源轉型立場是「非核減煤救藻礁」的方向下，擁核人士不該一再想要綁架這場守護藻礁的公投，不應再用「吃豆腐」的手段叫囂。</p>\n<p><h2>傳統集中式發電，註定是「犧牲」的體系</h2></p>\n<p>在天然氣接收站的興建上，除了三接，在基隆協和電廠也預計要做四接（填海造地，底下也有珊瑚礁）；在台中港外海除了既有的接收站，也預計要做五接（可能會影響白海豚的部分棲地）。三接是否造成藻礁的犧牲，在前文已經說明，更有待政府與民間真正坐下來對話與確認，而所謂四接、五接的議題也都值得好好討論。</p>\n<p>而現有電廠的選址，無論是核一二的金山萬里、核四的貢寮，又或者常常被詬病的台中火力發電廠、雲林麥寮電廠、高雄興達電廠、恆春核三廠，都有當地人生活受影響的紀錄與經驗。若要維持穩定供電，現有的集中式發電——一個大電廠供應給遠方城市電力——註定是一個「犧牲」的體系。</p>\n<p>回過頭來，如果我們不希望有人、生物持續被人類的發電而犧牲，如何增加節電的誘因如調整成合理的電價、如何發展相對不造成犧牲且可恢復環境的再生能源，是現階段最該大力推動的。但現實是，除了節電與發展綠電外，既有的電力系統要如何「選擇」，更值得大家有系統地一起討論。</p>\n<p>藻礁議題是天然氣在接收站的位置選擇上，造成了現在藻礁的爭議，事關生物／自然界與人類關係的平衡與選擇，也同時是使用能源上的反思與檢討。</p>\n<p>過去，守護藻礁行動有舉辦過音樂會、遊行、現地教育勘查等行動，也不斷在環評、政府會議中溝通。面對諸多爭議各說各話、無法釐清的情況下，也期待政府舉辦依行政程序法進行的聽證程序，讓公共議題有靠證據說話的機會。無奈此項訴求一直無法達成，在工程船已經開進了大潭藻礁，迫不得已才發起公投，希望讓公共對話可以持續。</p>\n<p>過去幾個月之間雖在街頭連署、網路宣傳，但直到連署倒數幾日，才突然引起如此熱烈的討論，這當然與政治力介入有關。不過我們仍一本初衷，堅守「非核減煤救藻礁」的立場，不讓政治力綁架，也促使原來期待的公共討論得以發生。</p>\n<p><h2>務實推動能源轉型，讓綠能放在對的地方</h2></p>\n<p>我所屬的地球公民基金會，除了主張節電與發展綠電，也希望釐清現有各式發電的爭議，讓全民一起思考並做選擇。</p>\n<p>接下來，我們會更務實地推動能源轉型。過去我們參與能源轉型推動聯盟，監督各縣市政府的節電計畫並與地方政府溝通，透過評比來提升地方能源治理能力。過去我們也推動綠能，但除了推動，更重要是讓綠能放在對的地方，所以要求政府建立環境與社會檢核機制，幫綠能找一個好位置。而在傳統能源議題上，我們參與公投、提出論述，都是希望能夠有更公開的資訊與平台，讓大家反思爭議背後的實質問題，並且一起面對與解決。</p>\n<p>或許有朋友會問，藻礁連署通過後，會不會讓有心人趁機綁架藻礁公投，推核四重啟公投過關？我們要說，這是一定會的，因為部分擁核人士與有心的政治人物已經這麼做了，到8月核四重啟公投前只怕會更變本加厲。</p>\n<p>這是我們的擔憂，更不樂見繼續下去，但沒收公投絕不是解決問題之計，面對假訊息跟中國資訊戰，台灣人民需要練習的是判讀資訊，這才是強健自我的根本。因此，盡可能提供社會更完整的資訊，讓公共議題的討論更純熟、更不易被操作，促進台灣民主深化，最是關鍵的課題。</p>\n<p>當前的多頭難題，與2018年民進黨政府強行通過藻礁環評有絕對的關係，當時中油對於資料的隱瞞、說明不清，如今一一遭受質疑，更是罪魁禍首。而過去缺乏的關注、社會討論，此時已經藉由公投提案的熱度提升，有更豐富的觀點。由於目前藻礁公投連署人數已超過法定門檻，接下來執政黨已無法迴避人民對這項公共政策所提出的質疑。</p>\n<p>氣候變遷與能源議題，不僅牽涉人民生活的食衣住行，更涉及國家整體經濟與環境政策，甚至國安與國際議題。因此期望本文能提供大家更多思考與判斷的線索，並希望台灣社會能充分尊重每個人在綜合思考後的價值選擇。期許大家不僅與環團一起支持藻礁，也用相同的力道與我們一起阻擋無用的核四，把資源用於建立更健全的節能與綠能發展環境。</p>\n<p>&nbsp;</p>\n<p>20210302鳴人堂投書：<br>\n<p>上篇｜<a href=\"https://opinion.udn.com/opinion/story/7854/5279052?fbclid=IwAR0aI1SgcSZJXSsc-yxdJs0DdS7ck9KcIQzVdhiar2LX7UHtBIWfM5e5NMA\">【「藻礁公投」爭議釐清（上）：三接已閃開藻礁？不蓋會導致缺電？</a><br></p>\n<p>下篇｜<a href=\"https://opinion.udn.com/opinion/story/7854/5289215?fbclid=IwAR2TaAWw2IBRFF3ccHU8gObgsEcW98cCN2GuiIN6uOdBHAf4hrvMBaWBa58\">【「藻礁公投」爭議釐清（下）：三接已閃開藻礁？不蓋會導致缺電？</a></p></p>"}, {"nid": 3965, "title": "面對大旱，啟動東港溪污染整治", "original_topic": "水資源與環境治理", "adopted_cats": ["氣候變遷與調適", "高屏大湖"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20210612-06.jpg\"><br>\n<p>2011年，在反高屏大湖的過程中，我們提出了符合「環境友善，城鄉互惠」，極端氣候下最優先的水資源調適策略，希望透過民間和政府的合作，化解政府和民間數十年的水資源開發爭議，採取真正具有永續性的行動。</p></p>\n<h3>我們提出三個無悔方案。</h3>\n<p><strong>1.改善漏水。</strong>大高雄地區只要降低漏水率10％，就可以增加每日供水15萬噸以上。</p>\n<p><strong>2.民生用水回收，供應工業用水。</strong>大高雄地區的中洲污染處理廠，每天有8、90萬噸經二級處理的家庭污染排入大海，如果能夠提昇至三級處理，至少可以取代目前工業用水每日所需的30萬噸。</p>\n<p><strong>3.藍色東港溪。東港溪的供水潛能，</strong>枯水期每日可提供48萬噸的水源，豐水期更高達每日98萬噸。如果政府在沿岸做好畜牧和民生污水的管理，將水質提昇至民生用水水準，再利用現有的港西抽水站輸送至鳳山水庫，大高雄每日將增加18-68萬噸的用水。如此一來，大高雄人民可以「喝到好水」，東港溪將恢復良好的自然生態，兩岸居民也擁有乾淨的親水遊憩空間，可說是「城鄉互惠」的多贏方案。</p>\n<p>有興趣的朋友可以看一下當年這份<a href=\"https://www.cet-taiwan.org/publication/issue/content/2700&nbsp;\">歷史文件</a></p>\n<p>===============================<br>\n<p>十年過去了，政府有做事，改善漏水、再生水陸續啟動，雖然腳步還是慢了，但已成了這次抗旱的一部分救急水。</p></p>\n<p>不過，東港溪的問題，則從我二十幾年前踏入環境運動圈，在前撲後繼的官民人士努力，始終沒有看到真正的曙光。需要討論的是，為什麼進度如此緩慢？</p>\n<p>很明顯的，單靠屏東縣政府的力量，不足以處理這個高難度的問題；做為用水端的高雄市，如何付出責任和行動，也仍待討論。</p>\n<p>這是需要中央跨部會、地方跨縣市要合作，人民參與，才能真正改善的大工程。希望這幾天民眾和媒體的關注，可以促成一些改變，而不是增加口水。<br>\n<p>我認為，東港溪整治此其時也，因為出現更好的契機可以處理這件事。</p></p>\n<p><strong>農委會</strong>有因應美豬進口的國產豬事業提升，其中本來就有提養豬升設備現代化的經費。</p>\n<p><strong>經濟部</strong>的再生能源政府持續推動中，沼氣發電有躉售價格的誘因。農委會也有獎勵補助計畫。</p>\n<p><strong>環保署</strong>本就有水質改善方案；屏東縣府有決心會持續提昇稽查和輔導的力道。</p>\n<p>藍色東港溪保育協會持續和水利署、鄉鎮公所公私協力，推動沼渣沼液再利用的行動。</p>\n<p>如果蘇貞昌院長可以責成政務委員（分工上可能是吳澤成政委），盡速整合各部會、地方政府的工作項目，以降低原水的氨氮指數至飲用水標準為目標，設定出期程，以科學化有效的管理完成目標，就可以創造增加供水、生態環境、提高生活品質的多贏。</p>\n<p>東港溪水量穩定，豐枯比為7:3，相較之下，高屏溪攔河堰則為9:1。就我所知，不分官方和民間，長期關注南部水資源議題的人士，多數認為東港溪是高雄的救命水，當枯旱已成常態化，再不做更待何時？</p>\n<p>當然，一定有許多執行面問題需要釐清，但根本上還是政治決心的問題。</p>\n<h3>東港溪污染來源</h3>\n<p>港西抽水站上游養豬約有 53 萬頭及人口 25 萬人，若以養豬一頭相當於 4 人污染量估計，東港溪污染負荷約相當於 240 萬人口當量，其中 215 萬人口當量來自養豬，佔90%，25 萬人口當量則來自生活污水，佔 10%。（資料來源，鳳山水庫水質治理方案草案，環保署2010.11）</p>\n<p>為什麼這麼髒的水，可以處理到變成安全的自來水？</p>\n<p>2014 年起進行東港溪原水前處理工程，打造10 座生物濾池，運用工研院BioNET技術，可去除氨氮及有機質，經處理後之水質可符合飲用水水源水質標準，再經過後端處理後即是符合標準的自來水。（摘錄自：<a href=\"https://www.itriwater.org.tw/Technology/More?id=111\">創新水科技研發服務網</a>）</p>\n<p>&nbsp;</p>"}, {"nid": 4024, "title": "橋科為新一代科學園區指標，環評不應草率通過--落實草鴞保育對策、保障中崎有機農民", "original_topic": "國土治理;工業污染", "adopted_cats": ["氣候變遷與調適", "國土計畫"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20210901-003.jpg\"><br>\n<p><span></span><span>橋科為新一代科學園區指標　環評不應草率通過--落實草鴞保育對策、保障中崎有機農民（本會資料照片）。</span></p></p>\n<p>今日環保署召開環評大會，審查橋頭科學園區（以下簡稱橋科）開發案。民間團體認為，橋頭科學園區位於一級保育類動物草鴞之棲地是否適合開發；如何有效保障中崎有機專區農民之權益；如何因應國際2050淨零排放目標制定100%再生能源、再生水路徑等爭議，均待更完整的討論與解決機制。</p>\n<p>然開發單位—科技部南部科學園區管理局（以下簡稱南科局）在高雄市政府的開發高度政治壓力下草率送件，使該案最終於7月27日通過專案小組初審送入環評大會審查，民間團體深表遺憾。我們呼籲<strong>環評委員將本案退回專案小組</strong>，待草鴞保育對策、中崎新有機專區之規劃與溝通完備後，再送大會審查。</p>\n<p>而為確保上述爭議在未來能被有效討論及處理，針對本日橋科開發案之環評大會審查，民間團體提出兩點訴求：</p>\n<p><h2>一、建立草鴞保育推動小組，落實橋科草鴞保育對策</h2></p>\n<p>橋科預定地為瀕危一級保育類動物—東方草鴞之重要棲地，然而數位生態專業委員及林務局皆多次在專案小組會議中，對南科局研擬的草鴞保育對策提出疑慮。雖南科局業已於環評大會前召開專家學者會議，提出「南部科學園區東方草鴞保育計畫」，然該保育計畫中所提及的五項「保育目標及作法」，目前之規劃仍相當粗略，未來執行是否能達成草鴞保育之綜效，仍需持續觀察檢驗。</p>\n<p>是以，為確保本案提出的草鴞保育對策能積極有效的被實施，民間團體要求南科局<strong>應成立草鴞保育推動小組</strong>，邀請學者專家、相關機關與民間團體參與，定期檢視本案草鴞監測與保育成果，以對環評報告書的相關保育對策提供滾動式的檢討建議。其中，保育推動小組之經費應由南科局撥付，且民間團體、專家學者，應佔其中2分之1以上之席次。</p>\n<p>民間團體呼籲環評委員，應要求南科局將上述訴求文字化，並研擬適當之草鴞保育經費，載明於環評報告書中加以落實。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20210901-001.jpg\"><br>\n<p><span></span><span>高雄橋頭科學園區預定地的中崎有機農場一帶，發現瀕臨絕種的一級保育類野生動物草鴞，目前全台數量僅300至500隻。（楊登旭提供）。</span></p></p>\n<p><h2>二、政府對「中崎新有機專區、受橋科開發影響有機農民」之承諾應明確文字化</h2></p>\n<p>針對橋科既有預定地上之中崎有機專區農民之耕作權益，行政院農委會及高雄市政府雖已承諾設立新有機專區專案安置，民間團體多次要求南科局詳細說明新有機專區之規劃設計、農民進駐之條件、新專區管理辦法及第二階段開發之經費來源與期程等資訊，以供社會大眾公開檢視，南科局與相關單位卻都未能於環評審議過程中進一步釐清。</p>\n<p>然而，根據高雄市政府辦理說明會之會議記錄，及民間團體與農委會面會之資訊，可知上述措施，均已有明確之政策方向，卻未能於環評中公開說明。是以，為確保有機農民權益能受到保障，民間團體呼籲環評委員，應要求南科局會同行政院農委會及高雄市政府，<strong>釐清對新有機專區之相關承諾，具體文字化並載明於環評報告書中</strong>，確保承諾在未來能夠被監督落實。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20210901-002.jpg\"><br>\n<p><span></span><span>中崎有機農場(地球公民資料照片)。</span></p></p>\n<p>以上訴求，均為南科局已積極處理之事項，民間團體僅提出相應建議，以確保南科局之承諾能被確實執行。如南科局無法針對上述核心課題提出回應或相應措施，則代表相關爭議仍需更多時間加以釐清，也同時代表<strong>本案退回專案小組重審實為必要</strong>。</p>\n<p>最後，民間團體再次呼籲，橋科是我國科學園區政策環評後首個新設的科學園區開發案，亦是開啟新一輪的產業轉型的重要指標，應以最高標準進行開發評估。橋科能否成為與在地人文及生態環境達成共存共榮的「生態型科學園區」，能因否應國際2050淨零排放趨勢，落實循環經濟（零排放、零廢棄、零事故）等國際環境標準，全台民眾都在看。</p>\n<p>共同聲明團體：台灣有機農業促進基金會籌備處、地球公民基金會、環境權保障基金會（照筆畫順序）<br>\n<p>&nbsp;</p></p>\n<p><hr></p>\n<p><strong>會議結論，本案有條件通過，環委亦採納民間團體成立「草鴞保育推動小組」之訴求。我們針對橋科的監督不會停止，邀請社會大眾與我們共同持續關注。</strong></p>\n<p>&nbsp;</p>"}, {"nid": 4062, "title": "三接遷離大潭藻礁公投，地球公民基金會的觀點和建議", "original_topic": "空氣污染;抗暖減碳;新能源與電業改革", "adopted_cats": ["氣候變遷與調適", "完善能源政策", "監督高雄重大污染"], "content": "<p><img alt=\"20210617001.png\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20211129-002.JPG\"><br>\n<p><span>三接遷離大潭藻礁公投，地球公民基金會的觀點和建議。圖為興達發電廠。（圖╱地球公民基金會）</span><span></span></p></p>\n<p>距離公投不到一個月，天然氣第三接收站（簡稱三接）遷離大潭藻礁海岸與海域公投案，是關心環境保護與能源轉型的公民，最為糾結的課題。</p>\n<p>上週（11月16日），<a href=\"https://www.twreporter.org/a/2021-referendum-algal-reef-environmental-groups-divided-opinions\">《報導者》寫出了環保團體之間的分岐</a>，讓社會看到這個題目判斷上的艱難。地球公民基金會身為同時關注國土保育與能源轉型的組織，正是尚未表態的組織之一。公民投票只有同意、不同意、廢票或不投票的選擇，地球公民自許為環境專業組織，有責任向公眾說明我們的判斷為何。</p>\n<p>今年4月時，我們和友團舉辦對焦會議釐清課題，10月政府提出了<a href=\"https://www.cna.com.tw/news/firstnews/202105035006.aspx\">「再外推方案」</a>，近日，公投提案方則提出<a href=\"https://www.thenewslens.com/article/158967\">台北港替代方案</a>，這半年多來社會的諸多討論，讓我們對於三接對於能源轉型、中南部減煤時程、老舊煤電廠除役的影響，對藻礁生態的影響、替代方案可行性，重大爭議，已愈來愈清晰。</p>\n<p><strong>我們建議對三接遷離大潭藻礁海岸與海域公投案投不同意，也籲請尊重決定投下同意票的選民。以下從幾個觀點，提供選民參考。</strong></p>\n<p><h2>從聲援團體的角度看保護藻礁運動</h2></p>\n<p>桃園的藻礁長達27公里，從竹圍漁港的南崁溪，南至觀音鄉大堀溪口近20公里的藻礁海岸，受到工業嚴重汙染與「突堤效應」影響，僅最南邊的觀新藻礁，在桃園在地聯盟等團體與保育人士的長期倡議努力下，被市府於2014年公告為「桃園觀新藻礁生態系野生動物保護區」；而夾在北邊嚴重破壞區和保護區之間的，正是這次環保團體想要爭取不受工程影響的大潭藻礁。</p>\n<p>大潭藻礁影響，應分為礁體本身、與其形成的藻礁生態系兩部分來談。經濟部目前提出的再外推方案，依據現有地質鑽探資料，已迴避了大潭藻礁G1、G2已知的主要礁體範圍，加上海域不濬深航道、亦無填海造陸，對礁體本身影響減小許多。如今大潭藻礁未知的保育風險，是再外推防波堤的漂沙是否影響整體藻礁生態系。此部分各界尚無定論，根據成功大學水工試驗所的模擬，再外推方案會使海流加速、減輕藻礁淤沙；藻礁公投推動聯盟則認為，外推後突堤效應影響範圍反而將變大。</p>\n<p>儘管此項爭議有待後續釐清和驗證，但不可否認，經濟部推出的再外推方案確實朝向減輕生態影響之目標，而該措施預計將使完工時程將延長2.5年、增加150億預算，已屬環境運動中罕見的角力成果。</p>\n<p>中油三接工程的歷史、環保運動的堅持和政府的程序爭議，我不再細數。每一場社會運動下來，參與者對運動成果的評價總是有差異，如果從大潭藻礁的保護運動至今的結果來看，我認為已達成了很重要的成就。正是潘忠政老師等環保人士和團體的堅持和無私的努力，社會才看到了藻礁生態的珍貴和重要，因而劃設了觀新保護區，以及因公投的壓力，讓政府提出再外推方案，將大潭藻礁的破壞減到最小，並且將環評差異分析報告（簡稱環差報告）送環評會審查。</p>\n<p>我們能夠理解公投提案方堅持履行對連署群眾的承諾，持續擴大運動的戰果，努力推動公投通過，要讓三接離開大潭海域。但是，我們也不能無視三接在能源轉型中扮演的重要角色。</p>\n<p><h2>生態保育與能源轉型的對話中，我們學到的經驗</h2></p>\n<p>首先，我們認為三接與<a href=\"https://www.mirrormedia.mg/story/20210422inv005/\">國光石化</a>不應相提並論，國光石化從開發到營運都是高汙染、高耗能、高碳排，流血輸出的產業，而天然氣在台灣能源轉型──邁向淨零排放的角色則是取代核電和部分燃煤、搭配綠能，以達成非核、減碳、減空汙的重要能源設施。這一點護礁提案方並不否認，也因此在日前提出了台北港作為大潭的替代方案。</p>\n<p>天然氣和煤碳相比，碳排及氮氧化物約僅4成，硫氧化物等直接排放的空汙更不到1成，且完全沒有重金屬的汙染，可以說是從煤碳過度到再生能源很重要的橋接能源，世界各國的規畫皆然，因為就是沒辦法一口氣直接跳到再生能源。近來爭論的天然氣甲烷逸散排放問題，主要是在開採階段，需要的是強化其監管減少洩漏。全世界主要地區，即使把洩漏率都考慮進去，天然氣的溫室氣體排放還是比燃煤少很多，台灣做為購買者，可以要求出口國生產商減少洩漏。</p>\n<p>2016蔡政府上台之後，提出了電力結構的轉型目標，2025燃煤要從50%降到30%，這需要增加大量的天然氣供應。</p>\n<p>然而，台灣現有的天然氣接收站位於高雄的永安、台中港；用電最大的北部，雖已建好大潭天然氣電廠，卻沒有天然氣接收站。於是，可以就近供應大潭電廠的天然氣第三接收站非常重要。</p>\n<p>北部的用電缺口一向高於中南部，「南電北送」是長期的區域不正義，公投案如果通過，將極有可能延宕雲林麥寮燃煤機組、台中燃煤機組、高雄興達老舊的燃煤機組的退場、或轉為備用的煤碳使用量。中南部空汙嚴重，此時再燒煤碳，把電送到北部，情何以堪？</p>\n<p>如果三接可以順利在2025年供氣，<a href=\"https://finance.ettoday.net/news/1931057\">經濟部預估將可以取代137億度的燃煤發電量</a>，那麼高雄興達兩部、台中電廠兩部老舊的燃煤機組就可以提早轉為備用，或者提前除役（註）。</p>\n<p>事實上，高雄興達電廠也正在新建燃氣電廠。地球公民基金會原本的主張，是支持新建燃氣機組、但要先拆除全台最老舊的燃煤機組，再原地新建，以完整保留台電所購置的永安廢棄鹽田溼地。但在<a href=\"https://udn.com/news/story/7327/5271319\">環評過程</a>中，理解到為了加速減煤時程，難以先拆後原地興建。最後，我們和高雄市野鳥學會等團體協力與經濟部進行協商，盡力讓台電最大保留了鹽田溼地的面積，承諾往後不再開發，且成立生態保育小組，監督後續保育工作；同時讓燃煤2部機組提前除役、2部機組轉為備用。</p>\n<p>過去，我們本就和鳥會等友團協力推動茄萣、永安溼地保育工作，就生態保育的角度，勉強接受這樣的結果，似乎是個妥協，但卻可能是當下就各種利害衝突下，最可能的解方。這是我們從能源轉型課題中，所學習到的經驗。</p>\n<p>反觀台中電廠要新建天然氣機組，<a href=\"https://www.cna.com.tw/news/afe/202103210080.aspx\">盧秀燕市長主張</a>，若要增加2部燃氣機組、就一定要拆除4部燃煤機組，導致延宕台中燃煤機組停機轉為備用的時間。</p>\n<p>作為同時推動國土保育、能源轉型、減空汙的團體，在三接再外推方案已盡可能迴避藻礁生長的潮間帶的情況下，我們認為：</p>\n<p>透過公投堅持三接離開大潭，並非對台灣最好的選擇。</p>\n<p><img alt=\"20210617001.png\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20211129-001.jpeg\"><br>\n<p><span>2019年2月18日，針對環保署將舉行的興達燃氣電廠環評第三次專案小組會議，高雄10個民間團體共同在高雄市政府前舉辦記者會，希望高雄市政府提高層級，到興達電廠環評會議與民間站在一起，救空氣、護溼地、讓老舊燃煤提前除役。（圖╱地球公民基金會）</span><span></span></p></p>\n<p><h2>開發案的程序正義</h2></p>\n<p>台灣生態環境的保護運動，是社會極其微弱稀有的聲音。儘管各種民調都顯示國人重視生態環境，然而真正願意了解和採取行動的人還是很少。</p>\n<p>桃園藻礁的保育，若不是潘老師等人至今的堅持，劉靜榆、陳昭倫等學者的研究，國人不會知道大潭藻礁的珍貴與保育重要性。</p>\n<p>回顧三接環評爭議，地球公民曾在<a href=\"https://www.cet-taiwan.org/node/3926\">公投成案時的聲明</a>提到：「對於當前的兩難困境，民進黨政府要負起最大的責任。」原因在於2018年行政院賴清德前院長急於定案，強勢介入環評，導致5位環評委員因此退席抗議，最後由官派委員主導下通過環評案，<a href=\"https://www.twreporter.org/a/interview-zhan-shun-gui-thomas\">詹順貴前副署長並因而請辭下台</a>。而在2018年環評通過後，民間團體也多次行動，要求政府針對尚未解決的關鍵議題舉辦類聽證會的形式，讓雙方可以就現有爭點做清楚且理性的討論，但政府始終未開啟溝通。</p>\n<p>至今，民進黨尚未對於當初粗糙的環評公開致歉反省，也沒有正面回應聽證會的訴求。護藻團體對於執政黨的信任就是這樣流失的，這也是包括地球公民在內，許多聲援、支持三接遷離大潭藻礁公投的各界人士和組織，當初聲援公投來迫使民進黨政府出面跟民間社會對話的理由之一。</p>\n<p>三接「再外推方案」的環評差異分析報告，已召開第一次專案小組審查，有專家認同「再外推方案」可望大幅降低對藻礁及海洋生態的影響；有專家則認為欠缺充足證據，宣稱仍然影響甚鉅。在沒有審查結論之前，我們都無法妄斷。然而環評制度的設計是，如果環差不通過，就回到原方案，或者做出退回經濟部的選項，我們希望過去沒有釐清的爭議，有機會在環差會議上討論。</p>\n<p>同樣的，最近公投提案方提出了台北港做為替代方案，在台北港既有港區寬度不足、BOT廠商未必願意放棄權益讓出碼頭的現實下，開發恐仍需填海造陸、拉設天然氣海管，這些衝擊影響、時程需求都尚未調查。難以現在就說，台北港對環境生態的影響，必然小於大潭再外推方案。</p>\n<p>程序正義能否藉由公投導正？我的答案是：</p>\n<p>程序正義難以只仰賴制度，沒有一勞永逸的解方，只能在一次又一次的角力中去爭取強化，這就是民主制度的正反兩面。如何在程序正義和時效上拿捏分寸，這不僅是執政者的考驗，也考驗著社會的價值取捨。</p>\n<p>民進黨在三接案以政治力介入強勢通過，不願召開聽證會釐清爭議，該受到譴責和導正。但是公投案的結果是全民在承受，如果因為程序有不正義，就讓公投通過，導致減煤時程的減緩，受害的是中南部繼續吸髒空氣的人民。</p>\n<p>我們認為：</p>\n<p>程序正義的追求是另一個長期戰場。或許三接遷離大潭公投案的投票選擇各自有差異，然而，強化開發案應有的程序應是很大的社會共識，如何讓執政者不再規避適時的依法舉辦聽證，盡速公告聽證程序的配套子法，以及推進環評制度改革，很需要持續且強健的社會力，才有機會推進。</p>\n<p><h2>替代方案與轉型路徑</h2></p>\n<p>大潭三接的減煤效果，難道不能用節電或能源管理、耗能產業轉型的做法，從需求端降低電力需求嗎？</p>\n<p>我很同意「除非大幅減少能源使用、否則環境衝突只會加劇」。</p>\n<p>面對氣候緊急時代，台灣繼日本、韓國宣布邁向2050淨零排放之後，蔡英文總統也做了同樣的宣示。台灣地狹人稠，既要調和能源設施與生態保育、農漁發展的衝突，又要面對減碳時程壓力，維持經貿競爭力，可預見將是一個極為艱難的挑戰。台灣的減碳腳步已經嚴重落後，減少空汙更是迫在眉睫。現實面，氣候愈來愈炎熱，中美競爭下台灣經濟持續成長，及朝向電氣化轉型以汰除化石燃料的需求，都使得台灣的用電量不斷創新高，產業用電和民生用電皆成長。</p>\n<p>我們認為：</p>\n<p>必須透過節電、能源管理去抑制需求，同時持續擴大天然氣、再生能源，取代燃煤這種骯髒的電力，齊頭並進才有機會達成減碳和減汙。</p>\n<p>三接每年有減500萬噸煤的效益，如果有了三接加上需求端管理、節電，就可以深度減煤，效果可以再累加。</p>\n<p>而最困難的是產業結構調整。汰換柴油老車的例子記憶猶新──大型柴油車的PM2.5排放不亞於燃煤電廠，然而，儘管政府祭出各種補助要協助老車淘汰，但卻碰到車主強烈抗議，甚至連部分反空汙團體都來助陣。</p>\n<p>這反映著，產業轉型就是會碰到就業和經濟的挑戰，因此，國際間提出「<a href=\"https://www.twreporter.org/a/opinion-uk-cop26-glasgow-climate-pact\">公正轉型</a>」的概念和配套，嘗試調和這些矛盾。這需要劃出時程表，不可能馬上達成。</p>\n<p>我們一定要在既有的發展框架下，提出減碳減汙的解決方案和路徑嗎？當然不一定。</p>\n<p>接受三接「再外推方案」，確實不是一個根本解決環境問題的作法，只是盡可能降低對環境衝擊。我們期待各界一起來探討，我們是否有更好的選擇。但公投在即，我們恐怕無法等到這個答案出來，才做出選擇。</p>\n<p><h2>結語：盡可能求取最大社會共識</h2></p>\n<p>三接遷離大潭公投案，涉及到能源轉型中減碳、減煤、減空汙的時程和代價，以及我們願意為生態環境的保護做到什麼程度，然而，公投只有通過與不通過，每個公民都得在投票時做出選擇。本案涉及生態保育、能源轉型、程序正義或社會共識，投票行為的背後往往反映著不同的價值排序，即使同為環境生態的關懷者，投票意向也有差異，我們呼籲彼此互相尊重。</p>\n<p>地球公民做為一個曾經聲援和支持公投連署的組織，在三接再外推方案出爐之後，我們就現有已知的資訊判斷，認為這是一個可以兼顧增氣減煤時程，同時迴避對藻礁破壞的折衷方案。就當時所支持的公投做為一個運動策略，已達成階段性目標，接下來，需要的是更多的公共討論，以取得能源轉型路徑的共識。</p>\n<p>社會運動的目標是為了促成正面改變，而不是為了輸贏。因此，從上述幾個觀點，呼籲選民深入了解利弊得失，我們建議三接遷離大潭公投案投不同意，也尊重主張三接應遷離大潭的選民。誠摰呼籲不同立場的各界人士避免人身攻擊，回歸事理與公共政策的討論，否則將嚴重壓抑和傷害了言論空間。</p>\n<p>台灣環境團體並非一體，各組織本來就存在著路線和作法的差異，對於減煤、減碳、減空汙，可能有不同的路徑和策略方案。如果三接公投可以促進環境運動背後的價值、知識、路線辯證，對於台灣社會邁向更理性成熟的公民社會未嘗不是一件好事。能源轉型、環境永續之路尚遙，很需要更多積極公民、社群、團體的參與和合作。環境價值是台灣多元價值的一部分，必須要透過對話爭取社會的支持，而非自然而然成為一個優先的價值。</p>\n<p>地狹人稠的台灣，要邁向2050淨零排放是一個極為艱難的挑戰，三接的衝突矛盾只是開始。基隆協和電廠的天然氣第四接收站正在環評審議，填海造陸的爭議未必小於三接；光電需要大面積的土地，<a href=\"https://www.twreporter.org/a/opinion-conflict-of-greens-solution-integrated-resource-planning\">與農漁村、生態環境空間衝突</a>是現在進行式。執政者應在淨零時程壓力下，充分考量社會公平、環境最小衝突，透過能源設施的國土規劃、生態基礎調查、健全環境與社會評估，落實程序正義，盡可能求取最大社會共識，不應再重蹈政治力介入三接環評的覆轍。</p>\n<p>人非聖賢孰能無過，環境團體也是，對於三接公投案的建議，地球公民歡迎各界指正，如同每位公民的投票選擇，未來也將一起承擔歷史檢驗。</p>\n<p><hr></p>\n<p>（本文為2021/11/29&nbsp;刊載於報導者：<a href=\"https://www.twreporter.org/a/opinion-2021-referendum-algal-reef-citizen-of-the-earth-suggestion\">三接遷離大潭藻礁公投，地球公民基金會的觀點和建議</a>）</p>"}, {"nid": 4072, "title": "節能加三接，才是台灣的非核減煤路徑", "original_topic": "抗暖減碳;廢核", "adopted_cats": ["氣候變遷與調適", "完善能源政策"], "content": "<p>面對氣候緊急，全球各國多以2050淨零排放為目標，提出短中長期的減碳路徑，台灣也不能例外。為了全面加速淘汰化石燃料，必須同時推動節能與綠能，並輔以天然氣作為橋接能源，才能兼顧環保與發展需求，更快達到減碳效果。</p>\n<h3>總能源負成長，但不執著於電力零成長</h3>\n<p>為了協助各國擬定減碳策略，國際能源總署提出全球能源部門2050淨零路徑圖（請參考圖一），指出2040年全球每發一度電的碳排應該是零的階段目標。</p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20211214-01.png\"><br>\n<p><span>圖一、全球能源部門淨零路徑圖（「燃氣橋接」為筆者所加註）。</span><span> 圖／</span><a href=\"https://www.iea.org/reports/net-zero-by-2050\">IEA（2021）</a></p></p>\n<p>在圖一中可以看到，為了達到電力排碳為零，2020年至2040年必須快速削減燃煤發電至零，同時大量發展風力與太陽光電等再生能源。而天然氣雖也是一種化石燃料，但因其污染與溫室氣體排放量都比燃煤少很多，又可搭配再生能源快速升降載，因此國際能源總署建議，在未來10年內仍需增加天然氣，以便快速取代燃煤、輔助再生能源發展，2030年達到階段性目標後，開始在全球加速削減。換言之，現階段天然氣在全球電力系統中必須扮演橋接的角色。</p>\n<p>\t那麼在這個淨零路徑中，整體的能源與電力消費型態如何呢？國際能源總署預測，2020年起全球整體能源消費將逐年減少至2050年削減17%，這其中包含石油消費年減4.2%、煤炭年減5.4%、天然氣則是先增後減，電力的消費則是年增2.5%（請參考圖二）。</p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20211214-02.png\"></p>\n<p><span>圖二、全球淨零路徑下最終能源消費變化圖。 圖／</span><a href=\"https://www.iea.org/reports/net-zero-by-2050\">IEA（2021）</a></p>\n<p>\t大家或許會問，若要達到減碳，為何不是電力零成長呢？這是因為製造業及交通部門在減碳過程中，除了提升能源效率、減少能源消耗之外，也需將原本直接燃燒化石燃料的過程轉為以電力驅動，因此造成用電量增加。例如電動車增加用電，大幅減少石油用量；石化業將煤油製程改為用電以減少污染。要注意的是，<strong>用電增加並不代表排碳也會增加</strong>，因為只要電力來源是低碳的再生能源，就能在電氣化過程中達到減碳效果，若再加上製造業節能、私人載具轉為大眾運輸等作為，就可以讓減碳效益再加成。</p>\n<h3>先進國家的淨零路徑與IEA同步</h3>\n<p>能源轉型先驅的德國，其擘劃的淨零路徑包含三個目標：2022非核，2030淘汰燃煤發電，2045達到淨零排放。新政府上台後，提出2030年的目標是再生能源佔比達到80%，天然氣則從現在的11%翻倍增加到20%，作為能源轉型的橋接能源。重工業減碳製程則以氫能替代，在產氫過程中則會增加電力消費。</p>\n<p>全球減碳模範的英國，在很多情境預估都指出，未來英國同樣會因為電氣化過程導致用電增加，2050年的電力需求甚至較2020年時倍增，但總體能源消費與排碳量都會下降。（請參考圖三）</p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20211214-03.jpg\"><br>\n<p><span>圖三、英國氣候變遷委員會淨零路徑下的電力需求預估。 圖／<a href=\"https://www.theccc.org.uk/publication/sixth-carbon-budget/\">氣候變遷委員會（2020）</a>&nbsp;&nbsp;</span></p></p>\n<p>簡言之，國際談淨零路徑，追求的是整體能源消耗的減量，尤其化石燃料的削減，但並不執著於電力零成長，以免忽略整個電氣化過程的減碳效益。</p>\n<h3>台灣的淨零路徑也需要天然氣橋接</h3>\n<p>那麼台灣的淨零路徑又該如何呢？根據筆者與美國西北太平洋國家實驗室的研究團隊應用IPCC認可之全球變遷評估模型（Global Change Assessment Model）推估，為了達到2050淨零，台灣的整體能源需求量在未來30年要削減25%，用電成長幅度要壓到每年1.3%以內。在這樣的水準之下，台灣淨零路徑中除了全力提升綠能、大幅削減燃煤與石油之外，天然氣在未來15年內會先增加，到2035年後才開始削減（請參考圖四）。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20211214-06.png\"></p>\n<p><span>圖四、台灣淨零路徑推估模型（趙家緯，2020）</span></p>\n<p>\t有人說「因為台積電擴廠、外商回流，導致我們用電成長率大於2.5%，才會需要這麼多天然氣。台灣應該先追求用電零成長，而不是先增加天然氣」，但此詮釋與主張應須再商榷。</p>\n<p>首先，經濟部所提出的每年2.5%用電成長預測，對於關注整體氣候政策與能源轉型進程的學者與團體，亦不能接受。雖然今年因為景氣大好，在GDP成長率破6%的狀況下，導致用電成長幅度超過4%，但後續若可全面強化工業用電管理，要求其應大舉增加節能投資，充分實踐節電潛力，達到每年電力密集度進步2%時，則可在未來GDP成長率維持在3%時，將用電成長率抑制在1.3%左右。</p>\n<p>\t再者，筆者在2013年提出「用電需求零成長」作為政策目標建議時，所參酌的國際研究，當時尚未考量到為了要達成淨零，而需要高度電氣化所衍生的電力需求。且對接台灣的現況，因為台積電等電子業的擴張，加上製造業與交通部門為了減碳的電氣化，用電需求成長為達成能源消費負成長的必備要素。因此比較合宜的能源轉型路徑規劃，應是以用電成長率控制在1.3%以內為目標，提出電子業、製造業、交通、建築及住商部門的節能政策。</p>\n<p>最後，縱使我們要以用電零成長為目標，還是需要增加天然氣，因為只靠節能無法快速消減燃煤，理想且可行的路徑是節能、綠能，再加上天然氣作為能源轉型過渡期的橋接能源，才能讓減煤、減污、減碳的速度更快。</p>\n<p>\t2025年後，核能就不會是台灣的減碳工具，因為核一廠已經開始除役拆廠，不可能再發出任何一度電。核二廠一號機因為燃料池爆滿而無法再發電，核三廠依法必須在2020年前提出延役申請，此時已超過期限，必須在2025年如期除役，核四廠則要等至少15年還不一定能發電。因此，如果我們要大幅削減煤炭與石油，不可能靠核能，必須發展再生能源，並以天然氣過渡。</p>\n<h3>少了三接將拖累台灣減碳與淨零目標</h3>\n<p>那麼台灣需要多少天然氣呢？依據2019年「能源局公投後能源政策重新評估資料」，在國內提升燃氣發電、工業區鍋爐煤轉氣的兩大趨力下，2025年全國天然氣需求將達到2,490萬噸。目前高雄永安與台中天然氣接收站都已經超過負載，縱使擴建工程如期進行，屆時也只能增加到2,050萬噸，必須興建新的天然氣接收站，才能增加台灣的天然氣供應量。</p>\n<p>目前的規劃是興建桃園大潭第三接收站、基隆協和第四接收站、台中台電第五接收站，透過北中南接收站的建設，滿足天然氣需求量，同時分散供氣風險，確保供氣安全。</p>\n<p>但如果今年第20案公投通過，第三接收站必須遷離桃園大潭，將導致2025年供氣不足，縱使四接、五接完工供氣，永安與台中接收站犧牲供應安全來超量接收，仍會短缺150萬噸氣源，換算約為100億度燃氣電力，在核能無用、再生能源增量不足下，就會需要靠增加燃煤來彌補，將使台灣增加450萬噸排碳量，整體減碳進度延誤21%。更令人擔心的是連鎖效應也可能導致四接、五接的計畫難以進行，導致2025增氣受阻，全台天然氣供應不足使燃氣電力佔比將只能增加到42%，燃煤只能降到36%，雖仍有減煤，但效果大打折扣，更難達到淨零目標。（請參考圖五）</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20211214-04.png\"></p>\n<p><span>圖五、缺乏三接導致100億度氣電缺口，連鎖效應更使燃煤只能減到36%（製圖：趙家緯）</span></p>\n<p>\t細緻來看，少了三接，會使原本可以在2025年除役的麥寮燃煤電廠無法如期除役，或使全台最老舊的興達燃煤電廠無法如高雄人期待提前於2025年除役，台中火力電廠也可能有2~3個燃煤機組無法如預期提前除役。少了三接，台電預估備轉容量率將降至7~8%，這也會使原本可以停機備用的興達電廠必須加入啟動發電，讓中南部的減污減碳更加困難。（請參考圖六）</p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20211214-05_0.png\"><span></span><span><br>\n<p>圖六&nbsp;、少了天然氣，台中、興達、麥寮燃煤電廠需多發電（製表：趙家緯）</span></p></p>\n<h3>節能加三接，非核減煤更順利</h3>\n<p>綜合前述，台灣必須達到淨零排放，但必須提出切合實際可行的路徑。節能、發展再生能源都是我們要努力的，但並非一蹴可幾，必須將各部門減碳需求、經濟與國安需求、環境與社會條件限制綜合考量，不能偏廢任何一方，應容納多元解方的協調與時程規劃。</p>\n<p>現階段台灣需要天然氣作為轉型的過渡能源，目前政府順應民意所提出的再外推方案是相對其他任何主張都更能兼顧保育最大化、減煤減碳最小化的方案，呼籲大家對第20案公投投下不同意。</p>\n<p>\n<p>（本文為2021/12/13&nbsp;刊載於鳴人堂：<a href=\"https://opinion.udn.com/opinion/story/10124/5957845\">趙家緯、蔡卉荀／節能加三接——才是台灣的非核減煤路徑</a>）</p></p>\n<p><span></span></p>\n<p><span></span></p>"}, {"nid": 4080, "title": "公投過後，台灣環境運動下一步（下）：台灣能源轉型難題", "original_topic": "廢核;環境正義", "adopted_cats": ["氣候變遷與調適", "廢核", "完善能源政策"], "content": "<p><span><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/Image00011_5.jpg\">（貢寮居民與核四大爆走成員於核四廠前合影。(圖／全國廢核行動平台）</span></p>\n<p>\t今年四大公投中有兩項與能源、環境相關，在私下與人權運動工作者的閒談中，對方提到：「整個社會都在討論能源議題，應該很有受關注的感覺吧！」我謹以苦笑回應，若關注可以推進討論是一大進展，但過程中的人身攻擊似乎勝於議題討論，甚為可惜。</p>\n<p>在重啟核四公投不同意後，反核方勢必會推動廢除核四計畫的諸多倡議，這座糾纏台灣四十年的老議題，終於有清楚的民意結果，替核四劃下句點。然而廢廠之後的土地返還、認列虧損成為台電要面對的重大議題，是否會因為廢廠的艱困而持續維持封存狀態，值得觀察。但監督的力量不會停，終結核四成為進行式，如何終結應是未來需要快步推進的議題。</p>\n<p>另一方面，在珍愛藻礁、三接遷移公投不同意後，第三天然氣接收站將進行其「再外推方案」的環境差異分析審查，正反雙方是否會將戰場延伸到環差，值得觀察，但在議題攻防的過程中，對於整體能源需求的討論亦需深思。</p>\n<p>在兩案能源公投背後，「減緩氣候變遷」是最大共識，核能是否能減碳？天然氣是否該是能源轉型的過度能源？背後重點都是該用什麼樣的能源來減碳。台灣在今年宣布2050淨零碳排的政策目標，環保署也在下半年推出有關氣候變遷相關法律的修法，此大方向下，逐步落實的減碳路徑辯論與具體減碳政策，才是重點。</p>\n<p><span><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20210310-001%E5%A4%A7%E6%BD%AD%E8%97%BB%E7%A4%81.png\">大潭藻礁。（圖/Google earth）</span></p>\n<p><span><strong>絕不放任無止盡的用電成長</strong></span></p>\n<p>經濟部估計，今年用電成長可能到4%以上，這是近年來非常誇張的數字，經濟部門會表示這是產業發展成功的象徵，但歐洲各國早已做到GDP成長與用電成長是脫鉤的狀態，雖然產業結構不同，但絕不能將用電成長視為當然。</p>\n<p>綜觀近年的節電計畫，2017年由中央先推動的新節電運動，22縣市共推總經費達75.06億元的計畫，裡面包括因地制宜措施、節電基礎工作、設備汰換與智慧用電；其中與民眾最相關的能源效率提升——設備汰換，用在補助照明、冷氣等節能家電，經費57.12億元。但此計畫在去年底告終，早在去年中，民間發起的能源轉型推動聯盟就開記者會<a href=\"https://e-info.org.tw/node/225873\">呼籲</a>，若新節電計畫缺乏長期規畫將造成巨大用電影響，但今年只暫列一億元左右，果真讓節電陷入瓶頸；明年開始的新計畫勢必得加速推動。</p>\n<p>除此之外，筆者近年參與各縣市政府節電業務承辦的工作坊，明顯地知道節電端在電價不調整的狀況下，缺乏誘因，不見得是地方政府不做，而是手段盡出但難有呼應。然而電價調整在台灣是個顯著的政治議題，台灣97%靠進口的能源結構，卻有全世界前五低的工業電價、民生電價顯然不合理，除了民間團體呼籲電價合理化，透過級距調整讓高用電者得付出更多成本，更需要有良善的社會溝通來討論電價議題。</p>\n<p>在未來強調淨零碳排的能源使用推估中，整體用電量勢必會增加，主因是電氣化為減碳的必要手段。國際能源總署估計，全球達到2050淨零碳排，會減少整體17％的能源使用，但會增加50％的電力使用。但台灣現在的用電成長跟上述電氣化無關，單純就是「拚經濟」長出來的成長，是應該要用盡手段抑制的。</p>\n<p>縱使公投結果如此，公民也應該意識到絕對不能放任用電成長，誠實面對電源開發計畫也不應該是無止盡擴張，這些資源消耗都是世代正義的課題。</p>\n<p><span>&nbsp;<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20201202-01--%E6%B0%A3%E5%80%99%E8%AE%8A%E9%81%B7%E6%B3%95.jpg\">決戰升溫1.5度C，正式提出《氣候變遷法》。（圖／地球公民基金會）</span></p>\n<strong><span>工業</span><span>節能優先 半導體用電大增該如何面對</span></strong>\n<p>除了對於民生用電的節電政策外，占台灣55%以上的工業用電更應該謹慎檢討，台灣環境規劃協會理事長趙家緯即<a href=\"https://forum.ettoday.net/news/2149583\">提出</a>，應該辦理電子業政策<a href=\"https://new7.storm.mg/article/4110462\">環評</a>，直面台積電等電子業用電增長的問題；另外針對石化、鋼鐵、水泥這三大被視為難減碳的產業，私人企業因應碳關稅已經開起減碳計畫，但工業局顯得過於保守，目前提出的第二期製造業減碳規畫都相當不積極，2025年只比2005年減0.22%，欠缺積極管理作為，需要政府與企業、金融界一起來提出更積極的作為。</p>\n<p>除了難減產業外，整體製造業即將要面對的碳稅費機制，也是重點。前中華經濟研究院院長蕭代基表示，碳費不應用於補貼汙染者的減碳工作，那是他們的責任，應該用於補助低收入與弱勢者、研發低碳技術、及現在就該開始進行的除碳工作。另一塊是建築節能，新設建物及老舊改建的建物，都應該符合更嚴格的建築外殼節能標準，並且做到建築能耗揭露。以減碳做為大方向，這些抑制製造端碳排的努力，都得進行。</p>\n<p><span>老舊電廠準時除役 絕不能棄守</span></p>\n<p>在三接課題中，政府提出必須讓三接興建以加速老舊電廠除役，而公投結果可視為對此承諾的複決，因此高雄興達、雲林麥寮甚至屏東的核三廠，這些近年規畫將除役的老舊電廠都勢必得兌現，而台中火力電廠雖然尚未屆臨年限，但近年來的空汙季友善降載的政策，都應該持續進行。甚至得更積極地提出無煤時程，將現有的燃煤機組、汽電共生廠做完整的退役規畫。</p>\n<p>不過若要解決空汙議題，占三分之一以上的移動汙染源也應該有更積極的政策，近來環保署推出老舊機車淘汰政策，不再補助燃油機車汰購都只是基本態度，整體的運具電動化、發展大眾運輸都應該持續進行。</p>\n<p><span><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/Image00011_6.jpg\">應該辦理電子業政策環評，直面台積電等電子業用電增長的問題。 （圖／地球公民基金會）</span></p>\n<p><span>再生能源選址課題　社會溝通不能停</span></p>\n<p>除了節電、減碳驅動的產業轉型外，無論是產業端的需求，抑或在未來的能源使用上，要用乾淨的電力來替代掉煤炭、石油，所以如何加速再生能源的發展，都將是最重要的課題。但能源發展的艱難在沒有一種完美的能源，連再生能源的開發都有諸多爭議，所以綠能的社會溝通將會是當前最重要的課題。</p>\n<p>地球公民基金會長期推動加速屋頂光電的建制，促使行政院2025年屋頂光電設置的目標增至8GW，推動新設園區都必須有一定比例屋頂光電的規範，但持續盤點並在公有建物、工廠、公有停車場、物流倉庫、服務業等用電大戶上裝設光電，也都還有進步的空間。</p>\n<p>地面光電則要綜合評估光電需求總量與環境負荷量，今年開始正式上路的漁電共生環社檢核機制，可以此經驗檢討國土使用的評估與把關機制，建立地面光電的選址的條件，同時要建立合理的分配機制，鼓勵公民電廠，將綠能的收益用於提升生態、農漁產業及社區發展，避免炒作土地。另外諸多團體在推動的地熱發展，則需要政府投注資源於先期探勘，只是地熱潛力區絕大多數在原住民族部落，少部分在國家公園內，選址議題仍然得面對。</p>\n<p>總體來說，綠能建設的社會溝通是當前最重要的課題，但如果要加速發展綠能，大規模綠電以碾壓的方式建制，很可能適得其反，甚至再引發不同主題的公投；但另一方面，在減碳的大趨勢下，如何讓台灣社會知道再生能源發展的必要性，也格外重要。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20201224-004%E5%B7%A5%E6%A5%AD%E5%8D%80%E5%B1%8B%E9%A0%82%E5%85%89%E9%9B%BB.jpg\"><span>工廠屋頂沒裝綠電，蘇內閣還不衝衝衝。（圖／地球公民基金會）</span></p>\n<strong><span>面對能源配比 艱難中也得選擇</span></strong>\n<p>縱使台灣今天節電有成，能省下整體一半的電力，剩下的50%電力來源，還是得面對能源配比的問題，台灣僅有再生能源屬於自主能源，但也不可能一夕之間變成100%再生能源，所以天然氣雖然遭受諸多批評，但為了加速減煤、減碳，也得面對天然氣做為橋接選項。</p>\n<p>具體建設上，三接確定會在大潭以再外推方案來興建後，四接、五接的興建議題勢必會再起攻防，但根據環境律師詹順貴<a href=\"https://new7.storm.mg/article/4110462\">表示</a>，四接有諸多不正義的歷史，也需要更多關注。另一部分，天然氣在能源轉型的具體過渡任務，也應該有更細緻的討論，挪威科技大學智慧配電網中心計畫博士生顏東白撰寫<a href=\"https://forum.ettoday.net/news/2125224\">專文</a>，認為「以氣易煤」階段已經開始，接下來還會從「綠主氣從」階段再轉型到「灰氣轉綠」階段。</p>\n<p>面對全球尺度的氣候變遷課題，環境運動沒有停下來的空間；當議題提升到公投層級時，自然就會有輸贏，但如何促成環境永續的多贏，才是根本。期待台灣社會不再被公投輸贏綁架，邁向2050淨零碳排的這條路。面對還有很多能源選擇的矛盾、選址的艱困，需要政府拿出良善溝通、社會對話的機制，從三接環評與光電爭議中，檢討當前欠缺公眾參與及資訊公開的狀況，優化聽證程序，啟動更多能源政策的對話，避免人民最後只能訴諸公投。</p>\n<p><span><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20210414-001%E4%B8%89%E6%8E%A5%E8%AB%96%E5%A3%87.jpg\">三接與藻礁保育、能源轉型關係對焦會議。（ 圖／地球公民基金會）</span></p>\n<p>本文為刊載於：<br>\n<p>2021/12/23【鳴仁堂】蔡中岳／<a href=\"https://opinion.udn.com/opinion/story/7854/5982149\">公投過後，台灣環境運動下一步（下）：台灣能源轉型難題</a></p></p>"}, {"nid": 4149, "title": "地球公民協會與台灣環境行動網合併歷程", "original_topic": "環境正義", "adopted_cats": ["氣候變遷與調適", "森林守護與林業改革", "監督高雄重大污染"], "content": "<p>台灣充滿活力，無畏權勢的環保運動者，儘管在資源困頓的情況下，仍扮演了這個社會的良心者、防腐劑，讓這個幽暗的社會看到亮光。然而，環境NGO普遍都面臨了經營的困境，難以彙聚更大的環保力量。我們體會到：環境問題是世世代代都要面對的課題，唯有重視人才的培養，知識和經驗的傳承，才有可能壯大改變的力量，最重要的是：我們需要有實力、有效能的組織支撐。</p>\n<p><strong>地球公民協會</strong>於2007年由李根政先生集結高雄地區40位環境關懷者所成立，創會時共三位工作人員，在首任理事長蘇振輝先生所帶領的理監事會支持下，主要關注保護山林、減緩與改善工業污染等環境議題；歷年來工作的成績包括了：成功阻擋台電大林燃煤電廠二個機組的開發，使台灣減少增排800多萬噸二氧化碳；揭露台灣伐木養菇的真相，推動限制伐木補償制度；揭露伐木再造林的政策，修訂了保護既有森林不被砍伐的造林政策；追蹤台塑仁武廠土水污染，要求政府增訂了石化業放流水標準。</p>\n<p><strong>台灣環境行動網</strong>為1998年在美國成立留美學人組織的網絡，2006年正式在台灣立案。在美國階段主要關注反濱南工業區─黑面琵鷺的國際串連，在台灣階段則推動責任科技--中部科學園區環評案，以及關切氣候變遷等議題。兩會於2011年1月合併為地球公民基金會。</p>\n<p>地球公民協會（MET）和台灣環境行動網（TEAN），一南一北，雙方在議題、地域上有高度互補，TEAN長期關注責任高科技議題，在國際串連也有相當的基礎，學術界更有豐厚的人才；MET則是關注山林保護和工業污染議題的專業團體，組織和財務已有相當基礎。</p>\n<p>從2010年3月開始，兩會開始討論合併的可能性，主要著眼於：「壯大台灣環境運動的影響力。」希望「共同創造一個有利於環境NGO工作者實踐夢想，貢獻社會的組織。」期間，地球公民協會著手進行組織改造，從6月開始募款準備轉型為基金會，截至9月為止，共有174位捐款人捐助了500多萬元基金，並於12月完成立案。在此同時，台灣環境行動網也召開了臨時會員大會，決議兩會之合併。</p>\n<p>此一發展，打破了台灣人「放尿攪沙不會作堆」的刻板形象，對台灣的環保運動更是一個突破性的進展。</p>\n<p>我們體會到：不論是看守家園或者拯救瀕危的地球，都需要長久而持續的關注，這不只是靠少數志士的「愛心、熱心、恆心」可以達成。這是一個持久戰，除了前線的將士，更需要源源不絕的糧草支援。</p>\n<p>基金會的成立、兩會的合併，正是人才、錢財聚合的開始，接下來的挑戰，就是如何創造正向回饋的組織文化，讓這股善的力量越來越大。在實踐的過程，我們將謹記「愛與慈悲」的初發心，以保全地球生態系為最大之善。</p>\n<p>地球公民基金會將以建立「獨立自主，專業公信力的組織」為目標繼續努力。</p>"}, {"nid": 4210, "title": "森林有碳匯，但不只是碳匯--讓森林碳匯提昇台灣森林的多元功能", "original_topic": "森林與林業政策", "adopted_cats": ["氣候變遷與調適", "森林守護與林業改革"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20221116-1.png\"><span>林務局宣誓2017年為國產材元年，和國際接軌推動在國有林和私有林的森林認證，正面臨選擇合適的區位，建立制度配套，建立產業鏈，朝向永續營林的各項挑戰。圖為屏東林管處工作人員正進行伐木。（圖／李根政)</span></p>\n<p>\t蔡英文總統在2021年宣示台灣將推動2050淨零排放，今年3月則由國家發展委員會發表了「<a href=\"https://www.ndc.gov.tw/Content_List.aspx?n=FD76ECBAE77D9811\">2050淨零路徑及策略</a>」，除了能源、產業、交通部門的轉型，其中提到占台灣國土面積達6成的森林碳匯約是2,140萬噸，可抵減約台灣8%的碳排量，預期到2050年將增加110萬噸森林碳匯<span>(註1)</span>，達到2,250萬噸。</p>\n<p>從目前規劃看，未來30年台灣在邁向淨零排放之路，森林碳匯增加的幅度並不高，原因在於台灣可以增加森林的土地面積十分有限。此外，能源、製造業、住商、交通部門的排碳量遠大於森林碳匯，舉例來說，台灣大約220萬公頃的森林<span>(註2)</span>，所創造的碳匯量，比中鋼公司一年約2,156萬噸的排放量還略少，如果台灣要透過森林來達碳中和，約略需要6個種滿樹的台灣，這使得森林碳匯在台灣邁向淨零排放過程中，不可能成為主角。</p>\n<p>儘管如此，筆者認為面對艱難的淨零目標，積少成多，任何減碳的方案都不應輕言放棄，8%左右的森林碳匯，仍有積極討論的必要。而在討論森林碳匯之時，我們也應重視台灣森林具有無可取代重要性，包括國土保安、水源涵養、生物多樣性、休閒育樂、木材與林產，文化傳承與發展、美學等，碳匯僅是其多元價值與功能之一。</p>\n<p>這些多元的功能要對應到不同的森林定位和經營管理策略與計畫，符合國際減碳規範和作法僅是基本款，更重要的是：考量台灣的環境特色和森林治理脈胳，增進森林生態系服務的多元功能，避免產生負面影響。</p>\n<p>林務局在今年（2022）4月提出增加森林面積、加強森林經營管理、提高國產材利用<a href=\"https://www.agriharvest.tw/archives/79703\">三大策略及政策</a>，要提升森林碳匯功能，兼顧森林生態系服務價值與產業經濟，並預計在2040年達成增加新植造林面積6.6萬公頃。</p>\n<p>\t對此，筆者認為：37.5萬公頃山坡地範圍內的宜農牧地的經營管理攸關台灣森林碳匯的增加或減少；將近10萬公頃的超限利用地<span>(註3)</span>、草生地，是潛在可增加森林面積的區位；38萬公頃經濟林正在盤點區位以及相關輔導配套，具保育價值的次生林<span>(註4)</span>、城鄉綠化都需要政策規劃與協調，以及資金的挹注，更需要結合台灣護樹愛林的民間力量，形成社會共識，共同推動。森林碳匯如何計算？方法學的部分，林務局和環保署正在相關學者研議當中，則有待進一步分析討論。<span>(註5)</span></p>\n<p><h2>38萬公頃經濟林，如何促進國產材、森林保育與森林碳匯的多贏</h2></p>\n<p><span></span><span></span><span><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20221116-2_0.png\"></span><span><span>林務局宣誓2017年為國產材元年，和國際接軌推動在國有林和私有林的森林認證，正面臨選擇合適的區位，建立制度配套，建立產業鏈，朝向永續營林的各項挑戰。圖一右為溪頭的柳杉人工林。(圖/李根政)</span></span></p>\n<p>台灣的木材超過99%仰賴進口，為了重建台灣國產材產業鏈，提昇木材自給率，林務局已宣誓2017年為「國產材元年」，正在推動森林認證與相關的輔導措施，重建國產材產業鏈的區域。這裡需要有更多的專業和公眾參與討論，確認做為永續經濟林的區位和經營管理配套。</p>\n<p>而林業界普遍認為，透過人工林<span>(註6)</span>的經營、木材的利用，是有益於減碳的生產活動。原因在於林木生長時，會吸收大氣中的碳，林木砍伐製作為林產品時，原先吸存的碳則會固定於林產品中，持續多年。然而，永續經營的人工林應該放在什麼地方？要用什麼樣的經營方法？又如何確保從木材的生產和利用，真的可以減碳？都是需要審慎規劃和討論的課題。</p>\n<p>我國森林碳匯計算的依據，是來自2017年林務局所完成的<a href=\"https://www.forest.gov.tw/0002393\">第四次森林調查報告</a>的基礎：根據該次調查統計，台灣總森林面積為219.7萬公頃，森林覆蓋全台土地面積為60.7%，其中屬《森林法》定義之林地，其森林覆蓋面積約為178萬公頃；林地以外之其他土地，森林覆蓋面積約為41.5萬公頃。</p>\n<p>\t林地上的森林，較有法令和配套，有一大部分是禁伐的保護區<span>(註7)</span>，以及不會從事經濟林活動的國有林<span>(註8)</span>，較無人為因素導致森林減少的情形。而被林務局規劃做為經濟林，打算從事造林、伐木等活動的區域，初步規劃可供林木生產經營的國有林約6萬公頃、私有林<span>(註9)</span>約13.65萬公頃、原住民保留地中的林業用地<span>(註10)</span>約6.5萬公頃、國有租地造林<span>(註11)</span>約12.22萬公頃，總計約38萬公頃。</p>\n<p>理論上，這些經濟林地就是推動國產材的場域，但尚需進一步盤點和確認其是否具有生產潛力。例如：林務局初步規劃可供林木生產經營的國有林約6萬公頃，但實際盤點潛在可生產的面積約2.5萬公頃。</p>\n<p>原因在於這些造林地在數十年未積極經營下，包括交通運輸、林相組成等條件已產生很大的變化，許多人工林在數十年間已自然演替為次生林，邁向天然林<span>(註12)</span>。就林業經營的觀點是「人工林劣化」，就生物多樣性的觀點則是「天然林復育中」。這衍生了其中生物多樣性、森林碳匯的爭議，例如台北市公有林的<a href=\"https://www.twreporter.org/a/opinion-taipei-biennial-afforestation-dispute\">碳中和案爭議</a>，當把次生林疏伐或皆伐<span>(註13)</span>，改造為樹種單一的人工林，是否會增加碳匯？</p>\n<p>\t若林務局要避免類似爭議，很需要盤點經濟林中具有保育價值的森林，運用「具生產性私有林限制伐採補償方案」，讓具有保育價值的次生林保留下來。相對的，因為「原住民保留地禁伐補償條例」的實施，讓竹林的定期輪伐和生產大規模停頓，反而不利於減碳與竹產業的發展，應該藉此檢討這種無差別的補貼方式。</p>\n<p>此外，在台灣經濟林的經營和伐採作業成本，比進口木材成本高，加上產業和人才斷鏈，從造林到撫育成材的時間相當長，已屬特別需要政策扶助的「戰略性產業」。目前在私有林、租地造林的林業經營，難以全然依市場機制，非常仰賴政府政策性的補貼，林務局正以「公私有林業永續多元輔導方案」，對於營林的各環節提供補助，然而，仍力有未逮。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20221116-3.png\"><span>淺山交錯著林地、農牧用地，很有可能鑲嵌著待保育的次生林（天然林）、國產材永續經濟林，林下經濟、混農林等土地利用型態，極需整合法規工具、制度配套，朝向永續治理。( 圖/李根政)</span></p>\n<p>筆者觀察：不管是保留具有保育價值的次生林或者對於國產材營林的補貼，都需要資金的挹注，這需要超過林務局既有預算的支持，如何結合森林碳匯的企業資金挹注，設計出合理的機制都尚待討論。</p>\n<p><h2>農牧用地上的森林，攸關台灣森林面積的增減</h2></p>\n<p>第四次森林調查報告指出，林地中「非營林使用」的面積為21萬1,545公頃，計有崩塌地約7萬1,177公頃，農作約5萬2,842公頃，草生地4萬3,761公頃。林地中未經營森林，將其轉為農作是屬違法的「超限利用」行為，理論上是可以透過加強執法轉為森林的區域；草生地亦可能透過自然演替或造林等方式促進其復育為森林。</p>\n<p>理論上，將近10萬公頃的超限利用地、草生地，是最有機會增加森林面積碳匯的地方，應該比起在「邊際農地造林」更為優先推動，但實務上尚待釐清和討論。</p>\n<p>同樣的報告亦指出：林地以外之其他土地上有41萬5,430公頃的森林，約有17萬公頃位於私有農牧用地上，這些都被納入台灣森林碳匯之中。但是，農牧用地大部分為私有，依法可以從事農業活動，並無法律管制其必須保留森林。因此，很可能因為恢復農業、光電使用等，而使得森林面積減少，進一步導致森林碳匯量減少。</p>\n<p>簡單來說：<strong>全台灣的宜農牧地約37.5萬公頃</strong>（<a href=\"https://calipc.nalrcs.org/Agriland110.files/sheet001.htm\">全台農業及農地資源盤查結果</a>，農委會，2021 ）<strong>的經營管理，正是影響台灣森林面積增加或減少最為關鍵的區域。</strong></p>\n<p>\t這裡是林務局推動國土綠網，串接「森、川、里、海」，在法定保護區之外，生物多樣性最高的淺山區域。同時，也是在既有林地之外，最有可能推動國產材永續經濟林，以及林下經濟、混農林等最為合宜的空間。但同時，卻也是既有法規工具、制度配套最為脆弱，欠缺永續治理的區域。</p>\n<p>\t例如，台東安朔地區的農牧用地<span>(註14)</span>，大部分現況為森林，本區約在1960～1970年代伐木、開墾、造林，1980年代廢耕後自然演替而形成天然闊葉林，根據第四次森林調查的資料所套疊，其中大部分是「經改造天然林」，包括多樣而獨特的殼斗科天然林，然而卻沒有法規，或者明確的協商機制，可望避免這些森林的損失。</p>\n<p><strong><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20221116-4.png\"></strong><span>綠色區域為台東安朔溪南北的農牧用地，大部分現況為森林，為根據第四次森林調查的資料所套疊，其中大部分是「經改造天然林」值得關注。(圖/地球公民基金會)</span></p>\n<p>\t在農牧用地，以下是目前可能使用的政策工具，或民間正自主推動的作法，但整體來看，並不足以因應數十萬公頃規模的治理。</p>\n<p>\t一，如果該地的森林具有保育價值，理論上，政府可以透過林務局主管「<a href=\"https://conservation.forest.gov.tw/0002186\">瀕危物種及重要棲地生態服務給付推動方案</a>」等方案，提供私有地主之補償，促使得維持森林狀態。然而，目前僅應用於石虎等少數物種，並未擴及到森林生態系，且該給付方案也未必具有足夠的誘因。</p>\n<p>二，部分農牧用地是曾參與政府獎勵造林，如果經評估確認可以繼續輔導其朝向永續經濟林發展，可望成為國產材發展的區位。</p>\n<p>三，從媒體報導，我們看到農委會水保局正提出《山坡地農牧用地獎勵植樹造林》草案，擬在高度100公尺、坡度5%以上的山坡地，推動「山坡地保育區農牧用地一定比例種樹」。目前政府尚未公告此一草案內容。初步的理解，這應該是可以結合既有次生林保育、國產材、混農林業的推廣政策，但是，如何和林務局的政策通盤考量，避免各行其是，需要農委會進行內部協調整合。</p>\n<p>四，台灣民間已許多人士自主性的從事天然林復育，或正在推動農地的公益信託，如果有更多的民間資金投入，可以創造森林碳匯與生物多樣性的雙贏，政府應該增修信託法規、制度性的獎勵措施，鼓勵這樣的作法。</p>\n<p>筆者認為「山坡地農牧用地的森林」，並非都應以「凍結現狀」的方式經營管理，如何依據資源條件，考量森林碳匯所需要維持或增加的森林面積、生物多樣性、國產材、友善的混農林等，很需要生態環境的基礎調查，檢討增修相關法規，透過生態服務給付創造更多誘因，如果要引進結合ESG（環境保護、社會責任、公司治理）<span>(註15)</span>，導入企業資源（資金、技術和人才等），則需要建立相關配套規範。</p>\n<p><h2>生物多樣性的城鄉綠化，碳匯功能小、人民幸福大</h2></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20221116-5.png\"><span>圖為台東安朔地區的森林空拍照，顯示多樣豐富的天然林。（攝影／傅志男）</span></p>\n<p>從增加森林面積──森林碳匯的角度，台灣平地的城鄉地區能夠提供做為森林的土地面積遠不如坡地，然而卻是提升人民生活品質、幸福最有感的公共投資。</p>\n<p>根據聯合國<a href=\"https://zh.m.wikipedia.org/zh-hant/%E7%94%9F%E7%89%A9%E5%A4%9A%E6%A8%A3%E6%80%A7%E5%85%AC%E7%B4%84\">《生物多樣性公約》</a>的目標，國際植物園保育聯盟 (Botanical. Garden Conservation International, BGCI ) 提出後2020年全球植物保育策略（Global Strategy for Plant Conservation, GSPC） 目標草案，比起過往更為重視城鄉地區的綠化工作，原因在於栽種生物多樣性的原生植物的綠地，可以促進都市永續生活的許多面向，包括了環境教育、入侵物種的控制、生態復育、涵養水源外，更重要的是，城鄉地區的公園綠地，讓人們可以就近使用，更有利於促進人民身心健康。</p>\n<p>期待藉由這波造林減碳計畫，將部分國產署或地方政府臨近城鎮、村落附近的公有地，以及台糖部分土地，規劃為森林公園，打造符合該區域植被特性的多樣物種及覆層的森林公園。而對於既有的公園綠地，可以採取補植、更換樹木、營造複層林等策略，不放棄任何可以種植樹木植物的地方。</p>\n<p><strong>只是，推動城鄉植樹不應只是工程發包，要避免如種樹百里政策的倉促推動，應該進行經營管理系統的檢討與改造。</strong>近年來林務局和林試所正積極推廣原生植物的種植與稀有植物保育，應該在此基礎上，由中央和地方政府，從育苗開始就要導入植物生態、栽培、養護、生態教育等專業人才，建立和培訓經營管理的專業系統，搭配符合比例原則的經費和人力，有系統的長期經營，讓台灣的公園綠地經營體系邁向專業化，達成增加碳匯和永續生活的多元目標。</p>\n<p><h2>納入關注森林的公眾參與，為台灣森林多元功能加值</h2></p>\n<p>有關農牧用地的森林經營管理，涉及農委會林務局、水保局、內政部、國產署等，目前主管機關的權責不清，欠缺足夠的法規工具；經濟林連結國產材的政策配套，應該確保其作法可以增加森林碳匯而非減少；城鄉綠化更是中央和地方許多機關的常態工作，很需要擬定上位政策，提供生物多樣性植栽綠化的指引，有計畫的編列預算，導入專業與人才。</p>\n<p>種樹護林是台灣許多企業、慈善組織、個人所熱衷的環保項目，在這波森林碳匯的政策規劃中，如何結合和導引台灣豐沛的愛樹愛林社會力和資源共同參與，妥善運用企業對森林碳匯、環境永續ESG的需求，導引企業長期投入，對森林的多元價值做出實績貢獻，而非淪為漂綠的短線操作，將會需要更多的政策梳理，公眾參與討論。</p>\n<p>謹以此文拋磚引玉，建請農委會陳吉仲主委、國發會龔明鑫主委、蘇貞昌院長參酌上述提議，開放政府，讓關注森林生態、林業發展的各界國人，共同討論邁向淨零的森林治理策略方案，讓森林碳匯為台灣森林多元功能加值。</p>\n<p><hr></p>\n<p><table></p>\n<p><tbody></p>\n<p><tr></p>\n<p><td>註1｜</td></p>\n<p><td>carbon sink，又名碳吸儲庫或吸儲庫，是能夠無限期累積及儲存碳化合物（特別是二氧化碳）的天然或人工「倉庫」，例如森林、土壤、海洋、凍土等，也是作為溫室氣體增加之緩衝區。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註2｜</td></p>\n<p><td>依據第四次森林調查的資料，台灣的森林面積為219.7萬公頃，這些森林從土地的權屬、林型、經營使用的分類，對應到經營管理的不同面向，簡要說明如下。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註3｜</td></p>\n<p><td>超限利用指的是未依土地編定所容許的使用行為。在山坡地上，最常見的超限利用的行為是：在林業用地上把森林砍伐，從事農業活動。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註4｜</td></p>\n<p><td>指原始穩定的森林植被遭到山火、蟲災、或者人為破壞或砍伐之後，經過若干年後再度自然復育而成的新的森林植被和生態系統，且具備植被未被破壞前的森林規模。次生態系統多見於刀耕火種的農業系統中的休耕地、人工或者天然林場。次生林是天然林的一種，另一種天然林是原始林。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註5｜</td></p>\n<p><td>可參考地球公民論壇--種樹造林可以為台灣增加森林碳匯嗎？Q&amp;A</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註6｜</td></p>\n<p><td>由人工栽植或人工播種而形成之森林。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註7｜</td></p>\n<p><td>台灣的保護區系統包括了國家公園、野生動物棲息環境、自然保留區等。這其中的森林都是禁伐，且台灣有天然林禁伐的命令，所以這些森林轉其他利用的機會極低。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註8｜</td></p>\n<p><td>台灣承繼日治殖民時期，超過全台九成以上的森林為國有，面積達184萬9,818公頃。而初步規劃可供林木生產經營的國有林只約6萬公頃。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註9｜</td></p>\n<p><td>森林屬於私人所有，依法可以從事植林、伐林的經濟林活動，不得轉為農業等利用。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註10｜</td></p>\n<p><td>原住民保留地同樣有編定不同的用地，規範其容許使用的項目，其中被編定為林業用地約6.5萬公頃，這些土地依法要從事植林、伐林等林業活動，並維持森林狀態，不得轉為農業等利用。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註11｜</td></p>\n<p><td>國府治台，為鼓勵私人參與造林，或清理遭到占墾的林地，因而和人民簽訂租約，將國有土地出租給私人造林經營，統計約有12.22萬公頃。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註12｜</td></p>\n<p><td>泛指未經人為之力，經由天然更新而形成的森林。包含完全未經人為干擾，林相結構趨於穩定的原始林 ; 以及被破壞或造林失敗之後，重新生長演替的次生林。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註13｜</td></p>\n<p><td>兩者都是林業經營的方法。疏伐是將森林中部分樹木砍伐，以避免密度過高，影響樹木的生長，希望培育形質優良的樹木，以利收穫木材。皆伐則是將一片林地上的森林全面砍伐。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註14｜</td></p>\n<p><td>台灣的非都市土地，依區域計畫法劃分為共計有11種使用分區、19種用地。如果土地被劃分為「農牧用地」，依法可從事農業活動，如果在農牧用地上營造人工林或自然長出森林，地主想要砍伐，都不會受到《森林法》的限制。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註15｜</td></p>\n<p><td>聯合國全球契約（UN Global Compact）於2004年首次提出ESG的概念，被視為評估一間企業經營的指標。</p>\n<p><ul></p>\n<p><li>環境保護（E，environment）： 溫室氣體排放、水及汙水管理、生物多樣性等環境汙染防治與控制。</li></p>\n<p><li>社會責任（S，social）： 客戶福利、勞工關係、多樣化與共融等售產業影響之利害關係人等面向。</li></p>\n<p><li>公司治理（G，governance）： 商業倫理、競爭行為、供應鏈管理等與公司穩定度及聲譽相關。</li></p>\n<p></ul></p>\n<p></td></p>\n<p></tr></p>\n<p></tbody></p>\n<p></table></p>\n<p><hr></p>\n<p>本文為2022/11/15報導者投書：李根政/<a href=\"https://www.twreporter.org/a/opinion-taiwan-forest-carbon-sink\">在淨零排放的路上，讓森林碳匯提升台灣森林的多元功能</a></p>"}, {"nid": 4212, "title": "【邁向淨零，高雄行不行？】在地淨零論壇--高雄市政府回應參與者提問", "original_topic": "抗暖減碳", "adopted_cats": ["氣候變遷與調適", "完善能源政策"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20221005-02.jpeg\"><br>\n<p>&nbsp;</p></p>\n<p>地球公民基金會與國科會整合型計畫〈探尋石化高雄的永續與公正轉型路徑—從知識到行動的整合型研究〉子計畫一、子計畫二於10/23合辦【邁向淨零，高雄行不行？】在地淨零論壇，當天因討論熱烈，部分問題不及與談者回應。</p>\n<p>由於大部分的問題仍聚焦在<strong>高雄市政府未來的淨零政策跟規劃</strong>，高雄市政府淨零排放辦公室匯集市府意見後回覆，在此公開給參與者參考：</p>\n<p><table></p>\n<p><tbody></p>\n<p><tr></p>\n<p><td></p>\n<p>提問&nbsp;</p>\n<p></td></p>\n<p><td></p>\n<p>回應&nbsp;</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>綠色運具或大眾運輸的推行，與安全友善的交通環境密不可分，然現有的道路設計、人行道空間、無障礙空間規劃，使上馬路等於於上戰場，時常險象環生，實不足以構成足夠誘因來說服市民放棄汽機車通行，而改以捷運、輕軌、自行車、步行等方式通行。請問環保局未來會如何與交通局，共同推動交通環境改善，來達成綠色運輸的目標？是否有相關計畫？&nbsp;</p>\n<p></td></p>\n<p><td></p>\n<p><ol start=\"1\"></p>\n<p><li></p>\n<p>有關本市道路設計、人行道空間、無障礙空間規劃係依據內政部營建署「市區道路及附屬工程設計標準」、「道路交通標誌標線號誌設置規則」等規定辦理，於道路辦理新闢及改善時，亦會將人行道、自行車道等項目納入規劃，以提高本市交通環境友善性。&nbsp;</p>\n<p></li></p>\n<p></ol></p>\n<p><ol start=\"2\"></p>\n<p><li></p>\n<p>另為提升高雄市公共運輸運量，本府交通局與交通部運研所合作於107年9月起推出MeNGO交通行動服務(MaaS)計畫，針對高雄地區的旅運需求，提供月票優惠，以公共運輸（捷運、公車、輕軌）為主要運具，搭配公共自行車、計程車、共享運具接駁及轉乘捷運停車場的交通解決方案，整合交通即時資訊、路線規劃、套票購買及生活旅遊資訊查詢等完整旅運服務。&nbsp;</p>\n<p></li></p>\n<p></ol></p>\n<p><ol start=\"3\"></p>\n<p><li></p>\n<p>為提高大眾運輸使用率，本府交通局110年10月起推出MeNGo時數型方案(24、48、72小時)，全國首創QR code載具整合交通服務，觀光客到高雄吃、喝、玩、樂只要用手機就可無限暢遊，並於111年8月1日推出MeNGo APP，民眾可直接在線上購買通勤月周票方案、付款後直接以MeNGo QR Code搭乘本市大眾運輸，掃碼、刷卡，全面數位化提升民眾更便利的使用流程與體驗，改善以往必須要用實體卡片不便性，也會比以往還要便宜，學生千元有找。&nbsp;</p>\n<p></li></p>\n<p></ol></p>\n<p><ol start=\"4\"></p>\n<p><li></p>\n<p>為完善串接高雄市公共運輸第一哩及最後一哩的交通服務，本府交通局於捷運、台鐵、輕軌等公共運輸場站規劃YouBike2.0租賃站，及於大眾運輸場站周邊規劃及檢視自行車道串聯性，並媒合電動共享運具服務，鼓勵市民利用共享自行車、電動機車和電動車等，使公共運輸更具競爭力。&nbsp;</p>\n<p></li></p>\n<p></ol></p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>對未來可能增加的碳排放（台積電設廠）市府這邊有納入估計了嗎？&nbsp;</p>\n<p></td></p>\n<p><td></p>\n<p>對於產業園區之設置所造成之碳排放增量，市府均會於環評階段進行掌握，同時請開發單位進行相關減量措施，預估增加之排放量亦已納入城市減碳目標之評估當中。&nbsp;</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>民間太陽能設備裝設及改用節能電器之推廣是否可由市政府與民間團體合作，組成個案檢查評估小組，提出切確的改善計畫對個案主之利益情形，也許較能推動?&nbsp;</p>\n<p></td></p>\n<p><td></p>\n<p>高雄市持續邀請能源相關專家及專業團隊針對機關、學校、社區大樓、醫院、旅館等單位進行節電診斷並輔導企業導入節能績效保證專案(ESCO)，提供企業汰換老舊設備的經濟誘因。&nbsp;</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>歐洲面對俄國切斷天然氣供給，能源價格居高不下，帶來嚴重的社會與經濟衝擊，台灣有辦法回應能源準備與依存的問題嗎？&nbsp;</p>\n<p></td></p>\n<p><td></p>\n<p>提問內容屬國家能源政策問題，另本市仍持續加強發展再生能源，協助提供國家充足電力能源，減少對化石燃料之依存。&nbsp;</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>公民參與部分，除了適時對話，市府有考量其他方式嗎？ 參與式預算、網站平台建立、市政會議或里長聯誼會。有無更積極性的作法？謝謝&nbsp;</p>\n<p></td></p>\n<p><td></p>\n<p>高雄淨零四大轉型措施當中，即包含社會轉型，強調轉型過程中利害關係人之溝通，本市除於重要會議，例如永續會、自治條例諮詢會議邀請公民團體參加，亦透過淨零相關活動，例如論壇，與市民進行對話，另於相關網站進行訊息揭露，持續強化社會溝通工作。&nbsp;</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>謝謝副局長的分享，高雄市工業排碳是重中之重，環保局這邊聽起來是做盤查，請問其他局處的相關措施有哪些？例如租稅優惠、轉型輔導、有沒有針對這90幾家做個別碳排目標的設定，謝謝&nbsp;</p>\n<p></td></p>\n<p><td></p>\n<p>本市長期協助產業進行低碳轉型，環保局除進行碳盤查外，亦輔導產業減碳，例如成立「節能減碳技術輔導團」，由專家提供工廠製程改善等建議。環保局亦要求企業訂定短、中、長期減碳目標，並提出減碳措施及規劃，針對輔導獎勵部分，於「高雄市淨零城市管理自治條例」當中訂有潔淨能源獎勵、低碳永續發展稅捐徵免等條文，並由相關局處進行規劃、執行。&nbsp;</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>謝謝分享，請問RE100在高雄的推動情形&nbsp;</p>\n<p></td></p>\n<p><td></p>\n<p><ol start=\"1\"></p>\n<p><li></p>\n<p>RE100是由氣候組織（The Climate Group, TCG）與碳揭露計畫（CDP）合作成立的全球再生能源倡議行動，加入企業必須公開承諾在2050年前逐步達成100%再生能源的時程規劃。且因加入條件包含每年用電量大於0.1TWh(=100GWh)，爰主要藉由國際層級用電大戶透過自身影響力，帶動其關係企業供應鏈。&nbsp;</p>\n<p></li></p>\n<p></ol></p>\n<p><ol start=\"2\"></p>\n<p><li></p>\n<p>截至2022年10月，我國共有13家企業加入RE100，包含1.台達電子、2.菁華工業、3.華碩電子、4.國泰金控、5.葡萄王生技、6.金元福包裝、7.美律實業、8.歐萊德國際、9.致伸科技、10.台灣大哥大、11.大江生醫、12.台積電、13.聯華電子&nbsp;</p>\n<p></li></p>\n<p></ol></p>\n<p><ol start=\"3\"></p>\n<p><li></p>\n<p>高雄市淨零四大轉型措施當中，即包含能源轉型，並以展綠、增氣、減煤為原則，其中綠能部分，成立府層級「綠電推動專案小組」，推動包含公有建物屋頂、校園、工廠、漁電共生等，加速再生能源建置，部分產業園區例如橋頭、楠梓均納入再生能源使用之要求。&nbsp;</p>\n<p></li></p>\n<p></ol></p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>電動車充電樁設置、老舊大樓如何更新？想了解市府想法。謝謝&nbsp;</p>\n<p></td></p>\n<p><td></p>\n<p><ol start=\"1\"></p>\n<p><li></p>\n<p>為貫徹國家2050淨零排放目標及2040年電動車市售比100%的決心須加速推動充電樁基礎建設佈設。本府交通局於111年8月4日邀集國內學者、電動車及充電樁業者、停車場經營業者與台灣電力公司召開充電樁設置座談會，會中達成共識，除公有停車場應以各場格位數至少5％比例為目標加速推動充電樁基礎建設佈設外，未來並將朝使用者付費方式配套管理，以避免充電樁資源遭占用。&nbsp;</p>\n<p></li></p>\n<p></ol></p>\n<p><ol start=\"2\"></p>\n<p><li></p>\n<p>公有停車場推動策略：考量目前本市純電動汽車僅1,938輛(占比約0.21％)，將依電動車輛數量普及情形逐步滾動式檢討設置充電樁(含優先格)，避免衝擊既有燃油車停車權益，並透過停車場委託民間經營管理策略，促使充電樁營運業者與停車場經營業者策略聯盟，將充電樁建置、營運及管理合一。本市公有停車場已建置32場次170槍，預計2030年將達2000槍充電樁，並規劃於高臨停場次提供快充服務。&nbsp;</p>\n<p></li></p>\n<p></ol></p>\n<p><ol start=\"3\"></p>\n<p><li></p>\n<p>民營停車場推動策略：交通局將配合中央法令及補助措施推動於民營公共停車場廣為設置充電樁政策，來增加充電資源供給及分布。&nbsp;</p>\n<p></li></p>\n<p></ol></p>\n<p><ol start=\"4\"></p>\n<p><li></p>\n<p>為建置電動汽車使用環境，鼓勵大樓設置電動汽車充電站，增進住戶使用電動汽車之意願，降低燃油汽車使用率，減少二氧化碳排放量及一氧化碳等空氣污染造成的健康危害及噪音污染。&nbsp;</p>\n<p></li></p>\n<p></ol></p>\n<p><ol start=\"5\"></p>\n<p><li></p>\n<p>老舊大樓建議可委請建築師等專家評估如何設置節能設備如節能燈具、節電設備等。&nbsp;</p>\n<p></li></p>\n<p></ol></p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>碳稅的部分，企業總部不設立在高雄的企業，有辦法收得到嗎？會不會像營業稅一樣，回饋不到高雄？&nbsp;</p>\n<p></td></p>\n<p><td></p>\n<p>環保署目前正進行「氣候變遷因應法」(原「溫室氣體減量及管理法」)修法作業，其中即針對碳費徵收訂定相關條文，相關細部徵收與運用規範將待母法通過後，進行訂定，本府環保局將持續追蹤。&nbsp;&nbsp;</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>目前在盤查或算工業的總量時, 並未納入違章工廠的量, 但違章工廠持續用電及排污, 是否有可能對違章工廠有更積極的執行策略?&nbsp;</p>\n<p></td></p>\n<p><td></p>\n<p>109年工廠管理輔導法修法後，針對農地未登記工廠是以「全面納管、就地輔導」為目標，確實掌握未登記工廠名單，並進一步協助取得特定工廠登記。刻正啟動針對取得特定工廠登記業者，進行用電及排碳量之盤查，並鼓勵安裝太陽能光電。本市城市盤查除針對51家應申報排放源數據進行計算外，亦將透過台電用電資料進行城市工業及其他部門排放計算，全面掌握各面向排放量。&nbsp;</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>空屋近百萬戶，還繼續蓋房就是浪費、不環保，繼續蓋那麼多房是不可能邁向淨零&nbsp;</p>\n<p></td></p>\n<p><td></p>\n<p>房市政策係屬國家政策及市場供需範疇。惟隨著技術研發，藉由建材、工法選擇及設計逐步降低營建過程排碳，同時透過循環建築，可減少原料開採，另外本市將逐步推動建築物能源效率揭露及提升工作，朝近零碳建築目標努力。&nbsp;</p>\n<p></td></p>\n<p></tr></p>\n<p></tbody></p>\n<p></table></p>"}, {"nid": 4222, "title": "淨零轉型為什麼需要社會溝通？", "original_topic": "產業轉型;抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20221216-001.png?s810843d1671181382\"><br>\n<p></p></p>\n<p><table></p>\n<p><tbody></p>\n<p><tr></p>\n<p><td><span>我們想告訴你：邁向2050淨零排放的轉型已經是不可逆的國際趨勢，蔡英文總統亦在2021年宣布「淨零排放不只是全世界的目標，也是台灣的目標」，但現有的政府政策足夠公開透明嗎？作為長期關注氣候問題的地球公民，又如何看待台灣現在面臨的挑戰？</span></td></p>\n<p></tr></p>\n<p></tbody></p>\n<p></table></p>\n<p></p>\n<h3>政府目前最新的淨零政策是什麼？</h3>\n<p>2022年3月，行政院公布了「2050淨零排放路徑與策略」，宣布邁向<a href=\"https://www.ndc.gov.tw/Content_List.aspx?n=FD76ECBAE77D9811&amp;upn=5CE3D7B70507FB38\">2050的四大轉型策略以及兩大治理基礎</a>，也同時提出要達成淨零的十二項關鍵戰略註1，到2030年間將挹注約9000億的預算在關鍵戰略上。</p>\n<h3>淨零轉型為什麼需要社會溝通？</h3>\n<p>面對如此全面的淨零政策及龐大的預算規模，讓公民社會全面且有效的參與溝通對話，不僅是保障公民的納稅錢能被合理的運用在對的地方，更可以把充沛的社會動能導引進政策的規劃之中，改善政策的不足之處。</p>\n<p>從過去能源轉型的倡議與執行中，我們都能觀察到因為社會溝通不足導致的假消息流竄，阻礙了一部分立意良善的政策無法推進。因此，民間團體不間斷的要求政府，需針對淨零的十二項關鍵戰略展開有規劃且有品質的社會溝通。</p>\n<h3>目前十二項關鍵戰略的社會溝通狀況如何呢？</h3>\n<p>八月底開始，各部會回應了民間的要求，陸續開始召開十二項關鍵戰略的「社會溝通會議」，但其中幾場會議的進行方式與回應，讓民間覺得只有蒐集意見「已讀不回」卻沒有對話。所以關注淨零的公民團體在日前<a href=\"https://www.cet-taiwan.org/info/news/4190\">共同召開記者會</a>，要求改善會議的召開形式、事後的意見回應等，希望整體淨零政策能有真正的溝通與對話。</p>\n<h3>未來的社會溝通，具體來說該如何加強？</h3>\n<p>目前官方規劃於2022年底，由行政院核定並公告關鍵戰略的定稿。但公民團體認為，官方在核定公告前，應該將社會溝通會議收集到的社會意見，進行統整性的回應及說明是否參採調整，也要在後續的定稿中思考如何規劃如「監督小組」等機制設計，確保政策在未來8年的執行中可以持續滾動修正，暢通長期社會溝通的管道。</p>\n<h3>地球公民如何參與社會溝通及監督？</h3>\n<p>針對<a href=\"https://www.climatetalks.tw/%E9%97%9C%E9%8D%B5%E6%88%B0%E7%95%A5%E7%A4%BE%E6%9C%83%E6%BA%9D%E9%80%9A\">十二項關鍵戰略的「社會溝通會議」</a>，地球公民亦全面出席參與討論，並提出民間團體的政策意見。以下為地球公民在各場社會溝通會議中提出的建議：</p>\n<p><table></p>\n<p><tbody></p>\n<p><tr></p>\n<p><td>2022/08/15</td></p>\n<p><td><strong><a href=\"https://www.cet-taiwan.org/info/story/4228\">「淨零綠生活」社會溝通會議</a></strong></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>2022/09/21</td></p>\n<p><td><strong><a href=\"https://www.cet-taiwan.org/info/story/4227\">「節能」社會溝通會議</a></strong></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>2022/11/21</td></p>\n<p><td><a href=\"https://www.cet-taiwan.org/info/story/4246\"><strong>「節能」社會溝通延續會議—商業節能</strong></a></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>2022/11/18</td></p>\n<p><td><strong><a href=\"https://www.cet-taiwan.org/info/story/4237\">「自然碳匯」社會溝通會議</a></strong></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>2022/11/22</td></p>\n<p><td><strong><a href=\"https://www.cet-taiwan.org/info/story/4226\">「運具電動化及無碳化」社會溝通會議</a></strong></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>2022/11/23</td></p>\n<p><td><a href=\"https://www.cet-taiwan.org/info/story/4248\"><strong>「節能」社會溝通延續會議—工業節能</strong></a></p>\n<p><hr> ※針對本場會議內容，本會另有聯合投書：<a href=\"https://www.cet-taiwan.org/info/news/4221\">政府應加速工業節能及轉型，趕上國際淨零腳步</a></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>2022/11/30</td></p>\n<p><td><a href=\"https://www.cet-taiwan.org/info/story/4247\"><strong>「節能」社會溝通延續會議—建築節能</strong></a></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>2022/12/17</td></p>\n<p><td><strong><a href=\"https://www.cet-taiwan.org/info/story/4234\">「能源系統去碳化」社會溝通會議</a></strong></p>\n<p><hr>※包含：風電/光電、氫能、前瞻能源、電力系統與儲能，共四項戰略<br></p>\n<p>※針對本場會議內容，本會另有投書：<a href=\"https://www.cet-taiwan.org/info/news/4224\">完整土地空間規劃是光電與淨零轉型關鍵-人民知情及參與是再生能源發展基礎</a></td></p>\n<p></tr></p>\n<p></tbody></p>\n<p></table></p>\n<p>&nbsp;</p>\n<p><hr></p>\n<p>※各關鍵戰略社會溝通之會議錄影及會議簡報，請上：<a href=\"https://www.climatetalks.tw/%E9%97%9C%E9%8D%B5%E6%88%B0%E7%95%A5%E7%A4%BE%E6%9C%83%E6%BA%9D%E9%80%9A\">行政院環保署-氣候公民對話平台</a>。</p>\n<p>註1：十二項關鍵戰略分別為風電/光電、氫能、前瞻能源、電力系統與儲能、節能、碳捕捉利用及封存、運具電動化及無碳化、資源循環零廢棄、自然碳匯、淨零綠生活、綠色金融、公正轉型。</p>"}, {"nid": 4226, "title": "淨零12項關鍵戰略社會溝通會議--運具電動化及無碳化", "original_topic": "抗暖減碳", "adopted_cats": ["氣候變遷與調適", "完善能源政策"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20221221-001.png\"><span>地球公民出席參與2022/11/22召開的「運具電動化及無碳化」關鍵戰略社會溝通會議。 （圖/ <a href=\"https://www.climatetalks.tw/%E9%97%9C%E9%8D%B5%E6%88%B0%E7%95%A5%E7%A4%BE%E6%9C%83%E6%BA%9D%E9%80%9A\">環保署氣候公民對話平台</a>）</span></p>\n<p>2022年3月，行政院公布了「2050淨零排放路徑與策略」，宣布邁向2050的四大轉型策略以及兩大治理基礎，也同時提出要達成淨零的十二項關鍵戰略，到2030年間將挹注約9000億的預算。長期關注減碳及淨零的地球公民，全面出席十二項關鍵戰略的「社會溝通會議」中參與討論，並提出民間團體的政策意見。關於地球公民為何強調淨零轉型社會溝通的重要性，以及其他關鍵戰略場次之意見，請參考：<a href=\"https://www.cet-taiwan.org/info/story/4222\">淨零轉型為什麼需要社會溝通？</a>。</p>\n<p>在2022/11/22召開的「運具電動化及無碳化」關鍵戰略社會溝通會議中，地球公民提出之政策建議如下：</p>\n<h3>一、逐年預設新售車輛數應降低</h3>\n<p>整體運輸部門減碳，與交通部現行的政策，都應該是鼓勵大眾運輸，節制私有運具。簡報11頁的目標為新售電動占比，但到從2025年到2040年，都預設機車一年賣90萬輛、汽車一年賣38萬，沒有遞減與政策方向不同；另為列出該年預估電動汽機車占掛牌總車輛的多少，必須有此數字才看得出整體比例。</p>\n<h3>二、政策誘因不能只有充電樁</h3>\n<p>在會議簡報中，電動化有提供1-4的稅費優惠及貸款協助，另外在配套環境僅有硬體環境提聲與充電設施，但卻看不到管理誘因。除了在綠運輸有私有運具管理的政策外，電動運具優先的停車、專用道策略也應該要嘗試。否則現有的租稅誘因並非新創，但至今仍然無法提升新售電動占比，繼續既有政策無法達成電動化目標。</p>\n<h3>三、公務汽機車汰換目標應更積極</h3>\n<p>地方政府不斷加快公務汽機車電動化目標，台北市政府2023年公務機車電動化、2030年公務汽車電動化，而國際都市也都不斷提前，希望加速進行。甚至公務汽機車共享化也可能是方向，政府部門帶頭作有示範效果，應該比目前設定的2030年更往前提。</p>\n<h3>四、跟綠運輸之間應清楚搭配政策</h3>\n<p>運具電動化是運輸部門減碳中的改善（improve）策略，但綠運輸應該更從迴避（avoid）、移轉（shift）下手，所以從設定整體運具數量及電動化占比開始，要有企圖心，從私有運具的管制加強來抑制私家車數量，目前尚未看到兩邊政策加總下的短中長程目標，應加強在整體計畫中。</p>\n<h3>五、營業用車輛電動化及燃油車落日條款</h3>\n<p>在會議簡報17頁中，交通部有提及外送平台使用電動機車，但事實上，營業用車輛都是政府相對有辦法做部分獎勵或管理的車種。除了外送平台、大型租賃業者到目前全台灣各縣市都有近千家的小型租賃業者，都應該有電動化相關配套政策。現有租賃業者必須用新車才能得到消費者青睞，在此市場結構下，如：消費者端的獎勵，由消費者選購電動車租賃有較好的費率，或鼓勵租賃業者淘汰車輛時換購電動車，也能加快整體電動化時程。並輔以落日條款方式，讓營業用的租賃車、計程車有清楚的時程與規範。</p>\n<h3>六、部分零組件規格統一的可能</h3>\n<p>在全世界處理資源循環零廢棄的方向上，都有逐漸將必備的零件規格統一化的規範，充電孔、內建營幕等，讓修理代替購買，雖然既有市場各家車款有一定特色，但如同車胎，能否有更統一的基本規格，讓機車行可以容易上手，同時也減少更換成本，讓整體車輛不要快速增加。</p>\n<h3>七、清楚的轉型整體計畫</h3>\n<p>新上任的台北市政府，在競選的政見即有成立「運具電氣化維修人員培訓委員會」，讓各類電動運具的維運人員需有系統地加以培訓，市府將結合相關產業聯盟，整合中央與地方資源，做好服務轉型的相關運籌措施。中央政府的整體配套是否有清楚的責任劃分，哪些單位必須負責整體規劃、經費在哪裡，都應清楚明列。</p>\n<p><hr></p>\n<p>※「運具電動化及無碳化」關鍵戰略社會溝通會議之會議錄影及會議簡報，請上：<a href=\"https://www.climatetalks.tw/%E9%81%8B%E5%85%B7%E9%9B%BB%E5%8B%95%E5%8C%96%E5%8F%8A%E7%84%A1%E7%A2%B3%E5%8C%96\">行政院環保署-氣候公民對話平台</a>。</p>"}, {"nid": 4228, "title": "淨零12項關鍵戰略社會溝通會議--淨零綠生活", "original_topic": "抗暖減碳;生活消費", "adopted_cats": ["氣候變遷與調適", "完善能源政策"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20221221-003.png\"><span>地球公民出席參與2022/8/15召開的「淨零綠生活」關鍵戰略社會溝通會議。 （圖/ <a href=\"https://www.climatetalks.tw/%E9%97%9C%E9%8D%B5%E6%88%B0%E7%95%A5%E7%A4%BE%E6%9C%83%E6%BA%9D%E9%80%9A\">環保署氣候公民對話平台</a>）</span></p>\n<p>2022年3月，行政院公布了「2050淨零排放路徑與策略」，宣布邁向2050的四大轉型策略以及兩大治理基礎，也同時提出要達成淨零的十二項關鍵戰略，到2030年間將挹注約9000億的預算。長期關注減碳及淨零的地球公民，全面出席十二項關鍵戰略的「社會溝通會議」中參與討論，並提出民間團體的政策意見。關於地球公民為何強調淨零轉型社會溝通的重要性，以及其他關鍵戰略場次之意見，請參考：<a href=\"https://www.cet-taiwan.org/info/story/4222\">淨零轉型為什麼需要社會溝通？</a>。</p>\n<p>在2022/8/15召開的「淨零綠生活」關鍵戰略社會溝通會議，以及2022/11/23舉辦的延續會議中中，地球公民提出之政策建議如下：</p>\n<h3>一、應明確提出各計劃規劃與執行過程中，擴大邀請公民社會參與的機制</h3>\n<p>1.人民對於邁向淨零綠生活有最直接的需求與經驗，其創意與驅動社會轉型的動能，遠非公務人員與專家學者可比擬。但目前第肆章在全民協力與公私協力的機制仍只有口號與概念，無法引導各子計畫的公民參與效果。一旦各子計畫之擬定與推動欠缺社會認同與參與，將無法令民眾有感，多半會失敗。因此，建議管考處修正第肆章內容，納入更明確的公民參與機制。</p>\n<p>2.目前淨零綠生活的各項子計畫仍偏向保守，對民間參與的想像偏向民間僅是配合的角色，忽略目前民間不論企業或公民團體，早已有更前進的做法與行動。應該在各子計畫擬定過程中，盤點既有社會力，邀請他們參與規劃及執行。<br>\n<p>例如，國內北中南東已有不少民間自發的維修團體，政府應在研擬「5-2延長物品使用壽命」政策時，應諮詢這些團體，了解其對這項政策的想法、其推行的需求與困境，回饋修正目前的政策，以符合社會需求、發揮效能；在執行過程中，也應有個機制，讓這些團體擔任合作或諮詢的角色，如此將有助於政策滾動式檢討、與時俱進。</p></p>\n<p>3.管考處擬規劃做電話訪談進行總體績效指標之調查，除應更具體針對不同面向的行為改變進行調查外，也應利用訪談機會，理解受訪者在特定行為改變上受阻的原因，找出政策窒礙難行之處作為關鍵控制點改善的參考，以利滾動式檢討修正政策執行方式與內涵。未來針對情境模型假設推估出的減碳效益，也應配合調查結果進行減碳行為的效益評估，提升公部門資源的利用效益。</p>\n<h3>二、淨零社區工作應有整合框架，減少資源對接成本、促成有效利用</h3>\n<p>1.淨零綠生活要能走入人民日常生活，需與地方政府有效對接，並透過在地社區的能量推動才能夠事半功倍。草案中多次提及社區的角色，但行動計畫的執行單位不盡相同，難以看見相關補助、教育推廣及宣導行動如何有助於社區邁向淨零。</p>\n<p>2.淨零社區的發展包括社區建物的能源管理服務與綠能設施、綠運輸交通規劃、維修服務、租借與循環利用交換服務等，在宣導面則包含食農、能源、減廢循環利用等。若能加以整合，部分資源能夠共享，也減少與社區組織的溝通成本。</p>\n<p>3.建議管考處應研擬淨零社區的整合框架，由上到下協助地方政府主管機關整理相關資源給社區利用，且暢通社區由下而上的管道，有效反映淨零社區發展中面臨的資源需求（如：維修、回收服務需要穩定方便的公共空間，不一定是資金），以利政策的滾動式檢討。</p>\n<h3>三、行為改變需找出模式，巧推政策應融入具體策略，且增加管制政策</h3>\n<p>淨零綠生活的重點是影響全民生活習慣促成「行為改變」，但具體來說怎麼促成改變是我們關注的。<br>\n<p>計畫中看到很多「推廣」「教育」作為實施辦法，作為環保團體當然也非常同意要加強公民對淨零、環境的認知，但如果最後擬定出來的部分政策只有落實到這個層次，好像只是透過鼓勵去引導，要求他們負起「責任」，但實際上真的有這樣關注環境、永續精神的人，反而去付出相較於不關心的人更高的成本，如果回到整個國家、社會的規模，我們會覺得沒有去解決到根本的問題。這其中當然有一些外部成本如何去定價的問題，但在行為引導上，應該還是有很多可以著力的地方。</p></p>\n<p>1.建議在目前制定的具體行動上，應再深化如何去回應到引導生活端「行為改變」，思考有沒有辦法形成「模式」，造成想要鼓勵的行為推力增加，或想減少的行為阻力減少。否則很可能流為示範性的計畫，好像只透過砸經費、資源把量衝出來就達成KPI，但最後卻不一定能促成行為的根本改變。尤其政策中如果只透過補貼促成短期的經濟誘因，特別容易有這樣的結果，等補貼結束後，消費者又回到原本的行為模式。這是應該要再去思考強化的。</p>\n<p>2.在問題與挑戰部分，環保署提出「吸引民眾無察覺、無負擔下即已落實實踐綠色行為」的目標，但在短期具體行動中，超過一半以上都仍都是傳統的教育宣導及獎補助，對於如何運用巧推政策讓民眾無痛實踐綠色行為，來對接中常程的新商業模式、共享模式，似乎無直接關聯性。</p>\n<p>3.透過巧推政策建構預設的（default）綠生活環境固然重要，然而透過管制政策、價格調適政策進行合理的外部成本內部化，也是從另外一個角度增加民眾誘因的方式，也需一併思考。</p>\n<p>4.針對淨零綠生活的具體行動措施，應更深入分析想改變的行為成因跟具體行動的關聯性。如果沒有把上位的行為成因作一個統整性的歸納，似乎就像是大拼盤，把手上可行的政策工具跟既有推動的內容拼起來，能夠達成的效益就沒辦法對焦，而顯得亂無章法。</p>\n<h3>四、跨部會管考方式應明確，查核目標應說明制定理由</h3>\n<p>1.雖綠生活戰略大多需配合其他關鍵戰略行動計畫推動，但也應有本戰略為主體的管考制度，拉高跨部會的管考層級，確保除科研技術的提升外，生活轉型的步調也能跟上。</p>\n<p>2.目前草案雖有制定2025、2030年的查核目標，然而部分目標趨於保守，難以說服社會以該標準就能夠充分達成具體行動的要旨。建議應具體說明查核目標的制定理由及初步的預算及期程，方能有效回應中長程計畫的規劃。</p>\n<h3>五、應思考企業在戰略中的角色</h3>\n<p>針對企業的案例分享，我們期待看到的不只是企業小規模示範案例，而是對接綠生活的這些重要目標、作為，企業能夠扮演、協力的角色在哪裡。也期待更進一步知道環保署怎麼去談這些案例怎麼歸納出與實際推動政策之間的關聯性？反過來說，政府如果要從需求端拉動減碳，怎麼協助企業去找到資源跟現有商業模式中的破口？這是主管機關應嘗試去擬定的方向，才能真正促成政策制定的效果。</p>\n<h3>六、應完善利害關係人的分析</h3>\n<p>目前規劃上也比較看不到針對利害關係人的分析，可能不用到具體行動的層次，但最少在推動措施的層次上這部份應該要能夠盤出來，有哪些關係人、組織是政府可以利用的社會資源？哪一些是政府需要進一步去思考怎麼改變行為的對象？他們可能會遇到的阻礙是什麼？有這些通盤的思考，透過政策去促成行為改變的路徑才能更清楚。</p>\n<h3>七、針對「淨零綠生活」推動項目的具體建議</h3>\n<p>由於「淨零綠生活」將未來執行的推動項目分為—零浪費低碳飲食（食）、友善環境綠時尚（衣）、居住品質提升（住）、低碳運輸網絡（行/樂）、使用取代擁有（購）、全民對話（育）等六大面向，地球公民針對每個項目（除友善環境綠時尚外）均提出執行與修改建議，請參考附件：<a href=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/%E5%9C%B0%E7%90%83%E5%85%AC%E6%B0%91%E9%87%9D%E5%B0%8D%E3%80%8C%E6%B7%A8%E9%9B%B6%E7%B6%A0%E7%94%9F%E6%B4%BB%E3%80%8D%E6%8E%A8%E5%8B%95%E9%A0%85%E7%9B%AE%E7%9A%84%E5%85%B7%E9%AB%94%E5%BB%BA%E8%AD%B0.pdf\">地球公民針對「淨零綠生活」推動項目的具體建議</a>。</p>\n<p><hr></p>\n<p>※「淨零綠生活」關鍵戰略社會溝通會議之會議錄影及會議簡報，請上：<a href=\"https://www.climatetalks.tw/%E6%B7%A8%E9%9B%B6%E7%B6%A0%E7%94%9F%E6%B4%BB%E6%9C%83%E8%AD%B0\">行政院環保署-氣候公民對話平台</a>。</p>"}, {"nid": 4234, "title": "淨零12項關鍵戰略社會溝通會議--能源系統去碳化", "original_topic": "抗暖減碳;新能源與電業改革", "adopted_cats": ["氣候變遷與調適", "完善能源政策"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20230105-001.jpeg\"><span>地球公民出席參與2022/12/17召開的「能源系統去碳化」關鍵戰略社會溝通會議。 （圖/ <a href=\"https://www.climatetalks.tw/%E9%97%9C%E9%8D%B5%E6%88%B0%E7%95%A5%E7%A4%BE%E6%9C%83%E6%BA%9D%E9%80%9A\">環保署氣候公民對話平台</a>）</span></p>\n<p>2022年3月，行政院公布了「2050淨零排放路徑與策略」，宣布邁向2050的四大轉型策略以及兩大治理基礎，也同時提出要達成淨零的十二項關鍵戰略，到2030年間將挹注約9000億的預算。長期關注減碳及淨零的地球公民，全面出席十二項關鍵戰略的「社會溝通會議」中參與討論，並提出民間團體的政策意見。關於地球公民為何強調淨零轉型社會溝通的重要性，以及其他關鍵戰略場次之意見，請參考：<a href=\"https://www.cet-taiwan.org/info/story/4222\">淨零轉型為什麼需要社會溝通？</a>。</p>\n<p>2022/12/17召開的「能源系統去碳化」社會溝通會議，共包含風電/光電、氫能、前瞻能源、電力系統與儲能，共四項關鍵戰略。地球公民在會議中提出之政策建議如下：</p>\n<p><h2>針對四個戰略的整體建議</h2></p>\n<h3>一、應提供非電力部門的碳排資訊及減碳規劃</h3>\n<p>本場次雖稱為「能源系統去碳化」，卻沒能看到經濟部提出能源系統的非電力部門相關資料。目前非電力部門的能源使用仍占四成的碳排放，仍是不可忽視的一個部分，未來雖然會隨著電力化程度提高而降低會降低，但仍應將整體能源供需推估提出來供公眾理解與討論。</p>\n<h3>二、規劃與估算方式、社會溝通及預算應明確</h3>\n<p>目前政府提出的2050電力供需的推估，在供給面上是否有將環境承載上限納入評估？在需求面，是否有包含鋼鐵、石化等產業之可能總量管制措施？或是無管制措施下的推估？我們認為政府應說明評估依據。若根本沒有進行評估，則應說明後續會如何進行、會用什麼機制跟社會探討。</p>\n<p>地球公民認為，情境試算模型的關鍵參數假設（例如經濟成長率、能源密集度改善率），及該情境下的哪些人會受到什麼影響，或要付出哪些成本代價（例如土地、金錢、就業與生活型態的轉變等等），政府都應具體提出說明，以利公共討論。政府也應考慮提供更多種情境方案、因應策略，同樣分析其成本代價與空間想像，以利社會在數據與事實資料的基礎上進行討論。這些情境方案應包括：戰爭、極端氣候的乾旱及強降雨、土石流、海面上升、能源科技技術或產業減碳技術未如期成熟等。 同時，政府更應清楚說明能源系統去碳化的預算有多少、如何分配，以及未來長期的社會溝通與滾動檢討的機制如何規劃。</p>\n<h3>三、空間規畫思考應更全面、加強橫向溝通</h3>\n<p>除了風電、光電、地熱、海洋能、氫氣等再生能源以外，包括儲能、碳匯及碳封存都會需要使用土地資源。淨零及永續未來下，包括台灣的農漁業、森林碳匯、產業也都需要土地，在地狹人稠的台灣勢必產生競合。請問政府會透過什麼機制來協調各部門的空間需求？以及是否會提出具有空間規畫藍圖的政策？</p>\n<p>政府目前現有的空間規劃，泰半以光電做為空間需求考量，但未來離岸風電與海洋能在海域上的競合，更多地熱基地與碳封存之間的空間，都需要整體的能源部門空間規劃，而非以單一系統（如：光電）做思考。</p>\n<p>而在能源部門，雖然多是中央政府與電力系統的討論，但地方政府在空間規劃、光電土地取得、地方建設核准都有角色，建議在系統端要與地方政府做更多連結。</p>\n<h3>四、應清楚說明燃氣的未來規劃</h3>\n<p>依照政府的預估，2050年我國的燃氣的比例將高達20~27%。請問這些燃氣發電，在常態使用及因應電力調度使用各占多少比例？以及在此情境下，台灣需要多少燃氣電廠？又，若CCUS技術未臻理想，如何因應？政府應清楚說明。</p>\n<p>同時，為了確保供電穩定，又避免不必要的投資，應評估發電設備的適足率（adequacy），說明國內燃氣電廠在不同轉型階段的增建或除役的必要性，以及轉為調度輔助的規劃。</p>\n<p><h2>「風電/光電」關鍵戰略</h2></p>\n<h3>一、光電發展應加強社會溝通、建立對話機制</h3>\n<p>誠如簡報所言，「太陽光電是擴散最快、最易深入民間」的能源，因此其規劃、選址、施工、營運過程，都與人民息息相關，但目前的發展對策卻隻字未提如何進行社會溝通、如何讓光電融入社區、符合社區發展願景。提出三點建議：</p>\n<p><ol></p>\n<p><li>先從既有爭議進行損害控管，修復社會對光電的信心。可以從建立光電設置規範開始，避免粗製濫造的光電設計與不當的施工過程，影響社區生活與社會對光電的觀感。</li></p>\n<p><li>在光電爆量的地區，應進行全區調查，與社區民眾一起釐清光電的影響，減少恐懼或謠言，進而找到區域光電的管理辦法。</li></p>\n<p><li>從地方永續願景出發，與地方民眾一起討論光電在社區發展藍圖中的定位，進而提出因地制宜的社區能源計畫。目前內政部與縣市政府正在試點推動的「鄉村地區整體規劃」或許是其中一個將綠能融入地方規劃的機會。</li></p>\n<p></ol></p>\n<p>光電已累積許多成功與失敗的實務經驗，也率其他再生能源之先建立環境與社會檢核機制。建議經濟部檢討這些經驗，提出改進策略，並研議應用於其他類型的光電或再生能源的評估、設置與社會溝通上，例如海面光電、地熱。</p>\n<h3>二、光電目標應更具企圖心、提升屋頂光電佔比</h3>\n<p>太陽光電在目前政府規劃的2050年發電占比為14.8%。考慮到太陽光電為主要再生能源形式中最具去中心化性質者，又考慮我國特殊之國際政治處境，同時確保緊急時期之能源安全與國家安全，建議政府將現行的太陽光電目標40GW-80GW，明確設定為80GW甚至更高，並在累積實務經驗與建立再生能源良好的環境與社會評估之基礎上，滾動地往更高的目標邁進。</p>\n<p>而根據工研院的研究，全台屋頂光電有13~26GW潛力，且屋頂光電能提高戰爭期間國家能源安全，建議經濟部偕同內政部、縣市政府與民間社會，提出更積極的推動目標與策略。</p>\n<h3>三、具體目標應說明</h3>\n<p>風光與前瞻能源於2023-2030年間的預定工作內容，絕大多數未說明具體目標，是否會於文本報告中提出？</p>\n<p><h2>「前瞻能源」關鍵戰略</h2></p>\n<p>針對地熱與海洋能等新興的前瞻能源，我們認為會有許多不確定因子但仍應嘗試，所以在開發時、發電時都應該有即時完整的監測資訊，並公開相關資料以爭取民眾信任，勿重蹈風光發電所造成因資訊落差而產生之不信任。</p>\n<p>地球公民認為，目前政府規劃的前瞻能源，應做好下列配套措施：</p>\n<p><ol></p>\n<p><li>前瞻能源相關法規的配套，應有羅列清單與進程公開。</li></p>\n<p><li>海洋能2050發電占比達6.07%，固然令人期待，但由於相關技術尙在開發中，恐無法以如此樂觀之情境推估。</li></p>\n<p><li>生質能與廢棄物能的目標與策略應分別擬訂。</li></p>\n<p><li>地熱目前潛力區都在國家公園及原住民傳統領域內，無論是要修法或是讓原住民地區可接收這樣的發展，都需要大量的社會溝通。現有簡報14頁有的範圍，比較是在法規面、與制度面做調整或鼓勵公部門帶頭探勘，但執行面上要做更多溝通。尤其從現有清水、金崙的發電狀態到未來深層地熱的開發，對於開發時地下狀態的變化、發電機組與水蒸氣逸散、回注水造成的影響，都應詳實監測。</li></p>\n<p><li>地熱需要好的探勘，但因為探勘成本高，政府或國營企業應更積極評估投入首批資源帶頭做起的可能性。</li></p>\n<p><li>小水力沒有在簡報中，但確實現有的定義是從裝置容量來討論什麼叫小水力，卻沒有針對開發樣態做討論，譬如自然河川跟現有已做堤壩的溪流，若仍是以裝置量做討論，就會有現存之爭議，需要重新討論小水力之定義，再來談整體所戰之發電量。</li></p>\n<p></ol></p>\n<p><h2>「電力系統與儲能」關鍵戰略</h2></p>\n<p>針對未來電力系統及儲能的整體發展，地球公民期待政府應清楚說明並回應下列關鍵問題：</p>\n<p><ol></p>\n<p><li>布建電網系統所需的土地為多少？是否會納入能源部門的國土空間規劃中一併考量？</li></p>\n<p><li>提升傳統電廠反應速度，目前僅規劃燃氣電廠，但如林口燃煤電廠目前也將是電力供應系統中的到2035年前的主力，是否也有提升反應的計畫？</li></p>\n<p><li>核電廠除役後，釋出的電網如何應用？</li></p>\n<p><li>如何因應極端天氣的影響？戰爭對電網脆弱度的影響？</li></p>\n<p><li>需量反應除了對大戶外，對於一般住商用戶，是否有更多誘因？如時間電價的落差，如何調整到能對用電行為改變，需要魄力與決心來承擔。</li></p>\n<p><li>提升電力品質與電價的關係，政府如何規劃加強社會溝通？</li></p>\n<p></ol></p>\n<p>針對未來發電設備分散化、需量反應及儲能技術的指數型成長趨勢，維持穩定供電不只是台電的責任，也要納入發電業、電力零售業、儲能設備的產銷者、資源整合者、用電端。地球公民建議建議政府檢視未來的電力市場需求，區分每度電價值、容量價值、根據供需變化而適時調整的彈性價值，建立更多元的電力市場價格機制。</p>\n<p><h2>「氫能」關鍵戰略</h2></p>\n<p>針對未來的氫能發展，目前政府的規劃仍在初期階段，也仍未看到包括氫氣來源的規劃等關鍵資訊。我們建議政府應思考：</p>\n<p><ol></p>\n<p><li>氫發電之氫來源，為國內自產綠氫(如發電高於負載時之自產)，或國外進口之氫，請報告釐清。</li></p>\n<p><li>氫能整體相關法規的配套，應有羅列清單與進程公開，更應該要有國家整體的氫能使用藍圖，才好做討論。</li></p>\n<p><li>在氫氣的運用上，對於運具電動化範圍內也有討論，所以氫氣的安全規範、氫氣車的壓力規範等，都需要更多規劃與制定。</li></p>\n<p></ol></p>\n<p><hr></p>\n<p>※「能源系統去碳化」關鍵戰略社會溝通會議之會議錄影及會議簡報，請上：行政院環保署-氣候公民對話平台—<a href=\"https://www.climatetalks.tw/%E8%83%BD%E6%BA%90%E7%B3%BB%E7%B5%B1%E5%8E%BB%E7%A2%B3%E5%8C%96-%E4%B8%80\">上半場</a>、<a href=\"https://www.climatetalks.tw/%E8%83%BD%E6%BA%90%E7%B3%BB%E7%B5%B1%E5%8E%BB%E7%A2%B3%E5%8C%96-%E4%BA%8C\">下半場</a>。</p>"}, {"nid": 4237, "title": "淨零12項關鍵戰略社會溝通會議--自然碳匯", "original_topic": "森林與林業政策;土地與生物保育", "adopted_cats": ["氣候變遷與調適", "森林守護與林業改革"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20220109-001.png\"><span>地球公民出席參與2022/11/18召開的「自然碳匯」關鍵戰略社會溝通會議。 （圖/地球公民基金會）</span></p>\n<p>2022年3月，行政院公布了「2050淨零排放路徑與策略」，宣布邁向2050的四大轉型策略以及兩大治理基礎，也同時提出要達成淨零的十二項關鍵戰略，到2030年間將挹注約9000億的預算。長期關注減碳及淨零的地球公民，全面出席十二項關鍵戰略的「社會溝通會議」中參與討論，並提出民間團體的政策意見。關於地球公民為何強調淨零轉型社會溝通的重要性，以及其他關鍵戰略場次之意見，請參考：<a href=\"https://www.cet-taiwan.org/info/story/4222\">淨零轉型為什麼需要社會溝通？</a>。</p>\n<p>在2022/11/18召開的「自然碳匯」關鍵戰略社會溝通會議中，地球公民提出之政策建議如下：</p>\n<p><ol></p>\n<p><li>在簡報中（P.6、P.21）分別提到2050淨零排放的碳匯目標為增加1000萬公噸碳匯量，2040年的階段性目標也是增加1000萬公噸碳匯量，這是筆誤還是其實就是最大值？<br></p>\n<p><span>農委會回應：是2040年提前達標。</span></li></p>\n<p><li>關於森林碳匯策略，其中「增加森林面積」的部分有提到水利工程多元植樹、邊際農地造林、排除超限利用造林、國有林＆海岸林＆生態復育造林。是否能請提供相關數據和已造林、預計造林的區位？<br></p>\n<p><span>農委會未有回應。</span></li></p>\n<p><li>關於「提高國產材利用」的部分，有提到剩餘木材料再利用，具體再利用的方式為何？<br></p>\n<p><span>農委會回應：主要是林地上疏伐。如果是下層疏伐木基本上會原地棄置，再利用方式主要是將疏伐木材做成木質顆粒、提煉精油的木材、加工廠製材後剩餘廢料的再利用，主要都還是得評估運輸成本，才能決定是否再利用。</span></li></p>\n<p><li>關於「加強森林經營」的部分有提到<strong>低蓄積及劣化林份撫育更新</strong>，這部分是民間團體比較擔心會產生衝突的地方。<br></p>\n<p><span>農委會回應：主要是指銀合歡林的改造。</span></li></p>\n<p><li>關於「推動都市林營造，增加碳匯效益同時優化城鄉生態環境」部分，都市林會涉及森林法之外的法規和其他目的事業主管機關甚至地方政府，請問此措施的具體做法為何？<br></p>\n<p><span>農委會未有回應。</span></li></p>\n<p><li>關於「發展自然碳匯衍生之衝擊，建立利益共享機制」，此點非常重要，需請農委會積極討論並制度化政府與原住民族、林農等利益共享的機制。<br></p>\n<p><span>農委會未有回應。</span></li></p>\n<p></ol></p>\n<p>針對我國自然碳匯與森林政策之間可能的政策方向，可參考《<a href=\"https://www.cet-taiwan.org/info/story/4210\">森林有碳匯，但不只是碳匯--讓森林碳匯提昇台灣森林的多元功能</a>》（地球公民基金會執行長李根政）。</p>\n<p><hr></p>\n<p>※「自然碳匯」關鍵戰略社會溝通會議之會議簡報，請上：<a href=\"https://www.climatetalks.tw/%E8%87%AA%E7%84%B6%E7%A2%B3%E5%8C%AF\">行政院環保署-氣候公民對話平台</a>。</p>"}, {"nid": 4257, "title": "環境部不應只有升格和升官，卻沒有改造", "original_topic": "國會/政策", "adopted_cats": ["氣候變遷與調適"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20230303-001.jpeg\"></p>\n<p>3月4日，環境部組改方案送立法院審查。二十年來，行政院組改為因應氣候變遷和流域治理大趨勢下，原本朝向水、土、林整合，加上環保署業務，整併為環境資源部的理想，在行政院最後的組改方案中，卻已完全破局。我們看到的環境部組改，只有升格和升官，卻看不見改造理想。</p>\n<p>原先根據2012年的版本，在自然資源統合上有相關的規劃：</p>\n<p><ul></p>\n<p><li>水：經濟部水利署、自來水公司、流域管理委員會等整併入環資部，水利署兼管自來水公司，成立水資源管理會、淡水河等五大重要流域管委會等。</li></p>\n<p><li>土：農委會水土保持局、經濟部地調所，整併入環資部為水保及地礦署；內政部營建署下水道工程處，整併入環資部為下水道及污染防治局。</li></p>\n<p><li>林：農委會林務局整併入環資部，升格為森林及保育署；林試所、特有生物研究中心整併入環資部，升格更名為研究院；國家公園也併入，升格為署。</li></p>\n<p></ul></p>\n<p>最後的組改方案，上述這些機構還是留在原部會，只有環保署升格為環境部。新設「氣候變遷署」以因應氣候變遷及溫室氣體減量工作，新設「資源循環署」負責改善事業廢棄物處理，新設「環境管理署」負責環境管理與執法。而既有毒物及化學物質局改為「化學物質管理署」，現行環境檢驗所及環境保護人員訓練所整併為「國家環境研究院」。</p>\n<p>依照這樣的規劃，只看到了環保署原有的機構都升格、高階公務員升官，沒有看到任何改革氣象和理想，令人失望。</p>\n<h3>政治角力，造成方案改革力道有限</h3>\n<p>組改是很複雜的政治角力，交錯著各利害關係人的算計和考量。據筆者有限的觀察現象如下：</p>\n<p>1.行政院組改，原本要將原本37部會整併至29個。但因遭裁併、調整業務的機關和公務員擔心影響自身權益，紛紛透過不同管道遊說，阻礙組改進程；反之，可以升格升官的機構也進行動員。只有極其少數的政務官和公務員真的在思考，什麼樣的組織架構最可以提高政府效能，因應氣候變遷及未來新局。</p>\n<p>2.有部分立委則擔心，把水的業務從經濟部移撥，擔心未來的資源分配，或要一些建設，不像現在這麼方便，可以直接找水利署、河川局。本質上是對水利署業務納入「環境」保護機構的排斥，以及對於自然資源治理就是什麼都不能動的誤解。</p>\n<p>3.此外，環資部如果按照2012年的版本，將成為天下第一大部，中間要整合和磨合的工程確實浩大，要擔此重任的首任部長也難尋。現實上，以目前環保署主事者所展現的格局和能力， 實在吃不下原本掌握的資源和人力是自己數十倍的機構，加上官位的安排和競爭，真的蠻困難的。</p>\n<p>如今，我們面對環境資源部破局，只有環保署升格為環境部，也不是不行。只是，行政院總應該要給外界一個說法和安排，如何面對氣候變遷，五大河川的上中下游整合治理吧？這是執政黨對組織的歷史責任。</p>\n<h3>水土林一家的組改理想已蕩然無存</h3>\n<p>然而，根據行政院在蘇貞昌院長任內函送立法院的理由。此次「五部一會」的調整，係為避免組織大幅度拆合，造成適應期拉長問題，為當前共識度較高方案，在「變動最小化」前提下組織改造。綜觀二十年來，水土林一家的組改理想，蕩然無存，沒有因應氣候變遷所需要的組織設計，只剩下「變動最小化」的政治實務。</p>\n<p>去年三月，看到龔明鑫主委出來召開淨零路徑記者會，終於讓氣候問題提昇到跨部會的行政院層級，有了一番新氣象。依照國發會所發布的2050淨零排放路徑，經濟部（能源、工業）、交通部（運輸）、內政部（住、商）才是達成淨零的主管部會，像地面光電的發展更涉及到跨部會的協調，很需要行政院層級的機構來主管和協調。</p>\n<p>根據已通過的氣候變遷因應法，「行政院國家永續發展委員會」將要負責協調、分工或整合跨部會相關決策。然而，行政院永續會長期效能不彰，全憑行政院長個人喜惡而召開會議，且專業能力、資源與人力不足，無法有效統籌國家整體氣候政策及資源分配。如果最後還是只靠環境部下的氣候變遷署來做一些幕僚作業，何以成事？顯而易見的是，在環境部下增設氣候變遷署，其層級根本不足以因應2050淨零排放的國家目標。</p>\n<h3>保育機構應整合並提高層級</h3>\n<p>最後一點，筆者過去較為關注的組改項目是「整合保育機構並提高層級」。把國家公園放在內政部營建署是在大伐木時代與保育高度拉鋸下，權宜的安放。在林務局終止天然林的砍伐，並轉型為森林治理和最高保育機構之後，理應進行整合。試問96%的國家公園是在林務局管轄的國有林班地，為何管理機構要疊床架屋的？很可惜，林務局和國家公園已無法整合，只期待退輔會森保處可以併入林務局，最起碼終結國府威權統治所遺留下退伍軍人開發原始森林營利的歷史。</p>\n<p>環境部組改方案在立法院審查的此刻，希望民間社會微弱的呼聲，還能引起立委們一點關注，好好思考，台灣需要什麼樣的環境部；面對氣候變遷，我們需要什麼樣的組織改造？</p>"}, {"nid": 4261, "title": "【講座側記】2023年氣候穿搭學！氣候緊急與台灣2050淨零排放目標", "original_topic": "抗暖減碳;花東發聲", "adopted_cats": ["氣候變遷與調適"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u399/20220202-1.JPG\"><br>\n<p>講者：戴興盛/國立東華大學自然資源與環境學系 教授<br></p>\n<p>主持：蔡中岳/地球公民基金會 顧問</p></p>\n<p>氣候緊急&nbsp;</p>\n<p>一般常聽到的是
