合板、運動器具(高爾夫球桿)及雕刻等用途，又因生長快速，為重要的闊葉造林樹種。枋山溪林地內之光蠟樹，主要目的在於透過其快速生長的特性，提供國內木材市場闊葉樹材，並促進木材產業鏈的發展。</p></p>\n<p><strong>Q20：跟國家承租土地的部分台灣禁伐許久，整體造林產業人才是否有斷層（育苗技術、規劃管理的人才），有哪一部分的技術面最值得關注研究？</strong><br>\n<strong><span>A20：</span></strong>林業產業鏈是一系列的產業結構，包括採種、育苗、造林、撫育、收穫，乃至於木材加工等作業都是專業技術的呈現，缺一不可。受到禁伐天然林政策之影響，林業產業鏈中斷許久，臺灣既有之林業技術人才已逐漸消失，因此林務局建立竹東林業教育訓練基地<br>\n<p>，目的就是將既有的傳統技術傳承，並加入新經營技術與觀念，培育新林業經營技術與人才。</p></p>\n<p><strong>Q21：人工林如何兼顧生物多樣性，以往的造林都採單一樹種，那現在的做法是?</strong><br>\n<p><span><strong>A21：</strong></span>目前國有林經營會依照森林資源特性，規劃林地經營目標，讓經濟林與保安林分流，以兼顧木材生產與環境永續的平衡，各分區之經營作業，均會在作業前進行評估、作業後進行監測，並與權益相關方進行溝通，以確認經營作業之影響。枋山溪國有林透過詳實的調查，將林地內台灣穗花杉等珍稀動植物之棲地規劃為高保護價值森林，林相為次生林、且不適合生產林木之林地則規劃為天然林恢復區，適合林木生產之林地則規劃為人工林經營區，依各分區之資源特性規劃經營目標，透過分區規劃經營，可確保林木生產作業可兼顧環境生物多樣性。109年伐木作業前，屏東林管處已在預定地中進行樣區調查，確認作業範圍無珍稀動、植物之棲地，也不涉及環境敏感區域，並舉辦作業說明會，與林地周邊部落進行溝通，並依據部落之建議，調整作業面積及新增櫸木為接續造林樹種，讓森林經營作業兼顧<br></p>\n<p>「環境」、「社會」、「經濟」之平衡。</p></p>\n<p>\t<strong>Q22：如何讓台灣的家具、木器業者愛用國產材，目前國產材市場價格是否具競爭力？</strong><br>\n<p><span><strong>A22：</strong></span>感謝網友關注此議題，提出家具愛用國產材，由需求帶動產業。國產材品質優良，依據訪談調查，木材市場業者並不排斥使用國產材，然而由於現階段國產材產量不夠穩定，生產成本也較高，因此業者難以完全投入國產材製品的開發利用。目前林務局透過教育推廣，列出愛用國產材的十大理由，包括碳足跡、碳吸存、林農就業經濟等，持續與外界溝通，並透過系統性的輔導，持續加入國產材生產廠商，期望逐漸擴大國產材的產量，提升木材自給率，使國產材價格更具市場競爭力。</p></p>\n<p>\t<strong>Q23：人造林有疏林的規定嗎？</strong><br>\n<strong><span>A23：</span></strong>林務局之造林作業可分為採種、育苗、新植、撫育、收穫等階段，其中撫育包含刈草、修枝、疏伐等項目，疏伐為林木經營撫育作業之一，目的在於疏開林分，讓留存木獲得更好的生長空間，林務局針對國有人工林撫育作業訂有各項作業規範，可依照林木之生<br>\n<p>長現況實施。</p></p>\n<p><strong>Q24：對現有的林區包括保育林，是否有更大限度的開放給森林療癒的產業來發展？</strong><br>\n<p><span><strong>A24：</strong></span>林業多元輔導方案中，已有輔導規劃公私有林林主發展森林療癒場域或觀光林場之林地經營計畫。私有林的森林療育產業，林務局已委託辦理相關研究計畫，近期將規劃配套措施；國有林則配合政府整體林業政策，目前主要以國家森林遊樂區或森林育樂區，作為森林療育之場地。</p></p>\n<p>\t<strong>Q25：造林樹種是怎麼決定的，樹苗怎麼培育的？是否有菁英樹計畫？相思樹的硬度會造成木材業的成本損耗，木材是不是讓一般民眾接觸的技術成分需要程度更高？</strong><br>\n<strong><span>A25：</span></strong>造林樹種要以經營目的來決定，生態造林主要考慮生物多樣性，而經濟林主要考慮經濟性樹種，目前林務局的造林規劃是以適地適木之臺灣原生樹種，樹苗是由管理處自行採種，於自有苗圃內播種，再透過移植撫育管理後，待苗高成長至可出栽高度後提供造林作業使用。目前林務局並無執行菁英樹計畫。木材為有機體，纖維方向與密度不均，容易因水分乾燥不均而翹曲變形，因此需要較高之加工技術，加上作業機具多具高危險性，<br>\n<p>對於一般民眾而言，入行技術門檻確實較高。</p></p>\n<p>\t<strong>Q26：全民造林地是人工林？</strong><br>\n<p><span><strong>A26：</strong></span>人工林由人為方式所營造的森林，全民造林確實為人工林之一，但並非所有的全民造林地皆可規劃為林木生產區，仍需要依林地資源特性作整體規劃，將森林的多樣性功能最大化。</p></p>\n<p>\t<strong>Q27：相思樹的價格依據是國際的，還是只有台灣自己的？</strong><br>\n<p><span><strong>A27：</strong></span>簡報內之相思樹價格資料，依據來源是林務局木材市價資訊系統，僅有調查臺灣木場之市價。</p></p>\n<p>\t<strong>Q28：請教一下，30年的人工林常見樹種像相思樹和光蠟樹直徑大約可到多粗？已經達到業界（像傢俱產業）能夠接受的程度了嗎？ 因為似乎國產材在木工產業的初步印象還是多覺得是小徑木很難用</strong><br>\n<p><span><strong>A28：</strong></span>如果依照枋山溪的調查結果，30年生的相思樹與光蠟樹胸高直徑約可達30公分，符合木材市場使用的規格。由於加工技術的進步，目前林產品皆可多元化利用，包含太空包木屑、工藝製品皆是可開發利用之領域，不會因為小徑木就無法利用。</p></p>\n<p>\t<strong>Q29：光蠟樹未來的提供使用目的是？</strong><br>\n<strong><span>A29：</span></strong>光蠟樹因其木材色具有油蠟色澤，材質堅軔優良，類似雞油，顏色較白所以又名為「白雞油」，除可當景觀樹種外，其材質堅軔，可當建築、傢俱、合板、運動器具(高爾夫球桿)及雕刻等用途，又因生長快速，為重要的闊葉造林樹種。枋山溪林地內之光蠟樹，主要目的在於透過其快速生長的特性，提供國內木材市場闊葉樹材，並促進木材產業鏈的發展。</p>\n<p><strong>Q30：是否能推動友善且持續經營的在日本成功模式“自伐型林業”到台灣，並且如何在官員及學者業者都不了解的情況下推動？</strong><br>\n<p><span><strong>A30：</strong></span>臺灣森林環境多元，且多屬國有林，與日本的森林狀況不同，為了降低林農生產成本，林務局推動「林業永續多元輔導方案」，針對各項森林作業(如林業機具、資材、經營計畫、造林撫育管理、作業道)進行補助，類似於「自伐型林業」，目的在於透過「夥伴」、「多元」及「友善」之核心價值，積極輔導林主與合作社加強公、私有林經營撫育，以期銜接國內產業鏈，振興國產材，提高國內木材自給率。</p></p>"}, {"nid": 4149, "title": "地球公民協會與台灣環境行動網合併歷程", "original_topic": "環境正義", "adopted_cats": ["氣候變遷與調適", "森林守護與林業改革", "監督高雄重大污染"], "content": "<p>台灣充滿活力，無畏權勢的環保運動者，儘管在資源困頓的情況下，仍扮演了這個社會的良心者、防腐劑，讓這個幽暗的社會看到亮光。然而，環境NGO普遍都面臨了經營的困境，難以彙聚更大的環保力量。我們體會到：環境問題是世世代代都要面對的課題，唯有重視人才的培養，知識和經驗的傳承，才有可能壯大改變的力量，最重要的是：我們需要有實力、有效能的組織支撐。</p>\n<p><strong>地球公民協會</strong>於2007年由李根政先生集結高雄地區40位環境關懷者所成立，創會時共三位工作人員，在首任理事長蘇振輝先生所帶領的理監事會支持下，主要關注保護山林、減緩與改善工業污染等環境議題；歷年來工作的成績包括了：成功阻擋台電大林燃煤電廠二個機組的開發，使台灣減少增排800多萬噸二氧化碳；揭露台灣伐木養菇的真相，推動限制伐木補償制度；揭露伐木再造林的政策，修訂了保護既有森林不被砍伐的造林政策；追蹤台塑仁武廠土水污染，要求政府增訂了石化業放流水標準。</p>\n<p><strong>台灣環境行動網</strong>為1998年在美國成立留美學人組織的網絡，2006年正式在台灣立案。在美國階段主要關注反濱南工業區─黑面琵鷺的國際串連，在台灣階段則推動責任科技--中部科學園區環評案，以及關切氣候變遷等議題。兩會於2011年1月合併為地球公民基金會。</p>\n<p>地球公民協會（MET）和台灣環境行動網（TEAN），一南一北，雙方在議題、地域上有高度互補，TEAN長期關注責任高科技議題，在國際串連也有相當的基礎，學術界更有豐厚的人才；MET則是關注山林保護和工業污染議題的專業團體，組織和財務已有相當基礎。</p>\n<p>從2010年3月開始，兩會開始討論合併的可能性，主要著眼於：「壯大台灣環境運動的影響力。」希望「共同創造一個有利於環境NGO工作者實踐夢想，貢獻社會的組織。」期間，地球公民協會著手進行組織改造，從6月開始募款準備轉型為基金會，截至9月為止，共有174位捐款人捐助了500多萬元基金，並於12月完成立案。在此同時，台灣環境行動網也召開了臨時會員大會，決議兩會之合併。</p>\n<p>此一發展，打破了台灣人「放尿攪沙不會作堆」的刻板形象，對台灣的環保運動更是一個突破性的進展。</p>\n<p>我們體會到：不論是看守家園或者拯救瀕危的地球，都需要長久而持續的關注，這不只是靠少數志士的「愛心、熱心、恆心」可以達成。這是一個持久戰，除了前線的將士，更需要源源不絕的糧草支援。</p>\n<p>基金會的成立、兩會的合併，正是人才、錢財聚合的開始，接下來的挑戰，就是如何創造正向回饋的組織文化，讓這股善的力量越來越大。在實踐的過程，我們將謹記「愛與慈悲」的初發心，以保全地球生態系為最大之善。</p>\n<p>地球公民基金會將以建立「獨立自主，專業公信力的組織」為目標繼續努力。</p>"}, {"nid": 4187, "title": "種樹造林，可以為台灣增加多少森林碳匯？ 聽眾提問與講者回應整理紀錄", "original_topic": "森林與林業政策", "adopted_cats": ["森林守護與林業改革"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20221013-01.jpg\"><br>\n<p><span>鎮西堡（地球公民基金會謝孟剛攝）</span></p></p>\n<p>這是地球公民基金會在2022年7月21日舉辦〈種樹造林，可以為台灣增加多少森林碳匯？〉論壇活動之後，由於參與者提出非常多的問題，熱切渴望多了解這個議題。</p>\n<p>因此，我們歸納整理了參與者的四大提問和講者在現場的解說，希望可以為大家解惑。</p>\n<p>感謝柳婉郁特聘教授、張世杰教授、孫義方教授、黃群修組長讓國人更加了解森林碳匯各面向的課題，這個整理並非完整的論壇紀錄，歡迎想要進一步了解的朋友，參看這場線上論壇的重播。</p>\n<h3>一、森林碳匯計算應該包含的項目</h3>\n<p><strong>中興大學特聘教授柳婉郁</strong>詳盡介紹當前國際上森林碳匯如何轉換成碳權，柳教授提到對於森林碳匯的計算多採用IPCC於2006年所發表的國家溫室氣體清冊指南中的公式，將樹木的木材密度、生物量擴展係數（從樹木材積換算樹木整體生物量的係數）、根莖比例以及碳含量參數等透過公式計算成為樹木的碳匯，這些參數是森林學者針對個別物種所測量與研究得出的，而台灣雖然有對部分物種建立參數，但仍然需要更多基礎研究找出不同物種的參數，為台灣的森林碳匯轉碳權機制鋪路。</p>\n<p><strong>東華大學孫義方教授</strong>則認為，從植物吸收二氧化碳行光合作用的過程，以及植物為了繁殖、生長、防禦、呼吸作用…等所分配與利用的「碳」，就可以明白當前森林碳匯計算只有從樹木胸徑推估碳匯能力有所不足。並且說明光合作用固定的碳具有即時性，但呼吸及分解作用所釋放回大氣層的碳是長期累積的結果，以兩者差異說明當前的計算方式低估了植物的碳吸存能力。除此之外森林的土壤也是重要的碳庫，如果我們忽略土壤的碳匯條件，則會很大程度對於森林碳匯有錯誤的評估。</p>\n<p><strong>東華大學張世杰教授</strong>向大家介紹森林碳通量的測量方法，除了傳統以計算胸徑的生長量變化外，透過儀器測量大氣渦流中的二氧化碳交換量也可以得到森林在某一段時間尺度內的碳收支，確認該森林在當下到底是吸碳還是排碳，以此蒐集森林的碳匯能力與數據。</p>\n<p>會後，<strong>張世杰教授</strong>以書面補充說明：森林碳匯量，指的是單位面積的森林在單位時間內新增的碳儲存量，我們常用的單位是ton C/ha/yr，亦即每年每公頃的森林新增多少公噸的碳儲存量。因為森林內部的碳主要儲存於林木和土壤，因此調查森林碳匯的”古典方法”，便是每隔一段時間(例如5年)，進入森林進行碳儲存量的調查(林木碳存量加上土壤碳存量，單位ton C/ha)。前後兩次碳儲存量的差值除以間隔的年份(例如5年)，便可得到這段期間的平均碳匯量(單位ton C/ha/yr)。</p>\n<p>在上述的方法之外，過去20餘年來發展的通量量測法，提供了學術界另一個生態系碳匯量的量測方法。由於生態系與外界的碳交換，絕大部分是以二氧化碳的形式(二氧化碳藉由光合作用進入生態系，藉由呼吸作用離開生態系)，因此我們只要能夠長期監測二氧化碳的進出量，就能計算得到這個森林的累積淨二氧化碳吸收量。理論上，這個數值與前述方法所得到的碳匯量是相等的。過去20餘年，進行碳通量量測的渦流相關法(eddy covariance method)儀器被廣泛設置於全球的各種生態系統，這些生態系碳通量數據除了讓我們了解不同生態系統的碳匯能力，也進一步被用於建構全球尺度碳收支模型。在台灣，運作中的森林碳通量長期監測站有5處(棲蘭山台灣扁柏森林、溪頭柳杉人工林、關刀溪天然闊葉林、林後四林平地森林、大農大富平地森林)，提供了我們了解台灣森林碳匯能力的重要觀測數據。</p>\n<h3>二、是否應該對次生林進行林相改良</h3>\n<p><strong>孫義方教授</strong>以Poorter等人2021年發表在Science期刊的論文說明次生林恢復的速度與韌性，在研究中表明自然恢復的次生林在土壤、生態系功能、森林結構、物種多樣性、生物量…等面向恢復成為原本狀態的速度。孫老師認為基於此研究，應該讓次生林自然恢復才能創造最大的碳匯效益。</p>\n<p><strong>張世杰教授</strong>透過長期通量資料以及模式模擬發現森林並不是永遠都處於吸碳的狀態，而是會隨著樹種、樹齡、氣候條件等因素導致碳吸存能力下降。張老師以Gilvan等人2021年發表的研究為例說明透過模式模擬，亞馬遜雨林在2035年之後可能成為排碳源，提醒我們必須考量森林的條件，才能明白該森林能否為我們提供碳匯。</p>\n<p><strong>柳婉郁特聘教授</strong>所介紹的碳權機制，強調必須要經由人為努力所增加的碳匯，才具有抵減的認可，所以如果要為次生林取得碳權則必須透過林相更新等經營手段。不過目前國際上也正在發展維護、管理森林所增加的碳匯如何轉換成碳權，所以日後可能會有不需要經過林相更新而獲得的碳權機制。</p>\n<p><strong>黃群修組長</strong>則說明目前林務局針對森林碳匯所規劃的區位，其中受到銀合歡入侵的次生林是被劃為需要林相更新的區位。由於銀合歡是嚴重影響台灣低海拔森林生態系的入侵種，所以針對此類林地進行林相改良爭議較小，但可能需要討論，針對不同入侵程度是否有不同的處理方法。</p>\n<h3>三、能夠核發碳權的森林種類與條件</h3>\n<p><strong>柳婉郁教授</strong>說明目前的碳權機制必須要是年輕的森林而且有一定面積的人工林，才能在植物生理上確保樹木的吸碳功能（年輕的樹）達成碳匯的增量條件；而碳權是為了抵換人為的碳排，所以必須有人為介入的經營才能作為抵換的額度（人工林）；面積的要求則是驗證程序有一定的成本支出與複雜度，必須達到一定規模才符合效益。</p>\n<p><strong>孫義方教授</strong>認為台灣的森林條件和溫帶國家不同，應該要有考量台灣環境條件的碳權機制，才能確保核發的碳權在台灣的情境下有確實達成減碳目的。如果直接套用必須有人工經營森林才能核發碳權的機制，有可能會因為忽略計算植物生長過程以及土壤、枯落物等碳匯動態而無法達成碳吸存 目的，反而增加碳排。</p>\n<p><strong>黃群修組長</strong>提出林務局今年底建立核發給企業植樹造林ESG憑證的機制。林務局將作為平台媒合林農與企業，讓有ESG需求的企業能夠把資金投注給林農植樹造林，提供台灣小規模的林業模式避免高昂的碳權驗證費用，也能以森林的碳匯功能貢獻企業的ESG績效。惟此模式仍然無法解決企業的碳權需求，日後是否會有在台灣落地的森林碳會轉碳權機制值得觀察。</p>\n<h3>四、平地造林和光電板何者減碳效益高？</h3>\n<p><strong>張世杰教授</strong>首先透過第四次森林調查的數據說明台灣造林達成淨零不可行，而大農大富平地森林的通量研究發現該處林地每公頃每年可以吸收10.9噸的二氧化碳，但光電面板在當前能源使用的碳排係數下每公頃每年可以減排約500噸。如此的差異表明了台灣的淨零碳排應該從能源部門著手。</p>\n<p><strong>柳婉郁特聘教授</strong>說明雖然光電面板相較於造林每公頃的減碳量多，但設置光電面板的成本與造林相比，每噸的減碳成本光電面板比造林高。我們不能忽略森林除了減碳之外也提供了其他生態系服務，而光電面板製造過程與除役後的廢棄物處理，也需要一定的成本甚至具有環境外部性。</p>\n<p>依循<strong>孫義方教授</strong>對於當前森林碳匯計算方法缺失的指認，台灣的森林碳吸存能力有被低估之虞，所以造林或維持天然林、次生林與光電的減碳效益差距是否如此之「大」有待確認，除此之外我們也不能忽略森林在減碳之外的功能，不同生態系服務的效益評估之後，就了解森林與光電的競合不能只單純考慮減碳量而已。</p>\n<p><strong>黃群修組長</strong>所點出邊際農地造林區位以及現存的平地造林與光電有發生競合的現象，需要更多討論與評估才能找出此爭議區位如何利用與配置的解方。</p>"}, {"nid": 4210, "title": "森林有碳匯，但不只是碳匯--讓森林碳匯提昇台灣森林的多元功能", "original_topic": "森林與林業政策", "adopted_cats": ["氣候變遷與調適", "森林守護與林業改革"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20221116-1.png\"><span>林務局宣誓2017年為國產材元年，和國際接軌推動在國有林和私有林的森林認證，正面臨選擇合適的區位，建立制度配套，建立產業鏈，朝向永續營林的各項挑戰。圖為屏東林管處工作人員正進行伐木。（圖／李根政)</span></p>\n<p>\t蔡英文總統在2021年宣示台灣將推動2050淨零排放，今年3月則由國家發展委員會發表了「<a href=\"https://www.ndc.gov.tw/Content_List.aspx?n=FD76ECBAE77D9811\">2050淨零路徑及策略</a>」，除了能源、產業、交通部門的轉型，其中提到占台灣國土面積達6成的森林碳匯約是2,140萬噸，可抵減約台灣8%的碳排量，預期到2050年將增加110萬噸森林碳匯<span>(註1)</span>，達到2,250萬噸。</p>\n<p>從目前規劃看，未來30年台灣在邁向淨零排放之路，森林碳匯增加的幅度並不高，原因在於台灣可以增加森林的土地面積十分有限。此外，能源、製造業、住商、交通部門的排碳量遠大於森林碳匯，舉例來說，台灣大約220萬公頃的森林<span>(註2)</span>，所創造的碳匯量，比中鋼公司一年約2,156萬噸的排放量還略少，如果台灣要透過森林來達碳中和，約略需要6個種滿樹的台灣，這使得森林碳匯在台灣邁向淨零排放過程中，不可能成為主角。</p>\n<p>儘管如此，筆者認為面對艱難的淨零目標，積少成多，任何減碳的方案都不應輕言放棄，8%左右的森林碳匯，仍有積極討論的必要。而在討論森林碳匯之時，我們也應重視台灣森林具有無可取代重要性，包括國土保安、水源涵養、生物多樣性、休閒育樂、木材與林產，文化傳承與發展、美學等，碳匯僅是其多元價值與功能之一。</p>\n<p>這些多元的功能要對應到不同的森林定位和經營管理策略與計畫，符合國際減碳規範和作法僅是基本款，更重要的是：考量台灣的環境特色和森林治理脈胳，增進森林生態系服務的多元功能，避免產生負面影響。</p>\n<p>林務局在今年（2022）4月提出增加森林面積、加強森林經營管理、提高國產材利用<a href=\"https://www.agriharvest.tw/archives/79703\">三大策略及政策</a>，要提升森林碳匯功能，兼顧森林生態系服務價值與產業經濟，並預計在2040年達成增加新植造林面積6.6萬公頃。</p>\n<p>\t對此，筆者認為：37.5萬公頃山坡地範圍內的宜農牧地的經營管理攸關台灣森林碳匯的增加或減少；將近10萬公頃的超限利用地<span>(註3)</span>、草生地，是潛在可增加森林面積的區位；38萬公頃經濟林正在盤點區位以及相關輔導配套，具保育價值的次生林<span>(註4)</span>、城鄉綠化都需要政策規劃與協調，以及資金的挹注，更需要結合台灣護樹愛林的民間力量，形成社會共識，共同推動。森林碳匯如何計算？方法學的部分，林務局和環保署正在相關學者研議當中，則有待進一步分析討論。<span>(註5)</span></p>\n<p><h2>38萬公頃經濟林，如何促進國產材、森林保育與森林碳匯的多贏</h2></p>\n<p><span></span><span></span><span><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20221116-2_0.png\"></span><span><span>林務局宣誓2017年為國產材元年，和國際接軌推動在國有林和私有林的森林認證，正面臨選擇合適的區位，建立制度配套，建立產業鏈，朝向永續營林的各項挑戰。圖一右為溪頭的柳杉人工林。(圖/李根政)</span></span></p>\n<p>台灣的木材超過99%仰賴進口，為了重建台灣國產材產業鏈，提昇木材自給率，林務局已宣誓2017年為「國產材元年」，正在推動森林認證與相關的輔導措施，重建國產材產業鏈的區域。這裡需要有更多的專業和公眾參與討論，確認做為永續經濟林的區位和經營管理配套。</p>\n<p>而林業界普遍認為，透過人工林<span>(註6)</span>的經營、木材的利用，是有益於減碳的生產活動。原因在於林木生長時，會吸收大氣中的碳，林木砍伐製作為林產品時，原先吸存的碳則會固定於林產品中，持續多年。然而，永續經營的人工林應該放在什麼地方？要用什麼樣的經營方法？又如何確保從木材的生產和利用，真的可以減碳？都是需要審慎規劃和討論的課題。</p>\n<p>我國森林碳匯計算的依據，是來自2017年林務局所完成的<a href=\"https://www.forest.gov.tw/0002393\">第四次森林調查報告</a>的基礎：根據該次調查統計，台灣總森林面積為219.7萬公頃，森林覆蓋全台土地面積為60.7%，其中屬《森林法》定義之林地，其森林覆蓋面積約為178萬公頃；林地以外之其他土地，森林覆蓋面積約為41.5萬公頃。</p>\n<p>\t林地上的森林，較有法令和配套，有一大部分是禁伐的保護區<span>(註7)</span>，以及不會從事經濟林活動的國有林<span>(註8)</span>，較無人為因素導致森林減少的情形。而被林務局規劃做為經濟林，打算從事造林、伐木等活動的區域，初步規劃可供林木生產經營的國有林約6萬公頃、私有林<span>(註9)</span>約13.65萬公頃、原住民保留地中的林業用地<span>(註10)</span>約6.5萬公頃、國有租地造林<span>(註11)</span>約12.22萬公頃，總計約38萬公頃。</p>\n<p>理論上，這些經濟林地就是推動國產材的場域，但尚需進一步盤點和確認其是否具有生產潛力。例如：林務局初步規劃可供林木生產經營的國有林約6萬公頃，但實際盤點潛在可生產的面積約2.5萬公頃。</p>\n<p>原因在於這些造林地在數十年未積極經營下，包括交通運輸、林相組成等條件已產生很大的變化，許多人工林在數十年間已自然演替為次生林，邁向天然林<span>(註12)</span>。就林業經營的觀點是「人工林劣化」，就生物多樣性的觀點則是「天然林復育中」。這衍生了其中生物多樣性、森林碳匯的爭議，例如台北市公有林的<a href=\"https://www.twreporter.org/a/opinion-taipei-biennial-afforestation-dispute\">碳中和案爭議</a>，當把次生林疏伐或皆伐<span>(註13)</span>，改造為樹種單一的人工林，是否會增加碳匯？</p>\n<p>\t若林務局要避免類似爭議，很需要盤點經濟林中具有保育價值的森林，運用「具生產性私有林限制伐採補償方案」，讓具有保育價值的次生林保留下來。相對的，因為「原住民保留地禁伐補償條例」的實施，讓竹林的定期輪伐和生產大規模停頓，反而不利於減碳與竹產業的發展，應該藉此檢討這種無差別的補貼方式。</p>\n<p>此外，在台灣經濟林的經營和伐採作業成本，比進口木材成本高，加上產業和人才斷鏈，從造林到撫育成材的時間相當長，已屬特別需要政策扶助的「戰略性產業」。目前在私有林、租地造林的林業經營，難以全然依市場機制，非常仰賴政府政策性的補貼，林務局正以「公私有林業永續多元輔導方案」，對於營林的各環節提供補助，然而，仍力有未逮。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20221116-3.png\"><span>淺山交錯著林地、農牧用地，很有可能鑲嵌著待保育的次生林（天然林）、國產材永續經濟林，林下經濟、混農林等土地利用型態，極需整合法規工具、制度配套，朝向永續治理。( 圖/李根政)</span></p>\n<p>筆者觀察：不管是保留具有保育價值的次生林或者對於國產材營林的補貼，都需要資金的挹注，這需要超過林務局既有預算的支持，如何結合森林碳匯的企業資金挹注，設計出合理的機制都尚待討論。</p>\n<p><h2>農牧用地上的森林，攸關台灣森林面積的增減</h2></p>\n<p>第四次森林調查報告指出，林地中「非營林使用」的面積為21萬1,545公頃，計有崩塌地約7萬1,177公頃，農作約5萬2,842公頃，草生地4萬3,761公頃。林地中未經營森林，將其轉為農作是屬違法的「超限利用」行為，理論上是可以透過加強執法轉為森林的區域；草生地亦可能透過自然演替或造林等方式促進其復育為森林。</p>\n<p>理論上，將近10萬公頃的超限利用地、草生地，是最有機會增加森林面積碳匯的地方，應該比起在「邊際農地造林」更為優先推動，但實務上尚待釐清和討論。</p>\n<p>同樣的報告亦指出：林地以外之其他土地上有41萬5,430公頃的森林，約有17萬公頃位於私有農牧用地上，這些都被納入台灣森林碳匯之中。但是，農牧用地大部分為私有，依法可以從事農業活動，並無法律管制其必須保留森林。因此，很可能因為恢復農業、光電使用等，而使得森林面積減少，進一步導致森林碳匯量減少。</p>\n<p>簡單來說：<strong>全台灣的宜農牧地約37.5萬公頃</strong>（<a href=\"https://calipc.nalrcs.org/Agriland110.files/sheet001.htm\">全台農業及農地資源盤查結果</a>，農委會，2021 ）<strong>的經營管理，正是影響台灣森林面積增加或減少最為關鍵的區域。</strong></p>\n<p>\t這裡是林務局推動國土綠網，串接「森、川、里、海」，在法定保護區之外，生物多樣性最高的淺山區域。同時，也是在既有林地之外，最有可能推動國產材永續經濟林，以及林下經濟、混農林等最為合宜的空間。但同時，卻也是既有法規工具、制度配套最為脆弱，欠缺永續治理的區域。</p>\n<p>\t例如，台東安朔地區的農牧用地<span>(註14)</span>，大部分現況為森林，本區約在1960～1970年代伐木、開墾、造林，1980年代廢耕後自然演替而形成天然闊葉林，根據第四次森林調查的資料所套疊，其中大部分是「經改造天然林」，包括多樣而獨特的殼斗科天然林，然而卻沒有法規，或者明確的協商機制，可望避免這些森林的損失。</p>\n<p><strong><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20221116-4.png\"></strong><span>綠色區域為台東安朔溪南北的農牧用地，大部分現況為森林，為根據第四次森林調查的資料所套疊，其中大部分是「經改造天然林」值得關注。(圖/地球公民基金會)</span></p>\n<p>\t在農牧用地，以下是目前可能使用的政策工具，或民間正自主推動的作法，但整體來看，並不足以因應數十萬公頃規模的治理。</p>\n<p>\t一，如果該地的森林具有保育價值，理論上，政府可以透過林務局主管「<a href=\"https://conservation.forest.gov.tw/0002186\">瀕危物種及重要棲地生態服務給付推動方案</a>」等方案，提供私有地主之補償，促使得維持森林狀態。然而，目前僅應用於石虎等少數物種，並未擴及到森林生態系，且該給付方案也未必具有足夠的誘因。</p>\n<p>二，部分農牧用地是曾參與政府獎勵造林，如果經評估確認可以繼續輔導其朝向永續經濟林發展，可望成為國產材發展的區位。</p>\n<p>三，從媒體報導，我們看到農委會水保局正提出《山坡地農牧用地獎勵植樹造林》草案，擬在高度100公尺、坡度5%以上的山坡地，推動「山坡地保育區農牧用地一定比例種樹」。目前政府尚未公告此一草案內容。初步的理解，這應該是可以結合既有次生林保育、國產材、混農林業的推廣政策，但是，如何和林務局的政策通盤考量，避免各行其是，需要農委會進行內部協調整合。</p>\n<p>四，台灣民間已許多人士自主性的從事天然林復育，或正在推動農地的公益信託，如果有更多的民間資金投入，可以創造森林碳匯與生物多樣性的雙贏，政府應該增修信託法規、制度性的獎勵措施，鼓勵這樣的作法。</p>\n<p>筆者認為「山坡地農牧用地的森林」，並非都應以「凍結現狀」的方式經營管理，如何依據資源條件，考量森林碳匯所需要維持或增加的森林面積、生物多樣性、國產材、友善的混農林等，很需要生態環境的基礎調查，檢討增修相關法規，透過生態服務給付創造更多誘因，如果要引進結合ESG（環境保護、社會責任、公司治理）<span>(註15)</span>，導入企業資源（資金、技術和人才等），則需要建立相關配套規範。</p>\n<p><h2>生物多樣性的城鄉綠化，碳匯功能小、人民幸福大</h2></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20221116-5.png\"><span>圖為台東安朔地區的森林空拍照，顯示多樣豐富的天然林。（攝影／傅志男）</span></p>\n<p>從增加森林面積──森林碳匯的角度，台灣平地的城鄉地區能夠提供做為森林的土地面積遠不如坡地，然而卻是提升人民生活品質、幸福最有感的公共投資。</p>\n<p>根據聯合國<a href=\"https://zh.m.wikipedia.org/zh-hant/%E7%94%9F%E7%89%A9%E5%A4%9A%E6%A8%A3%E6%80%A7%E5%85%AC%E7%B4%84\">《生物多樣性公約》</a>的目標，國際植物園保育聯盟 (Botanical. Garden Conservation International, BGCI ) 提出後2020年全球植物保育策略（Global Strategy for Plant Conservation, GSPC） 目標草案，比起過往更為重視城鄉地區的綠化工作，原因在於栽種生物多樣性的原生植物的綠地，可以促進都市永續生活的許多面向，包括了環境教育、入侵物種的控制、生態復育、涵養水源外，更重要的是，城鄉地區的公園綠地，讓人們可以就近使用，更有利於促進人民身心健康。</p>\n<p>期待藉由這波造林減碳計畫，將部分國產署或地方政府臨近城鎮、村落附近的公有地，以及台糖部分土地，規劃為森林公園，打造符合該區域植被特性的多樣物種及覆層的森林公園。而對於既有的公園綠地，可以採取補植、更換樹木、營造複層林等策略，不放棄任何可以種植樹木植物的地方。</p>\n<p><strong>只是，推動城鄉植樹不應只是工程發包，要避免如種樹百里政策的倉促推動，應該進行經營管理系統的檢討與改造。</strong>近年來林務局和林試所正積極推廣原生植物的種植與稀有植物保育，應該在此基礎上，由中央和地方政府，從育苗開始就要導入植物生態、栽培、養護、生態教育等專業人才，建立和培訓經營管理的專業系統，搭配符合比例原則的經費和人力，有系統的長期經營，讓台灣的公園綠地經營體系邁向專業化，達成增加碳匯和永續生活的多元目標。</p>\n<p><h2>納入關注森林的公眾參與，為台灣森林多元功能加值</h2></p>\n<p>有關農牧用地的森林經營管理，涉及農委會林務局、水保局、內政部、國產署等，目前主管機關的權責不清，欠缺足夠的法規工具；經濟林連結國產材的政策配套，應該確保其作法可以增加森林碳匯而非減少；城鄉綠化更是中央和地方許多機關的常態工作，很需要擬定上位政策，提供生物多樣性植栽綠化的指引，有計畫的編列預算，導入專業與人才。</p>\n<p>種樹護林是台灣許多企業、慈善組織、個人所熱衷的環保項目，在這波森林碳匯的政策規劃中，如何結合和導引台灣豐沛的愛樹愛林社會力和資源共同參與，妥善運用企業對森林碳匯、環境永續ESG的需求，導引企業長期投入，對森林的多元價值做出實績貢獻，而非淪為漂綠的短線操作，將會需要更多的政策梳理，公眾參與討論。</p>\n<p>謹以此文拋磚引玉，建請農委會陳吉仲主委、國發會龔明鑫主委、蘇貞昌院長參酌上述提議，開放政府，讓關注森林生態、林業發展的各界國人，共同討論邁向淨零的森林治理策略方案，讓森林碳匯為台灣森林多元功能加值。</p>\n<p><hr></p>\n<p><table></p>\n<p><tbody></p>\n<p><tr></p>\n<p><td>註1｜</td></p>\n<p><td>carbon sink，又名碳吸儲庫或吸儲庫，是能夠無限期累積及儲存碳化合物（特別是二氧化碳）的天然或人工「倉庫」，例如森林、土壤、海洋、凍土等，也是作為溫室氣體增加之緩衝區。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註2｜</td></p>\n<p><td>依據第四次森林調查的資料，台灣的森林面積為219.7萬公頃，這些森林從土地的權屬、林型、經營使用的分類，對應到經營管理的不同面向，簡要說明如下。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註3｜</td></p>\n<p><td>超限利用指的是未依土地編定所容許的使用行為。在山坡地上，最常見的超限利用的行為是：在林業用地上把森林砍伐，從事農業活動。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註4｜</td></p>\n<p><td>指原始穩定的森林植被遭到山火、蟲災、或者人為破壞或砍伐之後，經過若干年後再度自然復育而成的新的森林植被和生態系統，且具備植被未被破壞前的森林規模。次生態系統多見於刀耕火種的農業系統中的休耕地、人工或者天然林場。次生林是天然林的一種，另一種天然林是原始林。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註5｜</td></p>\n<p><td>可參考地球公民論壇--種樹造林可以為台灣增加森林碳匯嗎？Q&amp;A</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註6｜</td></p>\n<p><td>由人工栽植或人工播種而形成之森林。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註7｜</td></p>\n<p><td>台灣的保護區系統包括了國家公園、野生動物棲息環境、自然保留區等。這其中的森林都是禁伐，且台灣有天然林禁伐的命令，所以這些森林轉其他利用的機會極低。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註8｜</td></p>\n<p><td>台灣承繼日治殖民時期，超過全台九成以上的森林為國有，面積達184萬9,818公頃。而初步規劃可供林木生產經營的國有林只約6萬公頃。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註9｜</td></p>\n<p><td>森林屬於私人所有，依法可以從事植林、伐林的經濟林活動，不得轉為農業等利用。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註10｜</td></p>\n<p><td>原住民保留地同樣有編定不同的用地，規範其容許使用的項目，其中被編定為林業用地約6.5萬公頃，這些土地依法要從事植林、伐林等林業活動，並維持森林狀態，不得轉為農業等利用。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註11｜</td></p>\n<p><td>國府治台，為鼓勵私人參與造林，或清理遭到占墾的林地，因而和人民簽訂租約，將國有土地出租給私人造林經營，統計約有12.22萬公頃。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註12｜</td></p>\n<p><td>泛指未經人為之力，經由天然更新而形成的森林。包含完全未經人為干擾，林相結構趨於穩定的原始林 ; 以及被破壞或造林失敗之後，重新生長演替的次生林。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註13｜</td></p>\n<p><td>兩者都是林業經營的方法。疏伐是將森林中部分樹木砍伐，以避免密度過高，影響樹木的生長，希望培育形質優良的樹木，以利收穫木材。皆伐則是將一片林地上的森林全面砍伐。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註14｜</td></p>\n<p><td>台灣的非都市土地，依區域計畫法劃分為共計有11種使用分區、19種用地。如果土地被劃分為「農牧用地」，依法可從事農業活動，如果在農牧用地上營造人工林或自然長出森林，地主想要砍伐，都不會受到《森林法》的限制。</td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td>註15｜</td></p>\n<p><td>聯合國全球契約（UN Global Compact）於2004年首次提出ESG的概念，被視為評估一間企業經營的指標。</p>\n<p><ul></p>\n<p><li>環境保護（E，environment）： 溫室氣體排放、水及汙水管理、生物多樣性等環境汙染防治與控制。</li></p>\n<p><li>社會責任（S，social）： 客戶福利、勞工關係、多樣化與共融等售產業影響之利害關係人等面向。</li></p>\n<p><li>公司治理（G，governance）： 商業倫理、競爭行為、供應鏈管理等與公司穩定度及聲譽相關。</li></p>\n<p></ul></p>\n<p></td></p>\n<p></tr></p>\n<p></tbody></p>\n<p></table></p>\n<p><hr></p>\n<p>本文為2022/11/15報導者投書：李根政/<a href=\"https://www.twreporter.org/a/opinion-taiwan-forest-carbon-sink\">在淨零排放的路上，讓森林碳匯提升台灣森林的多元功能</a></p>"}, {"nid": 4220, "title": "從「國產材元年」談台灣森林的經營管理－聽眾提問與林務局回應整理紀錄", "original_topic": "森林與林業政策", "adopted_cats": ["森林守護與林業改革"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20221215-02.jpg\"><br>\n<p>這是地球公民基金會在2022年6月25日舉辦〈從「國產材元年」談臺灣森林的經營管理〉講座時，參與者提出非常多的問題，熱切渴望多了解這個議題。</p></p>\n<p>因此，我們歸納整理了參與者的5大面向的問題，由林務局整理回應參與者的提問。</p>\n<p>感謝林務局讓國人更加了解台灣森林經營管理各面向的課題，歡迎想要進一步了解的朋友，參看這場線上論壇的<a href=\"https://www.cet-taiwan.org/events/4145\">重播</a>。</p>\n<h3>----------<br>\n<p>森林碳匯</h3></p>\n<p><strong>提問1：由於永續森林經營加上國產材之收穫與持久性利用可以增加碳匯，有助達成臺灣2050淨零排放目標，也有很多效益，如今天演講講到的各種生態、經濟與社會效益，請問本局對於從現在到2060年，如何提升臺灣森林碳匯潛力之規劃，包括永續森林經營之面積、年收穫量、木材利用量、森林與木材之碳匯量。</strong></p>\n<p>\t林務局回應：</p>\n<p><ol></p>\n<p><li>本局對於提升臺灣森林碳匯潛力規劃從「增加森林面積」、 「加強森林經營」、「提高國產材利用」等面向著手，具體構想包含透過推動邊際農地造林、混農林業經營及都市林營造來增加森林面積；並由加強人工林經營、更新低蓄積及劣化之森林、減少林火及病蟲害造成碳匯損失等方式加強森林經營，以增加森林碳匯。</li></p>\n<p><li>至於永續經營之面積及相關收穫與碳匯量乙節，目前政策目標係規劃於2028年將木材生產量提高至20萬立方公尺、自給率達5%，2040年則以木材生產量40萬立方公尺、自給率10%為目標，希望藉人工林永續經營與循環利用、提高國內木材產能及利用，以增加森林碳匯。</li></p>\n<p></ol></p>\n<h3><strong>------------<br>\n<p>​</strong><strong>國產材發展</strong></h3></p>\n<p><strong>提問2：國產材除了跟林業合作社或是林業公司購買以外,是否未來有沒有規劃其他販售的通路,可較小量或是零售的通路</strong></p>\n<p>\t林務局回應：</p>\n<p><ul></p>\n<p><li>為刺激國內國產木材市場的活絡並建立販售通路，本局刻評估委託民間示範經營木材交易市場(含實體及電商交易平台)的可行性，同時就所涉國有林產物處分事宜，研具法規調適之配套方案。</li></p>\n<p></ul></p>\n<p><strong>提問3：個人經驗，拿到本土森林的產品，並不會聯想到這是「砍伐」國產材所得到的產品服務。是否在相關產品包裝上，加上本局想發展國產材產業的理念或政策介紹？</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>為了讓國產木竹材有自己的身份證，本局已建立「國產木竹材識別標章（臺灣木材標章）」，凡經產銷履歷驗證（TAP）、優良農產品林產品驗證（CAS）合格及取得臺灣林產品生產追溯條碼（QR code）標示之廠商，其產品均可使用該標章。未來將持續輔導及鼓勵國產材業者取得相關驗證或條碼，並在產品包裝上標註臺灣木材標章及相關資訊，使國人安心選購國產材商品。</li></p>\n<p></ul></p>\n<p><strong>提問4：臺灣目前顯然沒有太多應用於工程的國產規格材，原因是生產品質不足，還是建築工程法規不允許的問題？</strong></p>\n<p>\t林務局回應：</p>\n<p><ol></p>\n<p><li>臺灣國產材品質優良，並不遜於國外進口木材；目前沒有太多應用於工程的規格材，主因是過去臺灣林木生產停滯，缺乏足夠的木材料源，且伐木、加工技術斷層等因素所致。為解決前揭問題，本局2020年啟動國產材備料場建置示範計畫，於北部(正昌製材廠)、中部(臺大實驗林)、南部(明昇製材廠)及東部(昆晉木業)建置4處規格材備料廠。截至2022年7月已有昆晉等5家廠商之規格材通過CAS林產品驗證，符合CNS國家標準，以供應市場需求。</li></p>\n<p><li>本局已邀內政部建築研所究合作，以國產柳杉、杉木、臺灣杉等集成材進行試驗，據以訂定「木構造建築物設計及施工技術規範」，並於2022年5月完成「2022常用國產材-應用於公共工程參考手冊」，提供各部會編列公共工程使用國產材之參據。</li></p>\n<p></ol></p>\n<p><strong>提問5：參加過北、南兩場本局辦的林場參觀活動，感想是：因地形之故，臺灣的造林、伐林難以大面積機器操作。所謂國產材無法大量生產，感覺只能走「精品中的精品」路線。</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>臺灣地形特殊，營林條件確實較受限制，因此確有發展符合本土需求及環境友善之林木生產作業技術體系，目前本局已評估適合於臺灣環境之林木收穫作業機械種類，並與林業試驗所及產業界合作，發展小型機械及多段式架空索集材等作業方式，以對生態環境衝擊最小、因地制宜、不破壞水土保持為原則，辦理疏伐作業。另外，107年首次引進林業機械-塔式集材機，可顯著降低集材主柱架設時間、集材機轉移次數與人力需求，並可克服作業面積受限等問題，較傳統集材作業生產量可提高3倍，集材生產費用可降低50%以上。</li></p>\n<p></ul></p>\n<p><strong>提問6：臺灣可開發人工林面積只有6萬公頃，遠遠不及其他溫帶或是林業為基礎國家，發展速度已遠遠不及，況且現在大多的森林都仍是生產力低下的人工林，那我們如何超越他們?</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>本局推動國產材振興，係為善盡地球村一份子，減少對外特別是熱帶地區天然林進口的倚賴，而非「超越」 溫帶以林產出口為主的國家。考量木材進口徒增碳足跡及風險，爰即使面積有限，仍有努力克服困難，實現提高木材自給率的目標。</li></p>\n<p></ul></p>\n<p><strong>提問7：先前看公視我們的島訪談，政府似乎有意讓國產材走向精緻、小徑木為主的路線，然而這路線顯然難以增加木材自給率？不知道是否有規劃從政府單位採購開始限用一定比例的國產工程材？</strong></p>\n<p>\t林務局回應：</p>\n<p><ul></p>\n<p><li>本局已邀內政部建築研所究合作，以國產柳杉、杉木、臺灣杉等集成材進行試驗，據以訂定「木構造建築物設計及施工技術規範」，並於2022年5月完成「2022常用國產材-應用於公共工程參考手冊」，提供各部會編列公共工程使用國產材之參據。</li></p>\n<p></ul></p>\n<p><strong>提問8：請問在之前的數據中經過評估應該無法達到太高的木材自給率，有目標預計大約達到多少百分比嗎？</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>經分析102年至108年國內木材進口量，包括原木、木炭、木片及粒片、木材殘餘物(其他木片、樹皮、鋸屑)、製材、木質人造板等，換算每年實木產品平均值為492萬立方公尺，呈逐年遞減趨勢。依此推估迄至118年之木材進口量計為420萬立方公尺，以此數值加計國產木材生產量估算，木材自給率5%為預計達到之目標(國內木材生產量20萬立方公尺以上)。</li></p>\n<p></ul></p>\n<h3>----------<br>\n<p>林業經營</h3></p>\n<p><strong>提問9：社區林業的案例目前普遍看到的是以林下經濟與森林遊憩為主，不過林業其實已經不是需要大型資本和機具才能啟動的產業了，請問臺灣目前是否有社區林業的案例是在經營小規模的森林（木材生產）可供參考？</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>社區林業第一階段即包含「生態保育」、「森林保護」、「森林育樂」、「樹木與生活」等面向，其中「樹木與生活」即與森林主、副產物加工利用有關。近年來已有嘉義縣番路鄉公興社區發展協會、花蓮縣秀林鄉部落交流協會等9個社區林業計畫（名單如附表1），運用國產材進行創作及林產品開發，成為社區具在地特色的綠色產業。除社區林業以外，目前如永泰、永在林業公司，多係循本局「林業永續多元輔導方案」，由本局提供必要的協助及輔導。</li></p>\n<p></ul></p>\n<p><strong>提問10：如果未來要持續發展林業，機械化也是不可能跳過的問題。在臺灣目前還沒有廠商有量能投入研發或製造的現況下，是否有考慮由林試所與農改場或其他較具機械專業的研究單位進行合作？</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>感謝建議，本局已規劃與工研院、農改場或林試所等科研單位，針對木、竹集成材規格化量產機械研發等技術進行合作，研發完成將可由本局輔導之廠商導入製程中使用。</li></p>\n<p></ul></p>\n<p><strong>提問11：現今針對皆伐面積的限制為「超過兩公頃就要進行環評」，除了影響伐採申請之外，也造成大部分林管處在規劃標案時，習慣以「疏伐」來設定（但同時也增加了每木調查時龐大冗長的行政成本）。想請問未來針對伐採與環境影響評估之間的關係是否會調整？方向如何？</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>疏伐係為調整林分密度所必要之「撫育伐」，有別於以生產為目的之皆伐，過去環保署將林木之伐採視為土地「開發行為」，忽略森林永續經營的伐採係林地維持循環永續之利用方式，造成本局森林經營及私有林農的成本負擔，未來本局仍將持續與環保署協商，釐清一般開發案件之伐木及人工林永續經營之分野，將人工林永續經營之伐採回歸由林業主管機關在不影響環境、資訊公開透明等原則下予以審核准駁。</li></p>\n<p></ul></p>\n<p><strong>提問12：如果要推動森林計畫書的完整性，勢必需要有專業且針對林地的調查團隊，以空拍機、光達、雷達測距、GPS點以及現地調查的方式，才能成為開發計畫的資料，保證林業開發活動遵循法規準則，臺灣有專門的林業調查公司嗎？學術界以外的，是經驗成熟且受認證的第三方監測公司？如果沒有的話，有意培養嗎？</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>目前國內尚未有專門的林業調查公司，惟民間有部分協會、生態顧問公司、林業技師公會等，均可提供林業相關調查技術之服務，此部分隨著國內對於生態監測調查領域越趨重視，提供相關服務的產業自會相應增加，透過市場機制亦可引導產業健全發展及人才培育。另森林經營並非「開發計畫」，所提空拍機、光達、雷達測距、GPS等技術，均有利於提高森林測計之效率及精度，惟並非所有森林經營均有應用必要，本局除持續與相關學術單位及研究機構導入相關技術外，亦鼓勵民間協會、生態顧問公司、林業技師公會等創新相關技術及服務，惟目前尚未有認證第三方監測公司之規劃。</li></p>\n<p></ul></p>\n<p><strong>提問13：林道、作業道的差異是什麼</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>林道係指為林業生產所需而開設之永久性道路，其規模依本局規範，視需求分甲、乙、丙三級，目前臺灣林道多屬早期伐木時期所留存，共計有81條，可於本局官方網站(<a href=\"https://www.forest.gov.tw/0003286\">https://www.forest.gov.tw/0003286</a>)查詢。至於作業道則為規模較小之臨時性設施，其規模尚不及於「道路」之等級，有關作業道之規範，本局於103年間訂有「人工林作業道設計及施工原則」將其侷限於人工林內作林業機械運行所需。</li></p>\n<p></ul></p>\n<p><strong>提問14：營林所需的砍伐，也會造成景觀的變化，可能引起社區或觀光客反對。請問本局對於景觀問題有研究過嗎？對其所需的社會溝通，有何看法或策略？</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>針對營林所需的砍伐造成社區或觀光客反對的情況，關鍵在於社會溝通；為此，本局已研議伐採案件之公眾參與及資訊公開制度，未來各級林業主管機關將在透明及廣納意見溝通等原則下，進行森林伐採案件之許可。</li></p>\n<p></ul></p>\n<p><strong>提問15：潛在林木生產地若位於淺山，難免遇到城鄉發展、產業發展、綠能發展需求的土地利用競合問題，本局怎麼看待？</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>國有林區以外的淺山區域，未來於縣市國土計畫可能劃為農業發展區或城鄉發展區，面臨土地利用競合問題，淺山地區的森林如因國土保安、水源保育所必須，得劃編保安林並由森林法規範。至於未屬保安林之區域，則可透過獎勵造林、林業永續多元輔導方案、對地綠色環境給付等政策工具促使其營林使用。</li></p>\n<p></ul></p>\n<p><strong>提問16：由於目前林班地已經不開放承租，對於希望經營林地的新進工作者，初期取得林地的方式似乎還是得透過購買私人林地，或是與舊有的租地造林林農進行轉約，但許多林農由於對租地收回政策有所期待，目前林地價格基本都從每公頃 40萬起跳，造成林地入手很大的門檻（相信與投入農業的青農們遇到的問題很類似）。請問針對林地交易的常態化，局內政策？</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>私人林地之交易價格應回歸市場機制，不宜由政府介入，爰亦無所謂「常態化」問題，目前法規要求只有應作林業使用，不可任意開發或興建設施。至於透過租地造林轉約取得林地經營權部分，只要承租地符合本局要求之造林條件下，由原承租人（轉讓人）與受讓人聯名會同提出申請，即得辦理轉讓。</li></p>\n<p></ul></p>\n<p><strong>提問17：2017年本局在受農傳媒專訪時，曾經提到，根據盤點「可營林區位」計6萬公頃（「可立即投入生產」1.1萬公頃），其中是否有包含租地造林？大致區位有可能公布嗎？這些明確可以由機關直接掌控的土地，是不是有可能看到本局針對這篩選出來的重要營林區位，提出具體的伐採規劃（相較於現在只能透過標案來被動得知各林管處規劃的伐區）？</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>本局盤點的6萬公頃可營林區位，未包含租地造林地，因租地造林地林木的所有權是屬於承租人的，因此人工林盤點僅針對本局轄管的直營造林地。另本局規劃的伐採案件公眾參與及資訊公開制度，也會將可營林區位資訊納入，以利外界具體瞭解相關林木伐採資訊。</li></p>\n<p></ul></p>\n<p><strong>提問18：雖然中央推動林業合作社多年，不過依然有許多林農散戶並沒有加入林業合作社，但目前許多補助（如：疏伐、作業道開設等）都還是綁在經營計畫書的基礎上，如果是針對不想加入合作社，但是又有經營意願的林農，在現行的政策上是否有其他彈性的作法？</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>本局「林業永續多元輔導方案」係透過林業合作社或農企業團體整合30公頃以上之林地擬具森林經營計畫，予以補助部分經營所需之必要經費，以期達到森林永續經營之目的，未針對個人予以補助。個別林農建議依獎勵輔導造林辦法申請山坡地獎勵造林，可逐年領取造林獎勵金。</li></p>\n<p></ul></p>\n<p><strong>提問19：近期剛公布的新版林業永續多元輔導方案，在造林補助上開始與經營計畫書脫鉤，且輔導金的發放期間也縮短至六年，想請教這個新的修正方向，是否反應了本局在補助金的認定上，對於林業合作社與經營計畫書的比重調整，以及未來更傾向鼓勵短伐期的造林樹種？</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>林業永續多元輔導方案主要是輔導林農組織化且有計畫性地多元經營森林，並非限制僅能單一方式經營林地，更鼓勵在林木生產收穫期前，在森林環境條件及法規可允許進行的條件下，輔以多元方式經營，進而增加林主收入，使之能持續性經營森林，達到永續的目的。該方案相關補助費用，非僅限於經營前6年，林主可視其森林經營計畫書分年規劃及實際作業所需提出申請補助，更非代表政府政策傾向鼓勵短伐期的造林樹種，期間完全尊重林主自身經營其林地之主觀意見，提供林業經營上必要之經費協助。</li></p>\n<p></ul></p>\n<p><strong>提問20：山坡地造林補助可以有較簡化的程序嗎？ 2獎勵造林補助經費山坡地有機會增加嗎？</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>有關山坡地造林補助，目前依獎勵輔導造林辦法給予20年每公頃60萬元造林獎勵金，本局依「造林目標分流輔導、獎勵金項目及額度增修」等方向，已擬具「獎勵輔導造林辦法」修正草案刻循法制程序陳報農委會中，研議將獎勵造林第1-6年獎勵金由每公頃計32萬元提高至最高50萬元，第7年起則納入林業永續多元輔導方案執行，依實際撫育作業補助林業經營所需經費，實質上提高造林補助。</li></p>\n<p></ul></p>\n<p><strong>提問21：桂竹林的伐採，由於過去禁伐補償的限制，造成林地主申請砍伐的意願大幅降低，即使現在已經經過修正，但由於判斷補助金的權責落在原民會及地方政府，許多竹林林農都還是不敢輕易進行伐採（疏伐），請問在不同單位的溝通以及對於民眾的宣導上，局裡面有沒有進一步的措施？</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>竹林應適時經營，藉由每4至5年更新伐採，以維持竹林健康及水土保持功能，並能適量供能竹材生產。為振興臺灣竹產業，本局已規劃在原保地禁伐補償金額基礎上，訂定「原住民保留地竹林更新獎勵作業規範」，另給予原住民因伐採竹林收穫當年度無法請領禁伐補償金者3萬/公頃之對等補助獎勵生產，刻正進行法制作業中，預定自112年起執行。</li></p>\n<p></ul></p>\n<h3>------------------<br>\n<p>林業產業人才培力</h3></p>\n<p><strong>提問22：森林相關科系畢業生，如何能參與新竹人才培訓的課程呢? 想請問申請管道以及資訊公開的平台為何?</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>目前本局委託臺北市林業技師公會辦理竹東訓練基地之人才培訓事宜，未來將建置林業人才培訓之資訊平台，透過平台可取得年度培訓計畫、課程綱要、林業技術人員資歷及用人單位徵才等資訊。</li></p>\n<p></ul></p>\n<p><strong>提問23：目前臺灣的林業產業鏈已經出現斷層，政府是否有培育相關人才的計畫？</strong></p>\n<p>林務局回應：</p>\n<p><ol></p>\n<p><li>本局自108年已於該局新竹林區管理處規劃建置「竹東林業訓練基地」，採分期分區方式進行，並為強化林業工作人員之經營及收穫技能，已於109年完成建置林業職能學習地圖，發展符合現代林業經營技術培力課程，並持續進行職能發展計畫，展開林業技術人員之招生、培訓、測驗及合格證書發給等實質程序及培訓結果之評鑑，以滾動式檢討既定之職能地圖內容，109至111年間共計辦理15場次課程培訓，受訓320人次。</li></p>\n<p><li>本局將進一步進行林業技術人員之職能基準及能力鑑定制度建立，藉由本局核發林業人員合格證書方式，以銜接國內林業人員培訓及用人需求之訓考用體系。</li></p>\n<p></ol></p>\n<p><strong>提問24：臺灣具備相關林業生產技術的（集材）工班雖然出現斷層，但年齡層落在 40-60歲之間的中壯年工班，依然是近年施作各大林管處標案，以及伐採中北部原保地的主要勞動力。想請教近年本局開始推動林業人才培訓，現在有任何配套措施去媒合或輔導，訓練中心出來的人力與現職工班，在傳統的經驗與新式的安全教育與技術之間做銜接嗎？</strong></p>\n<p>林務局回應：同上述兩題回應。</p>\n<h3>----------<br>\n<p>森林教育</h3></p>\n<p><strong>提問25：參加過北、南兩場本局辦的林場參觀活動，感想是：1.中小學的環保教育需要微調一下。其中一場有小朋友參加，小朋友的認知就是「伐木=山老鼠」，一整天的活動下來仍沒搞懂不是所有伐木都是壞事。</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>山老鼠是指「未經許可」盜取山林資源的人，並非指以永續經營林業為目的之林木伐採行為。另本局已尋找合適團隊研擬相關核心教學方案，將正確宣導合理的林木伐採是森林永續經營必要之一環；相關教學方案將在本局環境教育、文化園區、森林遊樂區等場域進行宣導，並由各林管處與轄內國中、小學校合作，運用多元管道讓民眾了解使用合法來源國產材的好處。</li></p>\n<p></ul></p>\n<p><strong>提問26：如何增加木材教育以及木建築利用的推進。為什麼不獨立一個部門專門推進國產材的木建築利用，如林野廳一樣？</strong></p>\n<p>林務局回應：</p>\n<p><ul></p>\n<p><li>木材教育及木建築使用的推廣，不是只有單一部會的權責，還涉及到教育部（教育）、經濟部（工商業）、內政部（建築管理）、行政院公共工程委員會（公共工程推動）等，農委會負責國產材生產，本局已與前揭部會組成跨部會合作平台，以協力推廣國產材。</li></p>\n<p></ul></p>\n<h3>---------<br>\n<p>其他提問</h3></p>\n<p><strong>提問27：台糖造林地也在本局管轄範圍嗎？本局對台糖造林地的調查盤點結果如何？</strong></p>\n<p>林務局回應：</p>\n<p><ol></p>\n<p><li>​台糖公司的平地造林地，其土地權屬雖非本局轄管，惟依「平地造林直接給付及種苗配撥實施要點」規定，其地上林木尚未砍伐或土地轉作其他用途使用前，相關造林、撫育工作仍須受本局監督。</li></p>\n<p><li>農委會於109年盤點台糖公司10,539公頃平地造林地，盤點結果如下：</li></p>\n<p></ol></p>\n<p><ul></p>\n<p><li>「具棲地、生態價值」區位之面積為3,383公頃，係位於與國土生態綠網關注區、生物多樣性熱點、生物遷徙重要棲地或保護區之延伸、平地森林園區等區位，具環境保護、生態綠網等功能。</li></p>\n<p><li>「適合農業生產」區位之面積為7,156公頃，獎勵期滿後規劃永續農林生產，朝友善棲地生態及農業生產目標經營。</li></p>\n<p></ul></p>\n<p><strong>提問28：從日本和紐西蘭進口材比例增加了，這兩個國家應該也很重視天然林保護，他們如何在保護森林資源和林材出口中取得平衡?</strong></p>\n<p>林務局回應：</p>\n<p><ol></p>\n<p><li>依進口木材數量分析，從日本進口比例，在2009-2018年間平均約11.4%，到2020年則提高到19%；從紐西蘭進口比例，在2009-2018年間平均約16.7%，到2020年則提高到29%，顯見臺灣從這兩個國家進口的木材比例確實增加。</li></p>\n<p><li>日本及紐西蘭近年都致力提升國內木材生產量，以日本為例，訂定2030年國產建築用木材使用量達2,600萬立方公尺，佔國內總需求量60%以上；紐西蘭則是國內木材生產量從1990年的220萬立方公尺，到2019年已增加到442萬立方公尺。這兩個國家都是在保護天然林的原則下，透過人工林的妥善經營、提高國內木材生產量等政策措施，滿足國內市場需求外，一部分木材亦可出口，以達到保育及木材需求間取得平衡之目標。<br></p>\n<p>&nbsp;</li></p>\n<p></ol></p>\n<p><strong>提問29：上回(2021/8月)到阿里山國家森林遊樂區,看到超多樹被砍掉(砍下來的樹木當天很多集中擺放在好幾個不同點)。請問砍樹目地為何? 森林其實沒有疏林的必要,為何要砍樹呢?</strong></p>\n<p>林務局回應：<br>\n<p>人工林如未妥善經營管理，可能導致樹木生長空間嚴重競爭，致生長不良、材質不均與樹勢變弱；另林相過於鬱閉將導致林下光源不足，影響植被生長及野生動物棲息。疏伐作業可為樹木保留足夠的生存空間，促進留存木生長並提升木材品質，增加林地生物多樣性及森林碳吸存功能。</p></p>\n<p>\t本局嘉義林區管理處為美化阿里山國家森林遊樂區景觀，已進行分年分區疏伐作業規劃，包含山水線、祝山林道、觀日步道、巨木群棧道、受鎮宮、阿里山賓館、旅社區等區域，依據不同區域特性辦理不同疏伐率之作業。林分疏開後，林間透光度增加，林下植物生長將更加茂盛，對林地之保護效果及生物多樣性亦會增加，在景觀上亦更為舒適，除去壓迫、雜亂之觀感，希望疏伐後之森林景觀可帶給遊客更好的遊憩體驗。</p>"}, {"nid": 4237, "title": "淨零12項關鍵戰略社會溝通會議--自然碳匯", "original_topic": "森林與林業政策;土地與生物保育", "adopted_cats": ["氣候變遷與調適", "森林守護與林業改革"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20220109-001.png\"><span>地球公民出席參與2022/11/18召開的「自然碳匯」關鍵戰略社會溝通會議。 （圖/地球公民基金會）</span></p>\n<p>2022年3月，行政院公布了「2050淨零排放路徑與策略」，宣布邁向2050的四大轉型策略以及兩大治理基礎，也同時提出要達成淨零的十二項關鍵戰略，到2030年間將挹注約9000億的預算。長期關注減碳及淨零的地球公民，全面出席十二項關鍵戰略的「社會溝通會議」中參與討論，並提出民間團體的政策意見。關於地球公民為何強調淨零轉型社會溝通的重要性，以及其他關鍵戰略場次之意見，請參考：<a href=\"https://www.cet-taiwan.org/info/story/4222\">淨零轉型為什麼需要社會溝通？</a>。</p>\n<p>在2022/11/18召開的「自然碳匯」關鍵戰略社會溝通會議中，地球公民提出之政策建議如下：</p>\n<p><ol></p>\n<p><li>在簡報中（P.6、P.21）分別提到2050淨零排放的碳匯目標為增加1000萬公噸碳匯量，2040年的階段性目標也是增加1000萬公噸碳匯量，這是筆誤還是其實就是最大值？<br></p>\n<p><span>農委會回應：是2040年提前達標。</span></li></p>\n<p><li>關於森林碳匯策略，其中「增加森林面積」的部分有提到水利工程多元植樹、邊際農地造林、排除超限利用造林、國有林＆海岸林＆生態復育造林。是否能請提供相關數據和已造林、預計造林的區位？<br></p>\n<p><span>農委會未有回應。</span></li></p>\n<p><li>關於「提高國產材利用」的部分，有提到剩餘木材料再利用，具體再利用的方式為何？<br></p>\n<p><span>農委會回應：主要是林地上疏伐。如果是下層疏伐木基本上會原地棄置，再利用方式主要是將疏伐木材做成木質顆粒、提煉精油的木材、加工廠製材後剩餘廢料的再利用，主要都還是得評估運輸成本，才能決定是否再利用。</span></li></p>\n<p><li>關於「加強森林經營」的部分有提到<strong>低蓄積及劣化林份撫育更新</strong>，這部分是民間團體比較擔心會產生衝突的地方。<br></p>\n<p><span>農委會回應：主要是指銀合歡林的改造。</span></li></p>\n<p><li>關於「推動都市林營造，增加碳匯效益同時優化城鄉生態環境」部分，都市林會涉及森林法之外的法規和其他目的事業主管機關甚至地方政府，請問此措施的具體做法為何？<br></p>\n<p><span>農委會未有回應。</span></li></p>\n<p><li>關於「發展自然碳匯衍生之衝擊，建立利益共享機制」，此點非常重要，需請農委會積極討論並制度化政府與原住民族、林農等利益共享的機制。<br></p>\n<p><span>農委會未有回應。</span></li></p>\n<p></ol></p>\n<p>針對我國自然碳匯與森林政策之間可能的政策方向，可參考《<a href=\"https://www.cet-taiwan.org/info/story/4210\">森林有碳匯，但不只是碳匯--讓森林碳匯提昇台灣森林的多元功能</a>》（地球公民基金會執行長李根政）。</p>\n<p><hr></p>\n<p>※「自然碳匯」關鍵戰略社會溝通會議之會議簡報，請上：<a href=\"https://www.climatetalks.tw/%E8%87%AA%E7%84%B6%E7%A2%B3%E5%8C%AF\">行政院環保署-氣候公民對話平台</a>。</p>"}, {"nid": 4258, "title": "鎮西堡，與森林共存的原住民部落", "original_topic": "森林與林業政策;山坡地不當開發", "adopted_cats": ["森林守護與林業改革"], "content": "<p>&nbsp;</p>\n<p>近日，環運圈的老友──蔡嘉陽博士分享一張鎮西堡農耕地的空拍圖，並拿來和同樣具有檜木觀光資源的司馬庫斯做了土地利用模式的對比。部分網友直覺式地連結到山坡地過度開發、超限利用等問題。此舉引發對鎮西堡發展脈絡較熟悉的各界批判，更讓鎮西堡<a href=\"https://www.twreporter.org/a/aboriginal-reserve-hsinchu-cinsbu\">阿道．優帕司（Ataw Yupas）</a>長老<a href=\"https://www.facebook.com/yupas.ataw/posts/pfbid0dYYpirzQHca96NDkCN9JbP5KhEd4Ts6y5rNsQgFdMfY4cuXqchcFMRaFsZCyk8Xkl\">發文解釋</a>，這是冬季有機田休耕的景象，目前鎮西堡所有農耕地都是農牧用地，並沒有超限利用。</p>\n<p>幾天之後，部落工作者Yapit Tali<a href=\"https://www.facebook.com/photo/?fbid=10217950011821611&amp;set=a.1340136883191\">發文解釋</a>鎮西堡土地利用的脈胳；長期投入共管研究與倡議的林益仁教授等人，則發表<a href=\"https://e-info.org.tw/node/236182\">〈馬告的森林：一個不斷尋找和解的地方〉</a>一文，期待從推動馬告國家公園的歷史中，看到原權與生態理念合流互惠，面對衝突，積極的對話與反思，尋求和解。</p>\n<p>這張鎮西堡空拍照，似乎成了近來很難得討論坡地農業和原住民部落發展的媒介，期待這次的衝突可以化為更多的社會對話和相互理解，成為一個好的起點。</p>\n<p>鎮西堡是我重要的山林啟蒙之地，除了那裡的檜木原始森林，更重要的是從<a href=\"https://www.twreporter.org/a/aboriginal-reserve-hsinchu-cinsbu\">阿棟．優帕司（Atung Yupas）</a>牧師、阿道．優帕司長老、依諾・尤命長老等好友身上，學習和感受泰雅族和山林土地的文化連結。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/202303067_0.jpg\"><span>阿道長老這片平坦狹長的菜園上下，都是自然復育約20年的森林。謹慎地利用山坡地、保留林帶，這是鎮西堡正在推動的友善農法。（圖／李根政）</span></p>\n<p>1999～2003年我參與的<a href=\"https://ourisland.pts.org.tw/content/2096\">催生馬告檜木國家公園運動</a>，倡議在泰雅族的傳統領域中，政府應建立一個和原住民共管的國家公園。林益仁教授稱之為：環運和原運第一個合作的社會實驗。</p>\n<p>2018年底，我出了<a href=\"https://e-info.org.tw/node/219765\">《台灣山林百年紀》</a>這本書，部分內容正是整理這場社會實驗的經驗。其中在〈鎮西堡──與森林共存的部落〉文長約6,000字的章節中，我分享了：鎮西堡部落和檜木林的關係；原住民部落的保育和盜伐的拉扯；從鎮西堡與森林共存的友善農業和特定區域計畫，討論原住民部落的土地利用與規劃；以及長遠來看部落、社區參與山林的治理。</p>\n<p><h2><span>守護檜木神靈</span></h2></p>\n<p>鎮西堡部落行政區劃分在新竹縣尖石鄉，在馬告檜木國家公園預定範團的東南側，是石門水庫上游最深山的泰雅族部落，海拔約1,700公尺，可以說是台灣少數位於溫帶地區的部落，隔著塔克金溪（大漢溪的上游）和司馬庫斯部落遙遙相對，兩個部落主要的觀光資源是檜木。</p>\n<p>鎮西堡的檜木林在馬望山和基那吉山之間，僅僅一天來回，人們可透過略有難度的生態步道，親眼目睹那一棵棵數百或上千歲，高大壯麗、樹形各異的巨大生命。檜木森林有四至五層次，最高層的檜木及針葉樹樹高可達40～50公尺，第二層針闊葉樹則在15～25公尺之間，往下還有闊葉樹和灌木、草本、苔蘚等，樹上也有多種的附生或攀藤，多層多樣的原始森林令人陶醉，尤其看到只如芝麻粒大小且極輕薄的檜木種籽，竟能長成難以想像的大巨木，更會感受生命的奇蹟。</p>\n<p><span>「我們從不刻意砍伐或干擾檜木林，相反的，這片霧林是族人、祖靈的原鄉。」</span></p>\n<p><span></span><span></span><span>「紅檜與扁柏的巨木就是神靈，統稱為『Kapa-rong烏・杜』，烏・杜就是神靈之</span></p>\n<p><span>意，也是Ga-Gar的一部分。」</span></p>\n<p><span>這是陳玉峯教授記錄鎮西堡部落阿棟・優帕斯牧師的一段話（註1），是泰雅族人和檜木霧林之間，永恆而動人的詩篇。泰雅族人基於這樣的信念，為了守護著和族人共存的山林，有條件支持建立具有「共管機制」的馬告檜木國家公園，認為這是邁向自治的階梯。如今，住在鎮西堡和司馬庫斯的許多族人仍然以「GAGA」精神守護著山林，他們自發地組織巡守隊，發展觀光的同時，也試圖規範遊客的行為。</span></p>\n<p><span>什麼是GAGA？我的學習和理解是：好比漢人所說的人和人之間的倫常，或者，舉頭三尺有神明的道德規範。但泰雅族的GAGA包括人與人、人與土地關係的行為規範、人在環境或使用自然資源的倫理，而且對族人有很強的內外在約束力。森林、狩獵、河川、土地經營都有GAGA，生活中很細微的行為也都有GAGA，如果不遵守，會遭致上天的懲罰。</span><br>\n<p><span><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/202303063_1.jpg\"></span><span>紅檜巨木的形象各異，但都壯麗，而且森林味道十分馨香。我曾到美國加洲的謬爾紅木國家紀念公園（Muir Woods National Monument），看到高達數十棵近百公尺的巨大紅木，內心也是澎湃感動。但是，就色彩、物種、味道等的豐富程度而言，我認為台灣的檜木林大勝。（圖／李根政）</span><span></span></p></p>\n<p><span><span></span></span>1998年，我開始參與<a href=\"https://ourisland.pts.org.tw/content/2096\">搶救棲蘭檜木林運動</a>，要到2000年才第一次從鎮西堡部落踏入這片原始森林，見證這群偉大的生靈，給我許多新的文化刺激和學習。<span></span></p>\n<p>然而，在2003年馬告國家公園預算凍結之後，我和同事開始關注淺山地帶的全民造林、伐木養菇等議題，便少有機會再度前去學習了解。</p>\n<p>2017年，我帶著同事重回了鎮西堡部落，和阿道．優帕斯長老（基督教長老教會）、依諾・尤命二位老朋友在夜裡聊著關於森林的歷史，阿棟．優帕斯牧師也前來相會，重溫了當年一起為保護森林努力的革命情感。</p>\n<p>阿道．優帕司長老說，在1980年前後，台灣正面臨著森林浩劫，唸國中的他跟著爸爸到獵區（要走一天多）打獵，連續兩年，連一隻山羌也沒有。因為隔著塔克金溪，退輔會的棲蘭山林區170林道正在炸山開路、大肆砍伐原始森林──檜木林。每天約中午11點，就會進行大約30次的炸山爆破開道，中午吃飯，下午再用推土機把土石推落河道，巨大的聲響把動物都嚇跑了，而且把底下的檜木整片都打爛掉。</p>\n<p>當時是大伐木時代的最高峰，林道已經從泰岡一路挺進新光部落，正準備從鎮西堡的水源地，基那吉山下開路到檜木群，但引起部落的強烈抵抗，才保住了森林。如今的泰崗和新光部落到了冬季就會缺水，就是因為水源地的森林被砍伐。</p>\n<p>事實上，鎮西堡部落不僅抵抗國民黨政府的伐木，早在日治時代，因為慘烈的抵抗，才延緩了日本伐木開發的力量進入。</p>\n<p>從這個歷史觀點，台灣最早的森林保護運動，應該是原住民對殖民政府的抵抗運動，而鎮西堡基於保護水源地，對國民黨政府進行的反對伐木行動，應該載入史冊。</p>\n<p><h2><span>部落的光和影</span></h2></p>\n<p>2000年後，部落開啟和政府的接觸和合作，但雙方的作法還是有很大的差異。例如，現有通往檜木林的觀光步道，是依原有獵徑小幅修建，但林務局打算拓寬、建造管理處，遭到部落反對，才得以維持現有生態原貌。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/202303068.jpg\"><span>鎮西堡部落在新竹縣尖石鄉，是石門水庫上游最深山的泰雅族部落，隔著塔克金溪（大漢溪、淡水河的上游）和司馬庫斯部落遙遙相對。鎮西堡的檜木林在馬望山和基那吉山之間。為開闢棲蘭160、170、100號林道，退輔會森林開發處在塔克金溪的最上游砍伐檜木林。如果不是森林運動的阻擋，170、160伐木林道將繼續延伸。（圖/地球公民基金會）</span></p>\n<p><span></span><span>2006年，水土保持局為了消化石門水庫上游整治預算，打算在檜木林區的崩塌地，施作水泥工程，鎮西堡部落同樣悍然拒絕，因為他們了解森林的天然復育機制，反對水泥工程。如今，那片崩塌地已自然復育為以赤楊樹為主的次生林，大自然自我療癒，完全不必工程介入。另外，政府原也打算在塔克金溪支流興建潛壩工程，同樣在鎮西堡部落的反對下無法興建，不僅保護了天然的溪流，更為納稅人省下8,000萬的經費。</span><span></span></p>\n<p>但是，2012年來自其他部落的盜伐集團，曾經偷砍了鎮西堡的檜木；2014年再發生來自其他部落的盜伐者，砍伐了一棵約200年的檜木和一塊樹瘤。這裡是屬於林務局新竹林區管理處的管理範圍，有巡山員例行性巡邏，但卻無力阻止盜伐。鎮西堡因應接連發生的盜伐事件，經過6次部落會議，決定在通往神木群的唯一道路上，設置關卡，宣示主權、維護森林。</p>\n<p>當年3月14日，鎮西堡居民慎重地舉行了設立關卡的立約儀式，邀集司馬庫斯、尖石鄉前山、桃園復興、宜蘭南澳、南投瑞岩、丹大部落、林務局等代表，結盟守護森林。在檜木林步道的入口實施夜間封路，由部落青年輪流守夜巡邏，特別留意下午4點以後的貨車，只要發現可疑的車輛，就在第一時間處理。</p>\n<p>原住民部落和過去原本勢不兩立的林務局，共同結盟保護檜木林，這是台灣森林治理<a href=\"https://ourisland.pts.org.tw/content/1552\">很重要的歷史里程碑</a>。</p>\n<p>阿道．優帕司長老說，這是他們的傳統領域，部落有權利參與經營管理，但檜木林、自然資源要與全民共享。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/202303062.jpg\"><span>在紅檜巨大的量體下，人顯得渺小，就千年為單位的生命尺度而言，人又何其短暫。（攝影／李根政）</span></p>\n<p>有些人會因為看到上述的負面事件就認為：原住民文化已經流失，要如何相信部落可以管好山林？但我們要想想：台灣多元社會中，任一社群或族群都有正面或負面的力量。如果有好的國家體制，恢復原住民權利，找回傳統生態智慧，就可以讓更多原住民部落成為山林保育守護者，在大社會的支持下，就有機會讓更多正向的案例和力量擴散。而不可忽略的是，該正視山區經濟和生存能否永續的課題。</p>\n<p><h2><span>與森林共存的農業</span></h2></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/202303064_0.jpg\"><span>在這片耕地旁，坡度較陡的地方，部落族人種下的「赤楊」，除了保護水土，也有固氮的作用。（圖／李根政）</span></p>\n<p>在自然資源豐沛的社區，發展觀光似乎是條兼顧環境永續的生存之道。然而，擁有豐沛的檜木觀光資源的鎮西堡和新光部落，並沒有把觀光當作唯一的生計來源，而是「農業為主，觀光為輔」。</p>\n<p>自古以來，農業就是部落主要的生存基礎，阿道．優帕斯長老說，那些一天到晚跑去打獵的年青人，會被老人家批評是懶惰的人，沒有依節令去播種耕耘，到時候會讓家人挨餓。</p>\n<p>20多年前，新光部落長老LOSIN，開始帶頭轉做有機，影響了鎮西堡部落的阿道．優帕斯長老，接著帶動整個部落中生代的農業轉型。根據內政部的調查統計，目前新光與鎮西堡兩個部落，約有40個農戶取得有機認證，而取得有機認證的農場面積約40公頃，占全部農業使用土地面積之30%(註2)。然而，由於許多轉作有機栽培的農戶並未申請認證，所以實際面積更大；據了解，施行慣行農法者反而只有少數幾戶。</p>\n<p>有機農戶栽培的多樣蔬菜例如青椒、高麗菜、芹菜，目前是供應主婦聯盟生活消費合作社、里仁，以及新北和桃園市的學校營養午餐，很受歡迎。特別是6～8月的高麗菜，因為位於中海拔的鎮西堡，剛好可以補上淺山和平地的生產空檔。由於部落產業可以提供生計，所以有9成的年輕人留在部落。</p>\n<p>鎮西堡的農業大約以10年為週期更換作物。1980年代種蘋果和香菇，但蘋果在台灣加入世界貿易組織（WTO）開放大量溫帶水果進口後崩盤，香菇則被中國的廉價香菇打敗。那段期間，部落也需要砍伐楓香、殼斗科的樹木，栽培段木香菇，讓部落附近的森林有了損失；幸而部落內部有所自覺，透過部落會議確認在水源地不得砍伐森林。接著1990年代是種水梨，2000年左右種植水蜜桃，現在則是蔬菜為主。</p>\n<p>依諾・尤命的觀察經驗是，鎮西堡雨水多，不適合種水蜜桃，適合種水梨與蘋果，但需要很多農藥；而對於林業，他的觀點是，經營人工林生產木材，收穫期太長，也不可能在原住民部落發展。</p>\n<p>10幾年間，部落除了發展有機農業，也在部落的農路兩側、邊坡和聯外道路有計畫地植樹，或者復育森林。長期致力於保護森林的族人，深知與森林共存的永續農業，才是山坡地農業的解方，他們的目標不只是有機農業，而是友善農業，正在形成整個部落的植樹和復育行動。</p>\n<p>根據現場的考察和訪談，他們的作法有以下幾種：</p>\n<p><ol></p>\n<p><li>部落內外的農路和道路兩旁，通常種植楓香，到了秋冬很具有觀賞價值。</li></p>\n<p><li>山坡上的梯田邊坡則是種赤楊，或者保留次生林、種植少數柳杉；森林和農田交界處，會刻意種上幾棵蓪草，這種植物花的數量多，可以吸引很多昆蟲傳粉。值得一提的是，即使是在實施慣行農法的農地，邊坡上還是保留了樹木和小林子。</li></p>\n<p><li>嘗試多樣化的作物。雖然現在的鎮西堡是以栽培有機蔬菜為主，但阿道．優帕司長老也正嘗試種植多年生的奇異果。台灣原生奇異果──台灣羊桃，本就生長於部落的森林，果實略小，味道豐富，代表這裡可能適合栽培，甚至發展為在地的特殊產品。</li></p>\n<p><li>休耕輪作，許多農地只種植一季的作物，最多兩季，讓土地休息。</li></p>\n<p><li>保留水源地嚴格禁止任何開發。</li></p>\n<p></ol></p>\n<p>鎮西堡、新光部落經過部落會議，決定成為依據《區域計畫法》劃定之<a href=\"https://www.cpami.gov.tw/%E6%9C%80%E6%96%B0%E6%B6%88%E6%81%AF/%E6%A5%AD%E5%8B%99%E6%96%B0%E8%A8%8A/36-%E7%B6%9C%E5%90%88%E8%A8%88%E7%95%AB%E7%B5%84/19132-%E7%89%B9%E5%AE%9A%E5%8D%80%E5%9F%9F%E8%A8%88%E7%95%AB%E5%B0%88%E5%8D%80.html\">「原住民族特定區域計畫」</a>的全國首例，且在2018年5月獲得通過。在規劃過程中，由部落族人指認部落取水之水源，需要進行災害管理的野溪兩側，限制人為建設使用，並且需維持排水暢通，保護部落的水源與安全；同時避開環境敏感區，預先規劃人口成長後所需的居住、農耕與公共設施用地。</p>\n<p>特定區域計畫可以依部落的發展需求和環境永續進行規劃，計畫過程納入傳統規範及在地知識，突破過去過於粗放、欠缺精細土地調查所進行的分區管制；施行過程以部落會議為主體，泰雅族的GAGA為最上位的規範，強化內部的自我約束，搭配國家公權力的賦權，透過部落共識，和國家的管制力量接軌，我們可以說，這是更為細緻可行的經營管理計畫。目前正在制定的部落公約，就是把GAGA文化轉為文字律法。</p>\n<p>為了保護水源地，免於外界財團到水源地買地開發，部落要求對保護水源地，採取比現行法律更嚴格的限制開發，以防堵現有相關法令的漏洞。他們的目標是維持水源地的原貌，也不允許私人財團登記水權。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/202303066.jpg\"><span>泰岡溪、塔克金溪是大漢溪的最源頭，而大漢溪是淡水河最大的主流。淡水河其他二大支流為新店溪、基隆河。（地球公民基金會製圖）</span></p>\n<p>然而，因為計畫範圍內的農業使用土地面積約152.5公頃，但有約48公頃位於林業用地，不符合目前的土地使用管制規定，目前正在依法進行「異議覆查」，重新確認是否可以變更為農牧用地，同時和部落協商和制定友善農業合法化的條件。</p>\n<p>這些條件包括：梯田的每階平台需有林木與植被保護邊坡，且混植不同樹種，邊坡以石塊疊砌而成；利用斜坡小面積種植甘薯、苧麻、小米等耐旱作物，以人工維護，不使用大型機具翻耕表土為原則；以「不使用化學除草劑」之有機農業，或傳統混農林種植方式為限。經部落會議同意後，可以採農業與造林輪作之計畫（註3）。</p>\n<p>協商這些條件並不是因為部落力求將林業用地合法化為農牧用地，事實上，部落協商出的條件有些更嚴格，而且如果有部落也願意接受特定區域計畫，必須依個案另外再進行評估和審查，並非一體適用。這和過去政商壓力下一再退讓，使得國土管制失守的情境完全不同，更深的歷史意涵是：和解的開始，山區治理真正的法治化。</p>\n<p>在這裡，我們看到許多年輕人回鄉成家，透過經營友善農業支撐一家人的生計，把人留在部落，也努力把環境照顧好。大漢溪─石門水庫上游的鎮西堡部落，自主的環境永續行動，遵循GAGA和當代政府體制接軌的努力，告訴我們原住民部落有能力化解發展和環境保護的矛盾，此時，很需要國家力量的支持。</p>\n<p>鎮西堡的模式並非完美的終點，和森林依存的農業尚在摸索前進中，重點在於，我們看到在地的生產和生活者，為環境保育不懈怠的努力，政府應該好好參考，通盤擬定山地農業的處理政策。</p>\n<p><h2><span>部落和社區共同參與的山林治理</span></h2></p>\n<p><span></span><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/202303061.jpg\"><span>鎮西堡的意思是「陽光升起照耀的地方」。阿道和拉哈-達利及孩子們趁著好天氣，從民宿房間拉出大棉被來曬。（圖／李根政）</span></p>\n<p>台灣的國有林面積達184萬公頃，絕大部分與原住民傳統領域重疊，1998年催生馬告（棲蘭）檜木國家公園運動，民間社會開始倡議原住民與國家公園的「共管機制」。這項倡議的認知基礎在於：百年來台灣山林開發破壞的根源，是來自日本和國民黨政權，原住民族是被剝奪權利的受害群體，他們使用自然資源的權利應予恢復；另一方面，更認知到廣大山區的保育，不可能只靠國家行使公權力，迫切需要人民參與、社區部落協力。</p>\n<p>從事森林保育運動近20年，實踐的時間愈久，愈發現單是靠國家權力守護廣大的山林，已是不可能的任務，例如盜伐檜木、狩獵的問題，如果沒有部落或社區保育力量的合作，連查輯都有困難。</p>\n<p>東華大學的環境經濟學者戴興盛教授<a href=\"https://www.natgeomedia.com/environment/article/content-5356.html\">曾為文指出</a>：</p>\n<p><blockquote><p><span>「台灣的資源治理是一個頭重腳輕、非常空虛的體系，國民無法參與決策、分享權利，但卻可以在國家管不到的山林海洋間肆意利用破壞資源。」</span></p></p>\n<p><span>「首要的第一步，是要逐步地將治理權限授權給適合的組織層級，透過授權，讓資源治理落實到政府無法、無力觸及之處。」</span></p>\n<p></blockquote></p>\n<p>國家法律應是最後和最低的保育防線，但我們不可能事事都採取極端的管制手段，自然資源的良善治理必然要從「國家管制」走向「多元協力」，讓利害關係人從保護自己權利、資源的永續利用出發，依不同的區域和個案，透過和政府協商，界定權力範疇，得到社區和部落的認同且積極參與，才能達成「有效的治理」。</p>\n<p>台灣在實踐原住民轉型正義，依法恢復原住民權利的步伐十分緩慢。猶記1999年民進黨籍總統候選人陳水扁曾在蘭嶼與原住民各族群代表簽署了<a href=\"https://zh.wikipedia.org/zh-hant/%E5%8E%9F%E4%BD%8F%E6%B0%91%E6%97%8F%E8%88%87%E8%87%BA%E7%81%A3%E6%96%B0%E6%94%BF%E5%BA%9C%E6%96%B0%E7%9A%84%E5%A4%A5%E4%BC%B4%E9%97%9C%E4%BF%82%E6%A2%9D%E7%B4%84\">《原住民族和台灣政府新的夥伴關係》</a>條約；2005年，<a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0130003\">《原住民族基本法》</a>通過，依法應與原住民建立共管機制的國家公園、國有林、國家風景區。但至今所有事務的前進卻非常有限。</p>\n<p>過去，我們對於原住民守護山林的想像，一種是國家僱用的<a href=\"https://www.twreporter.org/a/illegal-logging-forest-guardians\">巡守員</a>，一種是義工。然而，事事都期望國家的經費支持，有其侷限；沒有考慮生計的保育工作，也不可能長久。</p>\n<p>住在石門水庫下游的人們，在要求鎮西堡、新光、司馬庫斯等水源地上游的部落，要負責保護森林和水源時，是否也該想想：我們要付出什麼？</p>\n<p>關於原住民或社區參與自然資源經營管理的最大疑慮，就好比在戒嚴時代總有個說法：台灣人民的民主素養不夠，不配擁有民主。然而，民主是需要學習的，參與治理也需要學習。</p>\n<p>賦予部落和社區權力，學習管理公共資源，勢必是⼀條漫長的路，政府和民間都需要學習。而最重要的前提是資訊透明、社會參與對話，建立彼此的信任。</p>\n<p>不過，政府畢竟扮演了資源分配的角色，不管是部落、社區的培力，環境補貼政策，都需要把錢花在對的地方。最重要的是：搭構原住民傳統生態智慧與生態學的橋梁，建立山林經營管理的實務共識，以原住民部落為主體，逐步賦予經營管理山林的權力，同步改革公務體系。</p>\n<p>在氣候變遷的嚴肅挑戰之下，政府應該和最直接的利害關係方──原住民族、山居聚落，透過對話，相互理解，一起想辦法，共同協力治理。</p>\n<p>與森林共存的鎮西堡部落，正在幫助台灣社會重新定位山林政策。</p>\n<p>※ 註1：摘錄自陳玉峯，2000。〈靈山神樹—馬告山與Ka-pa-rong～以古老台灣后土的智慧，作新世紀新政府的獻禮〉。</p>\n<p>※ 註2：根據內政部2018年的調查統計，目前新光與鎮西堡兩個部落，有22個農戶取得有機認證，而取得有機認證的農場面積達32.82公頃，占全部農業使用土地面積之21.5%。據了解，這幾年，有機農戶數仍在成長，有約40個農戶取得有機認證，農場面積共約40公頃，占全部農業使用土地面積之30%。資料來源：內政部、原住民族委員會，2018年5月。《原住民族特定區域計畫──泰雅族鎮西堡及斯馬庫斯部落（草案）》 ，頁38。</p>\n<p>※ 註3：資料來源：內政部、原住民族委員會，2018年5月。《原住民族特定區域計畫──泰雅族鎮西堡及斯馬庫斯部落（草案）》 ，頁69-70。</p>\n<p>(本文內容節錄自作者著作<strong>《</strong><a href=\"https://www.cet-taiwan.org/publication/3359\">台灣山林百年紀</a><strong>》</strong>/天下雜誌出版）</p>\n<p>(本文為2023/3/3報導者投書：李根政/<a href=\"https://www.twreporter.org/a/opinion-cinsbu-a-tribe-coexists-with-forest\">友善農業如何守護山林？鎮西堡部落與森林共存的學習之路</a>)</p>"}, {"nid": 4295, "title": "【講座側記】4/18明知山有虎，偏向虎山行", "original_topic": "森林與林業政策", "adopted_cats": ["森林守護與林業改革"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230522-2.JPG\"><br>\n<p>臺灣的林業界正處於承先啟後的時代，我們遇到首次造林的輪伐期，卻在急需技術的情況下，面對著林業界長期凋零所導致的產業斷層。而林業式微也讓山林工作者消失在民眾生活中。</p></p>\n<p><p dir=\"ltr\">虎山林業創立於2022年，「明知山有虎，偏向虎山行」，這個名字正是講者的團隊想在林業凋零的臺灣，行走出自己一條路的雄壯宣示。他們在缺乏前鑑的環境下，一路摸石頭過河，沒那麼有邏輯，卻沒那麼意外，在林業實務現場打轉數年後成為新興的林業工作團隊。這場講座旨在建立民眾與林業工作者的橋樑，藉由講者分享心路歷程與林業現地工作者觀點下的林業現況。</p></p>\n<p><h2><span><strong>開始的契機</strong></span></h2></p>\n<p>回溯講者的學習歷程，成為林業現場的工作者的命運其來有自，大學就讀材料工程系，求學過程成先後參與「風中之星」團隊，進行自然建築與協力造屋的工作，後又參加「建築公社」的實習，實地協助搭建木建築。對於認知材料來龍去脈的渴望，講者是這麼說的：「不管是建築也好，生活用品也好，我都會想更了解這些產品的原物料的取得。」</p>\n<p>木構造的勞動合作社，竹苗一帶，向進口正昌製材廠進口木材，擦過1990年時的天然林禁伐政策，正昌製材廠在林務局的輔導下，於2014年成立永泰林業生產合作社，然而缺少青年人回流與現任師傅漸漸年邁，缺工危機始終沒有解決，終於在2017年時，正昌的老闆終於向建築公社請求現場作業人力資源，講者從此接觸林業現場，半年內參與了新植樹木與羅山林道的伐木集材作業。</p>\n<p>\t沒有實務經驗、沒有事前訓練，講者的林業生涯開始得跌跌撞撞，卻沒有澆熄講者的意志。</p>\n<p><h2><span><strong>一步一腳印：從嘗試到虎山林業正式成立</strong></span></h2></p>\n<p>講者朋友阿公在苗栗南庄種植一片台灣杉森林（<em>Taiwania cryptomerioides</em>），朋友們的年度聚會都會挑選在這片人工造林地裡，在2018年，一本「里山生活實踐術」引起了大家對里山生活的嘗試渴望，隨即就地取材，在阿公的林地裡嘗試起修枝、疏伐等人工林的撫育工作。</p>\n<p>\t2018年，也林務局與宜蘭大學合作，在溪頭進行的伐木集材課程。他們找到大伐木時代的老師傅，同時介紹林務局由歐洲引進的塔式集材機與其他林業內容，這次的系統性訓練增進講者對於現代化林業的運作、工作安全相關知識與林業現場注意事項有更深的了解。</p>\n<p>就這樣，已以工班形式運作多年，有了先前的經驗累積，終於在2022年成立虎山林業公司，除了繼續承攬永泰林業的現場工作，也承接其他林業作業相關案子，例如東眼山步道旁以景觀、安全為目標的疏伐。目前有5～7位工作夥伴，當中只有3位森林系夥伴。公司會進行許多內部訓練，並且邀請具備與林業實務相關的技術的各行的人員教授技術，例如攀樹師的架繩技術或是農改場職員的硬體設備保養操作。</p>\n<p>在進行林業活動的同時，也關注學校的教育傳承，例如曾到竹東國中美術班進行木工與森林的教育，以及與永泰林業合作社「森林日計畫」，將實務技能操作設計成闖關活動，在執行大鹿林道伐採案時，還帶苗栗農工森林科學生進行林業工作觀摩。</p>\n<p><h2><span><strong>臺灣林業產業面貌</strong></span></h2></p>\n<p>林業現場作業</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20220522-3.png\"></p>\n<p>虎山林業現場作業以伐採與集材為主，而綜觀伐木作業的流程，可以切分為「伐、集、造、運」四個步驟：</p>\n<p><ul></p>\n<p><li>伐採：林地經營管理的後期階段，將立木伐倒準備集材。</li></p>\n<p><li>集材：把坡面上砍伐的倒木托至平台上，依照不同斷面大小和長度進行堆放。短程托運常以挖土機作為動力來源（山區常見、二手不貴、可以克服諸多地形），安裝絞盤，連接鋼索後，便可在林地中托運木材。但若拖行距離需求長（&gt; 100公尺），且地上障礙物多，架線集材是更佳的選擇，只要能在林地中架設捲樑機、集材機作為動力來源，藉由鋼索的延伸，鋼索可及之處便是集材的範圍，然而架設時間長，沒有移動能力也是大範圍集材的代價。</li></p>\n<p><li></p>\n<p>造材：因臺灣山地地形陡峭、原地造材困難，通常會先將伐採後的木材集材後來進行造材，意即將砍伐下來的木材鋸切、修剪成特定的長度。</p>\n<p></li></p>\n<p><li></p>\n<p>運送：將造材完畢的木材運送下山。</p>\n<p></li></p>\n<p></ul></p>\n<p><h2><span><strong>國產材推廣</strong></span></h2></p>\n<p>講者認為林業的發展在社會上有一定的意義，從部落社區的生活情感聯繫，到林業合作社的商業行為的良性合作，不僅能增加林業參與者的工作機會，也能增進民眾對於木材使用的認識甚至是對環境的理解。而在社會責任的層面，近期越發重要的森林碳吸存功能，也是潛在的推廣國產材因素。</p>\n<p><h2><span><strong>林業公司的困</strong><strong>境</strong><strong>與改善的方向</strong></span></h2></p>\n<p>雖然致力於林業發展，但仍然有許多尚待克服的難題。例如：林農獲得的林地規模小、成本高，但工班的集材機具運費成本高昂、木材市場價格低、獲益間隔過長、人員培訓內容繁複；在嘗試新形態的轉型過程當中，因為由工班漸漸轉換為林業公司自行接案，還須學習行銷方法、建立社會網絡，否則無法有穩定客源及接案機會。&nbsp;<br>\n<p>講者也提及，政府及學術端者可以協助建置林業相關的資料庫、中大型機具的租借平台、林業的技術研發、機具與軟體等後勤產業鍊等。<br></p>\n<p>另外，也期待未來有更多人願意投入里山生活之實踐（林業提供人際上、生活上與經濟上的支持）、森林多元經營的腦力激盪、闊葉樹種木材之產業鍊開發與技術克服。</p></p>\n<p><h2><span><strong>會後的Q&amp;A：</strong></span></h2></p>\n<p>Q：臺灣的伐木法規有需要調整的地方嗎？<br>\n<p>A: 第一時間聯想到的話，一些行政流程需要考率比例原則，否則完成程序過程耗費的時間與人力成本會消耗掉木材生產所得之獲利。</p></p>\n<p>\tQ：在伐木過程中有遇到有人以護樹為由產生質疑嗎？<br>\n<p>A: 在虎山林業接案的林地規模沒有這麼大，頂多會在現場遇到登山客，加上虎山林業不是進行伐木決策的單位，因此遇到的抗議不會如新聞中如此龐大。</p></p>\n<p>Q：講者的學習歷程與現在決定走上林業道路的決定間，有什麼關聯嗎？<br>\n<p>A: 講者是材料工程系畢業，對木建築也有自己的興趣。至於家人部分，在大學時期時已與家人有持續的溝通與互解，並且從身為現場技術人員到能夠自己決定工作環境的過程，也能藉由合理的行動來說服家人。</p></p>\n<p>Q：從事林業最大的困難是什麼？<br>\n<p>A：工作來源的穩定性是個最大的挑戰，並且臺灣在機具上的管道疏通上尚未完全，爬梳相關資料並做出選擇事件曠日費時的事情。</p></p>\n<p>Q：不同所有權的林地的造林計畫，有沒有觀察到不同的地方？<br>\n<p>A：伐採工班之後，還會有造林工班進場進行造林，目前的施作方式仍然還是以傳統上密集勞力的方式進行，包含自行揹苗上林地與造林後的數年內也得一年除二至三次草。講者觀察現場的造林則以台灣杉為主（臺灣杉同時也是林務局推廣樹木的物種之一），而林農有時有會種植福州杉以滿足後端需求，例如古蹟修復。又或者部分林農也會種植輪伐期較短的楓香或杜英，後端可被用來製作椴木香菇的材料，這些種植闊葉樹的林地通長會在低海拔的林地。</p></p>\n<p>Q：不同所有權的林地的造林計畫，有沒有觀察到不同的地方？<br>\n<p>A：伐採工班之後，還會有造林工班進場進行造林，目前的施作方式仍然還是以傳統上密集勞力的方式進行，包含自行揹苗上林地與造林後的數年內也得一年除二至三次草。講者觀察現場的造林則以台灣杉為主（臺灣杉同時也是林務局推廣樹木的物種之一），而林農有時有會種植福州杉以滿足後端需求，例如古蹟修復。又或者部分林農也會種植輪伐期較短的楓香或杜英，後端可被用來製作椴木香菇的材料，這些種植闊葉樹的林地通長會在低海拔的林地。</p></p>\n<p>Q：除了塊狀疏伐外，有沒有其他疏伐方式，以及如何選木與避開疏伐以外的樹木？<br>\n<p>A：塊狀疏伐有一點像是小皆伐，除此之外，如大鹿林道的現場是進行行列疏伐，又或者可能會以特定原因選擇樹木進行伐除（例如：影響留存木生長、樹木本身已有損傷），這些都是講者目前有經驗過的。<br></p>\n<p>至於搬材溝、簡易型手拉吊車或其他輔助設備，如果樹木太重，可能要用鋼索、滑輪設備進行木材轉向。</p></p>\n<p>Q：對於ESG、碳權認證的期待是什麼？<br>\n<p>A：對於工作者來說可能是新的工作機會，但ESG與碳匯認證的機制與林業之間仍然有需要磨合的部分（例如行政上的細節），解決之後才能比較順利在市場上運作，但是目前還沒有因ESG和碳權認證的部分而有工作機會。</p></p>\n<p>Q：對於想投入林業工作的年輕人有何建議？以及虎山林業在林業上想要扮演怎樣的角色？<br>\n<p>A：大伐木時代後的天然林禁伐意識下，技術人員、工具、後勤產業鍊的斷層讓林業現況處於要把舊有資源重建，又有創造出自由嘗試機會的轉捩點，而小團隊也不會因既有的林業大型公司使生存空間受到擠壓。而目前虎山林業的方向，則是在公司續存的條件下朝向森林經營的目標前進，包含掌握林道開設的技術，或是引進不同樹種的嘗試。</p></p>\n<p><h2><span>附錄：鍵盤了解台灣伐採現況</span></h2></p>\n<p><ul></p>\n<p><li><a href=\"https://fprod.forest.gov.tw/fpp/\">伐採資訊公開展示地圖</a></li></p>\n<p><li><a href=\"https://www.forest.gov.tw/0003232\">林務局各林管處疏伐作業規劃表</a></li></p>\n<p><li><a href=\"https://www.forest.gov.tw/0000110\">林業統計年報</a>：可以看到各個行政區的伐採量，但是沒有辦法直接追查到伐採詳細地點。</li></p>\n<p><li><a href=\"https://www.coa.gov.tw/theme_data.php?theme=publication&amp;id=6677\">農委會的年度伐採計畫書</a>：可在網路上找到公開資訊。</li></p>\n<p><li>政府採購網：可以找到一些歷史資訊(金額與持承包廠商，甚至可以花費購買標案文件)與標售公告(可能可以找到決標後難以找到細部資訊)。</li></p>\n<p><li>現地告示牌：租地造林的林業伐採不一定會顯示在電子採購網上，必須要到林業現場時，才會看到作業公告。</li></p>\n<p></ul></p>\n<p>&nbsp;</p>\n<p><span></span><br>\n<p>&nbsp;</p></p>\n<p><h2>&nbsp;</h2></p>"}, {"nid": 4298, "title": "【講座側紀】文化、獵場與森林：認識鄒族的山林世界", "original_topic": "土地與生物保育", "adopted_cats": ["森林守護與林業改革"], "content": "<p>&nbsp;</p>\n<p></p>\n<p><p dir=\"ltr\"><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20230511-01.jpg\"></p></p>\n<p>\t講者：</p>\n<p><ul dir=\"ltr\"></p>\n<p><li>浦忠勇/《鄒族的植物世界》作者、中正大學台灣文學研究所助理教授</li></p>\n<p><li>Naa’e Tapangu方紅櫻/《鄒族的植物世界》共同作者</li></p>\n<p></ul></p>\n<p><p dir=\"ltr\">主持：呂翊齊/地球公民基金會顧問<br></p>\n<p>日期：2023年3月4日 (六)<br></p>\n<p>---------------------------------------------------</p></p>\n<p>\t主持人呂翊齊在擔任地球公民基金會研究專員時就在此領域深耕，就讀研究所期間接觸部落族人和狩獵自主管理計畫後，體認到山林知識與原住民部落生活息息相關，他表示狩獵自主管理改革用意為將在地獵場管理權交給當地原住民部落，但目前因漢人與原住民生活背景的不同導致衝突，希望藉此講座以瞭解鄒族的世界觀如何看待森林來探討這些衝突</p>\n<p><p dir=\"ltr\"></p>\n<strong>Naa’e Tapangu方紅櫻/《鄒族的植物世界》共同作者<br>\n<p>鄒人的後花園-霞山山脈</strong></p></p>\n<p>\tNaa’e Tapangu和Tibusungu’e Poiconu從小在部落生活，從童年時期開始就與山林環境有著密切的互動，荒野的成長經驗孕育了他們的植物知識和山林生活技巧。</p>\n<p>\t愛山成癡的兩人透過十幾年來的山林獵場踏查和部落田野，採集了500-600筆植物，而本書收錄了265筆，介紹鄒族日常生活與傳統文化跟植物之間的關係。</p>\n<p>\t<strong>走進山林：踏查、採集、採訪長輩、整理資料、校稿</strong></p>\n<p><p dir=\"ltr\">兩人寫稿校稿的家位於鄒族部落的Seofkonana之地（若要前往特富野通常會由此入山），除了多年來在山林獵場的踏查記錄之外，訪問部落耆老更是重要的一環，讓作者瞭解更多植物的知識和文化，然而觀察紀錄的速度卻遠遠不及他們凋零的速度。《鄒族的植物 世界》這本書裡面採訪了四、五十位老人家，目前健在的約只有三分之一的長輩。</p></p>\n<p><p dir=\"ltr\"><strong>《鄒族的植物世界》：屬於鄒族的植物書</strong></p></p>\n<p><p dir=\"ltr\">這本書分了五部，書中前四部以學術性的方式去書寫鄒族的世界觀與思維脈絡，而第五部為「植物誌」，特別的是在鄒語中同一種植物常有不同名稱，難和單一的學名對照，所以是以族語跟中文並列呈現(31:10)。十幾年來採集了500-600筆資料，而本書收錄了265筆，介紹鄒族日常生活與傳統文化跟植物之間的關係。</p></p>\n<p><p dir=\"ltr\"><strong>隨鄒人思維探尋植物-認識鄒族植物</strong></p></p>\n<p><p dir=\"ltr\">鄒族的植物名有些有趣的命名，例如mateof’uf’u （倒地蜈蚣），直翻有喜歡偷看的意思，因其具向陽性，花往上生長時，老人家會說這種花像在偷看別人的胯下，所以在鄒族裡mateof’uf’u被稱作喜歡偷窺的花；有些則是和鄒族神話相關，例如cxmx-no-boki （台灣小蘗）。</p></p>\n<p>\t而跟儀式有關係的，例如ton’u（小米）為主食作物，所以鄒族有豐厚的小米文化，像是播種祭、除草祭、收穫祭等一整年下來都有和ton’u 有關的儀式；或是巫師舉行儀式時常會看到voyx（藜實），作為巫師施法的媒介。</p>\n<p>\t有一些作物在鄒族很具代表性，像是pcoknx （麻竹）是最早進入鄒族的經濟作物，在當時可以換成貨幣；pcxx（臺灣欒樹）則會看期其花的顏色來判斷時節，是大地時鐘的概念，跟小米文化也非常有關係。</p>\n<p>\t獵場植物最大宗為殼斗科植物，例如seoscu（鬼櫟）是人可以吃的，烤過後很像板栗。<br>\n<p>niumo/zumo （冷青草）是水鹿的食物，因此獵人可以從草的數量狀態瞭解水鹿的數量和蹤跡，是標的性植物。<br></p>\n<p>&nbsp;</p></p>\n<p><p dir=\"ltr\"><strong>Tibusungu’e Poiconu浦忠勇/《鄒族的植物世界》作者、中正大學台灣文學研究所助理教授</strong></p></p>\n<p><p dir=\"ltr\"><strong>鄒族民族動物學</strong></p></p>\n<p><p dir=\"ltr\">浦忠勇以期刊<a href=\"https://ihc.cip.gov.tw/EJournal/EJournalCat/631\">鄒族狩獵動物學芻議</a>簡述民族動物學的例子，分享鄒族在狩獵文化脈絡下的動物知識與慣習。對鄒族來說動物知識不單只是一般動物學而是民族科學；而獵物的分配則呈現社會關係，從分配可以看出彼此親屬關係、生命的概念與習俗。</p></p>\n<p>\t例如山豬在鄒語中有很多文化語彙，從形態、行為、哪種山豬可獵捕還有依照獵捕的山豬類型評價是否為勇士，浦忠勇舉例kualeila 指有殘缺的山豬，當獵人獵到這種山豬的時候代表土地認為其不擅於狩獵。</p>\n<p>\t還有解剖分配的規範、棲息環境的命名、獠牙飾品、動物的靈性與土地儀式的另類視角，都可以看出鄒族光是對於山豬就有很多不同的面向。鄒族對於動物本身不只是科學研究，而是包含很多山林知識、社會文化的規範，浦忠勇也舉例了可食/不可食的動物，例如鄒人嗜吃有點腐壞的山羊肉、禁獵熊、禁食大冠鷲等等。</p>\n<p><p dir=\"ltr\">狩獵對鄒人來說並不是私人活動，而是受到族群文化規範的，像是不販賣獵物，有多就是分享，符合einu的概念。</p></p>\n<p>\teinu為鄒族的山林知識、獵場文化規範，涵蓋了在地知識、山林規範、集體共享、萬物連結的概念，類似泰雅族gaga的概念，核心為尊敬人、動植物、土地、神靈。</p>\n<p>\t談論狩獵文化的價值，需要跳到跟土地本體深層連結的概念。獵人對於獵場各個區域的命名、熟悉動物的生態、山脈的輪廓和地形特徵，都應證了他狩獵的行為可以培養山林豐富的知識。鄒族有一句話是說：獵場是男人的身體。你對於山林認知和河川的認識，會決定你如何狩獵，這背後也代表著對於地形的認識、需要熟悉動植物的種類與習性、狩獵的技能還有最重要的人際協商，並非隨處皆可放陷阱而是要以其他族群的界線、狩獵季節等來評估。<br>\n<p>&nbsp;</p></p>\n<p><p dir=\"ltr\"><strong>追尋價值平衡-傳統文化與現代管理</strong></p></p>\n<p><p dir=\"ltr\">傳統可以做為一個方法，可是不可能永遠停於傳統，以狩獵文化來說。作者以站在十字路口來形容在「釋字第803號：原住民狩獵案」後原住民族的處境，在從事狩獵文化的權力與環境生態保育的重要價值之中需要取得平衡。</p></p>\n<p>\t狩獵辦法至今仍有眾多爭議，不論是社會大眾、環保團體、動保團體或是原住民。</p>\n<p>\t作者在107年成立了嘉義縣鄒族獵人協會，為了傳承狩獵einu的價值，但傳統獵人是不搞這套的，它其實並不符合家族獵團的模式。這之中有訂定狩獵的自治自律公約，也希望可以持續與政府協商，共同守護這片森林的方式。以前，林務局跟獵人是完全對立的，但在104年，我們協會與嘉義縣政府、嘉義林管處簽定三方合作意向書。</p>\n<p>\t作者表示他們其實更想藉由獵場故事更走進文化中，慢慢地去找回文化語彙，例如hupa（獵場生態）包含著氏族分配、土地管理運用、傳統領域等等的面向，這些所涉及的是更深層的意識。協會在去年也帶著部落的青年、孩子踏查8條古道，一同繪製了八條傳統獵場的地圖，這樣的地圖希望有機會可以去作套疊，期待有更多的作用。</p>\n<p>\t作者期許傳統與現代可以有更多對話，找出均衡的方式，一起守護山林。</p>\n<p><h3 dir=\"ltr\">Q&amp;A</h3></p>\n<p><p dir=\"ltr\"><strong>Q1&nbsp; 從小在山林學習的能力？</strong></p></p>\n<p><p dir=\"ltr\"><strong>A1 方紅櫻老師</strong>：剛剛講述到躲避比較像是對於環境上的警覺，比如說蛇類、落石、洪水等等的敏感度，對於生活的熟悉度要足夠，才可以立即性去做判斷。</p></p>\n<p><p dir=\"ltr\">主持人：上山其實是很危險，除了剛剛方老師提到自然環境上的危險又或是一種無形文化的力量，比如說truku的獵人會跟我說，出發前不能跟老婆吵架，在他們的gaya裡，這樣可能會獵不到或是出事，其實比起實質危險，更多是有關人靈之間的拉扯與規範。<br></p>\n<p>&nbsp;</p></p>\n<p><p dir=\"ltr\"><strong>Q2&nbsp; 甚麼事現代獵人在面對現今環境保育價值下會遇到最大的難題？</strong></p></p>\n<p><p dir=\"ltr\"><strong>A2 浦忠勇老師</strong>：如果真正的了解傳統文化狩獵以及現今保育的核心價值，這兩者是互相重疊的、共存的。而我們常常遇到狩獵文化與環境保育彼此拉扯，可能是理解上會互相質疑，還有在過去確實有獵物販賣的商業情形，也認同過度狩獵會造成的生態浩劫。我們在過去一段時間都沒看到水鹿和山羌，在山產店卻可以點到這些食物，制度不完整所造成狩獵汙名。原住民的狩獵是有輪獵的習慣，去維持各物種的平衡，還有很多不同的禁忌，代表要小心和敬山，和環保目標是一致的希望環境永續，我們其實是一起在保護山林的人。<br></p>\n<p>&nbsp;</p></p>\n<p><p dir=\"ltr\"><strong>Q3&nbsp; 為甚麼對文化越了解的獵人越能接受現代管理？</strong></p></p>\n<p><p dir=\"ltr\"><strong>A3 浦忠勇老師：</strong>越是重視在地知識，對於自己土地山林會有很清楚的認知的人，面對到einu套入到現今環保概念的制度下，它們幾乎是可以連結的。像是回報系統，就是要以科學數據去了解現今動物生態，這樣去解讀的話，其實跟我們的核心價值是一樣的，屏科大那邊有一位溫教授在研究當中也指出這幾年山羌快速成長，這跟我們原住民所觀察到的結果是一樣的，但數據上山豬數量有下滑的趨勢，我們的獵人是靠對於環境的熟悉和認識，發現取樣的位置不合適才有數量減少的情況。我覺得當你對於這些山林知識、狩獵文化不夠理解，對於現今政策才會有所退縮，而當你擁有那些知識的時候，才有機會跟林務局去談要如何訂定公約。像是不去獵保育類動物，好比說黑熊，鄒族本身是不獵黑熊的，因為在我們的傳統中代黑熊回家會有厄運，但萬一誤捕的時候又有甚麼SOP。擁有對文化的認知，你才可以有足夠的立足點去進行對話，彼此連結。<br></p>\n<p>&nbsp;</p></p>\n<p><p dir=\"ltr\"><strong>Q4&nbsp; 日本學者很早就發現鄒族有自己的信仰，在狩獵和環境可以取得平衡是有很大的自律精神，想要詢問這種精神層面有甚麼機制去提升？</strong></p></p>\n<p><p dir=\"ltr\"><strong>A4 浦忠勇老師</strong>：國際兩公約提到，你要讓原住民土地、河川、山林有精神聯繫，才會敬重自己的土地與獵物，在靈性的層次。我們鄒族會在小米祭之後，做一個土地儀式，是用來感恩神靈對於土地的照顧。再來就是在部落內部會一直強調有些地方不能狩獵，山羊的會所在那個地方槍要收起來，喝水要用削刀，是怕布農族下毒，鄒族還有很多有關靈性的故事。現代雖然已經有新的宗教信仰，但共同的還是尊重山林，與自己是有所連結的。</p></p>\n<p><p dir=\"ltr\"><strong>主持人&nbsp;：</strong>今天你沒有辦法理解他們對於土地、靈、人、自然之間的連結的話，很難了解他們的行為，很多時候環保團體會很講求數據，但多數的時候我們自己本身也有自己的宗教信仰，但在看待原住民其宗教文化時，卻認為是傳統的。我覺得多數的時候是出於自身文化差異，而產生出的不理解與不信任。有機會可以到部落一起烤烤火，聽聽他們的故事，我們才有機會從自己的世界觀走向不同族群的文化脈絡底下。</p></p>\n<p>\t<strong>【活動詳情】</strong></p>\n<p><ul dir=\"ltr\"></p>\n<p><li><a href=\"https://www.cet-taiwan.org/events/4242\">3/4 文化、獵場與森林：認識鄒族的山林世界</a></li></p>\n<p></ul></p>"}, {"nid": 4340, "title": "【講座側記】5/18千年神木為何倒下？", "original_topic": "森林與林業政策", "adopted_cats": ["森林守護與林業改革"], "content": "<p><span>前言</span></p>\n<p>2023年森之旅的第三場，從生態環境的保護與倡議，到社會與森林的互動關係探討。此次由兩位記者分享挖掘盜伐現象過程中的理解與認識，跳脫把山老鼠視為窮兇極惡的壞人，而從社會角色與經濟產業鍊等多角度視角，來頗析盜伐的來龍去脈。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230518-1.jpg\"></p>\n<p>&nbsp;</p>\n<p><span>天然林禁伐後，為何還有盜伐木？</span></p>\n<p><span></span>1991年禁伐天然林後，山林利用的歷史正式中斷，轉而注重生態保育價值導向，然而，2022年監察院報告，近10年內近3000件、5000人涉案，代表在主流價值之下，臺灣本島木材的需求仍未消失，反而形成地下化，扭曲的市場。</p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/0518-8.jpg\"><br>\n<p><span>盜伐案件量自2011陸客來台，從阿里山離開後到嘉義購買聚寶盆，而後馬上縮減。2012 案件量多，查緝盜伐量卻很低；2015 森林法修法後，刑責加重。（圖/張子午）</span></p></p>\n<p><span></span></p>\n<p><span>山老鼠是怎樣的人？</span></p>\n<p>泰雅族於同一部落中，各家族為了生存，彼此之間仍有競合，司馬庫斯也不例外。若干年前司馬庫斯開始轉型成共營制度時，原本在竹東發展的某一家族欲回歸部落，卻錯失最佳時機，無法等價共享部落共營的益處，導致部落內部有不一致的發展脈絡，回歸的家族於是為了生活，加上離鄉生活染上漢人酗酒毒癮的陋習而開始盜伐，在2012年發生南山神木盜伐案(註 1），隨後2012至2020年陸陸續續又有盜伐木的產生。</p>\n<p>這些盜木者沒有以暴利換得奢華，他們反而都是虔誠的教徒、顧家的父親與為後輩著想的長輩，每個人都有自己的平凡甚至困苦的生活，盜伐之前也有複雜的抉擇。</p>\n<p>無獨有偶，2020年，宜蘭地檢署破獲的大型盜伐案件(註2），在禁伐政策實行、外來模組化家具壓迫本土加劇產業以及陸客來台後檜木需求大增的推力與拉力下乘著盜伐潮進行盜伐。然而，盜伐集團的首領同時是個照顧北藝大學生、熱愛木材的木雕工廠老闆兼師傅，在關渡附近有著不慎整齊的工作室，生活環境也不像是擁有暴利後的豪華。</p>\n<p>隨著勞動力短缺的現象漸增，外籍移工成為山區裡熟悉的新族群，貧窮加上台塑集團在越南中部造成環境污染導致的失業潮，讓越南中部的廣平省、何靜省與乂安省成為台灣外籍移工的主要來源，也讓移工在山上失聯也漸漸頻繁，他們成為盜伐者的比例日漸增高，甚至從盜伐勞工轉為統領，比原住民更不要命，甚至武器還比獵槍先進，除了盜伐之外甚至引發安全問題。然而原住民也深感無奈，他們知道，一旦沒有移工，山上的產業便難以運作。</p>\n<p>由於檯面下市場上有小群體收藏貴重木相關產品、藝術品，盜木者有了下游的管道，他們喜歡香氣濃郁近似檀香的扁柏，又不易腐朽，一躍最貴的盜伐樹種；又或者具有抗癌效果的牛樟，其樹瘤或牛樟芝也有很高的價格。</p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230518-3.jpg\"></p>\n<p><span>山老鼠之外的人：巡山員、林務局、中盤商與里山賽夏合作社</span></p>\n<p><span></span>巡山員除了巡護盜伐外，還需協助救火隊、山難救助、甚至要因居民侵佔國有地而與民代角力。巡山員除了巡護盜伐外，還需協助救火隊、山難救助、甚至要因居民侵佔國有地而與民代角力。在典範轉移（註3）之後，面對新住民的強勁武器，巡山員只有辣椒水可以應對，面對不怕死的新住民（大不了被遣返），並且他們口風緊，就算抓到也難以追查盜伐鏈始末。<span></span></p>\n<p>林務局雖有保管贓木，然而幾乎只進不出，貯藏空間以然見底，甚至會被盜走。重啟一級貴重目標售，又有可能淪為合法木材掩護非法贓木的途徑。</p>\n<p>但對於木材標售而言，中盤商早已精通法律漏洞，不僅知道釘鐵釘的木材會被認為是合法認證的木材，甚至熟稔標售期程與林管處，可控制市場價格與數量，加上買家不在意木材來源，讓林務局關注了10年，看到中盤商開台直播也仍無力可施（也會做公益）。雖有落日條款的殺手鐧，施行上也仍再需多方考量。</p>\n<p>位於苗栗南庄賽夏族合作社，成立前雖距老街10分鐘車程，卻沒因此獲益，部落居民多從事勞工階級。周遭森林常見的牛樟對他們而言如萬精油般是家常用藥，甚至作為柴燒。在漢人挖掘牛樟樹瘤與牛樟芝的經濟價值後，成了過度利用的開端，只要販售50公斤的木材就能20000元。<br>\n<p>合作社成立後，生活型態有所轉變，在理事長根誌優的帶領下嘗試林下經濟，並且開始合法砍伐台灣杉，不需再被判刑，甚至自己組織巡守隊，守護部落相信的「守護土地的樹」。&nbsp;</p></p>\n<p><span></span></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230518-2.jpg\"></p>\n<p><span>QA 提問：</span></p>\n<p>Q:為何想做到伐專題？<br>\n<p>A:報導者是議題導向的獨立媒體，想把檯面上的公眾議題深挖進去內部的結構。加上盜伐事件在新聞上常常出現，論述卻都很相似， 因此很好奇背後更龐大的結構，因而開始製作專題。</p></p>\n<p>Q:為何今年又多了三篇？<br>\n<p>A:去年在撰寫時已經感到議題龐大，希望可以回到產業源頭，回溯現地狀況與困境，挖掘潛在且更好的可行方式。而外籍移工專欄則因為採訪困難，資料收集上需要更多心力與時間。</p></p>\n<p>Q:漢人在盜伐鏈裡的輪廓？<br>\n<p>A: 漢人部分通常都有毒品前科。誘因部分，經濟特性上為隨砍隨發薪的快錢模式，工作條件上僅需體能強健（安非他命有始中樞神經興奮地作用，剛好符合需求）。並且由於盜伐鏈網絡系統明確，勞動管道容易附著，因而常常會有慣犯。不過相較於槍枝與毒品，盜伐木在產業上並不是主要業務。<br></p>\n<p>A: 歷史判決書中，1157人中 95%被告為台灣人，原住民只佔10%，論人數主要仍是漢人，但論比例上則仍是原住民居多。</p></p>\n<p>Q:國家再盜伐鏈的角色是什麼？講者對於「以法打擊盜伐行為迫使他們的生活進行轉型」解法在公平性上的觀點是什麼？<br>\n<p>A: 台灣社會的生活重心都在非森林的地區上，其他已開發國家在同一時間卻會將林業發展納入社會運作體系中。台灣目前的木材皆由外國進口，如何處理台灣林業斷層，開啟新格局是個重要的議題，也對於促進永續生活是有幫助的。<br></p>\n<p>A: 森林的想像除了林業在器物上的產出，也會影響社會的互動結構， 促進台灣林業的進展或許可以促進盜伐木的下降，也可能讓山區居民的經濟不會受到太多壓迫。而在民眾對於伐木的反對議事上，或許也可以試著調整到光譜上更中立的位置。 砍伐規劃上，則可以依據吸碳需求與伐木週期上選擇適合的林地。</p></p>\n<p>Q:破案率高嗎（是不是每次看到盜伐木都可以被抓到）？<br>\n<p>A:根據新竹林管處回覆，每抓2件，可能背後有10件抓不到。中盤定罪率不高，比較常抓到的是車手。至於現行犯逮捕上，盜伐案件上有太多相關平行單位，難以合作。實務上，當地派出所反而可以扮演很重要的角色，若保七能與之有順暢的合作，會有更好的效率。目前有在推動檢警林移的聯繫平台。</p></p>\n<p>Q:聽到這些不同立場的人物，道德上會不會有所遲疑？<br>\n<p>A: 對現象抱持相對主義，但無論如何，都希望藉由報導來傳達不同的聲音。<br></p>\n<p>A: 知道自己無法完全站在對方的立場思考，但希望可以呈現出每一個選擇的複雜性（明知犯法，為何還做），以期啟發其他人。去理解它們，但要隨時抽離。</p></p>\n<p>Q:砍活樹的多嗎？還是砍殘材？<br>\n<p>A: 2021年統計，砍殘材佔比61%，效益比較高，但伐木時期剩下的樹頭已剩不多，近年慢慢往高處的原始林尋找，尤其南投信義鄉比較活躍。<br></p>\n<p>&nbsp;</p></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230518-5.jpg\"></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230518-6.jpg\"></p>\n<p>註1：<a href=\"https://www.twreporter.org/a/illegal-logging-aboriginal-mountain-rats\"><strong>南山神木案</strong></a>&nbsp;相關報導 〈一個原住民家庭的生命故事：盜伐之路，能否停止循環？〉</p>\n<p>註2：<a href=\"https://www.twreporter.org/a/illegal-logging-industry-chain\"><strong>宜蘭地檢署大型盜伐案</strong></a>&nbsp;相關報導〈從牛樟木到肖楠、扁柏，揭開國產珍貴木材的神祕地下市場〉</p>\n<p>註3：<strong><a href=\"https://www.twreporter.org/a/illegal-logging-vietnamese-migrant-workers-xinyi-township\">盜伐典範轉移</a> </strong>相關報導 〈藏在部落邊緣的工寮──越南移工盜伐產業鏈，對檢警和原民生態的挑戰〉</p>"}, {"nid": 4366, "title": "鎮西堡部落教我們的事", "original_topic": "森林與林業政策;土地與生物保育", "adopted_cats": ["其他", "森林守護與林業改革"], "content": "<p></p>\n<p><h2 dir=\"ltr\"><span>前言：直奔鎮西堡</span></h2></p>\n<p><p dir=\"ltr\">與森林共存的人如何生活？這是2023年地球公民舉辦森之旅系列講座的主題。這系列的講座旨在讓大眾認識這群為數不多、但與森林相互羈絆的人們。他們對森林獨特的理解為我們帶來啟發。依循這個主題，我們也親自拜訪了位於新竹，座落於原始檜木森林裡的鎮西堡部落。</p></p>\n<p>\t20多年前，在一場催生與原住民共管的馬告檜木國家公園運動中，本會董事長李根政便與鎮西堡部落的阿道長老與阿棟牧師結識。今年4月，地球公民在李根政的帶領下重訪鎮西堡，由阿道長老引領大家走過維繫部落經濟發展與文化傳承的土地。其中蘊含來自傳統文化的深遠智慧，也呼應當代我們嘗試想像多元生活方式的可能性。<br>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230920-2.jpg\"><span>入夜之後，山裡的氣溫偏低。我們圍坐在阿道長老的烤火房，一面生火，一面就著火源聽故事：阿棟牧師將部落遷徙的歷史、近年他致力於傳統文化的推廣工作，向我們一一道來。（圖/地球公民基金會）</span></p></p>\n<p><p dir=\"ltr\"></p></p>\n<p><h2 dir=\"ltr\"><span>陽光抵達之處，也有年輕的身影</span></h2></p>\n<p><p dir=\"ltr\"><span></span></p></p>\n<p><p dir=\"ltr\">「有一首歌在唱說：『年輕人啊，不要忘記回家的路。』但當他們有心要回家，要讓他們做什麼？」阿道長老說。</p></p>\n<p>\t這反映出城鄉經濟發展落差的現象：有意願返鄉、傳承文化的部落青年難以維持生計。這也是大多數原鄉部落的困境。</p>\n<p>\t然而，因為鎮西堡始終遵循Gaga的指示，為部落開創不同的可能性。<br>\n<p>所謂Gaga，意指祖訓傳承的社會規範。以血緣、共約、共祭、共勞為基礎，深植泰雅族人的生命與社會，是行為道德最具公信力的判準。鎮西堡依此規範，對其土地使用有一套嚴謹的公約。從二十年前就開始推動有機農業，近年更積極與主婦聯盟消費合作社等銷售通路合作，成為有機農業發展重鎮。</p></p>\n<p>\t也許正因為有機農業作為鎮西堡產業發展的主力，部落的年輕人有土地、得以靠耕作維持基本生計。阿道長老一面看著在一旁玩耍的孫子，一面告訴我們，部落的年輕人返鄉比例高達八成：「這邊國小的人數是正成長的，我們部落這邊生育率高，比較不用擔心像很多山上的學校要裁校或是併校。」大部份時候表情嚴肅的阿道長老，在提及這個話題時，臉上線條柔和許多。</p>\n<p>\t鎮西堡（Cinsbu），泰雅語的意思是「清晨第一道曙光照射的獵場」。陽光抵達的部落，是年輕人們可以歸返的所在。這是我們從鎮西堡學到的第一件事情。</p>\n<p><p dir=\"ltr\"><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230920-3.jpg\"><span>鎮西堡部落的有機高麗菜田。與一般農地不同之處在於：族人在農地周圍的邊坡與田埂上大量植樹。這麼做一方面能夠提供農地遮蔭的環境，同時也能夠豐富有機農作週邊的生態系統。<span>（圖/地球公民基金會）</span></span></p></p>\n<p><p dir=\"ltr\"><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230920-5.jpeg\"><span>近年部落嘗試栽種有機獼猴桃。阿道長老向我們解釋：當果實幼小、結果密度過高時，須以人為方式，將一部份的果實摘除，才能提升剩下的果實品質。參訪當天，我們品嘗阿道長老剛從樹上疏下，尚未成熟的獼猴桃──果肉意外的清脆，帶著奇異果香氣。<span>（圖/地球公民基金會）</span></span></p></p>\n<p><p dir=\"ltr\"><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230920-6.jpg\"><span>拜訪鎮西堡的時間是四月底五月初，彼時路邊隨處可見結石纍纍的櫻桃與桑葚。長老將一把桑葚放入自製的竹筒「果汁機」裡搗碎，就變成小朋友最喜歡的桑葚果汁。<span>（圖/地球公民基金會）</span></span></p></p>\n<p><p dir=\"ltr\"></p></p>\n<p><h2 dir=\"ltr\"><span>二十年一刻：種樹、五色鳥、檜木林</span></h2></p>\n<p><p dir=\"ltr\">阿道長老與少數族人們從二十多年前，開始推動五色鳥的棲地保育。並與愛樹人士合作，在部落聯外道路及部落內的產業道路種下楓香、在田邊種下通草。近期也在邊坡開始種下金毛杜鵑。起初，許多族人擔心生計受影響，不能認同五色鳥保育以及種樹造林能為部落帶來的幫助。</p></p>\n<p>\t直到近年，成功復育的五色鳥在通草上覓食、冠羽畫眉在枝頭跳耀、金毛杜鵑成為吸引蜂類與蝶類的蜜源植物。多樣化的植物環境吸引各式各樣野鳥與蜂蝶，出沒在鎮西堡部落的田間與森林，飽滿了週遭環境生態。以及當楓香的葉片隨季節轉黃，大批觀賞遊客來到部落，族人們才逐漸意識到保護生態環境能夠帶動觀光產業、為部落帶來額外的經濟收益，在田間種樹有利於打造有機作物的良好的生長環境，對有機農業的發展也有正向的助益。<br>\n<p>這個過程，經歷了二十年。</p></p>\n<p>\t文化與生態的經營，都需要持續的累積和耐心等待才能茁壯。如同守護著部落的檜木群；當我們走在鎮西堡的檜木群步道上，抬頭仰望巨木，了解它們的來歷。一棵棵聳入天際的紅檜，始於地質脆弱不穩定的崩塌地，從一顆種籽開始，為了滿足苗木對光的渴望，歷經上百年甚至千年的漫長歲月，努力朝著天空生長，才造就這片雄偉壯麗的風景。</p>\n<p>\t時間不應只是等於金錢和效率，時間應當用來醞釀奇蹟。這是我們從鎮西堡部落學到的第二件事情。</p>\n<p><p dir=\"ltr\"><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230920-7.jpg\"><span>阿道長老與自己之前寫下的「禁獵五色鳥」標語合影。當初激烈質疑此一舉措的族人，後來因為賞鳥觀光客的進駐而改變想法，轉而加入保育五色鳥的行列。<span>（圖/地球公民基金會）</span></span></p></p>\n<p><p dir=\"ltr\"><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230920-1.jpg\"><span>鎮西堡巨木群步道的紅檜。<span>（圖/地球公民基金會）</span></span></p></p>\n<p><h2 dir=\"ltr\"><span>原住民把財富存在土地裡</span></h2></p>\n<p>「不要再說原住民不會存錢了，原住民有豐富的存款概念，而這個存款是回到自然生活、回到傳統文化和土地的存款。」</p>\n<p>族人會在中海拔以上的地區挖掘地窖，提前把一年份的地瓜存進地窖裡。他們也會把一年份的小米和豆科類存放在穀倉——阿道長老說，這是泰雅族的儲糧文化。同樣的，只要能夠好好的管理自然資源、永續維繫土地及水域的生態，就能夠把漁獲儲存在河濱裡、把肉類儲存在森林裡，不浪費或者過度使用，當有需要的時候，就有豐盛足以供應生活所需的資源。</p>\n<p>\t將財富存進土地，而不是存摺裡。這是鎮西堡教我們的第三件事情。<br>\n<p>這趟鎮西堡之行，我們看見部落裡的人如何與森林共存、也看見了另一種生活的可能性。</p></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20230920-9.jpg\"><span>阿道長老：『猜猜這個地洞是用來裝什麼的？』<span>（圖/地球公民基金會）</span></span></p>\n<p></p>\n<p></p>"}, {"nid": 4398, "title": "12/9 【講座側記】你爬的山是誰的山？《走進布農的山》", "original_topic": "土地與生物保育;國土治理", "adopted_cats": ["森林守護與林業改革"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20231121-1_0.jpg\">在進入山林裡之前你對山的想像是什麼？可能是由險峻地形塑造的壯麗風景；可能寂靜幽暗得令人害怕；可能富含各種稀罕類別的植物群和動物群…關於山，問一百個人也許會得到超過一百種不同的想像。那麼山的真實樣貌到底為何？曾在山裡進行黑熊保育研究工作的郭熊，將在山林裡十幾年間累積的工作經驗寫入《走進布農的山》，要在這場講座中要為各位還原山林中的真實畫面。另外，他也將分享在經歷過與原住民朋友一同在山裡工作，藉由他們認識每一座山，認識他們，並親眼看到他們處於山中的態度之後的反思。山對於大家是什麼？與山對於原住民們是什麼？答案已不是藉由想像就能回答的。現在就由郭熊帶領大家以一個更完整的視角來探討這些問題吧。</p>\n<p><h2>開啟與自然的連結</h2></p>\n<p>從小學就開始對山充滿好奇想進入登山領域的郭熊，由於家人並未支持的緣故，他轉而爬進書本裡的高山，滿足他對於山的好奇。從書裡他感受到山的靜謐，又因它的遙不可及，和充滿未知，使他覺得山始終有一種神秘感及神性。直到讀到美秀老師的《尋熊記》，裡頭提到進入大分山看似冒險的過程，讓郭熊對山有更具體的畫面，並保有對山的熱誠。接著加入美秀老師的黑熊保育研究團隊，進而真正走入山林。</p>\n<p>在山裡做研究是孤獨的。但人卻可以在這孤獨中獲得最深層的快樂。他提到一位熱愛野外調查的博物學家—喬治˙夏勒，他曾說過：「耐心觀察動物是一種樂趣。......自然歷史的課程是保護工作的基礎。」這也是即使喬治現已高齡八十，仍甘願在嚴苛的荒野中，觀察某種急需保育的羚羊的動力來源。也是郭熊在山裡進行黑熊保育工作的發現。</p>\n<p>如果你願意留心，山林裡有許多線索是能讓人拼湊出不曾見過的動物們，生活的樣態。郭熊能就樹枝被攀折的狀況、剩餘的樹冠層果實、樹下的排遺及土地上的足跡，描繪出黑熊攀爬到樹上大快朵頤的過程，以及在黑熊走後，山豬、山羌和水鹿會為了黑熊遺留的「點心」而陸續出現。這些是他在山中觀察周圍生態多年後培養來的一種能力，也是從協助他進行調查工作的原住民朋友們身上習得的。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20231121-2_0.jpg\"></p>\n<p><h2>學習山的語言</h2></p>\n<p>起初要尋找黑熊的路徑是困難的，團隊僅能靠登山客給予的零碎資訊，一步一步將路徑整理出來。在這段期間，原住民嚮導們提供的資訊成為關鍵的線索，讓團隊們能更近一步接近黑熊。可靠的消息其實是源自於他們自小在部落傳統領域中成長的記憶。他們熟悉的不是只有黑熊，而是這裡的生態，甚至是整座山林。</p>\n<p>在與原住民朋友們合作的這段歷程中，郭熊漸漸發現，在山中的他們所做的與他所知的相差甚遠，例如要獵捕動物，首先須具備敏銳的觀察力，若要知道動物會往哪裡去，就要觀察哪裡的植物已開始落果；還有崩塌的路面，可能會影響動物覓食的路線，所以要即時清理。有些知識甚至是城市人一時很難接受的，他提到某位老獵人曾分享過往狩獵的經驗，他們會為獵黑熊而製作羌笛，而羌笛吹出來的聲音是模仿山羌瀕臨死亡的哀鳴聲，當黑熊聽到這種聲音，就會循著聲音現身獵取山羌，然後正中獵人的計畫，獵人因此獵補黑熊成功。但郭熊一開始並不買單獵人的說法，因為就他所知山羌的叫聲並非如此。直到後來他真正聽到山羌受傷的叫聲時，他才明白原來老獵人說的是真實的。原來原住民族對山林的了解並非是我們能理解的。</p>\n<p><h2>山是曾經的家</h2></p>\n<p>回想當時為了尋找黑熊所做的各種科學方式的探勘，但對山林有更深一層熟悉的原住民嚮導卻是在一旁，靜靜的找塊平坦的石頭，將之擺放平整並擺上餅乾和香菸，嘴中念念有詞的請山上的老人家（祖靈）幫忙完成任務。雖說順利完成任務的因素有很多，但原住民嚮導或獵人或由各方協助研究計畫的原住民朋友們，在山中面對問題所展現的態度及行為，都讓郭熊對其產生興趣。到底原住民朋友們是如何看待山的？</p>\n<p>在山裡工作結束後，這一群人會一個接一個傳遞酒杯，開始輪流提問或分享自身在山中的故事。在輪杯的場景中他了解到原住民年輕人的祖先來自哪一座山的哪一個部落；某一個部落的遷移歷史；一些部落的名稱、山的名稱的由來…當這些流傳的歷史故事，與眼前的布農族家屋結合時，好像就更能理解他們在山裡的行為及態度。這些安靜的建築物，像是在提醒著，這座山林曾經是有人存在的；這裡曾經是某個部族祖先世代傳承的家園。</p>\n<p><h2>像山一樣存在</h2></p>\n<p>在了解原住民族與山互動的方式後，也許可以再次引用博物學家喬治˙夏勒的話：「自然歷史的課程是保護工作的基礎。」過去原住民族的家園在山中歷經世代的傳承，山中的一切成為家園不可或缺的部分。在這過程中，他們自身也成為山林的一部分。在這樣的關係裡，人怎麼不會愛護山林，保護自然呢？</p>\n<p>因此在環境保育的議題上，郭熊建議可以直接走入山林，投入自然的懷抱中，從中傾聽原住民朋友的經驗，藉此體驗大自然，瞭解人也是大自然的一部分。唯有此人才會喜愛自然，進而保護我們週遭的自然生態環境。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/P1350702.JPG\"></p>"}, {"nid": 4404, "title": "5/27【講座側記】歡迎來到鎮西堡-部落與森林共存的學習之路", "original_topic": "森林與林業政策;自然復育", "adopted_cats": ["森林守護與林業改革"], "content": "<p>p{</p>\n<p>margin: 0px 0px 2rem;</p>\n<p>font-size:1.125rem;</p>\n<p>line-height: 1.8;</p>\n<p>}</p>\n<p>ul{</p>\n<p>/*\t\t\tmargin: 0px 0px 0rem;*/</p>\n<p>font-size:1.125rem;</p>\n<p>line-height: 1.8;</p>\n<p>}</p>\n<p>/*這篇is for h2的span*/</p>\n<p>/*\t\t.node .field-name-body span{</p>\n<p>margin: 0px 0px 2rem;</p>\n<p>font-size:1.125rem;</p>\n<p>line-height: 1.8;</p>\n<p>}</p>\n<p>h2 span{</p>\n<p>font-size: 1.5rem;</p>\n<p>margin: 0px 0px 0.625rem;</p>\n<p>}*/</p>\n<p>h2{</p>\n<p>font-size: 1.5rem;</p>\n<p>margin: 0px 0px 0.625rem;</p>\n<p>}</p>\n<p>h3{</p>\n<p>font-size: 1.3125rem;</p>\n<p>margin: 0px 0px 0.625rem;</p>\n<p>}</p>\n<p>/*寫span不會改到*/</p>\n<p><h2><span>歡迎來到鎮西堡-部落與森林共存的學習之路</span></h2></p>\n<p><p dir=\"ltr\">鎮西堡(Cinsbu)位於新竹縣尖石鄉後山，在泰雅族語中是指第一道曙光最早照到的地方，這裡終年日照充足，擁有全台最大的檜木原始林，是泰雅族人賴以為生的土地。 但是當資本主義與開發行為橫行，鎮西堡的居民如何在傳統文化、生態保育與民生生計之間取得平衡？</p></p>\n<p><p dir=\"ltr\"><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20231123-4.jpeg\"></p></p>\n<p><h2><span>抵抗財團進駐以捍衛部落主權</span></h2></p>\n<p><p dir=\"ltr\">阿道．優帕司 (Ataw Yupas)是鎮西堡部落長老，從小跟著父親認識這片土地，也選擇留下來守護鎮西堡。「土地是我們的生命！」他語氣堅定地說道。土地生產的作物可以提供我們溫飽、發展與延續部落文化，也促使年輕人留下來，並且將這些美好保留給子孫。當阿道長老看到族人為了獲得資金而賣掉土地，他心痛無比，因為他深切明白：一旦賣掉土地後絕對要不回來。他們沒辦法抵抗財團的雄厚資金與家鄉政客炒作土地的力量，目前土地登記制的法律也不能遏止非原住民買賣原住民保留地（簡稱原保地），但他們可以從生活資源上制衡開發的力量。</p></p>\n<p><p dir=\"ltr\">阿道長老故作神秘，他說這三招大家要放在心裡但不要告訴財團（笑）。第一招是「路」，如果道路是自行開設，地主可以決定要不要讓機具經過。第二招是「電」，當財團想在道路沿線原保地設立電杆，地主可以拒絕。第三招是「水」，當財團將某處水權登記租用後，便有權力讓該處用水百年但不熟制度的族人無水可用，所以部落想以家族使用水源的狀況，與國家談將水權登記在部落會議下的辦法。除了保障水源外，財團用水也需徵得部落同意，也可以藉此抵抗大型開發的壓力。</p></p>\n<p><p dir=\"ltr\"><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20231123-5.jpeg\"></p></p>\n<p><h2 dir=\"ltr\"><span>部落文化傳承維繫於生計</span></h2></p>\n<p><p dir=\"ltr\">可是抵制開發行為之後，年輕人要靠什麼留在部落？這是阿道長老不斷思考與摸索的。</p></p>\n<p><p dir=\"ltr\">為了讓年輕人不要忘記回家的路，同時保留傳統文化，阿道長老藉由族人與教會等多方力量，發展有機農業與觀光業。除了可以減少慣行農法對環境的影響，更透過與主婦聯盟等單位合作，維持穩定的收入來源。目前鎮西堡與周邊的新光部落大約有40個有機農戶，是全台有機農戶密度最高之處。大約有1/3的農戶認為加強有機蔬菜的生產環境非常重要，例如在農地周邊種植蜜源植物可以吸引蟲或鳥類，促進植栽的授粉程度。而種植原生種樹林可以調節微氣候並涵養水分，但樹長大會遮去作物的陽光，降低有機蔬菜產值。阿道長老明白農戶的擔憂，但他提到當子孫接手，那時產業可能已轉變，樹的去留就交由下一代來決定。</p></p>\n<p><p dir=\"ltr\">如果有機農業是為了填飽大家的肚子，那觀光業則是為了豐富心靈而生。</p></p>\n<p><p dir=\"ltr\">鎮西堡有著全台最大檜木林、有豐富的動植物資源，也有美麗的楓葉景觀。當人們風塵僕僕來到深山的靜謐小村，具有泰雅文化風情的民宿與風味餐便成了慰勞辛勞的絕佳選擇。部落透過教育培訓增進民宿經營、觀光服務的品質，也認同維護生態環境的重要性，例如在邊坡或路兩側種原生種樹苗，為下一代留下林木資源。</p></p>\n<p><p dir=\"ltr\">而國小轉變成民族學校，由長老的陪伴並教導孩子製做竹杯、使用傳統食材做菜，以了解環保概念與部落文化。他們也教導族語，當孩子可以用母語唱出歌謠，並在比賽中得到第一名，阿道族長的語氣中充滿自豪。或是舉辦播種祭，孩子在播種小米與收割的活動中體會敬天、敬土地的情懷。阿道長老另提到保種的重要性，除了保留不同生長特色的種子，可因應極端氣候，更在族人交流種子過程中保存互惠共享的精神。</p></p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20231128-6.jpeg\"></p>\n<p><h2 dir=\"ltr\"><span>生計與國家法律、生態保育的衝撞</span></h2></p>\n<p><p dir=\"ltr\">歷史悠久的檜木森林是部落從事生態旅遊業的重要資源，也是他們生活的儲存庫。當他們照顧好森林，森林提供豐沛的水源、木材與蟲魚鳥獸等資源。泰雅族的祖先已把未來子孫生存的資源存到裡面，但國家法律卻阻攔族人取用。當族人依循傳統走入森林，取用風倒木與肉類資源時卻要面臨各種法律的制裁。如果資源由部落與國家共有，讓部落努力經營，如同過去的祖先所做的，就能一起培養留給下一代的資源，達到資源永續。</p></p>\n<p><p dir=\"ltr\">然而部落與國家從緊張對立到互信合作並不容易。2014年鎮西堡巨木群接連遭山老鼠盜伐，當時林務局受限於巡護時間、人手等因素而無法有效保護林木，引起部落強烈不滿。為抵制山老鼠，部落會議決定自組巡守隊之外，也決議採夜間封山措施， 自主設立林道關卡阻絕不明人士進入林道。另外部落與林務局簽訂合作計畫，透過經費與人力投入，從部落想法出發，進行多面向的資源保護。且透過保護山林的結盟儀式，向盜伐者宣示決心 。</p></p>\n<p><p dir=\"ltr\">「部落與國家的價值觀是一致的，但在方法上有所衝突。當我們一起討論與協商，未來雙方的關係就可能更好！」阿道長老語帶輕快地說道。即便推行馬告國家公園未成功，他相信只要努力推行共管機制，每一天抱持嚴謹態度做事，雖然可能不盡美滿，但事情可能越來越好。</p></p>\n<p><p dir=\"ltr\">而當外界對部落山坡地開墾有誤會，認為空拍照中的土地超限利用。阿道長老澄清是冬季造成的枯黃現象，土地均為合法使用。他除了感謝這次機會讓部落反思農作可能會對周邊環境造成的影響，未來他們也會用心在田邊種樹的工作。</p></p>\n<p>\t「為了下一代，一起守護生態資源。」這是阿道長老的心願，也希望部落中的反對者也能加入了保護的行列。「想想我們要留什麼給下一代？」是隨手丟在林中的玻璃瓶，還是一片蓊鬱的檜木森林？阿道長老的眼神已說明了答案。</p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20231128-3.jpeg\"></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>"}, {"nid": 4423, "title": "11/14【講座側記】台灣百年森林治理觀點的演變－戰後台灣的林業史", "original_topic": "森林與林業政策", "adopted_cats": ["森林守護與林業改革"], "content": "<p>p{  font-size:1.125rem;</p>\n<p>margin: 0px 0px 2.5rem</p>\n<p>}</p>\n<p>h2{ font-size: 1.5rem;</p>\n<p>margin: 0px 0px 0.625rem;</p>\n<p>}</p>\n<p>h3{</p>\n<p>font-size: 1.3125rem;</p>\n<p>margin: 0px 0px 0.625rem;</p>\n<p>}</p>\n<p>你知道國民政府來台後砍伐的總木材量比日本人還多嗎？等等，先別急著開罵，請聽聽臺灣大學地理環境資源學系洪廣冀副教授怎麼說。</p>\n<p>身為環境史學者的他從史料和文獻挖掘當代社會氛圍、林業發展狀況與國際情勢，揭露大伐木時代的神秘面紗。</p>\n<h3>所謂大伐木時代</h3>\n<p>洪廣冀老師首先展示1922年到1992年森林主產物各年伐採數量（圖一），藍色長條圖為針葉材、紅色為闊葉材，而綠色為薪炭材（生活燃料用）。圖一左側為日治時期，木頭主要作為燃料使用。到了第二次世界大戰（1939-1945年），整體伐採量隨戰事爆發而增加。</p>\n<p>國民政府接管後，從1950年開始有明確統計。1957年到1974年是臺灣伐木量最多的時候，是李根政老師在《台灣山林百年紀》中提到的，所謂大伐木時代。</p>\n<p>這段時間的伐採量均超過100萬立方公尺。如果一層樓以3公尺來算，100萬立方公尺木材可以堆滿1.4個足球場，約有33層樓那麼高，數量十分驚人。</p>\n<p>大伐木時代與臺灣省農林廳於1956年推行的林政「多伐木、多造林、多繳庫」有關。但到1970年代國際經濟景氣不佳，工業化的林業逐漸走下坡，山崩、土石流四起。1980年代末期在環保團體的抗爭下，政府於1989年宣布禁伐一級天然林，1991年全面禁伐天然林，結束長達近30年的耗竭式砍伐。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20240108-01.png\"><span>圖一、臺灣森林主產物各年伐採數量（來源：洪廣冀副教授演講簡報）</span></p>\n<p>&nbsp;</p>\n<h3>林產管理局其實沒有那麼壞</h3>\n<p>難道林產管理局真的那麼糟糕，想要把木材通通換成錢嗎？洪廣冀老師更好奇的是為什麼會出現這樣的政策？是誰做出決策？</p>\n<p>他發現其實剛誕生的林產管理局比我們想像的還要保護這片森林。</p>\n<p>洪老師貼出一張管理局成立時的大合照，背景標語寫著：「燒一座山等於燒一座城、砍一棵樹等於殺一個人、森林是臺灣的生命」，顯示他們對森林的重視。</p>\n<p>他們掌管臺灣9成以上林地，保林除了可以保護國土、涵養水源外，更重要的是資源永續利用。</p>\n<p>林產管理局喊出「以林養林」，以及「保林重於造林、造林重於伐木」的口號，這是個遠大的願景，卻面臨重重考驗。</p>\n<p>第一個考驗是「配售軍用材」。林產管理局需提供國共內戰用的木材，但報酬極少甚至沒有，根本補不上造林的費用缺口，成為第一顆絆腳石。</p>\n<p>第二個考驗則是「上下相逼、內外夾攻」的情勢。林產管理局為三級機關卻握有全國林業資源，引來上級機關農林廳的不滿，不斷想拆散他們。</p>\n<p>接著是日治末期留下的從業者十分排斥中央集權管理的作法。抗議、越界砍伐或賄絡的情事不斷發生，加上民間濫墾濫伐，直面挑戰公權力，但他們卻無力抗拒。</p>\n<p>這就是1949年中華民國撤退來台時，臺灣林業的窘狀。若再不遏止濫墾濫伐，頻繁的國土流失、災害頻傳，最終政府將無路可退。</p>\n<p>為了實現以林養林的目標，林產管理局首先廢除「特賣制」。這是政府選擇的業者可低價獲取林木的制度。廢除後透過業者互相競爭標案，拉抬林產物價格。</p>\n<p>另外當時估計有20萬公頃的土地被濫伐和盜墾，但政府沒有錢和人力主動造林，也不能隨意驅趕人民，故實行「租地造林」。用便宜租金讓人民安頓下來並使其造林，避免更多事端產生。</p>\n<h3>戰爭、美援與新的林業觀點</h3>\n<p>當百萬人跟著中華民國政府撤退來台，木材需求量暴增，第三個考驗來臨。民間與軍方搶木材，在沒有進口木材的狀況下，濫墾濫伐狀況更加嚴峻。</p>\n<p>&nbsp;</p>\n<p>接著1950年韓戰爆發，美援進入臺灣，帶來人才、技術和錢財，沈格夫（Paul Zehngraff）也是其中一位，作為美國與中華民國政府溝通的橋樑之一，他帶來的林業知識促成了大伐木時代。</p>\n<p>&nbsp;</p>\n<p>沈格夫專長為造林技術，與林業政策扯不上關係，但他卻從保育森林觀點出發，指引林業政策發展方向。</p>\n<p>&nbsp;</p>\n<p>他認為保育森林資源是為了增加生產。森林是活的資產，得透過明智使用來保持它的生命力與生產力，否則將使其停滯。而停滯、閒置或使用不當造成的危害，如同過度利用森林一樣嚴重。</p>\n<p>&nbsp;</p>\n<p>相對於現代從生物多樣性觀點保育森林，沈格夫的想法更像把森林當成貨幣。若不斷消耗而不管理或補充，有一天終究消耗殆盡。</p>\n<p>&nbsp;</p>\n<p>而天然林就像壞資本，難以掌握每年可伐採量，品質也參差不齊，需要林學者在有限年間整理成好的資本（清算），未來才有好收入，才不會毀壞這個資本。</p>\n<p>&nbsp;</p>\n<p>沈格夫的報告揭露若未妥善管理林場，臺灣林業資源將在30年用罄。不過這是他高估人口增加率算出的結果。</p>\n<p>&nbsp;</p>\n<p>他進一步提出超量砍伐的建議，越早將劣等或衰老材積伐除，就越能降低林業資源枯竭的可能性。</p>\n<p>&nbsp;</p>\n<h3>人性及權力的競逐</h3>\n<p>然而留法的皮作瓊局長依舊相信：「保林重於造林、造林重於利用、利用重於開發」。</p>\n<p>他延續前人政策，嚴格實施公正的標賣制，清理「緣故關係」，以免特定業者一直經營某林場。</p>\n<p>他們也在美援協助下第一次用航空照片進行土地利用與森林資源調查，並發現佔有國土面積7成的闊葉林，木材蓄積量竟比不過面積小又難採伐的針葉林。</p>\n<p>手上握有大量的壞資本，林產管理局該如何反應？沈格夫的報告提及清理期，若訂定40年清理完畢，每年要砍伐190餘萬立方公尺的材積量。若50年內清理完，每年則要砍伐150餘萬立方公尺。</p>\n<p>即使最新的方法不斷敲響警鐘，但林產管理局仍以保林優先。第一，他們無法保證砍了那麼多，不會有風災水患出現，那些美援專家也不能負責。第二，他們不確定能砍到那麼多的量，要賣去哪是個問題。</p>\n<p>由於1960年代政局趨於穩定，軍用木量下降，臺灣即將進入經濟奇蹟的時代，民間木材需求量節節上升，但每年伐採70萬立方公尺的木材仍主要提供軍方。</p>\n<p>在當時社會氛圍下，上級機關抨擊林產管理局的施政不當。此時剛好爆出林產物的套售弊案，由於民生材價格高昂，部分軍用材流入民間賺取暴利，再回饋到軍方和林產管理局，此弊案最終導致皮局長下台。</p>\n<h3>裡應外合促成大伐木時代</h3>\n<p>由於弊案爆發使民眾失去信心，1960年組織重組並改名為林務局。繼任者陶玉田局長受到高層壓力、美援專家的建議與皮作瓊局長弊案的影響，提出三多政策：「多造林、多伐木、多繳庫」。</p>\n<p>經營方針確定了，但執行者是誰？從美方觀點，應該是強健的民間業者，但省政府卻接過來做，成立大雪山林業公司，以國營企業打了美方一巴掌。</p>\n<p>那麼砍出來的闊葉木材要銷到哪？美援人員協助林務局投標韓國的枕木案，以發展外銷。但因為闊葉木形狀不一致、木材運輸成本高且防腐技術剛起步，要製作枕木其實很不容易。</p>\n<p>即使勉強滿足標案，剩餘廢材進入臺灣市場打壞價格。在外銷失利、內銷跛腳的狀況下，他們不能再採出預計的材積量，最終使陶局長下台。</p>\n<p>隨著經濟發展，在1960年代中期到1970年代中期，沈家銘局長成功達到美援專家設定的目標。</p>\n<p>這項成功並非一己之力可以達成，亦需要國家限制木材進口，以及國外的木材需求量上升，尤其是日本修築神社的針葉材需求，這才使臺灣真正進入大伐木時代。</p>\n<p>洪廣冀老師笑著說他還有很多故事可以跟大家分享，但由衷希望大家看到這段臺灣林業史上的插曲，不要太快就進入貪婪政府伐木賺取外匯的論述中，並想起這些決定背後其實有一套論述和證據支持著。</p>\n<p>而現代的森林經營管理或環境政治背後也有一套論述，不管你贊不贊成，最重要的是了解和分析那些論述，而非膝反射性的批評。我們才有良性的溝通，讓臺灣環境走向更永續的未來。</p>"}, {"nid": 4426, "title": "【講座側記】11/14 台灣百年森林治理觀點的演變：戰後台灣的林業史", "original_topic": "森林與林業政策", "adopted_cats": ["森林守護與林業改革"], "content": "<p>p{  font-size:1.125rem;</p>\n<p>margin: 0px 0px 2.5rem</p>\n<p>}</p>\n<p>h2{ font-size: 1.5rem;</p>\n<p>margin: 0px 0px 0.625rem;</p>\n<p>}</p>\n<p>h3{</p>\n<p>font-size: 1.3125rem;</p>\n<p>margin: 0px 0px 0.625rem;</p>\n<p>}</p>\n<p><h2>林業歷史映射出的多重面向</h2></p>\n<p>「台灣，我們一同居住的島嶼，有血、有汗、有衝突、有忿罵，卻都是我們相聚的地方。」臺灣的林業史在百年來經歷了數次劇變，不論是關注山林環境議題的大家，以及圍繞在森林四周，以森林維生的人們，彼此的生活都深深受林業歷史的滾輪所牽動。但林業卻對各個角色的人們映射出相異的面向，各式人們面對森林的想像與資源利用的期許也不盡相同。此場講座接續洪廣冀老師於去年講座中未竟的台灣林業史揭露，期望能夠呈現台灣森林史的多元面向，也與李根政董事長以環團角度描述的「山林百年紀」進行對話，從中釐清差異，而後融合。</p>\n<p>在洪老師的詮釋中，李根政董事長在「山林百年紀」中提及，1956年開始的大伐木時代寫下臺灣森林的黑暗史，山林資源遭受前所未有的浩劫，終於在1980年的森林保護運動開始，林業伐採終於在1993年迎來尾聲，當中對於大伐木時代開啟的歷史條件仍少有著墨，當中其實有著錯綜複雜的因果，一連串合理時機與資源配合逐漸集齊了所有鑰匙，才迎來空前的大伐木時代。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20240124-2_0.jpg\"></p>\n<p><h2>二戰結束後的「以林養林論」</h2></p>\n<p>「燒一座山等於燒一座城，砍一棵樹等於殺一個人」，民國37年張貼於於高雄山林管理所的標語可以作為此時期的林業政策調性。若森林不當砍伐，則風災水患無法避免。時下臺灣林業在日治時期的管理方針影響後，呈現出企業在地化的樣貌，林業現場工作由在地的民間業者承包處理，國民政府林務局於1945年12月成立以後，嘗試取回民間業者的權利，實行林地國有化，統一執行「以林養林」的政策，提出「保林重於造林、造林重於伐木」的期許，期望以國家為核心，推動伐林獲益、獲益造林的正向循環。</p>\n<p>不過，總結來說，在1945年至1950年代的林業論調以「保林」為主，期望能夠保護台灣的林業資源。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20240124-8_0.jpg\"></p>\n<p><h2>美援時期下的「活用資本論」</h2></p>\n<p>1952年，美國人沈格夫來臺，任職中國農村復興聯合會森林組組長，協助臺灣林業的發展。沈格夫主修造林，認為森林是唯一的可再生資源，在其他天然資源不斷消耗減少時，投資林業對增進人類福祉是重要作為。他將企管管理思維帶入林業管理，以公司的角度來看，森林是「活的資本」，要明智地使用才可保持其生命力與生產力，因天然林之價值不可控且不可預測，加上日治時期的研究指出森林蓄積量正在減少，對於經營管理下是壞的資本，天然林因而成為企管思維下被清算的資本（闊葉材劣等，針葉材衰老），應該發展好的資本（人工林），否則臺灣林業將會面臨資源浩劫的困境。經由方程式的計算下，訂出全台森林應於40年內清算完畢，一年的可容許伐採量可達190萬立方米。</p>\n<p>同一時期，林產管理局（在1947年5月30號林務局改組為林產管理局）第四任局長皮作瓊在1952年9月1號上任，秉著留法時學習的治水觀念，認為水土保持應由森林管理達成，提出「保林重於造林、造林重於利用，利用重於開發」，承襲以林養林政策繼續推動政策。然而，面對當時省政府、中華民國政府與立委的壓力，在國家層級機構逐漸接受沈格夫的林業思想，認為應該開發林業資源。與此同時，民用木材需求的壓力持續存在，卻在林產管理局對木材資源開發的保守態度無法滿足，造成木材黑市盛行，並且有業者賄賂軍方，非法取得軍用木材獲取暴利，在1956年林產物套售弊案遭揭露，使得皮作瓊被去職，由陶玉田副局長代理。</p>\n<p>林產局因弊案與民生需求無法滿足的困境，使得林產局形象低靡，加上高層態度支持沈格夫的科學論證與民生的急迫需求，儘管林產局對於活用資本論述保有存疑，在缺乏資本與政治地位下，以林養林政策的聲勢漸趨消弭。與此同時，自以林養林期便持續進行的林業國有化，在當下達到高度集中，而後，韓戰期間韓國對於枕木的需求以及日本經濟起飛後的木材需求大增，為臺灣林產物提供龐大的銷售管道，在天時、地利與人和到位的情況下，林業政策從「以林養林」轉為「活用資本」，導致「多伐木、多造林、多繳庫」的三多時代成功開啟。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20240124-9.jpg\"></p>\n<p><h2>總結：釐清歷史事件背後的脈絡</h2></p>\n<p>大事件的開端背後，常有一套嚴謹的論述與科學推論醞釀多時，在我們滑進簡單的歷史論述前，能夠釐清驅動事件的條件、資源、相關人與脈絡，才能夠看穿政策確立的始末，在環境倡議者（我們）想要消減甚至抵抗政策執行者的政策時，不會落到只能反射地大肆批評。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/20240124-15.jpg\"></p>\n<p><h2>Q&amp;A</h2></p>\n<p>Q: 現在還是有人認為天然林是雜木林，沒有碳匯價值？找大企業做人工林經營增加自然碳匯是可行的方法嗎？</p>\n<p>A: 有在關心但沒做研究，但在1993年禁伐天然林後，整體社會感受上較接近「以林養林」的保林時代，變成林業最主要的價值。然而民間對森林的需求仍在，如果林保署不溝通，過度保護森林的後續反抗力道勢不可擋，則可能出現森林遭受不當利用的風險。碳匯對林業封鎖的現況可能是林業發展的新方向，有潛力走出「以林養林」與「資本活用」的第三條路線。同時，我們處於政策參與機會龐大的社會，各方意見在政策執行前參與與討論，較能避免政策過度依賴高層判斷而產生不可逆的大變化。</p>"}, {"nid": 4477, "title": "森林碳匯能減多少碳？如何讓環境和社會都受益？", "original_topic": "森林與林業政策", "adopted_cats": ["氣候變遷與調適", "森林守護與林業改革"], "content": "<p>\n<p><img alt=\"一個人環抱著高聳的大樹\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20240417-003.JPG\"><span></span></p></p>\n<p>近年因為全球政府陸續宣示要面對氣候變遷、在2050年達成淨零排放，企業、人民都在「瘋減碳」。減少大氣中溫室氣體二氧化碳的方式百百種，其中最為人矚目的一塊便是「種樹」。</p>\n<p>透過種植樹木、保留樹木來固碳，形成「森林碳匯」，似乎是一種非常符合直覺且擁抱大自然的減碳策略。<strong>但透過森林碳匯，到底能夠達成多少減碳效益？政府、企業只要透過多種樹，就可以解決氣候危機嗎？</strong></p>\n<p><h2>什麼是台灣2050淨零排放？</h2></p>\n<p>2050年，台灣整體的溫室氣體排放量要等於台灣的森林、溼地、土壤等自然環境的二氧化碳吸收量（自然碳匯）。<br>\n<p>最簡單的說法就是：2050年，台灣的碳排放量和是1：1，這樣就是達成淨零排放。也就是說，到2050年，<strong>台灣的自然環境有能力吸收多少碳，我們才能排放多少碳。</strong></p></p>\n<p>台灣排碳多嗎？台灣是一個工業大國，總排放量佔全球0.7%，排名第22名。根據2021年環保署的統計，當年度台灣二氧化碳排放量約為2億8311萬公噸，<strong>將近當年度自然碳匯二氧化碳吸存量2,185萬公噸的13倍。</strong>註一</p>\n<p>\n<p><img alt=\"森林\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20240417-001.jpg\"><span></span></p></p>\n<p><h2><strong>台灣有可能透過森林碳匯來達成淨零排放嗎？</strong></h2></p>\n<p>台灣土地面積狹小，人口密度高，森林覆蓋約達六成，就算積極增加森林的面積，再加上目前尚在研究減碳方法的土壤、溼地和海洋等，能夠吸存的碳也是十分有限。而目前國發會規劃到2050年，森林碳匯每年只能增加吸存110萬噸的二氧化碳，約為目前的5%。</p>\n<p>政府規劃我們花25年種樹、保育，每年增加110萬噸的森林碳匯，大概是什麼樣的概念呢？如果換算成能夠折抵的工業排放量，<strong>110萬噸二氧化碳，大概是中鋼營運18天的排放量，更只有台塑集團營運約8天的排放量。</strong>註二</p>\n<p>也就是說，如果台灣要達成淨零排放，努力保有和增加自然碳匯固然重要，但是絕對不可能只靠種樹就達成淨零，而是<strong>一定要積極減少其餘超過九成且森林無法吸存的二氧化碳排放</strong>，而這些排放源主要來自於工業、住商、交通等耗能及活動。</p>\n<p>\n<p><img alt=\"一個人在霧中仰望參天大樹\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20240417-002.jpg\"><span></span></p></p>\n<p><h2><strong>那為何企業這麼愛種樹？</strong></h2></p>\n<p>人都有愛好自然、親近自然的本能，而因為台灣人喜愛種樹，企業種樹對於提昇形象有幫助，可以說是達成ESG價廉物美的好項目。</p>\n<p>譬如，台積電在2021年的植樹節發起「台積電植樹薪傳計畫」，由桃園、新竹、台中、台南市政府盤點規劃適宜土地給台積電栽種，截至2021年底，累積約種植了 1 萬 7,044 棵喬木與 27 萬 7,898 棵灌木，總綠化面積約 16.3 公頃，相當於0.6座大安森林公園的面積。</p>\n<p>在植樹薪傳計畫中，台積電委託了專業的景觀顧問公司和樹藝協會來協助，各縣市長都親自出席了種樹的儀式，媒體宣傳的效果很大，對於台積電原本就不錯的形象再加分。註三</p>\n<p><h2><strong>但是，種下的樹能達到多少減碳效果？</strong></h2></p>\n<p>根據環境部的資料，一公頃的林地每年可以吸收約10公噸的二氧化碳，假設台積電總綠化面積16.3公頃來換算，在種植約20年後，每年預估能夠創造約163公噸的碳匯，至於這項計畫能否取得碳權認證尚待了解。</p>\n<p>但很明確的訊息是，台積電在2021年的年排放量為1030萬公噸，相較之下，<strong>這163公噸大概只夠抵銷台積電營運8分鐘的碳排放量</strong>。而這或許就是台積電新聞稿中，並沒有具體去提種樹可以減多少碳的原因。</p>\n<p>所以，未來如果看到企業拿「我種了很多樹」來當作努力減碳的證明，應該要小心不要被誤導、模糊焦點。企業真正該做的，仍然是<strong>聚焦於努力減少他們生產製造的排放</strong>才對。</p>\n<p>\n<p><img alt=\"一群人手牽手環抱參天大樹\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20240417-005.JPG\"><span></span></p></p>\n<p><h2><strong>所以我們就不種樹了嗎？</strong></h2></p>\n<p>儘管種樹對於碳匯貢獻有限，也不一定能拿來抵減多少碳排放，但企業如果可以好好的運用企業豐厚資金，引進專業團隊，「在對的地方，在對的目標下種對的樹」，仍然可以對環境和社會產生正面貢獻。</p>\n<p>以前面台積電的例子來說，台積電當時的新聞稿提到：「台積公司選擇的樹苗皆為台灣原生種，以適地適種為原則，同時考量最佳適應性、高生態效益，並且維持本土物種。」其實就是一個值得鼓勵的作法，可惜的是仍缺少明確的生物多樣性策略和目標。2023年，台積電發布了「生物多樣性宣言」，開始提出相關計畫。這是一個值得肯定的轉變，也期待台積電可以成為領頭羊，帶領更多台灣企業走向生物多樣性的系統化保育工作。</p>\n<p>自然碳匯可以增加的幅度雖然有限，但還是要努力。不過，碳匯只是其中的一個目標，政府跟企業應該以提昇生物多樣性、人民生活品質和健康等多元目標，來擬定計畫，避免把碳匯做為唯一的目標，加上碳匯方法學之不足而產生其他副作用，例如砍伐次生林改造為人工林等，這些作為對於碳匯的貢獻都尚待研究跟政策釐清。</p>\n<p>\n<p><img alt=\"在森林中仰望的視角\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20240417-004.JPG\"><span></span></p></p>\n<p><h2>森林碳匯如何讓台灣環境和人民真正受益？</h2></p>\n<p>基於許多自然碳匯的研究都還在進行中，透過種樹、保育能夠增加多少自然碳匯，仍然有不確定性。但是，我們認為政府、企業透過增加碳匯的動力，挹注資金和資源，啟動社會討論凝聚共識，整合出從現在起到2050年，增加台灣自然碳匯、生物多樣性、提昇綠生活環境品質的政策與項目計畫，從做了不會後悔的事情開始。</p>\n<p>這將有助於引導企業和社會有心人士，共同致力於保有和增加自然碳匯，在對的地方，在對的目標下種對的樹，豐厚和促進台灣森林有形和無形的多元功能和資產。</p>\n<p>以這個作為出發點，我們列出了六項可以優先執行的項目，更可以成為你未來檢視政府及企業的種樹、護樹政策的重要指標。</p>\n<h3>優先保護森林，維護生物多樣性</h3>\n<p><ul></p>\n<p><li>保育既有天然森林。</li></p>\n<p><li>辨別農牧用地上具高保育價值的森林，保育其不被砍伐，減少森林損失。</li></p>\n<p><li>既有平地造林，透過資源調查和土地規劃，依據地力、功能、地方需求規劃為生態林、景觀林或經濟林。</li></p>\n<p></ul></p>\n<h3>在對的地方，在對的目標下種對的樹</h3>\n<p><ul></p>\n<p><li>選擇合適的地方，進行生態造林—例如移除銀合歡等外來種再造林。</li></p>\n<p><li>選擇合適的地方新植人工林加上人工林的永續經營，增加國產材。</li></p>\n<p><li>山坡地混林農業，改善山坡地農業破壞水土的耕種方式。</li></p>\n<p></ul></p>\n<p>全台灣愛樹、愛種樹的人真的很多，我們誠心期待在這波森林碳匯的政策擬定過程，有更多的社會討論、公眾參與，並廣納各有不同領域的專業參與。</p>\n<p><hr></p>\n<h3>地球公民基金會長期關注台灣的山林保育，近年更舉辦多場「森之旅」系列講座，希望讓更多人認識森林、了解森林，進而一起保護森林。如果你願意支持像地球公民這樣實事求是，有幾分證據說幾分話的環保團體，歡迎小額捐款支持我們。</h3>\n<p><div><a href=\"https://www.cet-taiwan.org/donate\"><span><span dir=\"ltr\">成為地球公民</span></span></a></div></p>\n<p>如果你想持續了解更多關於森林、減碳的知識，歡迎<a href=\"https://www.cet-taiwan.org/civicrm/profile/create?gid=10&amp;reset=1\">訂閱地球公民電子報</a>。</p>\n<p>註一：台灣每年二氧化碳的移除量2185萬公噸乃是採用2021年溫室氣體排放清冊報告的數據，森林碳匯的計算方法仍有許多修正空間與缺口，並不能完全代表台灣自然碳匯移除二氧化碳之量體。但無論如何，台灣目前人為溫室氣體排放量，遠遠大於自然可以吸收的量，是無庸置疑的事實。</p>\n<p>註二：根據環境部氣候變遷署事業溫室氣體排放平台2021年碳盤查登錄資料，台灣積體電路公司年碳排放(範疇一及範疇二合計)約為10.12MtCO2e(占全台3.4%)，台塑集團旗下台塑石化、台塑工業、台化及南亞公司共計約50.07MtCO2e(占全台16.9%)，中國鋼鐵公司則約為22.33 MtCO2e(占全台7.5%)，共計貢獻全台27.8%的碳排放。</p>\n<p>註三：台積公司啟動植樹薪傳計畫 攜手桃園、新竹、台中、台南四地市政府共同推動都市與社區綠化。台灣積體電路製造股份有限公司，2021/03/12。<a href=\"https://pr.tsmc.com/chinese/news/2801\">https://pr.tsmc.com/chinese/news/2801</a></p>"}, {"nid": 4496, "title": "摸索台灣山林保育與產業衝突的調解路徑：安朔殼斗科森林的危機與解方", "original_topic": "山林水土;森林與林業政策", "adopted_cats": ["森林守護與林業改革"], "content": "<p><img alt=\"20240527_001.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20240527_001.jpg\"><br>\n<p><span>圖一、安朔櫟林空拍（傅志男攝/地球公民基金會提供）</span></p></p>\n<p><blockquote><p>2018年，長期在台東安朔地區觀察、紀錄殼斗科的生態愛好者發現當地的林農砍伐櫟林、整地，於是向社會大眾與政府部門展開倡議，保育安朔珍貴的殼斗科森林。&nbsp;</p></p>\n<p>然而，珍稀物種在安朔生長的範圍，依當前的土地編定，多數屬於國有財產署（以下簡稱國產署）管理的農牧用地，而非擁有法規（森林法）工具的林業保育署(以下簡稱林保署)可以直接管理的土地，而部分的土地上也有林農持續經營農林產業的需求，處理當地的保育課題需要各方細緻對話，透過包容不同利害關係人的保育策略和架構，一起面對台灣森林保育課題。</p>\n<p>六年來，政府相關部門，包括林保署、國產署與保育團體及生態愛好者，在其間持續的磨合討論，至今仍在進行中，可以說是討論台灣當代淺山地區森林保育的指標案例，值得關心台灣森林保育的社會各界共同來了解，尋求解方。</p>\n<p></blockquote></p>\n<p>台灣有45種殼斗科樹木，其中14種為特有種，也有14種列名為稀有植物，生長範圍自低海拔的亞熱帶森林橫跨到中高海拔的溫帶林，殼斗科物種在台灣不同海拔的森林與其他類群共生，形成繽紛而豐富的植物群落。</p>\n<p>殼斗科除了是森林裡優勢類群之外，青剛櫟春天的嫩葉是許多灰蝶屬與蛺蝶屬重要的食草；石櫟屬與苦櫧屬的柔荑花序開花時，散發氣味吸引昆蟲前來授粉；果實成熟時，成為了松鼠、黑熊、山羊等野生動物的食物，甚至台灣黑熊還會在青剛櫟的樹冠築巢，當然殼斗科自己也需要依靠這些動物將種子傳播到更遠的所在。</p>\n<p>然而，在20世紀初，台灣的原始森林在日本和國民政府兩大殖民政權的森林經營規畫下，有許多大規模伐木造林計畫，並且為了開發山林資源，更有許多迫遷部落的移住計畫。殼斗科植群分佈熱區的中、低海拔櫟林楠櫧林帶—原始闊葉森林，更在1965~1976年的林相變更，與1983~1987年的林相更新等政策下，受到嚴重的破壞，直到1991年政府宣布禁伐天然林，才得到些許到喘息的機會。&nbsp;</p>\n<h3>台灣的龍貓森林—安朔櫟林</h3>\n<p>安朔櫟林位於台東縣達仁鄉，核心區域面積約500多公頃，是連結台灣本島與恆春半島的重要生態廊道，冰河期是東亞大陸物種向南遷徙的東南邊界與避難所，在植群分區上屬於台灣東南區，終年穩定的氣溫，加上稜線與山谷交錯的地形，讓台灣超過半數的殼斗科物種能夠立足在這片台灣東南角的森林。</p>\n<p><img alt=\"20240527_004.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20240527_004.jpg\"><br>\n<p><span>圖二、位於台東安朔地區的龍貓森林（殼斗科森林）。（傅志男攝/地球公民基金會提供）</span><
