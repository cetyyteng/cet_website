><span>經營林業時空錯亂</span></strong></p>\n<p><span>原本因應台灣各種天災地變日益嚴重，歷來的組改都朝向「水、土、林」部門的整合，將原有在農委會的林務局、林試所，以及內政部的國家公園整併到環境資源部。然而，令人憂心的是，在部分林業官員的遊說之下，行政院已走回頭路，要在農業部設置「林業司」，林試所也打算續留農業部，目前正進入最後的朝野協商階段。 </span></p>\n<p><span>從日治至國府時代的伐木事業，摧毀台灣近8成的原始森林，是造成今日土石橫流的根本原因，1996年賀伯颱風至今，林業單位推出的造林政策，結果竟演變為全島「砍大樹、種小樹」的可怕後果。這些歷史告訴我們，絕大部分的台灣「森林」，不論是國有、公有、私有林，都不應當成一種農作物來經營管理，而應在生態保育、國土保安的前提下，進行經營管理。此時堅持在農業部搞經濟營林，實在是時空錯亂，因而，我們堅決反對林業司的設置。</span></p>\n<p><span>再者，林試所續留農業部更是不合理。林試所目前轄有標本館與國家植物園、國家林木種源庫，其業務與環境資源、植物學、生態學研究教育關聯性高，與林產相關性不高。而既有6個分所、9000多公頃的試驗林中，福山植物園與福山分所已移撥入環資部，但同樣是做基礎生態學與動態研究的基地，如南投魚池鄉的蓮花池試驗林，其中25公頃森林動態樣區，是與美國史密斯桑尼亞熱帶中心簽約合作的研究場所，嘉義中埔的植物園、雲林四湖鄉的海岸防風林試驗研究基地、高雄六龜的試驗林、墾丁的熱帶植物園、恆春試驗林及太麻里的試驗林等，卻都留在農業部，完全不符合組改目的。同時，以恆春試驗林為例，將來會變成土地所屬歸農業部，管理機關為環資部的亂象。 </span></p>\n<p><span>1989年政府宣布禁伐檜木林，1991年全面禁伐天然林，台灣結束伐木事業已20多年。過去實驗林場以林產研究為主，已逐漸轉為森林生態研究為主，甚至轉型為環境教育場所，不應在此次組改走回頭路，回復成林產開發研究目的的單位。 </span></p>\n<p><span><strong>應要能「改變台灣」</strong></span></p>\n<p><span>水、土、林併入環資部，代表國家新世紀山林政策與價值，籲請執政黨及在野黨不要只有「看見台灣」，應要能「改變台灣」，不應再為了少數林業人員之私，而毀壞組改的理想。</span></p>\n<p><span><span><strong>&nbsp;</strong></span></span></p>\n<p><span><span><span><strong>延伸閱讀：</strong></span></span></span></p>\n<p><ul></p>\n<p><li><span><span><span><a href=\"http://www.appledaily.com.tw/appledaily/article/headline/20140113/35575459/\"><span>2014.1.13 蘋果日報刊載版</span></a><strong><br></strong></span></span></span></li></p>\n<p></ul></p>\n<p><span><br></span></p>"}, {"nid": 1870, "title": "銅門部落檜木事件（現勘報告）", "original_topic": "山林縱谷", "adopted_cats": ["森林守護與林業改革"], "content": "<p><span><span>文/ </span></span><span><span><span> 黃斐悅（</span>地球公民基金會花東辦公室 研究員）</span></span></p>\n<p><span> </span></p>\n<p><span>花蓮縣秀林鄉銅門部落族人於2013/12/23攔截林務局運送珍貴木材下山（詳見<a href=\"http://e-info.org.tw/node/96074\">報導</a>），花蓮林區管理處於<a href=\"http://hualien.forest.gov.tw/ct.asp?xItem=66263&amp;ctNode=2077&amp;mp=380\">12/26</a>、<a href=\"http://hualien.forest.gov.tw/ct.asp?xItem=66298&amp;ctNode=2077&amp;mp=380\">12/27</a>之聲明稿指出，「因天兔颱風侵襲造成傾倒之6株貴重風倒木…為有效管理國有財產，避免<span>有價林木遭盗取風險</span>及<span>維護道路安全</span>…」，並稱是依據森林法及「國有林林產物處分規則」作業，因此族人組成調查團，於12/ 28、12/30分別會同記者、陳添財博士（東華大學自然資源與環境學系）以及本基金會花東辦公室等單位，兩度上山勘查現況。其中12/30之會勘，經過長期於該處進行調查之植物學者—陳添財博士鑑定現場狀況後，由本基金會撰寫現勘報告並提供給族人及記者使用。花蓮林管處後於1/2前往會勘（見林管處<a href=\"http://hualien.forest.gov.tw/ct.asp?xItem=66387&amp;ctNode=2077&amp;mp=380\">1/4聲明稿</a>），因此地球公民基金會亦發佈完整報告內容，供各界參考比對。</span></p>\n<p><span> </span></p>\n<p><span> </span></p>\n<p><span><strong>二處取木點現勘結果說明</strong><strong>&nbsp;</strong></span></p>\n<p><span> </span></p>\n<p><span><strong><span>(1) </span></strong><strong><span>省道台14</span></strong><strong><span>奇萊線約17K</span></strong><strong><span>處，奇萊橋下方河床</span></strong></span></p>\n<p><span> </span></p>\n<p><span>此處，林務局以小型怪手從台14奇萊線之奇萊橋旁開挖了一條便道至溪床（長17.3米、寬4.2米，見圖一），以便將裁切好之木頭拉出。然而，溪床上仍有數根巨木尚未拉出。另外，溪床目前為乾枯狀態，溪床至橋底約10米（見圖二，圖中人身高163cm），距離甚遠，推測林務局於此處取木主因並非道路(橋樑)安危，而是聲明稿中之另一項理由「避免有價林木遭盗取」。然而，花蓮林管處12/13申請搬運之木頭總共僅有5支（圖三），溪床上其餘巨木，不知何故未處理（與12/27聲明稿中6支也不同，不清楚究竟6支或5支？）。</span></p>\n<p><span><img alt height=\"371\" src=\"/sites/cet-taiwan.org/files/1-%E5%9C%96%E4%B8%80%20%E9%80%9A%E5%BE%80%E6%BA%AA%E5%BA%8A%E4%B9%8B%E4%BE%BF%E9%81%93%EF%BC%8C%E9%95%B717.3%E7%B1%B3_%E5%AF%AC4.2%E7%B1%B3.JPG\" width=\"660\" loading=\"lazy\"><br>\n<p><span><span>圖一 通往溪床之便道，長17.3米_寬4.2米（銅門部落提供）</span></span></span></p></p>\n<p><span><span><span><img alt height=\"660\" src=\"/sites/cet-taiwan.org/files/1-%E5%9C%96%E4%BA%8C%20%E6%BA%AA%E5%BA%8A%E4%B8%8A%E6%9C%AA%E6%90%AC%E9%81%8B%E5%B7%A8%E6%9C%A8_%E6%BA%AA%E5%BA%8A%E8%B7%9D%E6%A9%8B%E5%BA%9510%E7%B1%B3%E5%B7%A6%E5%8F%B3.JPG\" width=\"495\" loading=\"lazy\"><br>\n<p>圖二 溪床上未搬運巨木_溪床距橋底10米左右（銅門部落提供）</span></span></span></p></p>\n<p><span><span><span><img alt height=\"660\" src=\"/sites/cet-taiwan.org/files/1-%E5%9C%96%E4%B8%89%20%E6%9E%97%E7%AE%A1%E8%99%9512.13%E5%85%AC%E6%96%87.JPG\" width=\"495\" loading=\"lazy\"><br>\n<p>圖三 林管處12.13公文（銅門部落提供）</span></span></span></p></p>\n<p><span><strong><span>(2) </span></strong><strong><span>省道台14</span></strong><strong><span>奇萊線18K</span></strong><strong><span>處道路上方崩塌地</span></strong></span></p>\n<p><span> </span></p>\n<p><span>18K處道路與一道天然崩塌垂直，肉眼可見崩塌自道路上方直通道路下方溪底。目前該處道路上方，是整片碎石與斷木（圖四），包含一株倒下但尚未完全死亡之紅檜（圖五）。此處，林務局以「道路安危」為由作清運，但現場除了已運走之木頭外，其餘小株雜木並未妥善處理，而上方倒下的紅檜，不知是尚未清除或不打算清除（有林務局噴漆標記）。對照在台14線上（天長隧道之前）斜倒路邊一株茶科的紅淡比(圖六)，該倒木有砍痕，顯然經過清理，卻因其是所謂的無價雜木而未運走，繼續讓它斜在路上方，難道不影響道路安危？</span></p>\n<p><span><img alt height=\"660\" src=\"/sites/cet-taiwan.org/files/1-%E5%9C%96%E5%9B%9B%20%2018K%E9%81%93%E8%B7%AF%E4%B8%8A%E6%96%B9%E5%B4%A9%E5%A1%8C%E5%9C%B0%E9%9B%9C%E6%9C%A8%E6%9C%AA%E9%81%8B%E8%B5%B0.JPG\" width=\"495\" loading=\"lazy\"><br>\n<p><span><span>圖四&nbsp; 18K道路上方崩塌地雜木未運走（銅門部落提供）</span></span></span></p></p>\n<p><span><span><span><img alt height=\"372\" src=\"/sites/cet-taiwan.org/files/1-%E5%9C%96%E4%BA%94%2018K%E9%81%93%E8%B7%AF%E4%B8%8A%E6%96%B9%E5%B4%A9%E5%A1%8C%E5%9C%B0%E7%B4%85%E6%AA%9C%E6%9C%AA%E9%81%8B%E8%B5%B0.JPG\" width=\"660\" loading=\"lazy\"><br>\n<p>圖五 18K道路上方崩塌地紅檜未運走（銅門部落提供）</span></span></span></p></p>\n<p><span><span><span><img alt height=\"371\" src=\"/sites/cet-taiwan.org/files/1-%E5%9C%96%E5%85%AD%20%E8%B7%AF%E4%B8%8A%28%E5%A4%A9%E9%95%B7%E9%9A%A7%E9%81%93%E5%89%8D%29%E6%9C%AA%E5%A6%A5%E5%96%84%E8%99%95%E7%90%86%E4%B9%8B%E7%B4%85%E6%B7%A1%E6%AF%94.JPG\" width=\"660\" loading=\"lazy\"><br>\n<p>圖六 路上(天長隧道前)未妥善處理之紅淡比（銅門部落提供）</span></span></span></p></p>\n<p><span>&nbsp;</span></p>\n<p><span><strong>問題一</strong><strong>：倒木處理</strong><strong>程序瑕疵</strong><strong>&nbsp;</strong></span></p>\n<p><span> </span></p>\n<p><span>目前並無林務局違法盜伐證據，但即便是合法清運倒木，作業程序上仍恐有諸多爭議和瑕疵。</span></p>\n<p><span> </span></p>\n<p><span>1、倒木運載明顯有選擇性，因此<span>維護道路</span>安全恐怕不是重點，「<span>避免有價林木遭盗取</span>」才是主要因素。森林法本來就將倒木視為國有財產，為了防止盜取而統一由國家標售，此作法於2001年棲蘭山枯立倒木事件爭議許久，本文不再贅述。另外，銅門部落本次也提出太魯閣族的觀點，如後<span>附件：</span><span>談太魯閣族與樹的連結</span>。</span></p>\n<p><span> </span></p>\n<p><span>2、林務局稱已依照通報程序作業，然而哪根木頭該載、如何運載，統一標準究竟為何？目前仍未見官方清楚說明。除界定不明外，在執行上，林務局恐怕也無法保證絕對不會發生「藉由清運倒木順便取走其它木頭」的情形。</span></p>\n<p><span> </span></p>\n<p><span>3、本處海拔1400公尺以上，已劃設為保安林地(木瓜事業區內2620號土砂捍止保安林)、亦劃設為水庫集水區(水簾壩蓄水範圍上游)，屬於營建署公告環境敏感區中管理較嚴格之「限制發展區」，水土保持相關程序理應從嚴辦理；依照森林法之「保安林經營準則」及「台灣森林經營管理方案」，保安林及水庫集水區之林木處理亦有較嚴格規定。雖倒木清除不算「開發行為」，卻必須開挖便道，如何能確保便道是否影響水土保持？依據<span>水土保持法</span>12條<a href=\"#_ftn1\">註</a>1，修建「其它道路」應擬具水土保持計畫送主管機關(農委會)核定，或者依<span>水土保持計畫審核監督辦法</span>第3條<a href=\"#_ftn2\">註</a>2，一定規模以下的道路可用「簡易水土保持申報書」代替。本案是否有辦理此程序？若無，則應請<span>水保局、農委會</span>釋疑何種規模以下的「便道」才不需要此程序？</span></p>\n<p><span> </span></p>\n<p><span> </span></p>\n<p><span><strong>問題</strong><strong>二：上位政策及法律精神衝突</strong><strong>&nbsp;</strong></span></p>\n<p><span> </span></p>\n<p><span>1、以上關於五支巨木作業程序瑕疵問題只是爆點，而非核心，真正問題顯然在於更深的法制矛盾：<span>由於原住民基本法</span><span>(</span><span>以下稱原基法)</span><span>沒有子法可執行，整個台灣的法制從未認真處理各項行政作業與原基法精神的衝突，因此造成台灣社會與原住民族相當大的隔閡，每當族人喊出傳統領域、自然資源主權的訴求時，背後深層的原因總難以被理解</span>（可參考戴興盛老師<a href=\"http://opinion.cw.com.tw/blog/profile/164/article/875\">文章</a>）。</span></p>\n<p><span> </span></p>\n<p><span>依森林法，只要林務局倒木清除作業程序完整，就沒有違法問題，再怎麼樣也頂多是程序瑕疵。但依原基法21條<a href=\"#_ftn3\">註</a>3內文，只要行政單位未向週遭的部落報備、經過其同意，就是違反原基法。由該法21條衍生的衝突，近年在全台各地原住民族部落中烽火四起、越演越烈，但法理上，就因原基法根本無完備的子法可執行，所以部落常被建議不要用「違法」字眼，充其量只能說行政部門違反原基法『精神』。於此，族人情何以堪？當行政機關不承認國家傷害在先，而繼續用國家（一個外來殖民政權）制訂的法規細節去協商，要求部落理解，反而會激起族人更大的情緒，造成更多傷害。</span></p>\n<p><span> </span></p>\n<p><span>2、對林務局傳統的「林產」觀點而言，貴重倒木本就應依森林法來清運、標售，財產收歸國庫，否則即是暴殄天物、不懂珍惜資源；保育團體則認為倒木不能移出，必須留在林中作天然更新。而對銅門部落太魯閣族人的傳統文化而言，倒下的巨木是祖靈木，應留在原地不予移動(見<span>附件</span><span>:</span><span>談太魯閣族與樹的連結</span>)。在此處理上，保育團體與銅門部落的觀點一致，認為倒木應留在森林中，不應當作「財產」來標售；但這與現行法制有極大落差。同時在現實上，就算不提法規，珍貴倒木恐怕還是受人覬覦的一項「財產」。銅門部落主張傳統領域（無論公告與否）的山林土地資源應交給部落管理或共管，林務局也同意建立某種程度的共管機制。假設對話或共管機制能成立，雙方都必須思考於情理和法治等不同層面上，倒木的處理方式，然而林務局身為主管機關、國家的代表，必須先釋出善意、承認國家對原住民族的傷害歷史，才有對話的可能。（可參考林益仁老師<a href=\"http://opinion.cw.com.tw/blog/profile/63/article/872\">文章1</a>、<a href=\"http://opinion.cw.com.tw/blog/profile/63/article/874\">文章2</a>）</span></p>\n<p><span> </span></p>\n<p><span> </span></p>\n<p><span><strong><span>[附件] 談太魯閣族與樹的連結：生命來的地方，從起源開始 &nbsp;by東冬侯溫（銅門部落）</span></strong></span></p>\n<p><span> </span></p>\n<p><span>渾沌太古之初-天地沒有光沒有生命沒有人,從神之國（靈界）有三位天神（兩男ㄧ女）在神聖的半樹半石（白石山的根源之樹與牡丹岩）開啓了與人間連結的出入口-有ㄧ位男神看見這世界什麼都沒有覺得無趣就回去來的地方-而留下來的天神是ㄧ對男女-於是神給予了這世界賦予了各種生命，並繁衍了神的子孫，也就是人（我們），當時的人有各種祝福與能力，直到人出現的貪婪，慾望，以及傲慢，導致我們失去了美妙與神奇的力量....這是祖先流傳已久關於人類起源的神話...那個至美之地沒有消失，只是我們與祂分離了...只有在肉身死去時，靈魂踏上彩虹（光）橋時，祖神（祖靈）會站在另ㄧ端審視人是否在人間完成淨化，透過生活遵循Gaya（宇宙的法則）回歸到最質樸存粹的生命本質,才能回到靈的世界....</span></p>\n<p><span> </span></p>\n<p><span>這是流傳在太魯閣族的生命起源神話，神話中說到，帶來生命的神祖利用根源之樹成為來到人間的空間出入口，也賦予著在自然界中，那些巨大古老的樹，靈界的神聖與莊嚴;當獵人看見森林裡的大樹都會忍不住敬畏的說：「這樹呀....比我的祖輩還古老，看見這樹我就想起那些在靈界觀視我們的祖先們」。由此看來，因為歲月而累積的記憶與情感在人遇見樹的那ㄧ刻將會全部湧現，那是ㄧ種無聲的感動與震撼，是ㄧ種與大自然交流的形式。</span></p>\n<p><span> </span></p>\n<p><span>在過去...這樣巨大的倒木族人通常不會移動，因為巨大的倒木可以作為獵人臨時的避難之所，利用樹幹下的凹處或洞穴來抵禦寒冷，而像檜木等如此不易腐爛而且堅硬的木頭，還能成為抵擋土石的屏障，若是掉落溪流之處，則有穩定河床的效用，如此看來，過去林務局以清理為名義，實則是讓大自然可以自行穩定與守護的機制失衡，這中間存在多少貪婪的利益以及缺少山林智慧的人為因素....民國79年歐菲莉颱風來襲，造成銅門部落土石流，死傷多人，更多族人因而被迫遷村，許多部落傳統領域也被列為土石流警戒區，部落在面對這次的慘痛事件，對於生存空間的堪憂，以及山林水土保持的疑慮，始終憂心忡忡.....</span></p>\n<p><span> </span></p>\n<p><span>這幾天由於我的部落（銅門）發現數棵紅檜/扁柏等珍貴原木，準備被林務局運出部落，而不論是清理風倒木或是砍伐，都已經嚴重破壞森林，以及水土保持，而且此項作業完全沒有知會部落族人，讓族人感覺傳統領域不被尊重，原基法形同虛設....我們部落決定不會是唯一，這議題絕對也不會是現在才發生，而對於部落族發起這次的抗爭訴求很簡單，有位ㄧ起參與守護行動的80歲的Ba ki（祖父輩）連續陪伴了好幾天，在12/29日下午昏迷，在倒下前，他剛好接受訪問時說道：『這些祖先木頭，ㄧ定要留在部落，要不然...我會很難過』對！部落族人的訴求很乾淨，將這些巨木留在部落，我們要紀念這次的抗爭，這些樹木要警惕人們，因為土石流而死傷的族人，因為買賣而被破壞的山林....如此純粹卻如此悲傷呀....這不止是議題，不只是為了權益，更喚醒的屬於人與自然古老的記憶，從神話開始到祖先記憶，乃至守護山林....</span></p>\n<p><span> </span></p>\n<p><hr></p>\n<p><span><a href=\"#_ftnref1\">註</a>1 <strong>水土保持法 </strong><strong>第12</strong><strong>條</strong></span></p>\n<p><span> </span></p>\n<p><span>水土保持義務人於山坡地或森林區內從事下列行為，應先擬具水土保持計畫，送請主管機關核定，如屬依法應進行環境影響評估者，並應檢附環境影響評估審查結果一併送核：</span></p>\n<p><span> </span></p>\n<p><span>一、從事農、林、漁、牧地之開發利用所需之修築農路或整坡作業。</span><span><br>\n<p>二、探礦、採礦、鑿井、採取土石或設置有關附屬設施。</span><span>&nbsp;</span><span><br></p>\n<p>三、修建鐵路、公路、其他道路或溝渠等。<br></p>\n<p>四、開發建築用地、設置公園、墳墓、遊憩用地、運動場地或軍事訓練場、堆積土石、處理廢棄物或其他開挖整地。</span></p></p>\n<p><span> </span></p>\n<p><span>前項水土保持計畫未經主管機關核定前，各目的事業主管機關不得逕行核發開發或利用之許可。</span></p>\n<p><span> </span></p>\n<p><span>第一項各款行為申請案依區域計畫相關法令規定，應先報請各區域計畫擬定機關審議者，應先擬具水土保持規劃書，申請目的事業主管機關送該區域計畫擬定機關同級之主管機關審核。水土保持規劃書得與環境影響評估平行審查。</span></p>\n<p><span> </span></p>\n<p><span>第一項各款行為，屬中央主管機關指定之種類，且其規模未達中央主管機關所定者，其水土保持計畫得以簡易水土保持申報書代替之；其種類及規模，由中央主管機關定之。</span></p>\n<p><span> </span></p>\n<p><span><a href=\"#_ftnref2\">註</a>2 <strong>水土保持計畫審核監督辦法 </strong><strong>第 3 </strong><strong>條</strong></span></p>\n<p><span> </span></p>\n<p><span>於山坡地或森林區內從事本法第十二條第一項各款行為，其水土保持計畫得以簡易水土保持申報書代替之種類及規模如下：</span></p>\n<p><span> </span></p>\n<p><span>一、從事農、林、漁、牧地之開發利用所需之修築農路：路基寬度未滿四公尺且長度未滿五百公尺者。<br>\n<p>二、從事農、林、漁、牧地之開發利用所需之整坡作業：未滿二公頃者。<br></p>\n<p>三、修建鐵路、公路、農路以外之其他道路：路基寬度未滿四公尺且長度未滿五百公尺者。</span><span><br></p>\n<p>四、改善或維護既有道路者。</span><br></p>\n<p><span>五、開發建築用地：建築面積及其他開挖整地面積合計未滿五百平方公尺者。</span><br></p>\n<p><span>六、堆積土石：土石方未滿五千立方公尺者。<br></p>\n<p>七、其他開挖整地：挖填土石方，其挖方與填方之加計總和未滿五千立方公尺者。</span></p></p>\n<p><span> </span></p>\n<p><span><a href=\"#_ftnref3\">註</a>3 <strong>原住民基本法 </strong><strong>第21</strong><strong>條</strong></span></p>\n<p><span> </span></p>\n<p><span>政府或私人於原住民族土地內從事土地開發、資源利用、生態保育及學術研究，應諮詢並取得原住民族同意或參與，原住民得分享相關利益。</span></p>\n<p><span> </span></p>\n<p><span>政府或法令限制原住民族利用原住民族之土地及自然資源時，應與原住民族或原住民諮商，並取得其同意。</span></p>\n<p><span> </span></p>\n<p><span>前二項營利所得，應提撥一定比例納入原住民族綜合發展基金，作為回饋或補償經費。</span></p>"}, {"nid": 1915, "title": "【豐山現勘】遊園驚夢記", "original_topic": "森林與林業政策", "adopted_cats": ["森林守護與林業改革"], "content": "<p><span>石夢谷、仙夢園位於嘉義豐山，是阿豐縱走線的美麗景點，名噪一時。石夢谷登山步道在阿里山國家風景區規劃中屬C級步道，亦即路程較短且坡面和緩，易於民眾健行之步道，如今卻鮮為人知。 </span></p>\n<p><span>2014年一月中，隨著「我們的島」和楊國禎老師去走了一趟。</span></p>\n<p><span> </span></p>\n<p><span>登山口海拔一千，一路是整理過的步道，枕木、石階，偶見空心磚，不陡卻一路堅定向上，約莫一個小時的路程抵達仙夢園，海拔爬升三百公尺。陡坡上幾層狹長的腹地種滿了果樹，山櫻花和各式各樣的蔬菜，房舍幢幢大門深鎖，仙夢園三字大大的匾額旁竟然還有張門牌，石鼓盤57之2號，不難想像之前一位難求的熱鬧景像。這裡的視野很好，眺望著對面山壁，曬冬陽聽楊老師講解這一帶的地質環境。阿里山山脈主要由地質年代較年輕的砂岩、頁岩或砂頁岩互層所組成，溪流經過侵蝕切割成深深的溪谷，留下了一塊平均海拔約兩千公尺的平台，那裡，曾經有全台灣最繁茂的檜木林。</span></p>\n<p><span> </span></p>\n<p><span>穿過仙夢園後方的孟宗竹林，一路大多腰繞，緩緩而上。注意到第一棵紅檜時GPS顯示海拔為一千五，樹上有林務局掛的小牌，編號46。楊老師不斷停下來端詳秋海棠，他說這裡秋海棠種類很多，或許還有尚未發表的新種；而我只知道爬山缺水的時候可以找秋海棠，紅色的葉柄嚼起來酸酸的，會生口水。</span></p>\n<p><span> </span></p>\n<p><span>一路看見層次豐富的綠，聽見黃藤、牛樟、鬼石礫、大葉石礫......但大多就像陌生人的名字一樣，聽完就忘了。嗟，孺子不可教也。</span></p>\n<p><span> </span></p>\n<p><span>最後一段路潺潺水聲越來越近，步道接上一片平緩開闊的岩盤，石夢谷到了。</span></p>\n<p><span><img alt height=\"447\" src=\"/sites/cet-taiwan.org/files/20140113035.JPG\" width=\"660\" loading=\"lazy\"></span></p>\n<p><span> </span></p>\n<p><span>此處特殊的巨石壺穴河床在我們的生活經驗裡不常見，初來乍到恍若另一個世界，再加上霧林帶午後總是雲霧繚繞，不真實的感覺那麼真實，石夢谷這個名字起的真妙。</span></p>\n<p><span><img alt height=\"445\" src=\"/sites/cet-taiwan.org/files/20140113045.JPG\" width=\"660\" loading=\"lazy\"></span></p>\n<p><span>適逢旱季水量不大，但水極清澈。往上游走不久出現了雙壺穴，像是巨大動物的腳印。會出沒在這裡的應該是鹿神吧？石夢谷這個名字幻化得更加真實了。 </span></p>\n<p><span>溪谷在此一分為二，取左前行，立刻就進入森林。森林茂密但路徑清楚，石上青苔留下許多釘鞋的痕跡，顯然此處常有人來。</span></p>\n<p><span><img alt height=\"446\" src=\"/sites/cet-taiwan.org/files/20140113050.JPG\" width=\"660\" loading=\"lazy\"></span></p>\n<p><span> </span></p>\n<p><span>海拔一千七，是一處平緩的山谷，森林以闊葉樹為主，樹上佈滿附生植物，想必終年水氣豐沛。我們到訪時山神卻以陽光相迎，走起來舒服清爽，松蘿閃耀著金黃色的光芒，讓人忍不住勾起笑意。玉山箭竹夾道相迎，柳葉山茶正開花，輕飄飄落下的白色小花瓣微微緩解了此行肅穆的心情。 </span></p>\n<p><span><img alt height=\"493\" src=\"/sites/cet-taiwan.org/files/201401%20%E8%B1%90%E5%B1%B1%E7%8F%BE%E5%8B%98.jpg\" width=\"660\" loading=\"lazy\"></span></p>\n<p><span>回想一百年前，當第一列阿里山運材車自二萬坪駛出，那是這片台灣原始檜木林悲慘命運之濫觴啊。 </span></p>\n<p><span>我們輕聲往森林更深處去，處處是日據時期伐木殘存的檜木樹頭。幾十年的光陰過去，四週的生物或許已由失去重要夥伴的傷痛中漸漸適應了，但在行走間猛然遇見一顆樹頭仍令我心驚，黑森森地猶如墓碑般觸目。</span></p>\n<p><span><img alt height=\"446\" src=\"/sites/cet-taiwan.org/files/20140114032.JPG\" width=\"660\" loading=\"lazy\"></span></p>\n<p><span> </span></p>\n<p><span>隊伍默默行進著，回首張望發現右手邊小丘上一處突兀的紅褐色，是了，這是我們此行的目的。 </span></p>\n<p><span>越靠近盜伐現場檜木的香氣越濃烈，那原本是我們喜愛的森林的氣味，如今聞起來有點腥，聞起來有點痛。</span></p>\n<p><span> </span></p>\n<p><span>附近陸續發現幾處支解檜木的位置，由於地表環境的潮濕，殘材已腐化為黑色。</span></p>\n<p><span><img alt height=\"446\" src=\"/sites/cet-taiwan.org/files/20140113066.JPG\" width=\"660\" loading=\"lazy\"></span></p>\n<p><span> </span></p>\n<p><span>一路上陸續發現了二十多顆被破壞的樹頭，讓人心痛又生氣；然而路上經過幾個山老鼠的營地及休息點垃圾四散得令人生氣卻又不解，是什麼人會接受自己休息甚至要過夜的地方是垃圾堆呢？他們不愛環境，連自己都不愛了。 </span></p>\n<p><span><img alt height=\"446\" src=\"/sites/cet-taiwan.org/files/20140114055.JPG\" width=\"660\" loading=\"lazy\"></span></p>\n<p><span>我們在山上過了一夜。隔天找到一棵被殺死的紅檜，是胸徑八十公分的大樹，楊老師估計長成需要兩百年的時間。好難想像兩百年是多久的時間，兩百年前清朝的皇帝是乾隆，台灣各地有抗清的起義，原住民還維持跟祖先一樣的生活方式。那兩百年後呢？等到你、我，我們的孩子，孫子，曾孫...都不在了，直到曾曾曾曾孫出世的時候，他們能不能看到這樣一片美麗的檜木林？ </span></p>\n<p><span>下山路上回想走來一路順暢，兩處較大的崩塌也已踩成堅固的路了，實在不懂為何封山，下山後再看看步道口林務局的封山告示，實在是諷刺。</span></p>\n<p><span><img alt height=\"501\" src=\"/sites/cet-taiwan.org/files/S__6799365.jpg\" width=\"660\" loading=\"lazy\"></span></p>\n<p><span> </span></p>\n<p><span>腦海裡浮現了牡丹亭的詞——這般花花草草由人戀，生生死死隨人願，便酸酸楚楚無人怨。似乎恰好道出檜木的心聲。 </span></p>"}, {"nid": 2117, "title": "林務局該何去何從？從陳保基的保育偏執論談起", "original_topic": "山林水土", "adopted_cats": ["森林守護與林業改革"], "content": "<p><span><img alt height=\"435\" src=\"/sites/cet-taiwan.org/files/20150414-1.jpg\" width=\"660\" loading=\"lazy\"><br>\n<p><span><span>山區開發－道路破壞山林、水文，切割坡腳</span></span></span></p></p>\n<p><span>&nbsp;</span></p>\n<p><span>文／呂翊齊（地球公民基金會研究員）</span></p>\n<p><span> </span></p>\n<p><span>一場內湖漂流木疑雲，終於將國內沉痾已久的盜伐問題浮上檯面，迫使長久以來不知為何永遠擱置的森林法修法終於有機會過關，卻也讓立法院諸公背後糾葛的利益結構運作一一現形，看見所謂的經濟委員會是怎麼在『監督』森林管理。</span></p>\n<p><span> </span></p>\n<p><span>經濟委員會上周開了場盜伐專案報告回應民應，然而明明是討論盜伐的場合，農委會主委陳保基在接受陳明文委員質詢時，卻脫口而出『無限上綱的保育是一種偏執』，引起媒體軒然大波。前後事實脈絡究竟為何？先來還原當天的狀況，</span></p>\n<p><span> </span></p>\n<p><span>為避免斷章取義，完整節錄對話如下：（註）<a href=\"#_ftn1\">[1]</a></span></p>\n<p><span> </span></p>\n<p><span><em>（雙方原本在談論漂流木自由撿拾適宜性問題，突然話鋒一轉）</em></span></p>\n<p><span> </span></p>\n<p><span><em>陳明文：我今天要談的也是政策性的問題，台灣林業政策現在究竟是環境維護 </em></span></p>\n<p><span> </span></p>\n<p><span><em> 問題還是經濟問題？現在我們的林業政策好像是保育嘛，這也牽涉農</em></span></p>\n<p><span> </span></p>\n<p><span><em> 委會到底要不要升格為農業部！如果現在的林業政策只是保育..</em><em>（被</em></span></p>\n<p><span> </span></p>\n<p><span><em> 陳保基打斷）</em></span></p>\n<p><span> </span></p>\n<p><span><em>陳保基：<strong>我跟委員報告，其實台灣的森林管理值得好好坐下來檢討。無限上綱的</strong></em></span></p>\n<p><span> </span></p>\n<p><span><strong><em> 保育是對國土的偏執（明：你講的好！沒錯）民國二十年的森林和保安</em></strong></span></p>\n<p><span> </span></p>\n<p><span><strong><em> 林地，那時300</em></strong><strong><em>萬人和現在2300</em></strong><strong><em>萬人的環境，我們是用一樣的標準看</em></strong></span></p>\n<p><span> </span></p>\n<p><span><strong><em> 待的，這是不對的</em></strong><em>！ </em></span></p>\n<p><span> </span></p>\n<p><span><em>陳明文：（點頭）問題就在這裡，你的林務政策是沒有讓社會大眾了解的喔。我</em></span></p>\n<p><span> </span></p>\n<p><span><em> 們現在只有禁伐林，沒有營林政策喔（保搶著說：其實有的）有在哪裡</em></span></p>\n<p><span> </span></p>\n<p><span><em> 啊？講難聽點，你們現在只有森林遊樂區的開發經營，其他就是保育，</em></span></p>\n<p><span> </span></p>\n<p><span><em> 林業政策在哪裡我看不出來。</em></span></p>\n<p><span> </span></p>\n<p><span><em>陳保基：所以從今天開始我們人工林採伐利用的政策要拿出來，包括整個林地的</em></span></p>\n<p><span> </span></p>\n<p><span><em> 正當性也要檢討。</em></span></p>\n<p><span> </span></p>\n<p><span><em>陳明文：你講的的確比過去更具有突破性思維啦，但你的林業政策和保育究竟要</em></span></p>\n<p><span> </span></p>\n<p><span><em> 放在哪裡我覺得要好好思考（..</em><em>開始講過去林務局多風光，現在沒人理</em></span></p>\n<p><span> </span></p>\n<p><span><em> 的原因是甚麼？就是因為現在沒有營林了）你們要好好檢討，<strong>譬如說我</strong></em></span></p>\n<p><span> </span></p>\n<p><span><strong><em> 們嘉義縣，以前是伐木的中繼站，伐木工人都住在哪邊，所以才有很多</em></strong></span></p>\n<p><span> </span></p>\n<p><span><strong><em> 林班地，但現在都禁伐木啦，開始轉型變為觀光勝地，一年有一百萬的</em></strong></span></p>\n<p><span> </span></p>\n<p><span><strong><em> 觀光人次，但你們還用林班地來管理，這就是政策問題！</em></strong></span></p>\n<p><span> </span></p>\n<p><span><em>陳保基<strong>：所以我們現在正考慮解編當中</strong>，<strong>就是用這邏輯</strong><strong>…</strong></em></span></p>\n<p><span> </span></p>\n<p><span><em>陳明文<strong>：如果你還要當農業部長，就要有林業政策，沒有林業政策人家就把你</strong></em></span></p>\n<p><span> </span></p>\n<p><span><strong><em> 移撥到環資部去啦，甚至我認為什麼保育其實都可以移到地方政府…</em></strong></span></p>\n<p><span> </span></p>\n<p><span></span></p>\n<p><span> </span></p>\n<p><span>陳主委主張的「保育偏執論」指甚麼？從這段對話可以簡單歸納為幾個關鍵字：林業政策（主要是人工林伐採經營）、林地正當性（包括林班地解編、保安林解編）以及林務局組織改造。 </span></p>\n<p><span> </span></p>\n<p><span><strong>保育太過偏執所以要鬆綁山坡地？</strong></span></p>\n<p><span> </span></p>\n<p><span>首先，談人工林能夠理解，過往多數環保團體抨擊的是歷代政權對於原始天然林的摧殘，對於目前42萬公頃的人工林該如何利用，只要遵循林地分級與避開敏感區等原則，方向應不至於有太大分歧。況且從陳主委特別提及「300萬人的森林管理標準」與「保安林」，似乎也與人工林無關。所以言下之意是甚麼，從前後對話我只能解讀為：<strong>台灣現況人口太多，為了合理發展，所以保安林和林班地必須解編？</strong></span></p>\n<p><span> </span></p>\n<p><span> </span></p>\n<p><span><strong>保安林解除意味森林消失，林班地解編等同公有林私有化，讓濫墾、道路與建築持續在山坡地超限蔓延，是不是有哪裡誤會了？</strong></span></p>\n<p><span> </span></p>\n<p><span> </span></p>\n<p><span>在1996年賀伯颱風創造了土石流一詞、921大地震一舉震碎地體之後，後續十來年的極端氣候只讓每次風災更死傷慘重、山區更加柔腸寸斷。正是因為台灣狹小土地無法承擔持續攀升的稠密人口需求，山坡地才會超限發展。更何況80年前的環境壓力與現今不可同日而語，按理來說現況更要讓人遠離山區風險才是上策，如此言論不僅嚴重與環境事實脫節，也與社會大眾的對於國土保安的心理期待背道而馳。無論是真心相信的價值還是迎合立委之詞，我都看不出邏輯何在。 </span></p>\n<p><span><img alt height=\"440\" src=\"/sites/cet-taiwan.org/files/20150414-2.JPG\" width=\"660\" loading=\"lazy\"><br>\n<p><span><span>霧社萬大水庫的淤積</span></span></span></p></p>\n<p><span> </span></p>\n<p><span>接下來再看看同屬嘉義縣的翁重鈞委員的發言：</span></p>\n<p><span> </span></p>\n<p><span>&nbsp;</span></p>\n<p><span> </span></p>\n<p><span><em>（同樣原本以盜伐問題開場，而後話題一轉..</em><em>）</em></span></p>\n<p><span> </span></p>\n<p><span> </span></p>\n<p><span><em>翁重鈞：主委你剛剛說的有一件事情我蠻感動的，300</em><em>萬與2300</em><em>萬的山坡地管</em></span></p>\n<p><span> </span></p>\n<p><span><em>&nbsp;&nbsp;&nbsp; </em><em> 理都一樣，不能過度強調保育。</em></span></p>\n<p><span> </span></p>\n<p><span> </span></p>\n<p><span><em>陳保基：我認為應該有充分的空間讓國人生活，而不是讓所有人集中在很小的空</em></span></p>\n<p><span> </span></p>\n<p><span><em> 間，這是錯的！不是保育就是對的，這些都市有必要這樣集中，炒土地</em></span></p>\n<p><span> </span></p>\n<p><span><em> 嗎？這是需要思考的。</em></span></p>\n<p><span> </span></p>\n<p><span> </span></p>\n<p><span><em>翁重鈞：這就是我過去一直跟你強調，做政府官員要有同理心，林務局局長跟我</em></span></p>\n<p><span> </span></p>\n<p><span><em> 到嘉義不計其數，每一次遇到都是山坡地管理的問題，<strong>最近很多都是在</strong></em></span></p>\n<p><span> </span></p>\n<p><span><strong><em> 講國有財產署管理的問題</em></strong><em>。所<strong>以我們的國土規畫都沒有很宏觀角度或周</strong></em></span></p>\n<p><span> </span></p>\n<p><span><strong><em> 詳的計畫來做整合，太過急就章，反而使我們沒有和基層民意走在一</em></strong></span></p>\n<p><span> </span></p>\n<p><span><strong><em> 起。所以不只是森林法，包括林班地、山坡地的管理該都應該好好修。</em></strong></span></p>\n<p><span> </span></p>\n<p><span> </span></p>\n<p><span><em>陳保基：<strong>我們都有提出來，這是讓</strong><strong>21</strong></em><strong><em>世紀的台灣不會生活在13</em></strong><strong><em>世紀的環境裡</em></strong></span></p>\n<p><span> </span></p>\n<p><span><strong><em> 面。</em></strong><em>自然環境的保育是非常嚴重的事情。</em></span></p>\n<p><span> </span></p>\n<p><span> </span></p>\n<p><span><em>翁重鈞：提出來之後要趕快去做，在修的時候尤其希望要有同理心，要多聽基層</em></span></p>\n<p><span> </span></p>\n<p><span><em> 民意的聲音，要整合多方意見啦，不是只聽某一些人或媒體的主張，這</em></span></p>\n<p><span> </span></p>\n<p><span><em> 樣政策反而沒有辦法符合我們鄉親的想法，也不一定是對的。所以包括</em></span></p>\n<p><span> </span></p>\n<p><span><em> 林班地、水土保持和山坡地我都希望你好好處理，這樣才能得民心。</em></span></p>\n<p><span> </span></p>\n<p><span><em>陳保基：有，我們都有在處理，只是還沒提出來。 </em></span></p>\n<p><span> </span></p>\n<p><span> </span></p>\n<p>&nbsp;</p>\n<p><span>翁委員講得很隱晦，但不外乎又是林班地解編、山坡地鬆綁等政策方向，才能合乎「民意」。所謂民意是哪些？還不是長期藉由租地造林契約於國公有林違法墾植的特定利益團體或人士。以嘉義來說，最經典的就是佔用國有林種植山葵的林農，也包括全台各地佔據集水區上游的高接梨、高山茶或高麗菜等違規經濟作物區，其中又以台中為其首要。</span></p>\n<p><span><img alt height=\"372\" src=\"/sites/cet-taiwan.org/files/20150414-3.JPG\" width=\"660\" loading=\"lazy\"><br>\n<p><span><span>阿里山國有林班地種山葵（台南市社區大學研究發展學會提供）</span></span></span></p></p>\n<p><span> </span></p>\n<p><span>山坡地保育具有公共性意義，民代因選票考量混淆特定利益與公眾利益的界線就算了，但身為施政者竟然以「人口需求」如此違反常理的理由服膺關說，甚至拿保育做文章，令人難以苟同。 </span></p>\n<p><span> </span></p>\n<p><span><strong>林班地濫墾的終極解套方案：混農林</strong></span></p>\n<p><span> </span></p>\n<p><span> </span></p>\n<p><span>不過最讓人冷汗直流的是，活生生的公開關說並不只陳明文和翁重鈞，<strong>桃園立委廖正井的質詢最後也停在大園防風保安林的解編，而台中立委江啟臣則乾脆連開場白都省了，直接切入重點，訊問自己要求的混農林政策進度如何</strong>。（註）<a href=\"#_ftn2\"><strong><strong>[2]</strong></strong></a></span></p>\n<p><span> </span></p>\n<p><span> </span></p>\n<p><span><strong>混農林是甚麼？說穿了同樣是為了國有林內違法墾農解套的一種方式。</strong>以台中和平鄉來說，從2012開始台中市政府便和江委員聯手施壓林務局將和平一帶的違法甜柿墾區合法化，步驟有三：先以專案核准通過行政院、再解編國有林移交給國產署，最後制定一套專屬的「混農林」規定，只要在林地上種植30%的林木，甜柿種植便是合法，還可享有天然災害補助。總計海拔1,300公尺以下佔地6,494公頃之國有林班地中，初步可規劃適合種植甜柿區預計約2,154公頃。江委員甚至在2012年6月發布的新聞稿中，不諱言將讓「林班地違法使用的歷史問題帶來一線生機」。（註）<a href=\"#_ftn3\"><strong><strong>[3]</strong></strong></a><strong> </strong></span></p>\n<p><span> </span></p>\n<p><span> </span></p>\n<p><span><span><strong>利益把持才是環資部組改卡關的真正主因</strong></span> </span></p>\n<p><span> </span></p>\n<p><span>回顧這幾年僵持不下的環境資源部組織改造，一群立委端出林業存廢的假議題，認為林務局挪去環資部等同宣告消滅林業，企圖影響已經定案的組改方案，以至於環資部組改延宕至今。然而從這場盜伐專案報告呈現的面貌來看，即使輿論最關切的是珍貴木與森林管理問題，這群不分藍綠，各代表著嘉義、桃園和台中違法利益的委員們最在意的仍是山坡地鬆綁。更讓人匪夷所思的是農委會主委不僅沒有力守公眾利益的底線，還提出似是而非的邏輯為其抬轎。林務局的去留究竟是會消滅林業還是消滅選票，事實不言而喻。</span></p>\n<p><span> </span></p>\n<p><span> </span></p>\n<p><span>無論陳主委的「保育偏執論」意圖為合，都屬於個人言行範圍，是非公允應由社會大眾檢視。<strong>背後真正值得大家深思的是，如此缺乏保育思維的經濟委員會，如此赤裸的利益綁樁，我們還敢繼續讓森林管理的最高機構繼續留在農業部，繼續讓這群立委用預算權把持林務局和台灣的山林嗎？</strong> </span></p>\n<p><span></span></p>\n<p><span> </span></p>\n<p><hr></p>\n<p><span><a href=\"#_ftnref1\">[1]</a> 立法院議事ＩＶＯＤ隨選系統<a href=\"http://ivod.ly.gov.tw/Committee#date=2015-04-01&amp;page=1&amp;type=movie&amp;comt=5\">http://ivod.ly.gov.tw/Committee#date=2015-04-01&amp;page=1&amp;type=movie&amp;comt=5</a></span></p>\n<p><span> </span></p>\n<p><span>路徑：以主辦單位查詢／經濟委員會／日期20150330</span></p>\n<p><span> </span></p>\n<p><span><a href=\"#_ftnref2\">[2]</a> 江委員於質詢特別提及，其要求的混農林政策原訂林務局應於今年３月底完成草案送交行政院審定，林務局回覆表示目前已送交農委會，將盡速辦理完成，值得社會注意。</span></p>\n<p><span> </span></p>\n<p><span> </span></p>\n<p><span><a href=\"#_ftnref3\">[3]</a> 資料來源:江啟臣委員新聞稿(20120627): <a href=\"http://www.ly.gov.tw/03_leg/0301_main/dispatch/dispatchView.action?id=37963&amp;lgno=00010&amp;stage=8\">http://www.ly.gov.tw/03_leg/0301_main/dispatch/dispatchView.action?id=37963&amp;lgno=00010&amp;stage=8</a></span></p>\n<p><span> </span></p>\n<p><span>&nbsp;</span></p>"}, {"nid": 2878, "title": "風災過後，種樹綠化不應是政商口袋的永續工程", "original_topic": "山林水土", "adopted_cats": ["氣候變遷與調適", "森林守護與林業改革"], "content": "<p><div>八十多歲的母親，在金門那頭的電話說：一輩子沒經歷過這麼大的颱風，狂風暴雨的那夜，屋瓦被掀、玻璃破碎吹了滿屋，內心的恐懼可比八二三炮彈。莫蘭蒂颱風除了帶來農損、建物損害之外，樹木的折損的數量更是龐大。近年來的颱風豪雨，揭示全球氣候極端化已是趨勢，因此風災後的植樹復建，不該只是把原來的樹種回去，而應該徹底檢討綠化政策，強化因應氣候變化的韌性。<br></p>\n<p>&nbsp;</div></p>\n<h3><strong>綠化工程忽視台灣生態特性</strong></h3>\n<p><div>台灣有四千多種維管束植物，都是經過大自然千錘百鍊下，得以適應存活的物種，無論從多樣性或特有種類角度來看，台灣都可以說是植物大國。生長在海邊的抗鹽耐風，生長在陡坡上的耐旱抓地力強，不同海拔、不同地區各有適應得很好的物種，有的耐陰，有的嗜好陽光。如果要種樹，就得考慮台灣不同地區的氣候環境，選擇適合在地的樹種，「適地適種」應該是綠化政策的基本款。</div></p>\n<p>然而，半世紀以來，綠化工程幾乎完全忽視台灣的生態特性。山坡地上我們把原生林砍除，種上外來種，或者非在地的本土種；公園和行道路充斥著外來種，根據筆者曾進行過的高雄市校園和行道樹的調查，大約七成以上都是種植外來種。種樹其實很政治，外來的國民黨政權連種樹都喜歡外來的，但號稱本土政權的民進黨，綠化政策與前朝大都是無縫接軌。</p>\n<p>當然，樹種選對了，不表示一定長得好。一棵樹要在台灣的公共空間上好好活著，並不容易，除了颱風豪雨的考驗，更多的是人謀不臧。</p>\n<p><div></p>\n<h3><strong>行道樹要變成「我們的樹」才不會一再受虐</strong></h3>\n<p>種樹時，樹根包裏著不織布袋入土，植穴太小根系無法開展，或者被水泥完全封死，不當修剪導致病變、重心失衡，這些都是愛樹人士講了幾十年的陳年問題，另外，行道樹也不是人人喜愛，有些住戶店家怕小偷從樹上爬進屋子、怕蟲害、怕根系破壞建築、嫌掃落葉麻煩、風水不好、擋招牌、不會開花…...，這些問題並非完全無解，只是政府沒有看重這件事。</p>\n<p></div></p>\n<p><div>如果我們期望台灣的公共空間可以看到「百年大樹」，就要先確立不同類型公園，公共空間，行道樹等的屬性定位，考量氣候、樹種、地形、空間土壤條件、日常管理等面向，發展出各種符合台灣生態的作業準則。例如行道樹，就很需要考慮社會文化因素，建立合宜的公共討論機制，和店家住戶建立起商議程序，讓行道樹變成人們心中「我們的樹」，避免樹木們一再受虐。</div></p>\n<p><div>&nbsp;</div></p>\n<p>台灣的公園有什麼綠化典範嗎？宜蘭羅東運動公園這幾年間因颱風侵襲下，有很多樹木被連根拔起，今年筆者再度重遊時深感景色黯然褪色。然而，公園內彷照台灣原生林建照的六個翡翠鍊狀山丘，裡面的樹木植物卻仍是多樣青翠，這項植栽設計，很適合災後重新設計綠化工程的參考，這是筆者很欣賞的造園案例。</p>\n<p><img alt src=\"http://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20160921-051.jpeg\"><br>\n<p><span>宜蘭羅東運動公園的九個翡翠山丘，營造了一個以台灣原生植物為主的森林，裡面有喬木、灌木、草本植物，物種豐富又禁得起颱風考驗。</span></p></p>\n<h3><strong>金門縣20多億經費復育樹，應以原生植物為目標</strong>&nbsp;</h3>\n<p><div>這一次金門縣號稱折損了五百萬樹木植栽，復育經費初估高達二十多億。筆者建請金門縣政府和林務局，先釐清折損與需要補植的數量，以免被質疑為了爭取經費而誇大損害；再者，應結合國家公園的植物生態研究基礎，以復育金門的原生植物生態為目標，全盤提出「適地適種、生態綠化」的復育計畫，尤其不要再任由政商合謀引進外來物種了。例如：這次風災後，縣府宣稱倒下一百萬棵灌木，如果都是外來種灌木，那麼這些錢不該再花了。</div></p>\n<p><div>&nbsp;</div></p>\n<p><div>莫蘭蒂颱風導致那麼多的樹木折損實在令人心痛，但這是大自然給我們的警示，執政者應該把台灣的綠化政策全面導向本土化、在地化、生態化，強化因應極端氣候的「韌性」，不要讓種樹綠化變成政商口袋裡的永續工程—名符其實的搖錢樹，這也算是還給台灣土地一個轉型正義吧。</div></p>\n<p>&nbsp;</p>\n<p>（本文為2016/9/20<a href=\"https://www.twreporter.org/a/opinion-school-relocation-dispute\"><span></span></a><a href=\"https://www.newsmarket.com.tw/blog/88192/\">【上下游News&amp;Market新聞市集】投書</a>）</p>"}, {"nid": 3096, "title": "莫讓歷史的斷裂　蒙蔽傳統領域的確立－【環原台灣系列講座】專題報導", "original_topic": "國土治理;環境正義", "adopted_cats": ["森林守護與林業改革", "國土計畫"], "content": "<p><img alt=\"20170912-001.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u144/20170912-001.jpg\"><br>\n<p><span>蔡英文政府需要思考的，就是如何找回原住民口傳裡的歷史真實，找回部落主體性，讓原住民自己決定原住民的生活空間該長什麼樣子。（攝影：李隆揆）</span></p></p>\n<p>你是否也有這樣的經驗？某條普通的街、某個不起眼的房子、某家別人看上去沒什麼特別的小店，對你卻有著深刻意義。我們對一個場所的記憶，賦予了它形式之上的人文意涵，而這樣的記憶，隨著時光堆疊成為歷史。許多時候，當我們談論開發、都更、都市重劃的爭議時，背後都是歷史與情感的長河。而這條歷史之河，正是一個城市、一個民族的集體記憶與文化血脈。</p>\n<p>這幾個月來沸沸揚揚的原住民族傳統領域<a href=\"http://www.upmedia.mg/news_info.php?SerialNo=13827\">劃定爭議</a>，亦是如此。</p>\n<p>小米穗原住民文化基金會與地球公民基金會近期有一系列的「環原台灣」講座，上月中的一場《<a href=\"https://www.cet-taiwan.org/node/3032\">轉型正義起步走：從傳統領域確立開始</a>》座談裡，官大偉老師與林淑雅老師所談及的問題與案例，正直指了政府（無論過去的國民黨政府或當前的民進黨政府）斷裂了歷史脈絡思考的重大瑕疵。</p>\n<p>何以政委張景森會說出「不能憑口傳歷史剝奪他人財產」這種話？這句話隱含著對原住民歷史的否定、對轉型正義的輕蔑、對現代財產權觀念與原住民傳統領域觀念的混淆，以及更重要的，這句話是對發展主義的背書。再由前瞻建設等其他政策看來，說當前政府走的還是<a href=\"http://www.upmedia.mg/news_info.php?SerialNo=15015\">發展主義</a>的老路，一點也沒冤枉他們。</p>\n<h3><strong>你的秘境美景　我的神聖祭場</strong></h3>\n<p>關於原住民傳統領域上的歷史記憶，官大偉老師舉了一個令人動容的例子。位於都蘭部落的景點<a href=\"http://e-info.org.tw/node/89723\">都蘭鼻</a>，對觀光客來說，是個美麗的海角秘境，可以讓他們下車打卡拍照戲水、讚嘆台東之美；在觀光業者眼裡，這是塊叫人垂涎的肥肉，若取得土地權或開發經營權，此處擁有很好的投資潛力。</p>\n<p>但在部落族人眼中呢？那裡是神聖的祭場，是千百年來，他們訓練年輕人傳承文化、與祖靈連結的場所，是與都蘭的文化密不可分的崇高存在。官大偉說：</p>\n<p><blockquote><p><strong>「如果你知道都蘭阿美族的歷史，你就不會變成一個狂妄的土地開發者，狂妄得想用這裡來賺觀光的錢。」</strong></p></p>\n<p></blockquote></p>\n<p>每一個民族都有其土地記憶，每個生根於台灣的家族，都對自己的祖傳之地有著情感—更何況是對於原住民部落，在集體共享的資源基礎上，共同耕作、狩獵、舉行祭儀的那些地方，它們不只是一處山坳、一條河流、一片海灘，而是精神依託。</p>\n<p><img alt=\"20170912-002.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u144/20170912-002.jpg\"><br>\n<p><span>原住民心中的土地記憶，不只是一處山坳、一條河流、一片海灘，而是精神依託。（巴奈／攝影：葉信菉）</span></p></p>\n<p>有人會說，不是早已有原住民保留地嗎？但事實上，原住民失去土地的歷史中充滿國家暴力的影子。在那個原住民老人家不識漢字、不諳如何與政府打交道的威權年代，太多原住民傳統領域都沒有被劃進保留地。官大偉老師舉例林務局與原住民族間常見的一種爭議：<strong>台灣在從日本殖民政府到國民黨政府的過程中，原住民在山林中所受的殖民狀態並未解除，我們</strong><strong>90%</strong><strong>以上的森林仍歸國有，而這使得山區部落族人每每在使用傳統領域資源時遭到林務局驅逐，甚至遭起訴。有族人回去家裡祖傳的田地種香菇，就被抓了，因為根據法規，那是國有林地。然而所謂的國有林地，從最初就是原住民族的家園。</strong></p>\n<p>這些法規從制定之初，就已排除了原住民既有的、早於國家存在的土地主權。甚至其中還有令人髮指的手段—電影《太陽的孩子》裡曾提及一段真實的歷史：當年花蓮港口部落的族人帶著他們的地籍資料、向豐濱鄉鄉公所申請劃編原住民保留地，最後卻發現沒有劃編進去，祖傳農地全變成了國有地。為什麼？鄉公所回應：<strong>因為颱風來，資料遺失了。（你沒看錯，他們就是兩手一攤，說遺失了。）</strong></p>\n<h3><strong>當傳統領域面對現代財產權</strong></h3>\n<p>因此，無論公有地、私有地，太多土地上都雜揉著過去歷史錯誤的成分，而這裡頭的既成問題是可以被導正的—透過「傳統領域劃定納入私有地」。族人要求的真的不多，當私有地被劃進傳統領域，地主的財產權不受影響，無論是自己的住宅、農田或小店，都不會遭到干涉。唯有在進行「重大影響之開發」前，需經過部落會議裁決，由「實際住在這裡、對這裡有深厚歷史記憶與文化連結的人群」來決定他們是否接受這樣的影響。</p>\n<p>當然，這也包含了部落、政府、業者三方協商的過程—如果族人能接受開發，那是什麼樣的開發？能否兼顧自然生態與人文傳統？工程及後續經營要如何不干擾部落？當部落人們實際參與進規劃裡，即便開發，也會是相對建康的。這是藉由找回部落主體意識與權利，來做到開發行為的把關，不讓美麗灣飯店侵占杉原灣或日月潭邊觀光設施林立等這類憾事重演。</p>\n<p>歌手巴奈說，她自己的成長過程中早已與土地斷裂，而她之所以投身並堅持找回真正的傳統領域範圍，是為了給將來的孩子們一條回家的路。當老人家說，我們傳統的植物怎麼種作或採集、怎麼使用、有著哪些故事時，妳卻未曾親手觸摸過它們、不知能去哪裡採集它們、對老人家口中那些地名毫無實感⋯那所謂的文化傳承，只會淪為奢談。當一個民族的文化不存在於生活裡，只在博物館裡，那這個文化，便是死了。</p>\n<h3><strong>從多元壓迫走向多元文化</strong></h3>\n<p>蔡英文總統選前談多元文化、多元族群的價值，強調<a href=\"http://www.upmedia.mg/news_info.php?SerialNo=21436\">原住民族轉型正義</a>的重要，但選後至今只兌現了道歉，在原住民傳統領域的劃定上，這個政府仍然只許諾了公有地，這近乎表明了執政者依舊以開發的經濟價值為重。十分務實地來看開發，多數原住民傳統領域內的觀光開發主事者皆是外來漢人，也不問過族人意見，這樣缺乏脈絡的經濟行為，對於文化的存續是嚴重威脅。</p>\n<p>於是長久以來，原住民族文化淪為觀光的展演品，淪為象徵性（實為刻板印象）的歌舞配角，讓政府和業者拿來消費，賺取歌舞昇平的多元文化表象及觀光收益，在結構性的壓迫下，原住民只能學著融入漢人的生活方式維生，卻換來貧窮—被剝奪了傳統知識的價值、被剝奪了獵槍、在自己的土地上流浪。為了維生，許多人紛紛離鄉前去大城市工作，年輕一代的原住民孩子隨著定居城市的父母在都會區生長，不復記憶。文化便是如此消亡的。</p>\n<p>我們還要忍受這樣的不正義多久？還要蒙起眼睛、假裝看不見歷史多久？蔡英文政府需要思考的，正是張景森所否定的那些。找回口傳裡的歷史真實，找回部落主體性，讓原住民自己決定原住民的生活空間該長什麼樣子。唯有在徹底移除殖民遺緒後，國家和原住民的平等對話，才得以展開，得以共存共榮。</p>\n<p>&nbsp;</p>\n<p><strong>※</strong>作者畢業於台大外文系、美國哥倫比亞新聞研究所。曾先後任職《中央社》、《破週報》、《眉角》、《紐約時報》等媒體。關注社會運動、藝文與國際政治。現為文字工作者。​</p>\n<p>》此為<a href=\"https://www.cet-taiwan.org/events/3030\">【環原台灣系列講座】</a>第二場：<a href=\"https://www.cet-taiwan.org/events/3032\">轉型正義起步走：從傳統領域確立開始</a>之專題報導。</p>\n<p>》原文刊於2017/08/14上報－<a href=\"http://www.upmedia.mg/news_info.php?SerialNo=22572\">劉美妤專欄：莫讓歷史的斷裂　蒙蔽傳統領域的確立</a></p>"}, {"nid": 3110, "title": "如果你是行政院長，國家公園和林務局會放在農業部？環資部？", "original_topic": "國會/政策", "adopted_cats": ["森林守護與林業改革"], "content": "<p>文／李根政（地球公民基金會執行長）</p>\n<p>\t<a href=\"https://www.udn.com/news/story/7314/2742240\">賴清德院長日前召集環保署、農委會相關首長討論組改後拍板定案</a>，林務局原則上歸屬於未來之環資部，但林業生產、遊樂區管理及林業試驗所，則留在未來的農業部。對於這樣的決策，個人肯定賴院長維持了水、土、林整合的組改方向，從流域治理的新思維，面對極端氣候下的挑戰。</p>\n<p><span><strong>但是，令人不安的是：幾乎全數位於161萬公頃的國有林中「國家公園」（約30萬公頃國有林）定位不明，農業部保留「森林遊樂區」（約4.8萬公頃國有林）和「林業試驗所」（約1.2萬公頃國有林），極有可能增加跨部會協調困難，成為組改中最糟的情境。</strong></span><br>\n<p>&nbsp;</p></p>\n<p><h2>森林與保育：組改情境圖</p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u143/20171018-3.jpg\"><br>\n<p>&nbsp;</p></h2></p>\n<h3><strong>【問題 1】環資部主管國有林，但是國家公園96%都是國有林，卻留在內政部？</strong></h3>\n<p>現行內政部主管的國家公園面積約31萬公頃，超過96%的土地和林務局主管的161萬多公頃國有林班地重疊。舉個例來說：太魯閣國家公園中，都位在國有林中，而且其中還有合歡山森林遊樂區。</p>\n<p>為了避免事權分散、資源重覆投資、機關相互競爭，國家公園本應與未來環資部「森林及保育署」的業務進行整合，加上其原本的保育定位，斷無理由要留在內政部，否則原本是二個部會要協調，會變成三個部會協調，失去組改意義。</p>\n<p>然而，日前行政院發言人徐國勇拋出了切割國家公園方案，要把所謂高山型國家公園移到環資部，觀光遊憩型留在內政部，這更是治絲益棼的作法，凸顯了行政院組改腳步的凌亂，對國家保育體系的欠缺理解和改造的遠見。</p>\n<p>\t<span><strong>國家公園是透過從生態保護區、特別景觀區、遊憩區到一般管制區進行分區管制，其目標是保育、育樂及研究，如果真有國家公園完全導向了觀光遊憩，意味著是嚴重的經營不當和瀆職，應該要被檢討；如果國家公園系統要切割解構，則又是國家保育系統大變革，恐怕不是賴院長和幾個部長一次簡短的會議，可以做出好的決策。</strong></span></p>\n<p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u143/20171018-4.jpg\"><br></p>\n<p><span>合歡山（<span>李根政</span>攝）</span><br></p>\n<p>&nbsp;</p></p>\n<h3><strong>【問題 2】森林遊樂區屬於國土保育區，留在農業部適合嗎？</strong></h3>\n<p>其次，森林遊樂區留在農業部適合嗎？全國161萬公頃國有林中，共有22處森林遊樂區，總面積約4.8萬公頃，其中林務局管轄18處，約3.7萬公頃；退輔會森保處管了明池和棲蘭等二個森林遊樂區，約2,671公頃；另外，中興大學實驗林的惠蓀林場7,477公頃；台大實驗林溪頭園區2,514公頃。</p>\n<p>\t<span><strong>森林遊樂區的定位在於休閒遊憩，並非林木生產部門，台大和中興大學實驗林都是在大伐木時代的產物，在官營伐木結束26年後，如今已轉為遊憩、教育功能，其所在區位在國土計畫中勢必屬於國土保育地區，留在農業部實在不合理。</strong></span></p>\n<h3><strong>【問題 3】林試所管轄林地多為研究教育，何不轉入環資部？</strong></h3>\n<p>林業試驗所管轄了六個研究中心共約1.2萬公頃的國有森林，過去雖然做過許多的林業試驗研究，包括砍伐天然林改造為人工林。但是，大部分的林地仍為天然林的狀態，近年來更多數轉型森林生態研究和教育的基地。例如蓮花池、恆春、太麻里、福山、中埔、六龜研究中心，或者泗湖工作站致力於海岸林的試驗研究。</p>\n<p>更具指標性的是，從日治代就建立，正歡慶120週年的台北植物園的標本館—研究台灣植物多樣性與保育的重鎮。上述林試所的單位和特有生物中心改制到環資部的「生物多樣性研究所」性質接近，如今的組改方案卻分屬二個部會，實在不宜。</p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u143/20171018-5b.jpg\"><br>\n<p><span>目前林試所管轄的福山植物園，為教育研究功能，<br></p>\n<p>但依據目前組改計畫將歸入農業部</span></p></p>\n<h3><strong>【問題 4</strong><strong>】</strong>經濟林（國產木材）農業部與環資部管轄高度重疊，需要釐清</h3>\n<p>在這次組改中，台灣國產材—經濟林的主管機關定位確實相對複雜。</p>\n<p>目前國有林約有161萬公頃，其中林務局規劃約6-12萬公頃做為經濟林，也就是說超過94%以上的國有林是擔負保育和保安功能，就比例原則本應完整納入環資部，而非農業部。</p>\n<p>保育是包括了保護生物多樣性、永續明智的利用，環資部本來的任務就是環境資源的管理和永續性利用，例如：水利署移轉到環境資源部，還是主管水資源的利用，只是必需擺脫過往配合經濟部門的工具性角色，因此，有關森林暨保育署納入人工經濟林的經營管理，並無不當。</p>\n<p>如果依照賴院長這次的切割決策，將林產部門留在農業部，則意味著這6-12萬公頃的國有森林，其利用方式就需要進行跨部會的協商。</p>\n<p><span><strong>但不可否認的是，過去遺留數萬公頃的承租國有地林地造林，13.7萬公頃的私有林，36萬公頃農牧用地上約占半數土地上的既存森林，還有8萬多的林農，正是未來農業部和環資部高度重疊的地帶，在發展和國際森林認證接軌的新林業以及保育課題上，如何分工合作，是最需要釐清的組改課題。</strong></span></p>\n<p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u143/20171018-6.jpg\"><span>奮起湖柳杉林疏伐</span><br></p>\n<p>&nbsp;</p></p>\n<h3><strong>建議農業部應專注處理淺山到平原的農地議題</strong></h3>\n<p>台灣從淺山到平原的廣大地區，農地流失、違章工廠林立、生產環境劣化、鄉村空洞化、農民所得低落，已是農業部最嚴竣的挑戰。同時，根據農委會的資料顯示，當前淺山地區、農田生態系確實擁有高比例的保育類物種，且該區域開發壓力大，保育和生產矛盾叢生，必然得付出極高的心力才能調和其矛盾。</p>\n<p>農委會在第三次政黨輪替後，提出對地綠色環境給付、里山倡議等友善土地的新政策，正是面對上述挑戰的前瞻作法。在台灣農業和農鄉發展的關鍵時刻，把森林與保育主責機關移轉到環境資源部，讓農業部得以專心處理上述課題，未嘗不是一件好事。</p>\n<h3><strong>環資部成立的意義，在於因應全球氣候災難的組織整合與轉型</strong></h3>\n<p>就筆者認知：環境資源部的成立的意議，並非環保署的升格擴張，而是台灣作為全球氣候災難最弱脆國家之一，因應生存發展而進行的組織整合和轉型。過去主責污染防治的環保署，並未具有自然資源管理、因應複合式氣候災變的專業，也因此，在二級和三級機關的人事任命，一定要適才適所，而非淪為權力位置分配的競爭，更需要檢討四級機關的設置與人力分配，體現國家轉型的需求。</p>\n<p>例如：從1991年台灣禁伐天然林，官營伐木事業結束後，林務局的業務已大幅轉向生態保育，但是，組織架構仍停留在過去的伐木時代，也因此衍生許多錯誤政策，未來環資部成立的「森林及保育署」，保育部門就應該強化。</p>\n<p>此外，台灣的保育系統包括了國家公園、國家自然公園、野生動物保護區、野生動物重要棲息環境、自然保育區等，相關法規和主管機關多頭馬車，加上區外的生態保育、社區與原住民部落的參與治理等重大轉型課題，都需要好好梳理。這些事，在組改的過程應該要想清楚。</p>\n<p>組改是國家大事，需要明確的前瞻願景和理性規劃，雖然有法定的時程壓力（2018.1.31），但實在不宜草率的決策，流於部會本位主義相互角力下妥協的產物，筆者拋磚引玉，期待朝野和社會有進一步的討論。</p>\n<p>\t（本文為2017/10/14上下游投書：<a href=\"https://www.newsmarket.com.tw/blog/101216/\">如果你是行政院長，國家公園和林務局會放在農業部？環資部？</a>）</p>"}, {"nid": 3521, "title": "投書：將解殖納入環境行動", "original_topic": "森林與林業政策;水資源與環境治理;國土治理", "adopted_cats": ["森林守護與林業改革", "國土計畫"], "content": "<p><img alt=\"20190726-001.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u144/20190726-001.jpg\"><br>\n<p><span>今年1月16日地球公民舉辦之森林論壇現場。（由右至左分別為歐蜜牧師、林華慶局長、李根政執行長及筆者）&nbsp;</span></p></p>\n<p>今年1月中，地球公民基金會藉著執行長李根政執筆的《台灣山林百年紀》新書發表會，於台北慕哲咖啡舉辦森林論壇，邀請林務局長林華慶以及泰雅爾民族議會秘書長歐蜜‧偉浪牧師，分別以官方和原住民族的立場前來就山林議題進行對話（註一）。我有幸作為這場論壇的主持人，遠望台灣山林萬年歷史，近觀百年殖民，而囿於時間限制，我們都理解這場論壇的象徵性意義遠大於實質討論。這篇短文寫在論壇之後，並非再次突顯如此場合的難能之處，相反的，希望點出一些持續存在的困境和反省。如我在開場引言特別給予在場聽眾的提醒：之所以將這場論壇定義為三方對話，正是因為過去百年殖民的歷史結構中，國家的林業與山地開發、環境組織的山林保護行動，以及原住民族權利運動三者錯綜複雜、相互牽引的關係，至今仍然嚴重缺乏對話空間。彼此時而對峙衝突、時而合作交織，經常使論者難以釐清何謂公益，又何謂正義；時值今日，資源的利用與保育，這二者相互拉拔的張力仍舊是環境政治的難題。</p>\n<h3><strong>曖昧的競合關係</strong></h3>\n<p>發生於原住民土地上的反水庫運動，像是比麟水庫、高台水庫等，普遍受到環境團體的聲援，要求國家必須重視在地社群生存權益；但談到集水區保護議題，彼此關係就轉為緊張 ; 環境運動歷來強調民主參與，不過一旦牽涉狩獵除罪化、國家公園的資源利用解禁或共管議題，意見便趨於保守、默然，或任由國家高權維繫既有體制。又如這幾年，部落諮商同意權逐漸出現在環境團體批判重大開發案的論述上，然而環境團體是否支持部落的自然資源權利，卻往往模糊以對。當然，這過於簡化每項議題的複雜性和不同團體的價值路線差異，但對於原住民族權利運動長期追求的土地自治、還權、分權或資源共管——無論何種政治概念，都是企圖將權利從後殖民國家體制移回到原住民族手中——等目標，泛環境倡議組織的態度是相當曖昧不明的。</p>\n<p>這種曖昧性曾經在十多年前的馬告國家公園爭議中表面上緩解。為了從退撫會和林業界手中搶救千年棲蘭檜木林，新竹尖石後山數個泰雅族部落與環境團體達成共識，同意以「共同管理機制」為前提成立國家公園，算是環境運動與原權運動難得的交集。然而，這場運動最後遭到宜蘭南山地區部落，以及原住民政治人物的激烈反對而失敗告終。如今來看，當時的政治反彈似乎有其道理。多年過去，目前國家公園體制無論在狩獵、採集，或共管改革上都仍然維持「排除式」的禁令，在缺乏實質土地權利的前提下，山林是否能真正達到「共管」令人不無懷疑。在此之後，至少在我加入環境行動行列、成為專職人員的這十年來，環境運動——特別是山林保護行動——和原權運動之間幾乎成了兩條平行線，有時甚至繼續維持對抗關係；例如2008年國家公園法修法或是2015年野動法修法，凡是牽涉既有自然資源相關的改革事務，便容易挑起雙方敏感的神經。</p>\n<p><img alt=\"20190726-002.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u144/20190726-002.jpg\"><span>由於身份關係，在轉換角色之後，筆者才真正能靠近部落。圖為銅門太魯閣族獵人向筆者說明其傳統領域及獵場故事。</span></p>\n<h3><strong>分進才能合擊</strong></h3>\n<p>其中，如何看待當代「國家」統理自然資源的正當性權力，是環境團體和原住民族之間始終缺乏同理基礎以及行動不一致的根源。在原住民族眼中，過去殖民和威權統治遺留下來的自然資源管制結構，包括兩代政府共同發展的掠奪式林業、林地國有化、山地平地化等發展政策，到後來因應環境運動挑戰而轉變的禁制式保育體系，同樣都是延續性的日常壓迫 ; 反之，對於環境團體而言，情況就幽微得多，當政府官僚與發展主義合流摧毀環境，國家就是必須被抵抗的巨獸，然而當國家搖身一變做為保育代言者，這些過去承繼下來的高權結構就理所當然成為「政治現實」，更甚者，成了保護自然的現成捷徑。於是，國家公園、狩獵、林產物採集、林地彈性利用等，這些原住民族長久以來一再以政治動員所挑戰的議題，逐漸變成環境圈你我分明、敏感而沉默的禁區，對比現今國際上早已成為主流、將分權治理視為核心環境政策轉型的思潮，台灣目前的僵局格外發人深省。</p>\n<p>筆者身為環境團體的一份子，可以理解現況下的集體緘默，很可能是源於對權利話語或是文化事務的陌生，與其說「漠視」，更願意相信這是情感、價值、角色和政治解決方案的「糾結」。但無論是漠視還是糾結，當前的山林資源管制體系是殖民遺緒，並且不利於原住民族文化存續和發展，這是無可抹滅的事實，沉默也可以被視為一種消極的行動展現——一種默認、維護既有體制的行動。實際上，只要兩邊不打破議題上的隱性矛盾立場，就容易在社會上被塑造成二元對立的氛圍；舉例來說，官方很常用「社會意見歧異」的說法打迷糊仗，或作為拖延權利移轉的藉口，媒體也因平衡報導的需要慣於製造立場的衝突。同時。環境倡議經常以團體聯名的方式形塑集體力量，以同質化的聲音以小搏大，但這並不利於外界理解環境團體間價值主張的差異，反而會強化壁壘分明的感受。以上這些因素都一再延遲各項法令的改革，持續撕裂部落與環境團體的信任關係，以至於長不出更細緻、多方協作、試誤學習，以及能夠達成有效社會溝通的制度情境，讓治理終能匹配於正義、權利終能相應於義務。對立，讓「自然」和「人群」都持續活在陰霾之中。</p>\n<p><img alt=\"20190726-003.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u144/20190726-003.jpg\"><br>\n<p><span>直到現在，國家公園的禁制式管理依然是原住民族心中的痛。圖為2015年10月太魯閣族人至國家公園抗議還我狩獵權的行動</span></p></p>\n<h3><strong>共同行動或惡性循環</strong></h3>\n<p>這幾年，筆者身處在環境圈和原民圈兩個截然不同的議題領域，一直在思索要如何破除台灣長期對立的二元性，情況比想像中來得困難。一來的確追求的終極價值存在歧異，除了理念交鋒，更需要方法論的支持以拉近雙方行動路徑的距離，換句話說，這不是理論而是實踐的問題。二來環境團體有其支持群眾，環境運動形塑的意識形態某種程度也限制受眾的思維彈性，受眾有對環境團體所應扮演之角色的期待，進而讓環境團體更難發展具有權利意識的環境論述。</p>\n<p>最後一點，也是筆者這些年進入田野最深切的心得，台灣多樣的環境和特定地域的族群歷史脈絡，讓每個部落都擁有自身獨特的政治處境、環境條件或組織型態，以至於實務上難以用一套過大尺度的規範來調解地方性的需求，這其實非常需要能夠理解地方脈絡又可以影響高位制度的倡議團體，以不同尺度來合作和介入。但缺乏互信卻讓環境團體難以靠近部落，而部落則在國家的監視下避逃，社會關係的斷裂阻礙著不同尺度的群體分享視野和知識，共築行動策略的可能，演變成制度壓迫與失能的惡性循環。</p>\n<p>本文提出的見解並非橫空出世，只能說是這些年轉換角色的觀察沉澱與反省。1970年代後，全世界後殖民國家面對原住民族的挑戰，掀起一波波分權治理轉型的風潮，三年前蔡英文總統首次正式代表國家，為了四百多年來對原住民的傷害道歉，林務局也正積極透過狩獵自主管理等政策與部落發展資源共治，未來國家公園的解禁顯然在共商之列。台灣環境保育運動的終極價值，是要持續站在原權的對立面，還是要將解殖納入環境行動的一環，似是行到必須做出選擇的歷史節點。而台灣未來的山林資源與文化，勢必會記得我們的選擇，成為下一本台灣山林的百年之紀。</p>\n<p>註一：現場錄影請見<a href=\"https://www.cet-taiwan.org/events/3358\">《台灣山林百年紀》新書發表會暨森林論壇</a>活動頁面</p>\n<p>（本文為國立政治大學原住民族研究中心2019年6月號出版的<a href=\"https://web.alcd.tw/aew/book.php?id=114\">第 87 期《原教界》雙月刊</a>：<a href=\"https://web.alcd.tw/uploads/2019/07/01/1ace78b50ce77a2b3fbf33867d793a0c.pdf\">原文連結</a>）</p>"}, {"nid": 3596, "title": "【從漂流木撿拾大躍進國有林地鬆綁】陳保基的保育偏執論從何而來", "original_topic": "山坡地不當開發", "adopted_cats": ["森林守護與林業改革", "國土計畫"], "content": "<p><img alt=\"20150408_002.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20150408_002.jpg\"><br>\n<p><span>山區開發 道路破壞山林、水文，切割坡腳（地球公民基金會提供）</span></p></p>\n<p>一場內湖漂流木疑雲，終於將國內沉痾已久的盜伐問題浮上檯面，迫使長久以來不知為何永遠擱置的森林法修法終於有機會過關，卻也讓立法院諸公背後糾葛的利益結構運作一一現形，看見所謂的經濟委員會是怎麼在『監督』森林管理。</p>\n<p>經濟委員會上周開了場盜伐專案報告回應民應，然而明明是討論盜伐的場合，農委會主委陳保基在接受陳明文委員質詢時，卻脫口而出『無限上綱的保育是一種偏執』(註1)，引起媒體軒然大波。前後事實脈絡究竟為何？先來還原當天的狀況，為避免斷章取義，完整節錄對話如下：(註2)</p>\n<p><blockquote><p>（雙方原本在談論漂流木自由撿拾適宜性問題，突然話鋒一轉）</p></p>\n<p><span><u><strong>陳明文</strong></u></span>：我今天要談的也是政策性的問題，台灣林業政策現在究竟是環境維護問題還是經濟問題？現在我們的林業政策好像是保育嘛，這也牽涉農委會到底要不要升格為農業部！如果現在的林業政策只是保育<em>...</em>（被陳保基打斷）</p>\n<p><span><strong><u>陳保基</u></strong></span>：<strong>我跟委員報告，其實台灣的森林管理值得好好坐下來檢討。無限上綱的保育是對國土的偏執（明：你講的好！沒錯）民國二十年的森林和保安林地，那時</strong><strong><em>300</em></strong><strong>萬人和現在</strong><strong><em>2300</em></strong><strong>萬人的環境，我們是用一樣的標準看待的，這是不對的</strong>！</p>\n<p><span><strong><u>陳明文</u></strong></span>：（點頭）問題就在這裡，你的林務政策是沒有讓社會大眾了解的喔。我們現在只有禁伐林，沒有營林政策喔（保搶著說：其實有的）有在哪裡啊？講難聽點，你們現在只有森林遊樂區的開發經營，其他就是保育，林業政策在哪裡我看不出來。</p>\n<p><span><strong><u>陳保基</u></strong></span>：所以從今天開始我們人工林採伐利用的政策要拿出來，包括整個林地的正當性也要檢討。</p>\n<p><span><u><strong>陳明文</strong></u></span>：你講的的確比過去更具有突破性思維啦，但你的林業政策和保育究竟要放在哪裡我覺得要好好思考（<em>...</em>開始講過去林務局多風光，現在沒人理的原因是甚麼？就是因為現在沒有營林了）你們要好好檢討，<strong>譬如說我們嘉義縣，以前是伐木的中繼站，伐木工人都住在哪邊，所以才有很多林班地，但現在都禁伐木啦，開始轉型變為觀光勝地，一年有一百萬的觀光人次，但你們還用林班地來管理，這就是政策問題！</strong></p>\n<p><strong><span><u>陳保基</u></span>：所以我們現在正考慮解編當中</strong>，<strong>就是用這邏輯</strong><strong><em>…</em></strong></p>\n<p><strong><span><u>陳明文</u></span>：如果你還要當農業部長，就要有林業政策，沒有林業政策人家就把你移撥到環資部去啦，甚至我認為什麼保育其實都可以移到地方政府</strong><strong><em>…</em></strong></p>\n<p></blockquote></p>\n<p>陳主委主張的「保育偏執論」指甚麼？從這段對話可以簡單歸納為幾個關鍵字：林業政策（主要是人工林伐採經營）、林地正當性（包括林班地解編、保安林解編）以及林務局組織改造。</p>\n<h3>保育太過偏執所以要鬆綁山坡地？</h3>\n<p>首先，談人工林能夠理解，過往多數環保團體抨擊的是歷代政權對於原始天然林的摧殘，對於目前42萬公頃的人工林該如何利用，只要遵循林地分級與避開敏感區等原則，方向應不至於有太大分歧。況且從陳主委特別提及「300萬人的森林管理標準」與「保安林」，似乎也與人工林無關。所以言下之意是甚麼，從前後對話我只能解讀為：<strong>台灣現況人口太多，為了合理發展，所以保安林和林班地必須解編？</strong></p>\n<p><strong>保安林解除意味森林消失，林班地解編等同公有林私有化，讓濫墾、道路與建築持續在山坡地超限蔓延，是不是有哪裡誤會了？</strong></p>\n<p>在1996年賀伯颱風創造了土石流一詞、921大地震一舉震碎地體之後，後續十來年的極端氣候只讓每次風災更死傷慘重、山區更加柔腸寸斷。</p>\n<p><img alt=\"20150408_001.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20150408_001.jpg\"><br>\n<p><span>屏東八八風災（傅志男攝）</span></p></p>\n<p>正是因為台灣狹小土地無法承擔持續攀升的稠密人口需求，山坡地才會超限發展。更何況80年前的環境壓力與現今不可同日而語，按理來說現況更要讓人遠離山區風險才是上策，如此言論不僅嚴重與環境事實脫節，也與社會大眾的對於國土保安的心理期待背道而馳。無論是真心相信的價值還是迎合立委之詞，我都看不出邏輯何在。</p>\n<p><img alt=\"20150408_004.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20150408_004.jpg\"><br>\n<p><span>霧社萬大水庫的淤積（地球公民基金會提供）</span></p></p>\n<p>接下來再看看同屬嘉義縣的翁重鈞委員的發言：</p>\n<p><blockquote><p>（同樣原本以盜伐問題開場，而後話題一轉<em>..</em>）</p></p>\n<p><strong><u><span>翁重鈞</span></u></strong>：主委你剛剛說的有一件事情我蠻感動的，<em>300</em>萬與<em>2300</em>萬的山坡地管理都一樣，不能過度強調保育。</p>\n<p><span><u><strong>陳保基</strong></u></span>：我認為應該有充分的空間讓國人生活，而不是讓所有人集中在很小的空間，這是錯的！不是保育就是對的，這些都市有必要這樣集中，炒土地嗎？這是需要思考的。</p>\n<p><strong><u><span>翁重鈞</span></u></strong>：這就是我過去一直跟你強調，做政府官員要有同理心，林務局局長跟我到嘉義不計其數，每一次遇到都是山坡地管理的問題，<strong>最近很多都是在講國有財產署管理的問題</strong>。所<strong>以我們的國土規畫都沒有很宏觀角度或周詳的計畫來做整合，太過急就章，反而使我們沒有和基層民意走在一起。所以不只是森林法，包括林班地、山坡地的管理該都應該好好修。</strong></p>\n<p><span><u><strong>陳保基</strong></u></span>：<strong>我們都有提出來，這是讓</strong><strong><em>21</em></strong><strong>世紀的台灣不會生活在</strong><strong><em>13</em></strong><strong>世紀的環境裡面。</strong>自然環境的保育是非常嚴重的事情。</p>\n<p><strong><u><span>翁重鈞</span></u></strong>：提出來之後要趕快去做，在修的時候尤其希望要有同理心，要多聽基層民意的聲音，要整合多方意見啦，不是只聽某一些人或媒體的主張，這樣政策反而沒有辦法符合我們鄉親的想法，也不一定是對的。所以包括林班地、水土保持和山坡地我都希望你好好處理，這樣才能得民心。</p>\n<p><span><u><strong>陳保基</strong></u></span>：有，我們都有在處理，只是還沒提出來。　</p>\n<p></blockquote></p>\n<p>翁委員講得很隱晦，但不外乎又是林班地解編、山坡地鬆綁等政策方向，才能合乎「民意」。所謂民意是哪些？還不是長期藉由租地造林契約於國公有林違法墾植的特定利益團體或人士。以嘉義來說，最經典的就是佔用國有林種植山葵的林農，也包括全台各地佔據集水區上游的高接梨、高山茶或高麗菜等違規經濟作物區，其中又以台中為其首要。</p>\n<p><img alt=\"20150408_003.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20150408_003.jpg\"><br>\n<p><span>阿里山國有林班地種山葵（台南市社區大學研究發展學會提供）</span></p></p>\n<p>山坡地保育具有公共性意義，民代因選票考量混淆特定利益與公眾利益的界線就算了，但身為施政者竟然以「人口需求」如此違反常理的理由服膺關說，甚至拿保育做文章，令人難以苟同。</p>\n<h3>林班地濫墾的終極解套方案：混農林</h3>\n<p>不過最讓人冷汗直流的是，活生生的公開關說並不只陳明文和翁重鈞，<strong>桃園立委廖正井的質詢最後也停在大園防風保安林的解編，而台中立委江啟臣則乾脆連開場白都省了，直接切入重點，訊問自己要求的混農林政策進度如何</strong>。(註3)</p>\n<p><strong>混農林是甚麼？說穿了同樣是為了國有林內違法墾農就地合法的一種方式。</strong>以台中和平鄉來說，從2012開始台中市政府便和江委員聯手施壓林務局將和平一帶的違法甜柿墾區合法化，步驟有三：先以專案核准通過行政院、再解編國有林移交給國產署，最後制定一套專屬的「混農林」規定，只要在林地上種植30%的林木，甜柿種植便是合法，還可享有天然災害補助。總計海拔1,300公尺以下佔地6,494公頃之國有林班地中，初步可規劃適合種植甜柿區預計約2,154公頃。江委員甚至在2012年6月發布的新聞稿中，不諱言將讓「林班地違法使用的歷史問題帶來一線生機」。(註4)</p>\n<h3>利益把持才是環資部組改延宕的主因</h3>\n<p>回顧這幾年僵持不下的環境資源部組織改造，一群立委端出林業存廢的假議題，認為林務局挪去環資部等同宣告消滅林業，企圖影響已經定案的組改方案，以至於環資部組改延宕至今。然而從這場盜伐專案報告呈現的面貌來看，即使輿論最關切的是珍貴木與森林管理問題，這群不分藍綠，各代表著嘉義、桃園和台中違法利益的委員們最在意的仍是山坡地鬆綁。更讓人匪夷所思的是農委會主委不僅沒有力守公眾利益的底線，還提出似是而非的邏輯為其抬轎。林務局的去留究竟是會消滅林業還是消滅選票，事實不言而喻。</p>\n<p>無論陳主委的「保育偏執論」意圖為合，都屬於個人言行範圍，是非公允應由社會大眾檢視。<strong>背後真正值得大家深思的是，如此缺乏保育思維的經濟委員會，如此赤裸的利益綁樁，我們還敢繼續讓森林管理的最高機構繼續留在農業部，繼續讓這群立委用預算權把持林務局和台灣的山林國土嗎？</strong></p>\n<p><hr></p>\n<p>註1：20150330聯晚，<a href=\"http://ppt.cc/APd8\">怎防盜木講不清 陳保基批林務局長 抓山老鼠擬提高罰則 最重關10年半</a></p>\n<p>註2：<a href=\"http://ivod.ly.gov.tw/Committee#date=2015-04-01&amp;page=1&amp;type=movie&amp;comt=5\">立法院議事IVOD隨選系統</a>（路徑：以主辦單位查詢／經濟委員會／日期20150330）</p>\n<p>註3：江委員於質詢特別提及，其要求的混農林政策原訂林務局應於今年3月底完成草案送交行政院審定，林務局回覆表示目前已送交農委會，將盡速辦理完成，值得社會注意。</p>\n<p>註4：<a href=\"http://www.ly.gov.tw/03_leg/0301_main/dispatch/dispatchView.action?id=37963&amp;lgno=00010&amp;stage=8\">江啟臣委員新聞稿</a>（20120627）</p>\n<p>（本文為2015/04/08 獨立評論＠天下投書：<a href=\"https://opinion.cw.com.tw/blog/profile/52/article/2636\">【讀者投書】從漂流木撿拾大躍進國有林地鬆綁──陳保基的保育偏執論從何而來</a>）</p>"}, {"nid": 3599, "title": "讓台灣人成為山的子民", "original_topic": "森林與林業政策", "adopted_cats": ["森林守護與林業改革"], "content": "<p><img alt=\"20191125_003.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20191125_003.jpg\"><br>\n<p><span>圖一、地球公民基金會提供，傅志男攝</span></p></p>\n<p>近日，行政院宣布了「山林解禁」五大政策，開始要鼓勵人民親近山林，鼓勵孩子冒險、探險及溯溪等活動，贏得了山友與各界的掌聲，這確實是正確的方向，但是如何避免加重消費自然的疑慮，需要好好討論「山林教育」的內涵和執行，才有辦法落實蘇貞昌院長在記者會所標舉了「向山致敬」的精神。</p>\n<p>除了目前提出的「登山能力與自主管理、無痕山林」之外，筆者認為，應該讓登山不只是登山，在享受大自然的同時，也應建立起台灣人與山林的臍帶關係，讓台灣人真正成為山的子民。爬一座山，就要對這座山的自然生態、人文歷史有基本的了解；進入81條林道的任何一條，應該知道林道的開發過程，損失了多少原始森林與自然資源？得到多少木材？促進保育的思考，進而培養更多有能力參與山林保育政策討論的公民。</p>\n<p>台灣的山地占國土面積70%，而森林覆蓋國土60%，它是台灣精神文化的根，許多原住民族的聖地，無窮的知識寶庫，野生動植物及難以計數的生命居所，先來後到的人們得以安身立命的家園，更是不分族群地域人們生活與產業發展，珍貴的水源寶地。</p>\n<p>台灣森林覆蓋率算是蠻高的，但並非都是原始森林，從海拔約2500公尺以下的針闊葉混合林，到低海拔地區的原始森林，都曾遭受過極大規模毀滅性的破壞，如同現在進行式的亞馬遜或東南亞雨林。</p>\n<p>四百多年來，漢人來到台灣墾殖、材薪與樟腦等需求，造成了低地森林的破壞，日治時代則開啟了大規模的伐木事業，往中海拔針闊葉混合林伐木，一直延續到1991年國府宣布禁伐天然林，歷經約八十年的大伐木時代。伐木事業結束後，林務局業務開始轉向生態保育，但是政府組織、林業學界的觀念和作法，仍停留在過去的伐木時代，因此衍生許多錯誤政策，引發重大爭議。例如棲蘭檜木林整理枯立倒木、先砍伐森林再種小樹的全民造林政策等。</p>\n<p>2016年蔡政府上台，新任農委會主委提出了三大方向：天然林禁伐、人工林認證（如FSC）、里山倡議，開始要和國際的保育作法接軌，發展具有環境、社會、經濟的永續的人工林，某種程度來說，是為過去的爭議劃下了一個停損點，讓山林政策要邁向正常化。同時，蔡英文總統也向原住民道歉，成立了「原住民族歷史正義與轉型正義委員會」，這其中，原住民傳統領域與國有林有絕大部分的重疊，必然要檢討山林制度，整體而言，這是一個涉及層面很廣的轉型工程。</p>\n<p>台灣絕大部分人口住在都市和平地鄉村，但山林保育與每個人息息相關，很需要得到更多關注，在這個山林政策的轉型時期，我認為有以下關鍵課題，請各界參考與指教：</p>\n<h3>百年林業檢討與前瞻</h3>\n<p><img alt=\"20191125_002.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20191125_002.jpg\"><br>\n<p><span>圖二、地球公民基金會提供，李根政攝</span></p></p>\n<p>台灣雖有高比率的森林覆蓋，但人口稠密，以人均可分配到的森林面積不到一分地（0.092公頃），全球排名第183名，加上山高陡急，地質脆弱，註定不可能成為木材生產大國，從過去百年失敗的林業，到伐木所付出的水土流失代價，斑斑可考。</p>\n<p>回顧從1988年開始森林保護運動，其目標是反對砍伐原始森林，要將林地分類為保育保安和經濟利用，在合適的地區，好好經營從事人工林。然而，從1991年禁伐天然林之後，因為進口木材低廉，人工造林的國產材幾乎沒有競爭力，使得台灣林業的產值，至今已萎縮至統計上幾乎等於「零」的狀態。</p>\n<p>林務局宣示2017年為國產材元年，要開始和國際接軌發展人工林認證，這是對的方向。依照已通過的全國國土計畫，國、公有林地，依永續使用及不妨礙國土保安原則，可以發展經濟營林、試驗實驗、森林遊樂等功能之地區，劃為國土保育區第二類；無國土保育地區劃設條件之山坡地宜林地，劃為農業發展區第三類，這些都是屬於經濟林可以發展的區位。</p>\n<p>在推動新林業時，需要確認環境條件真正適合經濟林的土地，例如：過去的人工林地，已自然演替成熟的天然林，具有保育價值，就不適合再做為經濟林。更要建立透明可問責的森林認證，確保符合環境、社會、經濟可行性，可以蓄積台灣的木材資源，提高合理的木材自給率，或者作為經貿、戰備之備援，讓林產業有利可圖，也減少林地的超限利用。</p>\n<p>連帶的，現行的獎勵造林辦法，必需重新檢討，應該區分為經濟林和森林復育，同時要考慮山坡地的農業活動，因為這些區位是連接而非斷裂的，必需在國土保安、保育和人民生計的拉扯下，進行全盤的規劃，追求永續發展，強化因應氣候變遷所需要的韌性。</p>\n<h3>原住民轉型正義與里山倡議</h3>\n<p>從日治到國府治台的殖民政府，拓墾山林的同時，亦掠奪原住民傳統領域，政府和民間應釐清歷史真相，促進社會與學校教育認知與討論，促成反省和檢討體制，重新賦予部落管理自然資源的權力，包括土地的規劃與利用，原住民狩獵、採集的權利與生態保育等重大課題，應透過實踐累積經驗案例，回饋制度改善，建構符合原住民集體權利與社會文化經濟發展、生態保育，且可以操作的制度。</p>\n<p>百年來林業（公私造林、租地造林、保安林......）、山地農業、山地開發、公共建設，漢人的山區聚落與產業發展的課題，極為龐雜難解。里山倡議的願景需要更多實務的研究，積極的在地實踐，也需要法令和政策的檢討。例如：面對山地農業，不該放任失序的破壞水土，但也不應全面盤否定，而是要找出一條與山林共存、環境與生產共榮的模式。</p>\n<p>過去對於山區土地利用的管制，導致許多合法但不合理、合理但不合法、不合法也不合理等諸多矛盾現象，除了政府失能、政治因素破壞法治之外，《森林法》、《水土保持法》、《國土計畫》都要大大檢討，從天然林的保育、林業、農業、部落和社區的發展，需要考量台灣多樣紛岐的環境生態特性，細緻而非粗放、因地制宜而非死守一體適用的規則，真正建構具有永續性山區土地利用和管理制度。</p>\n<h3>整合並提昇保育層級，從管制走向良善治理</h3>\n<p>在天然林禁伐的大前提下，森林保育的重心是在良善治理。</p>\n<p>行政院組織改造已經上路，林務局將轉型為環境資源部「森林暨保育署」，這標誌著殖民拓墾的大伐木時代遺緒正式終結，同時提昇保育主管機關的層級。但令人惋惜的是，目前組改方案，準備讓國家公園續留內政部，並沒有和林務局整合進入環境資源部。</p>\n<p>林務局一旦轉型為「森林暨保育署」，就是全國的保育主管機關，但和堪稱國家保育指標的的國家公園卻分屬兩個部會，而且國家公園有超過96%的土地和國有林班地重疊，將會延續事權分散、資源重覆投資、機關相互競爭的現狀，失去組改目的。</p>\n<p>此外，台灣的保育系統包括了國家公園、國家自然公園、野生動物保護區、野生動物重要棲息環境、自然保育區等，相關法規和主管機關多頭馬車，加上區外的生態保育、社區與原住民部落的參與治理等重大轉型課題，顯然需要整合或建立協調機制。</p>\n<p>回顧台灣百年林業與山林利用開發，我們看到了：威權體制下的森林大滅絕，專家治國可能產生嚴重錯誤，解嚴三十年後的今天，我認為新的森林運動和挑戰是：能否透過健全民主體制，凝聚社會共識；從管制走向多元治理，賦予部落和社區更多的權力，強化社區保育力量。例如：面對犯罪集團擁槍自重，雇用逃跑的外籍移工，從事珍貴樹木的盜伐。可能的解方除了增加森林警察的人力和資源、提升工作條件之外，更要讓部落有權力和資源守護傳統領域，共同協力。</p>\n<p>而更大的力量，可能來自台灣數百萬敬山、熱愛登山的人們，如果有相當比例的山友都能成為山林知識、土地倫理的學習者和推廣者，無痕山林的實踐者，且有能力參與山林政策討論的公民，不懈怠的監督、參與、動手做；和政府建立起相互信任的伙伴關係，促進真正的良善治理。那麼台灣人將成為真正山的子民。</p>\n<p>期待正在轉型中的山林政策，每跨一步都是建立新典範，揮別百年傷痛。</p>\n<p><img alt=\"20191125_001.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20191125_001.jpg\"><br>\n<p><span>圖三、地球公民基金會提供，傅志男攝</span></p></p>\n<p>&nbsp;</p>\n<p>（本文為2019/11/23關鍵評論網投書：<a href=\"https://www.thenewslens.com/article/127849\">行政院宣布「山林解禁」五大政策，如何讓台灣人真正成為「山的子民」？</a>）</p>\n<p><hr></p>\n<p>延伸閱讀：</p>\n<p><a href=\"https://forest.pts.org.tw/\">公視森官網</a></p>\n<p>1.<a href=\"https://opinion.cw.com.tw/blog/profile/390/article/7625\">檜木神靈：與森林共存的原住民部落</a></p>\n<p>2.<a href=\"https://www.cet-taiwan.org/publication/3359\">有關百年林業的失敗？國產木材的新趨勢等課題，請參考筆者的著作「台灣山林百年紀」</a>，2018年，天下雜誌出版</p>\n<p>&nbsp;</p>"}, {"nid": 3637, "title": "檜木神靈：與森林共存的原住民部落", "original_topic": "森林與林業政策;自然復育", "adopted_cats": ["森林守護與林業改革"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20191223-051.jpg\"><br>\n<p><span>在紅檜巨大的量體下，人顯得渺小，就千年為單位的生命尺度而言，人又何其短暫。</span></p></p>\n<p>\n<p>鎮西堡部落在新竹縣尖石鄉，馬告檜木國家公園預定範團的東南側，是石門水庫上游最深山的泰雅族部落，和司馬庫斯部落遙遙相對，2 個部落主要的觀光資源即是檜木。</p></p>\n<p>鎮西堡的檜木林在馬望山和基那吉山之間，僅僅一天來回，人們便得以親眼目睹那一棵棵數百或上千歲，高大壯麗、樹形各異的巨大生命。檜木森林有4、5層次，最高層的檜木及針葉樹可達40～50公尺，第2層針闊葉樹則在15～25公尺之間，往下還有闊葉樹和灌木、草本、苔蘚等，樹上也有多種的附生或攀藤。尤其看到只如芝麻粒大小的檜木種籽，竟能長成難以想像的巨木，更會感受生命的奇蹟。</p>\n<p>我們從不刻意砍伐或干擾檜木林。相反的，這片霧林是族人、祖靈的原鄉。</p>\n<h3>神靈的故鄉，卻面臨生態浩劫</h3>\n<p>紅檜與扁柏的巨木就是神靈，統稱為「Ka-pa-rong烏．杜」，「烏．杜」是神靈之意，也是Ga-Gar的一部分。這是陳玉峯教授紀錄鎮西堡部落阿棟．優帕斯牧師的一段話。阿棟牧師等泰雅族人正是基於這樣的信念，為了守護著和族人共存的山林，有條件支持建立具有「共管機制」的在馬告檜木國家公園，認為這是邁向自治的階梯。</p>\n<p>如今，住在鎮西堡和司馬庫斯的許多族人仍然以「GAGA」的精神守護著山林，他們自發的組織巡守隊，發展觀光的同時，也試圖規範遊客的行為。</p>\n<p>什麼是GAGA？我的學習和理解是：一部分好比漢人所說的人和人之間的倫常，或者，舉頭三尺有神明的道德規範。但泰雅族的GAGA包括人與人、人與土地關係的行為規範，人在環境或使用自然資源的倫理，而且對族人有很強的內外在約束力。森林、狩獵、河川、土地經營都有GAGA，生活中很細微的行為也都有GAGA，如果不遵守，會有上天的懲罰。</p>\n<p>長老阿道．優帕斯說，在1980年前後，台灣正面臨著森林浩劫，念國中的他跟著爸爸到獵區打獵，連續2年，連隻山羌也沒有。因為隔著塔克金溪，棲蘭山林區170林道正在炸山開路、大肆砍伐原始檜木林，每天約中午11點，就會進行大約30次的炸山爆破開道，中午吃飯，下午再用推土機把土石推落河道，巨大的聲響把動物都嚇跑了，而且把底下的檜木整片都打爛。</p>\n<p>阿道長老說，小時候好期待看到山羌、山羊的樣子，但去了非常失望。這樣的描述，讓我一直聯想到宮崎駿的《魔法公主》中的場景。</p>\n<p>當時是大伐木時代的最高峰，林道已經從泰岡一路挺進新光部落，正準備從鎮西堡的水源地基那吉山下開路到檜木群，但引起部落的強烈抵抗，才保住了森林。如今的泰崗和新光部落到了冬季就會缺水，就是因為水源地的森林被砍伐。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20191223-053.jpg\"><span>阿道（左）依諾（中）和我在陽光下合照留影</span><br>\n<p>&nbsp;</p></p>\n<h3>共同抵抗盜伐者</h3>\n<p>事實上，鎮西堡部落不僅抵抗國民黨政府的伐木，早在日治時代，因為慘烈的抵抗，才延緩了日本伐木開發的力量進入。從這個歷史觀點，台灣最早的森林保護運動，應該是原住民對殖民政府的抵抗運動，而鎮西堡基於保護水源地，對國民黨政府進行的反對伐木行動，應該載入史冊。</p>\n<p>2006年，水土保持局為了消化石門水庫上游整治預算，打算在檜木林區的崩塌地施作水泥工程，鎮西堡部落同樣悍然拒絕，因為他們了解森林的天然復育機制。如今，那片崩塌地已自然復育為赤楊樹為主的次生林，大自然自我療癒，完全不必工程介入。另外，他們也打算在塔克金溪支流的興建潛壩工程，同樣在鎮西堡部落的反對下打消念頭，不僅保護了天然的溪流，更為納稅人省下8,000萬經費。</p>\n<p>但是，2012年來自其他部落的盜伐集團偷砍了鎮西堡的檜木；2014年又有盜伐者砍伐了一棵約200年的檜木和一塊樹瘤。這裡屬於林務局新竹林管處，有巡山員例行性巡邏，但卻無力阻止盜伐。鎮西堡經過6次部落會議，決定在通往神木群的唯一道路上設置關卡，宣示主權、維護森林。他們邀請了各部落與林務局代表見證，在檜木林步道入口實施夜間封路，由部落青年輪流守夜巡邏，只要發現可疑的車輛，就在第一時間處理。原住民部落和過去原本勢不兩立的林務局，共同結盟保護檜木林，這是台灣森林治理很重要的歷史里程碑。</p>\n<p>除了鎮西堡部落，許多原住民部落或家族正透過自發性力量守護山林。像司馬庫斯以共同經營的模式守護檜木林並發展觀光；致力屏東霧台達巴里蘭的宋家，自發性的復育保護了50公頃山林；台東延平鄉鸞山村的布農族人阿力曼，籌資搶救部落上方原始榕樹巨木群，阻擋財團蓋靈骨塔、渡假村，以「環境信託」理念打造「森林博物館」，作為環境教育、文化重建、族群交流的平台。</p>\n<p>然而，當代的原住民部落，並不是一個理想的烏托邦，有時我們會看到一些負面的新聞。2006年司馬庫斯巨木群有多棵巨木遭盜伐，發現是當地族人組織的集團所為，甚至恐嚇其他積極守護森林的族人不得聲張，有些案例則是外來集團以毒品控制一些原住民進行盜伐等等。有些人會因為看到上述的負面事件而認為：原住民文化已經流失，要如何相信部落可以管好山林？</p>\n<p>但我們要想：台灣多元社會中，任一社群或族群都有正面或負面的力量。如果有好的國家體制，恢復原住民權利，找回傳統生態智慧，就可以讓更多原住民部落成為山林保育守護者，有機會讓更多正向力量擴散。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20191223-052.jpg\"><span>在這片耕地旁，坡度較陡的地方，部落族人種下的「赤楊」，除了保護水土，也有固氮的作用。攝影@李根政</span></p>\n<h3>與森林共存的農業</h3>\n<p>在自然資源豐沛的社區，發展觀光似乎是條兼顧環境永續的生存之道。然而，擁有豐沛檜木觀光資源的鎮西堡和新光部落，並沒有把觀光當作唯一的生計來源，而是「農業為主，觀光為輔」。</p>\n<p>自古以來，農業就是部落主要的生存基礎。阿道長老說：那些一天到晚跑去打獵的年輕人，會被老人家批評是懶惰的人，沒有依節令去播種耕耘，到時候會讓家人挨餓。</p>\n<p>20多年前，新光部落長老LOSIN開始帶頭轉做有機農業，影響了鎮西堡部落的阿道長老，接著帶動了整個部落中生代的農業轉型。根據內政部的調查統計，目前新光與鎮西堡兩個部落，有22個農戶取得有機認證，而取得有機認證的農場面積達32.82公頃，佔全部農業使用土地面積的21.5％。由於許多轉作有機栽培並未申請認證，所以實際面積更大，慣行農法反而只有少數幾戶。</p>\n<p>他們栽培的多樣蔬菜例如青椒、高麗菜、芹菜，目前是供應主婦聯盟生活消費合作社、里仁，新北和桃園市學校的營養午餐，很受到歡迎，特別是在6～8月的高麗菜，剛好可以補上淺山和平地的生產空檔。由於部落的產業可以提供生計，所以有9成的年輕人選擇留在部落。</p>\n<p>鎮西堡的農業大約以10年為週期更換作物，80年代種蘋果和香菇，那段期間，部落也需要砍伐楓香、殼斗科的樹木來栽培段木香菇，這讓部落附近的森林有了損失。幸而部落內部有所自覺，透過部落會議確認，在水源地不得砍伐森林。接著90年代是種水梨，2000年左右種植水蜜桃，現在則是蔬菜為主。10幾年間，部落除了發展有機農業，也在農路兩側、邊坡和聯外道路有計畫地植樹，或者復育森林。長期致力於保護森林的族人深知，與森林共存的永續農業，才是山坡地農業的解方。他們的目標不只是有機農業，而是對整個生態環境都好的友善農業。</p>\n<h3>多元協力的積極參與</h3>\n<p>從事森林保育運動近20年，實踐的時間越久，越發現單靠國家權力守護廣大山林，已是不可能的任務。例如盜伐檜木、狩獵的問題，如果沒有部落或社區保育力量的合作，連查緝都有困難。</p>\n<p>東華大學的環境經濟學者戴興盛教授曾為文指出：</p>\n<p><blockquote><p>台灣的自然資源治理是一個頭重腳輕、非常空虛的體系，國民無法參與決策、分享權利，但卻可以在國家管不到的山林海洋間肆意利用、破壞資源。</p></p>\n<p>首要的第一步，是要逐步地將治理權限授權給適合的組織層級，透過授權，讓資源治理落實到政府無法、無力觸及之處。<span></span></p>\n<p></blockquote></p>\n<p>國家法律應是最後和最低的保育防線，但我們不可能事事都採取極端的管制手段，自然資源的良善治理必然要從「國家管制」走向「多元協力」，讓利害關係人從保護自己權利，資源的永續利用出發，依不同的區域和個案，透過和政府協商，界定權力範疇，得到社區和部落的認同且積極參與，才能達成「有效的治理」。</p>\n<p>過去，我們對於原住民守護山林的想像，一種是國家雇用的巡守員，一種是義工。然而，事事都希望國家的經費支持，有其侷限；沒有考慮生計的保育工作，也不可能長久。</p>\n<p>住在石門水庫下游的人們，在要求鎮西堡、新光、斯馬庫斯等水源地上游部落負責保護森林和水源的同時，是否也該想想：我們要付出什麼？</p>\n<p>在氣候變遷的嚴肅挑戰之下，政府應該和最直接的利害關係方──原住民族、山居聚落，透過對話，相互理解，一起想辦法，共同協力治理。與森林共存的鎮西堡部落，正在幫助台灣社會重新定位山林政策。</p>\n<p>\n<p>（本文為2019/01/01天下獨立評論<a href=\"https://www.cet-taiwan.org/publication/3359\">《台灣山林百年紀》</a>書摘：<a href=\"https://opinion.cw.com.tw/blog/profile/390/article/7625\">檜木神靈：與森林共存的原住民部落</a>）</p></p>"}, {"nid": 3643, "title": "如何評價民進黨環境成績單", "original_topic": "山林水土;環境污染;能源轉型", "adopted_cats": ["森林守護與林業改革", "完善能源政策"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20200106-004.jpg\"><span>拍攝地點鎮西堡（良寬<span>攝</span>）</span></p>\n<p>2018九合一選前，有媒體問我，如何評價民進黨上台之後的環境表現。</p>\n<p>我說，沒辦法給一個簡單的答案，因為環境領域多元，個案差異極大；而且中央和地方政府的層級不同，就責任政治的角度，需要一個個盤點，才可以得到公允的答案。老實說，這應該是學術界或綜合性的智庫和監督組織，花時間去蒐集資料（包括環保團體的評論），進行討論或辯論才有可能。</p>\n<p>後來，我想一個辦法，就地球公民基金會所關注的業務範疇，在中央執政的層面，畫了這張成績單。由於分數的表現法相對主觀，因此我以正、負面並列，沒有計算總分的方式呈現，就請大家參考。</p>\n<p><img alt=\"20200106-001.png\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20200106-001.png\"><span>（李根政繪製）</span></p>\n<p>先說結論：要討論民進黨的環境成績單，還是要把2008-2016國民黨馬英九總統執政拿來比較，就地球公民所關注的環境議題上，國民黨幾乎都是站在對立面，八年執政帶給台灣的是停滯和倒退。相較而言，民進黨蔡英文總統執政下，在能源、空污、森林議題上有所前進，但在國土計畫、違章工廠與礦業改革上，則是失分大於加分。</p>\n<p>這張圖的「實線」代表已經確定，「虛線」尚在進行中，不確定其結果。</p>\n<p><h2>能源、森林該給肯定</h2></p>\n<p>民進黨二次執政最值得肯定的是能源政策，確定2025年要邁向非核減煤（從47%降到30%）、再生能源達到20%的目標，可以說是台灣環境政策上，很大的前進和突破。三年多來，太陽光電在尖峰最高的發電量已超過核二或核三廠的兩個機組。</p>\n<p>相較而言，馬政府時期強推大林燃煤電廠、彰工燃煤電廠，把再生能源當丑角、擁抱核四等作為，都讓台灣的能源轉型大幅落後先進國家。</p>\n<p>但是，蔡政府在能源轉型和減碳的規劃，尚缺2025-2050的具體路徑和目標。行政院長賴清德在深澳電廠的頑固保守，天然氣第三接收站和藻礁保育上大失分。2018擁核公投期間，民進黨選擇冷處理擺爛不作為，讓環保團體抗衡擁核幫和國民黨的選戰大軍，最後落得難看的公投結果，也是嚴重的誤判。而地面型太陽光電在區位的選擇上，至今尚未建立環境與社會檢核機制則需要立即改進。</p>\n<p>民進黨在能源這題有加分也有減分，但是從大的方向和格局來看是該給予肯定。</p>\n<p>台灣百年來的林業和森林政策，長期停留在大伐木時代的思維和作法，2008年馬英九總統執政期間，官僚體系又以減碳為名，強推錯誤的造林政策，把許多森林砍伐掉再種上小樹苗，浪費公帑破壞森林水土，違反國際減碳作法，也沒有帶來經濟效益。</p>\n<p>2016年蔡政府上台，農委會曹啟鴻主委提出了三大方向：天然林禁伐、人工林認證（如FSC）、里山倡議，開始要和國際的保育作法接軌，發展具有環境、社會、經濟的永續的人工林，某種程度來說，是為過去的爭議劃下了一個停損點，讓山林政策要邁向正常化。同時，蔡英文總統也向原住民道歉，成立了「原住民族歷史正義與轉型正義委員會」，這其中，原住民傳統領域與國有林有絕大部分的重疊，必然要檢討山林制度，相當於啟動了一個涉及層面很廣的轉型工程。</p>\n<p>同時，新任林務局長林華慶在保育和林業的改革作為，包括撰寫新的林業白皮書，制定新的造林和禁伐補償方案，雖然還沒有看到很具體的成效，但仍值得肯定。台灣山林面積廣大，占國土面積七成，這項變革雖僅是啟動，但有其不可抹滅的價值。</p>\n<p>不過，需要改進的是做到一半的行政院組織改造，如何讓提升和整合森林及保育的層級和組織，增加經費，大力培力人才，同時確保各項政策執行時不重蹈覆轍。</p>\n<p>（有關山林政策的倡議，請參考：<a href=\"https://www.cet-taiwan.org/info/story/3599\">李根政，讓台灣成為山的子民。</a>）</p>\n<p><h2>空污被打的冤枉</h2></p>\n<p>空污政策最為尷尬，民進黨明明相較於馬政府有具體的前進，但卻被國民黨打得鼻青臉腫，甚至被擁核幫拿來恐嚇民眾支持核電。</p>\n<p>地球公民基金會從2007年開始阻擋台電大林電廠擴增燃煤發電機組，2011年開始推動高屏空污總量管制，是全台反空污運動的開創者之一，但初期能喚起的社會共鳴不多，直至2015年才正式通過。那一年，由於中國媒體人柴靜的《穹頂之下》引起台灣媒體瘋狂轉載，全台各地反空污聯盟陸續成立，國人空污意識前所未有的高漲，加上部分團體操作總統大選的加溫，使得空污議題，尤其是電廠減煤排上政治議程的最優先位置，這應該是台灣改善空污最好的政治機會。</p>\n<p>在空前的社會壓力下，馬政府的空污治理不能說毫無建樹，但欠缺明確的上位政策引導和統合，改善幅度緩慢，高屏空污總量管制於2015.6.30公告，民進黨上台之後繼續執行，雖受到總量管制的子法限制，初期成效有限（公告實施後三年，高屏空污減量約一萬噸），但確實有減量效果；而民進黨很重要的進步是在行政院林全院長支持、詹順貴副署長的努力下，提出很具體且跨部會的14+N空污改善計畫，但被批評太保守，加上空污法修法，各方角力不斷，老車管制的假訊息爭議出現，導致民進黨明明有所前進的空污政策，卻整個黑掉。</p>\n<p>九合一大選前，部分環保人士想要擴大反空污的戰果，試圖運用國民黨縣市長候選人作為政治槓桿，結果導致反空污議題被國民黨收割為政治資產；另一方面，擁核幫開始利用人們對空污的恐慌，操作廢核導致空污的假訊息，也獲得極大的成功。直到今天，盧秀燕和韓國瑜仍然將反空污作為打擊民進黨的工具，這是嚴重去歷史脈絡的荒謬行為。</p>\n<p>做為一個長期反核、反污染的運動者，對於這樣的結果深感痛心。</p>\n<p>中南部的空污正在改善，但是距離可接受的健康標準尚有很大落差，人民有超過半年仍然飽受空污威脅。電廠減煤該持續做，但不是唯一的方案，工業減污與轉型改造是重中之重，尤其是中鋼煉焦爐的嚴重污染，台塑和中油等石化工廠排放有毒物質，都需要大力整頓，而高雄大社工業區的降編轉型更是具體指標。此外，2040全台灣電動車化的目標不應該退縮，而是依「公正轉型」原則提出配套方案。</p>\n<p><h2>國土計畫和違章工廠大失分</h2></p>\n<p>「國土計畫法」是在國民黨執政時通過，所以給了一個加分，這是六大議題，國民黨唯一的一點加分，但這是朝野立委合力通過，不完全是國民黨的功勞。</p>\n<p>2016民進黨執政後，內政部主管的公務人員兢兢業業的依法推動，但卻被張景森政委黑箱主導了一個很虛的「全國國土計畫」，同時在關鍵的「農地總量和分配量」中央沒有明確的政策，因此，目前各縣市政府都盡可能減少保留農地，最近地球公民基金會檢視了各縣市的公告的國土計劃草案，十萬公頃的農地極可能在這波國土計畫中消失！</p>\n<p>這不僅是嚴重的國家糧食安全、國土保育課題，更與氣候問題息息相關，根據統計，全球土地利用變遷的溫室氣體排放量占24%左右。蔡政府有責任提出都會與農業縣市可公平分擔保留農地的政策，要求各縣市維護充足的農地，達成台灣糧食自給率40%的國家目標！&nbsp;</p>\n<p>「農地違章工廠」的整頓本來是民進黨可以大大加分的環境議題。蔡政府上台後，提出了520之後新增建違章工廠即報即拆，雖然至今只拆了十六間，但民間團體根據稅籍資料推估，其實有發揮了嚇阻作用，2016以前，違章工廠年增6000多家違章工廠，2016之後年增約3000家，減少一半。</p>\n<p>蔡政府僅僅是政策的宣示就發揮了減量作用，凸顯違法業者無時不在觀察執政者態度和決心，更證明處理違章工廠並非不可為。</p>\n<p>後來，行政院提出了「工廠輔導法」修正版本，把520後即報即拆丶中高污染遷廠丶關廠入法；低污染工廠全面納管丶清查都入法，這些是正面的；但是，幾乎是全面就地合法的輔導方案，沒有落日時間，就是大失分，修法過程民間團體提出五大修正訴求，在龐大的社會壓力下，民進黨也僅勉強接受二十年落日的條款。如果民進黨想要在違章工廠這題取得正面的歷史評價，就要看能否落實520即報即拆，明訂中高污染遷廠時程，調整全面就地合法的錯誤，讓台灣的產業永續和正常化。</p>\n<p><img alt=\"20200106-002.png\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20200106-002.png\"></p>\n<p><h2>礦業法再三承諾卻不兌現</h2></p>\n<p>地球公民從六年前開始推動礦業改革，試圖健全礦業開發應進行的土地開發、環評、保安林審查與部落知情同意程序。幾年來，促成礦務局檢討無採礦實績礦場，收回57個礦業權（2019年11月30日為止共收回12個）；促成農委會林務局踐行保安林經營準則，針對保安林內租地採礦案審查及現勘；促成亞泥案真相調查（預計2020年初完成）。</p>\n<p>礦業法是一部半世紀沒修，違憲違法基本人權，沒有環境和國土把關機制的老舊礦業法，是否可以在這時候止血，端看已完全執政的民進黨。</p>\n<p>在民間不斷行動，加上2017年齊柏林先生意外過世，升溫了政治壓力下，2017年六月蔡英文總統在頒發齊柏林褒揚令時承諾修礦業法，今年六月，在原轉會上二度承諾本屆立委修礦業法。二年多來，我們不斷爭取礦業法列為優先法案，在立法院中經過11次經濟委員會審查、4次黨團協商，總算在今年五月底送交立法院長蘇嘉全協商，然而，民進黨還是完全不作為。很遺憾，這一屆立委任期即將結束，如果12月31日蘇嘉全院長沒有召集協商，選後也沒有召集臨時會審議，礦業法就歸零，下一屆的修法程序全部都得重來。</p>\n<p>感謝為礦業法努力的委員：高志鵬（民）、林淑芬（民）、尤美女（民）、蘇治芬（民）、周陳秀霞（親）、賴瑞隆（民）、高潞以用（時力）、邱志偉（民）、徐永明（時力）、管碧玲（民）、陳曼麗（民）委員等。在狹小的政治空間中，即使無關自己選區的利益，還是願意為礦業改革付出努力。</p>\n<p><img alt=\"20200106-003.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20200106-003.jpg\"><span>（徐孟平攝）</span></p>\n<p><h2>環保與選票的距離</h2></p>\n<p>台灣在轉型正義路尚遙，國家主權受中國持續威脅下，如何防止國民黨得到政權，支持民進黨繼續執政似乎是不得不然的選擇。然而，社運團體的存在就是要監督握有權力的執政黨，否則就失去了存在的價值，也辜負了支持者期待扮演的角色，但是，在台灣特殊的國家處境下，常常需要拿捏分寸，依據歷史脈絡、客觀的事實，批判和監督民進黨，以爭取更多理性選民的支持，達成運動的目標，坦白說，這是難度很高的工作。</p>\n<p>從事環境運動二十多年來，一直鼓吹選民應更重視政黨在公共政策的實質表現，然而，要充分理解多元的公共議題，依此決定投票給政黨或候選人，個別的選民得花很多力氣，也因此，很需要公民團體提供選民客觀資訊。在民進黨二度執政倒數，大選在即的時刻，作為貼近政治運作現場的環運工作者，提供以上觀察報告和評論，拋磚引玉，期待有更多領域的團體或工作者可以從不同的角度，提高選民對公共政策的認知和判斷能力，我認為，這是台灣民主的深化很重要的事情。</p>\n<p>然而，參選的經驗讓我深刻了解選民投票行為很複雜，公共政策的認知和判斷能力只是其中一項，選民可能會受大環境的氛圍到私人利益影響，也有對政黨和候選人主觀的喜惡，投票之前更可能盤算著選票會不會浪費，掙扎著西瓜要不要偎大邊。總之，從環境議題的表現到投票行為之間，尚有一大段的距離。</p>\n<p>今年，身邊許多的朋友總統票早已無懸念，但都在煩惱著政黨票該投給誰？我也還沒有做出決定。但是我認為不應該投廢票，建議可以參考台灣公民陣線提出的原則，先用排除法：大黨拒投國民黨，建議投民進黨；小黨拒投台灣民眾黨，建議投給台灣基進、時代力量、綠黨等台派小黨，然後，在未來的二十幾天想一想，這一票想要改變或支持什麼？</p>\n<p>而對於環保運動，我認為選後真正的挑戰在於：能否凝聚足夠的社會力，讓改革的項目可以持續，錯誤的有機會矯正，歸零的可以重來，承諾的不再跳票。更期待選舉期間的積極公民，在選後仍保有和選舉時同樣的熱情，共同來關心公共政策，讓公民社會成長茁壯。</p>\n<p>（有關民進黨第一次執政時，各種環境政策的衝突矛盾，請參考李根政在<a href=\"https://leekc-95kh.blogspot.com/2011/04/blog-post.html\">2012民進黨總統黨內初選的提問。</a>）</p>\n<p>&nbsp;</p>"}, {"nid": 3655, "title": "投身山林保育的築夢歷程", "original_topic": "山林水土", "adopted_cats": ["森林守護與林業改革", "礦業改革"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20200213-001.jpg\"><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20200213-001.JPG\"><span>（攝影：良寬）</span></p>\n<p>李根政，一九六八年生，曾任國小教師，教育、環境刊物總編輯及非營利組織職務等，長期關注社會及生態環境議題，現任地球公民基金會執行長。</p>\n<p>我現在的工作是「環保團體」的專職，我和同事們專門研究調查環境議題，向大眾揭露問題和解決方案，組織群眾、發揮影響力，促進政府在法令、政策上對環境友善。</p>\n<p>這些工作被稱為「環境運動」，目的是讓這一代和未來世代的人，都可以擁有乾淨的空氣、水、土壤和自然生態，面對氣候變遷的挑戰，和地球上所有生命永續的共享這個星球。</p>\n<p>不過這是我小時候無法想像的工作。</p>\n<p><h2>硝煙中的藝術啟蒙</h2></p>\n<p>我成長於金門古寧頭，當時是國共對峙時的最前線，住家附近都是軍營，晚上十點後到別的村莊要通行證。</p>\n<p>十一歲之前的我經歷過漫長的「單打雙不打」，每逢日曆的單日晚上約七到九點，共產黨軍隊的炮火，就會從中國廈門一帶開始炮擊金門，全家都得躲在防空洞。</p>\n<p>當時的金門全民皆兵，父親是自衛隊員，家裡分配到一把步槍，國中生的我也被編入「幼獅隊」，在全島軍事大演習時成了小民兵。</p>\n<p>戰火硝煙中，我在美術老師的啟蒙下開啟了藝術之路，求學及擔任教職過程中，藝術創作曾是我生活的全部，最常描繪樹木和田野。</p>\n<p><h2>專職投入環境保護</h2></p>\n<p>二十五歲時，我移居到臺灣從事教職，在高雄接觸到一群推動成立「柴山自然公園」的朋友，內心開始「拉扯」。尤其畫畫時眼睜睜看著描繪的景象消失，心裡掙扎是要持續這樣畫著「自然遺照」，或為珍愛的大自然做點什麼。</p>\n<p>三十歲那年，我和一群基層老師創辦了臺灣第一個教師的環境組織，從此放下畫筆，一邊當老師，一邊從事環境運動。但在十年後，我越來越覺得「環境運動」是專業工作，需要長久且專注的投入。</p>\n<p>四十歲時我決定辭去教職，專心從事環境保護的工作，和一群朋友創辦「地球公民基金會」。多年來，我們的行動領域遍及山林水土、工業汙染、能源轉型、永續花東、環境民主等，其中，山林保育是我的最初啟蒙。</p>\n<p><h2>山林保育的啟蒙</h2></p>\n<p>我喜愛山林，但不擅長登山，也從未追求百岳登頂。我成長的金門只有一座三百公尺的太武山，且當時是軍事禁區，不能爬上去。</p>\n<p>我的山林啟蒙最早是金門古寧頭的海埔新生地，在廢棄的魚塭周邊和小徑兩旁，有許多野生植物和野鳥，那是我從事創作的題材。</p>\n<p>移居高雄後，我在柴山學習了約有五六百種原生植物，那裡有圓盾狀的血桐葉、徽章般美麗的構樹、粗壯亮綠的姑婆芋，纏繞著藤蔓構成的熱帶海岸林，散發無比的生命力。</p>\n<p>我對臺灣山林遭破壞的歷史，以及有系統的植物生態學習，則是就讀靜宜大學生態學研究所時，受到陳玉峰、楊國禎教授的啟蒙。</p>\n<p><h2>保育行動的挑戰</h2></p>\n<p>二十多年來，我實際在第一線從事山林保護運動，在一片片被破壞的山林土地，以及被保護下來的自然野地中考察和體驗，讓我認識到臺灣生態的獨特性，並有了深刻的情感連結。我也結交了許多熱愛山林土地的人，激勵我和夥伴持續投入保護山林的行動。這些行動多數很困難，常要面對衝突、矛盾，挑戰難以撼動的體制，即使投入很多時間和心力也未必保證成功。</p>\n<p>例如在民間社會二十年的努力下，柴山成為全臺灣第一個國家自然公園；我們揭露了政府推動伐木再造林的錯誤政策，每年減少數千公頃的森林破壞；成功阻止全世界僅存的檜木林再次遭受破壞。但是推動「馬告檜木國家公園」最後卻失敗了，我們遇到極大的反對阻力和難以克服的歷史因素；現在進行式的「礦業改革」仍步步難行。</p>\n<p><h2>堅定保育的決心</h2></p>\n<p>這些經驗給我的啟發是，只有保護大自然的初心，並不足以面對巨大的環境挑戰。一個運動者必須不斷增進知識、改進方法，更要鍛鍊心志，練習不被悲傷、憤怒情緒淹沒，才能克服無力感，繼續向前行。儘管一路走來並不容易，但我和夥伴仍未放棄行動，持續為保護臺灣山林努力。</p>\n<p>每個人的生命都是獨特、難以取代的，探索自我之路永無止息。回首過往，生命中有幾次重要轉折，是我不斷扣問內心「想要過什麼樣的人生」後的決定，而我也從過程中提升了自我生命的品質，心靈深受啟發。</p>\n<p><img alt=\"20200213-002.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20200213-002.jpg\"></p>\n<p>&nbsp;</p>\n<p>（本文為2020/02/08&nbsp;國語日報投書：【通往夢想的道路】投身臺灣山林保育）</p>\n<p>&nbsp;</p>"}, {"nid": 3807, "title": "蘇院長，國家公園為什麼不去環境資源部？", "original_topic": "國土治理;國會/政策", "adopted_cats": ["森林守護與林業改革", "國土計畫"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20200826-002.jpg\"><span>雪霸國家公園-雪山翠池是台灣海拔最高的天然湖泊。（傅志男攝）</span></p>\n<p>台灣從1980年代設立國家公園以來，扮演了保護國家重要自然生態、動植物、景觀、文化的功能，然而由上而下的保育施政留下許多爭議，已到了非改革不可的階段，其中尤以原住民轉型正義與共管、社區磨合，如何結合區外保育、國土生態綠網等課題最為重要，但是，國家公園卻反應遲鈍，遠遠不及林務局的努力，連最基本的治理也大有檢討空間，其根本原因不在於基層人員不努力，而是組織錯置、決策失衡、經營定位不明。</p>\n<h3>土地規劃、營建不該主導經營</h3>\n<p>國家公園設立之初，基於沒有合適的中央機構可以收治，因緣際會被納入「內政部營建署」，最大的問題是人事任用。歷任營建署署長、國家公園處長，以地政都計、工程背景居多，連官員也越來越多類似背景，然而，國家公園需要環境、生態與人文的專業者，自然資源管理專家，建立基礎研究，以反映到經營管理和決策，目前的人事配置顯然已經失衡。</p>\n<p>國家公園是透過五大分區（保護、景觀、遊憩、史蹟保存、一般管制區）進行土地利用的管理，然而，國家公園的土地分區很少變動，僅是透過5年一次的通盤檢討，調整一小部分的分區，並不像區域計畫、都市計畫涉及大量的個案開發、土地變更案。因此，土地規劃不該主導國家公園的經營管理，土地管制也不等於保育。</p>\n<p>台灣國家公園符合世界自然保育聯盟（IUCN）於1969年訂定的世界保護區標準，是台灣最高層級的保育機構，《國家公園法》開宗名義是「為保護國家特有之自然風景、野生物及史蹟，並供國民之育樂及研究，特制定本法」。</p>\n<p>然而，多年來，工程營建主導整個國家公園的經營管理，加上預算法規所設下資本門（營建工程等）過多，使得國家公園很長一段時間都處在敲敲打打的硬體建設階段，2000年之後更配合《促進民間參與公共建設法》推出許多爭議的BOT開發案，而最重要的自然保育的規劃執行、研究、教育推廣則日益萎縮、流於形式。</p>\n<p>這些問題，2007年在林子凌等民間人士的努力下，將資本門（營建工程等）與經常門(人事、業務等)的比例，從二比一，調整為一比一之後，加上BOT案件的停止，積極營建工程建設的導向才有所緩解。</p>\n<p>然而，國家公園組織定位不明的問題，仍然無解。因此，多年來，行政院的組改規劃都是將國家公園改為「環境資源部」主管，要讓它放在對的位置。然而，2018年在內政部前部長葉俊榮積極遊說下，行政院前院長賴清德突然大轉彎，讓國家公園仍留在內政部，這樣的決策欠缺前瞻充分的理由，只有看到機關的本位主義與權宜。</p>\n<h3>組改重新確立價值定位</h3>\n<p>據了解，行政院組織改造已到最後階段，國家公園組即將升格為國家公園署，人員編制可能從現有30多人增加到100人，如果可以增加環境、生態與人文等領域專業人力，當然是好事，但如果繼續由內政部原有的系統調任，國家公園的前景令人擔憂。</p>\n<p>國家公園不該只是美美的國家旅遊門面，都會區的後花園，而是台灣面對氣候變遷，整體社會生態系統韌性的一部分，應該打開封閉的系統和決策，重新確立經營的主軸、價值定位，而行政院組改正是一個契機。籲請重視山林保育的蘇貞昌院長重新檢討：為什麼國家公園不是去環境資源部？</p>\n<p><hr></p>\n<p>本文為20200827蘋果日報論壇投書：<a href=\"https://tw.appledaily.com/forum/20200826/MFZPQV3BGNFBTH2EBUNAMEGLUY/\">蘇院長，國家公園怎不去環資部（李根政）</a></p>"}, {"nid": 3975, "title": "露營場不應無條件合法，應制定彈性且因地制宜的管理辦法", "original_topic": "山林水土;山坡地不當開發;國土治理", "adopted_cats": ["森林守護與林業改革"], "content": "<p><img alt=\"20210628-003.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20210628-003.jpg\"><br>\n<p><span>台灣露營場 (李宗明攝)</span></p></p>\n<p>在社會焦點集中於疫情之際，政府多個機關（包含交通部、內政部、農委會、地方政府等）近期正在研議透過放寬<a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0060013\">《非都市土地使用管制規則》</a>（簡稱《非都管》）的容許使用，來作為<a href=\"https://udn.com/news/story/7266/5427395\">露營場合法化</a>的途徑。然而，根據經濟部地質調查所指出，全台目前有230處露營場位於順向坡地質敏感區，這些露營區若在無把關機制的情境下直接合法，未來若不幸發生災難，誰該負責？</p>\n<p>據<a href=\"https://gis.tbroc.gov.tw/TTE/index.jsp\">觀光局露營區查詢專區</a>截至2021年5月的統計，全台1,989個露營場中，僅有約8%「完全符合相關法令」，因此訴求露營場合法化的聲音不斷。其實，山林中的休閒遊憩活動普遍都有缺乏管理法規和主管機關不明的問題，也衍生出大大小小遊憩行為樣態的衝突與討論。 <strong>我們反對無條件放寬《非都管》的容許使用，呼籲政府應在《非都管》中加入彈性及因地制宜的露營場設置建議，這才是處理露營場亂象的正道</strong>。</p>\n<p>以下梳理與露營場設置、管理相關的重要法規制度，並提出修訂方向和管理上的建議</p>\n<h3>困境1：無單一主管機關，觀光局負責露營事業卻「管不了」</h3>\n<p> 與露營場相關的法規不少，包含《國家公園法》、《都市計畫法》、《區域計畫法》、《水土保持法》、《森林法》、《廢棄物清理法》、《農業發展條例》、《山坡地保育利用條例》、《飲用水管理條例》、《非都市土地使用管制規則》、《休閒農業輔導管理辦法》、《露營場管理要點》⋯⋯等，牽涉到內政部、農委會、環保署、經濟部水利署、交通部觀光局等多個部會機關。</p>\n<p>行政院2016年11月25日召開露營分工會議，決議露營活動推廣、輔導及協助等相關措施，由交通部觀光局主政；有關露營場地之管理、安全規範及土地開發行為等事宜，則由各目的事業主管機關本於權責辦理。也就是說， <strong>觀光局雖然是主要負責露營活動的主管機關，但具有管制效力的法規工具是散落在各目的事業主管機關，觀光局實際上沒有工具可以「主管」露營場的區位問題</strong>，因此從法規角度和管理權責上來看，露營場管理真的頗複雜，僅靠觀光局很難落實執法管理！</p>\n<h3>困境2：現行法規中，可合法設場的區位少、門檻高 </h3>\n<p>我們先來看看目前的法規，哪些地方可以設置露營場又分別有什麼規範：</p>\n<p><ol></p>\n<p><li>位於國家公園中的一般管制區或遊憩區，並經內政部營建署許可。</li></p>\n<p><li>位於都市計畫區中，且符合該管都市計畫及土地使用管制規定。</li></p>\n<p><li>位於都市計畫區的農業區或保護區，並依《休閒農業輔導管理辦法》申請設置。</li></p>\n<p><li>位於非都市土地的遊憩用地、丙種建築用地，可免經申請許可即容許設置。</li></p>\n<p><li>位於非都市土地，且為工業區、河川區以外之農牧用地，並依《休閒農業輔導管理辦法》申請設置。</li></p>\n<p><li>位於非都市土地，且為工業區、河川區及森林區以外之林業用地，並依《休閒農業輔導管理辦法》申請設置。</li></p>\n<p><li>&nbsp;除前述各點，若位屬《水土保持法》適用範圍，應檢附水土保持完工證明文件。</li></p>\n<p></ol></p>\n<p><a href=\"https://cybsbox.cy.gov.tw/CYBSBoxSSL/edoc/download/42204\">監察院2018年的調查報告</a>顯示，<strong> 有高達67.9%的露營場違規情形，是因為位於非都市土地中的「農牧用地」或「林業用地」上，因難以符合設置休閒農場的最小面積門檻0.5公頃而違法</strong>，對運用生產力較低或毗鄰土地設置露營場的地主來說，不是不願意申請，而是申請了也不會准，這個最小面積門檻的規定，原意為避免農地破碎不完整，但卻也成為露營場難以合法的主因。</p>\n<p><img alt=\"20210628-001.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20210628-001.jpg\"><br>\n<p><span>台灣山區露營場 (李宗明攝)</span></p></p>\n<h3>「全部停業」或「全部合法」都不合理</h3>\n<p>其實，露營場的樣態非常多元，有些地主希望提升農地或林地的產值，在不嚴重擾動環境下，利用山坡地上無法或不適合耕作的邊邊角角土地，或相對較平緩的區塊來開闢露營場，同時為了保留「與自然親近」的元素吸引遊客，僅將土地上的部分植被移除、拉水拉電，再放上木棧板作為營位，整體來說屬於可恢復的輕度開發行為。而這樣的使用樣態，是否真的不得容許在農牧用地、林業用地上局部利用，應有再討論的空間。</p>\n<p>不可諱言，現況下還是存在對環境擾動較大或有<a href=\"https://www.cy.gov.tw/News_Content.aspx?n=125&amp;s=20360\">污染水源疑慮</a>的露營場樣態，但無論如何，在山坡地上的開發行為，背後都會有水土保持的風險及開發行為所造成的外部成本，尤其在現今極端氣候的情境下，我們必須更謹慎面對可能的風險危害。</p>\n<p><strong>正因為露營場的樣態非常多、每個露營場所在的環境條件都不見得相同，所以要一概而論全部就地合法，或全部要求業者停業，都既不合理、也不應該。我們從露營場「違法」主因看到現行法規與實務扞格之處，面對已存在的露營場，若藉由無條件地放寬《非都管》的容許使用，會有忽略環境風險的疑慮；但若持續使用現行規定，則會有許多有心合法的地主無路可走。</strong></p>\n<p>因此，在露營場合法化的進程中，若希望能確實管理露營場設置及營運，並取得環境保護、生態保育及經濟、休憩活動下的平衡，我們認為應先行釐清以下問題。</p>\n<h3>問題1：什麼樣的地方不適合設置露營場？</h3>\n<p>哪些條件下，「現存的露營場」其實沒有太大問題、哪些真的不合適必須移除？哪些地方適合「新闢露營場」、哪些地方不適合？這是關心露營場合法化的人最在乎的大哉問，其中最難回答的是「適不適合的判斷因子有哪些」、「每一個因子的判斷標準」又會是什麼？這涉及對露營場使用區位與開發強度的盤點，也包含了災害風險、生態干擾、維持宜農環境、是否具備對外交通的聯繫……等資訊的掌握，以便進一步進行土地使用適宜性評估。</p>\n<p>立法院法制局去年11月針對露營區管理的<a href=\"https://www.ly.gov.tw/Pages/Detail.aspx?nodeid=6590&amp;pid=204594\">研析文章</a>中提到：</p>\n<p><blockquote><p>「經濟部地質調查所指出，全台目前有230處露營場，位於順向坡的地區，或曾發生過土石崩塌，或地表變形有山崩潛在風險的地質敏感區，這類地質敏感區並非有立即危險，若經地質調查評估確認安全無虞，並非不能開發。」</p></p>\n<p></blockquote></p>\n<p>此段文字雖已提出「災害風險」必須納入評估的概念，卻仍未特別指涉「什麼樣的地方不適合設置露營場」？再者，這段關於地調所的文字也明白表達出「能不能開發/設置露營場」不是地調所的權責範圍，那會是誰的權責呢？</p>\n<p>交通部觀光局有一份稱不上法規，頂多算是行政規則或指導的「<a href=\"https://www.taiwan.net.tw/userfiles/file/%E9%9C%B2%E7%87%9F%E6%B4%BB%E5%8B%95%E5%A0%B4%E5%9C%B0%E8%A8%AD%E7%BD%AE%E5%BB%BA%E8%AD%B0.pdf\">露營活動場地設置建議</a>」，內容談及露營場不適合興闢在坡度超過30%的坡地上，坡度超過10~20%則要採階段式建設，也特別提到：</p>\n<p><blockquote><p>「不得設於土石流潛勢危險地區、無既有道路通達地（避免興闢道路，破壞山林與水土保持）、環境敏感區等，並應考量設施規模。」</p></p>\n<p></blockquote></p>\n<p>這是翻遍露營場相關規定中，最接近設置原則的管制文字了，但還是有太過簡化山坡地上土地使用樣態複雜性的問題，恐無法滿足台灣山區目前各種樣態露營場的管理需求。</p>\n<h3>問題2：如何執行「露營活動場地設置建議」？</h3>\n<p> 繼續追問下去，觀光局有沒有法規工具可以執行這份類土地使用管制規則的設置建議呢？目前答案是沒有。除非露營場申請規則中有主管土石流潛勢溪流的農委會水保局、主管道路的交通部、主管各環境敏感區的各級機關表達意見的行政程序，否則這些「建議」，只是可以左耳進右耳出的空話，沒有實質管理、管制的功能。</p>\n<p>再查「<a href=\"https://www.taiwan.net.tw/userfiles/file/03-%E9%9C%B2%E7%87%9F%E5%A0%B4%E7%94%B3%E8%AB%8B%E6%A8%99%E6%BA%96%E4%BD%9C%E6%A5%AD%E6%B5%81%E7%A8%8B%E5%9C%96.pdf\">露營場申請作業參考流程圖</a>」，欲新闢一個露營場，必須備妥文件向「地方政府」申請，若都符合規定，下一步則是「建議擇期函請建管、都住、地政、農業、水利、消防、觀光等相關單位現場會勘」，最後一步則是書面審查。簡言之，在整個流程中其實看不太出來哪一個步驟會去套疊圖層、把關區位適宜性、評估災害風險。</p>\n<p><img alt=\"20210628-004.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u353/20210628-004.jpg\"><br>\n<p><span>台灣露營場區(李宗明攝)</span></p></p>\n<h3>明定《非都管》中的因地制宜措施才是解決之道</h3>\n<p>若將露營場是否可以合法化的標準，著重於評估區位適宜性、災害風險及露營場造成的環境外部成本，或許從空間/土地管理的面向著手，適度放寬《非都管》中的農牧用地、林業用地使用項目規範，並進一步透過「嚴謹的附帶條件」進行把關，可視為一條解決問題的路徑。</p>\n<p><strong>從空間治理的觀點來看，「嚴謹的附帶條件」能否適當的把關，有兩個關鍵：</strong></p>\n<p><strong>第一個關鍵是中央目的事業主管機關（目前看起來是交通部觀光局）能否產出一份具體可行的「露營活動治理策略」，此策略要有區位引導及設置原則、露營場域規劃原則、審查及查核管理機制⋯⋯等內涵。</strong></p>\n<p><strong>第二個關鍵則是地方政府要有「因地制宜及總量管制制度設計」的權限，制定出來的規則要能對應到觀光局的治理策略。</strong></p>\n<p>目前觀光局的「<a href=\"https://www.taiwan.net.tw/userfiles/file/%E9%9C%B2%E7%87%9F%E6%B4%BB%E5%8B%95%E5%A0%B4%E5%9C%B0%E8%A8%AD%E7%BD%AE%E5%BB%BA%E8%AD%B0.pdf\">露營活動場地設置建議</a>」，太過粗略，而涉及範圍太廣，且也未必合理，更嚴重的是完全沒有因地制宜的空間，恐無法有效管理目前台灣近2,000家既有的露營場。因此，在露營場合法化的推動進程中，觀光局應先上山實查露營場的各種樣態，唯有如此才得以根據各式不同樣態的露營場、不同條件的空間範圍，制定出「具彈性且因地制宜的治理策略」。</p>\n<p>我們反對直接無條件放寬《非都管》的容許使用來作為露營場合法化的唯一途徑，要求應在現行體制下參考如「國土計畫」使用許可審查等相關作法，修改《非都管》放入更因地制宜的露營場設置建議，這才是正確的處理方式。</p>\n<p>隨著行政院<a href=\"https://www.twreporter.org/topics/human-interference-on-wildlife\">向山致敬政策</a>鼓勵國人親近山林以降，各種遊憩行為樣態的衝突與討論，都值得我們更細緻的探究，摸索更因地制宜的治理方式。在目前露營場合法化的政策下，可能位於災害風險的露營場（至少有230個露營場位於順向坡），幾乎沒有任何把關機制就將直接合法，未來若不幸發生災難，誰該負責？</p>\n<p>露營活動已經成為當今台灣非常流行的戶外休閒活動，也創造為數可觀的經濟產值，因此我們期待在平衡山區商業活動生計、國人休閒遊憩需求、坡地災害風險評估、維護宜農環境與生態等各項因子的情境下，發展適宜的評估規範，將災害風險、生態干擾降到最低，能輔導合法的積極輔導，真的不適宜的給予業者時間移除與復原，讓台灣山林中的遊憩行為可以被合理且有系統的規範與管理。</p>\n<p><hr></p>\n<p>（本文為2021/06/25 刊載報導者：<a href=\"https://www.twreporter.org/a/opinion-camping-area-legitimate-dispute\">露營場不應無條件合法，應制定彈性且因地制宜的管理辦法</a>）</p>"}, {"nid": 4033, "title": "北美館碳中和展覽走味的美意：大崙尾山伐木造林，為何爭議？", "original_topic": "森林與林業政策", "adopted_cats": ["森林守護與林業改革"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/1_2.jpg\"><span>台北市立美術館和台北市政府工務局大地工程處合作，委託台北市林業技師公會在大崙尾山造林，因過程砍除原處樹種，引發爭議。地球公民基金會執行長李根政解說，照片前方是造林地，每一根竹桿旁都種上肖楠，但反而是周圍天然的白桕長得又快又好。後方則是原有次生林的樣子。（圖 / 地球公民基金會）</span></p>\n<p>台北市立美術館2020雙年展「儲回大地的藝術」計畫，經過計算排放390噸的二氧化碳，為了要折抵這些碳排，在林業試驗所的建議下，北美館和台北市政府工務局大地工程處合作，委託台北市林業技師公會在大崙尾山造林，來折抵390噸的碳排，希望可以實踐碳中和。這是台灣的美術館主動為展覽排碳做出的負責任作為。</p>\n<p>然而，主辦單位的作法，是把原有森林裡的小樹和灌木砍除，清理出可以造林的土地，僅保留珍貴稀有樹種或直徑大於25公分以上的樹木，然後種上林務局列為「國產材」的樹種──肖楠、相思、楓香，聲稱這是營造複層林的「林相改良」。此舉引起了荒野保護協會與許多自然愛好者的抗議，持續引發爭議中。</p>\n<p>造林，如果是在原本沒有森林的地方種樹，或者，把銀合歡這類強勢外來種砍除再種樹，不會有爭議。但是，現有森林好好的，為什麼要「改良」？</p>\n<p>林業試驗所的研究報告指出，大崙尾山森林類型屬於「經改造天然林」，早期曾為開發造林及農作之林地，現已逐步演替為物種多樣、多層次的闊葉樹林，這種森林類型一般稱為「次生林」。</p>\n<p>今年（2021）9月初，筆者應友人之邀和同事現勘二塊伐木造林地，我能夠辨識的不多，靠的是同事呂翊齊愈來愈厲害的植物辨識力。我們看到被保留的樹種有：薯豆、赤楠、烏來柯、楊梅、大頭茶等，其中顯著的大樹是烏來柯，其樹冠渾圓可愛，令人一看就難忘，其中一棵可能超過百年。對我這個長住高雄的人來講，可以說是看到北部龍貓森林中視覺上的指標樹木吧！而被砍除後重新萌蘗的樹種有：裡白饅頭果、鼠刺、山漆、橢圓葉赤楠、江某、大頭茶、茜草樹、頜垂豆、紅楠等原生樹木。這些樹種多數人們可能都感到陌生，但它們可是植被演替過程中屬於後期的植被組成，代表已經過長時間自然演替，如果沒有人為干預，這片森林將逐漸走向成熟的天然林。</p>\n<p><h2><span>森林的美醜、價值，誰說了算？</span></h2></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/2_0.jpg\"><span>疏伐區保留下來的烏來柯大樹，樹冠渾圓，十分醒目。（圖 / 地球公民基金會）</span></p>\n<p>然而，北市大地工程處如何描述這樣的森林？</p>\n<p>在「儲回大地的藝術」計畫的解說牌上，他們的形容詞是：「鬱閉、雜亂、不利森林健康、碳吸存能力逐漸降低」，而經過整理造林之後則是「透光、通風、森林越趨健康。」</p>\n<p>「鬱閉、雜亂」，我聯想到的是高雄柴山的熱帶海岸林，台灣的天然闊葉林，或者南美和南亞的熱帶雨林，它代表的是生物多樣性。</p>\n<p>「不利森林健康」，聽起來很主觀，我沒有看到這個計畫相關的報告書，用什麼標準去衡量一座森林的健康程度。</p>\n<p>很明顯，這是站在「經濟林」的標準來看待「天然林」。林相改良的目標，就是把天然闊葉林改造為接近人工林的樣子。也難怪會引起荒野保護協會、自然愛好者的強烈反彈，因為這裡是荒野協會帶著人們長期觀察和從事自然教育的場域，已長達20多年，看的就是生物多樣性，現在卻要被改造為人工林的樣子。</p>\n<p>一座被視為「雜亂」的森林，反映人們期待森林扮演的功能，也是對理想中美景的想像和投射。每個人的美感品味，除了主觀感受，也與知識經驗有關。例如，我們在這次勘查中，深深被渾圓的烏來柯大樹吸引，如果有機會在附近的公園種樹，我會選擇這個樹種，而我相信多人們如果看過他的樣子，也會留下深刻印象。</p>\n<p>但是，在大崙頭尾山的步道入口石頭厝的草地，種的樹是外來種，很明顯適應不良，生長情況不佳，這反應了誰的美感？是建築景觀設計師、園藝廠商，或者公部門、里長、里民？</p>\n<p><h2><span>矛盾的價值選擇：要守護人工植入的樹種優先，還是讓大自然復育環境？</span></h2></p>\n<p>這場伐木造林作業，並沒有開設林道，也沒有使用大型機具，純以人工施作，砍伐下來的樹木則做為防止水土流失的天然材料，就我看過的造林地，是很用心的在避免對地表的擾動。如今造林工程已經結束，目前延續性的爭議課題是：種的樹到底是台灣肖楠，還是中國翠柏？碳吸存量如何計算？是否進行除草撫育，還是任其自然演替？</p>\n<p>樹種的問題，我認為透過專業檢視和論辯就會有答案。比較難處理的是要不要除草撫育？減碳如何計算？</p>\n<p>人工種植的樹木，其實在野外並不容易存活。我們看到種下的肖楠，幾乎被天然下種的白桕和野桐小苗所包圍，伐木所留下的樹頭也很快長出了枝葉，如果不除掉它們，森林又開始進入自然演替，肖楠可能無法存活。</p>\n<p>從經濟林的觀點，如果不去撫育，種下去的樹死了，等於之前的計畫都是做白工；但就自然保育的觀點，讓自然去療傷復育，也許20年後森林又可以恢復原來的狀態。要讓人工種的單一樹種活下去，還是讓多樣天然下種的樹活著，這是兩種矛盾的目標和價值選擇。</p>\n<p>十多公頃的伐木造林區，是要讓兩種作法並存，或者採行其中一種作法？</p>\n<p><h2><span>390噸碳中和的試驗</span></h2></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/3.jpg\"><span>圖由左而右為：尚未疏伐的天然林，插著竹桿就是造林肖楠，還很小棵。（圖 / 地球公民基金會）</span></p>\n<p>以造林作為減碳方案，在台灣能做的規模相當小，最大困難是找不到土地。依據東華大學長期的研究，在花蓮大農大富平地造林碳吸存量為每年每公頃10.9公噸（約造林18年），如依該地的日照條件設置太陽光電，則每年每公頃減碳量目前為576噸。</p>\n<p>這一次北美館碳中和的目標是390噸，則約是36公頃的平地造林一年的吸存量（假設條件和大農大富的平地森林一樣）。若使用光電，僅需去找0.7公頃的屋頂或合宜的土地，在第一年即可達成目標，為何需要如此大費周章造林？</p>\n<p>假設次生林中的多樣小樹和灌木，已在發揮碳吸存的功能，而造林作業從伐木開始，所伐下的植體和林地土壤的有機碳，會因分解作用釋出碳。而新種上去的肖楠、楓香、相思樹小苗的吸碳量（樹種不同會有差異），未必能夠快速抵過釋出的碳，整個系統可能要好幾年才開始具有碳吸存的功能。</p>\n<p>把原有直徑小於25公分的一群樹木和灌木砍除，再種上一棵棵小樹。好比長跑比賽中，把已經跑了1,000公尺的選手換下來，另外找一個「被認為很厲害」的選手，從負1,000公尺開始跑起，然後宣稱這樣所累積的里程數更多。</p>\n<p>該計畫有關碳吸存量的推估是參考國外的方法學，而非根據台灣在地的研究成果，嚴格說來，這次的作業是否可以達成碳中和的目標，並非完全肯定的答案，比較像是一個試驗計畫。尤其是在疏伐原有次生林再造林，是否真有比原有森林更好的碳吸存效果，還需要長期的監測研究比對。</p>\n<p><h2><span>誤入叢林的北美館</span></h2></p>\n<p>北美館「儲回大地的藝術」碳中和計畫，是台灣第一個美術館主動提出要折抵大型展覽碳排的案例，而且北美館也盡他們所知去找了林試所、台北市府等機關徵詢，這樣的初衷該給肯定。只是，他們不了解台灣在生態保育與林業經營上目標不同、經營方式也有差異，林業專家和生態學家、自然愛好者、環境團體的觀點和作法一直欠缺對話，北美館意外的掉入了一個水很深的爭議當中。</p>\n<p>事實上，台北市政府大地處在2018年已妥託嘉義大學在大崙頭山進行林相改良計畫，2019年已完成5公頃，並規劃在其後3年每年持續完成約7公頃。這次北美館複層林碳中和案位於大崙尾山，兩案地點緊臨，可以說是一個延續性的計畫，只是由北美館來出400萬的初期費用。</p>\n<p>3年來，大地處在大崙頭山的伐木造林計畫，並沒有經過公共討論，倒是透過和北美館的合作計畫，讓過去隱而未現的爭議浮上了抬面。</p>\n<p>或許北美館可以藉此機會學習，藝術活動要更謹慎地介入自然世界，必須要多徵詢不同領域的專業者，可能的利害關係人。此外，如何折扺展覽所產生的碳排，可以再多徵詢了解其他多元的方案。然而，最該被公眾檢視的是台北市森林政策，台北市工務局大地工程處應該主動和市民商討。</p>\n<p><h2><span>爭議源頭，來自北市欠缺公眾溝通的公有林政策</span></h2></p>\n<p>台北市的林地面積約5,867公頃，由林務局管轄的國有林占3,024公頃，由市府管轄的公有林492公頃，私有林則是2,351公頃。這一次引發爭議的林地正是屬台北市公有林。</p>\n<p>當走在伐木造林地和步道上，我一直會聯想起高雄的柴山，這些山林都曾經被開發砍伐，經數十年的自然復育，成為天然的闊葉林，保有生物多樣性，已穩定提供水土保持、水源涵養、清淨空氣等生態服務，更因為鄰近人口密集的都會區，多數有登山健行步道，常年提供市民休閒遊憩、自然教育的功能。高雄柴山在高雄市民的要求下，更成為台灣第一個國家自然公園。</p>\n<p><span><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/4_0.jpg\">在「台北市大崙頭山林地示範區調查及營造成果報告書」中，有明列大崙頭山林相改良2020年分區規畫的種植苗木種類選擇及面積配置。（圖片取自／台北市政府工務局大地工程處）</span></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/6_0.jpg\"><span>大崙頭山林地示範區分區位置圖。（圖片取自／台北市政府工務局大地工程處）</span></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u388/5.jpg\"><span>根據「台北市大崙頭山林地示範區調查及營造成果報告書」，大地工程處在52.7公頃的公有林地中，選擇13塊共10.11公頃做塊狀疏伐，此圖為其分布圖。（圖片取自／台北市政府工務局大地工程處）</span></p>\n<p>永續林木區意味著要從事造林、伐木、集材、運輸木材等林業活動，和休閒遊憩、自然教育必然衝突，人口密集的都會區合適嗎？台北市民知道並認同這樣的規劃嗎？</p>\n<p><h2><span>是時候開啟森林定位的討論</span></h2></p>\n<p>台灣的都市綠政，多數聚焦於公園、行道樹中的種樹、砍樹、修剪課題，欠缺對於自然野地經營管理的討論與長遠規畫。從這個事件中，我們看到台北市府大地工程處的公務員相當積極地想要經營台北市的森林，但是方案和執行過程，都欠缺公共討論。</p>\n<p>值得肯定的是，大地處委託林試所做了一份「109年度台北市林地整體發展建議報告」，其中已有許多林地的基礎資訊，可以提供市民討論。</p>\n<p>如果透過資訊完整揭露，並主動召開座談會、公聽會，釐清台北市公私有林的定位，並和社會商討其經營方式，或許大崙尾山伐木造林爭議，可以成為台北市市民參與討論森林定位的契機，一起來思考辯論：我們期待森林扮演什麼功能，那些森林要維持天然林？那些要營造特定的景觀林？又或者，真的可以支持一部分的林地來發展經濟林。</p>\n<p>&nbsp;（本文為2021/9/28報導者投書：<a href=\"https://www.twreporter.org/a/opinion-taipei-biennial-afforestation-dispute\">李根政／北美館碳中和展覽走味的美意：大崙尾山伐木造林，為何爭議？</a>）</p>"}, {"nid": 4045, "title": "林務局屏東林管處回應講座中民眾的提問", "original_topic": "森林與林業政策", "adopted_cats": ["森林守護與林業改革"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20211028-03.jpg\"></p>\n<p>\t<a href=\"https://www.cet-taiwan.org/events/4003\">2021森之旅--地球公民森林系列活動</a>中第三場<a href=\"https://www.cet-taiwan.org/events/4005\">【台灣國產木材現在進行式--經濟林的前景】</a><br>\n<p>演講邀請了屏東林區管理處楊處長、永在林業林總經理到高雄總部現場與民眾分享最新的國產木材動態發展。這場將近兩百位民眾參加的講座，民眾提問非常熱烈，許多現場來不及回應的問題，透過林務局屏東林區管理處的回覆整理如下：</p></p>\n<p>\t<strong>Q1：林務局有打算要賣國有經濟林的木材嗎？目前是公務機關是否是一個阻礙？</strong><br>\n<p><span><strong>A1：</strong></span>目前各林管處皆持續在國有造林地中執行疏伐撫育作業，作業後之疏伐木會透過公開標售，提供至國內市場國產木材，相關標售資訊可至林務局或各林區管理處之官方網站查詢。除公開標售作業外，消費者亦可透過<a href=\"https://www.taiwanwood.org.tw\">臺灣木材網</a>、<a href=\"https://qrc.forest.gov.tw\">臺灣林產品生產追朔系統</a>等系統，確認及買賣國有林產製品。</p></p>\n<p><strong>Q2：國有林的FSC是用什麼方式付款？日本是用森林環境稅的方式，像天龍地區(國有林）的木材有fsc認證，一般木材業使用天龍材有補助金，請問使用國有林的FSC木材有無獎勵金</strong><br>\n<p><span><strong>A2：</strong></span>屏東處的FSC森林驗證作業是依照採購法，向第三方驗證公司繳交稽核費用。使用國有林的FSC木材目前雖無獎勵金，但林務局已經在推動取得通過驗證的國產材成為政府公共工程的指定或優先使用材料之政策。另「林業多元輔導方案」中，對於參與FSC森林驗證之林農，亦有驗證費用之補助條款。</p></p>\n<p><strong>Q3：從禁伐天然林之後已經過三十年，有經驗的伐木工和師傅逐漸凋零，想問林務局目前怎麼樣培育新進林業人才？</strong><br>\n<strong><span>A3：</span></strong>除了機關內部員工的職能訓練外，林務局目前在竹東地區推動建立林業教育訓練基地，請有經驗之師傅，在林務局直營林地進行現場教學、操作，培育新進林業人才。</p>\n<p><strong>Q4：請問楊處長，你們有林業政策的宣導行銷嗎？一般民眾買菜是願意多花錢買有機的，但是木製品的來源，沒有相關觀念啊！</strong><br>\n<strong><span>A4：</span></strong>目前林務局林業政策的宣導管道，包括參與臺北國際建材展的「國產材臺灣館」、每年定期舉辦之森林市集、與產業界之各類研討會，以及Facebook森活情報站的宣傳等多元型式；另屏東林管處也會以新聞、Facebook、市集、活動等方式，宣導林業政策，如：<a href=\"https://www.facebook.com/pingtung.forest.gov.tw/posts/293625002040234\">人工林疏伐及伐採作業</a>、<a href=\"https://www.facebook.com/pingtung.forest.gov.tw/posts/295751575160910\">人工林可以不進行疏伐或伐採作業</a>？等，也請民眾朋友可多協助宣傳。</p>\n<p><strong>Q5：剛才提到的，以前是人工林現在變次生林，政府有明確的處理方式嗎</strong><br>\n<strong><span>A5：</span></strong>林務局透過人工林清查計畫，重新盤點人工林資源，將道路不可及、環境敏感區之林地排除，其他可生產性之人工林則規劃持續進行林木生產。以屏東處的驗證林地為例，驗證範圍內之森林過往多為人工林，但透過森林資源調查，將林地重新規劃為高保護價值森林、天然林恢復區與人工林經營區，其中位於高保護價值、天然林恢復區之森林，不進行經濟生產，僅執行林地巡護、監測作業，並以生態保育或國土保安為主要經營目標；條件適合經濟生產的人工林，則以生產優良國產材為主要經營目標，分年分期更新，並持續撫育，期可在下一期輪伐期繼續生產。透過森林資源的重新盤點與規劃，希望人工林作業可兼顧環境、社會、經濟等面向。</p>\n<p><strong>Q6：林務局選的五種經濟林種包含相思樹、櫸木、香杉、臺灣杉與臺灣肖楠作為未來經營基礎，不過目前國人似乎好像不太接受相思木的傢俱？想請問這五種樹木未來的利用方式？</strong><br>\n<strong><span>A6：</span></strong>林業試驗所選出的相思樹、櫸木、香杉、臺灣杉與臺灣肖楠等5種經濟樹種，相關簡介如附表2。相思樹因材質堅硬，早期不易加工，因此主要應用目的為薪炭材，然近年來因加工技術進步，相思樹已可全株加工利用，為近年來極受歡迎之市場用材。消費者如有需求可至<a href=\"https://www.taiwanwood.org.tw\">臺灣木材網</a>查詢相關銷售資訊。<br>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20211101-5.png\"><strong><span></span></strong></p></p>\n<p><strong>Q7：最近大崙尾山砍樹新聞提到：即使經過森林系教授評估，但原說要種台灣肖楠卻變成了中國翠柏，想請問林務局人工林種植上是怎樣跟林農溝通，會不會發生這種種錯樹或誤砍大樹的情況。</strong><br>\n<strong><span>A7：</span></strong>大崙尾山作業因無實際參與，故無法為該作業代為回應。屏東林管處在與林農溝通造林樹種時，會以「<a href=\"https://law.coa.gov.tw/glrsnewsout/LawContent.aspx?id=GL000533\">獎勵造林樹種及每公頃栽植株數基準表</a>」供林農參考，分析經濟林市場，以產業方向作為輔導培育過程。林務局所提供之苗木，從採種到育苗之過程皆會加以紀錄，確保配撥苗木種子母樹的來源。</p>\n<p><strong>Q8：針對國產材的市場，林務局是否有計畫推動第三方建立台灣內部的認證系統?</strong><br>\n<strong><span>A8：</span></strong>目前林務局正推動QR code、TAP、CAS三項目為國產材第三方認證系統，提供林業相關廠商辦理國產材之認證。其中QR code、 TAP認證委由財團法人台灣建築中心辦理，另由中華木質構造建築協會輔導，CAS認證部分，則係委由財團法人台灣優良農產品發展協會辦理。</p>\n<p><strong>Q9：想請教處長，現今留存的人工林達30年的樹種，再不久後會如何利用呢?謝謝</strong><br>\n<strong><span>A9：</span></strong>枋山溪人工林地已經透過森林資源調查，將林地規劃為高保護價值區、天然林恢復區與人工林經營區，其中位於高保護價值、天然林恢復區之森林，不進行經濟生產，僅執行林地巡護、監測作業；位於經濟生產區域的人工林，將分年分期更新，持續撫育，維持人工林之健康狀態，期望國有林的木材自給率在117年可達到3.5%。</p>\n<p><strong>Q10：作業後造林後幾年，種子庫會越來越少，想請教處長，後續的人工林種植只會挑選闊五木選擇種植，會不會不夠多樣化?進而減少生物多樣性呢?</strong><br>\n<p><span><strong>A10：</strong></span>枋山溪的人工林，經過林相更新以後，因造林木年齡年輕化，有更開闊的生長空間，且可接受更多的光量，種子產量並不會因作業而減少。枋山溪的人工林已經依據森林資源特性，規劃出不同經營區塊，經營作業可兼顧生產與環境保育之平衡。造林樹種並不會只選擇闊五木種植，仍然會依照林地環境、經營目的，選擇適地適木之樹種。</p></p>\n<p><strong>Q11：請問處長，全區申請FSC的部分，請問竹業是否也會被納入呢？</strong><br>\n<strong><span>A11：</span></strong>竹林經營也可參加FSC森林驗證，因此國有林地內之竹林作業也會納入驗證。</p>\n<p><strong>Q12：台灣木材協助台灣林場的銷售率是否有提升？ 在市場上消費者如何去找到台灣產的木製品？</strong><br>\n<p><span><strong>A12：</strong></span>國產木材常供不應求，國產材(臺灣製)木製品可以至臺灣木材網訂製，另亦可至臺灣林產品生產追溯系統洽詢取得國產材QR_code廠商購買，目前南部地區取得廠商計有15家，其中9家係由本輔導取得牛樟、櫸木、黃連木、苦楝、紅檜、台灣杉及龍柏等原木產品認證，民眾可先至該系統尋找廠商及相關樹種資訊，另亦可電洽本處協助尋找廠商。</p></p>\n<p><strong>Q13：請問處長：1、林務局現在容許在林管處租地上開闢林業作業道嗎？申請流程請大致說明。2、剛剛您分享到用舊圖套疊新圖找出舊的作業道路線，減少開闢新路線對土地的衝擊，林管處有提供這項套疊服務嗎？可以找林管處哪一課尋求協助呢？</strong><br>\n<p><span><strong>A13：</strong></span>1、林農朋友可以前往農林航空測量所申購早期地圖，確認林地內的舊有作業道，並進行整修規劃，如需新闢作業道則須提出申請並申報相關水土保持計畫。<br></p>\n<p>2、屏東林管處主要是透過GIS軟體進行影像套疊，找出林地內就有作業道後進行整修，以不新闢作業道為原則，目前並沒有提供影像套疊的服務。</p></p>\n<p><strong>Q14：FSC 是可以出口歐洲的，但目前台灣品質未知，萬一台灣內銷不順利，國外管道又如何去輸出？能確定生產的品質被人喜歡嗎？有沒有嘗試考慮出國展覽或比賽？</strong><br>\n<strong><span>A14：</span></strong>FSC為國際森林驗證機制，是確保木材來自負責任的經營。目前因臺灣驗證面積所生產之林木，係透過公開標售程序，市場仍有極大需求，目前無出口之規劃。林務局標售之國產材，以原木或初級加工產品為主，也有與業界合作，推出各種國產材加工文創商品<br>\n<p>，並展示在國際建材展、森林市集等展場。</p></p>\n<p><strong>Q15：請問在台灣各種海拔氣候的環境下，主要是出產哪些樹種呢?</strong><br>\n<p><span><strong>A15：</strong></span>因臺灣各地氣候條件不同，各地生產的木材類型並不一致，北部與南部在同海拔的造林樹種也不一定相同，因此可到各林管處之官方網站查詢標售訊息，較可確認生產的樹種。如以屏東林管處而言，低海拔的木材生產樹種包含相思樹、光蠟樹等，中、高海拔的木材則有臺灣杉、紅檜等。</p></p>\n<p><strong>Q16：屏東林區管理處的人工經濟林與原生林交錯在一塊，這樣如何能區隔人工經濟林與原生林？ 會不會使用林班地做為區隔比較好做規劃與經營管理？</strong><br>\n<p><span><strong>A16</strong></span>：屏東林管處是依據森林資源調查盤點的結果來規劃林地的經營目標，因此會出現人工經濟林與原生林交錯的情形。以林班界線做區隔確實較便於規劃管理，但仍需考慮整筆林班的環境資源條件是否符合經營目標，否則就失去了分區經營的意義。林管處的圖資已數化為電子檔，可輸入到手機或GPS等載具內，透過現場定位即可確認所在林地之經營目標，不會造成混淆。</p></p>\n<p><strong>Q17：20年後中國會成為亞洲森林、木材蓄積量大國，台灣自給率不到一成，會不會被中國管制木材，導致台灣貨櫃也進不來？</strong><br>\n<strong><span>A17：</span></strong>依據2018、2019年之木材進口資料統計，臺灣木材進口來源主要來自馬來西亞、紐西蘭、所羅門群島(如附表1)，而非來自於中國。臺灣木材自給率不足1%的現象，不僅導致木材供應來源的不穩定，同時也有增加碳排放量、間接助長國際間非法木材貿易或天然林消失等疑慮，因此林務局積極推動木材自給率提升之政策，善盡地球公民的一份責任。也由於國內木材自給率不足1%，因此2017年全國農業會議決議木材自給率在2028年達到5%之政策目標，林務局已規劃其中由國有林生產3.5%、公私有林生產 1.5%、平地造林生產0.5%，近期因疫情無法進口木材，故更促使國產材產業之推動。<br>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20211101-6.png\"></p></p>\n<p><strong>Q18：人工林特別產業振興，有包括林業人才的補助方案嗎？日本林業就業人員有補助至少一百萬日幣，林業先進機械約5成，如今台灣的技術人員不夠，會不會造成都是用便宜工人去砍伐森林，導致民眾觀感不好</strong><br>\n<strong><span>A18：</span></strong>關於林業機械，目前農委會已有針對林業合作社及農會之林業生產機具補助方案，補助比例以不超過50%為原則，最高補助新台幣 300萬元。針對就業人員的補助，因涉及從業人員的定位，目前是沒有這樣的補助，但林務局與林業技師公會合作，已在竹東地區建立林業教育訓練基地，目前學員上課費用全免(食宿需由學員自行處理)，用以培訓新進林業人才。林務局推出的林業永續多元輔導方案，透過「夥伴」、「多元」及「友善」之核心價值，輔導林主與合作社，成立林農服務單一窗口，協助整合相關申請程序，希望能協助林主、經營團隊、機關(構)、學校瞭解政府相關資源，強化聯結，帶動國有林產業起飛，讓森林資源提供多元服務價值，詳細作業手冊可至<a href=\"https://www.forest.gov.tw/0000105/0005709\">林務局官方網站</a>下載。</p>\n<p><strong>Q19：日本的光蠟樹是屬於園藝造景用的樹木，台灣種的光蠟樹未來想達成什麼效果？</strong><br>\n<p><span><strong>A19：</strong></span>光蠟樹因其木材色具有油蠟色澤，材質堅軔優良，類似雞油，顏色較白所以又名為「白雞油」，除可當景觀樹種外，其材質堅軔，可當建築、傢俱、
