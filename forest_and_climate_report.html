南部人貼近土地，南部人最了解我常講的「土地與人的關係」。</p></p>\n<p>南台灣的鄉親、災民們早就在莫拉克災難中起來了。站起來幹什麼？打算下一次災難去救中部、北部、總統府。這不是在開玩笑，我很誠摯希望這些災難不再發生，但註定的，台灣一定會再發生。</p>\n<p><strong>氣候進入極端化變遷時期</strong><br>\n<p>過去地球8000年的氣候，是例外的穩定時期，也是地球46億年歷史的不正常特殊階段，人類脫穎而出，締造文明。但最近兩三百年工業文明總體變遷，終結這段超穩定的大氣候，進入地球史的正常、也不正常的極端化變遷時期。</p></p>\n<p>所謂正常，是回到原來的穩定；不正常，則是人類過去兩三百年改變歷史的結局。原始森林大部份消失，海洋魚類所有生態幾乎全面失序，從地球46億年歷史看人類文明，遠遠超過地球史上所有的大滅絕時代。對抗這些不穩定的極端化，相對能力最強的，只有原始天然林。</p>\n<p><strong>氣候因子跟齒牙災變</strong><br>\n<p>21世紀氣候極端值的變化，是20世紀前的10到66倍。例如極端強風、高溫、低溫等等。我們已進入古代時期所謂的「天地不仁，以萬物為芻狗，天有不測風雲。」台灣氣溫、雨量年平均值沒有顯著變化，卻可能在某幾月的某幾天有極端值變化，瞬間的極端值現象完全不在20世紀前的預測模式裏。</p></p>\n<p>極端值現象所畫出來的圖像鯊魚的牙齒，極端高溫、低溫，像鯊魚牙齒一樣，被這種牙齒咬到叫做「齒牙災變」。就像八八水災、賀伯災變，一時環境因子的重大變化，特別容易引發微生物、病毒、細菌等等。不是水災後還有流感？最恐佈的還沒來，更恐佈的還會發生。</p>\n<p>台灣生態帶在往上遷、往北移，1990年代極端化作用開始，台灣中高低海拔，森林不正常死亡，像鐵杉、檜木等，2000年後特別顯著。到了2006年我發現台灣海岸植物在最近30年來向北推進50到70公里。今後在這種極端化下，大死亡的現象會不斷爆發。</p>\n<p><strong>氣象預報的迷思</strong><br>\n<p>全球暖化、海平面上升最主要因素是溫度上升、海水膨脹。極地高山冰雪溶化，可生產地、可居住地受鹽化作用，山地隨時會局部大潰絕，河川地也不能使用，未來台灣可生產地、可居住地、安全的地區全面縮減。</p></p>\n<p>每次災難發生大家就罵氣象局，台灣氣象報告做的不錯了，請你弄清楚，預報的本質是什麼？就是做了預報讓你有足夠時間做好準備，而不是保證災難不發生。聖嬰、南方震盪、全球暖化現在全部相當激烈，災難約每2到8年發生一次。</p>\n<p><strong>山不需要治、水不需要理</strong><span><br>\n<p>過去所謂水土保持、治山防洪工程都會全面失效，山不需要治，水不需要理，經營管理山林真正的意義，是管理人在山林的行為，是要強調我們什麼可以做，什麼不能做，而不是一味誇張我要做什麼、我能做什麼。是土地倫理的展現。</span></p></p>\n<p>21到23世紀我們的主流都是土石橫流，不只台灣，世界皆然。土石橫流最根本的原理，台灣天然防護罩，也就是演化250萬年的造山運動。台灣如果沒有植物，斷層逆衝崩塌下來，會形成大大小小的金字塔，所謂的「無機安息角」，這個角度大約在20到40度之間，這種物理安息角，是看顆粒大小，含有的水分等。</p>\n<p>台灣有四次冰河時期，生命與之交融，產生由植物固定水土保持。台灣的山因為這些森林愈來愈穩定，坡度愈來愈陡，穩定了卻隱藏更大的不安定。我們把森林幹掉了，從有機安息角回到無機安息角，所以這樣子的崩塌，有機會復原的話也是300年。</p>\n<p><strong>堅決反對越域引水</strong><br>\n<p>小林滅村與曾文越域引水的羅生門無關係？我的答案是，「非有關、非無關」，因為科學完全無能證明它有關，也無能證明它無關。一如地震無法預測，你無法證明這10公里外的炸山，是不是引起這次山崩的原因。</p></p>\n<p>但我堅決反對越域引水。為什麼？這跟小林村這個案例無關。越域引水根本的問題是，台灣降雨線往北遷移，換句話說，高屏愈來愈沒水，你又把高屏溪上游的水攔給曾文水庫，高屏中下流的生態全面崩盤，導致高屏平原整個經濟崩盤。</p>\n<p>我反對越域引水另外一項重要理由是「世代不公不義」，那些水源並不是按照自然，也不是依農林系統，而是工業發展造成更大的汙染。無論如何越域引水不一定要坳成跟什麼有關係，但我認為更重大、我們該管的是生態體系全面潰絕的內涵，這才是真正的原因。否則大家說炸山跟小林滅村沒有相關，所以我可以去搞越域引水，「那完蛋了，重點都沒有抓到。」</p>\n<p>台灣人的邪惡佔盡了善良人的便宜，因為科學上無法證明它，就像我們在搶救森林也是這樣，你無法證明開挖對山林有影響。「可是，我要怎麼去證明？」一個開發者不負責證明，卻要環境保護者去證明？</p>\n<p><strong>七種方法預警災難</strong><br>\n<p>一、由地面森林的結構，解讀特定地區的大變周期。例如我調查中橫後，斷定中橫每50年會有一次重大地變，因為那裏的原始森林沒有超過50年的。</p></p>\n<p>神木村有一棵樟樹神木，過去說1500年，現在說800年，那棵樹存在那裏的意義是什麼？至少800年來在那個地方以及周圍環境都安然無恙。阿里山神木號稱3000年，他存在的意義是代表從小苗開始，3000年長到這麼大，3000年來至少發生了50次九二一規模的地震，以及3000到1萬多個大小颱風衝擊。原始森林真的是我們的土地公、我們的守護神。</p>\n<p>二、從歷史災難來看。二萬坪平均一年崩33公分，這樣算下來，我預估70年內二萬坪會消失。</p>\n<p>三、由現地證據來看。例如中寮大地震掉下來一顆巨石，921時掉下來另一顆幾乎一模一樣的，恰好兩顆並排。那個地方就不能住人，因為它經常都在掉。</p>\n<p>四、礦石長期調查比對。我預測阿里山神木會倒，林務局派人跟我辯論，還好沒有幾年就倒了。南橫，1988年調查，2005再調查一次，相隔18年，已察覺到南部生態系統產生大退化。</p>\n<p>五、由學理推算跟推論。低海拔10年不去管它即恢復成森林，1991到1993年我推估阿里山茶農每賺一元，社會要付出7到44元成本。</p>\n<p>六、口述歷史。訪問耆老在地經驗。九二一地震後，阿里山林業鐵路垮了，花了1億2千萬，從阿里山舊火車站蓋一條路，10年完全沒用過，這次又垮了。蓋蚊子館至少還有蚊子館可以罵，現在連蚊子館都不見了，你要罵什麼？</p>\n<p>七、直覺跟全面邏輯思考。</p>\n<p><strong>政策殺神，工程殺人</strong><br>\n<p>台灣的造災歷史跟森林保育運動，這是政策殺神，工程殺人，台灣人自掘墳墓。我親眼目睹30年變遷，1980年代農業上山，觀光遊憩，土石橫流，現在進入最後一個階段，日本時代是農業台灣，工業日本，以台灣為前進基地。</p></p>\n<p>後面五、六十年，以農民培養工商，把台灣當反攻復國的平台。這代表的意義就是犧牲這裡所有的資源。除了伐木、採礦，過去主要是上山下海、河川截彎取直。上山就是開發山坡地，下海就是海埔新生地，原來河流寬度200公尺，又截流100公尺做河川新生地。</p>\n<p>你現在看什麼溫泉、房子倒下來，那個本來就會倒下來。台灣人向這塊土地超級高利貸，天公伯跟土地公請暴力討債集團來討債。農業上山已宣布無可藥救，只要有路到達的地方，台灣人拼經濟的精神，會拼死台灣。</p>\n<p>我好恨沒早生20年，如果台灣山林運動早20年，可能還有救，每一個都是血淚史。台灣如果沒有統獨之爭，不出二三十年絕對有實力走向世界先端，但我們政治再這樣搞下去，永遠沒有希望。</p>\n<p><strong>台灣的未來，美好文化的救贖與開創</strong><br>\n<p>大家來促成，做一套「國土永世計畫」。我們應該創造一套不管那個黨派當總統，都共同奉行的政策，全民的最大公約數。至少要做百年台灣才會有改變，你們現在聽到的花多少億做什麼的，很可能創造更大的災難。</p></p>\n<p>包括台灣土地第三次全面大改革，要擬定21世紀前瞻性的各種產業的應變計畫。山地土地全面回收改革。</p>\n<p>台灣本來就是災難專家，台灣要恢復清朝時期的在地鄉團，國家秘密研發的東西要漸漸轉移到民間，我們希望成立在地民團。</p>\n<p><strong>發起「地球自然公民黨」</strong><br>\n<p>這會是一個全球最軟性政黨，需要自然新宗教，所有宗教大融合，創設自然宗教大學。我只是不甘心，為什麼10個好的台灣人加起來會變成20件壞事，不能理解為什麼善良的民眾，為一些人世間的偏執所困擾。</p></p>\n<p>台灣至少有三到四成對政治無力感的人，他們不投票，可是他們對生活最講究，他們最在乎任何人對歷史的責任。</p>\n<p>我們比神還幸福，因為我們終將必死，因此我們的生命才有意義，也會讓我們活著的每一分每一秒，充滿爆炸式的生機，跟燃燒的快感。你們去拜祖宗為什麼要獻花，他的意義本質是什麼，代表一種凡來自土地，該虔誠地回報土地。</p>\n<p>大家千萬不要再捐錢了，九二一大地震還剩下45億，經過電視包裝後的捐錢好恐佈喔。我不是說你沒有慈善心，恰好相反，看到真正該捐的當然捐，可是千萬不要讓那些奴役善良的邪惡繼續得懲，該誰捐？大企業去捐。如果各位要捐錢，要捐給地球公民協會，要捐給自己，捐給知識、智慧、慈悲。</p>\n<p>&nbsp;</p>\n<p><span><strong>霸權、共業與災難</strong>（陳月霞）</span></p>\n<p>聽了陳玉峰老師的話，我想大家都已經血脈噴張，但我要說，路還很長，很多事等著我們去做，我要行雲流水地來跟大家分享。</p>\n<p>我念書時跟姐姐的孩子在阿里山走路，她才五歲，走到一半她跟我說，「阿姨，我腳好酸。」如果你聽到這種話，你會做什麼？</p>\n<p><strong>看不見的霸權</strong><br>\n<p>我看了她一眼，繼續走，說，「喔腳很酸是什麼形狀？」她一直想，三角形？四方形？她想半天不知道是什麼形狀。我又問，「那是什麼顏色？」正當他在想腳很酸是什麼形狀、顏色時，我們已走到上頭。</p></p>\n<p>當我們看見顏色、形狀，我們看到存在。但腳很酸沒有顏色、形狀，這就是我要談的共業與災難。只有災難有顏色有形狀，因為我們看到那個慘狀。如果水災是台灣共業，但我們看不到霸權。</p>\n<p>我女兒兩三歲時我跟她玩時，她說，「好渴喔」，我說，「喔真的喔，這杯白開水你拿去喝」，她喝了就去睡。光是想像就可以治癒很多事情。</p>\n<p>1987年我們住在水里，在濁水溪旁邊，上面有一個大觀發電廠，有陰陽河。我這一生最幸福的是，成年後還可以跟小孩繼續學習自然。下雨了，我們開始對話，雨把河流淋濕了，為什麼下雨呢？太陽奶奶在尿尿…。</p>\n<p>「媽媽那水為什麼白白的，我說，因為水在打架，水在跑時前面有一顆石頭，水給石頭擋住才打起來，白白水花就出來了，這是水的力量。我說，「你也是力量，你的力量讓我變得很勇敢」。她說，「你的力量讓我覺得很安全」。</p>\n<p><strong>與濁水溪的生死交關</strong><br>\n<p>高中時，我帶著妹妹、一個同學下到河中，第一腳踩下去，她說，「沒關係，水頂多到你膝蓋。」但往前走就愈來愈深，大晴天，水看起來沒在動，因為那是濁水，很多泥沙，好像很多針在刺你的腳，像螞蟻在咬。</p></p>\n<p>腳踩下去那水順便把你腳下的泥沙掏空，一直陷下去，已經到了腰部，進退不得。三個人緊緊相握不敢動，但不動還是繼續一直下去，你要喊救命已經沒有用，因為你只聽到溪谷的聲音，「你知道那多可怕嗎？」</p>\n<p>或許命不該絕，岸上有男生在烤肉，突然有一個人看到三個女生的頭，展開英雄救美。我們看到平靜的水是很可怕的，土石流是很可怕的。</p>\n<p><strong>霸權與共業</strong><br>\n<p>霸權是最無法感受到的，只有當你遭受到霸權的欺凌時你才會感受到霸權的存在。可是當你個人在行始霸權就不知道他存在，因為沒有形狀、顏色。性別、權貴、官僚的霸權。我要強調性別的霸權。</p></p>\n<p>今年1月29日我們去印尼遇到一位師父，他19歲出家，26歲建一個學校，因為他在路上看到一些女生沒上學，女孩說，因為家裡很窮，只有男生可以念書。他覺得這樣不對，於是他募款建學校，讓女生可以念書。</p>\n<p>有一次我跟他說，宗教都歧視女性。他看看我，「我們很尊敬女性啊。」我說，因為你是既得利益者，你當然會這樣說。如果你念過女人史，就知道古代女生如果很聰明，就說你是巫婆把你殺掉。你要活下去就要假裝自己很笨。</p>\n<p><strong>性別霸權</strong><br>\n<p>後來跟師父去看「公主與狗」，他解說給我聽，那裏有一個懸崖，公主本來已有心儀的愛人，但國王要把她嫁給別國的王子，公主牽著狗去跳海殉情，跳到半空中浮在那裏變成「公主與狗」。我問：「那她愛人死了嗎？」師父說，「沒有」。我說，「男人不如一條狗。」師父摸摸頭，不知道為什麼會變這樣。</p></p>\n<p>在那船上他頭撞到屋頂，我笑他，長這麼高做什麼，你看我這麼矮都不怕撞到。他想這女生為何一直在笑我。後來到一個村莊，他又撞到一個房子的屋頂，我說，因為你不夠謙虛，你到人家這，還把頭抬這麼高。很多佈道的人都高高在上，說給別人做，立了法官員都不必行使，只有百姓要行使。</p>\n<p>我去台大演講，他們說，「我們今天請到陳玉峰的太太來演講。」第二次去台南文化中心，主持人也叫我陳太太，我說我不是，因為是我要演講，你應該介紹，現在要演講的是陳月霞老師，剛剛演講的陳玉峰老師是他的先生。</p>\n<p><strong>你在行使霸權時有反省嗎？</strong><br>\n<p>霸權、災難、共業，通通都是我們造成的。在水里時一個朋友幫我出了一本書。是個好人，但桃芝颱風時，只有他沒跑，他說，我住在這裏20年了，不會有事的。因為這個男人的霸權，結果害了七口人全都死光了。</p></p>\n<p>有了台灣九一九活動？這樣台灣就沒事了嗎？如果可怕的霸權繼續存在，我們就會有災難。那是看不見的、沒顏色、沒形狀。今天全台灣人都在祈福，過了今天，是否我們繼續在蹂躝土地？我們要反省自己是否有什麼沒做到的。</p>\n<p><strong>人與土地的自然情操 </strong><br>\n<p>要有自然情操。自然與環保不一樣，自然是心靈的、對自然的體驗，發覺自然的奧妙之處。我們要謙虛、但不要謙卑，因為給父性霸權欺負很久了。我們在演講前去看了烏山頭水庫，看了八田與一的故事，最感動的是人與土地的情操。</p></p>\n<p>&nbsp;</p>\n<p><img alt height=\"206\" src=\"/sites/cet-taiwan.org/files/980919%20275.jpg\" width=\"310\" loading=\"lazy\"></p>\n<p><span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span><span>演講會後簽名活動</span></span></span><span><span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; (何俊彥攝)</span></span></p>"}, {"nid": 678, "title": "在德國，人們對燃煤電廠說不!", "original_topic": "空氣污染;抗暖減碳;節約能源", "adopted_cats": ["氣候變遷與調適", "反對大林電廠"], "content": "<p>文⊙吳志敏（地球公民協會會員）</p>\n<p>自從電力被廣泛地應用現代社會的每個生產和消費領域，電力的需求不斷推向新高。然而電力生產對環境和氣候帶來的負面影響，已經讓人們意識到過度生產和使用電力令我們生存的環境日趨惡化，電力生產所付出的代價必須審慎評估。</p>\n<p>在所有電力生產方式中，利用燃燒煤碳的方式發電對環境和氣候影響最大。近年來，反對燃煤電廠的興建逐漸成為保護環境與氣候的重要議題，各國的環保團體發起的相關活動方興未艾，尤其是在德國，「對燃煤電廠說不」已成為社會大眾的共識，為此而與政府、大型財團奮戰的環境聯盟獲得了廣泛的支持並取得了一些階段性的勝利。</p>\n<p>燃煤電廠被德國環保團體視為「氣候殺手」，是「以過去的方法供應未來的需求」。整理德國各大環保團體關於這一議題的資料，歸納燃煤電廠遭到大眾撻伐的主要原因如下：</p>\n<p>一．開採不可再生的煤礦對生態造成難以修復的傷害。</p>\n<p>二．在生產過程中，褐煤和石煤發電廠排放的CO2是供電能力相同的現代天然氣發電廠的兩倍。</p>\n<p>三．籠罩在燃煤電廠大型冷卻塔上空的蒸汽雲，也凸顯了燃煤電廠的另一個問題：生產過程中有一半以上的能源轉化成為毫無用處的熱能被釋放到大氣中，對週遭環境造成很大的負擔。</p>\n<p>四．興建燃煤電廠所需的巨額投資，要求每一個燃煤電廠都必須維持四十年以上的使用，也等於將為當地的環境和氣候帶來四十年以上的傷害。</p>\n<p>五．燃煤電廠一旦啟用，將會阻礙甚至中斷企業利用可再生的能源發電的研究和嘗試，要推廣清潔、友善的電力變得更加困難。</p>\n<p>六．目前政府及能源集團鼓吹的CCS(碳捕捉和封存)，在未來是否能達到預期的功效，無法得到有力的證實，萬一失敗卻將帶來嚴重的後果。</p>\n<p>德國現有的250座大型發電廠中，大部分都是燃煤電廠，2007年到2015 年計畫興建的燃煤電廠，竟高達 30 座，其中 10 座已在建造中，6座已取得興建許可。如果這些燃煤電廠全部運行，預估將增加 30GW 的裝置容量，每年多排放 179.4 百萬公噸二氧化碳，所增加的碳排放需求將達歐盟 2013 年總量的8%。2007年6月的8國高峰會(G8)中，與會的德國慨然承諾到2050年CO2的排放量將與1990年相比降低80%。政府立意雖高，卻難以抵擋大型財團和政治利益團體的威逼利誘。下圖遍布德國各地的30座燃煤電廠，猶如加在這個工業巨人身上的重重鎖鏈，讓它在實現這個目標的道路上舉步維艱!</p>\n<p>&nbsp;</p>\n<p><img alt height=\"465\" src=\"/sites/cet-taiwan.org/files/met40.jpg\" width=\"386\" loading=\"lazy\"></p>\n<p><span>此圖經德國環境與自然保護聯盟(Der Bund für Umwelt und Naturschutz) 授權使用 <a href=\"http://www.bund.net\">http://www.bund.net</a></span></p>\n<p><span></span></p>\n<p>值得欣慰的是，在眾多環保團體和當地居民的努力下，迄今已經有７座燃煤電廠停止了興建。(上圖中所標示紅色打叉的地方)。 德國民眾的環保意識ㄧ直走在世界的前列，各類社會團體都不約而同地對環境和氣候投入了很多的關注，德國氣候聯盟(Die Klima-Allianz)結合了90多個社團，共同推動保護氣候的運動。環境與自然保護聯盟(Der Bund für Umwelt und Naturschutz)是這個聯盟的核心成員。Bund成立於1975年7月，現在已發展為德國最大的環保團體之一，擁有48萬名會員。環境與氣候的保護，一直是這個聯盟關注的主軸;強大的影響力和卓有成效的行動力，也使他們成為德國眾多反對燃煤電廠的環保團體的主要力量。</p>\n<p>&nbsp;</p>\n<p><strong>燃煤停建燃煤電廠的基本資料:</strong></p>\n<p><table></p>\n<p><tbody></p>\n<p><tr></p>\n<p><td colspan=\"7\"></p>\n<p><strong>德國停建燃煤電廠一覽表(截止2009年8月)</strong></p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>投資企業</p>\n<p></td></p>\n<p><td></p>\n<p>預定興建地</p>\n<p></td></p>\n<p><td></p>\n<p>燃煤種類</p>\n<p></td></p>\n<p><td></p>\n<p>預估金額(億歐元)</p>\n<p></td></p>\n<p><td></p>\n<p>&nbsp;發電量&nbsp;&nbsp; (千瓦)</p>\n<p></td></p>\n<p><td></p>\n<p>&nbsp; 預估每年CO2排放量(百萬噸)</p>\n<p></td></p>\n<p><td></p>\n<p>停建原因</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>Vattenfall</p>\n<p></td></p>\n<p><td></p>\n<p>柏林(Berlin)</p>\n<p></td></p>\n<p><td></p>\n<p>石煤</p>\n<p></td></p>\n<p><td></p>\n<p>10</p>\n<p></td></p>\n<p><td></p>\n<p>80萬</p>\n<p></td></p>\n<p><td></p>\n<p>4.5</p>\n<p></td></p>\n<p><td></p>\n<p>2009年3月,投資人迫於公眾的壓力改變計畫,轉向天然氣和生質油發電廠</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>swb</p>\n<p></td></p>\n<p><td></p>\n<p>布來梅(Bremen)</p>\n<p></td></p>\n<p><td></p>\n<p>石煤</p>\n<p></td></p>\n<p><td></p>\n<p>12</p>\n<p></td></p>\n<p><td></p>\n<p>91萬</p>\n<p></td></p>\n<p><td></p>\n<p>5.1</p>\n<p></td></p>\n<p><td></p>\n<p>&nbsp;</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>RWE</p>\n<p></td></p>\n<p><td></p>\n<p>恩斯道夫 (Ensdorf)</p>\n<p></td></p>\n<p><td></p>\n<p>石煤</p>\n<p></td></p>\n<p><td></p>\n<p>21</p>\n<p></td></p>\n<p><td></p>\n<p>160萬</p>\n<p></td></p>\n<p><td></p>\n<p>9</p>\n<p></td></p>\n<p><td></p>\n<p>&nbsp;</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>EnBW</p>\n<p></td></p>\n<p><td></p>\n<p>蓋默思海姆(Germersheim)</p>\n<p></td></p>\n<p><td></p>\n<p>石煤</p>\n<p></td></p>\n<p><td></p>\n<p>12</p>\n<p></td></p>\n<p><td></p>\n<p>90萬</p>\n<p></td></p>\n<p><td></p>\n<p>5.1</p>\n<p></td></p>\n<p><td></p>\n<p>2008年9月宣布因當地居民的壓力放棄</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>E.on/Stadtwerke Kiehl(各50%)</p>\n<p></td></p>\n<p><td></p>\n<p>基爾(Kiel)</p>\n<p></td></p>\n<p><td></p>\n<p>石煤</p>\n<p></td></p>\n<p><td></p>\n<p>12</p>\n<p></td></p>\n<p><td></p>\n<p>80萬</p>\n<p></td></p>\n<p><td></p>\n<p>4.5</p>\n<p></td></p>\n<p><td></p>\n<p>2009年7月, Stadtwerke Kiehl因轉向一個較小的天然氣發電廠而撤資</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>RheinEnegie</p>\n<p></td></p>\n<p><td></p>\n<p>科隆(Koln)</p>\n<p></td></p>\n<p><td></p>\n<p>石煤</p>\n<p></td></p>\n<p><td></p>\n<p>11</p>\n<p></td></p>\n<p><td></p>\n<p>80萬</p>\n<p></td></p>\n<p><td></p>\n<p>4.5</p>\n<p></td></p>\n<p><td></p>\n<p>2009/06, 因投資天然氣發電廠而放棄原計畫</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p>Evonik Steag</p>\n<p></td></p>\n<p><td></p>\n<p>奎爾希(Quierschie)</p>\n<p></td></p>\n<p><td></p>\n<p>石煤</p>\n<p></td></p>\n<p><td></p>\n<p>10</p>\n<p></td></p>\n<p><td></p>\n<p>79萬</p>\n<p></td></p>\n<p><td></p>\n<p>4.4</p>\n<p></td></p>\n<p><td></p>\n<p>&nbsp;</p>\n<p></td></p>\n<p></tr></p>\n<p><tr></p>\n<p><td></p>\n<p><span><strong>停建燃煤電</strong></span></p>\n<p></td></p>\n<p><td></p>\n<p><span><strong>7</strong><strong>座</strong></span></p>\n<p></td></p>\n<p><td></p>\n<p><span><strong> </strong></span></p>\n<p></td></p>\n<p><td></p>\n<p><span><strong>88</strong></span></p>\n<p></td></p>\n<p><td></p>\n<p><span><strong>660</strong>萬<strong>&nbsp;</strong></span></p>\n<p></td></p>\n<p><td></p>\n<p><span><strong>37.1</strong></span></p>\n<p></td></p>\n<p><td></p>\n<p>&nbsp;</p>\n<p></td></p>\n<p></tr></p>\n<p></tbody></p>\n<p></table></p>\n<p>（資料來源：Bund電子報）　　　　　　　　　　　　　　　　　　整理：吳志敏2009年8月</p>\n<p>&nbsp;</p>\n<p>在燃煤電廠對氣候和環境的負面效果已廣為人知的德國，大型燃煤電廠的興建計畫得到政府許可，通常被看作特定財團與少數政治團體在經濟及政治利益上的勾結。上述7座燃煤電廠停建，部分原因當然是這兩大利益集團相互角力和權衡的結果。然而公眾的壓力、環保團體的努力，卻是令大財團最終放棄搖錢樹的關鍵。大型的聯盟如Ｂund， Die Klima-Allianz在德國聯邦州、行政縣市等各個層級，都有組織完整的分支團體，他們有效地整合了在地民眾的力量，與大型的電力公司、政府行政機關及立法單位長期抗衡，打了七場漂亮的勝戰。他們獲得勝利的原因，可以從三個角度來解讀:</p>\n<p>&nbsp;</p>\n<p>一.投資的財團面臨巨大的經濟壓力</p>\n<p>由於歐盟國家從2005年開始執行京都協定書，碳交易成本不斷上漲，這導致燃煤電廠的投資風險大幅提升，迫使投資方轉向其他的項目。如在科隆、柏林，電力公司將原燃煤電廠計畫取消，改為較小型的天然氣發電廠。在布來梅，第一個宣佈取消燃煤電廠計劃的swb公司，面臨了布來梅數千位居民為了反對此計畫拒絕成為swb用戶的抗爭，給swb造成了極大的不安，也動搖了決策高層對未來燃煤電廠獲利能力的信心，這最終導致了swb的投資計畫胎死腹中。</p>\n<p>二.在地居民對興建燃煤電廠的普遍共識和高度關注。</p>\n<p>由於環保團體的廣泛宣導，當地居民對興建燃煤電廠的負面效應都有相當的認識和重視，因此環保團體倡議的各種抗爭活動都能得到民眾熱烈的響應，讓支持興建燃煤電廠的政黨及政治團體備受威脅。在恩斯道夫Ensdorf，包括Bund在內的眾多環保團體發起了當地居民的連署，迫使地方政府舉行了是否允許興建燃煤電廠的公投，結果反對票以壓倒性的多數通過取消電廠的興建計畫。高達70%的居民表達了反對意見，因此投資方RWE公司不得不放棄原來的興建計畫。</p>\n<p>革命尚未成功的漢堡市，環保團體在這裡運用了政治策略，在市級的選舉中，使各政黨對燃煤電廠的表態成為影響選票及建立政黨間策略聯盟的關鍵，最後促成了深綠聯盟（德國基督教民主聯盟與聯盟90/綠黨）的選舉勝利，為後續的抗爭行動找到了政治力量的支持。</p>\n<p>三.環保團體發揮了巨大的影響力。</p>\n<p>每一次小小的勝利，都包含了無數次的示威遊行，多角度的抗爭活動，環保團體在中間扮演了非常重要的角色，他們透過網站、發行刊物、宣傳活動向民眾宣導反對燃煤電廠的必要性和緊迫性，獲得了廣泛的認同和支持。他們在各地大規模示威遊行，讓決策者看到公眾的壓力，並向各政黨公開投書，呼籲支持長遠環保大計，不要受限於短期的政治考量。剛剛結束的2009年德國大選，甚至被環保團體稱為「氣候大選」。候選人在能源政策上的表態，不僅被看成德國能源問題，而且被視作ㄧ個攸關德國未來經濟發展、競爭能力的方向性的抉擇。</p>\n<p>在德國，向燃煤電廠說不，已經是深入民心的行動口號。在環保團體和社會大眾眼裡，燃煤電廠是一個氣候殺手，需要及時地阻止它破壞人類賴以生存的環境。</p>\n<p>資料來源:</p>\n<p><a href=\"http://www.die-klima-allianz.de\">http://www.die-klima-allianz.de</a></p>\n<p><a href=\"http://www.klimawahl2009.de\">http://www.klimawahl2009.de</a></p>\n<p><a href=\"http://www.bund.net/\">http://www.bund.net/</a></p>\n<p><a href=\"http://www.wir-klimaretter.de\">http://www.wir-klimaretter.de</a></p>\n<p>◆此文章刊登於地球公民協會通訊第7期</p>\n<p>&nbsp;</p>"}, {"nid": 683, "title": "溫升２℃之後--模擬實境街頭行動【新聞報導】", "original_topic": "新聞報導", "adopted_cats": ["氣候變遷與調適"], "content": "<p>&nbsp;</p>\n<p><span><strong>救地球 環團聲聲「碳」</strong></span></p>\n<p><span><strong><img src=\"/sites/cet-taiwan.org/files/met41.jpg\" alt width=\"250\" height=\"188\" loading=\"lazy\"></strong></span></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><span><span><span>志工用紙箱做成高雄市最高樓85大樓，放在海面象徵樓沉大海，呼籲全民支持減碳，降低地球均溫。（記者黃旭磊攝）</span></span></span></p>\n<p><span><span><br></span></span></p>\n<p><span>&nbsp;</span>【<span>自由時報/2009.12.13</span>】</p>\n<p>〔記者黃旭磊／高雄報導〕「地球升2度，港都變水都！」地球公民協會10餘名志工昨天在高雄市哈瑪星地區，向往來渡輪遊客舉標語，呼籲減碳救地球。</p>\n<p>&nbsp;</p>\n<p>抗議人士昨天下午於哈瑪星遊艇碼頭，舉標語並將「85大樓（高雄市最高樓）沉水底」紙箱放於水面，象徵建築物沉沒，上百名遊客好奇觀看。</p>\n<p>&nbsp;</p>\n<p>地球公民協會執行長李根政表示，哈瑪星地勢全市最低窪，再增加攝氏0.7度均溫，港都會成水鄉澤國。他說，丹麥哥本哈根會議將攝氏2度訂為底限，台灣攝氏 均溫已增加1.3度，若達到2度，海平面將升高50公分，市區哈瑪星、凹仔底、灣仔內、內惟埤等低窪區都將淹水，若升高6度，市區會成史前潟湖。</p>\n<p>&nbsp;</p>\n<p>李根政說，根據IPCC（政府間氣候變化專門委員會）及中研院研究員劉紹臣資料，台灣1990年起17年間，二氧化碳排放量從1.3億噸增至2.85億 噸，增加110%，成長率世界第一。台灣人均排放量約12噸，是全球均量3倍，亞洲排第一，全球排名第18。其中，高雄市排放量佔全國20%，中鋼、台電 大林廠、中油高雄廠、南部火力發電廠、中油大林廠排名前5排碳大戶。</p>\n<p>&nbsp;</p>\n<p>李根政強調， 每個人都應努力減碳，政府應停止擴張台電大林燃煤電廠、國光石化、台塑大煉鋼廠及中科二林基地等高耗能產業。</p>\n<p><a href=\"http://www.libertytimes.com.tw/2009/new/dec/13/today-south9.htm\">http://www.libertytimes.com.tw/2009/new/dec/13/today-south9.htm</a></p>\n<p>&nbsp;</p>\n<p>--------------------------------------------------------------------------------------------------------</p>\n<p><span><strong><span>防港都變水都 地球公民協會支持徵碳稅</span></strong></span></p>\n<p><span><strong><span><img src=\"/sites/cet-taiwan.org/files/met41-1.jpg\" alt width=\"328\" height=\"219\" loading=\"lazy\"></span></strong></span></p>\n<p><span>地球公民協會昨天號召義工，穿著用報紙作的游泳圈、紙箱製作的85大樓，一路敲鑼、舉標語演行動劇，呼籲民眾從自身做起，開始過低碳生活。(圖／地球公民協會提供)</span></p>\n<p>&nbsp;</p>\n<p>【聯合報╱記者鄭國樑／高雄報導】</p>\n<p>「地 球升2度，港都變水都！」高雄市地球公民協會昨天在西子灣上演行動劇，強調台灣過去十多年，二氧化碳排放量增加110％，成長率世界第一，未來如果全球溫 度升高2度，高雄85大樓和凹子底等繁華區的地下室和一樓，恐怕要淹水。協會支持政府課徵碳稅或能源稅，並呼籲停止擴張石化、大煉鋼廠高耗能產業。</p>\n<p>&nbsp;</p>\n<p>地球公民協會執行長李根政表示，聯合國氣候變化綱要公約締約國第15次會議正在哥本哈根舉行，這項會議去年在波蘭召開，他曾代表高雄市出席，深切體會減碳刻不容緩。</p>\n<p>&nbsp;</p>\n<p>協會昨天下午在西子灣哈瑪星遊艇碼頭演出行動劇，成員自己製作「拒當氣候難民」等標語、85大樓模型，向來往的遊客與旗津渡輪乘客「喊話」，並把85大樓模型放在水中，象徵地球溫度一旦上升2度，85大樓很可能會淹水，藉此呼籲大家減碳，不少民眾向他們揮手表示支持。</p>\n<p>&nbsp;</p>\n<p>李根政指出，科學家與聯合國普遍的共識，即全球升溫的極限是2度，如果超過極限，地球會陷入無可挽回的大災難。</p>\n<p>&nbsp;</p>\n<p>李根政表示，科學家保守估計，一旦上升2度，海平面將升高50公分，屆時高雄市低漥地區包括哈瑪星、凹仔底、灣仔內、內惟埤、本館埤等區域，會面臨淹大水災情，甚至長期成為水鄉澤國，如果上升至6度，高雄市勢必回到「潟湖」時期。</p>\n<p>&nbsp;</p>\n<p>李根政引用中研院、政府氣候組織的調查數據，顯示台灣在2007年的二氧化碳排放量，從1990年的1.3億噸增至2.85噸，增加110％，成長率世界第一。</p>\n<p>&nbsp;</p>\n<p>他表示協會支持開碳稅、能源稅，發展綠色產業，但也要停止擴張燃煤電廠、石化、大煉鋼廠與中科二林基地等高耗能產業。</p>\n<p><a href=\"http://www.udn.com/2009/12/13/NEWS/DOMESTIC/DOM6/5304997.shtml\">http://www.udn.com/2009/12/13/NEWS/DOMESTIC/DOM6/5304997.shtml</a></p>\n<p>--------------------------------------------------------------------------------------------------------</p>\n<p><strong>\"</strong><strong>支持碳稅\" 我們不要水世界!</strong></p>\n<p><strong><img src=\"/sites/cet-taiwan.org/files/met41-2.jpg\" alt width=\"255\" height=\"191\" loading=\"lazy\"></strong></p>\n<p><span>地球公民協會以標語、逗趣的肢體動作呼籲大家，支持碳稅拒當氣候難民。(康犁攝影)</span></p>\n<p><strong><br></strong></p>\n<p>〔鳳凰網記者康犁高雄特稿〕站在哨船頭公園，可以遙望高雄的地標八五大樓，暖陽、海景還有微風，像是一幅渾然天成的畫作。</p>\n<p>&nbsp;</p>\n<p>今天下午4點，這裡卻出現一群人，穿著報紙做的游泳圈，沿途敲鑼、喊口號、舉著救救85大樓的紙箱模型，讓人感覺眼前的海面正在緩緩上升。</p>\n<p> 這不是幻覺，地球公民協會用行動劇的方式帶來全球暖化的警訊。「地球升2度，港都變水都」，根據研究，如果溫度上升2度，海平面將升高50公分，屆時全高 雄市的低窪地區，如哈瑪星、凹仔底、灣仔內、內惟埤和本館埤區域，將常陷淹水之苦，而若氣溫升高6度，高雄可能回復成以前的「潟湖」狀態。</p>\n<p> 地球公民協會執行長李根政表示，人類歷史上規模最大的氣候會議在哥本哈根如火如荼展開，日前開幕式播放的一段影片，小女孩做著地球毀滅的噩夢與迫切的呼籲，深深震撼全球人心，台灣/高雄為高碳排放的國家/城市，不應置外於這場國際氣候談判。<br> 他也表示，除了人民致力於低碳的生活方式，最重要的是，我們必須要求政府停止擴張高耗能的產業，如台電大林燃煤電廠、國光石化、台塑大煉鋼廠、中科二林基地等。而且也應該支持政府課徵碳稅或能源稅，讓台灣藉此發展綠色產業，轉向低碳的國家。</p>\n<p><img src=\"/sites/cet-taiwan.org/files/met41-3.jpg\" alt width=\"274\" height=\"205\" loading=\"lazy\"><span>地球公民協會呼籲政府應停止擴張高耗能產業。(康犁攝影)</span></p>\n<p><span><br></span></p>\n<p>台灣是造成氣候暖化的元兇之一，從1990至2007年，二氧化碳增加超過110%，成長率世界第一。而台灣人均排放量約12噸，是全球的3倍，更是亞洲之冠。</p>\n<p> 地球公民協會訴求我們只有一個地球，為了維護後代子孫的家園，台灣/高雄的人民，別再沉默了，「支持碳稅，拒當氣候難民」。</p>\n<p> 哥本哈根氣候大會於12月7日召開，在減排目標等問題上，發達國家借環境保護之名提議徵收碳關稅保護本國貿易，碳關稅成為此次大會爭議焦點。</p>\n<p> 一般認為，美國提出碳關稅，在國內反擊傳統產業勢力，為新能源與傳統產業的綠色改造保駕護航；在國際上為氣候談判增加籌碼，迫使中國、印度、巴西等發展中大國讓步。</p>\n<p>&nbsp;</p>\n<p><a href=\"http://phoenet.tw/Newsletter/Comment.aspx?Iinfo=5&amp;iNumber=453\">http://phoenet.tw/Newsletter/Comment.aspx?Iinfo=5&amp;iNumber=453</a></p>\n<p><strong><br></strong></p>"}, {"nid": 728, "title": "An Open Letter from Taiwan Civil Society to the Formosa Plastics Group", "original_topic": "環境正義", "adopted_cats": ["反對石化業擴張", "氣候變遷與調適", "監督高雄重大污染"], "content": "<p><strong><br></strong></p>\n<p>On 19 May 2010 as civic groups in Taiwan present the ethecon 2009 Black Planet Award to the Formosa Plastics Group we collectively appeal to that enterprise to use its money in a manner that promotes dignity and a sense of responsibility.</p>\n<p>&nbsp;</p>\n<p>We deliver this award to the Formosa Plastics Group for the reasons set out in this open letter in order that your true nature can be seen by all sectors of society.</p>\n<p>&nbsp;</p>\n<p><strong>1. Profits Before Human Rights; Profits Before Democracy</strong></p>\n<p>In <a href=\"http://zh-yue.wikipedia.org/wiki/1989%E5%B9%B4\">1989 the People’s Liberation Army bloodily suppressed a student movement in Tian An Men Square in what has come to be known as the Tian An Men</a> Massacre. While the world gasped at the atrocities committed by the Chinese government and all foreign commerce and investment came to a halt, your enterprise, the Formosa Plastics Group became the first major company to invest in China without any thought or concern for the severe human rights abuses of your host. You displayed absolute disregard for democratic principles and indeed you profit from the butcher’s of Beijing.</p>\n<p>&nbsp;</p>\n<p><strong>2. “Formosa Plastics: We Make the Earth Miserable”</strong></p>\n<p>As the worlds largest producer of PVC you have spread your products around the world by giving producers of plastic piping, flooring, medial products, toys, shoes, stationary products and all other manner of goods, the means to befoul the health of present and future generations. The dangers of PVC throughout its life cycle are well established, including the fact that the production and disposal sites all contain high concentrations of dioxin and are sources for endocrine disruptors and environmental hormones causing sex changes in men and increases in the incidence of breast cancer in women. Yet despite the international consensus, Formosa Plastics, your attention has only one target and one goal – make as much money as possible with as little attention and expenditure on the social and natural environments.</p>\n<p>&nbsp;</p>\n<p><strong>3. You Have Wrung Taiwan’s Largest River Dry</strong></p>\n<p>Even with your vast wealth and power you have forced the government to build the Jiji Wier and a special pipeline so that you can extract 345,000 tonnes of water a day; your pipes that run through farmers’ fields and take their water leave them with no choice but to pump from the aquifers resulting in our country’s worst land subsidence and condemning the area to becoming a barren desert of dust storms.</p>\n<p>&nbsp;</p>\n<p><strong>4. You Blacken the Skies and the People’s Lungs</strong></p>\n<p>In June 2009 Public Health Professor Chan Chang-chuan of National Taiwan University reported a “significant correlation” between your Sixth Naphtha Cracker Plant in Yunlin County and cancer rates among residents in the nearby townships of Mailiao, Taisi, Dongshih, Lunbei and Sihhu.</p>\n<p>&nbsp;</p>\n<p>While you may sneer at academics, you can not deny that beginning with the discharge of VOCs from this plant in 1999 the incidence of liver cancer in Taisi Township has increased thirty percent and over-all cancer incidence increased eighty percent. In order to avoid the stench from your toxic discharge, school children must plug their noses and cover their mouths with facemasks. You blacken the skies and blacken the viscera of all who live within reach of your effluents.</p>\n<p>&nbsp;</p>\n<p><strong>5. You Disregard Global Warming as You Produce Even More Emissions</strong></p>\n<p>Through its fourth phase, the Sixth Naphtha Cracker Plant (6th NCP), along with your neighboring power plant (the world’s fifth largest CO2 polluting power plant) produce sixty eight million tonnes of CO2 annually, one quarter of Taiwan’s CO2 emissions. But you aren’t satisfied with this achievement, as you go forward with plans for the fifth phase of the 6th NCP ignoring the crisis facing humanity and your contribution to climate chaos.</p>\n<p>&nbsp;</p>\n<p><strong>&nbsp;6. Your Legacy of Polluting Water and Soil will go on for Millennia</strong></p>\n<p>In April 2002 vinyl chloride levels in the groundwater at your plant in the Lin Yuan Industrial Park outside of Kaohsiung City in southern Taiwan were in excess of standards resulting in the declaration of a 32 hectare plant as a “control site”; in March 2007 10.8 hectares of your Cianjheng plant was cited as a soil pollution control site due to excessive levels of zinc and mercury contamination.</p>\n<p>&nbsp;</p>\n<p>Then in March 2010 the news broke out of one of the worst groundwater pollution cases in Taiwan’s history: – the groundwater beneath the VCM plant producing PVC your Renwu Plant tested for levels of 1,2-dichloroethane at <strong>302,000 (three hundred and two thousand) times</strong> the legal limit, ten other toxic substances were far in excess of the standards, and the 35.38 hectares had already been declared as a “remediation site”. You were aware in 2002 of the problem, but engaged in a cover up for eight years threatening the health of all inhabitants in the area as well as the 1,390 hectares of farmland in the plant’s vicinity.</p>\n<p>&nbsp;</p>\n<p><strong>7. The Ten Thousand Year Legacy of Your Industrial Waste</strong></p>\n<p>In 1998 with blatant disregard for the Basel Convention on the Control of Transboundary Movements of Hazardous Wastes and their Disposal your company surreptitiously shipped 2,799 tonnes of mercury contaminated waste to Kampuchea killing at least one worker who was exposed, and resulting in evacuations of thousands of others bringing the entire nation of Taiwan into international disrepute; in early 1999 another 8,700 tonnes of mercury-laden hazardous waste was discovered in the township of Liyushan in Pingtung, southern Taiwan and while all the evidence pointed to your culpability, in the end you collected a stipend from the government in the amount of 90 million dollars (about 3 million US dollars). The lunatics are indeed running the asylum!</p>\n<p>&nbsp;</p>\n<p><strong>8. You Are Liars and Cheats</strong></p>\n<p>In order to win the support from the people of Yunlin County, for your offshore petrochemical park-currently the site of the 6th NCP, you promised to build a medical center, a retirement area, shopping centers, nursing school, transportation center, a seaside resort, the Chang Geng Memorial Hospital and a whole new Mailiao City. You promised to bring 37,500 employment opportunities to the area. These promises have all ended up as bounced checks. How are you any different from a gang of con artists?</p>\n<p><strong>&nbsp;</strong></p>\n<p><strong>To the Black Hearted Formosa Plastics Group: Where is your conscience?</strong></p>\n<p>You have enjoyed to the maximum the support and subsidization by the Taiwan government while the legislature does what it needs to support you. Yet, you have nothing to show as far as giving back to either the land or the people of Taiwan. Your voracious appetite for growth continues to escalate unabated, externalizing the social and environmental costs while engaging in a protracted war on transparency and truth, a campaign of lies and deceit, corrupting society into one that asks only about profit, one that never questions values. Formosa Plastics, you have truly arrived at the pinnacle of avarice and evil, taking your place as the leader among the blackest of the black hearted Taiwanese industrialists.</p>\n<p>&nbsp;</p>\n<p>Your vast wealth comes from fossil fuels, but even if you were to spit out the entire amount of money that you have made from this exploitation, it would constitute but a tiny fraction of the cost of restoring the skies, the rivers, the ocean and the land.</p>\n<p>&nbsp;</p>\n<p>As you scramble over the estate of the deceased Y.C. Wang, we hope you will at least give some consideration to the environmental debts that your company has incurred to the Earth and its inhabitants during Y.C. Wang’s lifetime.</p>\n<p>&nbsp;</p>\n<p>This open letter is addressed to Formosa Plastics, but it is also an appeal to the government of Taiwan to remove the cangue of misery that it has been working, through its laws and dispensations, tailor made at Formosa Plastics behest, ruining the lives of untold numbers of our current and future generations.</p>\n<p>&nbsp;</p>\n<p>And to Formosa Plastics, we conclude with a bitter plea that you reflect on your behaviour, put aside your weapons of slaughter, and stop your pillaging of Taiwan at once, and for all.</p>\n<p>&nbsp;</p>"}, {"nid": 759, "title": "環保救國，也救自己", "original_topic": "工業污染;產業轉型", "adopted_cats": ["反對石化業擴張", "氣候變遷與調適"], "content": "<p>文⊙王敏玲 (地球公民協會副執行長)</p>\n<p><img alt height=\"272\" src=\"/sites/cet-taiwan.org/files/IMG_6591.JPG\" width=\"410\" loading=\"lazy\"></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span>李根政攝&nbsp;&nbsp;</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p>\n<p>最近天氣愈來愈熱，為了因應屢創新高的溫度，陽傘、帽子、袖套都用上了，人人還是直呼受不了，就在這種熱爆了的季節，預定在濁水溪北岸填海造地的國光石化開發案正密切舉行環評會議，明天要登場的是針對本案溫室氣體議題召開的專家會議。</p>\n<p>儘管國光石化公司表示，透過低耗能技術、不燃煤、以汽電共生發電等方法可減少二氧化碳的排放，但因產業屬性及產能浩大（一、二期加總，乙烯年產能共240萬噸，將近五輕產能的五倍），每年將從中台灣吐出一千一百八十七萬噸的二氧化碳。</p>\n<p>國光宣稱本案單位耗能與三輕、四輕、五輕等台灣舊的石化廠相比明顯降低，但國人不應忽視的是，近年台灣幾個重大環評案都有利用先進之名，行大幅擴建之實的問題。例如一年前在環保署僅以一票之險，差點闖關成功的台電大林案，及2008年12月通過的三輕更新擴產案。也就是說，開發單位在環評會中一再強調是最新廠，單位污染量或單位耗能會降低，構陷環保人士反對開發是不理性的。然而開發單位卻不願面對因為大幅擴張產能，而造成污染總量、總耗能大幅擴增、碳排放減無可減的嚴重問題。</p>\n<p>以本案為例，雖然與高雄煉油廠相比，單位耗能、碳排放量有下降，但每年1,187萬噸的二氧化碳排放量，卻是高雄煉油廠的三倍之多，本案一旦通過，全台灣每個人都將配給到0.51公噸，加重台灣人在世界上已經背得很重的高碳排放罪名！</p>\n<p>而馬政府上台後推動電費折扣節能措施，從97年7月到99年2月，全民脫西裝、搧扇子、拔插頭，努力了1年7個月才辛苦地減排447.2萬噸的二氧化碳，國光石化一蓋不但前功盡棄，還剩下740萬噸不知道要怎麼減。</p>\n<p>今年馬總統講出最經典的治國語是「環保救國」，民間多麼盼望這四個字比「謝謝指教」更常出現，此外環保署也在國際會議中宣稱我國正在推動減碳四法、努力邁向節能減碳的社會。倘若在此時，我們卻卯起來發展高耗能、高碳排放的石化工業，而且在台灣母河濁水溪北岸毀掉大片可以調節氣候的重要濕地，那麼政府不是在玩弄人民，就是在欺瞞國際社會。</p>\n<p>氣候變遷造成的災難常常超出人類防災的準備，在我們喊熱死了的時候，請民眾一起呼籲政府切記：環保救國，也救自己。</p>\n<p>&nbsp;</p>\n<p>（本文原載於2010年7月10日蘋果日報論壇版）</p>"}, {"nid": 1517, "title": "蘋果投書：電價該漲 但馬政府無能推動", "original_topic": "節約能源", "adopted_cats": ["氣候變遷與調適", "完善能源政策"], "content": "<p>針對內政部長李鴻源抱怨環保團體沒有支持政府的油電雙漲政策，讓他很失望一事。我認為電價的合理化確實是促進節能、安全社會的必要手段，而這次的電價調漲政策有四大問題：</p>\n<p>一、電價的真實成本還處於黑箱狀態，台電公司的腐化、備用電力過高、不當補貼也都是事實，政府在未提出檢討方案，也欠缺社會討論的情況下，只是單方面提出調漲方案，難怪要引發各界爭議。</p>\n<p>二、今年世界環境日前夕，環保團體檢驗了馬政府四年來的能源政策，發現2008年提出的競選承諾《能源稅法》，至今連行政院版本都還沒送出來；《溫室氣體減量法》則還躺在立法院，院版條文不願意訂出最重要的「期程和目標」，只是高談「碳交易」，四年來，在最關鍵的減碳政策上，馬政府幾乎是繳了白卷。從這裡可以看出，電價調漲只是為了解決台電的虧損問題，並不是真的要「節能減碳」。</p>\n<p>三、根據民間估計，從2007至2010年間，政府以低於成本的電價賣給工業界，四年來竟補貼了2300多億，超低電價讓工業界根本沒有節能誘因，電子業龍頭台積電就表示，節能主要是為了企業社會責任而推動，不是為了省錢。</p>\n<p>\t<span><span><strong>工</strong><strong>業補貼還在黑箱</strong></span></span></p>\n<p>但政府過去一直否認有對工業用電補貼的情形，真實的補貼狀況還在黑箱裡。工業用電佔全國五成以上，若要調漲，應先公布歷年對工業的補貼，從工業電價開始調整。</p>\n<p>四、如果政府真的要透過漲價抑制電力需求，應比照德國，宣布用電零成長或負成長的政策目標。然而根據台電公司的規劃，往後18年內，台灣因用電需求不斷增加，除了七個加起來高達9163億元預算的電廠外，還要再興建20座燃煤機組、22座天然氣機組，平均每年就要蓋2？3個機組，這是把人民當提款機，政策矛盾到不行！</p>\n<p>綜上，從修正不當補貼的觀點來看，合理的調漲是應該。但執政者不願揭露發電真實的成本，沒有社會討論，沒有進步的能源政策，就只是調漲電價來彌補台電的虧損，這樣的政策，環保團體如何按「讚」！</p>\n<p><span>作者李根政為地球公民基金會執行長</span></p>"}, {"nid": 2878, "title": "風災過後，種樹綠化不應是政商口袋的永續工程", "original_topic": "山林水土", "adopted_cats": ["氣候變遷與調適", "森林守護與林業改革"], "content": "<p><div>八十多歲的母親，在金門那頭的電話說：一輩子沒經歷過這麼大的颱風，狂風暴雨的那夜，屋瓦被掀、玻璃破碎吹了滿屋，內心的恐懼可比八二三炮彈。莫蘭蒂颱風除了帶來農損、建物損害之外，樹木的折損的數量更是龐大。近年來的颱風豪雨，揭示全球氣候極端化已是趨勢，因此風災後的植樹復建，不該只是把原來的樹種回去，而應該徹底檢討綠化政策，強化因應氣候變化的韌性。<br></p>\n<p>&nbsp;</div></p>\n<h3><strong>綠化工程忽視台灣生態特性</strong></h3>\n<p><div>台灣有四千多種維管束植物，都是經過大自然千錘百鍊下，得以適應存活的物種，無論從多樣性或特有種類角度來看，台灣都可以說是植物大國。生長在海邊的抗鹽耐風，生長在陡坡上的耐旱抓地力強，不同海拔、不同地區各有適應得很好的物種，有的耐陰，有的嗜好陽光。如果要種樹，就得考慮台灣不同地區的氣候環境，選擇適合在地的樹種，「適地適種」應該是綠化政策的基本款。</div></p>\n<p>然而，半世紀以來，綠化工程幾乎完全忽視台灣的生態特性。山坡地上我們把原生林砍除，種上外來種，或者非在地的本土種；公園和行道路充斥著外來種，根據筆者曾進行過的高雄市校園和行道樹的調查，大約七成以上都是種植外來種。種樹其實很政治，外來的國民黨政權連種樹都喜歡外來的，但號稱本土政權的民進黨，綠化政策與前朝大都是無縫接軌。</p>\n<p>當然，樹種選對了，不表示一定長得好。一棵樹要在台灣的公共空間上好好活著，並不容易，除了颱風豪雨的考驗，更多的是人謀不臧。</p>\n<p><div></p>\n<h3><strong>行道樹要變成「我們的樹」才不會一再受虐</strong></h3>\n<p>種樹時，樹根包裏著不織布袋入土，植穴太小根系無法開展，或者被水泥完全封死，不當修剪導致病變、重心失衡，這些都是愛樹人士講了幾十年的陳年問題，另外，行道樹也不是人人喜愛，有些住戶店家怕小偷從樹上爬進屋子、怕蟲害、怕根系破壞建築、嫌掃落葉麻煩、風水不好、擋招牌、不會開花…...，這些問題並非完全無解，只是政府沒有看重這件事。</p>\n<p></div></p>\n<p><div>如果我們期望台灣的公共空間可以看到「百年大樹」，就要先確立不同類型公園，公共空間，行道樹等的屬性定位，考量氣候、樹種、地形、空間土壤條件、日常管理等面向，發展出各種符合台灣生態的作業準則。例如行道樹，就很需要考慮社會文化因素，建立合宜的公共討論機制，和店家住戶建立起商議程序，讓行道樹變成人們心中「我們的樹」，避免樹木們一再受虐。</div></p>\n<p><div>&nbsp;</div></p>\n<p>台灣的公園有什麼綠化典範嗎？宜蘭羅東運動公園這幾年間因颱風侵襲下，有很多樹木被連根拔起，今年筆者再度重遊時深感景色黯然褪色。然而，公園內彷照台灣原生林建照的六個翡翠鍊狀山丘，裡面的樹木植物卻仍是多樣青翠，這項植栽設計，很適合災後重新設計綠化工程的參考，這是筆者很欣賞的造園案例。</p>\n<p><img alt src=\"http://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20160921-051.jpeg\"><br>\n<p><span>宜蘭羅東運動公園的九個翡翠山丘，營造了一個以台灣原生植物為主的森林，裡面有喬木、灌木、草本植物，物種豐富又禁得起颱風考驗。</span></p></p>\n<h3><strong>金門縣20多億經費復育樹，應以原生植物為目標</strong>&nbsp;</h3>\n<p><div>這一次金門縣號稱折損了五百萬樹木植栽，復育經費初估高達二十多億。筆者建請金門縣政府和林務局，先釐清折損與需要補植的數量，以免被質疑為了爭取經費而誇大損害；再者，應結合國家公園的植物生態研究基礎，以復育金門的原生植物生態為目標，全盤提出「適地適種、生態綠化」的復育計畫，尤其不要再任由政商合謀引進外來物種了。例如：這次風災後，縣府宣稱倒下一百萬棵灌木，如果都是外來種灌木，那麼這些錢不該再花了。</div></p>\n<p><div>&nbsp;</div></p>\n<p><div>莫蘭蒂颱風導致那麼多的樹木折損實在令人心痛，但這是大自然給我們的警示，執政者應該把台灣的綠化政策全面導向本土化、在地化、生態化，強化因應極端氣候的「韌性」，不要讓種樹綠化變成政商口袋裡的永續工程—名符其實的搖錢樹，這也算是還給台灣土地一個轉型正義吧。</div></p>\n<p>&nbsp;</p>\n<p>（本文為2016/9/20<a href=\"https://www.twreporter.org/a/opinion-school-relocation-dispute\"><span></span></a><a href=\"https://www.newsmarket.com.tw/blog/88192/\">【上下游News&amp;Market新聞市集】投書</a>）</p>"}, {"nid": 3145, "title": "溫室氣體減量需要更積極的策略", "original_topic": "能源轉型", "adopted_cats": ["氣候變遷與調適", "完善能源政策"], "content": "<p><span><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u143/20171201-1.jpg\"><br>\n<p>(photo from&nbsp;<a href=\"https://goo.gl/779Q4m\">https://goo.gl/779Q4m</a>)&nbsp;</span></p></p>\n<p>\t今年11月8日環保署依據《溫室氣體減量與管理法》提出「溫室氣體減量推動方案」(草案)，擬定2020年比2005年減排2%、2025年減排10%的管制目標和推動策略，及能源、製造、住商、運輸、農業與環境六大部門在105~109年第一期階段管制的減量行動方案(草案)，預計今年12月底前報行政院核定後實施。</p>\n<p>地球公民檢視該推動方案，認為應再加速啟動總量管制、提出更積極的部門策略。以下幾點意見：</p>\n<p><ol></p>\n<p><li><strong>2025</strong><strong>年才啟動溫室氣體總量管制，時程太晚：</strong>環保署規劃總量管制、綠色金融與稅費、各部門相關法規修訂、衝擊評估與科技研發、專責單位與人力…等溫室氣體減量的配套政策，皆要等到2025年才會建置完備，恐怕無法如期達到減量目標。<br></p>\n<p>&nbsp;</li></p>\n<p><li><strong>重大公共建設、能源開發、產業擴增、道路開發等計畫，應納入部門整體排放檢討：</strong>例如國道七號或193等道路開發，恐會引導汽燃油私人載具成長；在溼地設置能源設施，會折損原生態系統的減碳效果...故開發案應進行碳排放評估，一旦超出部門管制目標，應思索替代方案或零方案。<br></p>\n<p>&nbsp;</li></p>\n<p><li><strong>應分配各縣市溫室氣體排放管制目標與減碳責任</strong>：為有利於地方政府提出縣市減量執行計畫，令縣市施政符合國家減碳路徑，應於縣市執行計畫提出前完成縣市管制目標與減碳責任。<br></p>\n<p>&nbsp;</li></p>\n<p><li>部門計劃能否達到預期的減碳目標，應提出明確的評估數據、具體施政期程與檢核點加以佐證。<br></p>\n<p>&nbsp;</li></p>\n<p><li>能源部門：(1)<strong>空污季節優先降載中南部燃煤機組。(2) 汽電共生與民營電廠躉購費率應依燃料別制訂差別費率，導引電廠使用清潔燃料</strong>。(3)研究能源外部成本，研擬透過電價調整、移除化石燃料補貼、課徵能源稅等方式，讓能源消費外部成本內部化，以促進低碳能源的發展、提高低碳產品的競爭力。<br></p>\n<p>&nbsp;</li></p>\n<p><li>產業部門：(1)光是「推動、補助、鼓勵」沒有強制性也欠缺目標期程，建議鞭子與蘿蔔齊下，針對改用清潔燃料、製程改善、設備汰舊換新，制定逐步加嚴管制的標準或政策，例如<strong>制訂不同製造業別的製程能耗標準、明訂大用戶與鍋爐改用低碳燃料之使用率或購買率，</strong>搭配提供<strong>減碳改善措施之綠色融資或補助</strong>，隨著逐年擴大管制對象、加嚴管制標準，<strong>明訂縮減獎補助措施的時程</strong>，以增加耗能企業改善的誘因。(2)建立產業供應鏈之碳排放揭露機制，協助低碳產業鏈之國際行銷，扶植低碳產業、促進高排碳產業轉型。<br></p>\n<p>&nbsp;</li></p>\n<p><li>住商部門：(1)新建物必須符合綠建築規範，<strong>綠建築規範應納入舊建物之低耗能標準與新建物之零耗能建築規範</strong>。(2)<strong>訂出老舊建物年度翻修率目標，提供老舊建物節能改善之低利貸款</strong>，鼓勵老舊建築物拉皮或修繕改建符合低能耗標準。(3)設定商業大樓優先進行隔熱通風與能耗改善達成率。(4)<strong>加速建置建築能源資料庫</strong>，不應等到114年才「研議」建置。(5)鼓勵住商建築裝設太陽光電、補助住商儲能系統，增加住商使用再生能源以減少碳排。<br></p>\n<p>&nbsp;</li></p>\n<p><li>運輸部門：(1)減少大型公路運輸開發計畫，提高大眾運輸接駁與利用率；與地方政府合作，試點縮減城市內的汽機車道，在通勤路段增加自行車道與綠蔭或光電板遮蔭。(2)增加電動車充電站、加氫加氣站。<br></p>\n<p>&nbsp;</li></p>\n<p><li>農業、環境、能源與產業部門：<strong>推動農業廢棄物、路樹修剪殘枝、漂流木等收集、破碎，轉製為顆粒燃料，並規範產業使用生質燃料之比例</strong>。提升木質燃料收集、運送、銷售通路順暢。</li></p>\n<p></ol></p>\n<p>擺脫高污染、高排碳，轉型成低碳永續的家園，需要大家在生活的六大面向一起努力，而國家的管制目標與策略則決定努力的方向與效益。在行政院核定前，呼籲大家一起來發聲與關心。</p>\n<p>參考資料：<a href=\"https://www.epa.gov.tw/public/Data/711239481471.pdf\">推動草案簡報</a>、<a href=\"https://www.epa.gov.tw/public/Data/711815381571.pdf\">推動草案內容</a>、<a href=\"https://www.epa.gov.tw/np.asp?ctNode=35886&amp;mp=ghgact\">部門行動方案</a></p>\n<p>向環保署表達意見：<a href=\"https://goo.gl/9JRsA2\">https://goo.gl/9JRsA2</a></p>"}, {"nid": 3314, "title": "毀的不只藻礁 更毀了政府公信力", "original_topic": "土地與生物保育;能源轉型;環境民主", "adopted_cats": ["氣候變遷與調適", "完善能源政策"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u143/20181009-1.jpg\"><br>\n<p>文/地球公民基金會副執行長 蔡中岳</p></p>\n<p>在行政院賴清德院長的強硬宣示，與環保署副署長詹順貴的請辭聲明下，中油在桃園觀塘工業區的第三天然氣接收站（以下簡稱三接），以破壞環境影響評估機制的作法，兩周內召開第三次環評大會，昨天好不容易湊齊開會人數成會，宣告通過環評；意即在當地生活7600年的大潭藻礁生態系將面對極大的挑戰。然而，眾所周知這次環評是用宣告而非審查通過的，因為賴揆1個多月前行政指導式的宣示，到上周五在立法院的答詢中，早就公布三接結果。</p>\n<p>而在這次審查中，除了藻礁將面臨威脅，最大的破壞其實是政府公信力的崩解與環評機制的摧毀。</p>\n<h3><strong>賴揆黑手成了藻礁殺手</strong></h3>\n<p>現行的環評機制中，由於案子多又希望環評可以加速，多半是由民間委員分組進行專案小組的審查，最後經過環評大會確認。藻礁一案過去在小組審查爭議多年，終於在今年7月做出不通過的小組決議，然而，專家委員並沒有改變意志，但短短3個月內卻由政府方發動，直接在本應該確認小組結論的大會上徹底翻案。先是賴清德做出清楚的行政指導，對外宣布要在9月通過三接環評，而在民間委員集體抗議退席的環評大會後，連續召開兩次本不在議程內的環評大會，經過1次流會後，才在勉強湊齊人數的會議中強勢通過本案；政府的手介入專業審查的機制如此清晰，難看至極。</p>\n<p>在賴揆清楚的政治宣示後，7席官派環委勢必不敢違逆上意，是否有必須迴避之嫌，尚待釐清，但據聞環評大會連討論是否迴避都沒有討論，也可以感受到政府的急切之心。過去以環保起家的民進黨，總是抗議國民黨政權以黑箱、黑手之姿左右國家發展，罔顧專業與民意，然而在自己執政後，卻大打自己嘴巴，民眾早已看清，也難怪民調始終低迷。</p>\n<p>自打嘴巴的不只如此，在馬英九執政時期，蔡英文曾親臨大潭海岸，並寫下「藻礁永存」4字；民進黨的桃園市長鄭文燦也曾在選舉時承諾「守護藻礁」，而這些承諾在賴清德的強勢不聽勸下，就如同泡水的標語般，再次失去誠信，謙卑的態度蕩然無存。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u143/20181009-2.jpg\"></p>\n<h3><strong>「非核減煤」不是黑鍋</strong></h3>\n<p>除了失信於民，最為可惡的，是賴揆還可能要拿「非核減煤」的政策來替自己毀壞藻礁一事背黑鍋。明明「非核減煤-能源轉型」的路徑，就是希望兼顧不會發生核災、減煤、且能降低排碳的方向前進，而這些規劃中本就不需要深澳燃煤電廠，卻硬是要栽贓；而三接的選址也因為中油的蠻橫霸道，完全漠視台北港、林口港、浮式接收站等其他可能性，弄到今天似乎得在藻礁資源豐沛的觀塘海岸設立，過往的行政怠惰與盲目的政策，造成今天的崩壞，中油、賴清德院長都難辭其咎。</p>\n<p>民進黨政府重掌政權後，力邀改革第一線的社運人士進入體制，為國家建立更完整且永續的發展方向，過去環境訴訟領域奮鬥的環保律師詹順貴，在期待與疑問聲中進入體制；然而改革過程並不順遂，先是為了堅守心中的法規制度投下與環保對立的深澳電廠一票，更在充滿政治黑手的藻礁環評中，為了維繫體制而請辭下台。法律人出身的詹順貴，以辭職這樣最激烈的手段，提醒曾服務過的政權懸崖勒馬後，政府仍不顧民怨做出決定，就是民進黨政府沉淪的展現，也極有可能步入國民黨的一蹶不振。</p>\n<p>（本文為2018/10/09&nbsp;蘋果日報論壇投書：<a href=\"https://tw.news.appledaily.com/forum/realtime/20181009/1444188/\">蔡中岳：毀的不只藻礁　更毀了政府公信力</a>）</p>"}, {"nid": 3538, "title": "氣候危機迫在眉睫，我們願意付出多少行動？", "original_topic": "抗暖減碳", "adopted_cats": ["氣候變遷與調適", "完善能源政策"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u143/20190927-1.jpg\"><br>\n<p><span>莫拉克風災來襲淹大水，瞬息萬變的天災，台灣無法置身事外(傅志男攝)</span></p></p>\n<p>「How Dare you ⁉」（「你們怎麼敢⁉」）是年僅16歲的環保鬥士Greta Thunberg反覆使用的詞彙，盡訴氣候問題被目前各國領袖們持續忽視時，年輕世代所感受到的憤怒與無奈。</p>\n<p>「你們」是誰？是國家領袖、政黨和排碳的企業，也是直指每個大人。面對迫在眉睫的氣候危機，不能再無所作為了！</p>\n<p>今天，是聯合國大會「氣候週」的最後一天。台灣雖不是聯合國會員，但是碳排放卻高居全球第21位；人均排放量是全球排名第19位。身為地球公民的一份子，要負很大的責任。</p>\n<p>面對氣候變遷，地球公民提出減碳、減污的氣候主張，呼籲總統候選人：</p>\n<p><ul></p>\n<p><li>面對減碳法定目標（2030年較2005年減20％、2050年再減至50%），各政黨總統參選人應提出具體的規劃，並確保不會跳票。<br></p>\n<p>&nbsp;</li></p>\n<p><li>秋冬季節中南部空污嚴重，老舊燃煤機組應優先除役，運轉中的機組應轉為備用調度，不應以燃煤發電供應北部用電需求。<br></p>\n<p>&nbsp;</li></p>\n<p><li>在2025年再生能源應達20%的基礎上，提出2030、2050的再生能源目標與路徑，邁向100%再生能源。<br></p>\n<p>&nbsp;</li></p>\n<p><li>效法歐盟與德國減碳計畫，儘速推動「能源稅或碳稅」，藉碳定價來促進減碳與減污。</li></p>\n<p></ul></p>\n<h3>\n<p>地球公民面對氣候危機的行動</h3></p>\n<p>2009年，減半台電大林電廠擴建規模，每年約減少800萬噸CO2排碳量，相當於高雄市住宅和商業活動一整年排放量。</p>\n<p>\t2011年至今，透過持續能源轉型行動，和台灣社會共同促成非核、減媒、推動再生能源的轉型。</p>\n<p>\t2016-2019，推動太陽光電要在對的地方設置，興達燃煤電廠減煤與提前除役。呼應全球減少化石燃料的倡議。</p>\n<p>\t2010，扭轉「砍大樹、種小樹」錯誤造林政策，每年減少數千公頃森林砍伐，節省國庫上百億支出。呼應聯合國減少毀林的減碳策略。<br>\n<p>&nbsp;</p></p>\n<p>&nbsp;</p>"}, {"nid": 3605, "title": "〖方案一〗訂出2025年到2050年間的能源轉型路徑及執行方案 ", "original_topic": "抗暖減碳", "adopted_cats": ["氣候變遷與調適", "完善能源政策"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20191203-11_0.jpg\"></p>\n<p>為了達到2015年《巴黎協定》致力於追求全球平均升溫幅度不超過1.5°C，以阻止全球暖化加劇，聯合國跨政府間氣候變遷專家委員會（IPCC）於2018年發表《全球升溫1.5°C特別報告》指出，2030年全球溫室氣體排放量須較2010年的水準降低40-60%；並於本世紀中（2045-55年）達零排放。世界各國已紛紛提出至2050年前的長期能源轉型目標與政策，例如：&nbsp;</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u146/20191203-1_0.png\"></p>\n<p>2016蔡政府上台之後台灣雖然訂定了2025年「非核、減煤、增綠」的電力結構調整目標，並制定《能源轉型白皮書》，提出未來五年的執行方案；亦在《溫室氣體減量與管理法》中，明訂2050年的排碳量需較2005年時減半之長期目標。但電力轉型只規劃到2025年，溫室氣體減量推動方案也只到2020年，而2018年淨溫室氣體排放量已較2005年成長8%，使得2020年第一階段減排目標恐已無法達標。&nbsp;</p>\n<p>\t面對全球氣候行動潮流，台灣需採取更積極的能源轉型策略！總統應啟動氣候行動內閣，統整督促各部會的氣候行動，邀請外部獨立專家檢視各部會的執行成果，擘劃2025年至2050年除煤減氣的電力轉型期程，對接第二階段溫室氣體減量推動方案及各部門中長期減碳路徑與執行方案，並搭建中央各部會與地方、官方與民間合作的治理平台，共同建構台灣成為低污染、高效率、零排放的理想家園。</p>\n<p><hr></p>\n<p>回到主頁：<a href=\"https://www.cet-taiwan.org/info/story/3610\">台灣面對氣候變遷的五大減碳方案</a></p>"}, {"nid": 3606, "title": "〖方案二〗加速減碳進程", "original_topic": "抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20191203-12_0.jpg\"></p>\n<p>各政黨應承諾儘速推動課徵「能源稅或碳稅」，秉持污染者付費精神，讓排碳者負擔代價，以加速減碳進程。全體國營事業都應將氣候變遷訂為績效目標，逐年檢討達成進度。&nbsp;</p>\n<p>礙於工商團體壓力，國內能源被控制長期以低於成本的價格供應。能源98％仰賴進口的台灣，電價居然是全世界前五低，價格還遠低於類似條件的韓國與日本，非常不合理。過去對化石燃料的過度補貼，使得高耗能、高排碳的產業結構轉型遲緩，難以抑制氣候變遷及達到減碳目標。&nbsp;課徵能源稅或是碳稅是世界各國主要抑制排碳的工具，例如：</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u146/20191203-2_2.png\"></p>\n<p>台灣在2015年通過的《溫室氣體減量與管理法》，也有政府應該「依二氧化碳當量，推動進口化石燃料之稅費機制」的政策原則，並要求落實政府收多少就用到社會多少的稅收中立原則，把所收得的經費，用來因應氣候變遷及促進社會公益。但至今卻未見制訂相關機制。今年（2019）7月頒訂的台灣永續發展目標中，已明文承諾明年度需要提出能源稅整體規劃，我們要求各政黨應承諾推動「能源稅或碳稅」，按照污染者付費的精神，以排碳量來課以排碳者責任，以因應氣候變遷。&nbsp;</p>\n<p>\t其次，台灣的溫室氣體排放情況嚴重，中鋼、中龍、中油等國營企業要負很大的責任。根據統計，2017年這幾家國企所排放的二氧化碳約占全台灣的28%。換句話說，全台灣有四分之一以上的溫室氣體都是由他們產生。若用前五年的年均成長率來看，除了中油下降7.24％外，中鋼增加了0.56％、中龍也增加1.72％。為了對抗氣候變遷，我們主張全體國營事業都應將氣候變遷訂為績效目標，並且逐年訂定進度來檢討達成比率。</p>\n<p><hr></p>\n<p>回到主頁：<a href=\"https://www.cet-taiwan.org/info/story/3610\">台灣面對氣候變遷的五大減碳方案</a></p>"}, {"nid": 3608, "title": "〖方案四〗制訂交通運具全面電動化期程", "original_topic": "抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20191203-14_0.jpg\"></p>\n<p>全國應制訂交通運具全面電動化期程，針對空污嚴重的中南部縣市，政府應加碼提高電動汽機車補助方案，加速電動化。&nbsp;</p>\n<p>\t在道路上行駛的大貨車與汽機車等交通工具，是產生溫室氣體與空氣污染的重要來源。根據統計，近年來運輸部門所產生的溫室氣體，約佔全國CO2排放量的13.5％，以小客車占比最高，大貨車次之；以PM2.5來看，交通運輸則佔26％。由於汽機車距離身體很接近，對於健康的影響也不容忽視。根據環保署調查，機車族所暴露的PM2.5污染，最嚴重時接近紫爆等級。縱使走路、騎腳踏車或搭乘大眾運輸，也會在移動中吸入大量路邊汽機車所排放出來的污染物。&nbsp;</p>\n<p>\t根本解決之道，還是台灣必須發展大眾運輸，並逐步走向運具全面電動化，減少道路上污染。中央政府與地方政府應該主動提出運具全面電動化的時間期程，持續提供電動汽機車補助配套方案，協助民眾加速汰換老舊汽機車，減少CO2及空污的排放。針對排碳及空污嚴重的中南部縣市，應加碼補助提高誘因，縮短電動化的時程。</p>\n<p><hr></p>\n<p>回到主頁：<a href=\"https://www.cet-taiwan.org/info/story/3610\">台灣面對氣候變遷的五大減碳方案</a></p>"}, {"nid": 3609, "title": "〖方案五〗將能源民主與公正轉型價值導入氣候政策", "original_topic": "抗暖減碳", "adopted_cats": ["氣候變遷與調適", "關注地面光電"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20191203-15_0.jpg\"></p>\n<p>「能源民主」是能源轉型的核心價值，也就是將能源使用的決策權及參與權還給人民，擴大社會參與。&nbsp;</p>\n<p>三年多來，再生能源雖有大幅成長，但並非一帆風順，由於在2016年之前的無所作為，欠缺法規配套，以致於出現不少爭議。地面型光電陸續設置在廢鹽田、魚塭、農地，中央和地方政府等各機關各自為政、缺乏整體規畫，沒有整體評估環境生態與社會衝擊，審查過程中也沒有設計足夠的資訊公開及公民參與程序。&nbsp;</p>\n<p>由歐洲的過往經驗來看，如果事前有整體的「環境與社會檢核機制」，衡量環境承載力來篩選出適當地點，輔導綠能業者優先在爭議小的地方設置光電，並納入利害關係人和公眾參與機制，落實「能源民主」，則生態、農業與綠能不必然會相互衝突，反而可能達到共善三贏的結果。&nbsp;</p>\n<p>此外，面對氣候變遷威脅，與化石燃料驅動的經濟體系脫鉤、追求可持續的經濟發展型態，已是驅動全球經濟的大趨勢，包括能源（如脫煤）、石化、鋼鐵等產業，均面臨工業朝向永續轉型所涉及的工作機會轉換與安排。2006年聯合國環境規劃署首度針對勞工與環境議題召開會議，大約同時，國際大型工會組織也將氣候變遷納入工會議程，北美工會更率先提出「公正轉型」，主張在氣候調適、產業與能源轉型過程中，應有補償或補救措施、為勞工提供有尊嚴的綠色工作等原則。&nbsp;</p>\n<p>加拿大於 2016 年提出逐步在 2030 年淘汰燃煤發電的計畫，以達到減碳目標，其中「公正轉型」已列為國家氣候政策的一環，於 2018 年 4 月成立「燃煤電廠工人與社區公正轉型工作小組」，由勞工團體與環保團體的代表擔任主席，負責規劃加拿大公正轉型國家框架。&nbsp;</p>\n<p>「公正轉型」的根本目標，是讓現行被鑲嵌於高碳經濟體制的勞工與社區，能支持低碳經濟的發展。回看正在啟動轉型中的台灣，從淘汰老舊柴油車，到電動機車取代燃油機車，乃至大社石化工業區的降編轉型等，都是減碳減污很關鍵的政策，如何將「公正轉型」的概念原則，納入台灣的轉型工程，是訂定氣候政策不可或缺的一環。</p>\n<p><hr></p>\n<p>回到主頁：<a href=\"https://www.cet-taiwan.org/info/story/3610\">台灣面對氣候變遷的五大減碳方案</a></p>"}, {"nid": 3610, "title": "台灣面對氣候變遷的五大減碳方案", "original_topic": "抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p>&nbsp;</p>\n<p><img alt=\"20191204-02.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20191204-02.jpg\"></p>\n<p>聯合國氣候變遷大會（COP 25）正在西班牙舉行，但遺憾的是，台灣2020總統大選中，氣候問題並未排上政策討論的議程。&nbsp;</p>\n<p>\t「能源轉型」是處理氣候變遷與減碳的最為核心課題，根據統計，全世界有70%以上直接或間接的溫室氣體排放都與能源有關，其中又以發電、工業、交通......等產業部門的能源使用最為關鍵。&nbsp;</p>\n<p>\t1997年京都議定書簽定之後，台灣從1998年開始，每隔數年召開全國能源會議，討論如何減碳？如何能源轉型？但年年虛耗，擺脫不了高污染、高耗能產業的魔咒，產官學的主流仍是擁核、否定再生能源的能源政策。直到2016年三度政黨輪替，民進黨政府宣布邁向非核的能源轉型，才終於和國際先進國家接軌，啟動真正的能源轉型。&nbsp;</p>\n<p>\t首先是確立核一、二、三廠的使用執照將於2025年前陸續到期且不延役，並廢止核四廠，同時將2025年再生能源訂為20%。三年多來，太陽光電成長快速，夏季發電最高峰超越二座核二或核三機組，而首座的離岸示範風廠也併網發電，再生能源在台灣終於正式上路。&nbsp;</p>\n<p>\t相較而言，國民黨則是擁抱傳統能源的舊勢力，延續馬政府視再生能源為丑角的政策。總統候選人韓國瑜的能源政策，宣稱是清潔電力、火力發電「50-50」。而其清潔電力是包括核能和再生能源，支持核四重啟；火力是燃煤和天然氣。把二種排碳和環境成本相異的能源包裏起來，明顯是在混淆視聽，極端不負責任，這要讓台灣的氣候政策倒退，禍遺子孫。&nbsp;</p>\n<p>\t雖然，民進黨過去三年所推動的能源轉型值得肯定。不過，我們也要指出，以目前的能源轉型藍圖和政策，仍不足以對應台灣應承擔的國際減碳責任，帶動邁向低碳健康的經濟轉型。&nbsp;</p>\n<p>\t依據國際能源總署2019年對於減碳策略方案的研究，若2050年要把全球的CO2排放量控制在永續發展的情境，37％的減碳量要仰賴能源效率的提升；32％靠發展再生能源；8％則是替換成乾淨燃料。整體看來，透過上述方式可以貢獻全球超過7成5以上減碳量。&nbsp;</p>\n<p>\t依據國際的減碳策略和台灣情境，地球公民基金會提出五大氣候政策方案，提供給各界及各政黨總統候選人在台灣面對氣候變遷的政策參考，並要求大選後的執政黨，能為台灣擘劃出，2020年到2050年間台灣因應氣候變遷的執行路徑。</p>\n<p>\t（以下請點選連結，進入相關方案閱讀）</p>\n<p>方案一、<a href=\"https://www.cet-taiwan.org/info/story/3605\">台灣必須訂出2025年到2050年間的能源轉型路徑及執行方案。</a></p>\n<p>方案二、<a href=\"https://www.cet-taiwan.org/info/story/3606\">各政黨應承諾儘速推動課徵「能源稅或碳稅」，秉持污染者付費精神，讓排碳者負擔代價，以加速減碳進程。全體國營事業都應將氣候變遷訂為績效目標，逐年檢討達成進度。</a></p>\n<p>方案三、<a href=\"https://www.cet-taiwan.org/info/story/3607\">強化中南部減煤、鍋爐更換、污染排放大戶減量。</a></p>\n<p>方案四、<a href=\"https://www.cet-taiwan.org/info/story/3608\">全國應制訂交通運具全面電動化期程，針對空污嚴重的中南部縣市，政府應加碼提高電動汽機車補助方案，加速電動化。</a></p>\n<p>方案五、<a href=\"https://www.cet-taiwan.org/info/story/3609\">將能源民主與公正轉型價值導入氣候政策，減少環境社會衝擊。</a></p>\n<p>減碳不是為了救地球，而是為了救台灣！近年來極端氣候逐漸常態化，年年破記錄的夏季高溫、短時間高強度造成淹水的強降雨，對台灣島上的人類和其他生物，都已造成嚴重的傷害與衝擊。聯合國秘書長古特瑞斯於本次氣候大會前特別強調：「人類的科學知識與技術有辦法遏阻氣溫上升，缺的只是各國政府的決心及政治意志」。期待各政黨的總統與立委候選人展現決心與魄力，以具體行動來實踐台灣的減碳承諾。&nbsp;<br>\n<p>&nbsp;</p></p>"}, {"nid": 3623, "title": "台灣如何減碳，因應氣候變遷？", "original_topic": "能源轉型;國會/政策", "adopted_cats": ["氣候變遷與調適", "完善能源政策"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20191217-9.jpg\"><span>極端氣候強降雨造成淹大水，瞬息萬變的天災，台灣也無法置身事外（</span><span>傅志男攝）</span></p>\n<p>英國牛津辭典，每年會根據世界關注焦點公告年度詞彙，2019年代表詞彙是「氣候緊急狀態（climate emergency）」；不約而同地，以世代正義號召「為氣候罷課」行動的16歲瑞典少女桑伯格（Greta Thunberg），獲選為美國時代雜誌的2019年度風雲人物，在在顯現全球社會對抑制氣候變遷的焦急和迫切。&nbsp;</p>\n<p>台灣為了減緩氣候變遷，2015年《溫管法》制訂「2050年溫室氣體排放應降為2005年排放量50％以下」的長期目標，環保署也設定「2020碳排較2005年減量2%」的第一期目標。但直到2018年為止，我國排碳量卻仍比2005年高8％，幾可確定第一期無法達標，難怪日前德國看守（Germanwatch）、CCPI評比全球氣候變遷績效，台灣得到倒數第三的難看成績。&nbsp;</p>\n<p>平心而論，三年來政府並非毫無建樹，在推動能源轉型、減煤及建置再生能源上，台灣已逐漸跟上世界腳步，2018年排碳量的確較2017年減少1％。但政府應該深切檢討，台灣忽略各國都已祭出能源稅、碳稅等機制來控制碳排。另外，各國大多已設定2050的能源轉型目標及路徑，台灣則還僅有2025的能源配比目標，這些才是評比倒數的重要因素。</p>\n<p>工業排碳佔全台灣碳排放的50%以上，但過去十多年來，政府只靠業者良心發現的「自願減量」，12年來成效越來越差，去年自願減碳量甚至是開辦以來第二低。追根究底，工業減碳不易原因出在過度補貼化石燃料，礙於工商團體壓力，國內能源長期以低於成本的價格供應，無法確實反映其健康危害與空氣污染等外部成本。台灣能源98％仰賴進口，電價居然是全世界前五低，非常不合理。過低的能源價格，讓節能投資的回本年限過長，導致企業缺乏減碳動力，更使得高耗能、高排碳的產業結構轉型遲緩，難以達到減碳目標。&nbsp;</p>\n<p>今年聯合國氣候峰會（COP25）強烈主張各國應使污染者付費、停止化石燃料補貼。租稅負擔上，應從所得稅轉成碳稅，減免平民百姓稅負並讓污染的企業繳稅。因此，課徵「能源稅或碳稅」是各國抑制排碳的必備工具，例如英國以碳排量計價課徵氣候變遷捐和碳稅；德國則針對燃油及電力的進口生產業者課徵生態稅。然後兩國再把稅收以「取之於污染者、用之於民」的中立原則重新分配，降低所得稅、健保費與退休保費並因應氣候變遷。但在台灣，能源稅自2006年提出草案後，不管是哪一黨執政，13年來都原地踏步無法立法，難怪減碳進度遲緩。&nbsp;</p>\n<p>減碳不只是為了救地球，更為了救台灣！近來極端氣候逐漸常態化，破記錄的夏季高溫與短時間致災的強降雨，都已經不是新聞。聯合國秘書長古特瑞斯特別強調：「人類的科學知識與技術有辦法遏阻氣溫上升，缺的只是各國政府的決心及政治意志」。期待各政黨的總統與立委候選人展現決心與魄力，以「能源稅」來具體實踐台灣的減碳承諾。選民也要睜大眼睛，把選票投給真正能為台灣因應氣候變遷並承諾促成能源稅的候選人。</p>\n<p><strong>我們可以怎麼做？看看地球公民提出的<a href=\"https://www.cet-taiwan.org/info/story/3610\">台灣面對氣候變遷的五大減碳方案</a></strong></p>\n<p>&nbsp;</p>\n<p>（本文為2019/12/18&nbsp;蘋果日報投書：<a href=\"https://tw.news.appledaily.com/forum/20191217/ZJLP6HA5HGT244E5VDRTO5ILGY/\">地公李翰林：誰能帶領台灣減碳因應氣候變遷</a>）</p>\n<p>&nbsp;</p>"}, {"nid": 3639, "title": "氣候變遷緊急狀態，台灣總統候選人政策揮空拳？", "original_topic": "抗暖減碳;國會/政策", "adopted_cats": ["氣候變遷與調適"], "content": "<p><span><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20191224-2.png\">臺灣青年民主協會舉辦的青年總統論壇，三位總統候選人都出席回應台灣青年氣候聯盟的提問。（取自臺灣青年民主協會粉絲專頁）</span></p>\n<p>距離大選結束剩不到一個月，漸趨白熱的選舉激情卻沒有深化政策的論辯，甫結束的總統、副總統公辦政見發表會各說各話，交鋒處也並非政策上立場的相左，甚為可惜。</p>\n<p>但國際政治的腳步並未停下，上周剛於西班牙結束的COP25（聯合國氣候變化綱要公約第25次締約國大會）聚集了多國領袖，面對氣候變遷的問題共同研商對策。雖然最後會議結論並無進展，大多專家均給予「Disappointment（失望）」作為整體評價，但至少就條約內容有所爭辯。</p>\n<p>而在COP25會議進行的同時，在台灣脈絡下僅有「氣候變遷績效全球倒數第三」這個問題被看見；在台灣大選中，雖然偶爾會提到氣候變遷是全球最棘手的共同問題，但相關討論通常只圍繞在「發電選擇」的爭議上，顯然落後世界許多。但更令人擔憂的是，候選人連基本的知識都不足。</p>\n<p><h2>忽略世界潮流的總統候選人</h2></p>\n<p>日前由臺灣青年民主協會舉辦的青年總統論壇，三位總統候選人回應台灣青年氣候聯盟的提問時，就出現了聽不懂問題而亂回答的笑話。韓國瑜與宋楚瑜在抽題的過程中都面對同一個問題：<br>\n<p>2020年是巴黎協定正式生效的一年。各國政府都會提出他們五年為一期的「國家自定貢獻」（氣候行動目標），請問您要如何整合社會與政府資源，提出有效的2020臺灣「國家自定貢獻」？</p></p>\n<p>國家自定貢獻（Nationally Determined Contributions）是指在巴黎協定中要求，每個國家需自主提出預計的減碳目標量，因為是自己提出的，所以更有履行減碳的動力與意義。</p>\n<p>但這個問題在韓國瑜的回應中，除了提及排碳量太高會阻礙國際貿易、對國民身體健康有疑慮，及極端氣候會對婦女、兒童、原住民等弱勢者更有影響的前提外，其針對問題核心的正式回應僅說明，因為不肖官員貪污會剝奪環境資源，更有盜伐森林、傾倒廢棄物的事實，所以承諾會由原委會與廉政署成立小組，對環境維護作出貢獻。</p>\n<p>此番回應不僅文不對題，更顯示了其對國際氣候政治漠不關心、毫無基礎知識。不是查緝濫墾、廢棄物不重要，而是這個答案與國家自定減碳貢獻幾乎找不到關聯，甚至與他自己所提的排碳問題也都沒有直接相關。我們的候選領導人幾乎沒有能耐面對國家未來的整體方向，令人憂心。</p>\n<p>而宋楚瑜在回應此問題時，則是強調氣候變遷問題不僅是防災，更要防範未然地做好國土計畫，並舉李鴻源的書為例，說明已經做好準備。另外，他也指出應該要好好保護海洋、山林，透過教育與年輕世代溝通。</p>\n<p>這樣的答題看似洋洋灑灑、相當漂亮，實然與國家自定貢獻沒有絲毫關係。且這些題目是事先公布，候選人有充足的時間準備，並非臨場回答。如此文不對題的回應，不僅展現候選人的無知，更令人對其幕僚團隊的準備功夫打上大大的問號。到底是不會搜尋，還是刻意模糊答案？不管是哪一種，都只顯露其對於氣候議題的無知。</p>\n<p>而蔡英文抽中的題目是關於國家自定貢獻的規劃中，多元族群如何共同參與政策制定？她的回應較中規中矩，表示重視利害關係人，並舉了老車淘汰的司機族群做說明，強調讓利害關係人現身並敢於發聲是政府的職責。</p>\n<p>這樣的回應確實比另外兩位候選人好得多，但作為一個現職領導人，開放式的回應仍舊看不到在機制上如何設計，有什麼制度可以讓減碳目標規劃有更好的公共討論。且認真看蔡英文整體選戰中的政策，關於氣候變遷的項目也少之又少，如果蔡政府的政策主軸是要面對世界，而非被中國所掌控，那麼國際氣候政治這堂必修課，她得提出更多有價值的論述。</p>\n<p><h2>氣候變遷績效差，是評鑑誤差還是政策錯誤？</h2></p>\n<p>在這過程中，「氣候變遷績效全球倒數第三」這件事情好像不意外，雖然德國看守協會所做的評鑑有許多標準上、資料取得上的缺失，但台灣社會確實應該好好檢討，我們對於氣候變遷的減緩與調適是否有充足的認識，我們又做了多少貢獻？</p>\n<p>認真檢視該評鑑的幾項目標，由於看守協會期待世界各國可以在2050年達到100%的再生能源，所以諸多內容都是以此方向作為討論核心。</p>\n<p>IPCC（聯合國政府間氣候變遷小組）《全球升溫1.5°C特別報告》指出，若全球升溫幅度要控制在1.5°C內，2050年之前二氧化碳就必須達到淨零排放。也因此，報告中預測再生能源供給在2050年須上漲至70-85%。</p>\n<p>在此國際減碳發展路徑下，世界多國將減碳、再生能源發展目標接軌，設定2050年的能源配比目標。在2050年達到100%的再生能源不僅是德國看守協會的目標，也是人類社會為了永續生存的重要方向。</p>\n<p><h2>再生能源跟上腳步，但缺乏減碳管制工具</h2></p>\n<p>台灣再生能源建置的推動與目標，已逐漸跟上世界的腳步，但因為評比的數據是看兩年前的進展，當時正值政黨輪替，由過去視再生能源為丑角的馬政府，剛轉換到重視再生能源的蔡政府，百廢待舉的太陽能、風力發電設置正重新開始，所以數據並不漂亮。</p>\n<p>但若以今年跟去年做對比，台灣太陽光電的發電量倍數成長，此時再生能源的突飛猛進可能要到兩年後才會被評鑑所採納，也才足以呈現現在政府對於再生能源建置的改革決心。</p>\n<p>至於減碳績效，環保署引用數據與哈佛大學的研究來證明自己沒這麼差，這也是清楚的事實。但回頭看看各排碳大國已紛紛祭出能源稅、碳稅等機制來控制碳排，在未來能源配比上，台灣也僅有2025年設定的目標與實踐路徑。但在巴黎協定的脈絡下，世界各國相繼列出2030年甚至2050年的路徑與策略，我國卻沒有更具體的進程與方法，這些才是評比倒數之後，政府應該深切檢討的，而非拿著評比方法來證明自己沒這麼差。</p>\n<p><h2>擁核人士打壓再生能源，完全背離世界趨勢</h2></p>\n<p>另外，部分媒體與擁核人士藉此批評蔡政府的能源轉型，更是大大扭曲了CCPI評鑑的根本核心價值。CCPI期待排碳大國能夠盡力完成2050年100%再生能源的目標，這些擁核人士卻只不斷抨擊台灣再生能源不成熟、不穩定、不可行，根本與世界趨勢背道而馳。</p>\n<p>CCPI評鑑提醒台灣的溫室氣體減量還有許多待加強之處，也認為台灣政策落實度差，但並非否定現在2025年20%再生能源的目標，甚至應該更積極地促成再生能源發展，不僅是建置，更應該涵括能源開發的環境配套政策。請擁核人士莫再做井底之蛙，拖累台灣減碳的決心。</p>\n<p>回過頭來，台灣的總統候選人們，應該如何更努力地跟上世界的腳步，為氣候變遷的減緩與調適多盡一份心力呢？</p>\n<p>地球公民基金會在12月初提出了台灣面對氣候變遷的五大減碳方案，是一個務實且應該認真實踐的方向：<br>\n<p>一、台灣必須訂出2025年到2050年間的能源轉型路徑及執行方案。<br></p>\n<p>二、各政黨應承諾儘速推動課徵「能源稅或碳稅」，秉持污染者付費精神，讓排碳者負擔代價，以加速減碳進程。全體國營事業都應將氣候變遷訂為績效目標，逐年檢討達成進度。<br></p>\n<p>三、強化中南部減煤、鍋爐更換、污染排放大戶減量。<br></p>\n<p>四、全國應制訂交通運具全面電動化期程，針對空污嚴重的中南部縣市，政府應加碼提高電動汽機車補助方案，加速電動化。<br></p>\n<p>五、將能源民主與公正轉型價值導入氣候政策，減少環境社會衝擊。</p></p>\n<p>台灣的空污問題不是一時半刻造成的，但近五年來社會才開始重視，甚至成為政治攻防的主軸。雖然數據上看見PM2.5當量是在緩步減少污染的，但大眾仍然不滿意，我們總要等到大難不僅臨頭而是真實造成身體的影響後，才大力要求改善。</p>\n<p>同樣地，氣候變遷問題對於島國台灣來說，我們不僅是人均碳排大國，更是潛在受災的第一線。越來越劇烈的異常氣候、不斷因海平面上升而被侵蝕的海岸早已發生在生活周遭，倘若到時才開始意識，才開始要求政府快速改善，都很難立馬成真。</p>\n<p>所以，就從要求總統、立委候選人提出氣候政見開始，讓我們認真要求掌權者，必須對台灣的未來負責，不能再繼續對國際氣候政治無知，必須務實提出政策與方向；更不能因為對手無知而不好好面對民間社會的問題與質疑。縱使政策不同，都可以針對議題來討論，而不是繼續打模糊仗，不交出一份可執行與討論氣候政見。</p>\n<p>&nbsp;</p>\n<p>（本文為2019/12/24&nbsp;鳴人堂投書：<a href=\"https://opinion.udn.com/opinion/story/7854/4245908\">氣候變遷緊急狀態，台灣總統候選人政策「揮空拳」？</a>）</p>\n<p>&nbsp;</p>"}, {"nid": 3649, "title": "期待連任的蔡英文，尋回「在野民進黨」環境前瞻改革的初心", "original_topic": "山林水土;環境污染;能源轉型", "adopted_cats": ["氣候變遷與調適", "完善能源政策"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/20200116-5.jpg\"><span>（右圖為munch攝）</span></p>\n<p>2020總統大選被定調為「抗中保台」之戰，使得各組候選人幾乎沒有內政的討論，很遺憾，環境政策更是被邊緣化到幾乎消失，《礦業法》正是其中的指標。</p>\n<p>選前，地球公民基金會在蔡英文競總成立大會時，從辦公室垂掛了大布條，用大聲公干擾會場，試圖提醒民進黨在立院最後的會議要處理《礦業法》，曾引發「迷因力量」Facebook粉絲專頁的抹紅抹藍，地球公民流失一些支持者，被檢討最多的是「抗議時機不對」。</p>\n<p>但是事實是，只要中國霸權存在一天，台灣就會持續面臨主權危機。環境運動的挑戰是：如何讓群眾在思考如何守護民主時，能不忘對執政者的監督；也不該在選舉的時候讓重要內政問題完全邊緣化，這是台灣社會共同的挑戰。</p>\n<p>2020大選，蔡英文總統取得破紀錄817萬張選票的支持，但民進黨的政黨票卻僅得到481萬，較上次大選下降10個百分點，這表示人民對民進黨的執政成績滿意度並不高，把選票給了小黨要制衡監督民進黨。</p>\n<p>還記得，2016年小英總統就職時宣誓「謙卑再謙卑」，當年林全院長上台時，找了社運團體在行政院下午茶，但這樣的對話僅此一次，之後從賴清德院長和蘇貞昌院長上台，再也沒有試圖建立和公民團體對話的努力。民進黨在2020大選的選票基礎下，應重新釋出和社會商討的空間，以爭取公民社會的支持。</p>\n<p><h2>能源與工業轉型，要繼續深化</h2></p>\n<p>參與環保運動這20多年間，歷經3次政黨輪替，筆者觀察台灣最大的環境爭議，始終圍繞著大型石化、煉鋼廠開發，科學園區的擴張，以及伴隨著工業用電的需求新設「燃煤電廠」，以及開發水庫因應新增用水。</p>\n<p>高汙染、高耗能工業的擴張，不僅碳排放失控成長，也帶來了更多汙染、讓環境與物種保育受到威脅，20年來指標物種是黑面琵鷺、白海豚、八色鳥等。</p>\n<p>幸而，民間團體發起一波又一波的環保運動，減緩了台灣環境惡化的速度，也保留了新產業的空間註一。舉例來說，若不是當年當年成功的阻止燁聯集團在七股開發大煉鋼廠和石化廠，保留了台南的水資源調配空間，防止進一步劣化空氣品質，台積電將難以在南科立足。</p>\n<p><h2>空汙治理和能源轉型，勢必更緊密連結</h2></p>\n<p>2016蔡英文總統上台，提出了非核減煤、提高再生能源和天然氣的電力轉型目標，工業政策上沒有再提出石化、煉鋼等高汙染高耗能的新案，同時標舉了「循環經濟」列入了5+2的政策，這是一條和國民黨不同的能源產業路線，我認為是很大的環境進步。</p>\n<p>但是，民進黨的電力轉型只規劃到2025年，溫室氣體減量推動方案也只到2020年，而2018年淨溫室氣體排放量已較2005年成長8％，使得2020年第一階段減排目標恐已無法達標。</p>\n<p>蔡總統2020年連任後，必須採取更積極的能源轉型策略，擘劃2025年至2050年除煤減氣的電力轉型期程，對接第二階段溫室氣體減量方案及各部門減碳路徑與執行方案，並建立中央與地方政府、官方與民間合作的治理平台。</p>\n<p>而課徵「能源稅或碳稅」，秉持汙染者付費精神，讓排碳者負擔代價，將是讓台灣加速擺脫高耗能、高排碳的產業結構，促進台灣經濟新動能，同時達到減碳目標的重要工具。</p>\n<p>同時，必須把空汙治理和能源轉型深度連結，落實14+N空氣汙染防制策略，汙染排放大戶減量，提出車輛電動化的具體時程，將能源民主與公正轉型價值導入氣候政策；太陽光電應以屋頂型為主，地面型要加強社會、環境的相關檢核機制。</p>\n<p><img alt=\"20200116-4.jpg\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20200116-4.jpg\"><span>地球公民在選前召開記者會，要求各大政黨對氣候變遷提出政策。</span></p>\n<p><h2>面對台商回流，環境負荷應審慎考量</h2></p>\n<p>在美中貿易戰下，大量台商回流帶來的新投資，政府宣稱台商回流投資已達7,000億，當多數民眾和經濟部在欣喜台商回流時，必須嚴肅面對土地、水、電力、廢棄物等攸關環境承載量的課題。</p>\n<p>經濟部和科技部除了盤點既有工業區，也正規劃新的產業園區，使用台糖土地總計將達上千公頃。但是，新的工業區的開發面積約在70～270公頃之間，如此大面積的工業區開發，一定要經過環評，甚至二階環評，這些區位選擇未必合理，大面積的農地流失是不可逆的環境劣化，如果遇到爭議，動輒數年都還不能解決。</p>\n<p>就時效和環境等因素，經濟部應優先努力清查既有工業區閒置的土地，開發新工業區不應如此急就章的推出。</p>\n<p>其次，水利署雖然宣稱落實開源、節流、調度及備援等4大策略，積極辦理各項水資源建設管理工作，2018～2019年陸續完成可增加水源每日100萬噸，可確保全台各縣巿產業用水。但是，必須提醒，在台灣有限的水資源條件下，水利署必須從供水單位轉為水的管理保育機關，「以供定需」，而非任由經濟發展部門予取矛求，否則將會持續加重開發新水源的壓力，造成環境破壞且徒增社會矛盾。</p>\n<p>再者，工業廢棄物處理始終是政府不願面對的爛攤子和現在進行式，有毒廢棄物非法棄置到農地、海岸、河川，即使被查獲不法，大都沒有清理。根據《商業周刊》的報導指出：台灣事業廢棄物囤積量創新高，3年暴增137％，掩埋場容量僅剩餘9.9％，焚化爐未來5年要整建14座，垃圾燒不完，而58％回流的台商，近5年曾有汙染紀錄。</p>\n<p>台灣要認真思考：小小的島嶼實在難以承載這麼多的「線性經濟」的製造業，走向「循環經濟」是不得不走的路，台商回流本就不該照單全收，只管提供廉價的水、電、土地和人力，而是以循環經濟為原則，樹立起新的產業規範，篩選出符合永續發展的企業，創造出新經濟的動能。</p>\n<p><img alt=\"20200117-1.JPG\" src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u355/20200117-1.JPG\"></p>\n<p><h2>農地保衛戰，是改革決心的指標</h2></p>\n<p>猶記2016年蔡總統當選前後，多次造訪彰化頂番婆水五金違章工廠聚落，並拋出串珍珠、田園式生產聚落、小型產業園區要來解決違章工廠問題。</p>\n<p>隨後，更提出了520之後新增建違章工廠即報即拆的政策，一再宣示了整頓「農地違章工廠」的決心。即報即拆雖然只拆了16間，但發揮了嚇阻作用，民間團體根據稅籍資料推估，2016年以前，違章工廠年增6,000多家違章工廠，2016年之後年增約3,000家，減少一半。這執政者態度和決心的重性，更證明處理違章工廠並非不可為。</p>\n<p>接著，行政院提出了《工廠管理輔導法》修正版本，把520後即報即拆、中高汙染遷廠、關廠入法；低汙染工廠全面納管、清查都入法，這些是正面的；但是，令人遺憾的是，法案中幾乎是全面就地合法的輔導方案，沒有落日時間。修法過程民間團體提出5大修正訴求，在龐大的社會壓力下，民進黨也僅勉強接受20年落日的條款。</p>\n<p>全台農地違章工廠高達13萬家，在選區立委、縣市長的壓力下，民進黨能否落實2016年520前即報即拆，將會是蔡英文總統展現改革意志的重要指標。</p>\n<p>在此同時，目前各縣市的公告的國土計畫草案，10萬公頃的農地極可能在這波國土計畫中消失！原因在於，中央政府並沒有在全國國土計畫中，明確提出「農地總量和分配量」，以及相關的配套政策。再者，擁有大面積農地的農業縣市，不滿於都會型縣市的土地可以變更為住商、工業儲備用地，而農業縣市卻要負擔大部分農地保留的責任。</p>\n<p>解決之道，是重新制定合理的財稅制度，提供農業縣市保留農地的誘因，以達成台灣糧食自給率40%的國家目標！這將會考驗民進黨中央與地方諸候的關係，蔡政府是否願意或有能力處理，將攸關國土計畫的成敗。</p>\n<p><h2>蔡英文第二任期，將如何改善環境政策？</h2></p>\n<p>以2020大選結果來看，2018民進黨縣市長選舉和公投的挫敗對台灣可能是好事。</p>\n<p>2018的公投，保守勢力結合國民黨大反撲，各種抹黑假消息擴散，但民進黨政府和縣市長候選人不僅沒有正面迎戰，反而冷處理，這樣的選戰策略導致了公投結果的大挫敗。</p>\n<p>由於始料未及的挫敗才喚醒了民進黨，開始調整群眾溝通的策略，通過了同婚法案，樹立了進步價值的形象，加上對香港反送中運動的聲援，踩穩了國家主權立場，才一步步扭轉了劣勢。</p>\n<p>雖然蔡英文總統取得破紀錄817萬張選票的支持，但政黨票卻僅得到481萬，顯示人民對民進黨的執政成績滿意度並不高。民進黨在這樣的選票基礎下，應具有反省能力。</p>\n<p>在討論《礦業法》的過程中，一位熟識多年的民進黨資深幕僚自承，同樣的議題，如果民進黨在野早就戰翻通過了，執政後反而包袱很多。事實上，在民進黨的二次執政期間，台灣再也沒有夠格有力的在野黨了。</p>\n<p>國民黨愈來愈走向極端保守和反動，擁核反再生能源，提出更糟的違章工廠合法化法案，環保團體幾乎找不到國民黨可以合作的立委。我們可以期待時代力量的3席立委、民眾黨的5席立委嗎？</p>\n<p>這就是民進黨時刻來臨時，環境運動所面對的政治現實。</p>\n<p><h2>新國會有機會成立跨黨派「氣候聯盟」嗎？</h2></p>\n<p>1997年京都議題書通過後，1998年立法院的跨黨派立委成立了 「立法院永續發展促進會」註二，並推趙永清（國）擔任第一屆召集人、柯建銘（民）為執行長。直到2008年，國民黨要求黨籍立委不得參加次級團體，永續會才停止運作。10年當中，永續會成為跨黨派立委合作關注環境議題的平台，也和環境團體形成有效的策略聯盟，國會助理和環境團體工作者相互協力，促進環境法案和政策的前進。2016第九屆立委大換血，試圖重新運作，但並未發揮功能。</p>\n<p>2020的新國會，是否有機會出現跨黨派有行動力的「氣候聯盟」，推動環境的法案和政策，或許可以借鏡那10年間的「立法院永續發展促進會」。而歸零的《礦業法》，民進黨是否主動提案出礦業法版本？或者繼續消極面對？這將會民進黨二度完全執政和新國會的環境政策指標。</p>\n<p>&nbsp;</p>\n<p>（本文為2020/01/15&nbsp;報導者投書：<a href=\"https://www.twreporter.org/a/opinion-2020-election-environmental-suggestion\">李根政／期待連任的蔡英文，尋回「在野民進黨」環境前瞻改革的初心</a>）</p>\n<p><hr></p>\n<p>註一：這些在國民黨的二次執政，以及民進黨第一次執政推動的開發案，包括了七輕、八輕、國光石化、台塑煉鋼廠；彰工燃煤、大林燃煤電廠；美濃水庫、湖山水庫；中科三期和四期等。</p>\n<p>註二：1998年3月24日，由王拓、朱惠良、林忠正、丘垂貞、洪奇昌、范巽綠、翁金珠、陳文輝、陳永興、陳光復、黃國鐘、葉菊蘭、劉進興、蔡正揚、蕭裕珍、錢達、謝欽宗、蘇煥智等立法委員發起的立法院永續發展促進會宣布成立，並推趙永清擔任第一屆召集人、柯建銘為執行長。</p>\n<p>資料來源：謝志誠、蘇煥智，2006。《黑面琵鷺的鄉愁》續篇，〈<a href=\"http://www.taiwan921.lib.ntu.edu.tw/mypdf/bkfaceG.pdf\">能源與水議題發酵：1997～1998</a>〉。</p>\n<p>&nbsp;</p>"}, {"nid": 3749, "title": "【講座紀錄】電動車真的比較環保嗎？（上）", "original_topic": "空氣污染;抗暖減碳", "adopted_cats": ["氣候變遷與調適"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713-25.png\"></p>\n<p></p>\n<p><p dir=\"ltr\"><span>空氣污染一直是地球公民基金會高度關注的環境議題，過往我們將火力集中於監督與檢討大型固定污染源如電廠與重工業工廠，然而，要徹底解決日益嚴重的空氣污染，必然也要處理移動污染源。事實上，蔡中岳副執行長於講座開場提到，交通部門對空氣污染貢獻高達三分之一，而要處理交通端的污染問題，除了鼓勵大眾運輸之外，便是要鼓勵民眾汰換私有運具，將原有的燃油運具汰換為電動運具。</span></p></p>\n<p><p dir=\"ltr\"><span>然而，在推動運具電動化的同時，政府在政策上似乎有些搖擺，民間與業者也有部分反動聲浪，甚至質疑電動車是否真的比較環保。地球公民基金會長期作為促進社會溝通的橋樑，決定舉辦本次講座，邀請到了台大風險社會與政策研究中心博士後研究員趙家緯博士，以及Gogoro行銷總監陳陳總監來分享他們的看法，以數據理性討論電動車是否真的比較環保，以及我們在政策上應該如何推進運具電動化。</span></p></p>\n<p>\t----------------------------------------------------------------------------------------------------</p>\n<p><div dir=\"ltr\">破解油電平權&nbsp;(趙家緯/台大風險社會與政策研究中心博士後研究員&nbsp;)<br></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%281%29_0.JPG\"><br></p>\n<p>講座一開場，趙家緯博士（以下簡稱趙博士）便表達他對轉型的深厚期許，他認為運具從油轉電並不僅只是一個產品的更替而已，這關乎到我們要如何面對氣候變遷與空氣污染，以及我們想要一個什麼樣的未來。趙博士將簡報標題取名為「破解油電平權」，便是要回應自去年開始，部分燃油機車業者所提出的口號「油電平權」（編按：意思是說最新的七期燃油機車也很環保，政府必須給予和電動機車相同的購車補助），他認為這個口號本質就是一種反動的修辭，就像2018年公投有所謂的「以核養綠」，或是民主運動常常被批評的「民主會危害經濟」等反動修辭。</p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%282%29.JPG\">趙博士將從三個部分釐清大眾對油車和電車的疑問，第一部分是說明燃油機車對環境到底有多「機車」，第二是電動機車是否真的比較環保嗎，第三則是政策上要如何推翻油車霸權。但他也澄清，雖然本身是Gogoro車主，並不會無條件挺業者，反而很在意Gogoro是否有做好資訊揭露，讓民眾了解環境面相的資訊，例如碳足跡的資訊揭露。</p>\n<p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%284%29.JPG\"></p></div></p>\n<p><div dir=\"ltr\"></p>\n<p><p dir=\"ltr\">1-1燃油運具的空污、碳排與綜合外部成本<br></p>\n<p>趙博士引用環保署最新的資料，顯示交通部門貢獻了台灣三分之一的空氣污染，其中，機車占比雖然只有4%，但是在空污重災區的高屏以及中部空品區，機車的空污貢獻相對更高。在碳排的部分，燃油機車的總排碳量佔台灣排碳量的2%左右，好像不是很多，但如果我們看 2015年到2018年的排碳趨勢，機車的排放量卻增加了超過40萬噸，反而是小客車、大客車的排放量在削減中，這代表我們必須好好因應機車這個碳排成長源。若我們再將空污和排碳的影響整合在一起，去計算運具所產生的外部成本，根據國際貨幣基金會2015年的報告，台灣因為使用燃油運具一年對外部成本的補貼超過110億美元(3000多億台幣)，也就是平均每人每年為了燃油運具所負擔的環境外部成本約為16000元以上。&nbsp;</p></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%287%29.JPG\"></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%288%29.JPG\"></p>\n<p></p>\n<p><p dir=\"ltr\">1-2 翻轉以油為本的交通系統<br></p>\n<p>面對如此巨大的環境外部成本，到底要如何翻轉以油為本的交通系統呢？趙博士引用國際常用的三個手段，第一個是迴避，直接減少我們對於運輸的需求，例如今天的線上講座就讓大家不需出門。第二個是移轉，如果我們真的有出門的需求，就改搭公共運輸。第三個才是改善，將運具效能提升，例如將運具從燃油運具改成電動運具。台灣也依照此原則提出一系列的規劃，包含發展公共運輸、綠色運輸網絡系統、提升運輸系統及運具效能等三大策略，但是相較於國際作法，台灣還欠缺了減少旅次需求的政策。最可惜的就是，我們曾經強而有力的訂定了禁售燃油汽機車的政策目標，但是這個目標卻在去年被下架了。(編按: 2017年12月，當時的行政院賴清德宣佈了全台禁售燃油車的政策目標，即2035年禁售燃油機車、2040年禁售燃油汽車，但是去年蘇貞昌院長將這個政策目標移除。)</p></p>\n<p>\t\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%289%29.JPG\"><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%2810%29.JPG\"></p>\n<p><p dir=\"ltr\"><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%2811%29.JPG\"></p></p>\n<p><p dir=\"ltr\">2-1電動運具真的環保嗎？<br></p>\n<p>趙博士藉著一幅諷刺漫畫，帶我們回到前行政院賴院長宣佈禁售燃油車目標的當下，這幅漫畫正是在諷刺電動車是假環保，大家批評電動機車的電是從火力發電來的，所以改騎電動車就好比改燒乾淨的煤(編按: 賴院長當時也在推動深澳電廠，並聲稱深澳電廠所燒的都是所謂乾淨的煤)。</p></p>\n<p><p dir=\"ltr\">然而這樣的討論並不是唯獨台灣所有，全世界都在討論這個議題，該年二月世界各大媒體都刊載了一份英國的知名研究，該研究分析到底在何種情況下，電動汽車會比燃油汽車環保。研究結果顯示，當你所處的國家每發一度電的碳排量低於750克以下，電動車的碳足跡就會比燃油車來的低，令人驚訝的是，全世界有95 %以上的地方都符合此條件，最重要的是，這份研究也有包含台灣，它發現台灣電動汽車每公里的碳足跡比燃油汽車少三成左右，再者，當我們進一步提升再生能源發電占比，2030年兩者的每公里碳足跡差距甚至高達一半以上。</p></p>\n<p>\t\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%2812%29.JPG\"><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%2813%29.JPG\"></p>\n<p><p dir=\"ltr\"><strong>2-2燃油機車與電動機車空氣污染比較</strong></p></p>\n<p><p dir=\"ltr\">除了上述的碳排差距，若我們轉而檢視空氣污染，比較電動機車和燃油機車的空污排放量(編按: 電動機車並無尾氣排放，其空氣污染排放指的是因為用電而間接造成的污染，因此其污染量與國家整體發電結構有連動關係。) 根據環保署的委外計畫，很明顯看到電動機車的污染排放少於燃油機車。更重要的是，這份研究引用的是2017年的資料，也就是用2017年的發電結構來計算電動機車所產生的空污，但是目前燃煤發電的佔比急速減少，像是今年台電系統的燃煤發電佔比有機會低於燃氣發電佔比，加上台電的燃煤電廠做了很多汰換與更新措施，因此結論可想而知，電動機車的優勢只會越來越明顯。</p></p>\n<p>\t\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%2814%29.JPG\"></p>\n<p><p dir=\"ltr\"></p></p>\n<p><div dir=\"ltr\"><strong>2-3 運具電動化會不會讓台灣缺電？</strong><br></p>\n<p>雖然電動機車在碳排和空污的表現上皆優於燃油機車，但是當民眾聽到政府要推行運具全面電動化時，不免開始害怕是否會缺電？對此，趙博士早就做了估算，若以最極端的情形，在一夕之間把台灣除了大貨車以外其他的燃油運具全部電動化，需要增加的用電量約為192億度，大概是2019年用電量的7 %，若單就機車進行電動化則會增加17億度。而這192 億度等同於需要增加15GW的太陽光電或是5.3GW的離岸風電，不過，台灣到2035年預估會再增加10GW的離岸風力，即可提供運具電動化所需要的能源而不會讓台灣缺電。&nbsp;</p>\n<p>\t\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%2815%29.JPG\"><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%2816%29.JPG\"><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%2817%29.JPG\"></p></div>\n<p><div dir=\"ltr\">&nbsp;</div></p>\n<p><div dir=\"ltr\"></p>\n<p><div dir=\"ltr\"><strong>3-1翻轉油車霸權</strong></div></p>\n<p><div dir=\"ltr\">最後，趙博士轉向政策面的討論，評析台灣未來應該設定那些運具電動化目標，才能因應氣候變遷以及達到國家設定的空氣品質標準。談及台灣的未來，趙博士再三提醒政府及人民，我們在運具電動化的進程上不應該有任何退卻。</div></p>\n<p><div>&nbsp;</div></p>\n<p><div dir=\"ltr\">趙博士無奈地提到，2017年當賴院長提出禁售燃油車的政策目標時，其實是東亞第一個提出此目標的國家，在國際上備受矚目，很可惜的是這個目標後來被移除了。但稍稍令人欣慰的是，2019年年底新售機車的電動機車佔比已經將近19%了，算是達到了當初設定的第一個階段性目標(編按:政府為了達到2035年禁售燃油機車這個大目標，訂出了許多階段性目標，例如第一個階段目標是2020年新售機車的電動機車佔比要達到20%。) 這代表我們的市場已經成熟了，即使政策目標後來被拿掉了，我們還是可以比原本的階段性目標走得更積極、更遠。&nbsp;</div></p>\n<p><div>&nbsp;</div></p>\n<p><div dir=\"ltr\">另一方面，即便這個政策目標被拿掉後，難道台灣就沒有運具電動化的目標了嗎？其實不是的，趙博士翻出台灣永續發展目標，其中明訂2030年新能源機車佔新售機車比率為35%，他解釋，即便這個比率相對於2017年所提出的目標是折半的，我們還是應該思考如何達標。在碳排部分，台灣永續發展目標規定運輸部門在2025年要比2005年減少10%排碳量，在空污部分，則是2030年的PM2.5年均濃度要降到12毫克每立方，去年年底平均是17到18左右，其中，汽機車的NMHC(編按: 非甲烷類碳氫化合物，常作為揮發性有機物指標)排放量要減少10%以上。</p>\n<p>\t\t\t趙博士估算，在空污部分，汽機車的減量貢獻要高達3成才有機會達到空污減量目標。在碳排方面，機車到2025年要減碳155萬噸，若要以運具電動化來減量，到時候全台灣就必須有500萬輛以上的電動機車(編按: 台灣現在有1400萬輛左右台機車)，代表2025年每3台機車需要至少有1台是電動機車，也代表接下來幾年的新售機車至少要有7成以上是電動機車才可以。<br>\n<p>汽車的部分，台灣如果分別要達到法定減碳目標和碳中和目標，2050年分別要有一半或八成以上的汽車為電動汽車，後者代表最晚在2040年必須要禁售燃油汽車。&nbsp;</p></p>\n<p>\t\t\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%2818%29.JPG\"><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%2819%29.JPG\"></p></div>\n<p><div dir=\"ltr\"><strong>3-2燃油車外部成本隱而未顯</strong><br></p>\n<p>談完政策應該如何推行，趙博士接著討論民意是否足夠支撐政策。他引用台大風險中心在今年五月發布的一份民調，結果顯示有45%的民眾對禁售燃油車的目標傾向支持、有43%的民眾傾向不支持，差距有限。令人更意外的是，年輕人和空污重災區如高屏地區民眾傾向不支持的比率反而是高的，這代表著，過往並沒有好好與民眾溝通環境外部成本的問題。<br></p>\n<p>另外，根據交通部的調查，電動機車騎士每月平均付出的充電費用高於燃油機車騎士所付出的油價，趙博士批評，這其實是非常不合理的，這代表油價根本無法反映外部成本。對於部分燃油車業者抱怨購車補助只給電車是不公平的，趙博士沉重地說，其實我們都不斷地在用健保費、用未來的預算去補貼油車所造成的外部成本，以至於這些外部成本隱而未顯，這才是更不公平的。但另一方面，趙博士欣慰地表示，民調結果也顯示，其實台灣民眾對於提高油價、徵收碳稅等等為排碳行為付費的接受度是很高的。&nbsp;</p>\n<p>\t\t\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%2820%29.JPG\"><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713%20%2821%29.JPG\"><strong>切莫重回舊常態</strong><br>\n<p>趙博士的演講進入尾聲，最後，他以疫情帶給我們的反思作結。因為疫情，各地減少許多工程以及私人運具使用，空氣品質反而變好了。同時也有研究指出PM2.5濃度每增加1毫克每立方，染上新冠肺炎的機率就增加15%。因此，許多城市都驚覺，疫情後不可再允許空污增加，進而提出了人本交通的城市規劃，推出包含劃設無車區、提高塞車稅、撥預算興建腳踏車道等等政策。趙博士提醒我們，這些規劃就是下一階段台灣政府推動振興要去思考的事情，我們不能只是活在防疫世界第一的光環下，而忽略我們如何從疫情重新思考、重建一個更好的未來，不該回到舊的常態、不該持續仰賴讓我們付出了很多外部成本的油本交通！</p></p>\n<p>\n<p>完整演講資訊請上：<a href=\"https://www.cet-taiwan.org/events/3718\">5/26電動車真的比較環保嗎？</a><br></p>\n<p>此篇（下）文請上：<a href=\"https://www.cet-taiwan.org/info/story/3750\">【講座紀錄】電動車真的比較環保嗎？（下）​</a></p></div></p>\n<p><div>&nbsp;</div></p>\n<p></div></p>\n<p></div></p>\n<p><div>&nbsp;</div></p>"}, {"nid": 3750, "title": "【講座紀錄】電動車真的比較環保嗎？（下）", "original_topic": "空氣污染;抗暖減碳", "adopted_cats": ["爭取乾淨空氣", "氣候變遷與調適"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713-25_0.png\"></p>\n<p></p>\n<p><p dir=\"ltr\"><span>空氣污染一直是地球公民基金會高度關注的環境議題，過往我們將火力集中於監督與檢討大型固定污染源如電廠與重工業工廠，然而，要徹底解決日益嚴重的空氣污染，必然也要處理移動污染源。事實上，蔡中岳副執行長於講座開場提到，交通部門對空氣污染貢獻高達三分之一，而要處理交通端的污染問題，除了鼓勵大眾運輸之外，便是要鼓勵民眾汰換私有運具，將原有的燃油運具汰換為電動運具。</span></p></p>\n<p><p dir=\"ltr\"><span>然而，在推動運具電動化的同時，政府在政策上似乎有些搖擺，民間與業者也有部分反動聲浪，甚至質疑電動車是否真的比較環保。地球公民基金會長期作為促進社會溝通的橋樑，決定舉辦本次講座，邀請到了台大風險社會與政策研究中心博士後研究員趙家緯博士，以及Gogoro行銷總監陳陳總監來分享他們的看法，以數據理性討論電動車是否真的比較環保，以及我們在政策上應該如何推進運具電動化。</span></p></p>\n<p>\t-------------------------------------------------------------------------------------</p>\n<p><p dir=\"ltr\">一個購車決定將影響環境二十年</p></p>\n<p>\t聽完趙博士對燃油機車、電動機車外部成本的比較，以及對台灣運具電動化政策的期許，接著，由Gogoro行銷總監陳彥揚（以下簡稱陳總監）跟我們分享業界如何看待電動車產業發展。<br>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713-30%20%281%29.JPG\">陳總監首先呼應趙博士對於疫情的看法，疫情後應該是我們重新思考人與環境關係的轉機，也因此，陳總監提到這次講座不是在推銷Gogoro，而是希望促進大家思考，在運具轉型的過程中，我們如何做出對環境較好的選擇，因為每個購車決定都將影響環境十到二十年。</p></p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713-30%20%286%29.JPG\"><br>\n<strong>&nbsp;1-1 選擇節能產品</strong><br>\n<p>面對汽機車貢獻了全台灣四分之一的PM2.5的污染事實，我們要如何去改善呢？陳總監認為應該是透過選擇更節能的產品，不只降低車輛碳排，同時減少空氣污染。雖然有許多民眾認為電動機車的動力是透過電力層層轉換，能源效率可能較差，但事實上，電動機車能源效率是高於然油機車的。</p></p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713-30%20%2812%29_0.JPG\"></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><p dir=\"ltr\">&nbsp;</p></p>\n<p><strong>1-2 電動機車的能源效率</strong><br>\n<p>陳總監舉例，同樣使用一公升汽油，燃油機車只能行駛約38公里，若把油拿去發電，雖然經過燃燒發電、電網配送、電池充電，最後才是電力帶動馬達，但事實上它可以讓你行駛85公里。</p></p>\n<p>也有民眾質疑，電動運具化是否會讓台灣缺電，其實電動機車也是非常省電的，陳總監解釋，其實騎乘一天的電動機車相當於電鍋煮飯一小時或每天洗熱水澡的用電量。而機車全面電動化需增加的用電量僅是全台用電量的1.2%(編按: 趙博士的估計為0.7%)，並不至於讓台灣缺電。<br>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713-30%20%2823%29_0.JPG\"></p></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713-30%20%2824%29_0.JPG\"></p>\n<p><strong>1-3 電池交換站做為儲能裝置</strong><br>\n<p>更重要的是，Gogoro在全台灣建設了一千多個電池交換站，除了讓消費者方便換電池，它本身就是一個電池儲能裝置，可以協助台灣用電離峰尖峰之間的電力調度。例如：對台電而言，白天是用電高峰期，但對Gogoro而言，晚上睡覺時間才是用電尖峰，因為必須在民眾晚上睡覺時趕快把電充滿，白天才可以把電池給民眾使用。所以很重要的是，電動機車使用的電其實是離鋒期的電力，它其實不會對台灣電力基載產生額外的負擔。</p></p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713-30%20%2833%29.JPG\"><br>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713-30%20%2834%29.JPG\"></p></p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713-30%20%2836%29.JPG\"></p>\n<p><strong>2-1 燃油機車空氣污染與汽車相當</strong><br>\n<p>接著，陳總監提到空氣污染的面向。他說有許多民眾質疑電動機車是不是假環保？不可否認的是電動機車也會對環境造成負荷，但應該注意的是比例多寡的問題，事實上，電動機車相較於燃油機車大幅減少有毒物質的排放。陳總監拿出環保署的資料，說明即便是最新的七期燃油機車，空氣污染排放量可能和一台汽車相當，代表燃油機車對環境的負荷是相對大的，而再對比電動機車因為用電而產生的空氣污染量，就可以發現電動機車確實是比較乾淨的選擇，甚至，台電宣示在2030年的時候更要減量50%的發電污染，屆時電動機車將更加環保。</p></p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713-30%20%2840%29.JPG\"></p>\n<p><strong>3-1 歐亞多國皆宣示禁售燃油車目標年</strong><br>\n<p>從上面的比較，我們了解電動機車相對於燃油機車是比較節能、乾淨的產品，而全世界許多國家也都認知到這件事情，而積極發展電動車產業，除了台灣曾經做過禁售燃油車的政策宣示以外，包含挪威、中國、丹麥、荷蘭、印度、法國、越南、英國，不只歐洲國家，連很多的亞洲國家都有類似的宣示。</p></p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713-30%20%2842%29.JPG\"></p>\n<p><strong>3-2 台灣可以成為世界電動機車產業領頭羊</strong></p>\n<p>全世界的電動車產業正在快速成長，不管是電動車還是油電混合車都在快速取代燃油車輛，陳總監也提醒，我們要思考的是，把台灣市場做好之後，如何走向海外市場，抓緊這個台灣產業輸出國際的重要機會。</p>\n<p>而放眼世界各國的電動車品牌，除了大家熟知的Tesla，還有許多新創品牌如RIVIAN、POLESTAR，甚至老牌的日本國民車廠牌TOYOTA、三菱、NISSAN，或歐洲高級車廠牌如BMW、Benz或Volvo都跳進來做宣示電動化目標，那我們要問的是，台灣的燃油車大廠是不是也願意承諾往電車的方向發展呢？</p>\n<p>聽完趙博士與陳總監的分享，接著由地球公民基金會李根政執行長（以下簡稱李執行長）說明，為什麼地球公民作為一個環境組織，除了倡議節制私有運具、鼓勵大眾運輸之外，還要特別談運具電動化？</p>\n<p>\t促進運具電動化的公共討論</p>\n<p>&nbsp;</p>\n<p>李執行長笑說，作為關心空氣污染的環境團體，專打固定污染源，而不去觸及移動污染源是很奇怪的事情。為什麼呢？<br>\n<p>第一個，跟一般民眾最接近的空氣污染源其實就是汽機車，汽機車的空氣污染對行人、路旁住戶甚至機車騎士本身的健康傷害都是很直接的。<br></p>\n<p>第二，作為倡議團體，我們不會在爭議中退縮，更應該成為促進公共討論的平台。根政堅定地說道，我們當然知道處理移動污染源的議題會碰觸到大眾的直接利益，典型的例子即是前陣子政府推動汰換老舊柴油大貨車，遭到貨車司機因為怕生計被影響而反抗。但是疫情讓我們發現，確實減少運具使用讓空氣變乾淨了，我們更應該好好檢討移動污染源的問題。<br></p>\n<p>第三，除了台北之外，其他地區的民眾還是很難不仰賴機車作為日常生活中最主要的運具，根政以自己為例，過去長年騎腳踏車上班的他，在辦公室搬家後，曾嘗試以腳踏車搭配公車通勤，然而幾個月下來，還是苦於通勤時間過長，最後買了電動機車，每天節省將近一小時的通勤時間。他無奈的說，相信許多民眾也跟他一樣，很想要環保，但礙於大眾運輸不見得在每個地區都如此方便，機車是個不可不然的選擇。因此，作為環保團體，當然不可能整天只談大眾運輸，必須同時促成運具電動化的公共討論。</p></p>\n<p>接著，李執行長總結了這次講座的幾個重點。首先，即便趙博士和陳總監提出的數據有差異，但至少趨勢是很明顯的，也就是燃油車再怎麼樣都不可能比電動車環保。再者，兩位的數據也顯示全面電動化並不會讓台灣缺電。另外，台灣數千個電池交換站本身即是大型儲能系統，若能把握夜晚用電離峰時間充電，甚至是將電力回饋到電網，抑制台灣夏季中午的用電尖峰，對於台灣電力的穩定會有很大的幫助。</p>\n<p>\n<strong>電動機車生命週期的整體污染盤點</strong><br>\n<p>接下來，李執行長提出生命週期與循環經濟的概念，期許業者也應該盤點產品的製程與廢棄是否對環境造成污染，畢竟這次的講座只集中於討論機車使用過程所造成的污染，根政認為，如果要談一輛機車是否真的環保，一定要考慮整體生命周期包含製程、使用與廢棄過程的污染排放，就如同大家會討論太陽能板的製程與回收問題。</p></p>\n<p>\t<strong>「油電平權」是糟糕的話術</strong><br>\n<p>李執行長也重申了舉辦本次講座的初衷，並不是為了宣傳Gogoro，而是機車議題在台灣是不可忽視的公共議題，也因為Gogoro是目前相對顯著的品牌，希望藉由邀請業者與談可以增進民眾對此議題的關注與理解。</p></p>\n<p>最後，呼應趙博士提到的油本交通，根政說許多環境議題的產生，就是因為我們過度仰賴石油，而我們為了油本交通所付出的成本竟然高達每人每年一萬六千元，但一般民眾卻不容易察覺這個高昂的成本。當燃油車業者抱怨政府好像偏袒電動車時，我們不要忘了，其實我們一直在補貼化石燃料，用我們的健康去補貼化石燃料，健保支出要增加、污染防治費用要增加，正是因為我們漠視使用化石燃料的成本。</p>\n<p>因此，李執行長批評，油電平權是一個糟糕的說法，是一個混淆視聽的話術。油電不可能平權，更不應該平權，若我們要解決種種環境問題，就必然要改變使用化石燃料的習慣。</p>\n<p>\t<strong>電動機車的製程與廢棄</strong><br>\n<p>聽完李執行長的分享後，進入Q&amp;A時間，首先是關於電動機車生命週期中的製程與廢棄，也就是機車使用的前跟後，是否也會對環境造成污染？</p></p>\n<p>陳總監將這個問題拆解為二，一是車身本體的製造和報廢，第二則是電池。就車體的生命周期而言，電動機車與燃油機車的車身製造並沒有太大的差異，但陳總監也不諱言，他們確實還未仔細比較電動機車與燃油機車的碳足跡與污染，不過他們願意在將來和政府討論，如何建立一套機身的回收機制。</p>\n<p>\t就電池使用壽命而言，陳總監解釋，因為gogoro主要採用換電模式，類似共享經濟的概念，透過共享電池其實可以降低人均電池使用數，舉例而言，若是將電池賣給消費者，一個人至少要買兩組電池交替用，但透過共享電池，也許一個人只需要1.2組電池。另外，也因為電池不屬於消費者，而是公司的資產，依照商業邏輯，業者將竭盡所能延長其使用壽命，卻也同時是對環境較友善的，畢竟已經耗用資源做出電池，當然希望可以用久一點。</p>\n<p>而關於電池回收的部分，陳總監延伸同樣的邏輯，因為電池至始至終都為業者所有，業者絕對有很大的動機要好好處理它，像是將電池內的貴金屬回收再利用，或是未來電池達使用年限時，進而發展出具有經濟規模的電池回收產業。</p>\n<p>蔡中岳副執行長（以下簡稱蔡副執行長）也以太陽能板為例，回應電池回收的問題，他提到德國從2000年開始發展太陽光電，但太陽能板的使用年限是20年，也就是今年會有大量的太陽能板退役，而德國政府也在前幾年開始擬定政策因應後續的回收，也就是當使用年限到了，大家就必須認真回應這個問題。</p>\n<p>針對電池問題，趙博士則提醒我們，大家如果很關注電池的污染，那更不要忘記，各地的加油站就是污染台灣地下水的重要污染源，我們每次使用燃油運具，都是在助長這些潛在的污染發生，所以當我們在計算兩者的生命週期污染時，更要注意沒有被計算到的風險。</p>\n<p>趙博士也補充，就電動汽車的碳足跡來看，電池的碳足跡大概佔整個生命周期的20%，並不會因為加上電池就讓電動汽車碳足跡衝高很多。但在電池的資料上，相對於汽車，機車的資料是較少的，像是剛剛提到環保署的研究，其中估算電動機車的電池用量部分是引用美國的資料。也因此，趙博士提醒，Gogoro如果希望成為電動機車的世界龍頭，那很重要的是，Gogoro是否願意提供有關環境方面的數據並和消費者溝通。</p>\n<p>另外，也有觀眾回應，剛剛都在談電車車體、電池的製程、回收等生命週期的問題，那麼照理來說，我們也應該去檢視提煉石油的過程對環境造成的污染，如果真的要將電動機車和燃油機車放在同一個天秤上做比較，那我們在檢視燃油機車的生命週期污染時，確實也有必要考慮石油的污染才公平。</p>\n<p>接下來也有觀眾問道，除了電池本身的污染或碳排之外，充電站本身是否也有污染和碳排？<br>\n<p>&nbsp;<br></p>\n<p>趙博士回應，這個問題類似我們計算手機的碳足跡時，有沒有將製造晶片的機台的碳足跡算進去，然而，因為這個機台可以製造非常多個晶片，如果平攤下來之後，其實對於一台手機的碳足跡貢獻是非常小的，同理，因為電池交換站的充電樁可以讓電池交換非常多次，因此，趙博士表示大家可以不用過於擔心這個問題，反而是電池的電力來源為何是我們最需要關心的。</p></p>\n<p>\t<strong>換電站的設置須具備公益性</strong><br>\n<p>趙博士也提到電池交換站所扮演的另一個非常重要角色：儲能系統。趙博士說，台灣在2025年再生能源要增加到佔整體發電佔比20%，也就是27GW以上，台電估算儲能大概需要590MW，他們目前正在思考這個儲能裝置量要從哪裡來？趙博士笑說，其實台電就應該考慮和Gogoro談合作，Gogoro的電池儲能裝置容量去年初就已經達到330MW，再加上今年也許就已經衝破590MW了。也就是，台電應該要好好思考如何進行部門之間的合作，加速能源轉型。趙博士接著批評，公部門對換電站的設置考量，應該思考如何整合換電站至整體電力系統，也就要考量使用率的問題，而不是單純有設站就好。(編按：趙博士提到的是2019年9月中油決定不再續約，Gogoro只好撤掉位於中彰投地區的14個換電站。)</p></p>\n<p>針對充電站的建置，陳總監也回應，電池交換站其實可以算是公共資產，它的設置必須要符合公益性，所以當公部門在考量如何設置時，應該思考哪一個方案可以滿足最多民眾的使用。</p>\n<p>\t<strong>台灣所掌握的電動機車產業優勢</strong><br>\n<p>蔡副執行長接下來提到，除了剛剛討論電池和車身的製程和廢棄問題，另一個關鍵的問題是，製程端有多少比例是使用國產的原料和技術，是否有需要依賴中國的可能？中岳解釋，其實談運具電動化不只談機車，還有汽車和公車，但是目前公車電動化卡在一個問題，就是製造商和技術端都被中國掌握住，我們擔心會對中國有太多經濟依賴。因此想詢問陳總監，到底電動機車的製程和技術，有多少是台灣所掌握的優勢，甚至是未來可以推廣到整個亞洲地區。</p></p>\n<p>陳總監回應，其實Gogoro全車只有電池芯來自於日本，但是最關鍵的技術其實在於，如何透過電量管理系統的設計，讓一組電池裡96到120顆電池芯的充放電相互搭配，讓整個電池不只安全且生命週期長，而這整個電量管理系統是台灣自己設計出來的。因此，雖然可以進一步思考是否要將電池芯國產化，但陳總監認為，最重要的不是原料是否國產，而是我們是否有辦法創造它的附加價值。</p>\n<p>蔡副執行長也呼應，就像我們希望離岸風電的技術轉移到台灣之後，再讓台灣成為東亞地區的離岸風電輸出國，同理，電動機車產業如果也能將台灣的電動車廠連結起來，一起進軍國際市場，如此一來，發展電動機車產業不只是關乎環境，更是關乎產業發展。</p>\n<p>\t<strong>空污的區域正義問題</strong><br>\n<p>接下來，李執行長將視野從一台機車生命週期的污染，放大至台灣整體空污治理現況。根政提到，目前中南部的空污非常嚴重，這是一個區域正義的問題，我們除了倡議電廠由燃煤轉燃氣、提升再生能源發電佔比等等，其實有一件非常重要的事情該做，就是中央政府應該加碼補助中南部的運具電動化，一方面讓公車電動化，一方面應該加碼補助民眾換購電動機車，讓空污嚴重的地區有較多的補助能盡早汰舊換購電動機車。也因此，根政批評，蘇貞昌院長在運具電動化的政策上不應該退縮，應該要把當初賴清德院長設定的禁售燃油車時程拉回來，另外，環保署更不應該對燃油機車和電動機車有相同汰舊換新補助，這是非常荒謬、不合理的。 (編按: 去年年底不只是蘇院長拿掉了賴前院長設定的禁售燃油車時程目標，環保署更公布於今年開始補助民眾汰舊換購七期燃油機車，且補助金額與汰舊換購電動機車的金額相同。)</p></p>\n<p>趙博士接著補充，目前全台灣的機車有2.57%是電動機車，但是空污重災區縣市的電動機車比例卻是較低的，例如新北只有2.18%、高雄只有2.3%、台中也只有2.5%，最高比例則是桃園。這是一件弔詭的事，理論上電動機車因為用電而產生的污染會集中在電廠附近，但是這些在電廠附近的空污重災區居民，卻沒有妥善利用電動機車可以帶來的減量優勢，反而還幫其他縣市的電動機車使用者承擔了空污，因此，趙博士也認為我們應該好好省思電動機車的補助方式。<br>\n<p>吃到飽方案是否鼓勵民眾騎越多越好？</p></p>\n<p>\t接著，有觀眾提到，Gogoro的騎到飽月租方案，是不是反而鼓勵大家多騎一點，而可能對環境造成更多負擔？是否有將電池系統維護費用與騎乘里數費用分開計算的可能？</p>\n<p>陳總監回應，目前確實有一個自由省方案是將基本設施維護費用和里程費分開計算。另外，從數據統計來看，Gogoro的車主每月的里程數和交通部公布的人均每月里程數400至600公里是差不多的，並沒有因為騎到飽方案使得里程數上升的情形。而Gogoro在設定資費時，一方面要考量換電站建置和維護成本的攤提，一方面考量消費者的使用情境。因此，資費這樣設計倒不是要鼓勵消費者騎更多，而是要讓台灣的消費者更方便。&nbsp;</p>\n<p>\t<strong>不同運具電動化的的效益比較</strong><br>\n<p>另外中岳也請教趙博士，機車和汽車的電動化、哪一個優先處理的公共效益是比較高的？</p></p>\n<p>趙博士說明，其實兩者的推動邏輯與項目都非常不一樣，首先，電動汽車的售價部分，無論政府給多少購車補助，都不太可能把價差壓很低(編按: 但是電動機車透過補助確實能夠讓它和燃油機車售價差不多)，而在推動項目上，汽車部分必須要先健全充電樁的設置，當進口的電動汽車價格開始降低，國內充電樁的基礎建設也同時成熟，汽車電動化馬上就可以上路了，然而目前各部會都在逃避責任，沒有部會願意扛起廣設充電樁的責任。</p>\n<p>談到機車和汽車的電動化誰應該先行，趙博士認為，確實目前機車的技術可行性是較高的。不過更重要的是，我們推動電動機車的同時，其實就是在建構民眾對於能源轉型的信心，就是向民眾證明我們可以有更環保的商業模式，就像先前汰換工業鍋爐，也是宣示我們可以做到低污染的工業製程。因此相對的，我們任何在政策上的退卻，也會對能源轉型有長期不利的影響。</p>\n<p>蔡副執行長也補充，工研院有份研究在比較公車、汽車、機車電動化的效益，研究顯示機車電動化的效益最大，因為一方面電動機車技術相對成熟、價格能壓低，二方面是空污和碳排的減幅很大。</p>\n<p>\t<strong>結語</strong><br>\n<p>經過林林總總的討論，終於來到講座的尾聲，三位講者分別以簡短幾句話，道出我們應付的責任、應有的省思，以及如何想像不同於舊有體系的未來。<br></p>\n<p>趙博士強調，油電平權的戰場上，沒有人可以當局外人，如果我們願意一起去面對我們為了燃油運具所付出的外部成本，就必須好好思考，如何反抗油電平權這樣的論述，並重新拿回運具電動化的政策目標，這就是我們接下來的責任。</p></p>\n<p>\t陳總監重申，每個購車決定都將影響未來的環境十到十五年，我們如何把眼光放遠，去做一個對環境負荷較少的選擇。&nbsp;<br>\n<p>李執行長從疫情後交通旅運下降讓空氣變乾淨來切入，直問難道只有讓世界停止運轉，才能改善環境嗎？還是我們願意去改善交通模式和產業模式呢？他語重心長地說，其實我們別無選擇，人還是要過活、要有經濟活動，問題在於，我們要什麼樣的經濟活動和交通模式，我們要選擇更低碳的模式還是維持一個舊有的體系？</p></p>\n<p>\n<p>完整演講資訊請上：<a href=\"https://www.cet-taiwan.org/events/3718\">5/26電動車真的比較環保嗎？</a><br></p>\n<p>此篇（上）文請上：<a href=\"https://www.cet-taiwan.org/info/story/3749\"><strong>【講座紀錄】電動車真的比較環保嗎？（上）</strong></a><br></p>\n<p>&nbsp;</p></p>"}, {"nid": 3751, "title": "車輛電動化政策倒退走？破解「油電平權」假議題", "original_topic": "空氣污染;抗暖減碳", "adopted_cats": ["爭取乾淨空氣", "氣候變遷與調適"], "content": "<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713-053_0.jpg\"><br>\n<p><span>（何俊彥攝）</span></p></p>\n<p>\t<a href=\"https://opinion.udn.com/opinion/tag/%E5%8F%B0%E4%B8%AD\">台中火力發電廠</a>（中火）爭議持續延燒，台中市府「戰中火」卻補助燃油<a href=\"https://opinion.udn.com/opinion/tag/%E6%A9%9F%E8%BB%8A\">機車</a>的矛盾政策，已在<a href=\"https://opinion.udn.com/opinion/story/7854/4671873\">前文</a>詳細闡述。台中市府看似展現空汙治理決心，卻可能拖慢台灣整體減煤、減空汙的進程。如果有改善空汙的決心，不應只對中火開刀，其他工業源也要好好管，更應看重交通運具政策，因此本文將比較電動車與燃油車的空汙碳排量，分析未來可行的政策方向。</p>\n<p>根據最新版的<a href=\"https://teds.epa.gov.tw/TEDS_10_0.aspx\">環保署空氣汙染排放清冊</a>，台中市<a href=\"https://opinion.udn.com/opinion/tag/PM2.5\">PM2.5</a>約有35.7%來自工業源，當中約有10.8%來自電力業排放，車輛排放則佔約25.9%。從此數據來看，若要降低整體空汙量，不僅應從工業源下手，更應加強管制交通源，多管齊下才有助於改善空汙。</p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713-051_0.png\"><br>\n<p><span>台中市PM2.5汙染源佔比圖。 資料來源／環保署空氣汙染排放清冊</span></p></p>\n<p>若要從交通源下手改善空汙，國際共通作法不外乎這三種：一、減少民眾旅運需求，二、提升大眾運輸運量，三、推廣運具電動化。而這三者在優先次序上也以前兩者為優先，是目前較多人積極倡議的主軸。但交通運輸的減碳，最難的地方在於必須改變個人移動習慣，且台灣大眾運輸除大台北地區，稱不上是便利，民眾仍有使用私人運具的需求。</p>\n<p>此外，由於汽機車與身體會近距離接觸，對於健康的影響也不容忽視。根據環保署臺北都會區通勤期間之空氣汙染物暴露量<a href=\"https://enews.epa.gov.tw/Page/3B3C62C78849F32F/2650cb9c-feaa-4a42-8be5-cd13b0895104\">調查</a>，機車族所暴露的PM2.5汙染，最嚴重時接近紫爆等級。而就算是走路、騎腳踏車或搭乘大眾運輸，也會在移動中吸入大量汽機車所排放的汙染物。因此，積極推動私人運具電動化，也是政府該務實推出的交通政策。</p>\n<h3>走倒退路的交通運具政策</h3>\n<p><a href=\"https://www.ey.gov.tw/Page/4EC2394BE4EE9DD0/f449f839-6e2f-4677-b87b-06948c781b87\">台灣運具電動化政策</a>曾在2017年時任行政院長賴清德的指示下，經行政院院會同意，訂定具體且可行的目標：2030年公務車輛及公車全面電動化；2035年機車全面電動化（禁售燃油機車），以及2040年汽車全面電動化（禁售燃油汽車）。</p>\n<p>然而，此政策卻在燃油車業者大力反彈的情況下大幅轉彎，現任院長蘇貞昌上台後，於2019年撤銷了禁售燃油汽機車的目標。環保署也於今年開始利用空氣汙染防制基金，補助民眾汰舊換購七期燃油機車，補助金額甚至與汰舊換購電動機車相同，堪稱全世界唯一還有在補助燃油機車的國家。</p>\n<p>環保署此舉也影響了各縣市政府的補助政策，包含桃園市、新竹市、南投縣、台中市、彰化縣、雲林縣、嘉義縣、嘉義市、台南市、高雄市、宜蘭縣、花蓮縣、金門縣、連江縣等縣市，竟都利用空汙基金補助民眾購買燃油機車，其中不乏位於空汙重災區的縣市。</p>\n<p>不只如此，前台中市副市長楊瓊瓔在擔任立委時，竟以鼓勵民眾購買七期燃油機車有助於改善空汙為由，於立院推動「貨物稅條例修正法案」，企圖提高免徵貨物稅金額。可見無論是中央還是地方政府，這幾年都大走「反空汙」的倒退路。</p>\n<h3>燃油車與電動車的空汙排放量差異</h3>\n<p>行政院、環保署與部分縣市政府，竟屈服於燃油車業者所喊出的「油電平權」荒謬口號，這樣的政策轉彎可謂大錯特錯。不管是空氣汙染量還是溫室氣體（如下表所示），燃油運具的排放量都遠高於電動運具。</p>\n<p>若我們仔細解析下表的空汙與碳排比較表，雖然七期燃油機車相比於四期燃油機車已經「乾淨」許多，但是與電動機車比較還是相差甚遠。更重要的是，燃油機車的汙染排放量僅計入尾氣排放，並未計入汽油經過製造及運輸所造成的碳排與空汙，反觀電動機車的汙染排放量，不僅計算發電過程所造成的汙染，也考量輸電耗損。</p>\n<p>也就是說，即便使用對電動機車較為不公平的計算方式，電動機車的汙染量還是遠低於燃油機車，特別是在機車排放的主要汙染物「揮發性有機物（以NMHC為指標）」的表現上，燃油機車的排放量是電動機車的百倍以上。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713-050.png\"><br>\n<p><span>表／燃油機車與電動機車空汙量與碳排量比較。資料來源／環保署TEDS10線源排放量，環保署移動汙染源空氣汙染物排放標準第6條表列，環保署機車合格證清冊，環保署委外報告「107年移動汙染源排放總量推估及管制措施研擬專案工作計畫」，環保署綠色車輛指南網。</span></p></p>\n<p><span></span>既然兩者汙染量有大幅差距，當然不可能要求兩者享有相同購車補助，也因此燃油車業者所喊出的「油電平權」不過是話術。如果中央與地方政府有決心要徹底解決交通端的空汙問題，就應站穩運具電動化的腳步，持續補助民眾購買電動運具，而非回頭補助燃油運具。</p>\n<h3>如何降低電動車電池帶來的汙染？</h3>\n<p>除了評估運具使用過程所產生的汙染，也應思考電池製程及回收造成環境汙染的疑慮。</p>\n<p>根據國際能源總署<a href=\"https://www.iea.org/reports/global-ev-outlook-2020\">2020的電動車報告</a>（Global EV Outlook 2020），隨著各國逐漸發展再生能源，電動運具所使用的電力將會越來越低碳。同時這也表示，電池製造與回收在整個電動運具生命週期的碳足跡比例將逐漸提高，因此降低製程汙染正是大量資金投入研發的關鍵。</p>\n<p>以目前的技術，電池材料包含鈷、鎳的開採，都可能造成二氧化硫排放，而回收電池中的鋰金屬也需要土地與水資源。因此，加強電池材料的循環利用，以減少開採材料以及製程對環境造成的汙染，是電動運具必須面對的重大挑戰。</p>\n<p>針對電池的再利用，根據上述報告，當電池效率下降為原來的八成左右，就要逐步退役，並規劃二次使用，如此將有利於減少電池生命週期的整體碳足跡。常見的電池再利用案例，包含用來儲存電網發出的多餘電力，或是與太陽能板做充放電搭配。而國際上各大車廠也正在積極研發，將電池中的關鍵材料進行電池回收再製。</p>\n<p>不過，由於電池最終需面臨退役，因此各國也開始訂定電池廢棄處理法規，包含歐盟、美國、中國等，都在近幾年積極推動相關法制，跟上<a href=\"https://opinion.udn.com/opinion/tag/%E8%83%BD%E6%BA%90%E8%BD%89%E5%9E%8B\">能源轉型</a>的腳步。台灣在推動運具電動化之際，也應盡速建立相關規範。</p>\n<p>同樣的問題在燃油車的製造上都有類似疑慮，但新科技的研發就是為了減緩環境汙染，所以即使是小問題，也應該改善。例如太陽能板製程中的削切液、矽晶曾經是環境問題，但隨著循環經濟的研發，現在已經能全部回收重複使用。</p>\n<p>\t核能發電的核廢料在開始使用核能時，就知道難處理，但60多年來的研發始終沒辦法找到便宜且低成本的處置方式，因為核研發的緩慢且難突破，而使得全球在投資太陽光電與核電上出現巨大落差。科技在使用時，若在過程中不斷解決新舊問題，而無法處理好關鍵問題，終將成為逐漸被淘汰的選項。電池的問題雖然尚未解決，但處理技術已逐漸有明確方向，且全球都已經朝向不可逆的運具電動化前進，這正是我們要持續督促，使電動車更環保的重要關鍵。</p>\n<p>\t<img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713-057_0.jpg\"><br>\n<p><span>WeMo Scooter電動機車租用。</span><a href=\"https://commons.wikimedia.org/wiki/File:Kymco_WeMo_QAN-0388_20171209b.jpg\"><span>圖片來源</span></a></p></p>\n<h3>運具電動化的電從哪裡來？</h3>\n<p>運具電動化所需考量的前提之一，即是「電從哪裡來」？若我們將燃油運具都換成電動運具，是否會大量耗電？針對此疑慮，工研院在相關研究1指出，台灣目前近1,400萬台機車中，僅不到十分之一是電動車，若考量最極端情境，一夕之間全台燃油機車都換成電動機車，需增加16億度電左右，大約是2019年總體用電量的0.7%。</p>\n<p>若改為2035年禁售燃油機車的情境，該研究根據人口成長等因素推估，未來電動機車累計數量至2035年約為930萬輛，需電量增加9.5億，約佔2019年總體用電量的0.4%。也就是說，運具電動化並不需要大幅增加用電量，更重要的是，電動機車若可把握離峰時間充電，還能夠平衡離尖峰電力使用，意即電動機車的換電站、充電站，將可作為大型分散式儲能系統。</p>\n<h3>加速能源轉型，避免加深區域環境不正義</h3>\n<p>另也有質疑，雖然使用電動運具減少了原有燃油運具的空氣汙染，卻會因為增加用電，而將空氣汙染轉嫁給住在電廠周圍的人，進而加深區域的環境不正義。</p>\n<p>這是全台發電、用電都必須正視的問題，針對此疑慮的最佳解方就是加速能源轉型，提升再生能源的發電佔比，讓電動機車所使用的電越來越「乾淨」，才不會因為運具電動化而加重了原有的區域空汙不正義。另根據近日公告的2019電力排碳係數2，台灣從2018年的0.533，降至0.509，是史上降幅最高的一次。這個趨勢是減煤的證明，也說明運具電動化的電將越來越乾淨。</p>\n<h3>運具電動化政策需有公正轉型配套</h3>\n<p>在運具電動化的過程中，必然有人的工作權會受影響，對此，政府應該積極輔導油車業者轉型，並照顧整個機車產業鍊上下游勞工，特別是在此過程中受影響的機車維修行，更應給予充足的時間轉型並學習新技能。</p>\n<p>也因此，原有的政策目標並非過於躁進，2035年禁售燃油機車是合理的年份。若以機車壽命平均十年以上來看，2035年前售出的機車至少可以使用到2045年，這代表燃油機車行至少還可以持續經營25年，也就是今年40歲以上的機車行員工可以安心工作到退休，但是40歲以下的員工必須開始學習新技能。</p>\n<p>產業需要升級，而整個社會也需要隨著趨勢共同成長。經濟部已協同各部會、各機車廠及工會，推動機車行升級轉型輔導，於去年開授第一階段油電車維修輔導課程，共計一萬多人次的機車行員工參與。接下來，更需要民眾共同監督經濟部下一階段的轉型輔導規劃。</p>\n<h3>運輸部門的減碳排與降空汙，最大責任在交通部</h3>\n<p>環保署利用空汙基金的機車汰舊換購補助政策固然該受到批評，然而補助僅是運具電動化整體政策的一環，且2022年環保署即停止補助政策。很顯然的，這件事的中央主管機關應為交通部而非環保署，交通部應負起運輸部門減碳排與降空汙的最大責任。交通部在今年剛出版的《運輸政策白皮書》綠運輸篇章中提到，「應獎勵、補助電動機車，擴大使用誘因、帶動相關產業發展」等對運具電動化的想像，但這樣的口號是否能實現，更需要民眾一齊監督。</p>\n<p>此外，環保署將協同各部會推動第二階段溫室氣體排放管制行動方案，以達成全國第二階段溫室氣體減量目標3，我們期待交通部能在其主責的運輸部門溫室氣體排放管制行動方案中，不只納入禁售燃油運具目標時程，更對運具電動化有完整的政策規劃。</p>\n<p>台大風險中心趙家緯博士曾經計算，若運輸部門要達成第二階段溫室氣體減量目標，且不同運具按照碳排比例分攤減碳責任，那麼機車到2025年要減碳155萬噸，若要以運具電動化來減量，到時候全台灣就必須有500萬輛以上的電動機車。這意味著2025年每三台機車至少有一台要是電動機車，也代表接下來幾年的新售機車至少要有七成以上是電動機車才可以。由此可知，運具以減碳、減空汙為方向，走向電動化已勢不可擋。</p>\n<p><img alt src=\"https://www.cet-taiwan.org/sites/cet-taiwan.org/files/u147/20200713-056.jpg\"><br>\n<p><span>圖片來源：</span><a href=\"https://zh.wikipedia.org/wiki/File:091-FV_%E6%A1%83%E5%9C%92%E5%AE%A2%E9%81%8B%E9%9B%BB%E5%8B%95%E5%B7%B4%E5%A3%AB%E4%BD%8E%E5%9C%B0%E6%9D%BF%E5%85%AC%E8%BB%8A.jpg\"><span>維基百科</span></a></p></p>\n<h3>小結</h3>\n<p>國際上許多國家已紛紛訂定禁售燃油車期程，挪威將在2025年禁售燃油車，德國和荷蘭也將於2030年禁售燃油車，除了加碼補助民眾購買電動車，更給予電動車免貨物稅、減免道路規費、減免停車費等優惠。</p>\n<p>荷蘭甚至從今年開始，祭出12年以上高碳排燃油車的汽油稅稅率每年增加1%的規定，提高民眾換購電動車的誘因。而擁有將近兩億台機車的印度，也預計在2026年禁售燃油機車與三輪車。台灣也應該盡速訂定禁售燃油車期程，並完整規畫相關公正轉型配套政策。</p>\n<p>空汙治理是全台灣最有共識的議題之一，沒有人應該是空汙的受害者。除了運輸與環境部門，行政院在疫情後推出的產業振興方案，更應響應國際提倡的綠色振興，納入綠色運輸的規劃，以減少民眾旅運需求、提升大眾運輸運量以及推廣運具電動化為目標，達成振興經濟、控制碳排的平衡，同時給人民乾淨的天空。</p>\n<p><hr></p>\n<p>（※ 本文與地球公民基金會研究員楊書容共同撰寫，部分內容感謝台大風險中心趙家緯博士提供資料。）<br>\n<p>（本文為 2020/7/13&nbsp;鳴人堂投書｜<a href=\"https://opinion.udn.com/opinion/story/7854/4692508?fbclid=IwAR0ploQ4rZNQX920vPG3sQt1W418NA86CM7mP24Qce2WlS73SyGcyPkOTKI\">電動車污染小，破解油電平權假議題</a>）</p></p>\n<p><hr></p>\n<p>註：</p>\n<p>1：工業技術研究院委託財團法人台達電子文教基金會「<a href=\"https://www.airitilibrary.com/Publication/alPublicationProceeding?PublicationID=P20200210002\">108年度電動車導入V2G對電力供需影響評估</a>」結案報告。<br>\n<p>2：電力排放係數是指全國平均每發一度電會產生多少公斤二氧化碳。詳細計算方式請見<a href=\"https://www.moeaboe.gov.tw/ECW/populace/content/SubMenu.aspx?menu_id=114\">經濟部能源局108年度電力排放係數</a>。<br></p>\n<p>3：第一階段執行期程為2016年至2020年，目標為全國碳排量相對於2005年減少2%；第二階段執行期程為2021年至2025年，目標為全國碳排量相對於2005年減少10%。更多詳細資訊請見<a href=\"https://www.climatetalks.tw/\">環保署氣候公民對話平台</a>。</p></p>"}, {"nid": 3752, "title": "三倍券抵稅做公益 守護台灣環境", "original_topi
